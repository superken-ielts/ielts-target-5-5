[project]
name = "book-ingest"
version = "0.1.0"
description = "Agent nhập sách: biến PDF + audio của một giáo trình thành book.json và plan.json cho app học"
requires-python = ">=3.10"
dependencies = [
  "pymupdf>=1.24",
  "pyyaml>=6",
  "pydantic>=2.6",
  "mutagen>=1.47",
]

[project.optional-dependencies]
ocr = ["rapidocr-onnxruntime>=1.3", "numpy"]
llm = ["anthropic"]
review = ["streamlit>=1.30"]
dev = ["pytest>=8", "jsonschema>=4"]

[project.scripts]
book = "book_ingest.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["book_ingest*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
