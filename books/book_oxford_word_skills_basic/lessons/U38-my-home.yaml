# Video Oxford Word Skills Basic · Unit 38 — I can talk about my home (sách in tr. 98–99, Answer key tr. 214).
# UNIT KHÓ (đợt 40): 2 trang, hai phần — căn hộ trong tòa nhà (tầng, cầu thang, thang máy, ban công…) và nhà riêng (phòng, sơ đồ,
# quảng cáo nhà, flat / house / home); "your home" là chủ đề IELTS Part 1–2 hay gặp, và thuê nhà là chủ đề thư GT Task 1 — video
# khoảng 13 phút: phần sách, rồi nhà ở Việt Nam, câu khi thuê nhà, ÔN TẬP (lỗi hay gặp, tự kiểm tra tranh tòa nhà) và LUYỆN NÓI CHUNG (Part 2 "a home
# you like", hai bài mẫu; ba câu thảo luận kiểu Part 3). Khuôn: file 09 mục 5.2. Không `wait` / `echo`; không khoảng lặng từ 3 giây
# (câu cuối cảnh tự trả lời `pause: 1.0`). Không có cảnh "Nghe và viết": unit có video nghe – viết riêng.
# Bài trong sách: đủ 1–6. Bài 1, 2, 4, 5 theo Answer key tr. 214. Bài 3 (Test yourself): hai cảnh tranh tòa nhà, đáp án hiện thành
# nhãn khi Tom trả lời (phần ôn tập). Bài 6 (ABOUT YOU): Tom và Emma trả lời (cảnh Nói 1).
# Hình trong sách: tranh tòa nhà (hai cảnh: nửa trên, nửa dưới; khung theo số), lời kể, sơ đồ nhà Bathford (khung theo phòng),
# quảng cáo (khung theo dòng), Glossary (hai cảnh), Spotlight flat, house and home — đo bằng máy.
# Chi tiết nhân vật (khớp file 06 mục 9.4, file 09 mục 5.7): Tom ở chung căn hộ nhỏ gần trường với hai bạn (hồ sơ), không có phòng yêu
# thích vì căn hộ quá nhỏ (IELTS U01), hiệu thuốc dưới căn hộ (U23), trạm xe buýt trước hiệu thuốc (U29), thỉnh thoảng đi xe máy (U32);
# nhà ở Đà Lạt trên đồi nhìn xuống thung lũng (U36), bếp ấm cúng là phòng yêu thích (IELTS U01), ông trồng rau trong vườn (hồ sơ).
# Emma ở căn hộ nhỏ tầng 8, ban công trồng rau thơm và cà chua, hàng xóm là cụ bà sống một mình (IELTS U01), bếp luôn bừa sau khi nấu
# (U14), từ ban công thấy nhà cao tầng (U36), không đi xe máy (hồ sơ). Mới: căn hộ của Tom ở tầng ba, không có thang máy, ba phòng ngủ
# nhỏ, bếp nhỏ, phòng tắm, phòng khách rất nhỏ, chỗ để xe máy ở tầng trệt; nhà ở Đà Lạt hai tầng (tầng dưới: bếp lớn, phòng khách, phòng
# của ông; tầng trên: ba phòng ngủ, phòng tắm). Căn hộ của Emma: phòng khách, phòng ngủ, bếp nhỏ, phòng tắm; tòa nhà có thang máy, chỗ
# để xe ở tầng hầm; ban đêm nhìn đèn thành phố.
