      - {tom: "Khoa, usually. But for family problems, I ask my sister Hoa. She always gives me good advice.", say: "Kwah, usually. But for family problems, I ask my sister Whah. She always gives me good advice.", reveal: 7, vi: "Thường là Khoa; chuyện gia đình thì hỏi chị Hoa — chị luôn khuyên đúng."}
      - {emma: "How long have your parents been married, Tom?", focus: 8}
      - {tom: "Twenty-eight years. They got married in nineteen ninety-eight, and they still get on really well.", reveal: 8, vi: "28 năm: cưới năm 1998, đến giờ vẫn rất hòa thuận."}

