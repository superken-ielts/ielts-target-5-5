  - kind: qa
    chapter: "Nói 1: bạn thân"
    heading: "Speaking 1 · IELTS Part 1 topic: friends"
    heading_vi: "Bài 4 trong sách (ABOUT YOU) — tạm dừng sau mỗi câu hỏi để tự trả lời"
    items:
      - q: "Who is your closest friend?"
        a: "Khoa. We've been friends since primary school."
        ask: emma
        by: tom
        phrases: ["We've been friends since…"]
      - q: "How long have you known him?"
        a: "About fourteen years. We sat next to each other in our first year at school!"
        ask: emma
        by: tom
        phrases: ["About … years", "sat next to each other"]
      - q: "How often do you see each other?"
        a: "Not very often now. He studies medicine in Hanoi, so we only see each other at Tet. But we chat online almost every day."
        ask: emma
        by: tom
        phrases: ["Not very often now.", "only see each other at…", "almost every day"]
      - q: "Why do you get on well with him?"
        a: "Because he's funny and kind, and he always listens. We're always honest with each other, and when I have a problem, he's the first person I call."
        ask: emma
        by: tom
        phrases: ["Because he's…", "honest with each other", "the first person I call"]
      - q: "And your closest friend, Emma?"
        a: "Lucy. We were neighbours, and we've known each other since we were five. She lives in Bristol now, so we have a video call once a month."
        ask: tom
        by: emma
        phrases: ["We were neighbours", "since we were five", "once a month"]
      - q: "Do you get on well with your flatmates?"
        a: "Yes, very well. We share the cooking and the cleaning, so there are no problems. Well, not many!"
        ask: emma
        by: tom
        phrases: ["Yes, very well.", "We share…", "not many"]
      - q: "How did your parents meet, Emma?"
        a: "At a friend's wedding, when they were twenty-seven. They got to know each other on the dance floor, and they've been together for thirty-five years."
        ask: tom
        by: emma
        phrases: ["At a friend's wedding", "got to know each other", "they've been together for…"]
      - q: "Who do you ask for advice?"
        a: "Khoa, usually. But for family problems, I ask my sister Hoa. She always gives me good advice."
        ask: emma
        by: tom
        phrases: ["…, usually.", "for family problems", "gives me good advice"]
      - q: "How long have your parents been married, Tom?"
        a: "Twenty-eight years. They got married in nineteen ninety-eight, and they still get on really well."
        ask: emma
        by: tom
        phrases: ["… years", "They got married in…", "still get on"]
