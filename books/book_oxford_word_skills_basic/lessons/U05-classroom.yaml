  - kind: qa
    chapter: "Nói 1: túi xách và việc viết"
    heading: "Speaking 1 · IELTS Part 1 topics: bags, pens and writing"
    heading_vi: "Tạm dừng sau mỗi câu hỏi để tự trả lời, rồi nghe câu mẫu"
    items:
      - q: "Do you usually carry a bag?"
        a: "Yes, always. I carry a backpack to university every day. It's very heavy!"
        ask: emma
        by: tom
        phrases: ["Yes, always.", "I carry…", "every day"]
      - q: "What do you usually keep in your bag?"
        a: "Lots of things! Board pens, a folder with worksheets, my laptop, a bottle of water, and a small notebook for new Vietnamese words."
        ask: tom
        by: emma
        phrases: ["Lots of things!", "a folder with…", "a notebook for…"]
      - q: "What's in your bag today?"
        a: "My laptop, a notebook, two pens, my phone and a water bottle. Oh, and my IELTS book, of course!"
        ask: emma
        by: tom
        phrases: ["two pens", "a water bottle", "…, of course"]
      - q: "Do you prefer writing with a pen or a pencil?"
        a: "A pen, usually. But I write new Vietnamese words in pencil, because I often make mistakes with the accents!"
        ask: tom
        by: emma
        phrases: ["…, usually", "in pencil", "make mistakes"]
      - q: "Do you write by hand, or do you type?"
        a: "In lectures I type on my laptop, because it's faster. But I practise IELTS writing by hand. It's slower, but I remember more."
        ask: emma
        by: tom
        phrases: ["because it's faster", "by hand", "It's slower, but…"]
      - q: "Do you use a dictionary?"
        a: "Yes, an app on my phone. At school I had a big paper French dictionary. It was really heavy!"
        ask: tom
        by: emma
        phrases: ["an app on my phone", "At school I had…", "really heavy"]
      - q: "What do you do with new words?"
        a: "I look them up in a dictionary app, write them in my notebook, and then I put them in Anki. I review them every evening."
        ask: emma
        by: tom
        phrases: ["look them up", "write them in…", "review them"]
      - q: "What was your classroom like at school?"
        a: "It was big, with about forty students. We had a blackboard, and the teachers wrote on it with chalk. There was a noticeboard at the back."
        ask: emma
        by: tom
        phrases: ["It was big", "We had…", "There was…"]
      - q: "And what's your classroom like now?"
        a: "It's small and bright, with a whiteboard, a big screen for videos and twelve chairs. And lots of board pens, of course!"
        ask: tom
        by: emma
        phrases: ["small and bright", "with a…", "lots of…"]
