# Video Oxford Word Skills Basic · Unit 5 — I can use classroom vocabulary (sách in tr. 20, Answer key tr. 206).
# Khuôn video: docs/agent-hoc-tap/09-oxford-word-skills-basic.md mục 5 (7–10 phút, không đếm ngược, 1–2 phần nói, nghe và viết).
# Đáp án bài 1–3 theo Answer key; bài 3 (ABOUT YOU) đọc câu mẫu "Answers from an Argentinian person" rồi Tom tự trả lời.
# Thêm ngoài sách: rubber = eraser (Anh – Mỹ), a piece of paper, mượn đồ (borrow / lend), đoán đồ vật qua mô tả
# ("It's a thing you use to…" — mẹo khi quên từ lúc thi nói), chủ đề nói IELTS Part 1
# "Bags" và "Pens / handwriting". Chi tiết nhân vật mới: Tom đeo ba lô, gõ bài giảng trên laptop nhưng luyện viết IELTS
# bằng tay, tra từ bằng app rồi chép vào Anki, lớp hồi phổ thông khoảng 40 học sinh có bảng đen; Emma ghi từ tiếng Việt
# bằng bút chì (hay sai dấu), hồi đi học có từ điển tiếng Pháp bằng giấy, lớp hiện tại nhỏ, có màn hình lớn và 12 ghế.
