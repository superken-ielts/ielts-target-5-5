# Video Oxford Word Skills Basic · Unit 10 — I can talk about my family (sách in tr. 28–29, Answer key tr. 206–207).
# UNIT KHÓ (đợt 29): video dài tới khoảng 15 phút — sau phần sách có ÔN TẬP (lỗi hay gặp, câu đố "ai là ai") và LUYỆN NÓI
# CHUNG theo chủ đề (Part 2 "a family member you spend a lot of time with" + vài câu kiểu Part 3). Khuôn: docs/agent-hoc-tap/
# 09-oxford-word-skills-basic.md mục 5.2 (unit khó). Không đếm ngược: không `wait` / `echo`.
# Đáp án bài 1, 2, 5, 6 theo Answer key; bài 7 (ABOUT YOU) là phần nói. Đoạn "Family history" của Damon kể lại ngắn gọn.
# Thêm ngoài sách: một từ tiếng Anh ứng với nhiều cách xưng hô tiếng Việt (uncle, aunt, cousin, nephew, niece…).
# Hình trong sách (đợt 29): sơ đồ gia đình Damon tr. 28 (cảnh figure, khung đỏ theo người đang nói tới).
# Part 2 có hai bài mẫu cùng thẻ đề: Tom kể về chị Hoa, Emma kể về anh Jack (khớp U01-speaking-practice: hơn hai tuổi,
# cùng óc hài hước, gửi video vui cho nhau).
# Chi tiết nhân vật mới (giữ khớp file 06 mục 9.4 và file 09 mục 5.7): nhà Tom 6 người (ông 78 tuổi, bố mẹ cưới năm 1998,
# chị Hoa 26 tuổi — y tá ở Hà Nội, em Bao 15 tuổi mê bóng đá, Tom); Tom gọi điện cho chị Hoa gần như mỗi tối; nhà Emma 4 người
# (bố mẹ 62 tuổi, sang năm nghỉ hưu; anh Jack 30 tuổi), Emma gọi video cho mẹ mỗi Chủ nhật, nhắn tin với Jack gần như mỗi
# ngày, Giáng sinh về nhà đi bộ ven biển cùng Jack; bà Emma sống gần bố mẹ Emma.
# Dựng: cd agents && python -m lesson_video build ../books/book_oxford_word_skills_basic/lessons/U10-family.yaml
id: U10-family
activity: U10-words
title: "Unit 10 · My family"
subtitle: "I can talk about my family"
title_vi: "Gia đình và họ hàng (uncle, cousin, nephew, in-law…); được sinh ra, kết hôn; ai lớn tuổi hơn — kèm ôn tập và luyện nói chủ đề gia đình"
tag: "PEOPLE · UNIT 10"
speakers:
  # giọng theo bộ đọc: kokoro (mặc định khi có model) hoặc flite (dự phòng, có sẵn trên Ubuntu)
  emma: {name: Emma, role: teacher, color: "#C8102E", voice: {kokoro: af_heart, flite: slt}}
  tom: {name: Tom, role: student, color: "#1F5FAD", voice: {kokoro: am_michael, flite: rms}}

scenes:
  - kind: title
    chapter: "Giới thiệu"
    lines:
      - emma: "Welcome to Unit 10: my family. Family is the most common topic in part one of the IELTS speaking test. So this video is longer: after the book, we review the words, and then we practise speaking about your family."
        say: "Welcome to Unit ten: my family. Family is the most common topic in part one of the eye-elts speaking test. So this video is longer: after the book, we review the words, and then we practise speaking about your family."
        vi: "Unit 10: gia đình — chủ đề hay gặp nhất ở Part 1. Video dài hơn: học sách, ôn tập, rồi luyện nói."
      - tom: "And there's no countdown. Pause the video whenever you want to answer."
        vi: "Không đếm ngược: tự tạm dừng video khi muốn trả lời."

