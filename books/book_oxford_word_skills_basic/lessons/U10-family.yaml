  - kind: qa
    chapter: "Luyện nói chung: thảo luận"
    heading: "Discussion · families in Vietnam and in England"
    heading_vi: "Câu hỏi kiểu Part 3: trả lời bằng ý kiến + lý do + ví dụ"
    items:
      - q: "Do families in Vietnam usually live together?"
        a: "Many do. In my family, three generations live in the same house: my grandfather, my parents and my brother. It's normal in Vietnam."
        ask: emma
        by: tom
        phrases: ["Many do.", "three generations", "It's normal in…"]
      - q: "Is it the same in England?"
        a: "Not usually. Young people often leave home at about eighteen, to go to university or to work, and older people often live on their own."
        ask: tom
        by: emma
        phrases: ["Not usually.", "leave home", "live on their own"]
      - q: "Who should look after older people: the family or the government?"
        a: "Both, I think. The family should help as much as possible, but the government should help too, with nurses and care homes. My grandmother lives near my parents, so they visit her every day."
        ask: tom
        by: emma
        phrases: ["Both, I think.", "should help as much as possible", "so they…"]
      - q: "Which is better, do you think?"
        a: "Both have good points. A big family home is never lonely, but a small home gives you more freedom. For me, the best thing is to live near your family."
        ask: emma
        by: tom
        phrases: ["Both have good points.", "…, but…", "For me, the best thing is…"]
