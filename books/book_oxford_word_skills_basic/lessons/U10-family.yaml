  - kind: qa
    chapter: "Nói 1: gia đình bạn"
    heading: "Speaking 1 · IELTS Part 1 topic: family"
    heading_vi: "Tạm dừng sau mỗi câu hỏi để tự trả lời, rồi nghe câu mẫu"
    items:
      - q: "How many people are there in your family?"
        a: "There are six of us: my grandfather, my parents, my older sister, my younger brother and me."
        ask: emma
        by: tom
        phrases: ["There are six of us:", "my older sister", "my younger brother"]
      - q: "And in your family, Emma?"
        a: "There are four of us: my mum, my dad, my brother Jack and me. But I've got lots of cousins!"
        ask: tom
        by: emma
        phrases: ["There are four of us", "lots of cousins"]
      - q: "When were you born?"
        a: "In two thousand and six, on the ninth of March."
        ask: emma
        by: tom
        phrases: ["I was born in…", "on the ninth of March"]
      - q: "Is your brother older or younger than you?"
        a: "He's two years older than me. He's thirty, and he's a sound engineer in London."
        ask: tom
        by: emma
        phrases: ["two years older than me", "He's thirty"]
      - q: "Who's the oldest in your family?"
        a: "My grandfather. He's seventy-eight, and he still works in his vegetable garden every morning."
        ask: emma
        by: tom
        phrases: ["the oldest in my family", "He's seventy-eight", "still"]
      - q: "Do you all live together?"
        a: "Not now. My family lives in Da Lat, my sister lives in Hanoi, and I share a flat here in Ho Chi Minh City."
        ask: emma
        by: tom
        phrases: ["Not now.", "My family lives in…", "I share a flat"]
      - q: "Who do you spend a lot of time with, Emma?"
        a: "My mum, on video calls! We talk every Sunday. And at Christmas, the whole family meets at my grandmother's house."
        ask: tom
        by: emma
        phrases: ["on video calls", "every Sunday", "the whole family"]
      - q: "Are your parents still working?"
        a: "Yes, but not for long. They're both sixty-two, and they're going to retire next year."
        ask: tom
        by: emma
        phrases: ["not for long", "They're both…", "going to retire"]
      - q: "Are you closer to your sister or your brother?"
        a: "My sister, Hoa. We talk on the phone almost every evening. My brother only wants to talk about football!"
        ask: emma
        by: tom
        phrases: ["closer to…", "almost every evening", "only wants to…"]
