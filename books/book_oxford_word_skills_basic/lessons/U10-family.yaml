  - kind: compare
    chapter: "Một từ, nhiều cách gọi"
    heading: "One English word, many Vietnamese words"
    heading_vi: "Tiếng Anh không phân biệt bên nội, bên ngoại, lớn hơn hay nhỏ hơn bố mẹ"
    items:
      - title: "English"
        title_vi: "một từ"
        lines: ["uncle", "aunt", "cousin", "nephew · niece", "grandson · granddaughter", "brother-in-law · sister-in-law"]
      - title: "Tiếng Việt"
        title_vi: "nhiều từ"
        lines: ["chú, bác, cậu, dượng", "cô, dì, bác, thím, mợ", "anh họ, chị họ, em họ", "cháu (con của anh chị em)", "cháu nội, cháu ngoại", "anh rể, em rể, chị dâu, em dâu…"]
    lines:
      - emma: "Vietnamese has many words for family. English is much simpler. Uncle is your parents' brother, or your aunt's husband, on either side of the family."
        focus: 0
        vi: "Uncle = chú, bác, cậu, dượng — cả bên nội lẫn bên ngoại."
      - tom: "So my mum's brother and my dad's brother are both my uncle. And all the children of my uncles and aunts are my cousins."
        focus: 1
        vi: "Con của cô dì chú bác đều là cousin."
      - emma: "Don't say cousin brother or cousin sister. Just say cousin. And older or younger if you need it."
        focus: 0
        vi: "Không nói cousin brother — chỉ cần cousin."

