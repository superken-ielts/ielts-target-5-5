      - {en: "My hair is long. — NOT My hairs are long.", vi: "hair (tóc trên đầu) không đếm được"}
    lines:
      - {emma: "In English, we say my, your, his or her before parts of the body. I hurt my hand. Not: I hurt hand.", focus: 0, vi: "Luôn có my / your / his / her."}
      - {tom: "She broke her wrist. He's got a pain in his back.", focus: 1}
      - {emma: "Wash your hands. Brush your teeth.", focus: 2}
      - {tom: "And hair is uncountable. My hair is long. Not: my hairs are long.", focus: 3}

