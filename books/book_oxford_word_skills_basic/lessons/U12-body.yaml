  - kind: qa
    chapter: "Nói 1: cơ thể và sức khỏe"
    heading: "Speaking 1 · Tom and Emma talk about their bodies"
    heading_vi: "Tạm dừng sau mỗi câu hỏi để tự trả lời, rồi nghe câu mẫu"
    items:
      - q: "Have you ever broken a bone?"
        a: "Yes, my wrist, when I was twelve. I fell off my bike on a hill in Da Lat. I couldn't write for six weeks!"
        ask: emma
        by: tom
        phrases: ["Yes, my wrist…", "I fell off my bike", "I couldn't … for six weeks"]
      - q: "Which part of your body do you use most at work?"
        a: "My voice! And my hands, because I write on the board all day."
        ask: tom
        by: emma
        phrases: ["My voice!", "because I…", "all day"]
      - q: "Do you get backache when you study?"
        a: "Yes, sometimes. I sit at my laptop for hours, so my back and my neck hurt in the evening."
        ask: emma
        by: tom
        phrases: ["Yes, sometimes.", "for hours", "my back and my neck hurt"]
      - q: "What do you do when your feet hurt after hiking?"
        a: "I put them in hot water, and then I lie down on the sofa with a good book!"
        ask: tom
        by: emma
        phrases: ["I put them in…", "and then I…", "lie down"]
      - q: "Which hand do you write with?"
        a: "My right hand. But I can play basketball with both hands!"
        ask: emma
        by: tom
        phrases: ["My right hand.", "with both hands"]
      - q: "When did you last go to the doctor? What was the matter?"
        a: "Last year, before an exam. I had a terrible stomach ache, but the doctor said it was just stress."
        ask: emma
        by: tom
        phrases: ["Last year…", "I had a terrible…", "it was just stress"]
      - q: "Do you cross your fingers for good luck?"
        a: "All the time! Especially before my Vietnamese tests. My teacher says I need practice, not luck."
        ask: tom
        by: emma
        phrases: ["All the time!", "Especially before…", "not luck"]
      - q: "How do people greet each other in England?"
        a: "Friends often hug, or kiss on the cheek. But at work, people usually just shake hands."
        ask: tom
        by: emma
        phrases: ["Friends often…", "kiss on the cheek", "shake hands"]
      - q: "And in Vietnam?"
        a: "We usually shake hands, or we just smile and nod our heads. Hugging is less common, especially with older people."
        ask: emma
        by: tom
        phrases: ["We usually…", "nod our heads", "less common"]
    lines:
      - {emma: "Have you ever broken a bone, Tom?", focus: 0}
      - {tom: "Yes, my wrist, when I was twelve. I fell off my bike on a hill in Da Lat. I couldn't write for six weeks!", say: "Yes, my wrist, when I was twelve. I fell off my bike on a hill in Dah Lot. I couldn't write for six weeks!", reveal: 0, vi: "Có, gãy cổ tay năm 12 tuổi: ngã xe đạp trên dốc ở Đà Lạt, sáu tuần không viết được!"}
      - {tom: "Which part of your body do you use most at work?", focus: 1}
      - {emma: "My voice! And my hands, because I write on the board all day.", reveal: 1, vi: "Giọng nói! Và tay, vì viết bảng cả ngày."}
      - {emma: "Do you get backache when you study?", focus: 2}
      - {tom: "Yes, sometimes. I sit at my laptop for hours, so my back and my neck hurt in the evening.", reveal: 2, vi: "Thỉnh thoảng: ngồi laptop hàng giờ nên tối đau lưng, đau cổ."}
      - {tom: "What do you do when your feet hurt after hiking?", focus: 3}
      - {emma: "I put them in hot water, and then I lie down on the sofa with a good book!", reveal: 3, vi: "Ngâm chân nước nóng rồi nằm sofa đọc sách!"}
      - {emma: "Which hand do you write with?", focus: 4}
      - {tom: "My right hand. But I can play basketball with both hands!", reveal: 4}
      - {emma: "When did you last go to the doctor? What was the matter?", focus: 5}
      - {tom: "Last year, before an exam. I had a terrible stomach ache, but the doctor said it was just stress.", reveal: 5, vi: "Năm ngoái, trước kỳ thi: đau bụng dữ dội, bác sĩ bảo chỉ do căng thẳng."}
      - {tom: "Do you cross your fingers for good luck?", focus: 6}
      - {emma: "All the time! Especially before my Vietnamese tests. My teacher says I need practice, not luck.", reveal: 6, vi: "Lúc nào cũng vậy, nhất là trước bài kiểm tra tiếng Việt — cô giáo bảo cần luyện tập chứ không cần may mắn."}
      - {tom: "How do people greet each other in England?", focus: 7}
      - {emma: "Friends often hug, or kiss on the cheek. But at work, people usually just shake hands.", reveal: 7, vi: "Bạn bè hay ôm hoặc hôn má; nơi làm việc thường chỉ bắt tay."}
      - {emma: "And in Vietnam?", focus: 8}
      - {tom: "We usually shake hands, or we just smile and nod our heads. Hugging is less common, especially with older people.", reveal: 8, vi: "Thường bắt tay, hoặc cười và gật đầu; ít ôm, nhất là với người lớn tuổi."}

