        focus: 0
        vi: "knee: k câm · wrist: w câm · thumb: b câm."
      - tom: "And stomach. The c, h sounds like k: stomach. Not stom-atch."
        say: "And stomach. The see aitch sounds like kay: stomach. Not stom-atch."
        focus: 1
        vi: "stomach đọc /ˈstʌmək/."
      - {emma: "Say them with me. Knee. Wrist. Thumb. Stomach.", focus: 0}

