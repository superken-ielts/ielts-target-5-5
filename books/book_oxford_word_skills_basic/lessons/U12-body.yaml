# Video Oxford Word Skills Basic · Unit 12 — I can name parts of the body (sách in tr. 32, Answer key tr. 207).
# Khuôn video: docs/agent-hoc-tap/09-oxford-word-skills-basic.md mục 5 (7–10 phút, không đếm ngược, 1–2 phần nói, nghe và viết).
# Đáp án bài 1–3 theo Answer key (bài 1: 1F 2T 3T 4F 5T 6T 7F 8T 9T 10T 11T 12F 13T 14F; bài 2: wrist, stomach, neck,
# finger, shoulder, eyes, bottom; bài 3: chin, stomach, chest, tooth/teeth, back, face, nose, bottom, waist).
# Hình trong sách (đợt 29): tranh mặt, miệng, cơ thể tr. 32 bên trái danh sách từ, khung đỏ theo nhóm từ đang học.
# Thêm ngoài sách: chữ câm (knee, wrist, thumb) và stomach /ˈstʌmək/; số nhiều bất quy tắc teeth, feet; my + bộ phận cơ thể
# (I hurt my hand); làm theo Emma (Touch your nose!); câu đố cơ thể; cử chỉ (nod, shake your head, cross your fingers;
# ngoắc một ngón tay là bất lịch sự ở Việt Nam); đi khám: headache, sore throat, my … hurts; chào hỏi ở Anh và ở Việt Nam.
# Chi tiết nhân vật mới: Tom gãy cổ tay năm 12 tuổi (ngã xe đạp trên dốc ở Đà Lạt), ngồi laptop lâu thì đau lưng, đau cổ,
# viết tay phải, năm ngoái trước kỳ thi đau bụng vì căng thẳng, ông của Tom trời mưa thì đau đầu gối; Emma dạy cả ngày nên dùng giọng và tay nhiều nhất, đi bộ đường dài về
# thì ngâm chân nước nóng.
# Dựng: cd agents && python -m lesson_video build ../books/book_oxford_word_skills_basic/lessons/U12-body.yaml
id: U12-body
activity: U12-words
title: "Unit 12 · Parts of the body"
subtitle: "I can name parts of the body"
title_vi: "Bộ phận cơ thể: đầu, mặt, thân, tay, chân — chữ câm, số nhiều bất quy tắc (teeth, feet)"
tag: "PEOPLE · UNIT 12"
speakers:
