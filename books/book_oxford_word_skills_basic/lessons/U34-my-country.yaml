# Video Oxford Word Skills Basic · Unit 34 — I can talk about my country (sách in tr. 90, Answer key tr. 212).
# Khuôn: file 09 mục 5.2 (unit thường, 7–10 phút). Không `wait` / `echo`; không khoảng lặng từ 3 giây (câu cuối cảnh tự trả
# lời `pause: 1.0`).
# Bài trong sách: đủ 1–3. Bài 1 theo Answer key tr. 212 (bản đồ Brazil bên trái). Bài 2 (Test yourself): "Possible answers" của
# Answer key — đáp án hiện thành nhãn trên bản đồ khi Tom trả lời. Bài 3 (ABOUT YOUR COUNTRY): Tom trả lời về Việt Nam, Emma về
# nước Anh (cảnh Nói 1; Answer key là câu của "a Greek person").
# Unit một trang nên thêm ngoài sách: nước Việt Nam bằng tiếng Anh (thủ đô, thành phố lớn, sông, núi, bờ biển, biên giới, nơi nổi
# tiếng), famous for / popular with, high hay tall, câu đố "in the north / on the coast / inland" về Việt Nam; Nghe và viết; Nói 2
# (Part 1 "Your country").
# Hình trong sách: bản đồ Brazil (khung theo địa danh, la bàn), đoạn văn (khung theo dòng, đo bằng máy), Glossary hai cảnh.
# Chi tiết nhân vật (khớp file 06 mục 9.4, file 09 mục 5.7): Tom sinh ở Hà Nội, lớn lên ở Đà Lạt (hồ sơ); chị Hoa ở Hà Nội; đã leo
# Langbiang (U11); mẹ có cửa hàng hoa ở Đà Lạt (U15, IELTS U04); mới: muốn leo Fansipan một ngày nào đó. Emma lớn lên ở thị trấn nhỏ ven biển miền nam nước Anh (hồ sơ); mới:
# mùa hè người Anh thích ra bờ biển miền tây nam (Cornwall).
