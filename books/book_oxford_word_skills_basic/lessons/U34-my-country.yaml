    heading: "Speaking 1 · Exercise 3: about your country"
    heading_vi: "Bài 3 (ABOUT YOUR COUNTRY) — tạm dừng sau mỗi câu hỏi để tự trả lời, rồi nghe câu mẫu"
    items:
      - q: "What's the capital of England, and where is it?"
        a: "London. It's in the south-east of England, on the River Thames."
        ask: tom
        by: emma
        phrases: ["It's in the south-east of…", "on the River…"]
      - q: "What are some of the other major cities?"
        a: "Birmingham, Manchester and Liverpool. They're all in the middle or the north."
        ask: tom
        by: emma
        phrases: ["They're all in…"]
      - q: "Does England have borders with any other countries?"
        a: "Yes, with Scotland in the north, and Wales in the west."
        ask: tom
        by: emma
        phrases: ["Yes, with … in the north"]
      - q: "Which places are popular in summer, Tom?"
        a: "The beaches, like Nha Trang and Da Nang. And Da Lat, because it's cool in the mountains."
        ask: emma
        by: tom
        phrases: ["The beaches, like…", "because it's cool…"]
      - q: "What are the famous places in your capital city?"
        a: "In Hanoi, Hoan Kiem Lake and the Old Quarter are very famous. They're in the centre of the city."
        ask: emma
        by: tom
        phrases: ["… are very famous", "in the centre of the city"]
