  - kind: qa
    chapter: "Nói 1: cảm xúc của bạn"
    heading: "Speaking 1 · How do you feel?"
    heading_vi: "Tạm dừng sau mỗi câu hỏi để tự trả lời, rồi nghe câu mẫu"
    items:
      - q: "How do you feel before an exam?"
        a: "Very nervous. I can't eat breakfast, and my hands get cold. But when the exam starts, I feel OK."
        ask: emma
        by: tom
        phrases: ["Very nervous.", "I can't…", "my hands get cold"]
      - q: "What makes you angry, Emma?"
        a: "People who are late, and don't send a message. Oh, and motorbikes on the pavement!"
        ask: tom
        by: emma
        phrases: ["People who…", "don't send a message", "Oh, and…"]
      - q: "When did you last feel embarrassed?"
        a: "Last week, at the café. I dropped a tray of drinks in front of everyone. All the customers looked at me!"
        ask: emma
        by: tom
        phrases: ["Last week…", "I dropped…", "in front of everyone"]
      - q: "Are you frightened of anything?"
        a: "Spiders! I can't even look at them. And I'm a little scared of the traffic here."
        ask: tom
        by: emma
        phrases: ["I can't even…", "a little scared of…"]
      - q: "What makes you happy?"
        a: "Basketball with my friends, and a hot bowl of phở on a cold morning in Da Lat."
        ask: emma
        by: tom
        phrases: ["… with my friends", "a hot bowl of…", "on a cold morning"]
      - q: "Do you ever feel homesick?"
        a: "Sometimes, especially at Christmas. Then I call my mum, and I feel much better."
        ask: tom
        by: emma
        phrases: ["Sometimes, especially at…", "Then I…", "I feel much better"]
      - q: "What do you do when you're worried?"
        a: "I call Khoa, or my sister Hoa. They always know what to say, and they never get angry with me."
        ask: emma
        by: tom
        phrases: ["I call…", "always know what to say", "never get angry"]
      - q: "Are you boiling or freezing today?"
        a: "Boiling! It's thirty-five degrees in Ho Chi Minh City. In Da Lat, I was often freezing at night."
        ask: emma
        by: tom
        phrases: ["Boiling!", "It's … degrees", "I was often freezing"]
      - q: "When were you last really surprised?"
        a: "On my birthday last year. My students made me a cake with my name on it, in Vietnamese!"
        ask: tom
        by: emma
        phrases: ["On my birthday…", "made me a cake", "in Vietnamese"]
