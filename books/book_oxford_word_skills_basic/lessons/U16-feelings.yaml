# Video Oxford Word Skills Basic · Unit 16 — I can say how I feel (sách in tr. 40–41, Answer key tr. 208).
# UNIT KHÓ (đợt 29): 20 từ chỉ cảm giác, cảm xúc, nhiều cặp dễ nhầm (sad / upset, frightened / scared, ill / not well) —
# video dài khoảng 12 phút: phần sách, rồi ÔN TẬP (lỗi hay gặp, đoán cảm xúc theo tình huống) và LUYỆN NÓI CHUNG
# (Part 2 "a time when you felt very nervous", hai bài mẫu; ba câu thảo luận kiểu Part 3). Khuôn: file 09 mục 5.2.
# Không `wait` / `echo`.
# Hình trong sách: bảng cảm giác cơ thể tr. 40 (hai dải, khung theo dòng), 10 tranh cảm xúc và khung Spotlight
# "get + adjective" tr. 41 (khung theo tranh đang nói).
# Đáp án bài 1, 2, 4, 5 theo Answer key tr. 208.
# Chi tiết nhân vật (khớp hồ sơ file 06 mục 9.4 và file 09 mục 5.7): Tom làm thêm ở quán cà phê gần trường tối thứ Ba,
# thứ Năm từ tháng 9 (hồ sơ U03), quản lý nghiêm nhưng công bằng — ngày đầu làm rơi khay cà phê sữa đá, vỡ hai ly (bài nói
# Part 2); tuần trước lại làm rơi khay đồ uống; trước kỳ thi không ăn sáng được; lo lắng thì gọi Khoa hoặc chị Hoa. Emma sợ nhện và
# hơi sợ giao thông; giận người đến muộn không nhắn và xe máy chạy trên vỉa hè; nhớ nhà nhất dịp Giáng sinh thì gọi mẹ;
# sinh nhật năm ngoái học viên làm bánh có tên Emma bằng tiếng Việt; buổi dạy đầu tiên ở Việt Nam ba năm trước, lớp 20
# người lớn, chào "Chào buổi sáng" sai thanh (bài nói Part 2).
# Dựng: cd agents && python -m lesson_video build ../books/book_oxford_word_skills_basic/lessons/U16-feelings.yaml
id: U16-feelings
