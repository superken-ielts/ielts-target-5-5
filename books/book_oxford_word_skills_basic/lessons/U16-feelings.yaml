        phrases: ["Not very much.", "even when…", "But at…"]
      - q: "What makes people happy: money, or relationships?"
        a: "Relationships, I think. Money helps, of course, but happy people usually have good friends and family around them."
        ask: tom
        by: emma
        phrases: ["…, I think.", "Money helps, of course, but…", "around them"]
