subtitle: "I can say how I feel"
title_vi: "Cảm giác cơ thể (tired, hungry, boiling, ill) và cảm xúc (happy, worried, embarrassed, upset…) — kèm ôn tập và luyện nói"
tag: "PEOPLE · UNIT 16"
speakers:
