# Video Oxford Word Skills Basic · Unit 43 — I can talk about university (sách in tr. 112–113, Answer key tr. 215).
# UNIT KHÓ (đợt 41): 2 trang, 44 mục Word list — bằng cấp và khóa học (do a degree, course, term, undergraduate / graduate, BA /
# BSc / MA / MSc / PhD, do research) và cặp ngành học – người (economics → an economist, politics → a politician…); "Do you work or
# are you a student? What are you studying?" là câu Part 1 hay gặp nhất — video khoảng 13 phút: phần sách, rồi họ từ -ist / -er /
# -ian và trọng âm, ÔN TẬP (lỗi hay gặp) và LUYỆN NÓI CHUNG (Part 2 "a course you have taken or are taking", hai bài mẫu; ba câu
# thảo luận kiểu Part 3). Khuôn: file 09 mục 5.2. Không `wait` / `echo`; không khoảng lặng từ 3 giây (câu cuối cảnh tự trả lời
# `pause: 1.0`). Không có cảnh "Nghe và viết": unit có video nghe – viết riêng.
# Bài trong sách: đủ 1–6. Bài 1, 2, 4, 5 theo Answer key tr. 215 (bài 2 câu 3 hai chỗ trống: 3a/3b). Bài 3 (ABOUT YOUR COUNTRY): Tom
# trả lời về Việt Nam, Emma về nước Anh (cảnh Nói 1). Bài 6 (Test yourself): tranh 1–10 (hai cảnh), đáp án hiện thành nhãn khi Tom
# trả lời.
# Hình trong sách: lời kể của sinh viên (hai cảnh, khung theo câu), Glossary hai cảnh, Spotlight How long does it last?, bảng ngành
# học – người cùng tranh (hai cảnh: hàng 1–5, hàng 6–10; khung theo hàng), tranh 1–10 để tự kiểm tra — đo bằng máy.
# Chi tiết nhân vật (khớp file 06 mục 9.4, file 09 mục 5.7): Tom học năm hai ngành kinh doanh ở TP. HCM, thích Marketing, vào đại
# học khoảng hai năm trước (tháng 8), cần IELTS 5.5 để đi trao đổi ở Úc, muốn làm marketing cho công ty cà phê quốc tế; Emma học Văn
# học Anh ở đại học, làm văn phòng một năm rồi học khóa đào tạo giáo viên, thi trượt Toán năm 15 tuổi phải thi lại (U42). Mới: khóa
# học của Tom bốn năm, hai học kỳ mỗi năm, viết nhiều bài luận, hay học ở thư viện; học kỳ này học môn Marketing 15 tuần (học thứ
# Hai, làm dự án nhóm); Emma có bằng BA, khóa đào tạo giáo viên một tháng ở London, xong khóa thì có việc dạy đầu tiên.
