# Video Oxford Word Skills Basic · Unit 3 — I can say days and dates (sách in tr. 16–17, Answer key tr. 205–206).
# Khuôn video: docs/agent-hoc-tap/09-oxford-word-skills-basic.md mục 5 (7–10 phút, không đếm ngược, 1–2 phần nói).
# Đáp án bài 2, 5, 6 (lịch tr. 17), 7 theo Answer key; bài 1 làm trong sách. Bài 3 (ABOUT YOU AND YOUR COUNTRY): câu của Emma
# theo "Answers from a British person" trong Answer key, câu của Tom về Việt Nam (Tết, 30/4, 1/5, 2/9).
# Nghe và viết: câu ở ngôi thứ nhất do Emma đọc là chuyện của Emma, nên phải khớp hồ sơ (sinh 15/9; đến Việt Nam 4/8/2023,
# khớp "dạy ở TP. HCM đã ba năm"); các câu khác để trung tính (the party, the hotel).
# Dựng: cd agents && python -m lesson_video build ../books/book_oxford_word_skills_basic/lessons/U03-days-dates.yaml
