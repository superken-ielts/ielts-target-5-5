  - kind: qa
    chapter: "Nói 1: về bạn và đất nước bạn"
    heading: "Speaking 1 · About you and your country"
    heading_vi: "Bài 3 trong sách — Emma trả lời theo Answer key (người Anh), Tom nói về Việt Nam"
    items:
      - q: "Which month is your birthday, Emma?"
        a: "September. It's on the fifteenth of September, at the start of autumn."
        ask: tom
        by: emma
        phrases: ["on the fifteenth of September", "at the start of autumn"]
      - q: "And yours, Tom?"
        a: "March. My birthday is on the ninth of March."
        ask: emma
        by: tom
        phrases: ["My birthday is on…"]
      - q: "Which season do you like best? Why?"
        a: "I like spring, because it's light, and the trees and plants start to grow."
        ask: tom
        by: emma
        phrases: ["I like … best", "because it's light", "start to grow"]
      - q: "What about you? Does Vietnam have four seasons?"
        a: "In the north, yes. But in the south, we only have two: the rainy season and the dry season. I like the dry season best, because it's sunny every day."
        ask: emma
        by: tom
        phrases: ["In the north…", "the rainy season", "the dry season"]
      - q: "Which day of the week do you like best? Why?"
        a: "Friday, because it's nearly the weekend."
        ask: tom
        by: emma
        phrases: ["…, because…", "nearly the weekend"]
      - q: "What's your favourite month, Emma?"
        a: "December. It's dark and cold in England, but the streets are full of lights, and I love Christmas."
        ask: tom
        by: emma
        phrases: ["dark and cold", "full of lights", "I love…"]
      - q: "What do you usually do on your birthday, Tom?"
        a: "Nothing big. I have dinner with a few close friends, and my mum always calls me from Da Lat in the morning."
        ask: emma
        by: tom
        phrases: ["Nothing big.", "a few close friends", "always calls me"]
      - q: "What do you do on New Year's Day?"
        a: "Our big New Year is Tết, in January or February. On the first day, we visit our relatives, and children get lucky money."
        ask: emma
        by: tom
        phrases: ["in January or February", "On the first day…", "lucky money"]
      - q: "What are two other special days in your country, and when are they?"
        a: "The thirtieth of April, Reunification Day, and the second of September, our National Day. People have a holiday, and there are fireworks in the evening."
        ask: emma
        by: tom
        phrases: ["the thirtieth of April", "the second of September", "have a holiday"]
