      - {emma: "Could you please send me the information? I've attached my report.", focus: 2}
      - {tom: "At the end: I look forward to hearing from you.", focus: 3}
      - {emma: "And finish with: best wishes, or kind regards.", focus: 4}

  - kind: bullets
    chapter: "Internet ngày nay"
    heading: "The internet today"
    heading_vi: "Thêm ngoài sách — sách in năm 2008; ngày nay người ta hay nói thế này"
    items:
      - {en: "a chatroom → a group chat · chat online → send messages", vi: "nhóm chat · nhắn tin"}
      - {en: "an MP3 player → a music app · download music → stream music", vi: "ứng dụng nghe nhạc · nghe trực tuyến"}
      - {en: "broadband → Wi-Fi, 4G / 5G · What's the Wi-Fi password?", vi: "wifi, mạng di động"}
      - {en: "social media: post a photo · share a link · follow someone", vi: "mạng xã hội: đăng ảnh, chia sẻ, theo dõi"}
      - {en: "a video call · an online lesson · online shopping", vi: "gọi video · học trực tuyến · mua sắm trực tuyến"}
    lines:
      - {emma: "This book is from two thousand and eight. Today, we don't often say chatroom. We say a group chat, and we send messages.", focus: 0, vi: "sách in năm 2008"}
      - {tom: "MP3 players are old now. People use a music app, and they stream music: they listen online, without downloading.", say: "MP3 players are old now. People yooz a music app, and they stream music: they listen online, without downloading.", focus: 1, vi: "stream: phát trực tuyến"}
