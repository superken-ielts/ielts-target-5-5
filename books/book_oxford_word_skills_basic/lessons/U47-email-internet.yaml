      - {tom: "Not any more. I listen to music online, on my phone.", reveal: 2, vi: "Không tải nữa, nghe nhạc trực tuyến trên điện thoại."}
      - {tom: "Which websites do you visit most, Emma?", focus: 3}
      - {emma: "YouTube, and a news website from England.", reveal: 3, vi: "YouTube và một trang tin của Anh."}
      - {tom: "Have you got broadband?", focus: 4}
      - {emma: "Yes, and it's quite fast. I need it for my online lessons.", reveal: 4, vi: "Có, khá nhanh — cần cho các lớp trực tuyến."}
      - {tom: "Do you visit chatrooms?", focus: 5}
      - {emma: "No, never. But I chat with my friends on my phone every day.", reveal: 5, vi: "Không bao giờ, nhưng ngày nào cũng nhắn tin với bạn bè."}

  - kind: bullets
    chapter: "Viết email kiểu IELTS"
    heading: "Writing an email: useful phrases"
    heading_vi: "Thêm ngoài sách — IELTS General Training, Writing Task 1 (thư, email)"
    items:
      - {en: "Dear Mr Smith, · Hi Karl,", vi: "mở đầu: trang trọng · thân mật"}
