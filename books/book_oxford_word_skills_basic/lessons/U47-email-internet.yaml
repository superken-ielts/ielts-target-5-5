# Video Oxford Word Skills Basic · Unit 47 — I can use email and the internet (sách in tr. 120–121, Answer key tr. 216). Unit cuối
# module Study and work: tổng kết module, nhắc làm Review tr. 122–125.
# Khuôn: file 09 mục 5.2 (unit thường, 7–10 phút). Không `wait` / `echo`; không khoảng lặng từ 3 giây (câu cuối cảnh tự trả
# lời `pause: 1.0`).
# Bài trong sách: đủ 1–6. Bài 1, 2, 4, 5 theo Answer key tr. 216 (bài 2: câu đúng hiện đủ, từ còn thiếu nói rõ). Bài 3 (ABOUT YOU):
# Emma hỏi Tom, Tom hỏi Emma (cảnh Nói 1). Bài 6 (ABOUT YOU, cột ABOUT YOU của bảng): Tom và Emma trả lời sáu câu (cảnh Nói 2).
# Thêm ngoài sách: câu hay dùng khi viết email (IELTS General Training, Writing Task 1), internet ngày nay (sách in năm 2008:
# chatroom, MP3 player nay ít dùng — group chat, stream, Wi-Fi, social media); Nghe và viết; Nói 3 (Part 1 "The internet").
# Hình trong sách: màn hình email (hai cảnh: thanh công cụ và hộp thư đến, thư của Karl), lời Jan và Lucy, Glossary A, bảng câu hỏi
# về internet (hai cảnh, khung theo hàng), Glossary B hai cảnh — đo bằng máy.
# Chi tiết nhân vật (khớp file 06 mục 9.4, file 09 mục 5.7): Tom là sinh viên, gọi về nhà mỗi Chủ nhật (U17), hay đặt hàng
# qua ứng dụng (U37); Emma dạy cả trực tuyến (U45), dùng webcam gọi cho bố mẹ (U46). Mới: Tom ít gửi email (hai ba thư một tuần, cho
# thầy cô và công ty khi tìm việc), hay nhắn tin trên điện thoại; mua quần áo, sách qua ứng dụng; không tải nhạc nữa mà nghe
# trực tuyến. Emma nhận nhiều thư rác (vé máy bay rẻ, du lịch miễn phí), học viên gửi bài tập dạng tệp đính kèm, trả
# lời trong ngày nhưng không trả lời cuối tuần; có internet băng thông rộng khá nhanh; hay vào YouTube và một trang tin của Anh;
# không vào phòng chat, chỉ nhắn tin với bạn bè.
# Dựng: cd agents && python -m lesson_video build ../books/book_oxford_word_skills_basic/lessons/U47-email-internet.yaml
