    lines:
      - emma: "Animals are countable. A chicken, two chickens. There are ten chickens in my grandmother's garden."
        focus: 0
        vi: "Con vật: đếm được."
      - {tom: "But meat is uncountable. Some chicken, a lot of beef. Not: a beef, or two beefs.", focus: 1, vi: "Thịt: không đếm được."}
      - {emma: "To count meat, say: a piece of chicken, or a slice of ham. A slice is a thin piece.", focus: 2, vi: "slice: lát mỏng"}
      - {tom: "Fish is special: one fish, two fish. We don't usually say fishes.", focus: 3}
      - {emma: "And two sheep, not sheeps. But prawns and mussels have an s.", focus: 4}

