# Video Oxford Word Skills Basic · Unit 24 — I can name meat and fish (sách in tr. 65, Answer key tr. 210).
# Khuôn: file 09 mục 5.2 (unit thường, 7–10 phút). Không `wait` / `echo`; không khoảng lặng từ 3 giây (câu cuối cảnh tự trả
# lời `pause: 1.0`).
# Bài trong sách: đủ 1–5. Bài 1–3 theo Answer key tr. 210 (bài 3: tranh không nhãn, Emma hỏi, Tom nói từ). Bài 4 (ABOUT YOU,
# Do you like …?): Tom và Emma hỏi đáp (cảnh Nói 1). Bài 5 (Test yourself): Emma nhắc che chữ, nhìn tranh, nói lại.
# Unit một trang nên thêm ngoài sách: con vật đếm được ≠ thịt không đếm được (a chicken / some chicken), món Việt bằng tiếng
# Anh (beef noodle soup, grilled pork with rice noodles…), câu đố con vật hay thịt, tả một món ăn (bài mẫu phở bò của Tom, fish and chips của Emma),
# vegetarian / I don't eat …; Nghe và viết; Nói 2 (Part 1 "Food").
# Hình trong sách: bảng animal → meat (khung theo cột) kèm bong bóng Do you eat …?, khung Spotlight pig, hàng tranh cá và hải
# sản, tranh bài 3 (khung theo tranh).
# Chi tiết nhân vật (khớp file 06 mục 9.4, file 09 mục 5.7): Tom thích bò (phở bò), thích tôm, không thích mực; mẹ Hạnh nấu
# canh cá ngon nhất (Tom muốn học công thức — video IELTS U02); quê Đà Lạt xa biển nên hồi nhỏ ít ăn hải sản. Emma lớn lên ở thị
# trấn ven biển nên thích hải sản, nhất là cua và vẹm (mussels), cá với khoai tây chiên (fish and chips); không thích vịt; ăn sáng
# kiểu Anh thỉnh thoảng có bacon và xúc xích vào cuối tuần.
# Dựng: cd agents && python -m lesson_video build ../books/book_oxford_word_skills_basic/lessons/U24-meat-fish.yaml
