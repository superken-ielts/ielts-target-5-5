# Video Oxford Word Skills Basic · Unit 23 — I can get help at the chemist's (sách in tr. 60, Answer key tr. 210). Học sau Unit 22.
# Khuôn: file 09 mục 5.2 (unit thường, 7–10 phút). Không `wait` / `echo`; không khoảng lặng từ 3 giây.
# Bài trong sách: đủ 1–3. Bài 1, 2 theo Answer key tr. 210 (bài 2: câu 1 là a sore throat, câu 3 là for toothache, please —
# theo Answer key). Bài 3 (Test yourself): cảnh riêng — tranh không nhãn, Emma hỏi "What's this?", tạm dừng, Tom trả lời.
# Unit một trang nên thêm ngoài sách: cần mua gì (câu đố), đọc nhãn thuốc (kiểu bài đọc IELTS General Training), hội thoại mới
# (thuốc đau họng), Nghe và viết; Nói 1 (hiệu thuốc, tủ thuốc ở nhà); Nói 2 đóng vai: Emma là dược sĩ, người học là khách.
# Hình trong sách: 7 tranh đồ ở hiệu thuốc (khung theo tranh), hai đoạn hội thoại (khung theo dòng — Tom đọc dược sĩ Ch, Emma
# đọc khách C), Glossary và Spotlight "Asking for things in a chemist's".
# Chi tiết nhân vật (khớp file 06 mục 9.4, file 09 mục 5.7, U22): Tom tuần trước bị đứt tay khi thái rau — đang học nấu ăn (hồ sơ:
# chỉ biết nấu mì và trứng); tủ thuốc của Tom có băng dán, kem sát trùng, thuốc đau đầu; hiệu thuốc ngay dưới căn hộ. Emma
# giữ thuốc ho từ mùa mưa đầu tiên (U22), thích trà gừng hơn thuốc; ở Anh mua thuốc đau đầu ở siêu thị được.
