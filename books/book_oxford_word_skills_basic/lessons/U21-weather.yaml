# Video Oxford Word Skills Basic · Unit 21 — I can talk about the weather (sách in tr. 56–57, Answer key tr. 209–210).
# Khuôn: file 09 mục 5.2 (unit thường, 7–10 phút). Không `wait` / `echo`; không khoảng lặng từ 3 giây.
# Bài trong sách: đủ 1–6. Bài 1, 2, 4, 5 theo Answer key tr. 209–210. Bài 3 (Test yourself): Tom nhắc che chữ, nhìn hình, nói lại.
# Bài 6 (ABOUT YOUR COUNTRY): Tom sửa câu cho đúng với miền Nam Việt Nam (Answer key là câu của "an Argentinian person").
# Thêm ngoài sách: nhiệt độ (It's thirty-five degrees), hai mùa của miền Nam; Nghe và viết; Nói 1 (Part 1 "Weather"); Nói 2.
# Hình trong sách: bảng What's the weather like? (tr. 56, khung theo hàng), khung Spotlight a lot (of) / a bit (of), ảnh bão
# và đoạn văn In my country… (tr. 57, hai cảnh, khung theo dòng, Glossary bên phải).
# Chi tiết nhân vật (khớp file 06 mục 9.4, file 09 mục 5.7): Đà Lạt mát quanh năm (khoảng 15–25 độ), sáng hay có sương mù,
# tháng 12 tối lạnh; TP. HCM mùa khô tháng 12 – tháng 4, mùa mưa tháng 5 – tháng 11, chiều hay mưa giông; Tom thích nghe tiếng
# mưa nhưng ghét đi xe máy dưới mưa (ở Đà Lạt); ngày âm u thì hơi uể oải. Emma: quê thị trấn nhỏ ven biển ở miền nam nước Anh
# (hồ sơ) lúc nào cũng có gió biển; thời tiết Anh hay thay đổi, mưa lắt nhắt; thích ngày xuân nắng mà không nóng; thấy TP. HCM
# rất ẩm; ngày mưa ở nhà đọc truyện trinh thám; mùa mưa luôn mang ô (U18).
# Dựng: cd agents && python -m lesson_video build ../books/book_oxford_word_skills_basic/lessons/U21-weather.yaml
