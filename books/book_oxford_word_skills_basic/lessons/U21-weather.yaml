    heading: "Speaking 1 · The weather"
    heading_vi: "Câu hỏi kiểu IELTS Part 1 — tạm dừng sau mỗi câu hỏi để tự trả lời, rồi nghe câu mẫu"
    items:
      - q: "What's the weather like in your hometown?"
        a: "Da Lat is cool all year: about fifteen to twenty-five degrees. The mornings are often foggy, and in December it's cold at night."
        say: "Dah Lot is cool all year: about fifteen to twenty-five degrees. The mornings are often foggy, and in December it's cold at night."
        ask: emma
        by: tom
        phrases: ["… is cool all year", "about … degrees", "The mornings are often…"]
      - q: "And your hometown, Emma?"
        a: "It's a small town by the sea, so there's always a breeze. The weather is very changeable: sunny in the morning, and showers in the afternoon."
        ask: tom
        by: emma
        phrases: ["by the sea", "there's always a breeze", "very changeable"]
      - q: "What's your favourite kind of weather?"
        a: "A sunny spring day in England: warm, but not too hot. Ho Chi Minh City is a bit too humid for me!"
        say: "A sunny spring day in England: warm, but not too hot. Ho Chee Min City is a bit too humid for me!"
        ask: tom
        by: emma
        phrases: ["warm, but not too hot", "a bit too humid for me"]
      - q: "Do you like rainy days?"
        a: "I like the sound of rain when I'm at home. But riding a motorbike in heavy rain is terrible!"
        ask: emma
        by: tom
        phrases: ["I like the sound of…", "But … is terrible!"]
