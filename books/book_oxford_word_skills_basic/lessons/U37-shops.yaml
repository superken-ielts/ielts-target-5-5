# Video Oxford Word Skills Basic · Unit 37 — I can talk about shops (sách in tr. 96–97, Answer key tr. 213).
# Khuôn: file 09 mục 5.2 (unit thường, 7–10 phút). Không `wait` / `echo`; không khoảng lặng từ 3 giây (câu cuối cảnh tự trả
# lời `pause: 1.0`).
# Bài trong sách: đủ 1–6. Bài 1, 2, 4, 5 theo Answer key tr. 213 (bài 2: "Possible answers"). Bài 3 (Test yourself: che cột
# Places, nhìn What they sell): câu đố "Where can you buy …?". Bài 6 (ABOUT YOU): Tom và Emma trả lời câu hỏi bài 5 (cảnh Nói 1).
# Thêm ngoài sách: noun + shop (flower shop, phone shop…), mua sắm ở Việt Nam bằng tiếng Anh (convenience store, wet market, street
# vendor, shopping app, delivery); Nghe và viết; Nói 2 (Part 1 "Shopping").
# Hình trong sách: bảng Places / What they sell (hai cảnh, khung theo hàng) kèm ảnh chợ trong nhà và Spotlight noun + shop, sáu lời
# nói về thói quen mua sắm (hai cảnh), Glossary (hai cảnh).
# Chi tiết nhân vật (khớp file 06 mục 9.4, file 09 mục 5.7): sáng thứ Bảy Tom đi chợ sau trường đại học với hai bạn cùng phòng (U17,
# U26), mua bánh mì ở tiệm đầu ngõ (U26), mẹ có cửa hàng hoa (IELTS U04); Emma đi chợ sáng thứ Bảy (U17), mua phô mai, bơ ở cửa hàng
# nhỏ bán đồ nhập khẩu (U26), hỏi giá bằng tiếng Việt (U25). Mới: Tom mua đồ dùng, mì gói ở cửa hàng tiện lợi dưới phố, đặt hàng qua
# ứng dụng; Emma thấy siêu thị tiện nhưng thích chợ vì thân thiện, được tập nói tiếng Việt.
# Dựng: cd agents && python -m lesson_video build ../books/book_oxford_word_skills_basic/lessons/U37-shops.yaml
