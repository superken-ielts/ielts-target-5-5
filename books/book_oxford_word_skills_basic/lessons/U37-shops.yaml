  - kind: qa
    chapter: "Nói 1: thói quen mua sắm"
    heading: "Speaking 1 · Exercise 6: about you"
    heading_vi: "Bài 6 (ABOUT YOU) — tạm dừng sau mỗi câu hỏi để tự trả lời, rồi nghe câu mẫu"
    items:
      - q: "When do you usually do the shopping, Tom?"
        a: "On Saturday morning. My flatmates and I go to the market behind the university."
        ask: emma
        by: tom
        phrases: ["On … morning.", "go to the market"]
      - q: "Do you prefer supermarkets or small shops?"
        a: "Small shops and markets. They're cheaper, and the people are friendlier. But I buy rice and noodles at the supermarket."
        ask: emma
        by: tom
        phrases: ["… are cheaper, and…", "But I buy … at…"]
      - q: "Do supermarkets in your town deliver things to your home?"
        a: "Yes, most of them do. And I often order things on an app. They deliver very fast."
        ask: emma
        by: tom
        phrases: ["Yes, most of them do.", "order … on an app"]
      - q: "Do you often have to queue at the checkout, Emma?"
        a: "Only at the weekend. That's why I go to the market early on Saturday morning."
        ask: tom
        by: emma
        phrases: ["Only at the weekend.", "That's why…"]
      - q: "Where do you get your fruit and vegetables?"
        a: "At the market. It's friendly, and I can practise my Vietnamese when I ask about prices."
        ask: tom
        by: emma
        phrases: ["At the market.", "I can practise…"]
      - q: "Do you think supermarkets are convenient?"
        a: "Yes, very. I buy cheese and butter at a small shop, but I get everything else at the supermarket near my flat."
        ask: tom
        by: emma
        phrases: ["Yes, very.", "I get everything else at…"]
