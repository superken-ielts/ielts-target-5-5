# Video Oxford Word Skills Basic · Unit 28 — I can order in a restaurant (sách in tr. 72–74, Answer key tr. 211). Học sau Unit 25–27.
# UNIT KHÓ (đợt 38): 3 trang — đồ trên bàn ăn, cách nấu (boiled, fried, grilled, roast), steak rare / medium / well done, thực đơn
# (starter, main course, dessert), hội thoại gọi món, another / some more — chủ đề hay gặp ở IELTS General Training (đặt bàn, gọi
# món) — video khoảng 14 phút: phần sách, rồi đặt bàn qua điện thoại, đóng vai, ÔN TẬP (lỗi hay gặp, tự kiểm tra tranh bàn ăn) và
# LUYỆN NÓI CHUNG (Part 2 "a restaurant that you enjoyed going to", hai bài mẫu; ba câu thảo luận kiểu Part 3).
# Khuôn: file 09 mục 5.2. Không `wait` / `echo`; không khoảng lặng từ 3 giây (câu cuối cảnh tự trả lời `pause: 1.0`).
# Không có cảnh "Nghe và viết": unit có video nghe – viết riêng.
# Bài trong sách: đủ 1–9. Bài 1, 4, 5, 8, 9 theo Answer key tr. 211. Bài 2 (ABOUT YOUR COUNTRY): Tom nói về Việt Nam, Emma về nước
# Anh (Answer key là câu của "an Argentinian person"). Bài 3, 7 (Test yourself): cảnh tự kiểm tra tranh bàn ăn ở phần ôn tập; Emma
# nhắc che chữ thực đơn. Bài 6 (ABOUT YOU): Tom và Emma chọn món (cảnh Nói 1).
# Hình trong sách: tranh bàn ăn 12 đồ vật kèm nhãn (tr. 72, khung theo đồ vật), ảnh món ăn và thang steak, thực đơn (tr. 73, khung
# theo dòng) và 8 tranh món, hội thoại khách – phục vụ (tr. 74, khung theo dòng — Tom đọc người phục vụ W, Emma đọc khách C),
# Glossary và Spotlight another or some more.
# Chi tiết nhân vật (khớp file 06 mục 9.4, file 09 mục 5.7, U24–U27): Tom thích tôm (U24), mới ăn bít tết một lần, thích chín vừa;
# Tết năm nay cả nhà (ông, bố mẹ, chị Hoa từ Hà Nội về, em Bao) đi ăn lẩu bò ở một quán gần chợ Đà Lạt. Emma thích hải sản, nhất là
# vẹm (U24), không thích vịt (U24); hè năm ngoái đi Vũng Tàu với ba giáo viên cùng trường, ăn ở một quán hải sản cạnh biển — gợi nhớ
# quê ven biển ở Anh.
# Dựng: cd agents && python -m lesson_video build ../books/book_oxford_word_skills_basic/lessons/U28-restaurant.yaml
