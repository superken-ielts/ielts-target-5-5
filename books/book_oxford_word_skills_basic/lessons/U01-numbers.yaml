  - kind: compare
    chapter: "-teen hay -ty?"
    heading: "thirteen or thirty?"
    heading_vi: "-teen nhấn âm sau và có âm /n/ cuối; -ty nhấn âm đầu — nghe kỹ kẻo nhầm 13 với 30"
    items:
      - title: "-teen: thir-TEEN"
        title_vi: "nhấn âm sau, nghe rõ /n/ ở cuối"
        lines: ["13 thirteen", "14 fourteen", "15 fifteen", "16 sixteen", "17 seventeen"]
      - title: "-ty: THIR-ty"
        title_vi: "nhấn âm đầu, không có /n/"
        lines: ["30 thirty", "40 forty", "50 fifty", "60 sixty", "70 seventy"]
    lines:
      - emma: "Now listen carefully. Is it thirteen, or thirty? Many learners mix them up."
        vi: "Nghe kỹ: thirteen hay thirty? Người học hay nhầm hai số này."
      - {emma: "Thirteen, fourteen, fifteen. The stress is at the end, and you can hear an n.", say: "Thir-teen, four-teen, fif-teen. The stress is at the end, and you can hear an N.", focus: 0}
      - {tom: "Thirty, forty, fifty. The stress is at the start, and there's no n.", say: "Thirty, forty, fifty. The stress is at the start, and there's no N.", focus: 1}
      - emma: "Thirteen, thirty. Fourteen, forty. Fifteen, fifty. Sixteen, sixty. Seventeen, seventy."
        say: "Thir-teen, thirty. Four-teen, forty. Fif-teen, fifty. Six-teen, sixty. Seven-teen, seventy."
        vi: "Đọc theo từng cặp: 13 – 30, 14 – 40, 15 – 50, 16 – 60, 17 – 70."
      - {tom: "And don't forget: four has a u, but forty doesn't.", say: "And don't forget: four has a U, but forty doesn't.", focus: 1, vi: "four có chữ u, forty thì không."}

