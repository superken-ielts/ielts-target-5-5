  - kind: qa
    chapter: "Nói 1: những con số quanh bạn"
    heading: "Speaking 1 · Tom and Emma ask each other"
    heading_vi: "Tạm dừng sau mỗi câu hỏi để tự trả lời, rồi nghe câu mẫu"
    items:
      - q: "Tom, how many students are there in your IELTS class?"
        a: "About twenty-five. It isn't a big class, so we can all speak in every lesson."
        ask: emma
        by: tom
        phrases: ["About twenty-five", "It isn't a big class", "in every lesson"]
      - q: "How many people live in your hometown, Emma?"
        a: "About fifteen thousand, I think. But in summer, there are many more, because lots of tourists come to the beach."
        ask: tom
        by: emma
        phrases: ["About fifteen thousand", "many more", "lots of tourists"]
      - q: "How far is your flat from your university?"
        a: "About one kilometre. I can walk there in fifteen minutes."
        ask: emma
        by: tom
        phrases: ["About one kilometre", "in fifteen minutes"]
      - q: "How much does a coffee cost where you live?"
        a: "Here in Ho Chi Minh City, about twenty-five thousand dong. In England, it's about three pounds, so it's much more expensive!"
        ask: tom
        by: emma
        phrases: ["about … thousand dong", "about three pounds", "much more expensive"]
      - q: "How many hours do you sleep at night?"
        a: "About seven hours. But before an exam, only five or six."
        ask: emma
        by: tom
        phrases: ["About seven hours", "only five or six"]
      - q: "What's your favourite number, Tom?"
        a: "Nine, because my birthday is on the ninth of March. My basketball shirt number is nine, too."
        ask: emma
        by: tom
        phrases: ["…, because…", "on the ninth of March", "…, too"]
      - q: "Are you good with numbers, Emma?"
        a: "Not really! I was always slow at maths at school. Now I use the calculator on my phone for everything."
        ask: tom
        by: emma
        phrases: ["Not really!", "slow at maths", "for everything"]
      - q: "What's the biggest number you use every day?"
        a: "Probably my bank card number. It has sixteen numbers! Luckily, my phone remembers it for me."
        ask: tom
        by: emma
        phrases: ["Probably…", "sixteen numbers", "Luckily…"]
