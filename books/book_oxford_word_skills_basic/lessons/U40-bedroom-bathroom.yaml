# Video Oxford Word Skills Basic · Unit 40 — I can describe a bedroom and bathroom (sách in tr. 102–103, Answer key tr. 214).
# Khuôn: file 09 mục 5.2 (unit thường, 7–10 phút). Không `wait` / `echo`; không khoảng lặng từ 3 giây (câu cuối cảnh tự trả
# lời `pause: 1.0`). Không có cảnh "Nghe và viết": unit có video nghe – viết riêng.
# Bài trong sách: đủ 1–7. Bài 1, 2, 5, 6 theo Answer key tr. 214 (bài 6 câu 8 có hai chỗ trống: 8a/8b). Bài 3 (ABOUT YOU): câu
# của Tom và Emma. Bài 4 (Test yourself): hai tranh không có chữ, đáp án hiện thành nhãn khi Tom trả lời. Bài 7 (ABOUT YOU): Tom
# và Emma hỏi đáp (cảnh Nói 1), đủ 6 câu (câu 5 cho nữ: Emma trả lời; câu 6 cho nam: Tom trả lời).
# Thêm ngoài sách: double bed, bidet (chữ t câm), have a shower (Anh) / take a shower (Mỹ); sự cố trong phòng — câu cho thư phàn
# nàn IELTS General Task 1 (The shower doesn't work…); Nói 2 (Part 1 "Your room").
# Hình trong sách: tờ giới thiệu International student house (khung theo đoạn), tranh phòng ngủ và phòng tắm 14 mục (khung theo
# số), bảng In the bathroom (hai cảnh: ba dòng đầu, bốn dòng sau), Spotlight have + noun.
# Chi tiết nhân vật (khớp file 06 mục 9.4, file 09 mục 5.7): Tom ở chung căn hộ tầng ba với hai bạn (U38), bàn học gọn nhưng
# phòng bừa (U14), chơi bóng rổ (U01, U03); Emma ở căn hộ tầng tám (U38), máy giặt trong phòng tắm (U39). Mới: phòng Tom có giường
# đơn, bàn ghế, tủ quần áo nhỏ; phòng tắm có vòi sen, không có bồn tắm; Tom gội đầu gần như mỗi ngày vì chơi bóng rổ, dùng lược,
# máy cạo râu điện. Phòng Emma có giường đôi, bàn đầu giường, tủ ngăn kéo, tủ quần áo lớn; phòng tắm có bồn tắm kèm vòi sen, gương
# dài; Emma ít dùng nước hoa, trang điểm nhẹ khi đi làm.
# Dựng: cd agents && python -m lesson_video build ../books/book_oxford_word_skills_basic/lessons/U40-bedroom-bathroom.yaml
id: U40-bedroom-bathroom
