  - kind: qa
    chapter: "Nói 1: trông bạn thế nào?"
    heading: "Speaking 1 · What do you look like?"
    heading_vi: "Tạm dừng sau mỗi câu hỏi để tự trả lời, rồi nghe câu mẫu"
    items:
      - q: "How tall are you, Tom?"
        a: "I'm about one metre seventy-five. That's quite tall in Vietnam, but it's only average height in England!"
        ask: emma
        by: tom
        phrases: ["I'm about…", "quite tall", "only average height"]
      - q: "What do you look like, Emma?"
        a: "I'm average height, about one metre sixty-five, and slim. I've got long, wavy, light brown hair and blue eyes."
        ask: tom
        by: emma
        phrases: ["I'm average height", "I've got long, wavy…", "blue eyes"]
      - q: "And you, Tom?"
        a: "I've got short, straight, black hair and dark brown eyes. And no beard: I shave every morning!"
        ask: emma
        by: tom
