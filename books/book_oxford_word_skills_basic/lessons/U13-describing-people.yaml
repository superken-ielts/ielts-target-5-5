      - {n: 4, q: "If someone is fat, they are overweight.  →  ___", answer: "T"}
      - {n: 5, q: "The answer to 'How much does he weigh?' is '200 cms'.  →  ___", answer: "F (kgs)"}
      - {n: 6, q: "'How tall are you?' is correct.  →  ___", answer: "T"}
      - {n: 7, q: "It is polite to call someone fat and ugly.  →  ___", answer: "F"}
      - {n: 8, q: "Thin and slim mean the same, but thin is more positive.  →  ___", answer: "F (slim)"}
