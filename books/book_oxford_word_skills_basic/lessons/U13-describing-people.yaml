# Video Oxford Word Skills Basic · Unit 13 — I can describe people (sách in tr. 33–35, Answer key tr. 207).
# UNIT KHÓ (đợt 29): video dài tới khoảng 15 phút — sau phần sách có ÔN TẬP (lỗi hay gặp, câu đố "Ai đây?") và LUYỆN NÓI
# CHUNG (Part 2 "someone in your family who looks like you", hai bài mẫu Tom và Emma; ba câu thảo luận kiểu Part 3).
# Khuôn: file 09 mục 5.2 (unit khó).
# Không đếm ngược: không `wait` / `echo`.
# Đáp án bài 1, 2, 4, 5, 7, 10, 11 theo Answer key; bài 6, 8 (ABOUT YOU) là phần nói. Bài 10 (mô tả của cảnh sát) kể lại ngắn.
# Hình trong sách (đợt 29): tranh chiều cao – cân nặng, khuôn mặt, khung Spotlight tr. 33; bảng tóc – mắt tr. 34; bảng tuổi
# và tranh X / Y tr. 35 (cảnh figure, khung đỏ theo chỗ đang nói).
# Thêm ngoài sách: thứ tự tính từ tả tóc (dài – màu – kiểu); "mắt đen" là dark brown eyes (a black eye là mắt bị đánh bầm);
# nói về cân nặng ở Anh và ở Việt Nam.
# Chi tiết nhân vật mới (ghi vào file 09 mục 5.7): Tom cao khoảng 1m75, tóc đen ngắn thẳng, mắt nâu, sáng nào cũng cạo râu;
# Tom và chị Hoa giống mẹ (mắt, nụ cười); mẹ Tom tên Hạnh (say: Hahn), 50 tuổi, thấp (1m55), tóc đen ngắn hơi gợn sóng; các dì
# hay bảo Tom gầy quá.
# Emma cao trung bình (1m65), mảnh mai, tóc dài gợn sóng màu nâu sáng, mắt xanh, giống mẹ; mẹ Emma 62 tuổi, tóc giờ đã bạc;
# mẹ Emma đeo kính; anh Jack giống bố: cao, tóc sẫm, có râu. Lucy cao, mảnh mai, tóc đỏ ngắn xoăn, gần 30 tuổi như Emma; Khoa cao trung bình,
# tóc đen ngắn, đeo kính, lúc nào cũng cười.
# Dựng: cd agents && python -m lesson_video build ../books/book_oxford_word_skills_basic/lessons/U13-describing-people.yaml
id: U13-describing-people
activity: U13-words
title: "Unit 13 · Describing people"
subtitle: "I can describe people"
title_vi: "Tả người: chiều cao, cân nặng, ngoại hình, tóc, mắt, tuổi — kèm ôn tập và luyện nói tả người thân"
tag: "PEOPLE · UNIT 13"
speakers:
  # giọng theo bộ đọc: kokoro (mặc định khi có model) hoặc flite (dự phòng, có sẵn trên Ubuntu)
  emma: {name: Emma, role: teacher, color: "#C8102E", voice: {kokoro: af_heart, flite: slt}}
  tom: {name: Tom, role: student, color: "#1F5FAD", voice: {kokoro: am_michael, flite: rms}}

scenes:
  - kind: title
    chapter: "Giới thiệu"
    lines:
      - emma: "Welcome to Unit 13: describing people. How tall are they? What do they look like? How old are they? It's a long unit and a very useful topic, so this video is longer, with a review and speaking practice at the end."
        say: "Welcome to Unit thir-teen: describing people. How tall are they? What do they look like? How old are they? It's a long unit and a very useful topic, so this video is longer, with a review and speaking practice at the end."
        vi: "Unit 13: tả người — chiều cao, ngoại hình, tuổi. Video dài hơn: có ôn tập và luyện nói."
      - tom: "And no countdown. Pause the video whenever you want to answer."
        vi: "Không đếm ngược: tự tạm dừng khi muốn trả lời."

