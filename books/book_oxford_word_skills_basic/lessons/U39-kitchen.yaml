# Video Oxford Word Skills Basic · Unit 39 — I can describe a kitchen (sách in tr. 100–101, Answer key tr. 214).
# UNIT KHÓ (đợt 40): 2 trang, nhiều từ — 17 đồ dùng trong bếp và 10 cụm việc nhà (do the shopping, put away, empty the bin, do the
# washing-up…), do + danh từ; nấu ăn và việc nhà là chủ đề IELTS Part 1–3 hay gặp — video khoảng 13 phút: phần sách, rồi do hay
# make (giải thích, câu đố), bếp Việt Nam, ÔN TẬP (lỗi hay gặp) và LUYỆN NÓI CHUNG (Part 2 "a time when you cooked a meal for other people", hai bài mẫu; ba câu thảo
# luận kiểu Part 3). Khuôn: file 09 mục 5.2. Không `wait` / `echo`; không khoảng lặng từ 3 giây (câu cuối cảnh tự trả lời
# `pause: 1.0`). Không có cảnh "Nghe và viết": unit có video nghe – viết riêng.
# Bài trong sách: đủ 1–6. Bài 1, 4 theo Answer key tr. 214 (bài 1 có câu hai chỗ trống: 2a/2b, 3a/3b, 10a/10b). Bài 2 (ABOUT YOU):
# câu của Tom và Emma. Bài 3 (Test yourself): tranh bếp không có danh sách, đáp án hiện thành nhãn khi Tom trả lời. Bài 5 (ABOUT
# YOU): Tom và Emma hỏi đáp (cảnh Nói 1). Bài 6 (Test yourself): nghe mô tả, nói cụm việc nhà.
# Hình trong sách: tranh bếp 17 mục (hai cảnh: nửa trên, nửa dưới; khung theo số), 10 tranh việc nhà (hai cảnh), Spotlight do + noun.
# Chi tiết nhân vật (khớp file 06 mục 9.4, file 09 mục 5.7): Tom ở chung căn hộ với hai bạn, chia nhau nấu (U17), đang học nấu ăn
# (U22), muốn học món canh cá và chả giò của mẹ, mẹ chỉ nói "a little of this, and a little of that" (IELTS U02); bếp ở nhà Đà Lạt là
# phòng yêu thích (IELTS U01, U38). Emma thích nấu ăn, đã học lớp nấu món Việt (hồ sơ), bếp luôn bừa sau khi nấu (U14), nhớ nhà nhất
# dịp Giáng sinh (U16). Mới: căn hộ của Tom không có lò nướng, máy rửa bát, nấu bằng bếp ga; máy giặt ở ban công; Tom đổ rác, ba
# người thay nhau rửa bát, không ai là quần áo. Emma có lò nướng nhỏ mua ở TP. HCM, không có máy rửa bát, máy giặt trong phòng tắm,
# tự làm mọi việc nhà. Part 2: tháng trước Tom nấu canh cá của mẹ cho hai bạn cùng phòng (gọi video hỏi mẹ); Giáng sinh năm ngoái Emma
# nấu bữa tối kiểu Anh (gà quay, khoai tây nướng) cho ba giáo viên cùng trường ở căn hộ của mình.
# Dựng: cd agents && python -m lesson_video build ../books/book_oxford_word_skills_basic/lessons/U39-kitchen.yaml
