# Video Oxford Word Skills Basic · Unit 18 — I can talk about clothes (sách in tr. 49–50, Answer key tr. 209).
# Khuôn: file 09 mục 5.2 (unit thường, 7–10 phút). Không `wait` / `echo`; không khoảng lặng từ 3 giây.
# Bài trong sách: đủ 1–8. Bài 1, 3, 5, 6 theo Answer key tr. 209 (bài 3: "a pale yellow top" là T theo Answer key). Bài 7
# (ABOUT YOU): Tom và Emma hỏi đáp (cảnh Nói 1). Bài 2, 4, 8 (Test yourself): Emma / Tom nhắc che chữ, nhìn tranh, nói lại.
# Thêm ngoài sách: wear / put on; cách đọc suit, sweater; mặc gì khi đi phỏng vấn, đi biển, trời mưa…; Nghe và viết; Nói 2
# (Part 1 "Clothes").
# Hình trong sách: tranh 12 món quần áo (tr. 49, khung theo tranh), bảng màu (khung theo ô màu), tranh quần áo cạnh câu
# đúng / sai của bài 3, hai dải tranh phụ kiện (tr. 50, khung theo tranh).
# Chi tiết nhân vật (khớp file 06 mục 9.4, file 09 mục 5.7): Tom không đeo kính, mặc áo phông, quần jean, giày thể thao đi học
# ("đồng phục sinh viên"), có ba đôi giày thể thao; làm ở quán mặc áo sơ mi đen; đeo kính râm mùa khô; ở TP. HCM không bao
# giờ quàng khăn, ở Đà Lạt tháng 12 thì có; luôn đeo đồng hồ (quà của bố). Emma đi dạy mặc váy dài hoặc quần và áo sơ mi,
# đi dép xăng-đan; giày thể thao khi đi bộ đường dài; kính râm và mũ suốt; hầu như không đeo đồng hồ (xem giờ trên điện
# thoại); mùa mưa luôn mang ô.
# Dựng: cd agents && python -m lesson_video build ../books/book_oxford_word_skills_basic/lessons/U18-clothes.yaml
