# Video Oxford Word Skills Basic · Unit 31 — I can ask for and give directions (sách in tr. 82–83, Answer key tr. 212).
# Khuôn: file 09 mục 5.2 (unit thường, 7–10 phút). Không `wait` / `echo`; không khoảng lặng từ 3 giây (câu cuối cảnh tự trả
# lời `pause: 1.0`).
# Bài trong sách: đủ 1–4. Bài 1–3 theo Answer key tr. 212 (bài 3: ba hội thoại, mỗi hội thoại một cảnh, bản đồ nhỏ của sách bên
# trái). Bài 4 (Test yourself): che chữ tr. 82, nhìn năm sơ đồ, nói lại lời chỉ đường — cảnh riêng, tạm dừng rồi nghe Tom.
# Thêm ngoài sách: giới từ chỉ vị trí (next to, between, opposite, on the corner, at the end of, behind) — hay gặp ở bài bản đồ IELTS
# Listening; câu khi bị lạc (on foot, could you say that again?); chỉ đường ở thành phố Việt Nam (alley, crossroads, traffic lights,
# go past); câu đố tình huống; Nghe và viết; Nói 1 (chỉ đường quanh nhà, quanh trường); Nói 2: đóng vai chỉ đường cho khách du lịch
# (Emma hỏi).
# Hình trong sách: ba câu hỏi đường và Spotlight Excuse me (tr. 82), năm sơ đồ chỉ đường kèm lời (ba cảnh), ba bản đồ bài 3 (tr. 83).
# Chi tiết nhân vật (khớp file 06 mục 9.4, file 09 mục 5.7): chợ nhỏ sau trường đại học, cách căn hộ của Tom năm phút đi bộ (U26);
# hiệu thuốc dưới căn hộ (U23), trạm xe buýt trước hiệu thuốc (U29); quán cà phê gần trường của Emma, nơi Emma chấm bài chiều thứ
# Bảy (U27); Emma hơi sợ giao thông (hồ sơ), đi lại bằng xe ôm công nghệ (U17). Mới: Tom ít hỏi đường, dùng bản đồ trên điện thoại;
# ở Đà Lạt khách du lịch hay hỏi Tom đường ra chợ; nhiều bạn của Tom sống trong hẻm. Quán cà phê gần trường Emma ở góc đường, đối
# diện ngân hàng; Emma luôn xem bản đồ trên điện thoại.
# Dựng: cd agents && python -m lesson_video build ../books/book_oxford_word_skills_basic/lessons/U31-directions.yaml
