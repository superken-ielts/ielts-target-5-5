# Video Oxford Word Skills Basic · Unit 44 — I can talk about jobs (sách in tr. 114–115, Answer key tr. 215).
# Khuôn: file 09 mục 5.2 (unit thường, 7–10 phút). Không `wait` / `echo`; không khoảng lặng từ 3 giây (câu cuối cảnh tự trả
# lời `pause: 1.0`).
# Bài trong sách: đủ 1–5. Bài 1, 2, 3 theo Answer key tr. 215. Bài 4 (ABOUT YOU): Tom và Emma nói về người quen làm các nghề trong
# danh sách (cảnh Nói 1). Bài 5 (Test yourself): năm hàng tranh cắt bỏ dòng chữ (đáp án hiện thành nhãn khi Tom trả lời), rồi cột
# Meaning của bảng — Emma đọc nghĩa, Tom nói từ.
# Thêm ngoài sách: thêm nghề hay gặp ở Việt Nam (waiter / waitress, farmer, factory worker, tour guide, receptionist, delivery
# driver); Nghe và viết; Nói 2 (Part 1 "Work").
# Hình trong sách: lời hỏi What do you do? và Spotlight a / an with jobs, 15 tranh nghề (ba cảnh, khung theo tranh), bảng
# self-employed … boss (khung theo hàng) — đo bằng máy.
# Chi tiết nhân vật (khớp file 06 mục 9.4, file 09 mục 5.7): Tom làm thêm phục vụ ở quán cà phê gần trường, quản lý (nữ) nghiêm nhưng
# công bằng; bố làm cho công ty cà phê, mẹ có cửa hàng hoa (tự làm chủ), chị Hoa là y tá ở Hà Nội, ông là thầy giáo Toán đã nghỉ hưu,
# chăm vườn, chú là phi công; Emma dạy tiếng Anh ở trường có 12 giáo viên từ 5 nước, bố mẹ sắp nghỉ hưu. Mới: chú của Tom bay đi
# Singapore và Bangkok; Tom không quen ai là lính; giám đốc trường của Emma (nữ) tốt bụng, giúp giáo viên mới.
# Dựng: cd agents && python -m lesson_video build ../books/book_oxford_word_skills_basic/lessons/U44-jobs.yaml
