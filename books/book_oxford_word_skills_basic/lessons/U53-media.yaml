# Video Oxford Word Skills Basic · Unit 53 — I can talk about the media (sách in tr. 136–137, Answer key tr. 218).
# UNIT KHÓ (đợt 42): 39 mục Word list, từ trừu tượng (media, opinion, event, disaster, celebrity), cặp động từ dễ nhầm watch / see,
# listen / hear, giới từ in the paper ≠ on TV / on the radio, all / most / some / none of it, news là danh từ không đếm được; tin tức
# và TV là chủ đề IELTS Part 1 hay gặp, "a TV programme you enjoy" là đề Part 2 — video khoảng 13 phút: phần sách, rồi câu nói về tin
# tức kiểu IELTS, ÔN TẬP (lỗi hay gặp) và LUYỆN NÓI CHUNG (Part 2 "a TV programme you enjoy", hai bài mẫu; ba câu thảo luận kiểu Part 3).
# Unit cuối module Hobbies and interests: tổng kết nhắc làm Review tr. 138–140. Khuôn: file 09 mục 5.2. Không `wait` / `echo`; không
# khoảng lặng từ 3 giây (câu cuối cảnh tự trả lời `pause: 1.0`). Không có cảnh "Nghe và viết": unit có video nghe – viết riêng.
# Bài trong sách: đủ 1–6 theo Answer key tr. 218 (bài 1: đáp án hiện thành nhãn trên từng hàng của bảng; bài 5: câu hai chỗ trống tách
# a / b). Bài 3 (Test yourself): cột Meaning của bảng (hai cảnh) — Emma đọc nghĩa, Tom nói từ, đáp án hiện thành nhãn. Bài 6 (ABOUT
# YOU): Tom và Emma trả lời bảng hỏi (cảnh Nói 2).
# Hình trong sách: bảng Word – Example – Meaning (hai cảnh, khung theo hàng), bảng bài 1, cột Meaning (hai cảnh), bảng hỏi Media
# questionnaire (bốn cảnh, khung theo câu hỏi rồi từng phương án), Glossary (ba cảnh), Spotlight watch / see / listen / hear — đo
# bằng máy.
# Chi tiết nhân vật (khớp file 06 mục 9.4, file 09 mục 5.7): Tom đọc tin trên điện thoại, không xem TV nhiều (xem phim trên laptop),
# nghe nhạc trực tuyến; Emma hay vào một trang tin của Anh và YouTube, mê truyện trinh thám, gọi cho mẹ mỗi Chủ nhật. Mới: Tom không mua
# báo, đọc tin trên ứng dụng để biết chuyện gì đã xảy ra, không nghe đài, tin một phần tin trên mạng; xem Planet Earth (phim tài liệu
# thiên nhiên của BBC, David Attenborough kể chuyện) trên laptop, thích nhất phần về đại dương; Emma đọc các bài báo hay trên trang tin của
# Anh, tối nào cũng xem bản tin, nghe tin buổi sáng trên đài BBC qua mạng khi nấu bữa sáng, tin phần lớn tin tức; xem phim truyền hình
# Sherlock (Benedict Cumberbatch đóng Sherlock Holmes) với anh Jack.
# Dựng: cd agents && python -m lesson_video build ../books/book_oxford_word_skills_basic/lessons/U53-media.yaml
