# Video Oxford Word Skills Basic · Unit 14 — I can talk about character (sách in tr. 36–37, Answer key tr. 207–208).
# UNIT KHÓ (đợt 29): tính từ chỉ tính cách trừu tượng, lại là nền cho IELTS Part 2 "describe a person" — video dài khoảng
# 12 phút: phần sách, rồi ÔN TẬP (lỗi hay gặp, cặp trái nghĩa) và LUYỆN NÓI CHUNG (Part 2 "a person you know who is very
# kind", hai bài mẫu Tom và Emma; ba câu thảo luận kiểu Part 3). Khuôn: file 09 mục 5.2. Không `wait` / `echo`.
# Hình trong sách: bảng tính từ tr. 36 (hai dải, khung theo dòng đang học), khung Spotlight "What's … like?" tr. 36 và
# "really" tr. 37, đoạn văn của Gemma tr. 37 (khung theo câu có từ trong Glossary).
# Đáp án bài 1, 2, 3, 5 theo Answer key; bài 4 (really + tính từ) làm cùng Spotlight; bài 6 (ABOUT YOU): câu mẫu "Answers
# from a British person" rồi Tom và Emma tự trả lời trong phần nói.
# Chi tiết nhân vật (khớp hồ sơ file 06 mục 9.4 và file 09 mục 5.7): Tom hơi trầm lúc mới quen, chăm chỉ, biết lắng nghe
# (hồ sơ: điểm mạnh), bàn học gọn nhưng phòng bừa; Khoa vui tính, tốt bụng, chăm chỉ, học y ở Hà Nội (khớp
# U01-speaking-practice-4); thầy Nam dạy Hóa tốt bụng,
# vui, nghiêm khắc chuyện bài tập; ông Tom (thầy Toán về hưu) kiên nhẫn, tốt bụng — bài nói Part 2 của Tom.
# Emma hòa đồng, khá thoải mái, ở nhà không gọn gàng (bếp bừa sau khi nấu); Lucy rất hòa đồng, ngăn nắp — hai người trái
# ngược; cô Green thông minh, tốt bụng, làm tiếng Anh thành niềm vui; bà Emma tốt bụng (đan áo cho cả nhà, luôn có bánh) —
# bài nói Part 2 của Emma; Emma hồi thiếu niên rất nhút nhát, đi dạy giúp tự tin hơn.
# Dựng: cd agents && python -m lesson_video build ../books/book_oxford_word_skills_basic/lessons/U14-character.yaml
