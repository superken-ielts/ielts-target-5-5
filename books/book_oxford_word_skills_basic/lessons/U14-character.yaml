  - kind: qa
    chapter: "Nói 1: bạn là người thế nào?"
    heading: "Speaking 1 · What are you like?"
    heading_vi: "Tạm dừng sau mỗi câu hỏi để tự trả lời, rồi nghe câu mẫu"
    items:
      - q: "What are you like, Tom?"
        a: "I'm quite quiet when I meet new people, but I'm friendly when I know them. My friends say I'm hardworking, and a good listener."
        ask: emma
        by: tom
        phrases: ["quite quiet", "but I'm friendly when…", "a good listener"]
      - q: "And you, Emma?"
        a: "I'm sociable and quite relaxed. But I'm not very tidy at home. My kitchen is always a mess after I cook!"
        ask: tom
        by: emma
        phrases: ["I'm sociable", "not very tidy", "always a mess"]
      - q: "What's your best friend like?"
        a: "Khoa? He's really funny and kind. He's always smiling, and he makes everyone laugh. And he's very hardworking. He studies medicine in Hanoi."
        ask: emma
        by: tom
        phrases: ["really funny and kind", "makes everyone laugh", "very hardworking"]
      - q: "What's Lucy like?"
        a: "She's really sociable. She talks to everyone! And she's very organized, but I'm not. We're complete opposites in some ways."
        ask: tom
        by: emma
        phrases: ["really sociable", "very organized", "complete opposites"]
      - q: "Are you tidy or untidy?"
        a: "Both! My desk is tidy, because I study there. But my flatmates say my room is very untidy."
        ask: emma
        by: tom
        phrases: ["Both!", "My desk is tidy", "very untidy"]
      - q: "What was your favourite teacher like?"
        a: "Mr Nam, my chemistry teacher. He was kind and really funny, but he was very serious about homework!"
        ask: emma
        by: tom
        phrases: ["kind and really funny", "very serious about…"]
      - q: "And yours, Emma?"
        a: "Mrs Green, my English teacher. She was clever and kind, and she made English fun. She's the reason I became a teacher."
        ask: tom
        by: emma
        phrases: ["clever and kind", "made English fun", "the reason I…"]
      - q: "Are you sporty?"
        a: "Yes. I play basketball twice a week, and I like swimming too, but I'm not very good at it."
        ask: emma
        by: tom
        phrases: ["Yes.", "twice a week", "not very good at it"]
      - q: "What kind of people do you like?"
        a: "Friendly, relaxed people. And I don't like people who are horrible to waiters. That tells you a lot about someone!"
        ask: tom
        by: emma
        phrases: ["Friendly, relaxed people", "I don't like people who…", "tells you a lot"]
