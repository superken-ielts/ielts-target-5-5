# Video Oxford Word Skills Basic · Unit 20 — I can talk about money (sách in tr. 54–55, Answer key tr. 209). Học sau Unit 1.
# Khuôn: file 09 mục 5.2 (unit thường, 7–10 phút). Không `wait` / `echo`; không khoảng lặng từ 3 giây.
# Bài trong sách: đủ 1–6. Bài 1–5 theo Answer key tr. 209. Bài 6 (ABOUT YOU AND YOUR COUNTRY): Tom trả lời về Việt Nam, Emma về
# nước Anh (cảnh Nói 1; Answer key là câu của "a Greek person").
# Thêm ngoài sách: đọc giá tiền đồng Việt Nam (fifty thousand dong, one point five million dong); nghe và viết giá tiền;
# câu hay dùng ở chợ (discount, Keep the change); Nghe và viết; Nói 2 (Part 1 "Money and shopping").
# Hình trong sách: 7 tranh tiền mặt, thẻ, máy nhập PIN, séc, hóa đơn (tr. 54, khung theo tranh), đoạn văn đi mua CD (khung theo
# dòng, Glossary bên phải), khung Spotlight Money, 7 quảng cáo (tr. 55, khung theo quảng cáo).
# Chi tiết nhân vật (khớp file 06 mục 9.4, file 09 mục 5.7): Tom tiêu khoảng 700.000 đồng một tuần cho ăn uống; hay mua sách,
# ốp điện thoại trực tuyến; cước điện thoại khoảng 100.000 đồng một tháng; về Đà Lạt bằng xe khách, vé khoảng 300.000 đồng;
# nhận lương làm thêm ở quán cà phê bằng chuyển khoản; đang để dành tiền đi trao đổi ở Úc. Emma: ở Anh vé tàu rất đắt, nước
# máy ở nhà hàng miễn phí; ở Việt Nam thích trà đá miễn phí ở quán ăn.
# Dựng: cd agents && python -m lesson_video build ../books/book_oxford_word_skills_basic/lessons/U20-money.yaml
