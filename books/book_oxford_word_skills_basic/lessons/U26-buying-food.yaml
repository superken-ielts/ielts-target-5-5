# Video Oxford Word Skills Basic · Unit 26 — I can buy food in a shop (sách in tr. 68–70, Answer key tr. 210–211).
# UNIT KHÓ (đợt 38): 3 trang — thực phẩm đếm được / không đếm được, đồ đựng và số lượng (a carton of, a packet of, half a kilo…),
# hội thoại mua thực phẩm, how much / how many (chủ đề hay gặp ở IELTS General Training) — video khoảng 13 phút: phần sách, rồi
# đóng vai ở chợ, ÔN TẬP (lỗi hay gặp) và LUYỆN NÓI CHUNG (Part 2 "a shop or market where you often buy food", hai bài mẫu; ba
# câu thảo luận kiểu Part 3). Khuôn: file 09 mục 5.2. Không `wait` / `echo`; không khoảng lặng từ 3 giây (câu cuối cảnh tự trả
# lời `pause: 1.0`). Không có cảnh "Nghe và viết": unit có video nghe – viết riêng.
# Bài trong sách: đủ 1–8. Bài 1, 2, 4, 5, 7, 8 theo Answer key tr. 210–211. Bài 3, 6 (Test yourself): Emma nhắc che chữ, nhìn
# tranh, nói lại. Bài 4 (nhớ tranh 30 giây rồi che): Emma nhắc tạm dừng video để nhìn tranh, không đếm ngược.
# Hình trong sách: ba hàng tranh thực phẩm kèm Spotlight Uncountable nouns (tr. 68), tranh đồ đựng, cân và ca đong kèm Spotlight
# tin and can (tr. 69), hai hội thoại (tr. 70, khung theo dòng — Tom đọc người bán SA, Emma đọc khách C), Glossary, Spotlight how
# much and how many.
# Chi tiết nhân vật (khớp file 06 mục 9.4, file 09 mục 5.7): Tom cùng hai bạn cùng phòng đi chợ gần căn hộ sáng thứ Bảy (U17),
# tiêu khoảng 700.000 đồng một tuần cho ăn uống (U20), mua gạo, trứng, rau, thịt lợn, mì; mua bánh mì ở tiệm đầu ngõ; về Đà Lạt
# thì đi chợ Đà Lạt với mẹ. Emma đi chợ sáng thứ Bảy rồi nấu món mới (U17), hỏi giá được (U25); mua phô mai và bơ ở một cửa hàng
# nhỏ bán đồ nhập khẩu vì chợ không có; nhớ bánh mì kiểu Anh.
# Dựng: cd agents && python -m lesson_video build ../books/book_oxford_word_skills_basic/lessons/U26-buying-food.yaml
