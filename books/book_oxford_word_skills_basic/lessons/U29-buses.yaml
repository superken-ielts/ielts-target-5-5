# Video Oxford Word Skills Basic · Unit 29 — I can get around on buses (sách in tr. 78–79, Answer key tr. 211).
# Khuôn: file 09 mục 5.2 (unit thường, 7–10 phút). Không `wait` / `echo`; không khoảng lặng từ 3 giây (câu cuối cảnh tự trả
# lời `pause: 1.0`).
# Bài trong sách: đủ 1–5. Bài 1–3 theo Answer key tr. 211 (bài 3: câu có hai chỗ trống tách thành hai mục). Bài 4 (ABOUT YOU):
# Tom và Emma hỏi đáp (cảnh Nói 1); Emma dùng câu trả lời mẫu "from a British person" của Answer key cho nhà bố mẹ ở Anh. Bài 5
# (Test yourself): che câu trả lời, nhìn bản đồ — video hỏi thêm câu mới về cùng bản đồ, tạm dừng rồi nghe Tom.
# Thêm ngoài sách: đi lại ở Việt Nam (xe buýt, xe khách, xe giường nằm, xe ôm đặt qua ứng dụng; Does this bus go to …? How much
# is the fare?); Nghe và viết; Nói 2 (Part 1 "Public transport").
# Hình trong sách: bản đồ tuyến 24 và 16 (khung theo trạm, bảng giờ), bảng hỏi – đáp (khung theo dòng, đo bằng máy), Glossary
# (tranh near / outside) và Spotlight How long does it take?; bản đồ lần nữa ở bài 5.
# Chi tiết nhân vật (khớp file 06 mục 9.4, file 09 mục 5.7): Tom đi bộ đến trường (U17), về Đà Lạt bằng xe khách khoảng bảy tiếng
# (U20); mới: trạm xe buýt ngay trước hiệu thuốc dưới căn hộ (hiệu thuốc: U23), tuyến 19 và 33, khoảng 15 phút một chuyến; thỉnh
# thoảng đi xe buýt ra chợ Bến Thành (U19). Emma đi làm bằng xe ôm công nghệ khoảng 20 phút (U17); mới: nhà bố mẹ ở Anh có trạm
# xe buýt cuối đường, tuyến 9 và 15, thỉnh thoảng đi vào trung tâm thị trấn (câu mẫu Answer key).
