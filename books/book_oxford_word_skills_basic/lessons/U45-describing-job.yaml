# Video Oxford Word Skills Basic · Unit 45 — I can describe a job (sách in tr. 116–117, Answer key tr. 215–216).
# UNIT KHÓ (đợt 41): 2 trang, hai phần — thông tin cơ bản về công việc (work in / for, full-time / part-time, long hours, earn,
# salary ≠ wages, low ≠ high) và việc phải làm (have to, meet clients, discuss, colleague, report, organize, answer the phone,
# spend time doing); "Work" là chủ đề Part 1 bắt buộc, "a job you would like to do in the future" là đề Part 2 hay gặp — video
# khoảng 13 phút: phần sách, rồi câu tả công việc kiểu IELTS, ÔN TẬP (lỗi hay gặp) và LUYỆN NÓI CHUNG (Part 2 "a job you would like
# to do in the future", hai bài mẫu; ba câu thảo luận kiểu Part 3). Khuôn: file 09 mục 5.2. Không `wait` / `echo`; không khoảng lặng
# từ 3 giây (câu cuối cảnh tự trả lời `pause: 1.0`). Không có cảnh "Nghe và viết": unit có video nghe – viết riêng.
# Bài trong sách: đủ 1–5. Bài 1, 2, 4, 5 theo Answer key tr. 215–216 (bài 1: khung từ của sách hiện trước; bài 4: sáu câu sai, hai
# câu đúng). Bài 3 (ABOUT YOU): Emma hỏi Tom về việc làm thêm, Tom hỏi Emma (cảnh Nói 1).
# Hình trong sách: thông tin cơ bản (hai cảnh, khung theo câu), Glossary A, khung từ bài 1, tranh văn phòng 1–5, lời kể của Daniel
# Alessi và Eliane Sotano (hai cảnh, khung theo dòng), Spotlight spend time doing, Glossary B (hai cảnh) — đo bằng máy.
# Chi tiết nhân vật (khớp file 06 mục 9.4, file 09 mục 5.7): Tom làm thêm phục vụ ở quán cà phê gần trường, tối thứ Ba và thứ Năm 6–10
# giờ, quản lý (nữ) nghiêm nhưng công bằng; muốn làm trưởng phòng marketing cho công ty cà phê quốc tế, một ngày có thương hiệu cà phê
# Đà Lạt riêng; Emma dạy khoảng 25 giờ một tuần, trường có 12 giáo viên từ 5 nước, một ngày muốn mở trường ngoại ngữ nhỏ có quán cà phê
# ở quê ven biển. Mới: Tom làm 8 tiếng một tuần, nhận đồ uống, pha cà phê, lau bàn; Emma soạn bài, dạy, chấm bài, họp giáo viên mỗi
# tuần một lần, dạy cả trực tuyến.
# Dựng: cd agents && python -m lesson_video build ../books/book_oxford_word_skills_basic/lessons/U45-describing-job.yaml
