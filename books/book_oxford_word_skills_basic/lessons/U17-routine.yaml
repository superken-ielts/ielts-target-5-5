  - kind: qa
    chapter: "Bài 3: về bạn"
    heading: "Exercise 3 · About you: Tom answers the questions"
    heading_vi: "Answer key in tám câu trả lời mẫu cho sáu câu hỏi — cứ trả lời sáu câu của bài 2"
    items:
      - q: "What time do you usually get up in the morning?"
        a: "At about half past six. I'm not a morning person, so I need a coffee first!"
        ask: emma
        by: tom
        phrases: ["At about…", "I'm not a morning person"]
      - q: "Do you get dressed before or after breakfast?"
        a: "After breakfast. I have breakfast first, and then I get dressed."
        ask: emma
        by: tom
        phrases: ["After breakfast.", "first, and then…"]
      - q: "Do you have a shower in the morning?"
        a: "Yes, every morning. In Ho Chi Minh City, it's always hot!"
        say: "Yes, every morning. In Ho Chee Min City, it's always hot!"
        ask: emma
        by: tom
        phrases: ["Yes, every morning."]
      - q: "What time do you leave home, and get to university?"
        a: "I leave home at about ten past seven. I walk, and I get to university at about twenty-five past."
        ask: emma
        by: tom
        phrases: ["I leave home at…", "I get to … at…"]
      - q: "Who do you have dinner with?"
        a: "With my two flatmates. We share the cooking. But on Tuesdays and Thursdays, I have dinner at the café, because I work there."
        ask: emma
        by: tom
        phrases: ["With my…", "We share…", "on Tuesdays and Thursdays"]
      - q: "What time do you normally go to bed?"
        a: "At about half past eleven. So I sleep about seven hours a night."
        ask: emma
        by: tom
        phrases: ["At about…", "I sleep … a night"]
