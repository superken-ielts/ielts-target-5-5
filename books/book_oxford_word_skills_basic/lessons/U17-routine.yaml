# Video Oxford Word Skills Basic · Unit 17 — I can describe my routine (sách in tr. 46–48, Answer key tr. 208).
# UNIT KHÓ (đợt 37): 3 trang, nhiều cụm động từ sinh hoạt (get up, get dressed, leave home…), cụm cuối tuần (stay in, come
# round, go out…) và trạng từ tần suất (always → never, every / all) — video khoảng 13 phút: phần sách, rồi ÔN TẬP (lỗi hay
# gặp) và LUYỆN NÓI CHUNG (Part 2 "your favourite day of the week", hai bài mẫu; ba câu thảo luận kiểu Part 3).
# Khuôn: file 09 mục 5.2. Không `wait` / `echo`; không khoảng lặng từ 3 giây.
# Bài trong sách: đủ 1–9. Bài 1, 2, 5–8 theo Answer key tr. 208. Bài 3 (ABOUT YOU): Tom trả lời sáu câu của bài 2 — Answer
# key in tám câu trả lời mẫu của "a Japanese person" cho sáu câu hỏi (in lệch, file 09 mục 3.3), video nói rõ. Bài 4 (Test
# yourself): Tom nhắc che chữ, nhìn tranh, nói lại. Bài 9: Tom trả lời đúng / sai cho chính mình (Answer key là câu của "a
# British person").
# Không có cảnh "Nghe và viết" (mục 5.2 hàng 5): bài trong sách đã dài, và unit có video nghe – viết riêng (U17-routine-dictation).
# Hình trong sách: 10 tranh việc trong ngày và khung Spotlight usually / normally (tr. 46, hai cảnh), đoạn văn cuối tuần kèm
# Glossary (tr. 47, hai cảnh, khung theo dòng), bảng tìm cụm từ bài 5 (khung theo cụm), thang tần suất, ghi chú vị trí trạng
# từ và Spotlight every / all (tr. 48).
# Chi tiết nhân vật (khớp file 06 mục 9.4, file 09 mục 5.7): Tom dậy khoảng 6:30 (U02), Chủ nhật sau 9 giờ; ăn sáng trước rồi
# mới thay đồ; đi bộ 15 phút đến trường (U11), lớp đầu tiên 7:30; ăn tối với hai bạn cùng phòng (chia nhau nấu, U15), thứ Ba
# và thứ Năm làm ở quán cà phê đến 10 giờ tối (hồ sơ); đi ngủ khoảng 11:30, ngủ khoảng bảy tiếng; sáng thứ Bảy cùng bạn cùng
# phòng đi chợ (do the shopping), chiều thứ Bảy chơi bóng rổ (hai buổi một tuần), tối xem phim khoa học viễn tưởng; Chủ nhật
# gọi video cho bố mẹ ở Đà Lạt, ôn IELTS. Emma dậy 6 giờ, học tiếng Việt nửa tiếng trước bữa sáng (U02); đi làm bằng xe ôm
# công nghệ (không đi xe máy); dạy khoảng 25 giờ một tuần, thường xong lúc 6 giờ chiều; học tiếng Việt tối thứ Hai và thứ Tư
# (hai buổi một tuần, hồ sơ); đi ngủ khoảng 10:30; sáng thứ Bảy đi chợ rồi nấu ăn (sở thích nấu ăn), thỉnh thoảng đi bộ đường
# dài cuối tuần; Chủ nhật gọi video cho mẹ (U16), đọc truyện trinh thám.
