# Video Oxford Word Skills Basic · Unit 19 — I can buy clothes (sách in tr. 51–53, Answer key tr. 209). Học sau Unit 18.
# UNIT KHÓ (đợt 37): 3 trang — tính từ tả quần áo theo cặp trái nghĩa, hỏi cỡ, too / very, hội thoại trong cửa hàng (chủ đề
# hay gặp ở IELTS General Training) — video khoảng 13 phút: phần sách, rồi ÔN TẬP (lỗi hay gặp) và LUYỆN NÓI CHUNG (Part 2
# "the last time you bought some clothes", hai bài mẫu; ba câu thảo luận kiểu Part 3). Khuôn: file 09 mục 5.2.
# Không `wait` / `echo`; không khoảng lặng từ 3 giây. Không có cảnh "Nghe và viết": unit có video nghe – viết riêng.
# Bài trong sách: đủ 1–9. Bài 1–3, 5–8 theo Answer key tr. 209. Bài 4 (Test yourself): Tom nhắc che chữ, nhìn tranh, nói lại.
# Bài 9 (ABOUT YOU): Tom và Emma hỏi đáp (cảnh Nói 1; Answer key là câu của "a Turkish person").
# Thêm ngoài sách: cách đọc comfortable; câu hỏi thêm khi mua đồ (How much are they? bigger size, just looking); đóng vai mua đồ (Emma là người bán, người học là khách); câu đố too / very.
# Hội thoại trong cửa hàng (tr. 53): Tom đọc lời người bán (SA), Emma đọc lời khách (C), mỗi dòng có khung đỏ và giải nghĩa
# theo Glossary — thay cho việc đọc riêng Glossary.
# Hình trong sách: 12 tranh tả quần áo và hai bong bóng nice / horrible (tr. 51), bảng hỏi cỡ, ảnh cửa hàng (tr. 52), khung
# Spotlight too / very, 4 tranh bài 6, hội thoại tr. 53 (hai cảnh, khung theo dòng).
# Chi tiết nhân vật (khớp file 06 mục 9.4, file 09 mục 5.7, U18): Tom mua áo sơ mi đen ở chợ Bến Thành trước ngày đầu làm ở
# quán (tháng 9), cỡ M, 150.000 đồng, thử áo L trước thì quá rộng; thích mua đồ trực tuyến hơn nhưng quần áo thì phải thử.
# Emma mua đôi giày đi bộ đường dài (sở thích hồ sơ) ở một cửa hàng thể thao tháng trước, cỡ 39, khoảng hai triệu đồng, trả
# bằng thẻ ghi nợ; ở Việt Nam khó tìm cỡ giày của Emma; mua quần áo khoảng ba lần một năm, thường ở chợ.
