# Video Oxford Word Skills Basic · Unit 11 — I can describe physical actions (sách in tr. 30–31, Answer key tr. 207).
# Khuôn video: docs/agent-hoc-tap/09-oxford-word-skills-basic.md mục 5 (7–10 phút, không đếm ngược, 1–2 phần nói, nghe và viết).
# Đáp án bài 1, 2, 4, 5 theo Answer key. Bài 4 (đảo chữ) và bài 5 (một tay hay hai tay) làm thành câu đố.
# Hình trong sách (đợt 29): tranh động từ tr. 30–31 (cảnh figure, khung đỏ theo động từ đang nói).
# Thêm ngoài sách: làm theo lời Emma (Stand up! Pick up your pen!…); luyện nhanh quá khứ bất quy tắc; chuyện thứ Bảy của
# Tom (nghe, đếm động từ quá khứ); chủ đề nói IELTS Part 1 đi bộ, đạp xe, leo núi, nhảy.
# Chi tiết nhân vật (khớp hồ sơ): Tom đạp xe đi học ở Đà Lạt nhiều dốc, trời mưa thì bố chở bằng xe máy; đi bộ 15 phút đến
# trường; chơi bóng rổ. Mới: Tom chơi bóng rổ hai buổi một tuần, đã leo núi Langbiang (ba tiếng); Emma không dám đi xe
# máy ở TP. HCM (đi bộ hoặc xe ôm công nghệ), nhảy rất tệ, tháng trước trượt ngã trên đường ướt, làm rơi túi; thứ Bảy vừa
# rồi Tom ngã trên xe buýt, thắng trận bóng rổ, làm rơi trứng nên ăn tối bằng món trứng tráng (Tom chỉ biết nấu mì và trứng);
# Tom đi xe buýt đông thì đứng suốt, học từ mới thì vừa đi vừa đọc to; Emma năm 12 tuổi làm vỡ guitar của anh Jack.
# Dựng: cd agents && python -m lesson_video build ../books/book_oxford_word_skills_basic/lessons/U11-actions.yaml
