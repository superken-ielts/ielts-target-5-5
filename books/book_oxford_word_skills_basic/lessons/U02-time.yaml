# Video Oxford Word Skills Basic · Unit 2 — I can tell the time (sách in tr. 15, Answer key tr. 205).
# Khuôn video: docs/agent-hoc-tap/09-oxford-word-skills-basic.md mục 5 (7–10 phút, không đếm ngược, 1–2 phần nói).
# Đáp án bài 1, 2, 4 theo Answer key; bài 5 (ABOUT YOUR COUNTRY): câu của Emma theo "Answers from a British person"
# trong Answer key, câu của Tom tự viết về Việt Nam (giờ ngân hàng, cửa hàng, quán cà phê nói chung, có "about").
# Dựng: cd agents && python -m lesson_video build ../books/book_oxford_word_skills_basic/lessons/U02-time.yaml
id: U02-time
activity: U02-words
title: "Unit 2 · The time"
subtitle: "I can tell the time"
title_vi: "Giờ giấc — hỏi và nói giờ, past / to, quarter / half, a.m. / p.m., in the morning, midday, nearly, just after"
tag: "BASIC ENGLISH · UNIT 2"
speakers:
  # giọng theo bộ đọc: kokoro (mặc định khi có model) hoặc flite (dự phòng, có sẵn trên Ubuntu)
  emma: {name: Emma, role: teacher, color: "#C8102E", voice: {kokoro: af_heart, flite: slt}}
  tom: {name: Tom, role: student, color: "#1F5FAD", voice: {kokoro: am_michael, flite: rms}}

scenes:
  - kind: title
    chapter: "Giới thiệu"
    lines:
      - emma: "Welcome to Unit 2: the time. After this video, you can ask the time, and tell the time in two different ways."
        say: "Welcome to Unit two: the time. After this video, you can ask the time, and tell the time in two different ways."
        vi: "Unit 2: hỏi giờ và nói giờ theo hai cách."
      - tom: "No countdown again. When Emma asks you something, pause the video and answer. Then listen to us."
        vi: "Không có đếm ngược: Emma hỏi thì tự tạm dừng video và trả lời, rồi nghe tiếp."

  - kind: bullets
    chapter: "Hỏi giờ, nói giờ"
    heading: "A · Telling the time"
    heading_vi: "What's the time? / What time is it? — hai cách nói giờ: past / to, hoặc đọc số như đồng hồ điện tử"
    items:
      - {en: "4.00  It's four o'clock.", vi: "o'clock chỉ dùng cho giờ đúng"}
      - {en: "4.15  It's quarter past four. · It's four fifteen.", vi: "past = hơn; quarter = 15 phút"}
      - {en: "4.30  It's half past four. · It's four thirty.", vi: "half past = rưỡi"}
      - {en: "4.45  It's quarter to five. · It's four forty-five.", vi: "to = kém: năm giờ kém mười lăm"}
      - {en: "6.20  It's twenty past six. · 6.40  It's twenty to seven.", vi: "past cho 1–30 phút, to cho 31–59 phút"}
      - {en: "6.57  It's three minutes to seven, NOT three to seven", vi: "số phút không phải 5, 10, 15, 20, 25 thì thêm minutes"}
    lines:
      - emma: "To ask the time, we say: what's the time? Or: what time is it?"
        vi: "Hỏi giờ: What's the time? hoặc What time is it?"
      - {tom: "It's four o'clock.", focus: 0}
      - {emma: "We only use o'clock for the exact hour.", focus: 0, vi: "o'clock chỉ dùng cho giờ đúng."}
      - {tom: "It's quarter past four. Or, it's four fifteen.", focus: 1}
      - {tom: "It's half past four. Or, four thirty.", focus: 2}
      - {tom: "It's quarter to five. Or, four forty-five.", focus: 3}
      - {emma: "Past is for the first thirty minutes. After that, we say to the next hour: twenty past six, twenty to seven.", focus: 4, vi: "1–30 phút dùng past; sau đó dùng to (kém) giờ kế tiếp."}
      - {tom: "It's three minutes to seven. Not three to seven.", focus: 5}
      - emma: "Right. When the number of minutes is not five, ten, fifteen, twenty or twenty-five, we say minutes."
        focus: 5
        vi: "Số phút lẻ (không phải 5, 10, 15, 20, 25) thì phải nói minutes."

  - kind: bullets
    chapter: "Buổi trong ngày"
    heading: "B · Giving more information"
    heading_vi: "a.m. = sáng (trước 12 giờ trưa), p.m. = chiều tối; nearly / almost = gần; just after = vừa quá"
    items:
      - {en: "9 a.m. = nine o'clock in the morning · 12.00 p.m. = midday", vi: "buổi sáng · giữa trưa"}
      - {en: "5 p.m. = five o'clock in the afternoon · 7 p.m. = seven o'clock in the evening", vi: "buổi chiều · buổi tối"}
      - {en: "11.30 p.m. = eleven thirty at night · 12.00 a.m. = midnight", vi: "ban đêm (at night) · nửa đêm"}
      - {en: "7.57 = nearly / almost eight o'clock · 8.02 = just after eight", vi: "gần tám giờ · tám giờ hơn một chút"}
    lines:
      - emma: "Sometimes we need more information. Is it nine in the morning, or nine at night?"
        vi: "Đôi khi cần nói rõ sáng hay tối."
      - {tom: "Nine a.m. is nine o'clock in the morning. Twelve p.m. is midday.", focus: 0}
      - {tom: "Five p.m. is five o'clock in the afternoon. Seven p.m. is seven o'clock in the evening.", focus: 1}
      - {tom: "Eleven thirty at night. And twelve a.m. is midnight.", focus: 2}
      - {emma: "Notice: in the morning, in the afternoon, in the evening, but at night.", focus: 2, vi: "in the morning / afternoon / evening, nhưng at night."}
      - {tom: "Seven fifty-seven is nearly eight o'clock, or almost eight. Eight oh two is just after eight.", focus: 3}

