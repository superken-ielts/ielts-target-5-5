      - {tom: "What time do shops close in England?", say: "What time do shops cloze in England?", focus: 2}
      - {emma: "Usually at half past five in the afternoon. On Thursdays, some shops stay open until seven p.m.", reveal: 2, vi: "Thường 5 rưỡi chiều; thứ Năm một số cửa hàng mở tới 7 giờ tối."}
      - {emma: "What about shops in Ho Chi Minh City?", say: "What about shops in Ho Chee Min City?", focus: 3}
      - {tom: "They close much later. Many small shops close at ten or eleven at night, and some are open twenty-four hours.", say: "They cloze much later. Many small shops cloze at ten or eleven at night, and some are open twenty-four hours.", reveal: 3, vi: "Muộn hơn nhiều: nhiều cửa hàng nhỏ đóng lúc 10–11 giờ đêm, có nơi mở 24 giờ."}
      - {tom: "When do post offices open and close?", say: "When do post offices open and cloze?", focus: 4}
      - {emma: "They open at nine a.m., and close at half past five in the afternoon.", say: "They open at nine a.m., and cloze at half past five in the afternoon.", reveal: 4, vi: "Mở 9 giờ sáng, đóng 5 rưỡi chiều."}
