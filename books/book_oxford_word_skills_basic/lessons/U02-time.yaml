  - kind: qa
    chapter: "Nói 1: giờ giấc ở nước bạn"
    heading: "Speaking 1 · About your country: opening times"
    heading_vi: "Bài 5 trong sách — Emma trả lời theo Answer key (người Anh), Tom nói về Việt Nam"
    items:
      - q: "Emma, when do banks open in England?"
        a: "At nine a.m. And they don't close at midday, so you can go at lunchtime."
        ask: tom
        by: emma
        phrases: ["At nine a.m.", "close at midday", "at lunchtime"]
      - q: "And in Vietnam, Tom?"
        a: "Most banks open at about eight in the morning. Many of them close for lunch at about half past eleven, and open again at one."
        ask: emma
        by: tom
        phrases: ["at about eight in the morning", "close for lunch", "open again at one"]
      - q: "What time do shops close in England?"
        a: "Usually at half past five in the afternoon. On Thursdays, some shops stay open until seven p.m."
        ask: tom
        by: emma
        phrases: ["half past five in the afternoon", "stay open until…"]
      - q: "What about shops in Ho Chi Minh City?"
        a: "They close much later. Many small shops close at ten or eleven at night, and some are open twenty-four hours."
        ask: emma
        by: tom
        phrases: ["much later", "ten or eleven at night", "open twenty-four hours"]
      - q: "When do post offices open and close?"
        a: "They open at nine a.m., and close at half past five in the afternoon."
        ask: tom
        by: emma
        phrases: ["They open at…", "close at…"]
      - q: "What time do people have dinner in England?"
        a: "Quite early, at about six or seven in the evening. Young children often eat at about half past five."
        ask: tom
        by: emma
        phrases: ["Quite early", "at about six or seven", "in the evening"]
      - q: "And in Vietnam?"
        a: "Families usually have dinner at about seven. At the weekend, we sometimes eat later, at nearly nine."
        ask: emma
        by: tom
        phrases: ["usually", "at about seven", "at nearly nine"]
      - q: "Are you a morning person, Tom?"
        a: "Not really! I need two coffees before I can talk to anyone. My best time is in the evening."
        ask: emma
        by: tom
        phrases: ["Not really!", "before I can…", "in the evening"]
      - q: "What about you, Emma?"
        a: "Yes, I am. I get up at six, and I study Vietnamese for half an hour before breakfast."
        ask: tom
        by: emma
        phrases: ["Yes, I am.", "at six", "before breakfast"]
      - q: "What time do cafés open in Vietnam?"
        a: "Very early, at about six in the morning. Lots of people have coffee before work, so cafés are busy just after six."
        ask: emma
        by: tom
        phrases: ["Very early", "before work", "just after six"]
    lines:
      - emma: "Speaking. Exercise 5 in the book asks about opening times in your country. Pause after each question, and answer for your country."
        say: "Speaking. Exercise five in the book asks about opening times in your country. Pause after each question, and answer for your country."
        vi: "Nói: bài 5 hỏi giờ mở cửa ở nước bạn — tạm dừng sau mỗi câu để tự trả lời."
