# Video Oxford Word Skills Basic · Unit 42 — I can talk about my school (sách in tr. 109–111, Answer key tr. 214–215).
# UNIT KHÓ (đợt 41): 3 trang, ba phần — môn học (be good at), hệ thống giáo dục (nursery → primary → secondary school, state /
# private school, leave school, college, university) và thi cử (take / pass / fail an exam, results, grade, mark, do well / badly);
# "work or study" là câu mở đầu IELTS Part 1, "a subject you enjoyed at school" là đề Part 2 hay gặp — video khoảng 14 phút: phần
# sách (bài 7: trường học ở Việt Nam), ÔN TẬP (lỗi hay gặp) và LUYỆN NÓI CHUNG (Part 2 "a subject you enjoyed at school", hai
# bài mẫu; ba câu thảo luận kiểu Part 3). Khuôn: file 09 mục 5.2. Không `wait` / `echo`; không khoảng lặng từ 3 giây (câu cuối cảnh
# tự trả lời `pause: 1.0`). Không có cảnh "Nghe và viết": unit có video nghe – viết riêng.
# Bài trong sách: đủ 1–10. Bài 1, 2, 5, 6, 8, 9 theo Answer key tr. 214–215 (bài 6 câu 3, 4, 5 và bài 9 câu 3, 5 có hai chỗ trống:
# 3a/3b…). Bài 3 (ABOUT YOU): câu của Tom và Emma. Bài 4 (Test yourself): ba hàng tranh môn học cắt bỏ dòng chữ, đáp án hiện thành
# nhãn khi Tom trả lời. Bài 5: cảnh `order` (Tom trong bài là người khác — video nói rõ). Bài 7 (ABOUT YOUR COUNTRY): Tom trả lời về
# Việt Nam (cảnh Nói 1). Bài 10 (ABOUT YOU): Emma hỏi Tom, rồi Tom hỏi Emma.
# Hình trong sách: hai cảnh tranh môn học (có chữ), ba hàng tranh để tự kiểm tra (không chữ), khung ghi chú ICT / PE / RE, Spotlight
# be good at, sơ đồ hệ thống giáo dục (khung theo ô), Glossary B hai cảnh, khung pupils / uniform, Spotlight at (the age of) (hai cảnh riêng), lời kể
# của Rafael (hai cảnh, khung theo câu), Glossary C, Spotlight exam, bảng điểm của Rafael — đo bằng máy.
# Chi tiết nhân vật (khớp file 06 mục 9.4, file 09 mục 5.7): Tom học trường công lớn gần hồ ở Đà Lạt, đồng phục sơ mi trắng quần
# xanh, thích Hóa (thầy Nam), thấy Lý khó, thi đại học năm 18 tuổi, ông (thầy giáo Toán đã nghỉ hưu) kèm Toán; Emma học trường nhỏ
# khoảng 400 học sinh, thích Anh văn và Mỹ thuật, kém Toán (thi trượt năm 15 tuổi, phải thi lại), học tiếng Pháp 5 năm, A level Anh
# văn – Pháp – Sử (A, A, B), cô Green dạy Anh văn là lý do Emma đi dạy. Mới: tiết học của Tom 45 phút; Tom thi các kỳ thi quan trọng
# năm 15 và 18 tuổi, năm 18 tuổi thi quốc gia sáu môn (Toán, Văn, tiếng Anh, Lý, Hóa, Sinh), đỗ cả, điểm Lý không cao; Emma không học
# tiếng Trung; Part 2: Tom kể môn Hóa với thầy Nam (trẻ, thân thiện, hay làm thí nghiệm), Emma kể môn Anh văn với cô Green.
