      - {tom: "How do you pronounce this word: c, o, m, f, o, r, t, a, b, l, e?", say: "How do you pronounce this word: see, oh, em, ef, oh, ar, tee, eigh, bee, el, ee?", focus: 2}
      - {emma: "Comfortable. It has three syllables, not four: comf, ta, ble.", say: "Comfortable. It has three syllables, not four. Comfortable.", reveal: 2, vi: "Comfortable chỉ có ba âm tiết, đừng đọc com-for-ta-ble."}
      - {emma: "What's the opposite of cheap?", focus: 3}
      - {tom: "Expensive. Like the coffee in big hotels!", reveal: 3, vi: "Đắt — như cà phê ở khách sạn lớn!"}
      - {tom: "What's the difference between look and see?", focus: 4}
      - {emma: "You look at something because you want to. You see things with your eyes, even when you don't try.", reveal: 4, vi: "look (at): chủ động nhìn; see: thấy, kể cả khi không cố ý."}
      - {emma: "How do you spell your family name?", focus: 5}
      - {tom: "Tran. T, R, A, N. It's one of the most common family names in Vietnam.", say: "Chan. Tee, ar, eigh, en. It's one of the most common family names in Vietnam.", reveal: 5, vi: "Trần — một trong những họ phổ biến nhất ở Việt Nam."}
      - {tom: "Island is pronounced is-land. Is that right?", say: "Island is pronounced iz-land. Is that right?", focus: 6}
      - {emma: "No, that's not right. The s is silent. It's island.", say: "No, that's not right. The ess is silent. It's island.", reveal: 6, vi: "Sai rồi: chữ s câm, đọc /ˈaɪlənd/."}
      - {emma: "Could you explain phở to an English person?", say: "Could you explain fuh to an English person?", focus: 7}
      - {tom: "Yes. It's a Vietnamese soup with rice noodles and beef or chicken. People often eat it for breakfast.", reveal: 7, vi: "Phở: món súp Việt Nam với bánh phở và thịt bò hoặc gà; người ta hay ăn vào bữa sáng."}

