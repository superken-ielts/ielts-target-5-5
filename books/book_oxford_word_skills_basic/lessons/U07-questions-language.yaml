      - {emma: "G and J are difficult too. G, J. G, J.", say: "Gee and jay are difficult too. Gee, jay. Gee, jay.", focus: 1}
      - {tom: "H, R, W, Y.", say: "Aitch, ar, double you, why.", focus: 2}
