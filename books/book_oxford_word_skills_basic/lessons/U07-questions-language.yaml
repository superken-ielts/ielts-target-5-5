  - kind: qa
    chapter: "Nói 1: hỏi về từ ngữ"
    heading: "Speaking 1 · Tom and Emma ask about words"
    heading_vi: "Tạm dừng sau mỗi câu hỏi để tự trả lời, rồi nghe câu mẫu"
    items:
      - q: "What does 'exhausted' mean?"
        a: "It means very, very tired. After two hours of basketball, you're exhausted!"
        ask: tom
        by: emma
        phrases: ["It means…", "very, very tired", "After…"]
      - q: "How do you say 'cà phê sữa đá' in English?"
        a: "Iced coffee with milk. It's my favourite drink. My dad works for a coffee company, so I drink a lot of it!"
        ask: emma
        by: tom
        phrases: ["Iced coffee with milk", "my favourite drink", "so I…"]
      - q: "How do you pronounce this word: c-o-m-f-o-r-t-a-b-l-e?"
        a: "Comfortable. It has three syllables, not four: COMF-ta-ble."
        ask: tom
        by: emma
        phrases: ["It has three syllables", "not four"]
      - q: "What's the opposite of 'cheap'?"
        a: "Expensive. Like the coffee in big hotels!"
        ask: emma
        by: tom
        phrases: ["Expensive.", "Like…"]
      - q: "What's the difference between 'look' and 'see'?"
        a: "You look at something because you want to. You see things with your eyes, even when you don't try."
        ask: tom
        by: emma
        phrases: ["You look at…", "You see…", "even when…"]
      - q: "How do you spell your family name?"
        a: "Tran. T-R-A-N. It's one of the most common family names in Vietnam."
        ask: emma
        by: tom
        phrases: ["T-R-A-N", "one of the most common…"]
      - q: "'Island' is pronounced is-land. Is that right?"
        a: "No, that's not right. The s is silent. It's island."
        ask: tom
        by: emma
        phrases: ["That's not right.", "The s is silent."]
      - q: "Could you explain 'phở' to an English person?"
        a: "Yes. It's a Vietnamese soup with rice noodles and beef or chicken. People often eat it for breakfast."
        ask: emma
        by: tom
        phrases: ["It's a … soup with…", "People often…", "for breakfast"]
