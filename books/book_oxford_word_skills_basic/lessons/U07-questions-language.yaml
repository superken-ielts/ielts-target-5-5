# Video Oxford Word Skills Basic · Unit 7 — I can ask and answer questions about language (sách in tr. 22, Answer key tr. 206).
# Khuôn video: docs/agent-hoc-tap/09-oxford-word-skills-basic.md mục 5 (7–10 phút, không đếm ngược, 1–2 phần nói, nghe và viết).
# Đáp án bài 1–2 theo Answer key (bài 1: 1f 2g 3a 4d 5b 6e; bài 2: called, pronounce, How do, between, right/correct,
# opposite, does, explain).
# Thêm ngoài sách: I don't know / I can't remember / I'm not sure; tomato kiểu Anh – Mỹ; tự đặt câu hỏi theo tình huống;
# chữ cái dễ nhầm (A/E/I, G/J, H, R, W, Y, double, capital); nghe và viết tên được đánh vần
# (như IELTS Listening Section 1, dùng tên trong hồ sơ nhân vật: Clarke, Tuan, Hughes, Green); mẹo xin nhắc lại câu hỏi
# khi thi nói. Chi tiết nhân vật mới: Tom vừa chơi bóng rổ xong thì "exhausted", thích cà phê sữa đá; họ Trần là một trong
# những họ phổ biến nhất ở Việt Nam.
# Dựng: cd agents && python -m lesson_video build ../books/book_oxford_word_skills_basic/lessons/U07-questions-language.yaml
id: U07-questions-language
activity: U07-words
title: "Unit 7 · Questions about language"
subtitle: "I can ask and answer questions about language"
title_vi: "Hỏi nghĩa, cách nói, cách phát âm, cách đánh vần một từ; trả lời khi chưa biết; đánh vần tên"
tag: "BASIC ENGLISH · UNIT 7"
speakers:
  # giọng theo bộ đọc: kokoro (mặc định khi có model) hoặc flite (dự phòng, có sẵn trên Ubuntu)
  emma: {name: Emma, role: teacher, color: "#C8102E", voice: {kokoro: af_heart, flite: slt}}
  tom: {name: Tom, role: student, color: "#1F5FAD", voice: {kokoro: am_michael, flite: rms}}

scenes:
  - kind: title
    chapter: "Giới thiệu"
    lines:
      - emma: "Welcome to Unit 7: questions about language. When you learn English, you need to ask about words. What does it mean? How do you say it? Today you learn how."
        say: "Welcome to Unit seven: questions about language. When you learn English, you need to ask about words. What does it mean? How do you say it? Today you learn how."
        vi: "Unit 7: hỏi về từ ngữ — nghĩa là gì, nói thế nào."
      - tom: "As always, there's no countdown. Pause the video when you want to answer."
        vi: "Như mọi khi, không đếm ngược: muốn trả lời thì tự tạm dừng video."

  - kind: bullets
    chapter: "Hỏi nghĩa của từ"
    heading: "Asking about meaning"
    heading_vi: "Chú ý trật tự từ: What does … mean? (không nói What means …?)"
    items:
      - {en: "What does 'dreadful' mean? — It means 'terrible'.", vi: "… nghĩa là gì? — NOT What means 'dreadful'?"}
      - {en: "What's this called in English? — It's a stamp.", vi: "Cái này tiếng Anh gọi là gì?"}
      - {en: "How do you say 'pasaporte' in English? — Passport.", vi: "… tiếng Anh nói thế nào?"}
      - {en: "Could you explain 'No vacancies'? — It means the hotel is full.", vi: "Giải thích giúp … — NOT Could you explain me …?"}
    lines:
      - {tom: "Emma, what does dreadful mean?", focus: 0}
      - {emma: "It means terrible. And notice the question: what does dreadful mean? Not: what means dreadful.", focus: 0, vi: "Hỏi What does … mean?, không hỏi What means …?"}
      - {tom: "What's this called in English?", focus: 1}
      - {emma: "It's a stamp. You put it on a letter.", focus: 1}
      - {tom: "How do you say pasaporte in English?", say: "How do you say pah-sah-por-tay in English?", focus: 2}
      - {emma: "Passport.", focus: 2}
      - {tom: "Could you explain No vacancies?", focus: 3}
      - {emma: "Yes. You see it in a hotel window. It means the hotel is full. There are no free rooms. And remember: could you explain this word. Not: could you explain me.", focus: 3, vi: "Nói Could you explain …?, không nói Could you explain me …?"}

  - kind: bullets
    chapter: "Hỏi cách dùng, phát âm"
    heading: "Difference, opposite, pronunciation, spelling"
    heading_vi: "Khác nhau thế nào · từ trái nghĩa · phát âm · đánh vần"
    items:
      - {en: "What's the difference between 'hello' and 'hi'? — The meaning is the same, but 'hi' is informal.", vi: "Khác nhau giữa … và …?"}
      - {en: "What's the opposite of 'large'? — Small.", vi: "Từ trái nghĩa của … là gì?"}
      - {en: "How do you pronounce 'May'? — /meɪ/, like 'day'.", vi: "Phát âm … thế nào?"}
      - {en: "'Eight' is pronounced /aɪt/. Is that right? — No, that's wrong. It's /eɪt/.", vi: "Như vậy đúng không? — Sai rồi"}
      - {en: "How do you spell 'apple'? — A-double P-L-E.", vi: "Đánh vần … thế nào? — double P = hai chữ P"}
    lines:
      - {tom: "What's the difference between hello and hi?", focus: 0}
      - {emma: "The meaning is the same, but hi is informal. You say it to friends.", focus: 0, vi: "Nghĩa như nhau, nhưng hi thân mật hơn."}
      - {tom: "What's the opposite of large?", focus: 1}
      - {emma: "Small.", focus: 1}
      - {tom: "How do you pronounce this month: M, A, Y?", say: "How do you pronounce this month: em, eigh, why?", focus: 2}
      - {emma: "May. Like day.", focus: 2}
      - {tom: "Eight is pronounced /aɪt/. Is that right?", say: "Eight is pronounced ite. Is that right?", focus: 3}
      - {emma: "No, that's wrong. It's pronounced eight, like late.", focus: 3}
      - {tom: "How do you spell apple?", focus: 4}
      - {emma: "A, double P, L, E. Double P means two Ps.", say: "Eigh, double pee, el, ee. Double pee means two pees.", focus: 4, vi: "double P = hai chữ P."}

  - kind: bullets
    chapter: "Khi chưa biết"
    heading: "When you don't know"
    heading_vi: "Ba câu trả lời khác nhau — dùng đúng câu"
    items:
      - {en: "I don't know.", vi: "= It's a new word for me. (từ mới với tôi)"}
      - {en: "I can't remember.", vi: "= I knew the word yesterday, but I don't know it today. (biết rồi mà quên)"}
      - {en: "I'm not sure. Is it one 'p' or two?", vi: "chưa chắc, hỏi lại"}
      - {en: "Sorry, could you repeat the question, please?", vi: "thi nói IELTS: nghe chưa rõ thì xin nhắc lại, đừng im lặng"}
    lines:
      - {emma: "Sometimes you don't know the answer. That's OK! Say: I don't know. It means: it's a new word for me.", focus: 0}
      - {tom: "I can't remember. I knew the word yesterday, but I don't know it today. That happens to me a lot!", focus: 1, vi: "Biết hôm qua mà hôm nay quên — Tom hay bị vậy!"}
      - {emma: "I'm not sure. Is it one p or two?", say: "I'm not sure. Is it one pee or two?", focus: 2}
      - emma: "And in the IELTS speaking test, if you don't understand a question, don't say nothing. Say: Sorry, could you repeat the question, please?"
        say: "And in the eye-elts speaking test, if you don't understand a question, don't say nothing. Say: Sorry, could you repeat the question, please?"
        focus: 3
        vi: "Thi nói IELTS: chưa hiểu câu hỏi thì xin nhắc lại, đừng im lặng."

  - kind: blanks
    chapter: "Bài 1: ghép câu hỏi – trả lời"
    heading: "Exercise 1 · Match 1–6 with a–g"
    heading_vi: "a It means 'very small'. · b It's what you say when you meet a friend. · c D-E-double N-I-S. · d /ˈtaɪni/ · e No, it's wrong. · f I don't know. · g Open."
    items:
      - {n: 1, q: "How do you say 'cup' in German?  →  ___", answer: "f · I don't know."}
      - {n: 2, q: "What's the opposite of 'closed'?  →  ___", answer: "g · Open."}
      - {n: 3, q: "What does 'tiny' mean?  →  ___", answer: "a · It means 'very small'."}
      - {n: 4, q: "How do you pronounce 'tiny'?  →  ___", answer: "d · /ˈtaɪni/"}
      - {n: 5, q: "Could you explain 'How are you?'  →  ___", answer: "b · It's what you say when you meet a friend."}
      - {n: 6, q: "'Question' and 'answer' mean the same. Is that right?  →  ___", answer: "e · No, it's wrong."}
    lines:
      - emma: "Exercise 1. Match the questions with the answers. Pause the video and try."
        say: "Exercise one. Match the questions with the answers. Pause the video and try."
        vi: "Bài 1: ghép câu hỏi 1–6 với câu trả lời a–g — tạm dừng video và làm."
      - {tom: "How do you say cup in German? F. I don't know!", say: "How do you say cup in German? Ef. I don't know!", reveal: 1, focus: 0}
      - {tom: "What's the opposite of closed? G. Open.", say: "What's the opposite of closed? Gee. Open.", reveal: 2, focus: 1}
      - {tom: "What does tiny mean? A. It means very small.", say: "What does tiny mean? Eigh. It means very small.", reveal: 3, focus: 2}
      - {tom: "How do you pronounce tiny? D. Tiny.", say: "How do you pronounce tiny? Dee. Tiny.", reveal: 4, focus: 3}
      - {tom: "Could you explain How are you? B. It's what you say when you meet a friend.", say: "Could you explain, How are you? Bee. It's what you say when you meet a friend.", reveal: 5, focus: 4}
      - {tom: "Question and answer mean the same. Is that right? E. No, it's wrong. They're opposites!", say: "Question and answer mean the same. Is that right? Ee. No, it's wrong. They're opposites!", reveal: 6, focus: 5}

  - kind: blanks
    chapter: "Bài 2: hoàn thành câu hỏi"
    heading: "Exercise 2 · Complete the questions"
    heading_vi: "Đáp án theo Answer key tr. 206"
    items:
      - {n: 1, q: "What's this ___ in English? — It's a frying pan.", answer: "called"}
      - {n: 2, q: "How do you ___ 'tomato'? — /təˈmɑːtəʊ/", answer: "pronounce"}
      - {n: 3, q: "___ you spell 'eye'? — I'm not sure. I think it's E-Y-E.", answer: "How do"}
      - {n: 4, q: "What's the difference ___ 'bye' and 'goodbye'? — 'Bye' is more informal.", answer: "between"}
      - {n: 5, q: "'Pen' is the same as 'pencil'. Is that ___? — No, that's wrong.", answer: "right / correct"}
      - {n: 6, q: "What's the ___ of 'interesting'? — Boring.", answer: "opposite"}
      - {n: 7, q: "What ___ 'enormous' mean? — It means 'very big'.", answer: "does"}
      - {n: 8, q: "Could you ___ 'EXIT'? — You see it on a door. You can go out there.", answer: "explain"}
    lines:
      - emma: "Exercise 2. Complete the questions. Pause the video and try."
        say: "Exercise two. Complete the questions. Pause the video and try."
        vi: "Bài 2: hoàn thành câu hỏi — tạm dừng video và làm."
      - {tom: "One. What's this called in English?", reveal: 1, focus: 0}
      - {emma: "It's a frying pan.", focus: 0}
      - {tom: "Two. How do you pronounce tomato?", reveal: 2, focus: 1}
      - {emma: "In British English, we say tomahto. Americans say tomayto. Both are fine.", focus: 1, vi: "Anh – Anh đọc /təˈmɑːtəʊ/, Anh – Mỹ đọc /təˈmeɪtoʊ/ — đều đúng."}
      - {tom: "Three. How do you spell eye?", reveal: 3, focus: 2}
      - {emma: "I'm not sure. I think it's E, Y, E.", say: "I'm not sure. I think it's ee, why, ee.", focus: 2}
      - {tom: "Four. What's the difference between bye and goodbye?", reveal: 4, focus: 3}
      - {emma: "Bye is more informal.", focus: 3}
      - {tom: "Five. Pen is the same as pencil. Is that right? Or: is that correct?", reveal: 5, focus: 4}
      - {emma: "No, that's wrong.", focus: 4}
      - {tom: "Six. What's the opposite of interesting?", reveal: 6, focus: 5}
      - {emma: "Boring.", focus: 5}
      - {tom: "Seven. What does enormous mean?", reveal: 7, focus: 6}
      - {emma: "It means very big.", focus: 6}
      - {tom: "Eight. Could you explain EXIT?", say: "Eight. Could you explain, exit?", reveal: 8, focus: 7}
      - {emma: "You see it on a door. It means that you can go out there.", focus: 7}

  - kind: blanks
    chapter: "Tự đặt câu hỏi"
    heading: "Make the question"
    heading_vi: "Bạn chưa biết từ — hãy đặt câu hỏi bằng tiếng Anh (tạm dừng video, nói to câu hỏi)"
    items:
      - {n: 1, q: "You don't know the meaning of 'huge'.  →  ___", answer: "What does 'huge' mean?"}
      - {n: 2, q: "You want the English word for 'cái ô'.  →  ___", answer: "How do you say 'cái ô' in English?"}
      - {n: 3, q: "You can't say 'Wednesday'.  →  ___", answer: "How do you pronounce 'Wednesday'?"}
      - {n: 4, q: "You see a sign: 'Out of order'.  →  ___", answer: "Could you explain 'Out of order'?"}
      - {n: 5, q: "You want a word that means 'not fast'.  →  ___", answer: "What's the opposite of 'fast'?"}
      - {n: 6, q: "You can't write 'necessary'.  →  ___", answer: "How do you spell 'necessary'?"}
    lines:
      - emma: "Now you make the questions. Read each situation, pause the video, and say the question out loud."
        vi: "Đến lượt bạn đặt câu hỏi: đọc tình huống, tạm dừng video, nói to câu hỏi."
      - {tom: "One. What does huge mean?", reveal: 1, focus: 0}
      - {emma: "It means very big, like enormous.", focus: 0}
      - {tom: "Two. How do you say cái ô in English?", say: "Two. How do you say, kai oh, in English?", reveal: 2, focus: 1}
      - {emma: "An umbrella. You need one in the rainy season!", focus: 1, vi: "Cái ô = an umbrella — mùa mưa thì cần!"}
      - {tom: "Three. How do you pronounce Wednesday?", say: "Three. How do you pronounce Wed-nes-day?", reveal: 3, focus: 2}
      - {emma: "Wednesday. The first d is silent. Wednesday.", say: "Wednesday. The first dee is silent. Wednesday.", focus: 2, vi: "Wednesday: chữ d đầu câm, đọc /ˈwenzdeɪ/."}
      - {tom: "Four. Could you explain Out of order?", reveal: 4, focus: 3}
      - {emma: "You see it on a machine. It means it doesn't work.", focus: 3, vi: "Out of order: (máy) hỏng, không dùng được."}
      - {tom: "Five. What's the opposite of fast?", reveal: 5, focus: 4}
      - {emma: "Slow.", focus: 4}
      - {tom: "Six. How do you spell necessary?", reveal: 6, focus: 5}
      - {emma: "N, E, C, E, double S, A, R, Y. One c, and double s.", say: "En, ee, see, ee, double ess, eigh, ar, why. One see, and double ess.", focus: 5, vi: "necessary: một chữ c, hai chữ s."}

  - kind: bullets
    chapter: "Chữ cái dễ nhầm"
    heading: "The alphabet · letters that are easy to mix up"
    heading_vi: "Nghe đánh vần trong IELTS Listening — người Việt hay nhầm các chữ này"
