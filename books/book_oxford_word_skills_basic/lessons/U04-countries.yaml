# Video Oxford Word Skills Basic · Unit 4 — I can say countries and nationalities (sách in tr. 18–19, Answer key tr. 206).
# Khuôn video: docs/agent-hoc-tap/09-oxford-word-skills-basic.md mục 5 (7–10 phút, không đếm ngược, 1–2 phần nói, nghe và viết).
# Đáp án bài 1–4 theo Answer key (bài 1 câu 6 "The Chinese speak Chinese" là F vì bảng trong sách ghi Mandarin, Cantonese).
# Bài 1 có 9 câu nên dùng cảnh blanks (thẻ mcq 9 câu quá hẹp, chữ bị cắt).
# Bài 3 (bản đồ) làm theo chữ cái đầu như trong sách, xem bản đồ ở tr. 19.
# Dựng: cd agents && python -m lesson_video build ../books/book_oxford_word_skills_basic/lessons/U04-countries.yaml
id: U04-countries
activity: U04-words
title: "Unit 4 · Countries and nationalities"
subtitle: "I can say countries and nationalities"
title_vi: "Quốc gia, quốc tịch, ngôn ngữ; người của một nước (the British, Italians); Britain và the UK"
tag: "BASIC ENGLISH · UNIT 4"
speakers:
  # giọng theo bộ đọc: kokoro (mặc định khi có model) hoặc flite (dự phòng, có sẵn trên Ubuntu)
  emma: {name: Emma, role: teacher, color: "#C8102E", voice: {kokoro: af_heart, flite: slt}}
  tom: {name: Tom, role: student, color: "#1F5FAD", voice: {kokoro: am_michael, flite: rms}}

scenes:
  - kind: title
    chapter: "Giới thiệu"
    lines:
      - emma: "Welcome to Unit 4: countries and nationalities. After this video, you can say where people come from, and what languages they speak."
        say: "Welcome to Unit four: countries and nationalities. After this video, you can say where people come from, and what languages they speak."
        vi: "Unit 4: nói người ta đến từ đâu, nói tiếng gì."
      - tom: "As always, no countdown. Pause the video when you want to answer."
        vi: "Như mọi khi, không đếm ngược: muốn trả lời thì tự tạm dừng video."

  - kind: bullets
    chapter: "Bạn từ đâu đến?"
    heading: "Where are you from?"
    heading_vi: "Hỏi và trả lời về quê hương, quốc tịch, ngôn ngữ"
    items:
      - {en: "Where are you from? · Where do you come from?", vi: "Bạn từ đâu đến?"}
      - {en: "I come from Vietnam. · I'm from Vietnam.", vi: "Tôi đến từ Việt Nam (tên nước)"}
      - {en: "I'm Vietnamese. I speak Vietnamese.", vi: "Tôi là người Việt (quốc tịch), nói tiếng Việt (ngôn ngữ)"}
    lines:
      - {emma: "Where are you from? Or: where do you come from?", focus: 0}
      - {tom: "I come from Vietnam. Or: I'm from Vietnam.", focus: 1, vi: "Sau from là tên nước."}
      - {tom: "I'm Vietnamese, and I speak Vietnamese.", focus: 2, vi: "Quốc tịch và ngôn ngữ."}
      - {emma: "So: the country is Vietnam, the nationality is Vietnamese, and the language is Vietnamese too.", focus: 2}

  - kind: bullets
    chapter: "Châu Âu"
    heading: "Europe · country — nationality (language)"
    heading_vi: "Tên nước, quốc tịch, ngôn ngữ — đều viết hoa"
    items:
      - {en: "the Czech Republic — Czech · France — French · Germany — German", vi: "Séc · Pháp · Đức"}
      - {en: "Greece — Greek · Hungary — Hungarian · Italy — Italian", vi: "Hy Lạp · Hungary · Ý"}
      - {en: "Poland — Polish · Portugal — Portuguese · Russia — Russian", vi: "Ba Lan · Bồ Đào Nha · Nga"}
      - {en: "Spain — Spanish · Turkey — Turkish", vi: "Tây Ban Nha · Thổ Nhĩ Kỳ"}
      - {en: "Switzerland — Swiss (they speak German, French, Italian)", vi: "Thụy Sĩ: người Thụy Sĩ nói tiếng Đức, Pháp, Ý"}
    lines:
      - emma: "Let's start with Europe. I say the country, and Tom says the nationality."
        vi: "Châu Âu: Emma nói tên nước, Tom nói quốc tịch."
      - {emma: "The Czech Republic. France. Germany.", focus: 0}
      - {tom: "Czech. French. German.", focus: 0}
      - {emma: "Greece. Hungary. Italy.", focus: 1}
      - {tom: "Greek. Hungarian. Italian.", focus: 1}
      - {emma: "Poland. Portugal. Russia.", focus: 2}
      - {tom: "Polish. Portuguese. Russian.", focus: 2}
      - {emma: "Spain. Turkey.", focus: 3}
      - {tom: "Spanish. Turkish.", focus: 3}
      - {emma: "Switzerland. The people are Swiss, and they speak German, French, or Italian.", focus: 4, vi: "Người Thụy Sĩ nói tiếng Đức, Pháp hoặc Ý."}

  - kind: bullets
    chapter: "Các châu lục khác"
    heading: "Asia, the Americas, the Middle East, Africa, Australasia"
    heading_vi: "Quốc tịch và tiếng nói không phải lúc nào cũng trùng tên"
    items:
      - {en: "India — Indian (Hindi) · China — Chinese (Mandarin, Cantonese)", vi: "Ấn Độ · Trung Quốc"}
      - {en: "Japan — Japanese · South Korea — Korean · Thailand — Thai · Vietnam — Vietnamese", vi: "Nhật · Hàn Quốc · Thái Lan · Việt Nam"}
      - {en: "Canada — Canadian (English, French) · the United States — American (English)", vi: "Canada · Mỹ"}
      - {en: "Mexico — Mexican (Spanish) · Argentina — Argentinian (Spanish) · Brazil — Brazilian (Portuguese)", vi: "Mexico · Argentina · Brazil"}
      - {en: "Saudi Arabia — Saudi (Arabic) · Egypt — Egyptian (Arabic) · Australia — Australian (English)", vi: "Ả Rập Xê Út · Ai Cập · Úc"}
    lines:
      - {emma: "Asia. India, Indian. They speak Hindi. China, Chinese. They speak Mandarin or Cantonese.", focus: 0}
      - {tom: "Japan, Japanese. South Korea, Korean. Thailand, Thai. And Vietnam, Vietnamese.", focus: 1}
      - {emma: "North America. Canada, Canadian. The United States, American.", focus: 2}
      - {tom: "Mexico, Mexican. Argentina, Argentinian. Brazil, Brazilian.", focus: 3}
      - {emma: "But be careful. Mexicans speak Spanish, not Mexican. And Brazilians speak Portuguese.", focus: 3, vi: "Người Mexico nói tiếng Tây Ban Nha; người Brazil nói tiếng Bồ Đào Nha."}
      - {tom: "Saudi Arabia, Saudi. Egypt, Egyptian. They both speak Arabic. And Australia, Australian.", focus: 4}
      - emma: "Countries, nationalities and languages always begin with a capital letter. Japan, not japan."
        focus: 4
        vi: "Tên nước, quốc tịch, ngôn ngữ luôn viết hoa chữ cái đầu."

  - kind: bullets
    chapter: "Người của một nước"
    heading: "Spotlight · People from a country"
    heading_vi: "Thường thêm s: Italians, Brazilians, Thais, Greeks — vài trường hợp dùng the + quốc tịch"
    items:
      - {en: "Italians · Brazilians · Thais · Greeks · Americans · Vietnamese", vi: "thêm s (Vietnamese giữ nguyên)"}
      - {en: "the British · the English · the French · the Spanish", vi: "đuôi -sh, -ch: the + quốc tịch, không thêm s"}
      - {en: "the Chinese · the Japanese · the Swiss", vi: "đuôi -ese, -ss: the + quốc tịch"}
      - {en: "Great Britain = England, Wales, Scotland · the UK = + Northern Ireland", vi: "Vương quốc Anh (the UK) gồm thêm Bắc Ireland"}
      - {en: "English = from England · British = from England, Wales, Scotland or Northern Ireland", vi: "người Scotland, xứ Wales là British, không phải English"}
    lines:
      - {emma: "To talk about the people from a country, we often add s. Italians, Brazilians, Thais, Greeks.", focus: 0}
      - {tom: "But some are different. The British, the English, the French, the Spanish.", focus: 1}
      - {tom: "The Chinese, the Japanese, the Swiss.", focus: 2}
      - {emma: "And Britain. Great Britain is England, Wales and Scotland. The United Kingdom, or the UK, adds Northern Ireland.", say: "And Britain. Great Britain is England, Wales and Scotland. The United Kingdom, or the U K, adds Northern Ireland.", focus: 3}
      - {emma: "Only people from England are English. People from Scotland or Wales are British, but not English. So don't call a Scottish person English!", focus: 4, vi: "Chỉ người England là English; người Scotland, Wales là British."}

