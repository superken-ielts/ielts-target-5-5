  - kind: qa
    chapter: "Nói 1: quê hương và ngôn ngữ"
    heading: "Speaking 1 · Tom and Emma ask each other"
    heading_vi: "Tạm dừng sau mỗi câu hỏi để tự trả lời, rồi nghe câu mẫu"
    items:
      - q: "Where are you from, Tom?"
        a: "I'm from Vietnam. I was born in Hanoi, but I grew up in Da Lat, a city in the mountains."
        ask: emma
        by: tom
        phrases: ["I'm from…", "I was born in…", "I grew up in…"]
      - q: "And where do you come from, Emma?"
        a: "I come from England, from a small town by the sea. So I'm English, and of course I'm British too."
        ask: tom
        by: emma
        phrases: ["I come from…", "I'm English", "British too"]
      - q: "What languages do you speak?"
        a: "Vietnamese, of course, and English. My English isn't perfect yet, but it's getting better every day."
        ask: emma
        by: tom
        phrases: ["…, of course", "isn't perfect yet", "getting better"]
      - q: "How many languages do you speak, Emma?"
        a: "Three: English, French, and a little Vietnamese. My French was good at school, but I've forgotten a lot. I'd like to learn Japanese too."
        ask: tom
        by: emma
        phrases: ["a little…", "I've forgotten a lot", "I'd like to learn…"]
      - q: "Which country would you like to visit? Why?"
        a: "Australia. I hope to go on an exchange programme there next year, so I need a good IELTS score!"
        ask: emma
        by: tom
        phrases: ["I hope to…", "an exchange programme", "I need…"]
      - q: "Which nationalities are your students?"
        a: "Most of them are Vietnamese, but this year I also have two Korean students and one Japanese student."
        ask: tom
        by: emma
        phrases: ["Most of them are…", "this year", "two Korean students"]
      - q: "And the teachers at your school? Where are they from?"
        a: "We're twelve teachers from five countries. Three of us are British: two are English, and one is Scottish. The others are Irish, American, Australian and Vietnamese."
        ask: tom
        by: emma
        phrases: ["from five countries", "Three of us are…", "The others are…"]
      - q: "Are there many tourists in Da Lat? Where are they from?"
        a: "Yes, lots. Most of them are Vietnamese, but there are also Koreans, Chinese, Australians and Americans."
        ask: emma
        by: tom
        phrases: ["Most of them are…", "there are also…", "Koreans, Americans"]
