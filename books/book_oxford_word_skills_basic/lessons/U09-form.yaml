      - {en: "N/A = not applicable", vi: "không áp dụng — ví dụ ô 'children' khi bạn chưa có con"}
      - {en: "Date of birth: 09/03/2006 (British: day / month / year)", vi: "kiểu Anh: ngày trước, tháng sau = 9 tháng 3"}
      - {en: "American forms: month / day / year → 03/09/2006", vi: "kiểu Mỹ: tháng trước — đọc kỹ ô DD/MM hay MM/DD"}
    lines:
      - {emma: "Forms have instructions too. Please write in block capitals means: use big letters, like T, R, A, N.", say: "Forms have instructions too. Please write in block capitals means: yooz big letters, like tee, ar, eigh, en.", focus: 0}
      - {emma: "And next to your signature, you often see print name. That means: write your name again, clearly, in capitals.", focus: 0, vi: "PRINT NAME: ghi lại họ tên bằng chữ in, rõ ràng."}
      - {tom: "Please tick the box. And delete as appropriate means: cross out the words that aren't true for you.", focus: 1, vi: "Delete as appropriate: gạch bỏ những lựa chọn không đúng với bạn."}
