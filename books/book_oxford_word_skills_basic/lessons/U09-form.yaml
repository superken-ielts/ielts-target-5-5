  - kind: bullets
    chapter: "Mẹo IELTS: điền form"
    heading: "IELTS Listening tip · form completion"
    heading_vi: "Phần 1 bài nghe IELTS thường là điền form như thế này"
    items:
      - {en: "Read the form before you listen: what kind of answer is it?", vi: "đọc form trước: cần tên, số, ngày hay email?"}
      - {en: "Check the word limit: NO MORE THAN TWO WORDS AND/OR A NUMBER", vi: "viết quá số từ cho phép là mất điểm"}
      - {en: "Spelling counts: T, R, A, N · double letters · at, dot", vi: "sai chính tả là sai — nghe kỹ phần đánh vần"}
      - {en: "People often change their answer: Tuesday… no, sorry, Wednesday", vi: "người nói hay sửa lại — ghi đáp án sau cùng"}
    lines:
      - emma: "Here are four tips for part one of the IELTS listening test. First, read the form before you listen. Do you need a name, a number, a date, or an email?"
        say: "Here are four tips for part one of the eye-elts listening test. First, read the form before you listen. Do you need a name, a number, a date, or an email?"
        focus: 0
        vi: "Mẹo 1: đọc form trước khi nghe — cần tên, số, ngày hay email?"
      - {tom: "Second, check the word limit. If it says no more than two words, three words is wrong.", focus: 1, vi: "Mẹo 2: đúng giới hạn số từ."}
      - {emma: "Third, spelling counts. Listen carefully when people spell names, and listen for at and dot in email addresses.", focus: 2}
      - {tom: "And fourth, people often change their answer. Is it Tuesday? No, sorry, it's Wednesday. So write the last answer.", focus: 3, vi: "Mẹo 4: người nói hay đổi ý — ghi đáp án cuối cùng."}

  - kind: qa
    chapter: "Nói 1: form và tên người Việt"
    heading: "Speaking 1 · Tom and Emma talk about forms"
    heading_vi: "Tạm dừng sau mỗi câu hỏi để tự trả lời, rồi nghe câu mẫu"
    items:
      - q: "When do you fill in forms?"
        a: "At the bank, at the doctor's, and when I apply for a course. Last month I filled in a very long form for my exchange programme."
        ask: emma
        by: tom
        phrases: ["At the bank…", "when I apply for…", "I filled in a form"]
      - q: "Do you prefer paper forms or online forms?"
        a: "Online forms. They're faster, and nobody has to read my handwriting!"
        ask: tom
        by: emma
        phrases: ["I prefer…", "They're faster", "nobody has to…"]
      - q: "Have you ever made a mistake on a form?"
        a: "Yes! On my first visa form, I wrote my first name in the surname box. In Vietnamese names, the family name comes first."
        ask: emma
        by: tom
        phrases: ["Yes!", "I wrote … in the … box", "the family name comes first"]
      - q: "So what's your name on an English form?"
        a: "Surname: Tran. Forenames: Minh Tuan. Some people think Minh is my middle name, and that's fine too."
        ask: emma
        by: tom
        phrases: ["Surname:", "Forenames:", "middle name"]
      - q: "How do you write your date of birth, Emma?"
        a: "Fifteen, oh nine, ninety-eight. In England we write the day first. Americans write the month first, so be careful!"
        ask: tom
        by: emma
        phrases: ["we write the day first", "the month first", "be careful"]
      - q: "What's your mother tongue?"
        a: "Vietnamese. And my second language is English, of course."
        ask: emma
        by: tom
        phrases: ["My mother tongue is…", "my second language"]
      - q: "What forms did you fill in when you came to Vietnam?"
        a: "A visa form, a form at the bank, and a form at my school. The visa form was the longest, with ten pages!"
        ask: tom
        by: emma
        phrases: ["A visa form…", "The … form was the longest", "with ten pages"]
      - q: "What do you write for occupation, Tom?"
        a: "Student, for now. But one day, I hope to write marketing manager!"
        ask: emma
        by: tom
        phrases: ["…, for now.", "But one day…", "I hope to…"]
      - q: "Do you know your passport number?"
        a: "No way! It's too long. I keep a photo of my passport on my phone, so I can copy it."
        ask: emma
        by: tom
        phrases: ["No way!", "It's too long.", "so I can…"]
      - q: "Which words were difficult for you at first?"
        a: "Surname, forename and occupation. They look very formal. Now they're easy: family name, first name and job."
        ask: emma
        by: tom
        phrases: ["… were difficult at first", "They look very formal", "Now they're easy"]
