# Video Oxford Word Skills Basic · Unit 9 — I can fill in a form (sách in tr. 27, Answer key tr. 206).
# Khuôn video: docs/agent-hoc-tap/09-oxford-word-skills-basic.md mục 5 (7–10 phút, không đếm ngược, 1–2 phần nói, nghe và viết).
# Đáp án bài 1 theo Answer key (1F 2T 3T 4F 5T 6F 7F 8T 9F 10F 11F 12T); câu 5 "tick = ✓" viết bằng chữ vì phông không có
# glyph ✓. Bài 2 (ABOUT YOU) là phần nói 2.
# Hình trong sách (đợt 29): phiếu mẫu của Maria tr. 27, hiện từng dải và đóng khung từng dòng đang học.
# Thêm ngoài sách: Test yourself làm thành câu đố; mẹo IELTS điền form; chỉ dẫn trên form (BLOCK CAPITALS, tick the box,
# delete as appropriate, N/A); ngày sinh kiểu Anh và kiểu
# Mỹ; tên người Việt (họ đứng trước) trên form tiếng Anh; nghe và điền form như IELTS Listening phần 1 (email dùng tên miền
# example.com dành cho ví dụ). Chi tiết nhân vật mới: Tom sinh 9/3/2006 (khớp sinh nhật 9/3 và 20 tuổi), lần đầu điền form
# visa thì viết nhầm tên vào ô họ, tháng trước điền form chương trình trao đổi; Emma sinh 15/9/1998 (khớp 28 tuổi), dùng Ms.
