      - {tom: "And dates. On a British form, my date of birth is oh nine, oh three, two thousand and six. Day first.", focus: 3}
      - {emma: "But on an American form, the month comes first. So check: is it D D slash M M, or M M slash D D?", focus: 4, vi: "Form Mỹ ghi tháng trước — xem kỹ ô DD/MM hay MM/DD."}

