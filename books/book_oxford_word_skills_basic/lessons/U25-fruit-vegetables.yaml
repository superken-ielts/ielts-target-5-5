# Video Oxford Word Skills Basic · Unit 25 — I can name fruit and vegetables (sách in tr. 66–67, Answer key tr. 210).
# Khuôn: file 09 mục 5.2 (unit thường, 7–10 phút). Không `wait` / `echo`; không khoảng lặng từ 3 giây (câu cuối cảnh tự trả
# lời `pause: 1.0`).
# Bài trong sách: đủ 1–7. Bài 1, 2, 4, 5 theo Answer key tr. 210. Bài 2 câu 2: Answer key ghi lemons are bitter (sách dùng
# bitter là trái nghĩa của sweet) — video nói thêm: tiếng Anh hằng ngày gọi vị chanh là sour. Bài 6 (ABOUT YOUR COUNTRY): Tom trả
# lời về Việt Nam (Answer key: Your own answers). Bài 3 (Test yourself): Tom nhắc che chữ, nói tên trái cây; bài 7: cảnh riêng — tranh rau, Emma hỏi, Tom trả lời.
# Thêm ngoài sách: sour ≠ bitter, a bunch of grapes, a clove of garlic; trái cây Việt Nam bằng tiếng Anh; câu đố vị (sweet, sour,
# bitter, salty, spicy); Nghe và viết; Nói 1 (rau quả ở Đà Lạt, chợ); Nói 2 (Part 1 "Fruit").
# Hình trong sách: hai hàng tranh trái cây, bảng taste / sweet / bitter / fresh (khung theo hàng), chuỗi chữ bài 1, bốn hàng tranh
# rau kèm raw / frozen / cooked và khung Spotlight salad (khung theo tranh).
# Chi tiết nhân vật (khớp file 06 mục 9.4, file 09 mục 5.7): Đà Lạt nổi tiếng dâu tây, bơ, rau; ông của Tom trồng bắp cải, cà rốt,
# xà lách trong vườn (hồ sơ: làm vườn rau mỗi sáng); Tom thích xoài và sinh tố bơ, không thích mướp đắng (bitter melon) — mẹ bảo
# tốt cho sức khỏe. Emma thích dâu tây với kem (mùa hè ở Anh); đã thử sầu riêng một lần, không
# thích; sáng thứ Bảy đi chợ mua rau quả (U17).
# Dựng: cd agents && python -m lesson_video build ../books/book_oxford_word_skills_basic/lessons/U25-fruit-vegetables.yaml
