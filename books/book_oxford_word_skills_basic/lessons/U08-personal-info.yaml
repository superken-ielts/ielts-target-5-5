# Video Oxford Word Skills Basic · Unit 8 — I can give personal information (sách in tr. 26, Answer key tr. 206).
# Khuôn video: docs/agent-hoc-tap/09-oxford-word-skills-basic.md mục 5 (7–10 phút, không đếm ngược, 1–2 phần nói, nghe và viết).
# Đáp án bài 1–2 theo Answer key; bài 3 (ABOUT YOU): câu mẫu "Answers from a Greek person" rồi Tom tự trả lời.
# Hình trong sách (đợt 29): hội thoại lễ tân và khung Spotlight tr. 26, đóng khung từng cặp hỏi – đáp đang học.
# Thêm ngoài sách: What do you do? ≠ What are you doing?; đặt câu hỏi từ câu trả lời; giám khảo IELTS mở đầu bài thi
# Nói thế nào; hỏi tuổi ở Việt Nam
# và ở Anh. Module People mở đầu: chị và em trai của Tom có tên từ video này — chị Hoa (say: Whah, y tá ở Hà Nội), em Bao.
# Chi tiết nhân vật mới: Tom 20 tuổi, độc thân, tên tiếng Anh "Tom" ngắn và cùng chữ T với Tuấn; Emma 28 tuổi, độc thân,
# tên đệm Louise, quê ở miền nam nước Anh; ở Anh hỏi tuổi có khi bị coi là bất lịch sự, bà Emma hỏi chuyện chồng con mỗi
# dịp Giáng sinh.
# Dựng: cd agents && python -m lesson_video build ../books/book_oxford_word_skills_basic/lessons/U08-personal-info.yaml
id: U08-personal-info
