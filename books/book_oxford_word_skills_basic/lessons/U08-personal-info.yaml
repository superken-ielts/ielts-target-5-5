  - kind: qa
    chapter: "Nói 1: thông tin về bạn"
    heading: "Speaking 1 · Tom and Emma ask each other"
    heading_vi: "Tạm dừng sau mỗi câu hỏi để tự trả lời, rồi nghe câu mẫu"
    items:
      - q: "What's your full name, Emma?"
        a: "Emma Louise Clarke. Emma is my first name, Louise is my middle name, and Clarke is my family name."
        ask: tom
        by: emma
        phrases: ["… is my first name", "middle name", "family name"]
      - q: "Whereabouts in England are you from?"
        a: "From the south, from a small town by the sea. Only about fifteen thousand people live there."
        ask: tom
        by: emma
        phrases: ["From the south", "a small town by the sea", "Only about…"]
      - q: "What do you do, Tom?"
        a: "I'm a student. I'm in my second year at university, and I study business here in Ho Chi Minh City."
        ask: emma
        by: tom
        phrases: ["I'm a student.", "in my second year", "I study…"]
      - q: "Where do you live now?"
        a: "I share a small flat with two friends. It's about one kilometre from my university, so I walk there."
        ask: emma
        by: tom
        phrases: ["I share a flat with…", "about one kilometre from…", "so I walk"]
      - q: "Are you married, Tom?"
        a: "No, I'm still single. I'm only twenty!"
        ask: emma
        by: tom
        phrases: ["No, I'm still single.", "I'm only…"]
      - q: "And you, Emma? Married or single?"
        a: "Single. And my grandmother asks me about it every Christmas!"
        ask: tom
        by: emma
        phrases: ["Single.", "asks me about it", "every Christmas"]
      - q: "Have you got any brothers or sisters?"
        a: "Yes, an older sister and a younger brother. My sister, Hoa, is a nurse in Hanoi, and my brother, Bao, is fifteen."
        ask: emma
        by: tom
        phrases: ["an older sister", "a younger brother", "… is a nurse"]
      - q: "How long have you lived in Vietnam?"
        a: "For three years. I arrived in August twenty twenty-three, and I still love it here."
        ask: tom
        by: emma
        phrases: ["For three years.", "I arrived in…", "I still love it"]
      - q: "Can I ask how old you are, Emma?"
        a: "Of course. I'm twenty-eight. In England, some people think it's a bit rude to ask, but here in Vietnam people ask all the time!"
        ask: tom
        by: emma
        phrases: ["Of course.", "it's a bit rude to…", "all the time"]
