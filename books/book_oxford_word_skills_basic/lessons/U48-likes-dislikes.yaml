# Video Oxford Word Skills Basic · Unit 48 — I can say what I like (sách in tr. 126–127, Answer key tr. 216).
# UNIT KHÓ (đợt 42): unit đầu module Hobbies and interests — tám mức thích (love → hate) với trật tự từ really / quite / very much,
# like / love / hate / enjoy + -ing, prefer … to …, keen on, interesting ≠ interested (lỗi người Việt rất hay mắc); "Do you like…?"
# là câu hỏi IELTS Part 1 hay gặp nhất — video khoảng 13 phút: phần sách, rồi câu nói thích / không thích kiểu IELTS, ÔN TẬP (lỗi hay
# gặp) và LUYỆN NÓI CHUNG (Part 2 "something you enjoy doing in your free time", hai bài mẫu; ba câu thảo luận kiểu Part 3). Khuôn:
# file 09 mục 5.2. Không `wait` / `echo`; không khoảng lặng từ 3 giây (câu cuối cảnh tự trả lời `pause: 1.0`). Không có cảnh "Nghe
# và viết": unit có video nghe – viết riêng.
# Bài trong sách: đủ 1–6. Bài 1, 2, 4, 5 theo Answer key tr. 216 (bài 4: ví dụ chỉ trên bảng, đáp án có hình bảng bên cạnh; bài 5:
# khung từ hiện trước). Bài 3 và 6 (ABOUT YOU): Tom và Emma tự trả lời (cảnh Nói 1, Nói 2) — Answer key chỉ có câu trả lời mẫu của
# một người Đức / Thổ Nhĩ Kỳ.
# Hình trong sách: thang Love it or hate it? (khung theo câu), Spotlight like / love / hate + -ing, hồ sơ của Mirko Zitec (khung theo
# dòng), Glossary, Spotlight interesting / interested, bảng bài 4 (hai cảnh), khung từ bài 5 — đo bằng máy.
# Chi tiết nhân vật (khớp file 06 mục 9.4, file 09 mục 5.7): Tom mê phim khoa học viễn tưởng, chơi bóng rổ, học tiếng Anh thấy nghe
# khó, ít gửi email mà hay nhắn tin, chỉ mua thứ cần, hồi đi học thấy Sử chán, thích nhạc pop và vài ban nhạc Việt, quê Đà Lạt; hai năm
# trước chỉ biết nấu mì và trứng, nay đang học nấu ăn, chia nhau nấu với hai bạn cùng phòng, tháng trước nấu canh cá của mẹ; Emma lớn
# lên ở thị trấn ven biển (thích hải sản), không đi xe ở TP. HCM, ở nhà không gọn gàng, gọi cho mẹ mỗi Chủ nhật, thích màu xanh lá,
# mê truyện trinh thám, đi bộ đường dài, ông dạy bơi năm 10 tuổi, bà đan áo cho cả nhà. Mới: Tom không thích xem TV lắm (xem phim trên
# laptop), rất thích học tiếng Anh, thích đi rạp; nấu ăn buổi tối hoặc cuối tuần, gọi mẹ xin công thức, muốn học thêm món Âu; Emma khá
# thích lái xe ở Anh, ghét dọn nhà, thích nói chuyện điện thoại (gọi mẹ cả tiếng), thích cá hơn thịt, không mê thể thao nhưng thích
# bơi; đi bộ đường dài khi có cuối tuần rảnh (ở Anh: dọc biển; ở Việt Nam: đồi gần Đà Lạt), với bạn ở trường hoặc một mình.
