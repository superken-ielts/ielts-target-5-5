# Video Oxford Word Skills Basic · Unit 52 — I can talk about films (sách in tr. 134–135, Answer key tr. 217–218).
# UNIT KHÓ (đợt 42): bảy loại phim đi với tính từ (exciting, funny, violent, romantic, frightening), cách hỏi về phim (What's on?
# What kind of…? Who's in it? Who's the director? Where's it on? It's about…), see a film at the cinema ≠ watch a film at home, tính từ
# -ing ≠ -ed (frightening / frightened — nối Unit 48); "a film you enjoyed" là đề Part 2 rất hay gặp — video khoảng 13 phút: phần sách,
# rồi ÔN TẬP (lỗi hay gặp) và LUYỆN NÓI CHUNG (Part 2 "a film you enjoyed", hai bài mẫu; ba câu thảo luận kiểu Part 3). Khuôn: file 09
# mục 5.2. Không `wait` / `echo`; không khoảng lặng từ 3 giây (câu cuối cảnh tự trả lời `pause: 1.0`). Không có cảnh "Nghe và viết":
# unit có video nghe – viết riêng.
# Bài trong sách: đủ 1–6 theo Answer key tr. 217–218 (bài 2: 1c 2f 3a 4b 5e; bài 3: đáp án hiện thành nhãn trên tranh). Bài 4 (Test
# yourself): hai hàng tranh cắt bỏ chú thích. Bài 6 (ABOUT YOU): Tom nói về phim Interstellar (dữ kiện thật: Christopher Nolan, Matthew
# McConaughey, Anne Hathaway) — cảnh Nói 2.
# Hình trong sách: bảy tranh loại phim và Spotlight What kind of…? (hai cảnh), năm tranh bài 3, tranh tự kiểm tra (hai cảnh), áp phích và
# hội thoại What's on? (ba cảnh), Glossary (hai cảnh) — đo bằng máy.
# Thêm ngoài sách: tính từ -ing / -ed, câu mua vé ở rạp (General Training), năm câu khung tả phim kiểu IELTS.
# Chi tiết nhân vật (khớp file 06 mục 9.4, file 09 mục 5.7): Tom mê phim khoa học viễn tưởng, thích đi rạp, xem phim trên laptop, chị Hoa;
# Emma mê truyện trinh thám, anh Jack ở London, sang Việt Nam ba năm trước. Mới: Tom thích cả phim hài; gần đây xem lại Interstellar ở
# nhà trên laptop; hồi khoảng 12 tuổi xem phim hoạt hình Spirited Away trên TV với chị Hoa, Tết vừa rồi xem lại cùng chị; rạp gần trường
# chiếu nhiều phim Hàn và phim Mỹ, Tom đi rạp khoảng tháng một lần;
# Emma ghét phim kinh dị, xem Knives Out ở rạp ở London với anh Jack trước khi sang Việt Nam, không đoán được kết; thích đọc sách trước
# rồi mới xem phim; học viên xem phim Mỹ để luyện tiếng Anh; tháng trước đi xem phim hài Việt với học viên (phụ đề tiếng Anh). Tom xem
# phim tiếng Anh có phụ đề tiếng Anh để luyện nghe.
