    heading_vi: "IELTS Part 1 \"Films\" — tạm dừng sau mỗi câu hỏi để tự trả lời"
    items:
      - q: "What kind of films do you like, Tom?"
        a: "Science fiction films, definitely. And comedies: I like films that make me laugh."
        ask: emma
        by: tom
        phrases: ["…, definitely.", "films that make me laugh"]
      - q: "How often do you go to the cinema?"
        a: "About once a month. The cinema near my university shows lots of Korean and American films."
        ask: emma
        by: tom
        phrases: ["About once a month."]
      - q: "Emma, do you like horror films?"
        a: "No, I hate them! They're too frightening. I prefer thrillers and detective stories."
        ask: tom
        by: emma
        phrases: ["… too frightening", "I prefer…"]
      - q: "Do you prefer the book or the film?"
        a: "Usually the book. I always read the book first, and then I see the film."
        ask: tom
        by: emma
        phrases: ["Usually…", "first, and then…"]
      - q: "Do you watch films in English, Tom?"
        a: "Yes, with English subtitles. It's good practice for my listening."
        ask: emma
        by: tom
        phrases: ["with English subtitles", "It's good practice for…"]
      - q: "And do you watch Vietnamese films, Emma?"
