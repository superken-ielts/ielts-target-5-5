# Video Oxford Word Skills Basic · Unit 33 — I can understand signs and notices (sách in tr. 86, Answer key tr. 212).
# Khuôn: file 09 mục 5.2 (unit thường, 7–10 phút). Không `wait` / `echo`; không khoảng lặng từ 3 giây (câu cuối cảnh tự trả
# lời `pause: 1.0`).
# Bài trong sách: đủ 1–3. Bài 1–2 theo Answer key tr. 212 (bài 2: mỗi chỗ trống có nhiều đáp án — video chọn một đáp án khác nhau
# cho hai câu cùng mở đầu, rồi đọc các đáp án khác). Bài 1: danh sách a–j của sách bên trái. Bài 3 (Test yourself): câu đố nghe
# nghĩa, nói biển báo ở cuối video.
# Unit một trang nên thêm ngoài sách: biển báo hay gặp khác (Push / Pull, Open / Closed, Staff only, Wet floor, Keep off the grass,
# Fire exit); biển báo tiếng Việt → tiếng Anh; thông báo kiểu IELTS General Training Reading phần 1 (opening hours, no food or drink,
# lift out of order) kèm một thông báo thư viện và câu True / False; câu đố "Where would you see it?"; Nghe và viết; Nói 1 (biển
# báo quanh bạn); Nói 2 (biển báo trong đời sống).
# Hình trong sách: bảng 14 biển báo (ba cảnh, khung theo dòng đo bằng máy), danh sách a–j của bài 1.
# Chi tiết nhân vật (khớp file 06 mục 9.4, file 09 mục 5.7): Tom làm ở quán cà phê (hồ sơ) — mới: cửa bếp có biển Staff only; metro
# TP. HCM có biển tiếng Việt và tiếng Anh (U30). Emma học tiếng Việt (hồ sơ), hỏi giá ở chợ (U25) — mới: biển tiếng Việt học đầu
# tiên là "lối ra" và "giảm giá"; ngân hàng, bưu điện có biển xếp hàng; trường của Emma có biển nhắc tắt điện thoại trong lớp.
# Dựng: cd agents && python -m lesson_video build ../books/book_oxford_word_skills_basic/lessons/U33-signs-notices.yaml
