  - kind: qa
    chapter: "Nói 1: biển báo quanh bạn"
    heading: "Speaking 1 · Signs around you"
    heading_vi: "Tạm dừng sau mỗi câu hỏi để tự trả lời, rồi nghe câu mẫu"
    items:
      - q: "Are there signs in English in Vietnam?"
        a: "Yes, in airports, hotels and big shops. And at the new metro stations, all the signs are in Vietnamese and English."
        ask: emma
        by: tom
        phrases: ["Yes, in…", "all the signs are in … and…"]
      - q: "Which sign did you learn first in Vietnamese, Emma?"
        a: "Lối ra: way out! And giảm giá: sale. Very useful at the market!"
        ask: tom
        by: emma
        phrases: ["… : way out!", "Very useful at…"]
      - q: "Which sign do you see every day?"
        a: "Queue here, at the bank and the post office. And at my school, there's a sign: please switch off your phone in class."
        ask: tom
        by: emma
        phrases: ["… , at the bank", "there's a sign: …"]
