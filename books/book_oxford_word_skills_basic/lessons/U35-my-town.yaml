# Video Oxford Word Skills Basic · Unit 35 — I can talk about my town (sách in tr. 91–93, Answer key tr. 212–213). Học sau Unit 34.
# UNIT KHÓ (đợt 40): 3 trang, ba phần — công trình trong thành phố (castle, cathedral, temple, mosque…), sự thật về một nơi (size,
# location, population, industrial, historic) và ý kiến (crowded, polluted, cosmopolitan, nightlife, safe); "your hometown" là chủ đề
# IELTS Part 1–2 hay gặp nhất — video khoảng 13 phút: phần sách, rồi ÔN TẬP (lỗi hay gặp) và LUYỆN NÓI CHUNG (Part 2 "your
# hometown", hai bài mẫu; ba câu thảo luận kiểu Part 3). Khuôn: file 09 mục 5.2. Không `wait` / `echo`; không khoảng lặng từ 3 giây
# (câu cuối cảnh tự trả lời `pause: 1.0`). Không có cảnh "Nghe và viết": unit có video nghe – viết riêng.
# Bài trong sách: đủ 1–9. Bài 1, 2, 4, 5, 7, 8 theo Answer key tr. 212–213 (bài 2 câu 6, 7 có hai chỗ trống: 6a/6b, 7a/7b). Bài 3
# (Test yourself): hai cảnh tranh không có chữ, đáp án hiện thành nhãn khi Tom trả lời. Bài 6 (ABOUT YOUR TOWN): đoạn văn mẫu của Tom
# về TP. Hồ Chí Minh. Bài 9 (ABOUT YOUR TOWN): Tom và Emma nói về TP. Hồ Chí Minh (cảnh Nói 1).
# Hình trong sách: ba hàng tranh công trình (hai cảnh), Spotlight place, bảng Facts (hai cảnh), bảng
# Opinions (hai cảnh), Glossary tr. 92 ba cảnh — khung theo tranh / theo dòng, đo bằng máy.
# Chi tiết nhân vật (khớp file 06 mục 9.4, file 09 mục 5.7): Tom lớn lên ở Đà Lạt (hồ sơ), trường gần hồ (hồ sơ), mẹ có cửa hàng
# hoa gần chợ (IELTS U04), quán lẩu gần chợ (U28); Đà Lạt đông khách du lịch hơn trước (IELTS U01-speaking-practice); căn hộ ở TP.
# HCM: khu sôi động, nhiều quán ăn rẻ, sáng ồn vì xe (IELTS U01). Emma lớn lên ở thị trấn nhỏ ven biển miền nam nước Anh, khoảng
# 15.000 dân, yên tĩnh, ai cũng biết nhau, hè nào cũng về thăm bố mẹ (hồ sơ, IELTS U01); fish and chips (U24); mới: thị trấn có
# nhà thờ cổ, bến cảng nhỏ, bãi biển; Emma thấy TP. HCM rất đa văn hóa, an toàn nhưng ồn.
# Dựng: cd agents && python -m lesson_video build ../books/book_oxford_word_skills_basic/lessons/U35-my-town.yaml
