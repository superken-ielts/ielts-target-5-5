# Video Oxford Word Skills Basic · Unit 41 — I can describe a living room (sách in tr. 104, Answer key tr. 214). Unit cuối module
# Places: tổng kết module, nhắc làm Review tr. 105–108.
# Khuôn: file 09 mục 5.2 (unit thường, 7–10 phút). Không `wait` / `echo`; không khoảng lặng từ 3 giây (câu cuối cảnh tự trả
# lời `pause: 1.0`). Không có cảnh "Nghe và viết": unit có video nghe – viết riêng.
# Bài trong sách: đủ 1–4. Bài 1, 2 theo Answer key tr. 214 (bài 1 câu 3 "cushion" F: sô-pha cũng có gối tựa). Bài 3 (ABOUT YOUR
# HOME): Tom và Emma hỏi đáp sáu câu (cảnh Nói 1). Bài 4 (Test yourself): tranh phòng khách (hai cảnh: nửa trên, nửa dưới — tranh
# to gấp đôi), đáp án hiện thành nhãn khi Tom trả lời, đủ 19 từ.
# Thêm ngoài sách: furniture không đếm được (a piece of furniture, không nói furnitures); giới từ tả vị trí trong phòng trên tranh
# sách (on the wall, above, under, in front of, next to, between, in the corner); phòng khách Việt Nam bằng tiếng Anh (ceiling fan,
# tiled floor, wooden sofa set, take off your shoes, Make yourself at home!); bài nói mẫu của Tom tả phòng khách nhà ở Đà Lạt (cảnh
# letter); Nói 2 (Part 1 "Your home").
# Hình trong sách: tranh phòng khách 19 mục (hai cảnh: nửa trên, nửa dưới, khung theo số; bài 4 cũng vậy), ghi chú furniture, tranh
# cả phòng ở bài 1 và cảnh giới từ.
# Chi tiết nhân vật (khớp file 06 mục 9.4, file 09 mục 5.7): Tom ở chung căn hộ tầng ba với hai bạn, phòng khách rất nhỏ (U38), mê
# bóng rổ (U01, U03); Emma ở căn hộ nhỏ tầng tám có ban công (U38), quê ở Anh. Mới: phòng khách của Tom có một cửa sổ nhỏ, sàn lát
# gạch, đèn và quạt trần; phòng khách của Emma có máy lạnh (ở Anh nhà bố mẹ có lò sưởi radiator), ảnh gia đình và bản đồ Việt Nam
# trên tường, sô-pha, bàn nước, giá sách — không đủ chỗ cho ghế bành.
# Phòng khách nhà Đà Lạt (nhà hai tầng của gia đình Tom, U38): tầng dưới cạnh bếp, khá rộng, bộ bàn ghế gỗ, sàn gạch, thảm, ảnh gia
# đình và tranh núi trên tường; buổi tối cả nhà uống trà, xem ti vi, ông luôn ngồi một ghế bành.
# Dựng: cd agents && python -m lesson_video build ../books/book_oxford_word_skills_basic/lessons/U41-living-room.yaml
