# Video Oxford Word Skills Basic · Unit 46 — I can talk about using a computer (sách in tr. 118–119, Answer key tr. 216).
# Khuôn: file 09 mục 5.2 (unit thường, 7–10 phút). Không `wait` / `echo`; không khoảng lặng từ 3 giây (câu cuối cảnh tự trả
# lời `pause: 1.0`). Không có cảnh "Nghe và viết": unit có video nghe – viết riêng.
# Bài trong sách: đủ 1–7. Bài 1, 2, 5, 6 theo Answer key tr. 216 (bài 2 câu 5 và bài 6 câu 2 có hai chỗ trống: 5a/5b, 2a/2b). Bài 3
# (ABOUT YOU): Emma hỏi Tom, Tom hỏi Emma (cảnh Nói 1). Bài 4 (Test yourself): tranh máy tính 1–13 (hai cảnh), đáp án hiện thành nhãn
# khi Tom trả lời. Bài 7 (Test yourself): bảy biểu tượng (hai cảnh, cắt bỏ chữ dưới hình), đáp án hiện thành nhãn.
# Thêm ngoài sách: máy tính ngày nay (smartphone, tablet, charger, the cloud, password) và phím tắt (Ctrl + C / X / V / S / P); Nói 2
# (Part 1 "Computers").
# Hình trong sách: tranh máy tính 13 mục (khung theo đồ vật), Spotlight keep, bảy biểu tượng, sáu câu dùng máy tính (khung theo câu),
# Glossary hai cảnh — đo bằng máy.
# Chi tiết nhân vật (khớp file 06 mục 9.4, file 09 mục 5.7): Tom là sinh viên, gọi về nhà mỗi Chủ nhật (U17); Emma dạy cả trực tuyến
# (U45). Mới: Tom chỉ có một máy tính xách tay cũ, để trong ba lô vì ngày nào cũng mang lên trường, in tài liệu ở thư viện trường;
# Emma có máy tính xách tay có webcam, lưu ảnh gia đình ở Anh và ảnh đi chơi ở Việt Nam, dùng webcam để dạy trực tuyến và gọi cho
# bố mẹ.
# Dựng: cd agents && python -m lesson_video build ../books/book_oxford_word_skills_basic/lessons/U46-computer.yaml
