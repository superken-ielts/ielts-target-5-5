# Video Oxford Word Skills Basic · Unit 50 — I can talk about my free time (sách in tr. 130–131, Answer key tr. 217).
# UNIT KHÓ (đợt 42): 35 mục Word list, cụm động từ go / play / do (some, a lot of) / collect / spend / make đi với từng hoạt động
# (lỗi người Việt rất hay mắc: play camping, go to fishing, listen music), sở thích là chủ đề IELTS Part 1 bắt buộc, "a hobby you had
# as a child" là đề Part 2 hay gặp — video khoảng 13 phút: phần sách, rồi bảng go / play / do, ÔN TẬP (lỗi hay gặp) và LUYỆN NÓI
# CHUNG (Part 2 "a hobby you had as a child", hai bài mẫu; ba câu thảo luận kiểu Part 3). Khuôn: file 09 mục 5.2. Không `wait` /
# `echo`; không khoảng lặng từ 3 giây (câu cuối cảnh tự trả lời `pause: 1.0`). Không có cảnh "Nghe và viết": unit có video nghe – viết
# riêng.
# Bài trong sách: đủ 1–6. Bài 1, 2, 5 theo Answer key tr. 217. Bài 3 (ABOUT YOU) thành cảnh Nói 1, bài 6 (ABOUT YOU AND YOUR COUNTRY)
# thành Nói 2 — Answer key chỉ có câu trả lời mẫu của một người Nhật. Bài 4 (Test yourself): bốn hàng tranh cắt bỏ dải tên, mỗi nửa hàng một cảnh (đáp án
# hiện thành nhãn khi Tom trả lời).
# Hình trong sách: bảng Common activities (hai cảnh, khung theo cột rồi theo ô), tranh tự kiểm tra (tám cảnh), bài đọc Favourite
# hobbies in Russia (ba cảnh, khung theo câu), Glossary (ba cảnh) — đo bằng máy.
# Chi tiết nhân vật (khớp file 06 mục 9.4, file 09 mục 5.7): Tom chơi bóng rổ, mê phim khoa học viễn tưởng, ngày mưa chơi game, đang học
# nấu ăn, hồi bé mê vẽ (mơ làm kiến trúc sư), mẹ có cửa hàng hoa, ông là thầy giáo Toán (nay nghỉ hưu, làm vườn); Emma nấu ăn, đi bộ
# đường dài, đọc truyện trinh thám, bơi, muốn học guitar (anh Jack chơi rất hay), học tiếng Việt, nhảy dở, ông dạy bơi năm 10 tuổi (ông
# đã mất), bà đan áo cho cả nhà, lớn lên ở thị trấn ven biển. Mới: Tom muốn một lần đi trượt tuyết (Việt Nam không có tuyết), không
# hứng thú cắm hoa, ông sưu tầm tiền xu cũ, thích hát karaoke dù hát không hay; hồi bé vẽ nhà, hoa, rừng thông gần nhà ở Đà Lạt bên bàn
# bếp trong lúc ông chấm bài, ông mua hộp bút chì màu đầu tiên và treo tranh đẹp lên tường, giờ vẫn vẽ vào vở trong giờ học chán; Emma
# hay đi du lịch, thỉnh thoảng tập gym, không hứng thú câu cá (chậm, thương con cá), nghe Mozart khi chấm bài; hồi bé sưu tầm vỏ sò: cuối
# tuần đi dọc biển với ông, cất trong hộp to dưới gầm giường (hơn hai trăm cái), hộp vẫn ở nhà bố mẹ.
