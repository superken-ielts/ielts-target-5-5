# Video Oxford Word Skills Basic · Unit 22 — I can talk about illness (sách in tr. 58–59, Answer key tr. 210). Học sau Unit 12.
# UNIT KHÓ (đợt 37): 11 bệnh, triệu chứng dễ nhầm mạo từ (a headache / toothache / flu), be ill ≠ be sick, hurt / pain, lời
# khuyên với should — chủ đề hay gặp ở IELTS General Training (xin nghỉ ốm) — video khoảng 12 phút: phần sách, rồi ÔN TẬP
# (lỗi hay gặp, email xin nghỉ ốm) và LUYỆN NÓI CHUNG (Part 2 "a time when you were ill", hai bài mẫu; ba câu thảo luận).
# Khuôn: file 09 mục 5.2. Không `wait` / `echo`; không khoảng lặng từ 3 giây.
# Thêm ngoài sách: Nghe và viết; câu đố "What should I do?" (dentist, take a break); email xin nghỉ ốm (thư GT Task 1).
# Bài trong sách: đủ 1–5. Bài 1, 2, 4, 5 theo Answer key tr. 210. Bài 1 câu 10 in trùng câu 8 ("Is / Has she got a
# temperature?" — file 09 mục 3.3), video nói rõ. Bài 3 (Test yourself): Emma nhắc che chữ, nhìn tranh, nói lại.
# Hình trong sách: hai dải tranh triệu chứng kèm bong bóng What's the matter? (tr. 58, khung theo tranh), tranh người ốm với
# bốn lời khuyên (tr. 59, khung theo bong bóng), Glossary kèm tranh lie down (khung theo dòng), khung Spotlight should.
# Chi tiết nhân vật (khớp file 06 mục 9.4, file 09 mục 5.7): Tom bị cúm tháng 12 năm ngoái, tuần trước kỳ thi giữa kỳ, sốt 39
# độ, nằm giường ba ngày; hai bạn cùng phòng nấu cháo; chị Hoa (y tá ở Hà Nội) gọi dặn uống nhiều nước, nghỉ ngơi; không đi làm
# ở quán được nên nhắn quản lý. Đau lưng khi ngồi laptop lâu, đau bụng trước kỳ thi (U12, U16). Emma: ở Anh khám bác sĩ gia
# đình (GP); ở Việt Nam ra hiệu thuốc trước, hiệu thuốc có ở khắp nơi; mùa mưa đầu tiên ở Việt Nam bị cảm và ho hai tuần, dược
# sĩ hiệu thuốc gần nhà giúp, nói tiếng Anh một chút; uống trà gừng mật ong.
# Dựng: cd agents && python -m lesson_video build ../books/book_oxford_word_skills_basic/lessons/U22-illness.yaml
