# Video Oxford Word Skills Basic · Unit 30 — I can get around on trains (sách in tr. 80–81, Answer key tr. 211–212). Học sau Unit 29.
# UNIT KHÓ (đợt 39): 2 trang, hai phần — từ về tàu hỏa (carriage, platform, miss / catch, journey, fare) và hội thoại mua vé
# (single / return, change, direct, book in advance), bảng giờ tàu — chủ đề hay gặp ở IELTS General Training (mua vé, giờ tàu,
# đi lại) — video khoảng 13 phút: phần sách, rồi đường sắt Việt Nam, đóng vai mua vé, ÔN TẬP (lỗi hay gặp) và LUYỆN NÓI CHUNG
# (Part 2 "a journey that you remember", hai bài mẫu; ba câu thảo luận kiểu Part 3); thêm thông báo ở nhà ga (delayed,
# cancelled) cho IELTS Listening. Khuôn: file 09 mục 5.2. Không `wait` /
# `echo`; không khoảng lặng từ 3 giây (câu cuối cảnh tự trả lời `pause: 1.0`). Không có cảnh "Nghe và viết": unit có video nghe –
# viết riêng.
# Bài trong sách: đủ 1–5. Bài 1–4 theo Answer key tr. 211–212 (bài 2 câu 5, 6 có hai đáp án: last / next, waited / wait). Bài 4:
# bảng giờ tàu hiện riêng trước khi làm. Bài 5 (ABOUT YOU): Tom và Emma hỏi đáp (cảnh Nói 1); Emma dùng ý của câu mẫu Answer key
# ("I always do, because you get reduced prices").
# Hình trong sách: tranh ga tàu (khung theo nhãn: train, carriage, timetable, seat, get on / off, wait for, miss / catch), Glossary
# và Spotlight last (tr. 80); hội thoại mua vé (khung theo dòng — Emma đọc hành khách P, Tom đọc nhân viên phòng vé O), Glossary và
# Spotlight book something in advance (tr. 81, hai cảnh để chữ đủ to), bảng giờ tàu bài 4.
# Chi tiết nhân vật (khớp file 06 mục 9.4, file 09 mục 5.7): Tom về Đà Lạt bằng xe khách (U20, U29), đặt vé xe trước dịp Tết; Đà Lạt
# không có tàu đi TP. HCM, chỉ có ga cổ và tàu du lịch đi Trại Mát; mới: năm 10 tuổi đi tàu Đà Lạt – Trại Mát với ông (ông mua cho
# một túi dâu tây); hè năm ngoái đi tàu ra Nha Trang với hai bạn cùng phòng (vé ngồi khoảng 300.000 đồng, đi thẳng khoảng tám
# tiếng). Emma không đi xe máy (hồ sơ), học tiếng Việt; ở Anh vé tàu rất đắt (U20) nên luôn đặt trước; mới: tháng Tư
# năm nay đi tàu một mình ra Phan Thiết (đặt vé qua ứng dụng, khoảng bốn tiếng), ngồi cạnh một gia đình Việt, tập nói tiếng Việt với
# bọn trẻ; thích tuyến metro mới của TP. HCM (nhanh, sạch).
# Dựng: cd agents && python -m lesson_video build ../books/book_oxford_word_skills_basic/lessons/U30-trains.yaml
