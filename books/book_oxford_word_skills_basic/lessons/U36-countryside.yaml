# Video Oxford Word Skills Basic · Unit 36 — I can describe the countryside (sách in tr. 94–95, Answer key tr. 213).
# Khuôn: file 09 mục 5.2 (unit thường, 7–10 phút). Không `wait` / `echo`; không khoảng lặng từ 3 giây (câu cuối cảnh tự trả
# lời `pause: 1.0`). Không có cảnh "Nghe và viết": unit có video nghe – viết riêng và đã đủ 7 bài trong sách.
# Bài trong sách: đủ 1–7. Bài 1, 2, 5, 6 theo Answer key tr. 213. Answer key in lệch (file 09 mục 3.3): bài 1 câu 2 "The farmer's
# in the boat" ghi T, nhưng tranh cho thấy người nông dân đứng cạnh hàng rào, thuyền trống — video nói rõ đáp án là F. Bài 3 (ABOUT
# YOU AND YOUR COUNTRY): Tom và Emma hỏi đáp câu hỏi bài 2 (cảnh Nói 1). Bài 4 (Test yourself): tranh trang trại, đáp án hiện thành
# nhãn khi Tom trả lời. Bài 7 (ABOUT YOU): câu bài 6 sửa cho đúng với Tom.
# Thêm ngoài sách: nông thôn Việt Nam bằng tiếng Anh (rice field, water buffalo, terraced fields, fruit farms, coffee farms); Nói 2
# (Part 1 "The countryside").
# Hình trong sách: tranh trang trại 14 mục (khung theo số), đoạn Jack Robson và Glossary, lời kể của người phụ nữ (khung theo dòng,
# đo bằng máy), Glossary tr. 95 hai cảnh, Spotlight alone and lonely.
# Chi tiết nhân vật (khớp file 06 mục 9.4, file 09 mục 5.7): ông của Tom trồng rau trong vườn (hồ sơ, U25), bố làm cho công ty cà
# phê (hồ sơ), mẹ có cửa hàng hoa (IELTS U04); Tom ở chung căn hộ với hai bạn (hồ sơ), chơi bóng rổ (hồ sơ), ăn xoài (U25), xe buýt
# đông (U11, U29), gọi về nhà mỗi Chủ nhật (U17). Emma đi bộ đường dài (hồ sơ), quê ven biển (hồ sơ), căn hộ tầng 8 có ban công
# (IELTS U01). Mới: nhà Tom ở Đà Lạt trên đồi, nhìn xuống thung lũng; Tom không nuôi chó, ông muốn nuôi một con chó cho khu vườn; quanh
# Đà Lạt trồng rau, hoa, dâu tây, cà phê, công ty của bố mua cà phê của nông dân; Tom ăn xoài mỗi ngày, đôi khi thấy cô đơn, nhớ nhà.
# Gần quê Emma có nhiều trang trại, bố mẹ mua trứng, rau tươi ở đó; từ ban công Emma chỉ thấy vài cây; Emma đi Sa Pa hai năm trước.
