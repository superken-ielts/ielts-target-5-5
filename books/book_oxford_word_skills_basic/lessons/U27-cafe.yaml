# Video Oxford Word Skills Basic · Unit 27 — I can order in a café (sách in tr. 71, Answer key tr. 211). Học sau Unit 26.
# Khuôn: file 09 mục 5.2 (unit thường, 7–10 phút). Không `wait` / `echo`; không khoảng lặng từ 3 giây (câu cuối cảnh tự trả
# lời `pause: 1.0`).
# Bài trong sách: đủ 1–4. Bài 1–3 theo Answer key tr. 211. Bài 4 (Test yourself): tranh trong sách in kèm danh sách tên nên
# không che được — video làm dạng nghe tiếng Việt, nói tên tiếng Anh (tạm dừng video).
# Hội thoại tr. 71: Tom đọc người phục vụ (W) — Tom làm thêm ở quán cà phê (hồ sơ), Emma đọc khách (C).
# Unit một trang nên thêm ngoài sách: đồ uống quán Việt bằng tiếng Anh (iced coffee with milk, egg coffee…), cỡ ly và yêu cầu riêng
# (less sugar, no ice), take away (Anh) = to go (Mỹ); câu hay dùng (menu, Wi-Fi, gọi nhầm món, tính tiền), câu đố tình huống; đóng vai gọi đồ (Tom là phục vụ); Nghe và viết; Nói 1, Nói 2 (Part 1
# "Coffee and tea").
# Hình trong sách: 12 tranh đồ uống và đồ ăn (khung theo tranh, danh sách tên bên trái), hội thoại (khung theo dòng), Glossary và
# Spotlight Yes, please? / Yes, please.
# Chi tiết nhân vật (khớp file 06 mục 9.4, file 09 mục 5.7): Tom làm phục vụ ở quán cà phê gần trường tối thứ Ba, thứ Năm (hồ
# sơ), mặc sơ mi đen (U19); món khách gọi nhiều nhất là cà phê sữa đá; Tom thích nhất cà phê sữa đá (U07), uống ít đường. Emma uống
# cappuccino buổi sáng, chiều uống trà sữa kiểu Anh (tea with milk); đã thử cà phê trứng ở Hà Nội và rất thích.
