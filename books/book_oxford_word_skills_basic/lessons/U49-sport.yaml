# Video Oxford Word Skills Basic · Unit 49 — I can talk about sport (sách in tr. 128–129, Answer key tr. 217).
# UNIT KHÓ (đợt 42): 40 mục Word list (nhiều nhất module), môn – sân – dụng cụ – cách tính điểm (pitch / court / rink, goals ≠
# points, nil, set), cặp động từ dễ nhầm win ≠ beat, draw with, lose to (bất quy tắc), bảng xếp hạng; "a sport you like" là đề Part 2
# hay gặp — video khoảng 13 phút: phần sách, rồi câu nói về trận đấu, ÔN TẬP (lỗi hay gặp) và LUYỆN NÓI CHUNG (Part 2 "a sport you
# like", hai bài mẫu; ba câu thảo luận kiểu Part 3). Khuôn: file 09 mục 5.2. Không `wait` / `echo`; không khoảng lặng từ 3 giây (câu
# cuối cảnh tự trả lời `pause: 1.0`). Không có cảnh "Nghe và viết": unit có video nghe – viết riêng.
# Bài trong sách: đủ 1–6 theo Answer key tr. 217 (bài 3, 5: câu có hai chỗ trống tách thành 3a / 3b…; bài 4: từ in đậm ghi trong
# ngoặc). Bài 6 (ABOUT YOUR COUNTRY: chép tỉ số cuối tuần bằng tiếng Anh) thành cảnh câu mẫu, Tom kể trận bóng rổ của đội trường.
# Hình trong sách: bảng Games (hai cảnh, khung theo cột rồi theo hàng), ô chữ bài 1, kết quả bóng đá Ý, bảng xếp hạng, bài báo (hai
# cột, khung theo dòng), Glossary (hai cảnh), Spotlight động từ bất quy tắc — đo bằng máy.
# Chi tiết nhân vật (khớp file 06 mục 9.4, file 09 mục 5.7): Tom chơi bóng rổ hai buổi một tuần (áo số 9, số may mắn), học chơi từ hồi
# cấp ba ở Đà Lạt; em Bao 15 tuổi mê bóng đá; Emma không mê thể thao (không xem trên TV) nhưng thích bơi, ông dạy bơi năm 10 tuổi ở
# biển gần quê; anh Jack. Mới: Tom chơi ở sân ngoài trời gần trường, mùa mưa chơi trong nhà thi đấu, đôi khi đấu với trường khác; thứ
# Bảy vừa rồi đội Tom thắng trường y 62–58, Tom ghi 18 điểm; Bao chiều nào tan học cũng đá bóng, muốn làm cầu thủ; Emma hồi đi học chơi
# khúc côn cầu trên cỏ (không giỏi), Jack mê bóng bầu dục; Emma bơi ở hồ bơi gần nhà sau giờ làm, hai ba lần một tuần.
