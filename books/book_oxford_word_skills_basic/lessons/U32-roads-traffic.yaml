  - kind: qa
    chapter: "Nói 1: giao thông ở nước bạn"
    heading: "Speaking 1 · Exercise 6: roads in your country"
    heading_vi: "Bài 6 (ABOUT YOUR COUNTRY) — tạm dừng sau mỗi câu hỏi để tự trả lời, rồi nghe câu mẫu"
    items:
      - q: "How many lanes do motorways have in Vietnam?"
        a: "We call them expressways. Most have two lanes on each side, and some new ones have more."
        ask: emma
        by: tom
        phrases: ["We call them…", "on each side"]
      - q: "What's the speed limit on motorways?"
        a: "Up to a hundred and twenty kilometres an hour on some expressways. In Britain, it's seventy miles an hour."
        ask: emma
        by: tom
        phrases: ["Up to…", "kilometres an hour"]
      - q: "Do you have speed cameras on roads?"
        a: "Yes, there are more and more cameras now, especially in big cities."
        ask: emma
        by: tom
        phrases: ["more and more…", "especially in…"]
      - q: "Do you drive on the left in your country?"
        a: "No, we drive on the right in Vietnam, like most countries. But in Britain, they drive on the left."
        ask: emma
        by: tom
        phrases: ["No, we drive on the right…", "like most countries"]
      - q: "When's the rush hour?"
        a: "From about seven to eight in the morning, and five to seven in the evening. The traffic jams are terrible!"
        ask: emma
        by: tom
        phrases: ["From about … to…", "The traffic jams are terrible!"]
