# Video Oxford Word Skills Basic · Unit 32 — I can talk about roads and traffic (sách in tr. 84–85, Answer key tr. 212).
# UNIT KHÓ (đợt 39): 2 trang, hai phần — 12 từ trong tranh khu phố (junction, roundabout, traffic jam, pedestrian crossing…) và
# hội thoại đường cao tốc (how far, motorway, speed limit, rush hour, lane, overtake), Glossary nhiều từ — giao thông là chủ đề hay
# gặp ở IELTS (Part 1–3, Writing Task 2) — video khoảng 13 phút: phần sách, rồi giao thông ở Việt Nam, ÔN TẬP (lỗi hay gặp, tự kiểm
# tra tranh khu phố) và LUYỆN NÓI CHUNG (Part 2 "a place in your city where there is often a lot of traffic", hai bài mẫu; ba câu
# thảo luận kiểu Part 3); thêm How far? / How long? (khoảng cách, thời gian). Khuôn: file 09 mục 5.2. Không `wait` / `echo`; không khoảng lặng từ 3 giây (câu cuối cảnh tự trả lời
# `pause: 1.0`). Không có cảnh "Nghe và viết": unit có video nghe – viết riêng.
# Bài trong sách: đủ 1–6. Bài 1, 2, 4, 5 theo Answer key tr. 212 (bài 5: câu có hai chỗ trống tách 2a/2b, 4a/4b). Bài 3 (Test
# yourself): cảnh tự kiểm tra tranh khu phố ở phần ôn tập (khung đỏ ở số được hỏi, đáp án hiện thành nhãn khi Tom trả lời). Bài 6
# (ABOUT YOUR COUNTRY): Tom trả lời về Việt Nam, Emma thêm về nước Anh (cảnh Nói 1; Answer key là câu của "a Turkish person").
# Hình trong sách: tranh khu phố 12 mục (tr. 84, hai cảnh nửa trên / nửa dưới kèm danh sách tên, khung theo số), hội thoại Beth – Marco (tr. 85, khung theo dòng —
# Emma đọc Beth, Tom đọc Marco), Glossary hai cảnh (tranh accident, lane).
# Chi tiết nhân vật (khớp file 06 mục 9.4, file 09 mục 5.7): Tom biết đi xe máy (hồ sơ: bố dạy), ghét đi xe máy dưới mưa to (U21);
# Emma không đi xe máy, hơi sợ giao thông, giận xe máy chạy trên vỉa hè (hồ sơ), đi xe ôm công nghệ (U17). Mới: Tom thỉnh thoảng
# đi xe máy, tránh giờ cao điểm; vòng xoay lớn gần trường đại học hay kẹt xe; đường trước trường Emma đông vào giờ đưa đón học sinh.
