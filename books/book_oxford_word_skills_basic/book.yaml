# Hồ sơ lộ trình "Oxford Word Skills Basic" cho agent book_ingest — mẫu lessons-v1 (agents/book_ingest/lessons.py).
# Sách từ vựng A1–A2 của Oxford (Ruth Gairns, Stuart Redman, 2008): 80 unit 1–3 trang, gom thành 11 module theo chủ
# đề, mỗi module có một bài Review; cuối sách có Answer key (mọi bài tập, kể cả câu trả lời mẫu cho phần ABOUT YOU) và
# Word list có phiên âm. Bộ dữ liệu chỉ có PDF quét (không có CD-ROM nên không có audio). Thiết kế, cách học bằng video
# 7–10 phút và sổ tay làm video: docs/agent-hoc-tap/09-oxford-word-skills-basic.md.
#
# Sinh từ trang Contents (tr. in 3–6) và OCR tiêu đề "Unit N" của Answer key; sửa tay ở đây rồi chạy lại ingest.
# `pages` là SỐ TRANG IN. File PDF quét thiếu hai trang trắng (tr. in 204 sau trang tựa Answer key, tr. in 236 trước Word
# list) nên khai ba lần: `course-book` (tr. in 1–203 = PDF + 1), `answer-key` (tr. in 205–235 = PDF), `word-list`
# (tr. in 237–254 = PDF − 1). Đã soát: số trang in ở chân 244 trang, 11 trang Review và 12 trang đầu unit.
#
# Mỗi unit một phiên khoảng 30 phút: xem video 7–10 phút (không đếm ngược), làm bài trong sách, chữa bằng Answer key, nói
# phần ABOUT YOU. Cuối mỗi module một phiên Review (bài ôn trong sách + Answer key to review units).

book: oxford-word-skills-basic
title: Oxford Word Skills Basic
edition: oup-2008
template: lessons-v1
start_week: 1
sessions_per_week: 5
minutes_per_session: 30
pace: [3, 5, 7]

info:
  course: ielts
  role: Từ vựng nền tảng A1–A2 · học song song
  module: Từ vựng · Elementary – Pre-intermediate
  author: Ruth Gairns, Stuart Redman
  publisher: Oxford University Press
  level: Elementary – Pre-intermediate
  cefr: A1 → A2
  summary: >-
    Sách từ vựng của Oxford cho trình độ A1–A2: hơn 2.000 từ và cụm từ thông dụng trong 80 unit ngắn (1–3 trang), gom
    thành 11 module theo chủ đề — số, giờ, ngày tháng; con người; đời sống hằng ngày; ăn uống; đi lại; nơi chốn; học tập
    và công việc; sở thích; kỳ nghỉ; giao tiếp xã hội; ngữ pháp từ vựng (giới từ, cụm động từ, từ nối). Bộ ba cuốn Oxford
    Word Skills gần như phủ trọn Oxford 3000; cuốn Basic là phần thông dụng nhất, đúng các chủ đề của IELTS Speaking Part 1
    và General Training. Mỗi unit một phiên khoảng 30 phút: unit đã có video thì xem trước
    (7–10 phút: dạy từ, chữa bài trong sách, 1–2 phần luyện nói theo chủ đề, không đếm ngược — muốn trả lời thì tự tạm
    dừng video), rồi làm bài, chữa bằng Answer key, nói phần ABOUT YOU. Cuối mỗi module có một phiên Review.
  start_when: >-
    Học song song với Giai đoạn 0 (English Unlimited A2) hoặc Giai đoạn 1, không thay giáo trình chính: mỗi ngày một unit,
    5 phiên/tuần là khoảng 19 tuần. Đã chắc A2 thì đi nhanh hai module đầu (Basic English, People) và dồn sức từ module
    Everyday life. Tuần ở đây đếm riêng cho cuốn này.

files:
  course-book:
    kind: pdf
    label: Oxford Word Skills Basic
    path: Oxford_Word_Skills_Bas.pdf
    page_offset: 1            # trang in 14 (Unit 1) = trang PDF 15 … trang in 203 (tựa Answer key) = PDF 204
  answer-key:
    kind: pdf
    label: Answer key
    path: Oxford_Word_Skills_Bas.pdf
    page_offset: 0            # bản quét thiếu trang in 204 (trắng): trang in 205 = PDF 205 … 235 = PDF 235
  word-list:
    kind: pdf
    label: Word list
    path: Oxford_Word_Skills_Bas.pdf
    page_offset: -1           # bản quét thiếu trang in 236 (trắng): trang in 237 = PDF 236 … 254 = PDF 253

# Không có trong bộ dữ liệu: CD-ROM (phát âm mẫu từng từ, bài luyện thêm, bài nghe).
missing: [cd-rom]

steps:
  - id: words
    title: "{title} · từ vựng, bài tập, nói"
    skill: vocab
    core: true
    minutes: 30
    note: >-
      Unit {no} — {can} ({vi}). Có video thì xem trước (7–10 phút, không đếm ngược: khi Emma hỏi thì tạm dừng video, trả
      lời thành tiếng rồi xem tiếp). Rồi làm các bài trong sách, chữa bằng Answer key (nút bên dưới); phần ABOUT YOU trả
      lời thành tiếng, so với câu mẫu trong Answer key. Chép 5–8 từ mới kèm một câu ví dụ vào Anki, rồi làm Test yourself:
      che bảng từ và nói lại.

review-step: &review
  - id: review
    title: ôn tập cả module
    skill: vocab
    core: true
    minutes: 45
    note: >-
      Review — module {title}. Làm hết các bài ôn (mỗi bài ứng với một unit, tiêu đề ghi số unit), chữa bằng Answer key
      to review units. Unit nào sai từ 2 câu trở lên thì xem lại video và trang sách của unit đó; câu sai ghi vào sổ lỗi.

