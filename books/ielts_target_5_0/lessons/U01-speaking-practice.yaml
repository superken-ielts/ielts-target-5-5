    heading: "How to shadow"
    heading_vi: "Shadowing — nghe và nói đuổi theo người nói mẫu"
    items:
      - {en: "Listen once and read the subtitles", vi: "Nghe một lần, đọc phụ đề để hiểu nghĩa"}
      - {en: "Listen and repeat: say each sentence in the pause", vi: "Nghe rồi nhắc lại từng câu trong khoảng lặng (cuối video)"}
      - {en: "Shadow: speak at the same time as Tom or Emma", vi: "Nói cùng lúc với người nói mẫu, bắt chước trọng âm và ngữ điệu"}
      - {en: "Loop one chapter many times in the app", vi: "Trong app: bấm 'Lặp chương này' hoặc A–B để nghe lại nhiều lần"}
      - {en: "Record yourself and compare", vi: "Ghi âm giọng mình rồi so với Tom và Emma"}
