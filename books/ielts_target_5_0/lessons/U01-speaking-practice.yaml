  - kind: qa
    chapter: "Thi thử 1 · Phần 3"
    heading: "Mock test 1 · Part 3 · Discussion"
    heading_vi: "Phần 3 — câu hỏi chung hơn: trả lời dài hơn, có lý do và ví dụ"
    roles: {emma: examiner, tom: candidate}
    items:
      - q: "In your country, do young people often live with their grandparents?"
        a: "Yes, quite often, especially in the countryside. Grandparents help to look after the children, and later the children look after them. But in big cities, more young couples live on their own now."
        phrases: ["especially in…", "look after", "on their own"]
      - q: "What can young people learn from older people?"
        a: "I think they can learn a lot. Older people have more life experience, so they can give good advice about work, money and relationships. They can also teach us about our family history."
        phrases: ["life experience", "give good advice", "family history"]
      - q: "Should older people keep working after retirement age?"
        a: "It depends. If they're healthy and they enjoy their job, working a little is good for them. But after many years of hard work, they also deserve to rest and enjoy their free time."
        phrases: ["It depends.", "is good for them", "deserve to rest"]
      - q: "How can young people help older people in their community?"
        a: "They can do small things, like helping with shopping, or teaching them to use smartphones. Many older people feel lonely, so even a short visit or a phone call can make them happy."
        phrases: ["like helping with…", "feel lonely", "even a short visit"]
