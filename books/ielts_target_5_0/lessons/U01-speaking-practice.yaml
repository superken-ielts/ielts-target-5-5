  - kind: qa
    chapter: "Hỏi qua lại: gia đình"
    heading: "Tom and Emma ask each other · Family"
    heading_vi: "Gia đình — tạm dừng sau mỗi câu hỏi để tự trả lời"
    items:
      - q: "Tom, how many people are there in your family?"
        a: "There are five of us: my parents, my older sister, my younger brother and me. My grandfather lives with us too, so our house is never quiet!"
        ask: emma
        by: tom
        phrases: ["There are five of us", "lives with us", "never quiet"]
      - q: "What about you, Emma? Do you have a big family?"
        a: "Not really. I've got one brother, but I have lots of cousins. When I was a child, we spent every summer together at my grandparents' house."
        ask: tom
        by: emma
        phrases: ["Not really.", "lots of cousins", "When I was a child…"]
      - q: "What do your parents do?"
        a: "My dad works for a coffee company, and my mum has a small flower shop. Da Lat is famous for coffee and flowers, so their jobs are very typical!"
        ask: emma
        by: tom
        phrases: ["works for…", "has a small… shop", "is famous for…"]
      - q: "Who are you closest to in your family?"
        a: "Probably my brother. He's two years older than me, and we have the same sense of humour. We send each other funny videos almost every day."
        ask: tom
        by: emma
        phrases: ["Probably…", "two years older than me", "the same sense of humour"]
      - q: "What do you usually do together as a family?"
        a: "We usually have dinner together and talk about our day. At the weekend, we sometimes walk around the lake in the city centre, and then we have a hot drink."
        ask: emma
        by: tom
        phrases: ["We usually…", "talk about our day", "At the weekend…"]
      - q: "Do you see your relatives often?"
        a: "Not very often, because they live quite far away. But we all meet at my grandmother's house at Christmas, and it's always lovely and noisy."
        ask: tom
        by: emma
        phrases: ["Not very often", "quite far away", "lovely and noisy"]
      - q: "Who does the cooking in your family?"
        a: "Mostly my mum, and she's a fantastic cook. But on Sundays, my dad makes breakfast for everyone. He's very proud of his fried eggs!"
        ask: emma
        by: tom
        phrases: ["Mostly…", "a fantastic cook", "very proud of…"]
      - q: "Is family important in your country?"
        a: "Yes, definitely, but families are usually smaller than in Vietnam. Many young people move away for work, so families often meet only on special occasions."
        ask: tom
        by: emma
        phrases: ["Yes, definitely", "move away for work", "special occasions"]
