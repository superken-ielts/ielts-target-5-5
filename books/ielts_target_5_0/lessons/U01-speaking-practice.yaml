  - kind: qa
    chapter: "Thi thử 1 · Phần 1"
    heading: "Mock test 1 · Part 1 · Introduction and interview"
    heading_vi: "Thi thử Phần 1 — giám khảo hỏi về bạn (bài thi thật: 4–5 phút)"
    roles: {emma: examiner, tom: candidate}
    items:
      - q: "Can you tell me your full name, please?"
        a: "Good morning. My full name is Tran Minh Tuan, but please call me Tom."
        phrases: ["My full name is…", "please call me…"]
      - q: "Can I see your identification, please?"
        a: "Yes, of course. Here you are."
      - q: "Do you live in a house or a flat?"
        a: "At the moment, I live in a flat. I share it with two friends from my course. It's quite small, but it's very close to my university."
        phrases: ["At the moment…", "I share it with…", "very close to…"]
      - q: "What do you like about the area where you live?"
        a: "It's very lively, and there are lots of cheap places to eat near my flat. The only problem is the traffic. It's really noisy in the morning."
        phrases: ["very lively", "cheap places to eat", "The only problem is…"]
      - q: "Do you spend a lot of time with your family?"
        a: "Not as much as I'd like. My family lives in Da Lat, so I only go home in the holidays. But we have a video call every Sunday."
        phrases: ["Not as much as I'd like.", "in the holidays", "a video call"]
      - q: "Who are you most similar to in your family?"
        a: "Probably my father. We're both quite calm and patient, and we both love basketball. People say we look alike, too."
        phrases: ["Probably…", "We're both…", "look alike"]
      - q: "Why are you learning English?"
        a: "Mainly for my career. I want to work for an international company after I graduate, and English is really important for that."
        phrases: ["Mainly for…", "after I graduate", "really important"]
      - q: "How often do you practise speaking English?"
        a: "Almost every day. I watch videos with English subtitles, and I practise speaking with my friends from class. It's hard, but I'm getting better."
        phrases: ["Almost every day", "with English subtitles", "I'm getting better"]
