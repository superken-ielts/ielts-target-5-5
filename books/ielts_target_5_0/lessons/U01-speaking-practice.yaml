  - kind: qa
    chapter: "Hỏi qua lại: nơi ở, quê nhà"
    heading: "Tom and Emma ask each other · Home and hometown"
    heading_vi: "Nơi ở và quê nhà — trả lời rồi thêm 1–2 chi tiết"
    items:
      - q: "Where are you from, Tom?"
        a: "I was born in Hanoi, but my family moved to Da Lat when I was five, so I grew up there. It's a small city in the mountains, and it's cool all year."
        ask: emma
        by: tom
        phrases: ["I was born in…", "I grew up there", "cool all year"]
      - q: "And what's your hometown like, Emma?"
        a: "It's a small town by the sea. It's quiet and friendly, and everybody knows everybody. I go back to visit my parents every summer."
        ask: tom
        by: emma
        phrases: ["by the sea", "everybody knows everybody", "go back to visit"]
      - q: "What do you like most about Da Lat?"
        a: "I love the weather. It's cool all year, so you can wear a jacket even in summer. There are also flowers everywhere, and the air is really fresh."
        ask: emma
        by: tom
        phrases: ["I love the weather", "even in summer", "really fresh"]
      - q: "Where do you live now?"
        a: "I live in a small apartment in Ho Chi Minh City. It's on the eighth floor, and it has a little balcony, where I grow herbs and tomatoes."
        ask: tom
        by: emma
        phrases: ["I live in…", "on the eighth floor", "where I grow…"]
      - q: "What's your favourite room in your home?"
        a: "In my family's house, it's the kitchen. It's warm and cosy, and it's where we eat and talk. In my flat here, I don't really have a favourite room. It's too small!"
        ask: emma
        by: tom
        phrases: ["warm and cosy", "where we eat and talk", "It's too small!"]
      - q: "Do you get on well with your neighbours?"
        a: "Yes, I do. My neighbour is an old lady who lives alone, so I sometimes help her with her shopping. In return, she gives me delicious soup!"
        ask: tom
        by: emma
        phrases: ["get on well with", "lives alone", "In return…"]
      - q: "Has your hometown changed much since you were a child?"
        a: "Yes, a lot. There are many more hotels and cafés now, because lots of tourists visit. It's busier than before, but it's still beautiful."
        ask: emma
        by: tom
        phrases: ["Yes, a lot.", "many more… now", "busier than before"]
      - q: "Would you like to live in your hometown again in the future?"
        a: "Maybe when I'm older. It's a lovely place to retire, because it's quiet and close to the sea. But right now, I prefer the energy of a big city."
        ask: tom
        by: emma
        phrases: ["Maybe when I'm older", "a lovely place to retire", "I prefer…"]
