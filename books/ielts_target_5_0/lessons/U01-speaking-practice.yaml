# Video luyện nói thêm Unit 1 · Life — 1/4: gia đình, nơi ở, quê nhà + thi thử 1 (Emma giám khảo, Tom thí sinh).
# Người học yêu cầu, không theo trang sách. Người học tự tạm dừng video để trả lời, nên không có khoảng lặng chờ:
# dồn tối đa câu hỏi – câu trả lời mẫu của cả Tom và Emma (đợt 14).
# Dựng: cd agents && python -m lesson_video build ../books/ielts_target_5_0/lessons/U01-speaking-practice.yaml
# Cách viết: xem đầu file U01-speaking-1.yaml. Câu trả lời mẫu tự viết bằng từ vựng của Unit 1.
# Thông tin nhân vật (giữ khớp ở cả bốn video và các video Unit 1 trước):
# - Tom (Tran Minh Tuan): sinh ở Hà Nội, lớn lên ở Đà Lạt; học kinh doanh năm hai ở TP. Hồ Chí Minh, ở chung căn hộ nhỏ
#   với hai bạn; bố làm cho công ty cà phê, mẹ có cửa hàng hoa; chị gái là y tá ở Hà Nội, em trai 15 tuổi; ông nội là
#   thầy giáo toán đã nghỉ hưu, sống cùng nhà, trồng rau; chơi bóng rổ, xem phim; muốn làm cho công ty quốc tế.
# - Emma (Emma Louise Clarke): người nước ngoài, dạy tiếng Anh cho người lớn ở TP. Hồ Chí Minh ba năm nay; lớn lên ở
#   thị trấn nhỏ ven biển; có một anh trai (hơn hai tuổi), nhiều anh chị em họ; ông mất vài năm trước, bà còn;
#   bố mẹ sắp nghỉ hưu; thích nấu ăn, đi bộ đường dài, đọc truyện trinh thám.
