      - {tom: "Five: you can ask the examiner to explain a word that you don't understand. True.", focus: 4}
      - {tom: "Six: you must say something that the examiner will agree with. False. The examiner wants your opinion.", focus: 5, vi: "6 sai: giám khảo muốn nghe ý kiến của bạn, không cần đồng ý với họ."}
      - {tom: "Seven: you should speak clearly and fairly slowly. True.", focus: 6}
      - {tom: "Eight: your language must always be grammatically correct. False. Small mistakes are normal. A full answer is more important.", focus: 7, vi: "8 sai: lỗi nhỏ là bình thường; trả lời đầy đủ quan trọng hơn."}

