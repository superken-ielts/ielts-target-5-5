    lines:
      - emma: "Speaking, Exercise A. In the third part of the Speaking Module, you need to express your opinions. Mark these sentences true or false. Pause the video and try."
        say: "Speaking, Exercise eigh. In the third part of the Speaking Module, you need to express your opinions. Mark these sentences true or false. Pause the video and try."
        vi: "Bài A: đúng hay sai về Phần 3 bài thi Nói? Tạm dừng video và làm."
        pause: 1.5
      - {tom: "One: if you don't know what to say, you can ask for another question. False. You can't change the question.", focus: 0, vi: "1 sai: không được đổi câu hỏi."}
      - {tom: "Two: you must try to answer the questions that the examiner asks. True.", focus: 1}
