        vi: "Bài A: điền từ tạo từ các từ gốc trong khung. Tạm dừng video và làm."
        pause: 1.5
      - {mai: "I think Mustafa will have a very successful career.", focus: 0, vi: "success → successful (tính từ)"}
      - {mai: "She had to overcome a number of early difficulties.", focus: 1, vi: "difficult → difficulties (danh từ số nhiều)"}
      - {mai: "My brother works hard, but he isn't very ambitious.", focus: 2, vi: "ambition → ambitious (tính từ)"}
