        focus: 3
        vi: "Người 4: đúng ngữ pháp, từ vựng phong phú, nói cả hai phía có ví dụ."
      - emma: "Good. If you don't understand, say: Sorry, could you repeat the question, please?"
        vi: "Không hiểu thì nói: Sorry, could you repeat the question, please?"

  - kind: qa
    chapter: "Speaking E: đến lượt bạn"
    heading: "Speaking E · Answer these two questions"
    heading_vi: "Tạm dừng video và trả lời trước, rồi nghe Tom — ý kiến + lý do + ví dụ"
    items:
      - q: "Does being successful mean doing better than other people?"
        a: "Not always. For me, success means doing better than I did before. For example, if I get 5.5 in IELTS, that's a success for me, even if my friend gets 6.5."
        vi: "Không hẳn: thành công là giỏi hơn chính mình trước đây."
        phrases: ["Not always", "better than I did before"]
        ask: emma
        by: tom
      - q: "Can you only enjoy success if other people know about it?"
        a: "I don't think so. Some achievements are private, like learning to swim. But it's nice when your family is proud of you."
        vi: "Không: có thành công rất riêng tư; nhưng gia đình tự hào thì cũng vui."
        phrases: ["I don't think so", "proud of you"]
        ask: emma
        by: tom
    lines:
