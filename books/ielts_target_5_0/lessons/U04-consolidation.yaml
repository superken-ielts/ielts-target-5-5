        focus: 0
        vi: "Ai mắc lỗi ngữ pháp, dùng từ đơn giản nhưng trả lời tốt?"
      - tom: "Speaker 3. Some people is born very clever is a mistake. It should be: some people are. But the answer is good: some people are clever, other people try and try."
        say: "Speaker three. Some people is born very clever is a mistake. It should be: some people are. But the answer is good: some people are clever, other people try and try."
        focus: 0
