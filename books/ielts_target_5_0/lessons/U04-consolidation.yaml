      - {emma: "And do you think people are born to achieve, or do they learn to achieve?", focus: 0}
      - {tom: "Yes, I think so.", focus: 0}
      - {emma: "And do you think people are born to achieve, or do they learn to achieve?", focus: 1}
      - {mai: "I don't know. Maybe are born with this ability.", focus: 1}
      - {emma: "And do you think people are born to achieve, or do they learn to achieve?", focus: 2}
      - {mai: "Mm, I didn't think about it before. Some people is born very clever, so maybe can achieve a lot. Other people is not so clever, but try and try. Maybe that is learn to achieve.", focus: 2}
      - {emma: "And do you think people are born to achieve, or do they learn to achieve?", focus: 3}
      - {jerry: "Mm, it's a good question. I guess some people are born to achieve. You know, like a genius or someone with an incredible talent, but some people learn to achieve. Maybe their parents teach them good things, or they learn by mistakes.", focus: 3}

  - kind: figure
    chapter: "Speaking C–D: đáp án"
    heading: "Speaking C–D · Answers: 1 NG · 2 NG · 3 G · 4 G"
    heading_vi: "Bài D tr. 55 — người nói nào làm gì? Nhãn đỏ là người nói (đáp án suy ra)"
