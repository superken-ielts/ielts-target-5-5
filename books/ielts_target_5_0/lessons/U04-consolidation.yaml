        say: "Exercise ee. Answer these two questions. Pause after each question and answer out loud first."
        vi: "Bài E: trả lời hai câu hỏi. Tạm dừng sau mỗi câu và nói thành tiếng trước."
      - {emma: "Does being successful mean doing better than other people?", focus: 0, pause: 1.5}
      - {tom: "Not always. For me, success means doing better than I did before. For example, if I get 5.5 in IELTS, that's a success for me, even if my friend gets 6.5.", say: "Not always. For me, success means doing better than I did before. For example, if I get five point five in eye-elts, that's a success for me, even if my friend gets six point five.", reveal: 0}
      - {emma: "Can you only enjoy success if other people know about it?", focus: 1, pause: 1.5}
      - {tom: "I don't think so. Some achievements are private, like learning to swim. But it's nice when your family is proud of you.", reveal: 1}

