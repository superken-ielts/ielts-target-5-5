      - {emma: "Number two.", focus: 1}
      - {tom: "History. H, I, S, T, O, R, Y.", say: "History. aitch, eye, ess, tee, oh, ar, why.", reveal: 2}
      - {emma: "Number three.", focus: 2}
      - {tom: "Geography. The /f/ sound is ph.", say: "Geography. The F sound is, P, H.", reveal: 3}
      - {emma: "Number four.", focus: 3}
      - {tom: "Science. S, C, I, E, N, C, E.", say: "Science. ess, see, eye, ee, en, see, ee.", reveal: 4}
      - {emma: "Number five.", focus: 4}
      - {tom: "Chemistry. It starts with ch.", say: "Chemistry. It starts with, C, H.", reveal: 5}
      - {emma: "Number six.", focus: 5}
