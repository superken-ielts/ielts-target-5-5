      - {en: "/d/  I played football after school.", vi: "Sau nguyên âm và âm hữu thanh: learned, studied, enjoyed"}
      - {en: "/ɪd/  I hated Physics at school.", vi: "Sau /t/ và /d/ — thêm một âm tiết: decided, wanted, needed"}
    lines:
      - emma: "Pronunciation check. Listen to the ending of these regular verbs."
        vi: "Nghe đuôi -ed của động từ có quy tắc."
      - {emma: "I finished my homework late last night.", focus: 0}
      - {tom: "Finished. The ending is a /t/ sound.", say: "Finished. The ending is a, T, sound.", focus: 0}
      - {emma: "I played football after school.", focus: 1}
      - {tom: "Played. The ending is a /d/ sound.", say: "Played. The ending is a, D, sound.", focus: 1}
      - {emma: "I hated Physics at school.", focus: 2}
      - {tom: "Hated. Here we add a syllable: HAT-id.", say: "Hated. Here we add a syllable: hated.", focus: 2}
      - emma: "Only verbs ending in a /t/ or /d/ sound add the extra syllable: decided, wanted, needed."
        say: "Only verbs ending in a, T, or, D, sound add the extra syllable: decided, wanted, needed."
        vi: "Chỉ động từ tận cùng /t/, /d/ mới thêm âm tiết /ɪd/."

