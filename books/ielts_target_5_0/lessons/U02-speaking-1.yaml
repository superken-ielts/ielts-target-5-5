  - kind: qa
    chapter: "Speaking 1B: kể về trường cũ"
    heading: "Speaking 1B · Talk about what you remember about school"
    heading_vi: "Dùng tranh để kể về thời đi học — nghe Tom trả lời mẫu"
    items:
      - q: "What was your favourite subject at school?"
        a: "My favourite subject was Chemistry. I loved doing experiments in the lab, and my teacher was very funny."
        phrases: ["My favourite subject was…", "I loved doing…"]
        ask: emma
        by: tom
      - q: "Did you have to wear a uniform?"
        a: "Yes, we did. We had to wear a white shirt and blue trousers every day. I didn't like it very much."
        phrases: ["We had to wear…", "I didn't like it very much."]
        ask: emma
        by: tom
      - q: "Were your teachers strict?"
        a: "Some of them were very strict. My Maths teacher gave us homework every night, but she was a good teacher."
        phrases: ["Some of them were…", "gave us homework"]
        ask: emma
        by: tom
    lines:
