        vi: "Mọi động từ đều ở thì quá khứ đơn vì thời đi học đã kết thúc."

  - kind: blanks
    chapter: "Grammar check: quá khứ đơn"
    heading: "Grammar check · Write the past form of these verbs"
    heading_vi: "Động từ có quy tắc: thêm -ed, nhưng chú ý quy tắc chính tả"
    items:
      - {n: 1, q: "I ___ to swim when I was five years old.", answer: "learned", hint: "learn", tip: "learn → learned (also: learnt)"}
      - {n: 2, q: "I ___ Medicine at university.", answer: "studied", hint: "study", tip: "consonant + y → -ied: study → studied"}
      - {n: 3, q: "I ___ to leave university and find a job.", answer: "decided", hint: "decide", tip: "ends in e → just add -d: decide → decided"}
      - {n: 4, q: "I ___ learning guitar because I was too busy.", answer: "stopped", hint: "stop", tip: "short vowel + one consonant → double it: stop → stopped"}
    lines:
      - emma: "Grammar check. We use the past simple to talk about finished time. Regular verbs end in -ed, but there are some spelling rules."
        say: "Grammar check. We use the past simple to talk about finished time. Regular verbs end in, E, D, but there are some spelling rules."
        vi: "Quá khứ đơn dùng cho thời gian đã kết thúc; động từ có quy tắc thêm -ed."
      - emma: "Write the past form of learn, stop, decide and study into the sentences."
        vi: "Điền dạng quá khứ của learn, stop, decide, study."
      - {wait: 8, note: "Pause the video and write", vi: "Tạm dừng video và viết."}
      - {emma: "Number one: I … to swim when I was five years old.", focus: 0}
      - {tom: "I learned to swim when I was five years old.", reveal: 1}
      - {emma: "Number two: I … Medicine at university.", focus: 1}
      - {tom: "I studied Medicine at university. Study becomes studied: y changes to -ied.", say: "I studied Medicine at university. Study becomes studied: Y changes to, I, E, D.", reveal: 2}
      - {emma: "Number three.", focus: 2}
      - {tom: "I decided to leave university and find a job. Decide already ends in e, so just add d.", say: "I decided to leave university and find a job. Decide already ends in E, so just add D.", reveal: 3}
      - {emma: "Number four.", focus: 3}
      - {tom: "I stopped learning guitar because I was too busy. Stop has a double p.", say: "I stopped learning guitar because I was too busy. Stop has a double P.", reveal: 4}

  - kind: blanks
    heading: "Grammar check · Irregular verbs"
    heading_vi: "Động từ bất quy tắc dùng rất nhiều — phải học thuộc"
    items:
      - {n: 1, q: "know  →  ___", answer: "knew", tip: "know → knew (k is silent: /njuː/)"}
      - {n: 2, q: "read  →  ___", answer: "read", tip: "read /riːd/ → read /red/: same spelling, different sound"}
      - {n: 3, q: "think  →  ___", answer: "thought", tip: "think → thought /θɔːt/"}
      - {n: 4, q: "teach  →  ___", answer: "taught", tip: "teach → taught /tɔːt/ — sounds like thought"}
      - {n: 5, q: "choose  →  ___", answer: "chose", tip: "choose /tʃuːz/ → chose /tʃəʊz/"}
    lines:
      - emma: "There are a lot of irregular verbs, and some of them are used very often. Write the past form."
        vi: "Có nhiều động từ bất quy tắc, nhiều từ dùng rất thường xuyên."
      - {wait: 6, note: "Pause the video and write", vi: "Tạm dừng video và viết."}
      - {emma: "Know.", focus: 0}
      - {tom: "Knew.", reveal: 1}
      - {emma: "Read.", focus: 1}
      - {tom: "Read. Same spelling, but we say red.", say: "Red. Same spelling, but we say red.", reveal: 2}
      - {emma: "Think.", focus: 2}
      - {tom: "Thought.", reveal: 3}
      - {emma: "Teach.", focus: 3}
      - {tom: "Taught.", reveal: 4}
      - {emma: "Choose.", focus: 4}
      - {tom: "Chose.", reveal: 5}

  - kind: errors
    chapter: "Watch out! Lỗi hay gặp"
    heading: "Watch out! · Typical errors"
    heading_vi: "Phủ định và câu hỏi dùng did + động từ nguyên mẫu; must → had to"
    items:
      - {wrong: "I don't liked school when I was little.", right: "I didn't like school when I was little.", note: "Phủ định quá khứ: didn't + nguyên mẫu"}
      - {wrong: "How went you to school in the morning?", right: "How did you go to school in the morning?", note: "Câu hỏi: did + chủ ngữ + nguyên mẫu"}
      - {wrong: "I must did homework every night.", right: "I had to do homework every night.", note: "must không có quá khứ → had to + nguyên mẫu"}
    lines:
      - emma: "Watch out! Here are three typical errors."
        vi: "Ba lỗi hay gặp."
      - {emma: "Number one. In negatives, use did not, or didn't, and the base verb.", focus: 0}
      - {tom: "I didn't like school when I was little.", focus: 0}
      - {emma: "Number two. In questions, use did, and the base verb.", focus: 1}
      - {tom: "How did you go to school in the morning?", focus: 1}
      - {emma: "Number three. There is no past form of must, so we use had to. Had to is followed by the base verb.", focus: 2}
      - {tom: "I had to do homework every night. We had to wear a uniform to school.", focus: 2}

  - kind: bullets
