# Video bài giảng Unit 2 · Vocabulary 1 + Speaking 1 (sách in trang 22–23). Dựng: cd agents && python -m lesson_video build ../books/ielts_target_5_0/lessons/U02-speaking-1.yaml
# Cách viết: xem đầu file U01-speaking-1.yaml. Answer key không có các bài này: chính tả môn học và dạng quá khứ là
# đáp án chắc chắn; nối tranh (Speaking 1A) là đáp án gợi ý. Pronunciation check theo Tapescript Track 12–13.
id: U02-speaking-1
activity: U02-speaking-vocab
title: "Unit 2 · Learning"
subtitle: "Vocabulary 1 & Speaking 1: school subjects, looking back"
title_vi: "Môn học ở trường, kể về thời đi học — chính tả, nối tranh, thì quá khứ đơn, phát âm -ed"
tag: "UNIT 2 · LEARNING"
speakers:
  # giọng theo bộ đọc: kokoro (mặc định khi có model) hoặc flite (dự phòng, có sẵn trên Ubuntu)
  emma: {name: Emma, role: teacher, color: "#C8102E", voice: {kokoro: af_heart, flite: slt}}
  tom: {name: Tom, role: student, color: "#1F5FAD", voice: {kokoro: am_michael, flite: rms}}

scenes:
  - kind: title
    chapter: "Giới thiệu"
    lines:
      - emma: "Hello, and welcome to Unit 2: Learning."
        say: "Hello, and welcome to Unit two: Learning."
        vi: "Chào mừng bạn đến với Unit 2: Learning (Học tập)."
      - tom: "Learning? So we talk about school?"
      - emma: "Yes! In the Speaking test, the examiner often asks about your school days. So today we learn the names of school subjects, and how to talk about the past."
        vi: "Giám khảo hay hỏi về thời đi học — hôm nay học tên môn học và cách kể chuyện quá khứ."

  - kind: bullets
    chapter: "Hôm nay học gì"
    heading: "Today's lesson"
    heading_vi: "Hôm nay học gì"
    items:
      - {en: "Vocabulary 1: spell the school subjects", vi: "Viết đúng chính tả tên môn học"}
      - {en: "Pronunciation: the ending -ics", vi: "Phát âm đuôi -ics /ɪks/"}
      - {en: "Speaking 1: match the pictures, talk about your school", vi: "Nối tranh, kể về trường cũ"}
      - {en: "Grammar check: the past simple and had to", vi: "Thì quá khứ đơn và had to"}
      - {en: "Pronunciation: -ed = /t/, /d/ or /ɪd/", vi: "Ba cách đọc đuôi -ed"}
      - {en: "Your turn: answer questions about your school days", vi: "Đến lượt bạn: kể về thời đi học"}
    lines:
      - emma: "Here is our plan."
        vi: "Kế hoạch hôm nay."
      - {emma: "First, the names of school subjects. Spelling is important!", focus: 0}
      - {emma: "Then, how to say the ending -ics.", say: "Then, how to say the ending, I, C, S.", focus: 1}
      - {emma: "Then, six pictures about school.", focus: 2}
      - {emma: "The grammar: the past simple.", focus: 3}
      - {emma: "How to say the ending -ed.", say: "How to say the ending, E, D.", focus: 4}
      - {emma: "And finally, your turn to speak.", focus: 5}

  - kind: blanks
    chapter: "Vocabulary 1A: chính tả môn học"
    heading: "Vocabulary 1A · Correct the spelling for the school subjects"
    heading_vi: "Sửa lỗi chính tả tên các môn học"
    items:
      - {n: 1, q: "mathmatics  →  ___", answer: "Mathematics", tip: "math-E-matics: don't forget the e; short form: Maths"}
      - {n: 2, q: "histery  →  ___", answer: "History", tip: "histORy: the sound is weak, but we write o"}
      - {n: 3, q: "geografy  →  ___", answer: "Geography", tip: "geo-GRAPH-y: the sound /f/ is written ph"}
      - {n: 4, q: "siense  →  ___", answer: "Science", tip: "SCience: s + c, like scientist"}
      - {n: 5, q: "kemistry  →  ___", answer: "Chemistry", tip: "CHemistry: ch sounds like /k/, like school"}
      - {n: 6, q: "fisics  →  ___", answer: "Physics", tip: "PHysics: ph = /f/, and y = /ɪ/"}
      - {n: 7, q: "biolagy  →  ___", answer: "Biology", tip: "bi-OLOGY: -ology = the study of"}
      - {n: 8, q: "economiks  →  ___", answer: "Economics", tip: "economiCS: -ics, like Physics and Mathematics"}
