  - kind: bullets
    chapter: "Phát âm: đuôi -ics"
    heading: "Pronunciation check · The ending -ics /ɪks/"
    heading_vi: "Theo Tapescript Track 12 — trọng âm rơi vào âm tiết ngay trước -ics"
    items:
      - {en: "PHYS-ics", vi: "Vật lý — nhấn âm đầu"}
      - {en: "math-e-MAT-ics", vi: "Toán — nhấn âm ngay trước -ics"}
      - {en: "e-co-NOM-ics  /  ec-o-NOM-ics", vi: "Kinh tế học — hai cách đọc đều đúng"}
      - {en: "Also: politics, electronics, statistics", vi: "Cũng đuôi -ics: chính trị, điện tử, thống kê"}
    lines:
      - emma: "Pronunciation check. Listen to the ending of these subjects: -ics. We say /ɪks/."
        say: "Pronunciation check. Listen to the ending of these subjects: I, C, S. We say: iks."
        vi: "Đuôi -ics đọc là /ɪks/, rõ âm /s/ cuối."
      - {emma: "Physics.", focus: 0}
      - {tom: "Physics.", focus: 0}
      - {emma: "Mathematics.", focus: 1}
      - {tom: "Mathematics.", focus: 1}
      - {emma: "Economics.", focus: 2}
      - {tom: "Economics.", focus: 2}
      - emma: "The stress is on the syllable just before -ics: PHYS-ics, math-e-MAT-ics, e-co-NOM-ics."
        say: "The stress is on the syllable just before, I, C, S. Physics. Mathematics. Economics."
        focus: 2
        vi: "Trọng âm rơi vào âm tiết ngay trước -ics."
      - {emma: "Other words with this ending: politics, electronics, statistics.", focus: 3}

