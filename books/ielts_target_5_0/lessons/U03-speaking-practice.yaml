    roles: {emma: examiner, tom: candidate}
    items:
      - q: "Should students have part-time jobs?"
        a: "I think so, but not for too many hours. A part-time job teaches you to manage your time and your money. But if students work more than fifteen hours a week, their studies can suffer."
        phrases: ["I think so, but…", "manage your time", "can suffer"]
      - q: "What can young people learn from a part-time job?"
        a: "They learn how to work in a team, and how to talk to customers politely, even when the customers are angry. These skills are really useful later, in any career."
        phrases: ["work in a team", "even when…", "in any career"]
      - q: "Is it better to have a well-paid job or an interesting job?"
        a: "For me, an interesting job is more important, as long as the salary is enough to live on. If you're bored at work every day, the money won't make you happy."
        phrases: ["as long as…", "enough to live on", "won't make you happy"]
      - q: "Why do some people work very long hours?"
        a: "Sometimes they have no choice, because they need the money. Others want a promotion, so they stay late to impress their boss. But working too much is bad for your health."
        phrases: ["have no choice", "a promotion", "bad for your health"]
