  - kind: qa
    chapter: "Thi thử 1 · Phần 1"
    heading: "Mock test 1 · Part 1 · Introduction and interview"
    heading_vi: "Thi thử Phần 1 — giám khảo hỏi về bạn (bài thi thật: 4–5 phút)"
    roles: {emma: examiner, tom: candidate}
    items:
      - q: "Can you tell me your full name, please?"
        a: "Good morning. My full name is Tran Minh Tuan, but please call me Tom."
        phrases: ["My full name is…", "please call me…"]
      - q: "Can I see your identification, please?"
        a: "Of course. Here you are."
      - q: "Do you have a job at the moment?"
        a: "Yes, a part-time one. I'm a business student, but I also work as a waiter in a coffee shop, two evenings a week."
        phrases: ["a part-time one", "I'm a… student, but…", "I also work as…"]
      - q: "Why did you choose that job?"
        a: "Mainly for the money, to be honest, because my rent is quite expensive. But I also wanted some real work experience. And I love coffee!"
        phrases: ["Mainly for…", "to be honest", "real work experience"]
      - q: "What do you like about it?"
        a: "I like meeting different people every day. Some of our customers are foreigners, so I can practise my English with them too."
        phrases: ["I like meeting…", "every day", "practise my English"]
      - q: "What job would you like to have in ten years?"
        a: "I'd like to be a marketing manager for an international company. I'd love to travel for work, like my uncle. He's a pilot."
        phrases: ["I'd like to be…", "I'd love to…", "like my uncle"]
      - q: "Is it easy to find a good job in your country?"
        a: "It depends on your skills. In big cities, there are lots of jobs in business and IT, but the competition is strong, so you need good English and some experience."
        phrases: ["It depends on…", "the competition is strong", "you need…"]
      - q: "Would you like to work abroad one day?"
        a: "Yes, for a few years. I'd like to work in Australia or Singapore, to get international experience. But I'd come back to Vietnam later, because my family is here."
        phrases: ["for a few years", "international experience", "I'd come back…"]
