        vi: "Video luyện nói 1/4 của Unit 3 — toàn câu hỏi và câu trả lời mẫu."
      - tom: "Pause the video after each question, and answer it yourself. Then listen to our answer, and say it with us."
        vi: "Tạm dừng sau mỗi câu hỏi, tự trả lời, rồi nghe câu mẫu và nói theo."
      - emma: "Today, Tom and I ask each other about part-time jobs and dream jobs. Then we do a mock test: I'm the examiner, and Tom is the candidate."
        vi: "Hôm nay: việc làm thêm, công việc mơ ước; rồi thi thử — Emma giám khảo, Tom thí sinh."
