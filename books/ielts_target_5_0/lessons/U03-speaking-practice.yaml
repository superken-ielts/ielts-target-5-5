  - kind: qa
    chapter: "Hỏi qua lại: công việc mơ ước"
    heading: "Tom and Emma ask each other · Dream jobs"
    heading_vi: "Công việc mơ ước — would / could cho điều không có thật"
    items:
      - q: "When you were a child, what did you want to be?"
        a: "An astronaut! I had posters of planets on my bedroom wall. Then I found out that you need to be very good at maths, so I changed my mind."
        ask: tom
        by: emma
        phrases: ["I had posters of…", "I found out that…", "I changed my mind"]
      - q: "What about you, Tom?"
        a: "An architect. I loved drawing houses, and I still do. I'm studying business now, but I'd still love to design my own house one day."
        ask: emma
        by: tom
        phrases: ["I loved + -ing", "and I still do", "I'd still love to…"]
      - q: "If you could do any job in the world, what would it be?"
        a: "I'd be a travel writer. I could visit amazing places, eat local food, and write about it. It sounds like the perfect job, but I think it's harder than it looks."
        ask: tom
        by: emma
        phrases: ["I'd be…", "It sounds like…", "harder than it looks"]
      - q: "Which job would you never want to do?"
        a: "I would never want to be a dentist. I couldn't spend all day looking inside people's mouths! And most patients are scared of dentists."
        ask: emma
        by: tom
        phrases: ["I would never want to…", "I couldn't + verb", "scared of…"]
      - q: "Do you think you could be a good manager?"
        a: "Maybe, because I'm organised, and I'm good at listening. But I'm not very good at saying no, and a manager has to make difficult decisions."
        ask: tom
        by: emma
        phrases: ["Maybe, because…", "I'm good at + -ing", "make difficult decisions"]
      - q: "Would you like to have your own business one day?"
        a: "Yes, I'd love to. Maybe a small coffee brand from Da Lat. My dad knows a lot about coffee, so he could help me."
        ask: emma
        by: tom
        phrases: ["I'd love to.", "Maybe…", "he could help me"]
      - q: "Which job is the most rewarding, in your opinion?"
        a: "Teaching, of course! But seriously, I think nurses have one of the most rewarding jobs. They help people when they're scared and in pain."
        ask: tom
        by: emma
        phrases: ["…, of course!", "one of the most rewarding jobs", "when they're scared"]
      - q: "Would you prefer a job with a high salary, or a job with lots of holidays?"
        a: "A high salary, at least while I'm young. I want to save money and help my parents. But later, I'd like more time for my family."
        ask: emma
        by: tom
        phrases: ["at least while I'm young", "save money", "But later…"]
