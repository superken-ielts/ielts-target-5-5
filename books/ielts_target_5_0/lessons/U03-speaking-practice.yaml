# Video luyện nói thêm Unit 3 · Work — 1/4: việc làm thêm, công việc mơ ước + thi thử 1 (Emma giám khảo, Tom thí sinh).
# Người học yêu cầu, không theo trang sách; làm theo khuôn ở docs/agent-hoc-tap/06-video-bai-giang.md mục 9 (đợt 25).
# Người học tự tạm dừng video để trả lời, nên không có khoảng lặng chờ (`wait`, `echo`).
# Dựng: cd agents && python -m lesson_video build ../books/ielts_target_5_0/lessons/U03-speaking-practice.yaml
# Câu trả lời mẫu tự viết bằng ngữ pháp, từ vựng của Unit 3: tên nghề, work as / for / in / with, would / could (tình
# huống không có thật), tính từ tả công việc (rewarding, challenging, repetitive, stressful), cụm hai từ (past experience,
# personal qualities, long hours, computer literate).
# Thông tin nhân vật: giữ khớp với đầu file U01-speaking-practice.yaml, U02-speaking-practice.yaml và câu trả lời của Tom
# trong U03-speaking-2 (chú là phi công; hồi bé mơ làm kiến trúc sư vì thích vẽ). Thêm phần công việc dưới đây (giữ khớp ở
# cả bốn video Unit 3):
# - Tom: làm thêm phục vụ ở quán cà phê gần trường từ tháng 9, tối thứ Ba và thứ Năm 6–10 giờ, đi bộ 10 phút; quản lý
#   (nữ) nghiêm nhưng công bằng; hè vừa rồi thực tập 2 tháng ở bộ phận marketing của một công ty cà phê ở Đà Lạt (phỏng
#   vấn tháng 5, ba người phỏng vấn, có người hướng dẫn); muốn làm trưởng phòng marketing cho công ty cà phê quốc tế, một
#   ngày có thương hiệu cà phê Đà Lạt của riêng mình; điểm mạnh: chăm chỉ, giỏi giải quyết vấn đề, biết lắng nghe.
# - Emma: hồi đại học làm ở hiệu sách sáng thứ Bảy; việc tệ nhất: rửa bát trong bếp khách sạn một mùa hè (bỏ sau ba
#   tuần); lương đầu tiên → đi Tây Ban Nha với Lucy; hồi bé mơ làm phi hành gia; ra trường làm văn phòng một năm (chán,
#   lặp lại) rồi học khóa đào tạo giáo viên; phỏng vấn trường hiện tại qua mạng từ Anh; trường có 12 giáo viên từ 5
#   nước; dạy khoảng 25 giờ/tuần; anh trai Jack là kỹ sư âm thanh ở một nhà hát lớn tại London; mơ mở một trường ngoại
#   ngữ nhỏ có quán cà phê ở quê ven biển.
