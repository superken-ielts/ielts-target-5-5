        say: "Remember Unit three: work as, work for, work in, and would or could for things that aren't real."
        vi: "Nhớ bài Unit 3: work as / for / in, và would / could cho điều không có thật."

  - kind: qa
    chapter: "Hỏi qua lại: việc làm thêm"
    heading: "Tom and Emma ask each other · Part-time jobs"
    heading_vi: "Việc làm thêm — kể bằng quá khứ đơn, nói hiện tại bằng work as / in / for"
    items:
      - q: "Emma, did you have a part-time job when you were a student?"
        a: "Yes, I worked in a bookshop on Saturdays. It wasn't well paid, but I could borrow books for free, so for me it was the perfect job!"
        ask: tom
        by: emma
        phrases: ["I worked in…", "It wasn't well paid", "the perfect job"]
      - q: "And do you work at the moment, Tom?"
        a: "Yes, I work as a waiter in a coffee shop near my university, two evenings a week. I started in September."
        ask: emma
        by: tom
        phrases: ["I work as…", "two evenings a week", "I started in…"]
      - q: "What was the worst job you ever had?"
        a: "Washing dishes in a hotel kitchen, one summer. It was hot, noisy and really repetitive, and the chef shouted at everyone all day. I left after three weeks!"
        ask: tom
        by: emma
        phrases: ["the worst job I ever had", "really repetitive", "I left after…"]
      - q: "How did you find your job?"
        a: "I saw an advertisement on the door of the coffee shop. I went in, talked to the manager for ten minutes, and she asked me to start the next week."
        ask: emma
        by: tom
        phrases: ["I saw an advertisement", "talked to the manager", "start the next week"]
      - q: "What's the best way to find a part-time job?"
        a: "Ask people you know. Friends and neighbours often hear about jobs first. Job websites are useful too, but there are hundreds of applicants for every job."
        ask: tom
        by: emma
        phrases: ["Ask people you know.", "hear about jobs first", "hundreds of applicants"]
      - q: "Is it difficult to study and work at the same time?"
        a: "Sometimes, especially before exams. I have to plan my week carefully, and I don't have much free time. But I'm learning to manage my time better."
        ask: emma
        by: tom
        phrases: ["at the same time", "plan my week carefully", "manage my time"]
      - q: "What did you spend your first salary on?"
        a: "A plane ticket! I saved my money from the bookshop for six months, and then I went to Spain with Lucy for a week. It was my first trip abroad."
        ask: tom
        by: emma
        phrases: ["I saved my money", "for six months", "my first trip abroad"]
      - q: "Do many students in Vietnam have part-time jobs?"
        a: "Yes, quite a lot, especially in big cities. Some work in cafés or shops, and many teach children as private tutors. It helps them to pay for their rent and food."
        ask: emma
        by: tom
        phrases: ["especially in big cities", "private tutors", "pay for…"]
