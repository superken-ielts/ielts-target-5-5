  - kind: qa
    chapter: "Thi thử 3 · Phần 3"
    heading: "Mock test 3 · Part 3 · Discussion (Emma asks Tom)"
    heading_vi: "Phần 3 — áp lực thi cử: ý kiến + lý do + ví dụ"
    roles: {emma: examiner, tom: candidate}
    items:
      - q: "Do students today have more pressure than in the past?"
        a: "I think they do. More students want to go to university, but the best universities still have the same number of places. And parents spend a lot of money on extra classes, so they expect high scores."
        phrases: ["I think they do.", "the same number of…", "they expect…"]
      - q: "Should schools have fewer exams?"
        a: "Yes, I think so. Students need time to understand things, not just to memorise them for the next test. But a few exams are useful, because they show teachers what students still need to learn."
        phrases: ["Yes, I think so.", "not just to…", "a few exams are useful"]
