  - kind: qa
    chapter: "Hỏi qua lại: thi cử"
    heading: "Tom and Emma ask each other · Exams and tests"
    heading_vi: "Thi cử — take an exam, pass, fail, get good grades: kể lại và nêu cảm xúc"
    items:
      - q: "How do you feel before an exam, Tom?"
        a: "Very nervous. The night before, I usually can't sleep, and I can't eat breakfast in the morning. But when the exam starts, I feel much calmer."
        ask: emma
        by: tom
        phrases: ["Very nervous.", "The night before…", "much calmer"]
      - q: "Emma, what was the most important exam you took at school?"
        a: "My A levels, at eighteen. I took English, French and History, and I needed good grades to get into university. I studied every evening for months."
        ask: tom
        by: emma
        phrases: ["I took…", "I needed good grades", "get into university"]
      - q: "How did you prepare for your university entrance exam?"
        a: "I went to extra classes three evenings a week, and I did lots of practice tests. My grandfather also helped me with Maths. He was a Maths teacher, so he was really strict!"
        ask: emma
        by: tom
        phrases: ["extra classes", "practice tests", "helped me with…"]
      - q: "Have you ever failed an exam?"
        a: "Yes, a Maths exam when I was fifteen. I didn't study enough, because I thought it was easy. I had to take it again in the summer, and I learned my lesson!"
        ask: tom
        by: emma
        phrases: ["I didn't study enough", "I had to take it again", "I learned my lesson"]
      - q: "Do you think exams are a good way to test students?"
        a: "Partly. Exams show what you know, but some students are good at learning and bad at exams. I think projects and presentations should count too."
        ask: emma
        by: tom
        phrases: ["Partly.", "good at… / bad at…", "should count too"]
      - q: "Did you get good grades at school?"
        a: "In English and Art, yes. I always got top marks. But my Maths grades were terrible. My parents were never angry, though. They just said: do your best."
        ask: tom
        by: emma
        phrases: ["I always got top marks", "were terrible", "do your best"]
      - q: "What did you do after your last exam at school?"
        a: "My friends and I went straight to the beach and had a picnic. We swam, ate ice cream and laughed for hours. It was the best feeling in the world!"
        ask: tom
        by: emma
        phrases: ["went straight to…", "for hours", "the best feeling in the world"]
      - q: "Are you taking any exams this year, Tom?"
        a: "Yes, IELTS, in December. I need band 5.5 for an exchange programme in Australia, so I'm practising every day, just like you!"
        ask: emma
        by: tom
        phrases: ["I need band…", "an exchange programme", "just like you!"]
