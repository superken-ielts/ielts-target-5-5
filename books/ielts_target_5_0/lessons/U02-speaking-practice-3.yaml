  - kind: qa
    chapter: "Hỏi qua lại: cách học, trí nhớ"
    heading: "Tom and Emma ask each other · Studying and memory"
    heading_vi: "Thói quen học và trí nhớ — nói thói quen bằng thì hiện tại đơn, nêu lý do"
    items:
      - q: "Where do you prefer to study, Emma?"
        a: "At a quiet café near my flat. I like a little background noise, and the coffee helps me to concentrate. At home, I always find something else to do!"
        ask: tom
        by: emma
        phrases: ["a little background noise", "helps me to concentrate", "something else to do"]
      - q: "And where do you usually study, Tom?"
        a: "In the university library. My flat is too noisy, because my flatmates often play music. In the library, everyone is quiet, so I can focus."
        ask: emma
        by: tom
        phrases: ["too noisy", "my flatmates", "so I can focus"]
      - q: "Do you prefer to study in the morning or in the evening?"
        a: "In the morning, definitely. My mind is fresh, and nobody sends me messages at six a.m.! By the evening, I'm too tired to remember anything."
        ask: tom
        by: emma
        phrases: ["…, definitely.", "My mind is fresh", "too tired to…"]
      - q: "Do you listen to music when you study?"
        a: "Yes, but only music without words, like piano music. If a song has words, I start singing, and then I stop studying!"
        ask: emma
        by: tom
        phrases: ["only music without words", "If…, I start + -ing"]
      - q: "How do you remember new information?"
        a: "I write notes by hand, with lots of colours and little pictures. Then I explain the topic to a friend. If I can explain it, I really understand it."
        ask: tom
        by: emma
        phrases: ["by hand", "explain… to…", "If I can…, I…"]
      - q: "Are you good at remembering names?"
        a: "Not really. I never forget a face, but I often forget names. So when I meet someone new, I try to say their name two or three times in the conversation."
        ask: emma
        by: tom
        phrases: ["Not really.", "I never forget a face", "I try to…"]
      - q: "Do you use your phone when you study?"
        a: "Only for my dictionary app. I put my phone on silent, and I keep it in another room, because messages are a big distraction."
        ask: tom
        by: emma
        phrases: ["on silent", "in another room", "a big distraction"]
      - q: "Have you ever studied all night?"
        a: "Yes, once, before a Statistics exam in my first year. It was a terrible idea. I was so tired that I couldn't think clearly, and I got a low mark. Never again!"
        ask: emma
        by: tom
        phrases: ["It was a terrible idea.", "so tired that…", "Never again!"]
