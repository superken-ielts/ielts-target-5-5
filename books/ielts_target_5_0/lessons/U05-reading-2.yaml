        vi: "Luyện với bài đọc kiểu thi: quảng cáo một khóa học cải thiện trí nhớ."
      - tom: "A memory course? I need that!"
        vi: "Khóa học trí nhớ à? Mình cần lắm!"
      - emma: "Then read carefully. Questions first, then the text. All the answers come after the reading."
        vi: "Vậy đọc kỹ nhé: câu hỏi trước, bài đọc sau; đáp án hiện sau khi đọc xong."

  - kind: blanks
    chapter: "Reading 3A–B: câu hỏi 1–6"
    heading: "Reading 3B · Questions 1–6: true (T), false (F) or not given (NG)?"
    heading_vi: "Đọc câu hỏi trước — chưa trả lời; đáp án hiện sau khi đọc bài quảng cáo"
    items: &r3
      - {n: 1, q: "The course will show you new ways to remember names and faces. → ___", answer: "T"}
      - {n: 2, q: "Most successful people have met a world leader. → ___", answer: "NG"}
      - {n: 3, q: "People who are very successful in business have a good memory. → ___", answer: "T"}
      - {n: 4, q: "None of the Memory Enhancer techniques have been tested. → ___", answer: "F"}
      - {n: 5, q: "Doing the course will make you more like other people. → ___", answer: "F"}
      - {n: 6, q: "Claire and David did the course in order to get better jobs. → ___", answer: "NG"}
    lines:
      - emma: "Reading 3: practice with unknown words and phrases. Exercise A. Look at the highlighted words and phrases in the advertisement, but don't check them in a dictionary. You will need to guess their meanings to answer the questions."
        say: "Reading three: practice with unknown words and phrases. Exercise eigh. Look at the highlighted words and phrases in the advertisement, but don't check them in a dictionary. You will need to guess their meanings to answer the questions."
        vi: "Bài A: nhìn các từ tô vàng nhưng đừng tra từ điển — phải đoán nghĩa để trả lời."
      - emma: "Exercise B. Read the advertisement for a course that improves your memory. For questions 1 to 6, decide if the information agrees with the advertisement. Write T for true, F for false or NG for not given. First, read the questions. Pause the video."
        say: "Exercise B. Read the advertisement for a course that improves your memory. For questions one to six, decide if the information agrees with the advertisement. Write tee for true, ef for false or en gee for not given. First, read the questions. Pause the video."
        vi: "Bài B: câu 1–6 — đúng (T), sai (F) hay không có thông tin (NG)? Đọc câu hỏi trước, tạm dừng video."
        pause: 1.5

