  - kind: blanks
    chapter: "Key vocabulary: remember, recall, memorize"
    heading: "Key vocabulary in context · remember, recall, memorize"
    heading_vi: "Khung từ tr. 64 — tạm dừng video và làm; đáp án hiện sau"
