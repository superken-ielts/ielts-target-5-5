        vi: "Đây là toàn bộ đáp án."
      - {emma: "One: I can't remember his name, or I can't recall his name. Recall is a little more formal.", focus: 0, vi: "remember = recall (recall trang trọng hơn)"}
      - {emma: "Two: remember to lock the door. Remember to do something means don't forget to do it.", focus: 2, vi: "remember to do = nhớ làm (đừng quên)"}
      - {emma: "Three: memorize them. Memorize means learn something so you can say it exactly.", focus: 3, vi: "memorize = học thuộc"}
      - tom: "So I memorize irregular verbs, and I remember to do my homework."
        focus: 3
        vi: "Vậy học thuộc động từ bất quy tắc (memorize), và nhớ làm bài tập (remember to)."

