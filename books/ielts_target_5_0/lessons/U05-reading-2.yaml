    items:
      - {n: 1a, q: "I met an interesting man at the meeting, but I can't ___ his name.", answer: "remember"}
      - {n: 1b, q: "… but I can't remember / ___ his name.", answer: "recall"}
      - {n: 2, q: "Now, you must ___ to lock the door when you leave.", answer: "remember"}
      - {n: 3, q: "The best way to learn irregular verbs is to write them down and ___ them.", answer: "memorize"}
    lines:
