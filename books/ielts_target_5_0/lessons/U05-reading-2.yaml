      - {emma: "Eight: gains. Here are just a few of the gains you can achieve. Gains are good things you get.", focus: 1, vi: "gains = lợi ích, cái thu được"}
      - {emma: "Nine: forget. Remember them when they've forgotten you.", focus: 2}
      - {emma: "Ten: retrieve. Easily retrieve essential data. Retrieve means get back.", focus: 3, vi: "retrieve = lấy lại, truy xuất"}
      - {emma: "Eleven: focus on detail. Extend the time you can focus on detail.", focus: 4}
      - {emma: "Twelve: in minutes. Memorize long speeches and presentations in minutes.", focus: 5}

