  - kind: blanks
    chapter: "Câu 1–6: đáp án"
    heading: "Reading 3B–C · Questions 1–6: answers"
    heading_vi: "Tạm dừng video và trả lời; tất cả đáp án hiện cùng lúc, rồi câu bằng chứng"
    items: *r3
    lines:
      - emma: "Now answer questions 1 to 6. Pause the video and try."
        say: "Now answer questions one to six. Pause the video and try."
        vi: "Trả lời câu 1–6. Tạm dừng video và làm."
        pause: 1.5
      - emma: "Here are all the answers."
        reveal: ["1", "2", "3", "4", "5", "6"]
        vi: "Đây là toàn bộ đáp án."
      - {emma: "One: true. Learn the techniques that will help you memorize names, faces and so much more.", focus: 0}
      - {emma: "Two: not given. It says ask anyone who's met a world leader. It doesn't say most successful people have met one.", focus: 1, vi: "Bài chỉ nói hỏi ai từng gặp lãnh đạo — không nói đa số người thành công đã gặp."}
      - {emma: "Three: true. The people who really make things happen don't forget.", focus: 2}
      - {emma: "Four: false. The course uses scientifically proven techniques. Proven means tested and shown to work.", say: "Four: false. The course yoozes scientifically proven techniques. Proven means tested and shown to work.", focus: 3, vi: "scientifically proven = đã được khoa học kiểm chứng → sai."}
      - {emma: "Five: false. The course will put you ahead of the rest. That means better than other people, not like them.", focus: 4, vi: "ahead of the rest = vượt lên người khác → sai."}
      - {emma: "Six: not given. Claire and David say the course changed their lives, but we don't know why they did it.", focus: 5}
      - emma: "Exercise C. Check your answers. How many did you answer correctly?"
        vi: "Bài C: bạn đúng mấy câu?"

