    items:
      - {n: 7, q: "The Memory Enhancer course consists of ___ lessons.", answer: "ten / 10"}
      - {n: 8, q: "You can achieve a number of ___ by registering for the course.", answer: "gains"}
      - {n: 9, q: "Even if people ___ you, you will remember them.", answer: "forget"}
      - {n: 10, q: "Phone numbers and addresses will be stored in your memory and you will be able to easily ___ them.", answer: "retrieve"}
      - {n: 11, q: "You will be able to concentrate more clearly and ___ for longer.", answer: "focus on detail"}
      - {n: 12, q: "___, you can learn how to give long talks and become more confident.", answer: "In minutes"}
    lines:
