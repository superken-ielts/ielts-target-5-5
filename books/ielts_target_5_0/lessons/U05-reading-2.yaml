# Cách viết: xem đầu file U02-reading-1.yaml; khuôn Unit 4 (đợt 31), đáp án hiện sau (đợt 34): đọc câu hỏi trước, đọc bài
# quảng cáo (Mai đọc, khung đỏ theo câu), rồi mới hiện tất cả đáp án kèm câu bằng chứng. Đáp án theo Answer key (sách in trang
# 267–268): 1 T, 2 NG, 3 T, 4 F, 5 F, 6 NG, 7 ten / 10, 8 gains, 9 forget, 10 retrieve, 11 focus on detail, 12 In minutes.
# Nghĩa mười từ tô vàng (3A) và Key vocabulary in context (remember / recall, remember, memorize) suy ra.
# Hình trong sách: bài quảng cáo Memory Enhancer cắt ba dải (khung đỏ theo câu), các câu tự đánh giá 3D, khung Key vocabulary
# tr. 64. Không đếm ngược. `phonemes` đánh ⚠ "their lives" (danh từ, Kokoro đọc đúng /laɪvz/) — đừng sửa thành livz.
id: U05-reading-2
activity: U05-reading
title: "Unit 5 · Thoughts"
subtitle: "Reading 2: practise with unknown words, true / false / not given"
title_vi: "Đọc quảng cáo khóa học Memory Enhancer: đúng / sai / không có thông tin, điền không quá ba từ, đoán nghĩa từ mới; remember, recall, memorize"
tag: "UNIT 5 · THOUGHTS"
speakers:
  # giọng theo bộ đọc: kokoro (mặc định khi có model) hoặc flite (dự phòng, có sẵn trên Ubuntu)
  emma: {name: Emma, role: teacher, color: "#C8102E", voice: {kokoro: af_heart, flite: slt}}
