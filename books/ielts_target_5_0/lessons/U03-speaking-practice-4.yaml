  - kind: qa
    chapter: "Thi thử 4 · Phần 3"
    heading: "Mock test 4 · Part 3 · Discussion (Emma asks Tom)"
    heading_vi: "Phần 3 — người mới đi làm: ý kiến + lý do + ví dụ"
    roles: {emma: examiner, tom: candidate}
    items:
      - q: "What can companies do to help new workers?"
        a: "They can give them a mentor, an experienced colleague who answers their questions. In my internship, I had a mentor, and she made the first week much easier."
        phrases: ["give them a mentor", "an experienced colleague", "much easier"]
      - q: "Is it important to enjoy your job?"
        a: "Yes, very important, because we spend so much of our lives at work. If you hate your job, it affects your health and your family life."
        phrases: ["Yes, very important", "so much of our lives", "it affects…"]
    lines:
