  - kind: qa
    chapter: "Hỏi qua lại: kỹ năng, phẩm chất"
    heading: "Tom and Emma ask each other · Skills and personal qualities"
    heading_vi: "Kỹ năng và phẩm chất — tự đánh giá, đưa ví dụ, cho lời khuyên"
    items:
      - q: "Tom, what are your strengths?"
        a: "I'm hard-working, and quite good at solving problems. My friends say I'm a good listener, too. But I need to be more patient!"
        ask: emma
        by: tom
        phrases: ["I'm hard-working", "good at solving problems", "a good listener"]
      - q: "What personal qualities does a teacher need, Emma?"
        a: "Patience, first of all. You also need energy, a sense of humour, and the ability to explain things in a simple way."
        ask: tom
        by: emma
        phrases: ["…, first of all.", "a sense of humour", "the ability to…"]
      - q: "Are you computer literate?"
        a: "Yes, I'd say so. I can use all the usual office programs, and I'm learning to make simple websites in my marketing course."
        ask: emma
        by: tom
        phrases: ["Yes, I'd say so.", "the usual office programs", "I'm learning to…"]
      - q: "Which skills are the most useful at work?"
        a: "Communication skills, definitely. Whatever your job is, you need to explain your ideas clearly and listen to other people. Teamwork is important too."
        ask: tom
        by: emma
        phrases: ["Communication skills", "Whatever your job is…", "Teamwork"]
      - q: "Is past experience more important than qualifications?"
        a: "For many jobs, yes. A degree shows that you can learn, but experience shows that you can actually do the job. That's why I wanted an internship."
        ask: emma
        by: tom
        phrases: ["For many jobs, yes.", "you can actually do the job", "That's why…"]
      - q: "How do you deal with stress at work?"
        a: "I make a list of everything I have to do, and I do the most important things first. And at the weekend, I go for a long walk. It always helps."
        ask: tom
        by: emma
        phrases: ["make a list of…", "most important things first", "It always helps."]
      - q: "Do you want to get a promotion quickly?"
        a: "Of course! But first, I want to learn as much as I can. A promotion comes with more responsibility, so you need to be ready for it."
        ask: emma
        by: tom
        phrases: ["Of course!", "as much as I can", "more responsibility"]
      - q: "What advice would you give to someone who's looking for their first job?"
        a: "Don't wait for the perfect job. Take a job where you can learn, work hard, and be kind to people. A good reference from your first boss is worth a lot."
        ask: tom
        by: emma
        phrases: ["Don't wait for…", "where you can learn", "is worth a lot"]
