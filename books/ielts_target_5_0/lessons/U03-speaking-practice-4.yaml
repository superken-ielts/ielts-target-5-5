  - kind: qa
    chapter: "Hỏi qua lại: nghề nghiệp ở Việt Nam và ở Anh"
    heading: "Tom and Emma ask each other · Jobs in Vietnam and in England"
    heading_vi: "Nghề nghiệp ở hai nước — so sánh, nêu lý do"
    items:
      - q: "What are the most popular jobs in Vietnam, Tom?"
        a: "Jobs in technology and banking are very popular, because the salaries are good. A lot of young people also want to work for foreign companies, or start online businesses."
        ask: emma
        by: tom
        phrases: ["very popular", "the salaries are good", "foreign companies"]
      - q: "What jobs do people do in your hometown, Emma?"
        a: "Mostly fishing, and jobs in tourism. In summer, the town is full of visitors, so there are lots of jobs in hotels, cafés and shops. In winter, it's very quiet."
        ask: tom
        by: emma
        phrases: ["jobs in tourism", "full of visitors", "very quiet"]
      - q: "Do people in Vietnam often do the same job as their parents?"
        a: "Not as much as before. My grandfather was a teacher, and my dad works with coffee, but I chose business. Parents still give a lot of advice, though!"
        ask: emma
        by: tom
        phrases: ["Not as much as before.", "I chose…", "…, though!"]
      - q: "Is it easy for foreigners to find work in Vietnam?"
        a: "For English teachers, yes, quite easy. You need a degree and a teaching certificate. For other jobs, it's harder, because you usually need to speak Vietnamese."
        ask: tom
        by: emma
        phrases: ["quite easy", "a teaching certificate", "it's harder, because…"]
      - q: "Which jobs are badly paid, in your opinion?"
        a: "Farmers and cleaners, I think. They work very hard, and their work is really important, but their salaries are often very low."
        ask: emma
        by: tom
        phrases: ["…, I think.", "really important", "very low"]
      - q: "Would you like to work in Vietnam forever?"
        a: "I'm not sure about forever! I love my life here, but my family is in England, and I'd like to open my own school there one day. Maybe I'll do both."
        ask: tom
        by: emma
        phrases: ["I'm not sure about…", "I love my life here", "Maybe I'll do both."]
