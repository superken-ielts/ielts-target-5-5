  - kind: qa
    chapter: "Bài A: câu hỏi về nghề"
    heading: "Speaking 2A · Answer these questions"
    heading_vi: "Nghe Tom trả lời mẫu — chú ý would"
    items:
      - q: "What jobs do the people in your family do?"
        a: "My father works as an engineer for a construction company, and my mother is a nurse. My sister works in a bank."
        phrases: ["works as …", "works for …", "works in …"]
        ask: emma
        by: tom
      - q: "Do any of your friends or family have a job you would really like?"
        a: "Yes, my uncle is a pilot. I would really like his job, because he travels all over the world."
        phrases: ["I would really like …", "because …"]
        ask: emma
        by: tom
      - q: "Is there a job you would like to do more than any other?"
        a: "I would most like to be an architect. I love drawing, and I'd like to design buildings for my city."
        phrases: ["I would most like to be …", "I'd like to …"]
        ask: emma
        by: tom
    lines:
      - emma: "Exercise A. Answer these questions with a partner. Tom, you're my partner today."
        say: "Exercise eigh. Answer these questions with a partner. Tom, you're my partner today."
        vi: "Bài A: trả lời ba câu hỏi."
      - {emma: "What jobs do the people in your family do?", focus: 0}
      - {tom: "My father works as an engineer for a construction company, and my mother is a nurse. My sister works in a bank.", reveal: 0}
      - {emma: "Do any of your friends or family have a job you would really like?", focus: 1}
      - {tom: "Yes, my uncle is a pilot. I would really like his job, because he travels all over the world.", reveal: 1}
      - {emma: "Is there a job you would like to do more than any other?", focus: 2}
      - {tom: "I would most like to be an architect. I love drawing, and I'd like to design buildings for my city.", reveal: 2}

  - kind: compare
    chapter: "Grammar check: would / could"
    heading: "Grammar check · would and could"
    heading_vi: "Dùng would, could khi tình huống không có thật"
    items:
      - title: "would — imagine it"
        title_vi: "Tưởng tượng, mong muốn"
        lines: ["What job would you most like?", "(the person will not really have this job)", "I would like to be a pilot."]
      - title: "could — is it possible?"
        title_vi: "Có khả năng làm được không"
        lines: ["Do you think you could do his job?", "(the person will not really try to do the job)", "I could do it, but I couldn't do it every day."]
    lines:
      - emma: "Grammar check. We use would and could when a situation is not real."
        vi: "would / could: tình huống không có thật."
      - {emma: "What job would you most like? The person will not really have this job. We are only imagining.", focus: 0}
      - {tom: "I would like to be a pilot.", focus: 0}
      - {emma: "Do you think you could do his job? The person will not really try to do it.", focus: 1}
      - {tom: "I think I could do it, but I couldn't do it every day.", focus: 1}

  - kind: bullets
    chapter: "Phát âm: would you / could you"
    heading: "Pronunciation check · would you /wʊdʒuː/ · could you /kʊdʒuː/"
    heading_vi: "d + you nối thành /dʒuː/ — theo Tapescript Track 30"
    items:
      - {en: "What job would you most like?", vi: "would you → /wʊdʒuː/"}
      - {en: "Do you think you could do this job?", vi: "could you → /kʊdʒuː/ (in questions: Could you…?)"}
    lines:
      - emma: "Pronunciation check. Listen and notice the pronunciation of would you, and could you. The d and the y join together: joo."
        say: "Pronunciation check. Listen, and notice the pronunciation of would you, and could you. The D and the Y join together: joo."
        vi: "d + y nối thành âm /dʒ/."
      - {tom: "What job would you most like?", say: "What job woodjoo most like?", focus: 0}
      - {tom: "Would you. Would you.", say: "Woodjoo. Woodjoo.", focus: 0}
      - {tom: "Do you think you could do this job?", focus: 1}
      - {tom: "Could you help me? Could you.", say: "Could-joo help me? Could-joo.", focus: 1}
      - {wait: 6, note: "Say the sentences", vi: "Nói lại hai câu, nối âm /dʒuː/."}

  - kind: errors
    chapter: "Watch out! Lỗi hay gặp"
    heading: "Watch out! · Typical errors"
    heading_vi: "Tình huống tưởng tượng: dùng would / could"
    items:
      - {wrong: "Do you like to work in another country?", right: "Would you like to work in another country?", note: "hỏi mong muốn trong tương lai: Would you like…?"}
      - {wrong: "Do you think you can be the president …?", right: "Do you think you could be the president …?", note: "… of your country one day? — khó xảy ra → could"}
    lines:
      - emma: "Watch out! Two typical errors."
        vi: "Hai lỗi hay gặp."
      - {emma: "Number one. Do you like asks about now, in general. For a wish, we say: would you like.", focus: 0}
      - {tom: "Would you like to work in another country?", focus: 0}
      - {emma: "Number two. Being the president is not very likely, so we use could.", focus: 1}
      - {tom: "Do you think you could be the president of your country one day?", focus: 1}

