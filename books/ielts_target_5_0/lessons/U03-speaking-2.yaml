  - kind: letter
    chapter: "Bài nói mẫu (thẻ B)"
    heading: "Tom's talk · What is the best job in the world? (1/2)"
    heading_vi: "Mỗi ý trên thẻ một đoạn; dùng would / could"
    words: 172
    items:
      - text: "I'm going to talk about the job I think is the best in the world: a doctor, especially a doctor in a children's hospital."
        note: "what the job is"
      - text: "I think it's such a good job because doctors help people every day. When a sick child gets better and goes home, it must be very rewarding. Doctors are also respected in my country, and people trust them."
        note: "why it is such a good job"
      - text: "Of course, it isn't an easy job. Doctors work very long hours, and sometimes they have to work at night."
        note: "+ một ý trái chiều"
    lines:
      - {read: tom, focus: 0}
      - {read: tom, focus: 1}
      - {read: tom, focus: 2}

  - kind: letter
    heading: "Tom's talk · What is the best job in the world? (2/2)"
    heading_vi: "Mỗi ý trên thẻ một đoạn; dùng would / could"
    words: 172
    items:
      - text: "The type of person who does this job must be kind and patient, because children are often frightened in hospital. A good doctor also has to stay calm when there is an emergency, and work hard all through their career."
        note: "what type of person does it"
      - text: "Do I think I could do it? Honestly, I'm not sure. You have to study for six or seven years, and I'm not very good at biology. I think I could be a nurse, though, because I like helping people."
        note: "if you think you could do it"
      - text: "So, for me, it's the best job in the world."
        note: "câu kết"
    lines:
