        vi: "Phần 2: tự nói 2 phút. Hôm nay học cách chuẩn bị."

  - kind: bullets
    chapter: "Hôm nay học gì"
    heading: "Today's lesson"
    heading_vi: "Speaking 2, bài A–C"
    items:
      - {en: "A: answer questions about jobs", vi: "Trả lời câu hỏi về nghề nghiệp"}
      - {en: "Grammar check: would and could — situations that are not real", vi: "would / could cho tình huống không có thật"}
      - {en: "Pronunciation: would you /wʊdʒuː/ · could you /kʊdʒuː/", vi: "Nối âm would you, could you"}
      - {en: "B–C: part 2 cards — one minute to prepare, two minutes to speak", vi: "Thẻ đề Phần 2: chuẩn bị 1 phút, nói 2 phút"}
