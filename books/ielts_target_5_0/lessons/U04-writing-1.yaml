      - {emma: "First, understand the task. Highlight the key words and check them in a dictionary.", focus: 1}
      - {emma: "Measured, wealth, material possessions, acquired.", focus: 2}
      - {tom: "Then brainstorm points. I can think in Vietnamese first!", focus: 3}
