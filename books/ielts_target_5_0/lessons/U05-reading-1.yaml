  - kind: figure
    chapter: "Reading 1C: a sieve"
    heading: "Reading 1C · 2 Tick the correct picture of a sieve"
    heading_vi: "Bốn tranh tr. 62 — tạm dừng video và chọn; đáp án hiện sau"
