  mai: {name: Mai, role: student, color: "#2E7D32", voice: {kokoro: af_bella, flite: slt}}

scenes:
  - kind: title
    chapter: "Giới thiệu"
    lines:
      - emma: "Welcome to Reading for Unit 5. Today: what to do when you meet a word you don't know."
        say: "Welcome to Reading for Unit five. Today: what to do when you meet a word you don't know."
        vi: "Reading Unit 5: làm gì khi gặp từ không biết."
      - tom: "Easy. I look it up in my dictionary."
        vi: "Dễ mà, mình tra từ điển."
      - emma: "Not in the exam! There's no dictionary. So you learn to guess the meaning from the words around it. Try each exercise first. The answers come after."
        vi: "Trong phòng thi không có từ điển — phải đoán nghĩa từ các từ xung quanh. Làm từng bài trước, đáp án hiện sau."

