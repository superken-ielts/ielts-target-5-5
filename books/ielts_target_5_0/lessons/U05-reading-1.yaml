        say: "Two. Tick the correct picture of a sieve: eigh, B, C or D. Yooz the clue in the extract: information goes straight in and straight back out. Pause the video and choose."
        vi: "C2: tranh nào là cái sieve? Manh mối: thông tin vào thẳng rồi ra thẳng. Tạm dừng video và chọn."
