# Hình trong sách: đoạn trích có từ tô vàng (1A–B), bốn tranh 1C, Exam tip, ba đoạn 1D, khung từ 2A, năm câu 2B tr. 62–63.
id: U05-reading-1
activity: U05-reading
title: "Unit 5 · Thoughts"
subtitle: "Reading 1–2: guessing new words in context"
title_vi: "Đoán nghĩa từ mới qua ngữ cảnh: capacity, a memory like a sieve, tune in, alert, judgement, brainy, in two minds …"
