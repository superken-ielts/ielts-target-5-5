  - kind: figure
    chapter: "Exam tip"
    heading: "Exam tip · Guess meanings in context"
    heading_vi: "Exam tip tr. 62"
    image: {pdf: course-book, page: 63, clip: [56, 480, 445, 545]}
    lines:
      - emma: "Exam tip. When you are reading, you don't want to worry about the meaning of every word. However, some words are vital to understand the text or to answer a question correctly."
        vi: "Mẹo thi: không cần lo nghĩa của mọi từ, nhưng có những từ quan trọng để hiểu bài hoặc trả lời câu hỏi."
      - emma: "You will not have a dictionary in the exam, so it is important that you learn to guess the meanings of words in context, from the other words around the word that you don't know."
        vi: "Phòng thi không có từ điển — hãy tập đoán nghĩa qua các từ xung quanh."

