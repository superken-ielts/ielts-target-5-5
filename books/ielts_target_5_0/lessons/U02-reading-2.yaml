      - {en: "B: a professional · family and friends · a teaching certificate · goggles · plastic sandals · support", vi: "Theo Answer key"}
      - {en: "advantage · support · professional · safety", vi: "Danh từ trong ngữ cảnh"}
      - {en: "comfortable swimwear · deep / dirty water · long hair · bare feet", vi: "Cặp từ đi với nhau"}
      - {en: "Workbook page 8: not in this book set", vi: "Workbook trang 8 chưa có trong bộ sách"}
    lines:
      - emma: "Let's review."
        vi: "Cùng ôn lại."
