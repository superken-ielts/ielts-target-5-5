# Video bài giảng Unit 4 · Speaking 1 + Vocabulary 1 (sách in trang 46). Dựng: cd agents && python -m lesson_video build ../books/ielts_target_5_0/lessons/U04-speaking-1.yaml
# Cách viết: xem đầu file U01-speaking-1.yaml. Track 39 (sáu đoạn nói về người nổi tiếng, tên bị che bằng tiếng bíp) không
# có file nghe: Mai, Jerry, Tom đọc lại đúng Tapescript (sách in trang 283), "beep" thay cho [BLEEP]. Answer key không có
# Speaking 1C và Vocabulary 1A: đáp án suy ra từ Tapescript — 1C: 1 e, 2 d, 3 a, 4 b, 5 f, 6 c; 1A: powerful a, mental and
# physical strength f, child prodigy c, courage f, creating something d, wealth a, overcome a difficulty b, had a big
# influence e. Ghi chú thời sự (đợt 31): sách viết khi Margaret Thatcher (mất 2013) và Sheikh Khalifa (mất 2022) còn sống —
# Emma dùng chuyện này để dạy present perfect / past simple ở Grammar check.
# Hình trong sách (đợt 31): sáu ảnh tr. 46 (khung đỏ theo ảnh, nhãn là tên), danh sách từ Vocabulary 1A (khung đỏ theo từ,
# nhãn là ảnh), khung Grammar check và Watch out. Không đếm ngược: Emma nhắc tạm dừng video.
