  - kind: figure
    chapter: "Grammar check: have achieved hay achieved?"
    heading: "Grammar check · Present perfect or past simple?"
    heading_vi: "Khung Grammar check và Watch out tr. 46"
    image: {pdf: course-book, page: 47, clip: [60, 694, 553, 788]}
    items:
      - {box: [62, 698, 445, 757], label: "present perfect"}
      - {box: [62, 756, 445, 786], label: "past simple"}
      - {box: [408, 694, 551, 757], label: "typical errors"}
    lines:
      - emma: "Grammar check. We use the present perfect to talk about achievement if the person is still alive, or still achieving. He is only 30, but he has achieved a lot."
        say: "Grammar check. We yooz the present perfect to talk about achievement if the person is still alive, or still achieving. He is only thirty, but he has achieved a lot."
        focus: 0
        vi: "Present perfect (has / have achieved): người đó còn sống hoặc vẫn đang đạt thêm thành tựu."
      - {tom: "And about me: I haven't really achieved what I want yet.", focus: 0, vi: "Về mình: mình chưa thật sự đạt được điều mình muốn."}
      - emma: "We use the past simple if the person is dead, or has stopped achieving. Gandhi achieved great things in his life. Pele achieved a great deal during his career."
        say: "We yooz the past simple if the person is dead, or has stopped achieving. Gandhi achieved great things in his life. Pelay achieved a great deal during his career."
        focus: 1
        vi: "Past simple (achieved): người đã mất hoặc đã thôi sự nghiệp."
      - emma: "Here's an interesting example. When this book was written, Margaret Thatcher and Sheikh Khalifa were alive. Thatcher died in 2013, and Sheikh Khalifa in 2022."
        say: "Here's an interesting example. When this book was written, Margaret Thatcher and Shake Kha-lee-fa were alive. Thatcher died in twenty thirteen, and Shake Kha-lee-fa in twenty twenty-two."
        focus: 1
        vi: "Khi sách được viết, Thatcher và Sheikh Khalifa còn sống; bà Thatcher mất năm 2013, Sheikh Khalifa mất năm 2022."
      - tom: "So now we use the past simple for them. Margaret Thatcher achieved a lot in her life."
        focus: 1
        vi: "Vậy giờ dùng past simple: Margaret Thatcher achieved a lot in her life."
      - emma: "Exactly. And watch out for two typical errors. Not: I don't achieve what I want yet. And not: I don't have achieved. Say: I haven't achieved what I want yet."
        focus: 2
        vi: "Lỗi hay gặp: không nói I don't achieve / I don't have achieved — nói I haven't achieved what I want yet."

