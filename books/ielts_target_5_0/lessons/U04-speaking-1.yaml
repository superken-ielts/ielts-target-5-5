      - {tom: "Extract six. This is a picture of the child prodigy, beep, from Singapore. I think he's only about six years old, but he's already passed exams.", focus: 5}
      - {tom: "Now, he's studying Chemistry at a college. Achieving something like this at such a young age is just fantastic. What will he achieve by the time he's forty or fifty?", focus: 5}
