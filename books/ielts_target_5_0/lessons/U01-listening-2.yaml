      - emma: "Now listen. Greg is phoning Maggie to check the staff data."
        vi: "Greg gọi cho Maggie để kiểm tra dữ liệu nhân viên."
      - {track: U01-L2A, note: "Track 7 · Listening 2A", vi: "Nghe và điền 10 chỗ trống."}
      - {wait: 8, note: "Check your answers", vi: "Xem lại: chính tả, chữ hoa, số."}

  - kind: blanks
    chapter: "Đáp án 1–5: Peter"
    heading: "Listening 2A · Answers 1–5 (Peter)"
    heading_vi: "Bài B: so với Answer key — dòng Tip là câu nghe được"
    items:
      - {n: 1, q: "Name: Peter ___", answer: "Austin", tip: "It's A-U-S-T-I-N — Austin with an i, not Austen with an e"}
      - {n: 2, q: "Address: ___ Argyle Street", answer: "110", tip: "a hundred and ten Argyle Street"}
      - {n: 3, q: "Age: ___", answer: "47", tip: "He's forty-seven."}
      - {n: 4, q: "Married (has ___, two boys and a girl)", answer: "three children", tip: "He has three children – two boys and a girl. (also: 3 children)"}
      - {n: 5, q: "Date of joining company: 08 / ___", answer: "2003", tip: "He started with Esco in August two thousand and three."}
    lines:
      - emma: "Exercise B. Check the key on page 266. How many did you answer correctly? Let's start with Peter."
