# Video bài giảng Unit 1 · Listening 2: practising listening for specific information (sách in trang 12–13). Dựng: cd agents && python -m lesson_video build ../books/ielts_target_5_0/lessons/U01-listening-2.yaml
# Cách viết: xem đầu file U01-speaking-1.yaml và U02-listening-1.yaml (dòng `track`). Phát nguyên Track 7 (U01-L2A).
