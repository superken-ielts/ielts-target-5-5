      - {emma: "Did you read the instructions carefully?", focus: 0}
      - {emma: "Did you predict the type of answer?", focus: 1}
      - {emma: "Did you use capital letters for the names?", focus: 2}
      - {emma: "Did you understand all the words on the form?", focus: 3}
      - {emma: "And did you spell everything correctly?", focus: 4}
      - {emma: "The question-type tip: in the Listening and Reading Modules, the instructions will often tell you to write two or three words as your answer.", focus: 5}

