      - {tom: "Moore. M, O, O, R, E. Double o.", say: "Moore. em, oh, oh, ar, ee. Double oh.", reveal: 6}
      - {emma: "Seven.", focus: 1}
      - {tom: "Cedar. C, E, D, A, R. Greg asks Maggie to spell it.", say: "Cedar. see, ee, dee, eigh, ar. Greg asks Maggie to spell it.", reveal: 7}
      - {emma: "Eight.", focus: 2}
      - {tom: "Six five oh three nine six.", reveal: 8}
      - emma: "Phone numbers come fast. Write the digits in groups, like this: six five oh, three nine six."
        vi: "Số điện thoại đọc nhanh — ghi theo từng cụm."
      - {emma: "Nine.", focus: 3}
      - {tom: "Twenty-two.", reveal: 9}
      - {emma: "And ten.", focus: 4}
      - {tom: "Single. She's not married.", reveal: 10}

  - kind: bullets
