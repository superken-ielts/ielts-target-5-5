      - {n: 7, q: "Address: 72 ___ Road", answer: "Cedar", tip: "And how do you spell Cedar? C-E-D-A-R."}
      - {n: 8, q: "Tel. no.: 07984 ___", answer: "650396", tip: "Her phone number is 07984 650396."}
      - {n: 9, q: "Age: ___", answer: "22", tip: "She's twenty-two … (also: twenty-two)"}
      - {n: 10, q: "Marital status: ___", answer: "single", tip: "… and she's single."}
    lines:
