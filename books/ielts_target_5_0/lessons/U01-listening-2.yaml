        vi: "Bài B: kiểm tra với Answer key."
      - {emma: "Number one.", focus: 0}
      - {tom: "Austin. Greg asks: Austin with an i, or Austen with an e? And Maggie spells it: A, U, S, T, I, N.", say: "Austin. Greg asks: Austin with an eye, or Austen with an ee? And Maggie spells it: eigh, you, ess, tee, eye, en.", reveal: 1}
      - {emma: "Number two.", focus: 1}
      - {tom: "A hundred and ten. So, one one zero.", say: "A hundred and ten. So, one, one, zero.", reveal: 2}
      - {emma: "Three.", focus: 2}
      - {tom: "Forty-seven.", reveal: 3}
      - {emma: "Four.", focus: 3}
      - {tom: "Three children. Two words, so that's fine.", reveal: 4}
      - {emma: "Five.", focus: 4}
      - {tom: "Two thousand and three. He started in August, and August is month eight.", reveal: 5}

  - kind: blanks
    chapter: "Đáp án 6–10: Jane"
    heading: "Listening 2A · Answers 6–10 (Jane)"
    heading_vi: "Theo Answer key — chú ý cách đánh vần tên riêng"
    items:
