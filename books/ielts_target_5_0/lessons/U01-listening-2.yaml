# 6 Moore, 7 Cedar, 8 650396, 9 22, 10 single. Câu bằng chứng theo Tapescript Track 7 (sách in trang 277–278).
# Key vocabulary in context là đáp án gợi ý (address, age, marital status).
id: U01-listening-2
activity: U01-listening
title: "Unit 1 · Life"
subtitle: "Listening 2: practising listening for specific information"
title_vi: "Nghe điền phiếu thông tin nhân viên — tên, địa chỉ, tuổi, số điện thoại (Track 7 của sách)"
tag: "UNIT 1 · LIFE"
