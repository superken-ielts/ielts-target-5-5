      - tom: "Is it like section 1 of the exam?"
        say: "Is it like section one of the exam?"
      - emma: "Yes! A phone call, and a form to fill in."

  - kind: bullets
    chapter: "Trước khi nghe"
    heading: "Exam tip · Section 1 of the Listening Module"
    heading_vi: "Phần 1 bài thi Nghe thường là điền thông tin còn thiếu"
    items:
      - {en: "In section 1, you often fill in missing information", vi: "Phần 1: điền thông tin còn thiếu"}
      - {en: "In other parts, you also listen for names and dates", vi: "Các phần khác cũng hỏi tên, ngày tháng"}
      - {en: "Write no more than three words or a number", vi: "Tối đa ba từ hoặc một số"}
      - {en: "Names are often spelled: listen for the letters", vi: "Tên riêng thường được đánh vần — nghe từng chữ cái"}
    lines:
      - emma: "The exam tip. In section 1 of the Listening Module, you often need to fill in missing information. In other parts of the exam, you also need to listen for information such as names and dates."
        say: "The exam tip. In section one of the Listening Module, you often need to fill in missing information. In other parts of the exam, you also need to listen for information such as names and dates."
        vi: "Mẹo thi: phần 1 thường là điền thông tin; các phần khác cũng hỏi tên, ngày tháng."
      - {emma: "Fill in the missing information.", focus: 0}
      - {emma: "Names and dates are everywhere.", focus: 1}
      - {emma: "Write no more than three words or a number.", focus: 2}
      - {emma: "And when a name is spelled, write each letter carefully.", focus: 3}

  - kind: blanks
    chapter: "Nghe Track 7"
    heading: "Listening 2A · Complete the notes about two people at Esco Engineering"
    heading_vi: "Phiếu nhân viên của Peter (1–5) và Jane (6–10) — tối đa ba từ hoặc một số"
    items:
      - {n: 1, q: "Peter — Name: Peter ___", answer: "Austin"}
      - {n: 2, q: "Peter — Address: ___ Argyle Street, Tunbridge Wells", answer: "110"}
      - {n: 3, q: "Peter — Age: ___", answer: "47"}
      - {n: 4, q: "Peter — Married (has ___, two boys and a girl)", answer: "three children"}
      - {n: 5, q: "Peter — Date of joining company: 08 / ___", answer: "2003"}
      - {n: 6, q: "Jane — Name: Jane ___", answer: "Moore"}
      - {n: 7, q: "Jane — Address: 72 ___ Road, Crowborough", answer: "Cedar"}
      - {n: 8, q: "Jane — Tel. no.: 07984 ___", answer: "650396"}
      - {n: 9, q: "Jane — Age: ___", answer: "22"}
      - {n: 10, q: "Jane — Marital status: ___", answer: "single"}
    lines:
      - emma: "Exercise A. Listen and complete the notes about two people who work at Esco Engineering. Write no more than three words or a number for each answer."
        say: "Exercise eigh. Listen and complete the notes about two people who work at Esco Engineering. Write no more than three words or a number for each answer."
        vi: "Bài A: nghe và điền phiếu của hai nhân viên Esco Engineering."
      - emma: "First, read the notes and predict. Number one: a surname. Number two: a house number. Three: an age. Four: something about his family."
        vi: "Đoán trước: 1 họ, 2 số nhà, 3 tuổi, 4 thông tin gia đình."
