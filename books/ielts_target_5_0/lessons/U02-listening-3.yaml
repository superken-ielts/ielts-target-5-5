        vi: "Bài C: đánh dấu những câu đúng với bạn."
      - {emma: "Did you read the instructions carefully?", focus: 0}
      - {emma: "Did you predict the type of answer?", focus: 1}
      - {emma: "Capital letters: Merton and September need them.", focus: 2}
      - {emma: "Spelling.", focus: 3}
      - {emma: "And do you know why you got some answers wrong? Maybe sixteen and sixty, or June and July.", focus: 4}

  - kind: blanks
    chapter: "Từ vựng: course, class, lesson"
    heading: "Key vocabulary in context · course / class / lesson"
    heading_vi: "Gạch bỏ từ sai (đáp án gợi ý)"
    items:
      - {n: 1, q: "My History ___ begins at 9.00 a.m.", answer: "class / lesson", tip: "class or lesson = one period of teaching; not course"}
      - {n: 2, q: "The ___ lasts for 13 weeks.", answer: "course", tip: "course = a series of lessons over weeks or months"}
      - {n: 3, q: "It is a small ___. There are only six students.", answer: "class", tip: "class = a group of students who learn together"}
    lines:
      - emma: "Key vocabulary in context. Cross out any wrong words in these sentences: course, class or lesson."
        vi: "Từ vựng: chọn course, class hay lesson."
      - {wait: 6, note: "Pause the video and choose", vi: "Tạm dừng video và chọn."}
      - {emma: "One: my History … begins at nine a.m.", say: "One: my History, blank, begins at nine in the morning.", focus: 0}
      - {tom: "Class or lesson. A course doesn't begin at nine every day.", reveal: 1}
      - {emma: "Two: the … lasts for thirteen weeks.", say: "Two: the, blank, lasts for thirteen weeks.", focus: 1}
      - {tom: "Course. A course is many lessons, over weeks.", reveal: 2}
      - {emma: "Three: it is a small … There are only six students.", say: "Three: it is a small, blank. There are only six students.", focus: 2}
      - {tom: "Class. A class is a group of students.", reveal: 3}

  - kind: bullets
    chapter: "Tổng kết"
    heading: "Summary"
    heading_vi: "Ghi nhớ"
    items:
      - {en: "1 c · 2 c · 3 September 18 · 4 12 · 5 December 14 · 6 96", vi: "Đáp án 1–6"}
      - {en: "7 6 · 8 7 · 9 Merton · 10 3 · 11 109 · 12 28", vi: "Đáp án 7–12"}
      - {en: "Answers come in the same order as the questions", vi: "Đáp án theo thứ tự câu hỏi"}
      - {en: "Traps: 16 / 60, 96 / 69, June / July, three courses but one answer", vi: "Bẫy hay gặp"}
      - {en: "course · class · lesson", vi: "Khóa học · lớp · buổi học"}
    lines:
      - emma: "Let's review."
        vi: "Cùng ôn lại."
      - {emma: "Answers one to six.", focus: 0}
      - {emma: "Answers seven to twelve.", focus: 1}
      - {emma: "The answers come in the same order as the questions.", focus: 2}
      - {emma: "Watch out for the traps.", focus: 3}
      - {tom: "And a course has many lessons, and a class is a group of students!", focus: 4}
