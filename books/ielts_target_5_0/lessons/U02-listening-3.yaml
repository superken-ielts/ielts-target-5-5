id: U02-listening-3
activity: U02-listening
title: "Unit 2 · Learning"
subtitle: "Listening 2: practise listening for numbers and dates"
title_vi: "Nghe cuộc gọi đăng ký khóa học — 12 câu hỏi về số, ngày tháng, tên (Track 22 của sách)"
tag: "UNIT 2 · LEARNING"
speakers:
