        by: emma
        phrases: ["big albums", "When I visit her…", "a story about every picture"]
      - q: "Do you prefer printed photos or photos on your phone?"
        a: "Printed photos, because they feel more real. I have thousands of photos on my phone, but I never look at them. A printed photo on the wall, I see every day."
