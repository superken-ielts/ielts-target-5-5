  - kind: qa
    chapter: "Hỏi qua lại: tên gọi"
    heading: "Tom and Emma ask each other · Names"
    heading_vi: "Tên gọi — một chủ đề Phần 1 rất hay gặp"
    items:
      - q: "Does your name have a special meaning, Tom?"
        a: "Yes. My real name is Tuan, and it means handsome and talented. My parents had high hopes for me!"
        ask: emma
        by: tom
        phrases: ["My real name is…", "it means…", "high hopes"]
      - q: "Who chose your name, Emma?"
        a: "My mum did. Emma was the name of her favourite teacher at school. My dad wanted to call me Sarah, but my mum won!"
        ask: tom
        by: emma
        phrases: ["My mum did.", "was the name of…", "wanted to call me…"]
      - q: "Why do you use an English name?"
        a: "Because it's easier for foreign teachers and friends. Some people find Vietnamese names hard to pronounce. But my family and old friends still call me Tuan."
        ask: emma
        by: tom
        phrases: ["easier for…", "hard to pronounce", "still call me…"]
      - q: "Do you have a nickname?"
        a: "My Vietnamese friends call me Em, which is funny, because em means little sister in Vietnamese! My students love that."
        ask: tom
        by: emma
        phrases: ["My… friends call me…", "which is funny", "it means…"]
      - q: "Are there any popular names in Vietnam?"
        a: "Yes, Nguyen is the most common family name. Almost forty percent of people have it! For first names, Anh and Linh are very popular now."
        ask: emma
        by: tom
        phrases: ["the most common family name", "Almost forty percent", "very popular now"]
      - q: "Would you like to change your name?"
        a: "No, I wouldn't. I like my name, because it's short and easy to spell. And it reminds me of my mum's favourite teacher, so it has a nice story."
        ask: tom
        by: emma
        phrases: ["No, I wouldn't.", "easy to spell", "it reminds me of…"]
