  - kind: qa
    chapter: "Thi thử 2 · Phần 1"
    heading: "Mock test 2 · Part 1 · Introduction and interview"
    heading_vi: "Thi thử đổi vai — Tom là giám khảo, Emma là thí sinh"
    roles: {tom: examiner, emma: candidate}
    items:
      - q: "Can you tell me your full name, please?"
        a: "Good afternoon. My full name is Emma Louise Clarke, but please call me Emma."
        phrases: ["My full name is…", "please call me…"]
      - q: "Can I see your identification, please?"
        a: "Sure. Here it is."
      - q: "Are you a morning person?"
        a: "Not really. I find it hard to get up early, so I always set two alarms! But once I've had a cup of coffee, I feel fine."
        phrases: ["Not really.", "I find it hard to…", "once I've had…"]
      - q: "What do you usually have for breakfast?"
        a: "Usually just toast and coffee, because I'm always in a hurry. At the weekend, I make a big breakfast with eggs and fruit."
        phrases: ["Usually just…", "in a hurry", "At the weekend…"]
      - q: "What's your favourite kind of weather?"
        a: "I like cool, sunny days, like in autumn. Hot weather makes me tired, so I find the summer here quite difficult!"
        phrases: ["I like…", "makes me tired", "I find… difficult"]
      - q: "Do you prefer living in the city or in the countryside?"
        a: "For now, the city, because there's so much to do. But I grew up near the sea, so sometimes I really miss the quiet and the fresh air."
        phrases: ["For now…", "there's so much to do", "I really miss…"]
      - q: "How do you usually get to work?"
        a: "By motorbike taxi, because it's quick and cheap. But when it rains, I take the bus, and it takes much longer because of the traffic."
        phrases: ["By…", "quick and cheap", "takes much longer"]
