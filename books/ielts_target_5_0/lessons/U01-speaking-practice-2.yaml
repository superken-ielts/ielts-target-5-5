  - kind: qa
    chapter: "Hỏi qua lại: thời gian rảnh"
    heading: "Tom and Emma ask each other · Free time and weekends"
    heading_vi: "Thời gian rảnh — hiện tại đơn cho thói quen: usually, sometimes, every…"
    items:
      - q: "What do you like doing in your free time, Tom?"
        a: "I usually play basketball with my friends. I also love watching films, especially science fiction. On rainy days, I just stay at home and play video games."
        ask: emma
        by: tom
        phrases: ["I usually…", "especially…", "On rainy days…"]
      - q: "Emma, what do you like doing in your free time?"
        a: "I love cooking, especially for my friends. At the weekend, I sometimes go hiking in the hills. It helps me to relax after a busy week."
        ask: tom
        by: emma
        phrases: ["I love…", "especially…", "It helps me to relax"]
      - q: "How do you usually spend your weekends?"
        a: "On Saturday mornings, I play basketball. In the afternoon, I study, or I meet my friends for coffee. On Sundays, I call my family, and I relax."
        ask: emma
        by: tom
        phrases: ["On Saturday mornings", "meet my friends for coffee", "On Sundays"]
      - q: "Do you prefer staying at home or going out?"
        a: "It depends on my mood. After a busy week, I love staying at home with a good book. But if the weather is nice, I prefer going out with friends."
        ask: tom
        by: emma
        phrases: ["It depends on…", "After a busy week", "If the weather is nice…"]
      - q: "What kind of music do you like?"
        a: "I like pop music, and some Vietnamese indie bands. I listen to music every day on the bus. It makes the journey feel shorter."
        ask: emma
        by: tom
        phrases: ["I like…", "on the bus", "makes the journey feel shorter"]
      - q: "Do you read much?"
        a: "Yes, I read every evening before bed. I like novels, especially detective stories. Reading helps me to relax and switch off after work."
        ask: tom
        by: emma
        phrases: ["every evening before bed", "detective stories", "switch off"]
      - q: "Do you spend a lot of time on your phone?"
        a: "Probably too much! I use it for studying, chatting with friends and watching videos. I'm trying to use it less in the evening, so I can sleep better."
        ask: emma
        by: tom
        phrases: ["Probably too much!", "I'm trying to…", "so I can…"]
      - q: "Is there a new hobby you'd like to try?"
        a: "Yes, I'd love to learn to play the guitar. My brother plays very well, and I'd like to play songs with him when we meet at Christmas."
        ask: tom
        by: emma
        phrases: ["I'd love to learn to…", "plays very well", "I'd like to…"]
