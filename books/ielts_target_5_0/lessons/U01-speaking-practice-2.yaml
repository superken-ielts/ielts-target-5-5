  - kind: qa
    chapter: "Hỏi qua lại: việc học, công việc"
    heading: "Tom and Emma ask each other · Studies and work"
    heading_vi: "Việc học và công việc — nêu lý do bằng because, so"
    items:
      - q: "What are you studying at the moment, Tom?"
        a: "I'm studying business at a university in Ho Chi Minh City. I'm in my second year, and I'm really enjoying it."
        ask: emma
        by: tom
        phrases: ["I'm studying…", "in my second year", "I'm really enjoying it"]
      - q: "Emma, do you enjoy your job?"
        a: "Yes, I really do. I teach English to adults, and my students are very motivated. It's great to see them become more confident every week."
        ask: tom
        by: emma
        phrases: ["Yes, I really do.", "very motivated", "become more confident"]
      - q: "Why did you choose business?"
        a: "Because I'm interested in how companies work, and there are lots of good jobs in business. My dad works for a coffee company, and he encouraged me too."
        ask: emma
        by: tom
        phrases: ["I'm interested in…", "lots of good jobs", "encouraged me"]
      - q: "What's the most difficult part of your job?"
        a: "Probably the long hours. I often prepare lessons in the evening, and I have classes at the weekend. Sometimes I feel tired, but I still love it."
        ask: tom
        by: emma
        phrases: ["Probably…", "prepare lessons", "I still love it"]
      - q: "What's your favourite subject at university?"
        a: "Marketing. It's creative, and we do a lot of group projects. Last term, we made an advertising plan for a small coffee shop, and it was really fun."
        ask: emma
        by: tom
        phrases: ["It's creative", "group projects", "Last term, we…"]
      - q: "What advice would you give to a new English learner?"
        a: "Listen to English every day, even for ten minutes, and don't be afraid of making mistakes. Everybody makes mistakes, and that's how we learn."
        ask: tom
        by: emma
        phrases: ["even for ten minutes", "don't be afraid of…", "that's how we learn"]
