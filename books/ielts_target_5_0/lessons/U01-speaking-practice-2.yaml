  - kind: qa
    chapter: "Hỏi qua lại: tuổi thơ"
    heading: "Tom and Emma ask each other · Childhood"
    heading_vi: "Tuổi thơ — kể chuyện quá khứ bằng thì quá khứ đơn"
    items:
      - q: "Emma, where did you grow up?"
        a: "I grew up in a small town by the sea. My parents both worked, so I spent a lot of time with my grandparents. Their house was just five minutes from the beach."
        ask: tom
        by: emma
        phrases: ["I grew up in…", "spent a lot of time with…", "five minutes from…"]
      - q: "What did you like doing when you were a child, Tom?"
        a: "I loved playing football in the street with the other kids from my neighbourhood. We played every afternoon until it got dark, and our mums called us home for dinner."
        ask: emma
        by: tom
        phrases: ["I loved playing…", "every afternoon", "until it got dark"]
      - q: "Who was your best friend when you were a child?"
        a: "Her name was Lucy, and she lived next door. We did everything together. We even had a secret language that nobody else could understand!"
        ask: tom
        by: emma
        phrases: ["lived next door", "did everything together", "a secret language"]
      - q: "What was your favourite toy?"
        a: "A red bicycle. My grandfather gave it to me for my seventh birthday. I rode it everywhere, and I was really sad when it got too small for me."
        ask: emma
        by: tom
        phrases: ["gave it to me for…", "I rode it everywhere", "got too small for me"]
      - q: "Did you enjoy primary school?"
        a: "Yes, mostly. I loved reading and art, but I hated maths, because I was always slow at it. My teachers were very kind and patient, though."
        ask: tom
        by: emma
        phrases: ["Yes, mostly.", "I was always slow at…", "…, though."]
      - q: "Were you a naughty child?"
        a: "Sometimes! Once, I hid my sister's school bag before an exam, as a joke. She was really angry, and my parents didn't let me watch TV for a week."
        ask: emma
        by: tom
        phrases: ["Sometimes!", "as a joke", "didn't let me…"]
      - q: "What did you want to be when you were a child?"
        a: "I wanted to be a vet, because I loved animals. We had two dogs and a cat. But in the end, I chose teaching, and I think it was the right choice."
        ask: tom
        by: emma
        phrases: ["I wanted to be…", "in the end", "the right choice"]
      - q: "Do you think children today have a better childhood than you did?"
        a: "In some ways, yes. They have more toys and more information. But they spend a lot of time on screens, and they don't play outside as much as we did."
        ask: emma
        by: tom
        phrases: ["In some ways, yes.", "on screens", "as much as we did"]
