        vi: "Mỗi dòng có một cụm sai. Tra từ điển và gạch đi. Tạm dừng video và làm."
        pause: 1.5
      - tom: "One: have. We can say have success, have an influence on something, and have a few difficulties. But not have an achievement."
        focus: 0
        vi: "have success, have an influence on, have a few difficulties — nhưng không nói have an achievement."
      - emma: "Right. We make an achievement, or we achieve something."
        focus: 0
        vi: "Đúng — ta nói make an achievement hoặc achieve something."
      - tom: "Two: achieve. Achieve an ambition, achieve a lot in life, achieve a great deal. But not achieve a difficulty."
        focus: 1
