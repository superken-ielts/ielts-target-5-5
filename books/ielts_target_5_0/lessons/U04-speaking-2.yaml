      - {tom: "In some ways, yes. A good education gives you more choices and more knowledge. But my mother left school at sixteen, and she has achieved a lot.", reveal: 2}
      - {emma: "Do you have to make money to be successful?", focus: 3, pause: 1.5}
      - {tom: "I don't think so. Nurses and teachers don't earn much, but they help a lot of people. For me, that's real success.", reveal: 3}
      - emma: "Notice how Tom starts: I think, in my opinion, in some ways, I don't think so. Then he gives a reason and an example. That's a full answer in part 3."
