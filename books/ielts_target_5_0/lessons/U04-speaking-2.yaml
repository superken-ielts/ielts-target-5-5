  - kind: qa
    chapter: "Speaking 3B: trả lời mẫu"
    heading: "Speaking 3B · Answer the questions"
    heading_vi: "Emma hỏi, Tom trả lời: ý kiến + lý do + ví dụ — tạm dừng video và tự trả lời trước"
    items:
      - q: "Are people born to achieve, or do they learn to achieve?"
        a: "I think it's a bit of both. Some people are born with a talent, but they still need to learn and practise. For example, a talented footballer has to train every day."
        phrases: ["a bit of both", "are born with a talent"]
        vi: "Cả hai: có năng khiếu bẩm sinh nhưng vẫn phải học, luyện tập."
      - q: "Why are some people better achievers than others?"
        a: "In my opinion, it's mostly about attitude. Good achievers set clear goals, and they don't give up when they have difficulties."
        phrases: ["In my opinion", "set clear goals", "don't give up"]
        vi: "Chủ yếu do thái độ: đặt mục tiêu rõ ràng và không bỏ cuộc."
      - q: "Is it easier for people to achieve if they have a good education?"
        a: "In some ways, yes. A good education gives you more choices and more knowledge. But my mother left school at sixteen, and she has achieved a lot."
        phrases: ["In some ways", "gives you more choices"]
        vi: "Ở một mức độ nào đó thì đúng, nhưng mẹ mình bỏ học năm 16 tuổi mà vẫn thành công."
      - q: "Do you have to make money to be successful?"
        a: "I don't think so. Nurses and teachers don't earn much, but they help a lot of people. For me, that's real success."
        phrases: ["I don't think so", "real success"]
        vi: "Không: y tá, giáo viên không kiếm nhiều tiền nhưng giúp được nhiều người — đó mới là thành công thật."
