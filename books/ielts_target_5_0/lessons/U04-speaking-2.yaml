  - kind: letter
    chapter: "Bài nói mẫu Phần 2"
    heading: "Tom's talk · Who do you know who has achieved something special?"
    heading_vi: "Mỗi ý trên thẻ một đoạn — present perfect cho thành tựu vẫn còn, past simple cho chuyện đã qua"
    roles: {tom: candidate}
    words: 168
    items:
      - text: "I'd like to talk about my mother. She has a small flower shop in Da Lat, the city where I grew up."
        note: "who the person is"
      - text: "She has run her own business for more than twenty years. Now she has three members of staff, and she sends flowers to shops in Ho Chi Minh City."
        note: "what she has achieved"
      - text: "I think this is special because she started with almost nothing. She had no money, so she sold flowers from a small table at the market. She worked from five in the morning, and she overcame a lot of difficulties."
        note: "why it is special"
      - text: "Her achievement has had a big influence on me. She has taught me to work hard and never give up. She has also helped other women in our neighbourhood to start their own small businesses."
        note: "how it has influenced other people"
    lines:
      - emma: "Now listen to Tom's talk. He talks for about one and a half minutes."
        vi: "Nghe bài nói của Tom, khoảng một phút rưỡi."
      - {read: tom, focus: 0, say: "I'd like to talk about my mother. She has a small flower shop in Dah Lot, the city where I grew up."}
      - {read: tom, focus: 1}
      - {read: tom, focus: 2}
      - {read: tom, focus: 3}
      - emma: "Very good. Tom uses the present perfect for things that are still true: she has run her business for twenty years. And the past simple for the start: she started with nothing, she overcame difficulties."
        say: "Very good. Tom yoozes the present perfect for things that are still true: she has run her business for twenty years. And the past simple for the start: she started with nothing, she overcame difficulties."
        vi: "Present perfect cho điều vẫn còn đúng (has run, has taught); past simple cho chuyện đã qua (started, overcame)."

