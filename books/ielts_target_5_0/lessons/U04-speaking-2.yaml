        vi: "Không có audio Track 40 — Emma đọc. Trước hết là dạng rút gọn."
      - {emma: "I've achieved a lot this year.", focus: 0, vi: "I've = I have"}
      - {emma: "He's overcome many difficulties.", focus: 1, vi: "He's = He has (không phải He is!)"}
      - emma: "Careful: here he's means he has, not he is. He has overcome."
        focus: 1
        vi: "Chú ý: He's ở đây = He has."
      - {emma: "Now the negative forms, haven't and hasn't. I haven't achieved what I wanted to.", focus: 2}
      - {emma: "She hasn't done everything yet.", focus: 3}
      - {emma: "Now listen to have you, has he and has she in questions. Have you achieved all that you hoped?", focus: 4}
      - {emma: "Has he done what he wanted to do?", focus: 5}
      - {emma: "Has she been successful?", focus: 6}
      - emma: "In fast speech, have you sounds like havyou, and the h in he almost disappears: has he sounds like hazee. Pause the video and practise saying all the sentences."
        say: "In fast speech, have you sounds like havyou, and the H in he almost disappears: has he sounds like hazee. Pause the video and practise saying all the sentences."
        focus: 5
        vi: "Nói nhanh: have you nghe như /hævjuː/, has he nghe như /hæziː/ (âm h gần như mất). Tạm dừng video, luyện đọc cả bảy câu."
        pause: 1.5

