    lines:
      - {lecturer: "So, now I'm going to show an example of a mind map, and I hope it will make clear what I've been saying. Let me just switch on the projector. OK, here we are."}
      - {lecturer: "Now, this is a mind map for time management. A mind map designed to help you manage your time better, and see where you are wasting time and where you could save time. Remember, this is only a very simple example. Your mind maps can be bigger.", focus: 9}
      - {lecturer: "Now, first, you need to write the topic in large letters in the middle of your page. In this case, time management. Put a circle or a box around it, if you like.", focus: 9}
      - {lecturer: "Then, draw lines out to the main subheadings, the main points that you want to consider as parts of the topic. In this case, the major subheadings are red. Put general ideas on the left."}
      - {lecturer: "In this case, there are three general points that the author wants to keep in mind. Assessing time: how much time he has.", focus: 8}
      - {lecturer: "Personal performance. By personal performance, he means how well he thinks he uses his time.", focus: 3}
      - {lecturer: "And wasting time: how much of his time he thinks he uses badly, how much of his time is wasted.", focus: 5}
      - {lecturer: "Above the main heading, the author thinks about having more time, and how perhaps he could have more time. His mind map has branched out, and he puts examples of having more time in another colour. In this case, blue."}
      - {lecturer: "He thinks about two ways that he could have more time. Firstly, delegating, and secondly, getting up earlier. Of course, if you get up earlier, the day is longer and you have more time!", focus: 1}
      - {lecturer: "Above delegating, he gives an example of how he could delegate. He makes this another subheading and uses another colour, this time green.", say: "Above delegating, he gives an example of how he could delegate. He makes this another subheading and yoozes another colour, this time green.", focus: 0}
      - {lecturer: "When he looks back at his mind map, he will see that one way that he could delegate is to get other people to do more around the office. Perhaps he does too much himself at the moment.", focus: 0}
      - {lecturer: "Now, on the right, the author thinks about how he can use time more effectively. Note again that this is one of his main subheadings, so it is written in red. As subheadings of that, he gives examples of how he could use time more effectively.", say: "Now, on the right, the author thinks about how he can yooz time more effectively. Note again that this is one of his main subheadings, so it is written in red. As subheadings of that, he gives examples of how he could yooz time more effectively.", focus: 4}
      - {lecturer: "At the bottom, he thinks about prioritizing, and then he gives two examples of how he wants to prioritize. Firstly, he explains what he means by prioritize. He must decide what is most important.", focus: 6}
      - {lecturer: "Then, he notes how he can prioritize: by setting goals. The mind map will help him to remember that he must always have a clear idea of what is important, and that by setting goals, he can achieve more.", focus: 7}
      - {lecturer: "Finally, he decides that planning is important, and that is another subheading. He notes that keeping a diary is a good way to plan ahead, and so use time more effectively.", say: "Finally, he decides that planning is important, and that is another subheading. He notes that keeping a diary is a good way to plan ahead, and so yooz time more effectively.", focus: 2}
      - {lecturer: "Perhaps he doesn't keep one at the moment, but he will start keeping one now he has his mind map.", focus: 2}
      - {lecturer: "Now, as I say, the author will probably add more ideas. Each time you review a mind map, you can add points or delete them. Of course, time management is only one area in which mind-mapping can be a help."}
      - emma: "Pause the video and complete your answers."
        pause: 1.5

