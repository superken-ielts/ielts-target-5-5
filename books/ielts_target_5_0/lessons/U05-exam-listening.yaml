    heading: "Listening A · Questions 1–6: answers"
    heading_vi: "Tất cả đáp án hiện cùng lúc, rồi câu trong bài nói"
    items: *q16
    lines:
      - emma: "Here are all the answers."
        reveal: ["1", "2", "3", "4", "5", "6"]
        vi: "Đây là toàn bộ đáp án."
      - {emma: "One: more clearly. A technique that helps you to think more clearly.", focus: 0}
      - {emma: "Two: problems. It encourages you to solve problems creatively. In a creative way means creatively.", focus: 1, vi: "creatively = in a creative way (cách nói khác)"}
      - {emma: "Three: fit together. See how those parts fit together.", focus: 2}
      - {emma: "Four: note-taking. Conventional note-taking means listing points on a page.", focus: 3}
      - {emma: "Five: important. It's easier to see what's important.", focus: 4}
      - {emma: "Six: review. They are more compact, and that helps you to go back and review. Go back and review is four words, so write review.", focus: 5, vi: "go back and review là bốn từ — chỉ viết review."}

