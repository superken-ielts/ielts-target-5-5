  - kind: blanks
    chapter: "Câu 1–6: nghe"
    heading: "Listening A · Questions 1–6: listen"
    heading_vi: "Nghe phần đầu bài nói — viết đáp án khi nghe"
    hide_text: true
    items: *q16
    lines:
      - {lecturer: "Good morning. I'm really pleased that so many of you are here. I know you are all busy."}
      - {lecturer: "In some ways, that is what I'm going to talk about today. Managing time, so that you feel more is getting done, that you are achieving more."}
      - {lecturer: "I'm sure you have all heard something about mind-mapping, but most people I meet don't really know much about it."}
      - {lecturer: "Mind-mapping is really a technique that helps you to think more clearly.", focus: 0}
      - {lecturer: "It improves the way you solve problems, and encourages you to solve problems creatively.", focus: 1}
      - {lecturer: "Mind maps help you to understand the various parts of a topic or subject, and to then see how those parts fit together.", focus: 2}
      - {lecturer: "The way you write down your ideas on a mind map means that information is easy to retrieve and to review.", focus: 2}
      - {lecturer: "So, how is mind-mapping different from conventional note-taking? By conventional note-taking, I mean simply listing points on a page, as you probably do now.", focus: 3}
      - {lecturer: "Well, mind maps are more two-dimensional. They allow you to see the shape of a topic, and make it easier to see what's important.", focus: 4}
      - {lecturer: "Mind maps generally fit on a single side of paper. They are more compact, and that also helps you to go back and review.", focus: 5}
      - emma: "Pause the video and complete your answers."
        pause: 1.5

