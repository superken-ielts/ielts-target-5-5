  - kind: qa
    chapter: "Thi thử 4 · Phần 3"
    heading: "Mock test 4 · Part 3 · Discussion (Emma asks Tom)"
    heading_vi: "Phần 3 — học suốt đời: ý kiến + lý do + ví dụ"
    roles: {emma: examiner, tom: candidate}
    items:
      - q: "Why do many adults go back to studying?"
        a: "Some adults need new skills for their jobs, because technology changes so quickly. Others just want to learn something they enjoy, like painting or a new language."
        phrases: ["Some…, Others…", "changes so quickly", "something they enjoy"]
      - q: "Is it ever too late to learn something new?"
        a: "No, I don't think so. My grandfather learned to use a smartphone at seventy-five, and now he sends me messages every day! It just takes more time and patience."
        phrases: ["No, I don't think so.", "learned to… at…", "It just takes…"]
