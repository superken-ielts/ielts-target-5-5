  - kind: qa
    heading: "Mock test 4 · Part 3 · Discussion (Tom asks Emma)"
    heading_vi: "Đổi vai — Tom hỏi, Emma trả lời"
    roles: {tom: examiner, emma: candidate}
    items:
      - q: "Will online learning replace teachers in the future?"
        a: "I hope not! Online courses are useful, but a good teacher does more than explain facts. They notice when you're confused or worried, and they encourage you to keep going."
        ask: tom
        by: emma
        phrases: ["I hope not!", "does more than…", "encourage you to keep going"]
      - q: "Should university education be free?"
        a: "In an ideal world, yes, because education helps the whole country. But someone has to pay for it. Maybe the government could pay for students from poor families, and others could pay a small fee."
        ask: tom
        by: emma
        phrases: ["In an ideal world…", "someone has to pay for it", "Maybe… could…"]
