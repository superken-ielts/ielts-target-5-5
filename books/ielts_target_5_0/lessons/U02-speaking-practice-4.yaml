  - kind: qa
    chapter: "Hỏi qua lại: đại học, khóa học"
    heading: "Tom and Emma ask each other · University and courses"
    heading_vi: "Đại học và khóa học — kể lại (quá khứ đơn) và nói dự định (I'd like to…, I want to…)"
    items:
      - q: "Emma, what did you study at university?"
        a: "English Literature. I spent three years reading novels and writing essays about them. It was hard work, but it was the perfect subject for me."
        ask: tom
        by: emma
        phrases: ["I spent three years + -ing", "It was hard work, but…", "the perfect subject"]
      - q: "What do you like most about university life, Tom?"
        a: "The freedom. At school, the teachers told us what to do all day. At university, I plan my own time, and I can join clubs, like the basketball team."
        ask: emma
        by: tom
        phrases: ["The freedom.", "told us what to do", "I plan my own time"]
      - q: "Was it difficult to live away from home?"
        a: "A little, at first. I missed my mum's cooking, and I didn't know how to manage my money. But I made great friends in the first week, and that helped a lot."
        ask: tom
        by: emma
        phrases: ["A little, at first.", "I missed…", "that helped a lot"]
      - q: "Would you like to do a master's degree one day?"
        a: "Yes, I'd like to study abroad, maybe in Australia. But first, I want to work for a few years and get some real experience."
        ask: emma
        by: tom
        phrases: ["I'd like to study abroad", "But first…", "real experience"]
      - q: "Have you taken any courses since you came to Vietnam?"
        a: "Yes, a Vietnamese cooking class. It was only four Saturday mornings, but I learned to make spring rolls and dipping sauce. Now my friends ask me to cook for every party!"
        ask: tom
        by: emma
        phrases: ["It was only…", "I learned to make…", "for every party"]
      - q: "Do you go to the library often?"
        a: "Yes, almost every day. Our library is new, and it has comfortable chairs and fast internet. I go there to study with my friends, especially before exams."
        ask: emma
        by: tom
        phrases: ["almost every day", "comfortable chairs", "especially before exams"]
      - q: "Is there a course you'd like to take in the future?"
        a: "Yes, a guitar course. I've wanted to play for years, and my brother says he'll teach me some songs if I learn the basics first."
        ask: tom
        by: emma
        phrases: ["I've wanted to… for years", "the basics", "if I learn…"]
      - q: "Do you think everyone should go to university?"
        a: "No, I don't think so. University is great for some jobs, but many people learn better by doing. A good chef or mechanic can earn more than some graduates."
        ask: emma
        by: tom
        phrases: ["No, I don't think so.", "learn better by doing", "earn more than…"]
