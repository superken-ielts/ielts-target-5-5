  - kind: qa
    chapter: "Hỏi qua lại: học với công nghệ"
    heading: "Tom and Emma ask each other · Learning with technology"
    heading_vi: "Học với công nghệ — ứng dụng, video, học trực tuyến: so sánh, nêu ưu và nhược"
    items:
      - q: "Do you use any apps to learn languages, Emma?"
        a: "Yes, I use a flashcard app for Vietnamese words. I do ten minutes every morning with my coffee. It's short, but it really helps."
        ask: tom
        by: emma
        phrases: ["a flashcard app", "ten minutes every morning", "it really helps"]
      - q: "Do you watch videos to learn things?"
        a: "All the time! Last month, I learned to fix my bike from a video. And I watch short videos about English grammar before I go to sleep."
        ask: emma
        by: tom
        phrases: ["All the time!", "I learned to… from…", "before I go to sleep"]
      - q: "Do you prefer paper books or e-books?"
        a: "Paper books, definitely. I love the smell of a new book, and I like writing notes in the margins. But e-books are great for travelling, because they're so light."
        ask: tom
        by: emma
        phrases: ["…, definitely.", "writing notes in…", "great for travelling"]
      - q: "Have you ever studied online?"
        a: "Yes, in my first year, some of our classes were online. It was convenient, but it was hard to concentrate at home, and I missed my classmates."
        ask: emma
        by: tom
        phrases: ["It was convenient, but…", "hard to concentrate", "I missed…"]
      - q: "Should children use computers at primary school?"
        a: "Yes, but only a little. Children need to learn basic computer skills. But they also need to learn handwriting, and to play and talk with real people."
        ask: tom
        by: emma
        phrases: ["Yes, but only a little.", "basic computer skills", "real people"]
      - q: "Do you think technology makes students lazy?"
        a: "Sometimes. It's easy to copy answers from the internet. But if you use it well, technology can make learning faster and more interesting."
        ask: emma
        by: tom
        phrases: ["Sometimes.", "copy answers from…", "if you use it well"]
