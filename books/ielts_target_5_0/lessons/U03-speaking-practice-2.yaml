        a: "Good evening. My full name is Emma Louise Clarke."
        ask: tom
        by: emma
        phrases: ["My full name is…"]
      - q: "What do you like most about your job?"
        a: "My students. Most of them are adults who work all day, and then come to class in the evening. They're tired, but they work so hard. It's really rewarding."
        ask: tom
        by: emma
        phrases: ["Most of them are…", "work so hard", "really rewarding"]
      - q: "Is there anything you don't like about it?"
        a: "The hours, sometimes. I teach until nine at night, and on Saturday mornings, so I don't see my friends very often."
        ask: tom
        by: emma
        phrases: ["…, sometimes.", "until nine at night", "not very often"]
      - q: "Did you do any other jobs before you became a teacher?"
