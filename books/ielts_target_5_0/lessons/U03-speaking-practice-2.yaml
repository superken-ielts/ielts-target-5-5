  - kind: qa
    chapter: "Hỏi qua lại: xin việc, phỏng vấn"
    heading: "Tom and Emma ask each other · Applying for jobs and interviews"
    heading_vi: "Xin việc và phỏng vấn — past experience, personal qualities, lời khuyên"
    items:
      - q: "Have you ever had a job interview, Emma?"
        a: "Yes, quite a few. My interview for this school was online, because I was still in England. I was so nervous, because the internet kept stopping!"
        ask: tom
        by: emma
        phrases: ["quite a few", "was online", "kept stopping"]
      - q: "How do you prepare for a job interview?"
        a: "I read about the company, and I practise answers to common questions, like: what are your strengths? I also choose my clothes the night before."
        ask: emma
        by: tom
        phrases: ["I read about…", "common questions", "the night before"]
      - q: "What should you wear to an interview?"
        a: "Something smart and comfortable. For an office job, a shirt and dark trousers are usually fine. The most important thing is to look clean and tidy."
        ask: tom
        by: emma
        phrases: ["smart and comfortable", "usually fine", "clean and tidy"]
      - q: "What questions do interviewers usually ask?"
        a: "They ask about your past experience, your personal qualities, and why you want the job. Sometimes they ask strange questions, like: if you were an animal, what would you be?"
        ask: emma
        by: tom
        phrases: ["past experience", "personal qualities", "if you were…, what would…?"]
      - q: "What's the most important thing in an interview?"
        a: "Being yourself. Smile, listen carefully, and give real examples. Interviewers can tell when you're just repeating answers from the internet."
        ask: tom
        by: emma
        phrases: ["Being yourself.", "give real examples", "can tell when…"]
      - q: "Is the CV or the interview more important?"
        a: "The interview, I think. A good CV gets you into the room, but in the interview the company sees your personality, and hears your English."
        ask: emma
        by: tom
        phrases: ["…, I think.", "gets you into the room", "your personality"]
      - q: "Should you ask questions at the end of an interview?"
        a: "Yes, always. It shows that you're interested. For example, you can ask about training, or what a normal day in the job looks like."
        ask: tom
        by: emma
        phrases: ["Yes, always.", "It shows that…", "what a normal day… looks like"]
      - q: "How do you feel after an interview?"
        a: "Usually tired, but relieved. I think about everything I said, and what I could say better next time. Then I try to forget it until they call me."
        ask: emma
        by: tom
        phrases: ["tired, but relieved", "better next time", "until they call me"]
