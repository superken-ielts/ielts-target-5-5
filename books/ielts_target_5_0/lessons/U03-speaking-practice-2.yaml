  - kind: qa
    chapter: "Hỏi qua lại: đồng nghiệp, sếp"
    heading: "Tom and Emma ask each other · Colleagues and bosses"
    heading_vi: "Đồng nghiệp và sếp — tả người, nêu ý kiến; I'd… cho tình huống giả định"
    items:
      - q: "Emma, what are your colleagues like?"
        a: "They're great. There are twelve teachers at my school, from five different countries. We often go for dinner together after our evening classes."
        ask: tom
        by: emma
        phrases: ["They're great.", "from five different countries", "go for dinner together"]
      - q: "Do you get on well with the people you work with, Tom?"
        a: "Yes, really well. Most of them are students like me, so we have a lot in common. When it's busy, we help each other."
        ask: emma
        by: tom
        phrases: ["get on well with", "have a lot in common", "help each other"]
      - q: "What makes a good boss?"
        a: "A good boss listens to the staff, and gives clear instructions. My director never shouts. When we make a mistake, she helps us to fix it."
        ask: tom
        by: emma
        phrases: ["listens to the staff", "clear instructions", "never shouts"]
      - q: "What's your manager like?"
        a: "She's strict but fair. She wants everything to be perfect, but she always says thank you at the end of the evening, and she remembers everyone's birthday."
        ask: emma
        by: tom
        phrases: ["strict but fair", "says thank you", "remembers everyone's birthday"]
      - q: "Would you prefer to work alone or in a team?"
        a: "In a team, definitely. I get my best ideas when I talk to other people. Working alone all day would be too quiet for me."
        ask: tom
        by: emma
        phrases: ["…, definitely.", "I get my best ideas when…", "would be too quiet"]
      - q: "Have you ever had a problem with a colleague?"
        a: "Once. A colleague always arrived late, so I had to do his work too. In the end, I talked to him politely, and now he's always on time."
        ask: emma
        by: tom
        phrases: ["Once.", "In the end…", "talked to him politely"]
      - q: "Is it a good idea to be friends with your boss?"
        a: "It can be difficult. It's nice to have a friendly relationship, but the boss has to make decisions about everyone. Being too close can cause problems."
        ask: tom
        by: emma
        phrases: ["It can be difficult.", "a friendly relationship", "cause problems"]
      - q: "What would you do if a colleague took your idea?"
        a: "I'd talk to them first, calmly. If it happened again, I'd speak to my manager. I think it's important to say something, and not just stay angry."
        ask: emma
        by: tom
        phrases: ["I'd talk to them first", "If it happened again, I'd…", "not just stay angry"]
