  - kind: qa
    chapter: "Thi thử 2 · Phần 3"
    heading: "Mock test 2 · Part 3 · Discussion"
    heading_vi: "Phần 3 — nghề nghiệp nói chung: ý kiến + lý do + ví dụ"
    roles: {tom: examiner, emma: candidate}
    items:
      - q: "What makes a job interesting?"
        a: "Variety, I think. If every day is different, and you keep learning new things, you don't get bored. Working with interesting people helps too."
        ask: tom
        by: emma
        phrases: ["Variety, I think.", "keep learning new things", "helps too"]
      - q: "Is salary the most important thing when people choose a job?"
        a: "For many people, yes, especially when they have a family to support. But I think people are happier when they enjoy their work and feel useful."
        ask: tom
        by: emma
        phrases: ["For many people, yes", "a family to support", "feel useful"]
      - q: "Will robots and computers do many of our jobs in the future?"
        a: "Some jobs, yes, especially repetitive ones, like work in a factory. But jobs that need creativity or care, like teaching or nursing, will still need real people."
        ask: tom
        by: emma
        phrases: ["Some jobs, yes", "repetitive ones", "will still need…"]
      - q: "Is it better to stay in one job for a long time, or to change jobs often?"
        a: "It depends on the person. Staying in one company can lead to promotion, and it feels secure. But changing jobs helps you to learn new skills and meet new people."
