  - kind: qa
    chapter: "Thi thử 2 · Phần 1"
    heading: "Mock test 2 · Part 1 · Introduction and interview"
    heading_vi: "Thi thử Phần 1 — đổi vai: Tom hỏi, Emma trả lời"
    roles: {tom: examiner, emma: candidate}
