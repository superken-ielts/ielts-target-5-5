        ask: tom
        by: emma
        phrases: ["After university…", "boring and repetitive", "I've never looked back"]
      - q: "What jobs are popular with young people in England?"
        a: "Jobs in technology and in the media are very popular. A lot of young people also want to work for themselves, for example as designers, or by selling things online."
        ask: tom
        by: emma
        phrases: ["very popular", "work for themselves", "selling things online"]
      - q: "Which jobs are well respected in your country?"
        a: "Doctors, nurses and firefighters, because they help people in difficult situations. Teachers are respected too, but I don't think they're paid enough!"
        ask: tom
        by: emma
        phrases: ["in difficult situations", "respected too", "paid enough"]
      - q: "Would you like to change your job in the future?"
        a: "Not really. I love teaching. But one day, I'd like to open my own small language school, back in my hometown."
        ask: tom
        by: emma
        phrases: ["Not really.", "But one day…", "my own small…"]
