    lines:
      - {emma: "Pause the video and check your answers. Then listen to Tom.", vi: "Tạm dừng video, xem lại đáp án rồi nghe Tom.", pause: 1.5}
      - tom: "One is c, getting what you want. He says: achievement is simply accomplishing goals that you set for yourself, doing what you planned to do."
        say: "One is C, getting what you want. He says: achievement is simply accomplishing goals that you set for yourself, doing what you planned to do."
        focus: 0
        vi: "1 c: thành tựu là hoàn thành mục tiêu mình tự đặt ra."
      - emma: "And not a: he says achievement certainly doesn't have to mean making money."
        say: "And not eigh: he says achievement certainly doesn't have to mean making money."
        focus: 0
        vi: "Không phải a: thành tựu không nhất thiết là kiếm tiền."
      - tom: "Two is b. To achieve, you must have belief, belief that you can do whatever it is you want to do."
        say: "Two is B. To achieve, you must have belief, belief that you can do whatever it is you want to do."
        focus: 1
        vi: "2 b: phải có niềm tin rằng mình làm được."
      - emma: "Not a: he says there is more to achievement than simply wanting to do something."
        say: "Not eigh: he says there is more to achievement than simply wanting to do something."
        focus: 1
        vi: "Không phải a: chỉ muốn thôi thì chưa đủ."
      - tom: "Three is a. Setting goals helps you to be clear about what you really want, and to see what's important."
        say: "Three is eigh. Setting goals helps you to be clear about what you really want, and to see what's important."
        focus: 2
        vi: "3 a: giúp bạn hiểu rõ điều thật sự quan trọng."
      - emma: "Option c is a trap. Business and athletes are in the talk: all achievers set goals, high-flyers in business or successful athletes. But that's not what goals will do for you."
        say: "Option C is a trap. Business and athletes are in the talk: all achievers set goals, high-flyers in business or successful athletes. But that's not what goals will do for you."
        focus: 2
        vi: "c là bẫy: có nhắc business và athletes, nhưng không nói mục tiêu giúp bạn thành công trong kinh doanh."
      - tom: "Four is b, planning a long way ahead. Think about what you want in the next fifteen or twenty years."
        say: "Four is B, planning a long way ahead. Think about what you want in the next fifteen or twenty years."
        focus: 3
        vi: "4 b: nghĩ về 15–20 năm tới = lên kế hoạch dài hạn."

