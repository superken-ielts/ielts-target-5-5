        say: "Exercise B. For questions one to four, choose the correct letter: eigh, B, or C. First, read the questions. Pause the video and underline the key words."
        vi: "Bài B, câu 1–4: chọn a, b hoặc c. Đọc câu hỏi trước, gạch từ khóa. Tạm dừng video."
