scenes:
  - kind: title
    chapter: "Giới thiệu"
    lines:
      - emma: "Welcome to Listening 3: practise predicting and paraphrasing. You'll hear a talk about how setting goals can help you achieve more."
        say: "Welcome to Listening three: practise predicting and paraphrasing. You'll hear a talk about how setting goals can help you achieve more."
        vi: "Listening 3: nghe một bài nói về việc đặt mục tiêu giúp bạn đạt được nhiều hơn."
      - emma: "Exercise A. Set goals: to decide what you want to achieve. For example, my goal is to run five kilometres by June."
        say: "Exercise eigh. Set goals: to decide what you want to achieve. For example, my goal is to run five kilometres by June."
        vi: "set goals = đặt mục tiêu, quyết định điều mình muốn đạt được."
      - tom: "I've set a goal too: five point five in IELTS, in December!"
        say: "I've set a goal too: five point five in eye-elts, in December!"
        vi: "Mình cũng đặt mục tiêu rồi: 5.5 IELTS vào tháng 12!"

