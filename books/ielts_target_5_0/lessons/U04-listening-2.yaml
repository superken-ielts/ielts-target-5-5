      - {emma: "One: achievement means making money, the same thing to everyone, or getting what you want.", focus: 0}
      - {emma: "Two: to achieve something, you must really want it, believe that getting it is possible, or talk about it a lot.", focus: 1}
      - {emma: "Three: setting goals will help you understand what is really important to you, stop you worrying, or help you do well in business or sport.", focus: 2}
      - {emma: "Four: the big picture means setting short-term goals, planning a long way ahead, or one important area of your life.", focus: 3}
