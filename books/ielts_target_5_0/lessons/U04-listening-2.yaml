        focus: 6
        vi: "10 c: làm người xung quanh vui là quan trọng, nhưng phải tập trung vào điều mình muốn."
      - emma: "Listen for the word but. The idea after but is the speaker's main point. That's why the answer is c, not a."
        say: "Listen for the word but. The idea after but is the speaker's main point. That's why the answer is C, not eigh."
        focus: 6
        vi: "Chú ý chữ but: ý sau but mới là ý chính — nên đáp án là c, không phải a."

