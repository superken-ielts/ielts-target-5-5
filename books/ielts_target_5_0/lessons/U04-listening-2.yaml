    chapter: "Câu 1–4: đọc trước, đoán trước"
    heading: "Listening 3B · Questions 1–4: read and predict"
    heading_vi: "Câu hỏi tr. 49 — đọc trước, gạch từ khóa, đoán ý người nói"
