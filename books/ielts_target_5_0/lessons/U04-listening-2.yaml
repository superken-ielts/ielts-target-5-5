  - kind: figure
    chapter: "Đáp án 1–4"
    heading: "Listening 3B · Answers 1–4: 1 c · 2 b · 3 a · 4 b"
    heading_vi: "Khung đỏ là đáp án đúng — nghe lời giải thích và câu bằng chứng"
    image: {pdf: course-book, page: 50, clip: [58, 210, 445, 402]}
