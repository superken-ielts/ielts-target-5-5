  - kind: qa
    chapter: "Hỏi qua lại: làm việc ở nhà"
    heading: "Tom and Emma ask each other · Working from home"
    heading_vi: "Làm việc ở nhà — ưu và nhược; could / would cho điều giả định"
    items:
      - q: "Emma, have you ever worked from home?"
        a: "Yes, I taught online for a few months, when my school was closed for repairs. It was convenient, but I missed seeing my students in person."
        ask: tom
        by: emma
        phrases: ["for a few months", "It was convenient, but…", "in person"]
      - q: "Would you like to work from home in the future, Tom?"
        a: "Maybe two days a week. I could save time and money on travel. But I'd go crazy if I stayed at home every day, because I like being around people."
        ask: emma
        by: tom
        phrases: ["Maybe two days a week", "save time and money", "I'd go crazy if…"]
      - q: "What are the advantages of working from home?"
        a: "You don't have to travel, so you save a lot of time. You can also wear comfortable clothes, and make your own lunch!"
        ask: tom
        by: emma
        phrases: ["You don't have to…", "save a lot of time", "make your own lunch"]
      - q: "And what are the disadvantages?"
        a: "It's easy to feel lonely, and it's hard to stop working at the end of the day, because your office is also your home."
        ask: emma
        by: tom
        phrases: ["easy to feel lonely", "hard to stop + -ing", "your office is also your home"]
      - q: "What do you need to work well at home?"
        a: "A quiet room, a comfortable chair and a fast internet connection. And a lot of self-discipline, because the sofa is always calling you!"
        ask: tom
        by: emma
        phrases: ["a fast internet connection", "self-discipline", "is always calling you"]
      - q: "Do many people in Vietnam work from home?"
        a: "More than before, especially in technology and design. But most companies still prefer people to come to the office, so they can work together face to face."
        ask: emma
        by: tom
        phrases: ["More than before", "especially in…", "face to face"]
      - q: "Could you teach online all the time?"
        a: "I could, but I wouldn't enjoy it. A lot of teaching happens in small moments, like a joke or a smile, and that's harder on a screen."
        ask: tom
        by: emma
        phrases: ["I could, but I wouldn't…", "small moments", "harder on a screen"]
      - q: "How do you stay focused when you study at home?"
        a: "I don't, really! That's why I study in the library. At home, there's always something more fun to do."
        ask: emma
        by: tom
        phrases: ["I don't, really!", "That's why…", "something more fun to do"]
