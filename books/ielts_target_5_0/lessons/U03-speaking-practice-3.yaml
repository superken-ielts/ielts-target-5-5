  - kind: qa
    chapter: "Hỏi qua lại: giờ làm, đi làm"
    heading: "Tom and Emma ask each other · Working hours and getting to work"
    heading_vi: "Giờ làm và đi làm — thói quen dùng hiện tại đơn, giờ giấc, thời gian"
    items:
      - q: "Tom, how do you get to work?"
        a: "On foot. The coffee shop is only ten minutes from my flat, so I walk there after my classes. It's great, because I don't have to worry about the traffic."
        ask: emma
        by: tom
        phrases: ["On foot.", "only ten minutes from…", "worry about the traffic"]
      - q: "And how do you get to your school, Emma?"
        a: "Usually by motorbike taxi. It takes about twenty minutes. In the rainy season, I take the bus, and then it can take an hour!"
        ask: tom
        by: emma
        phrases: ["Usually by…", "It takes about…", "it can take an hour"]
      - q: "What time do you usually start and finish work?"
        a: "I start at six in the evening, and I finish at ten. Then I have to clean the tables, so I'm usually home by half past ten."
        ask: emma
        by: tom
        phrases: ["I start at…", "I finish at…", "home by half past ten"]
      - q: "Do you think you work too many hours?"
        a: "Sometimes, yes. I teach about twenty-five hours a week, but I also prepare lessons and mark homework at home. So it's more like forty hours in total."
        ask: tom
        by: emma
        phrases: ["Sometimes, yes.", "mark homework", "in total"]
      - q: "Do you prefer working in the morning or in the evening?"
        a: "In the evening, because my classes are in the morning. And to be honest, I'm not a morning person! I need two coffees before I can talk to anyone."
        ask: emma
        by: tom
        phrases: ["to be honest", "not a morning person", "before I can…"]
      - q: "How do you relax after a long day at work?"
        a: "I cook a simple dinner, and then I read a detective story in bed. After ten pages, I'm usually asleep!"
        ask: tom
        by: emma
        phrases: ["a simple dinner", "a detective story", "I'm usually asleep"]
      - q: "Is it important to have a good work-life balance?"
        a: "Yes, very. If you work all the time, you get tired and stressed, and you can't do your job well. Everyone needs time for family, friends and sport."
        ask: emma
        by: tom
        phrases: ["Yes, very.", "tired and stressed", "Everyone needs time for…"]
      - q: "Do people in England usually work long hours?"
        a: "Some do, especially in big cities like London. But most people finish work at five or six, and they have about four weeks of holiday a year."
        ask: tom
        by: emma
        phrases: ["Some do", "especially in…", "four weeks of holiday"]
