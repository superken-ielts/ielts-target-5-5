    heading: "Exam tip · Don't worry about difficult words"
    heading_vi: "Exam tip tr. 61"
    image: {pdf: course-book, page: 62, clip: [56, 556, 445, 600]}
    lines:
      - emma: "Exam tip. Don't worry if you don't know a word you need to label a diagram. You will hear it explained on the recording. Sometimes you need to copy the words onto your answer sheet, but usually you only need to match them with a letter."
