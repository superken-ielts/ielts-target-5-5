    heading: "Listening 2A · Questions 1–6: match the parts of the brain with a–f"
    heading_vi: "Nghe phần đầu của Track 54 — đáp án hiện sau khi nghe xong"
    image: {pdf: course-book, page: 62, clip: [212, 116, 418, 213]}
    items:
      - {n: 1, q: "spinal cord", answer: f}
      - {n: 2, q: "cerebellum", answer: e}
      - {n: 3, q: "pituitary gland", answer: d}
      - {n: 4, q: "brain stem", answer: b}
      - {n: 5, q: "cerebrum", answer: a}
      - {n: 6, q: "thalamus", answer: c}
