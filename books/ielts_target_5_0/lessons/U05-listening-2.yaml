  - kind: blanks
    chapter: "Key vocabulary in context"
    heading: "Key vocabulary in context · function, control, balance, process"
    heading_vi: "Dùng đúng dạng của bốn động từ trong bài nghe — tạm dừng video và làm"
    image: {pdf: course-book, page: 62, clip: [60, 608, 445, 746]}
    items:
