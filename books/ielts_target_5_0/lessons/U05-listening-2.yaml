      - tom: "The brain? I don't know any of those words!"
        vi: "Bộ não à? Mình không biết từ nào về nó cả!"
      - emma: "Don't worry. The lecturer explains them, and the diagram helps you. Read the questions first. All the answers come after the listening."
        vi: "Đừng lo: giảng viên sẽ giải thích, sơ đồ sẽ giúp bạn. Đọc câu hỏi trước; đáp án hiện sau khi nghe."

  - kind: figure
