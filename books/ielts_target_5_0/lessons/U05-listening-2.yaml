      - emma: "Listen to the first part of the lecture, and write the letters."
        vi: "Nghe phần đầu bài giảng và ghi chữ cái."
      - {track: U05-L2A, start: 26.5, end: 110.4, note: "Track 54 · part 1"}
      - emma: "Pause the video and check your letters."
        vi: "Tạm dừng video và kiểm tra lại."
        pause: 1.5
      - emma: "Here are all the answers."
        reveal: ["1", "2", "3", "4", "5", "6"]
        vi: "Đây là toàn bộ đáp án."
      - {emma: "One: the spinal cord is f, at the bottom of the diagram.", say: "One: the spinal cord is F, at the bottom of the diagram.", focus: 0, vi: "spinal cord = tủy sống"}
      - {emma: "Two: the cerebellum is e. The lobe below, coloured yellow.", say: "Two: the cerebellum is ee. The lobe below, coloured yellow.", focus: 1, vi: "cerebellum = tiểu não"}
      - {emma: "Three: the pituitary gland is d. It looks like a little tail.", say: "Three: the pituitary gland is D. It looks like a little tail.", focus: 2, vi: "pituitary gland = tuyến yên"}
      - {emma: "Four: the brain stem is b, running down from the centre of the brain.", say: "Four: the brain stem is B, running down from the centre of the brain.", focus: 3, vi: "brain stem = thân não"}
      - {emma: "Five: the cerebrum is a, by far the largest part of the brain.", say: "Five: the cerebrum is eigh, by far the largest part of the brain.", focus: 4, vi: "cerebrum = đại não"}
      - {emma: "And six: the thalamus is c, right in the centre of the brain.", say: "And six: the thalamus is C, right in the centre of the brain.", focus: 5, vi: "thalamus = đồi thị"}

  - kind: blanks
    chapter: "Câu 7–14: nghe và điền"
    heading: "Listening 2A · Questions 7–14: complete the descriptions (one word only)"
    heading_vi: "Đọc câu trước, rồi nghe phần sau của Track 54 — đáp án hiện sau khi nghe xong"
    items: &l2
      - {n: 7, q: "The cerebrum has ___ hemispheres.", answer: "two"}
      - {n: 8, q: "The cerebrum controls voluntary ___.", answer: "movement"}
      - {n: 9, q: "The cerebellum helps us with balance and our understanding of ___.", answer: "space"}
      - {n: 10, q: "The hypothalamus tells us when we are hungry or thirsty or when we need to ___.", answer: "sleep"}
      - {n: 11, q: "The midbrain sends ___ from the brain to other parts of the nervous system.", answer: "messages"}
      - {n: 12, q: "The medulla oblongata regulates how quickly or slowly our ___ beats.", answer: "heart"}
      - {n: 13, q: "The spinal cord ___ the brain to the rest of our body.", answer: "connects"}
      - {n: 14, q: "Hormones from the pituitary gland regulate how quickly we ___ and how quickly we age.", answer: "grow"}
    lines:
      - emma: "For questions 7 to 14, complete the descriptions. Use one word only for each answer. Pause the video and read the sentences first."
        say: "For questions seven to fourteen, complete the descriptions. Yooz one word only for each answer. Pause the video and read the sentences first."
        vi: "Câu 7–14: hoàn thành mô tả, mỗi chỗ một từ. Tạm dừng video, đọc câu trước."
        pause: 1.5
      - emma: "Now listen to the second part of the lecture."
        vi: "Giờ nghe phần sau của bài giảng."
      - {track: U05-L2A, start: 110.4, end: 269.9, note: "Track 54 · part 2"}
      - emma: "Pause the video and write your answers."
        vi: "Tạm dừng video và viết đáp án."
        pause: 1.5

  - kind: blanks
    chapter: "Câu 7–14: đáp án"
    heading: "Listening 2A–B · Questions 7–14: answers"
    heading_vi: "Tất cả đáp án hiện cùng lúc, rồi câu trong bài nghe — để ý cách nói khác (paraphrase)"
    items: *l2
    lines:
      - emma: "Here are all the answers."
        reveal: ["7", "8", "9", "10", "11", "12", "13", "14"]
        vi: "Đây là toàn bộ đáp án."
      - {emma: "Seven: two. The cerebrum has two halves, or hemispheres.", focus: 0}
      - {emma: "Eight: movement. It controls voluntary movement.", focus: 1}
      - {emma: "Nine: space. It helps us understand where we are in relation to space around us.", focus: 2}
      - {emma: "Ten: sleep. It tells us when we need sleep.", focus: 3}
      - {emma: "Eleven: messages. The midbrain sends messages to other parts of the nervous system.", focus: 4}
      - {emma: "Twelve: heart. The lecturer says the rate of our heartbeat. The question says how quickly our heart beats.", focus: 5, vi: "Câu hỏi nói cách khác: the rate of our heartbeat → how quickly our heart beats."}
      - {emma: "Thirteen: connects. It connects the brain to nerves that go to the rest of the body.", focus: 6}
      - {emma: "And fourteen: grow. How quickly we grow, and the size we grow to.", focus: 7}
      - emma: "Exercise B. Check your answers. How many questions did you answer correctly? Twelve or more is very good."
        vi: "Bài B: bạn đúng bao nhiêu câu? Từ 12 câu trở lên là rất tốt."

