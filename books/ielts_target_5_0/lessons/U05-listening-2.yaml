    heading: "Listening 2A · Look at the diagram before you listen"
    heading_vi: "Đề và sơ đồ tr. 61 — nối sáu phần của não (1–6) với các vị trí a–f"
    image: {pdf: course-book, page: 62, clip: [60, 79, 445, 214]}
    items:
      - {box: [66, 81, 440, 118]}
      - {box: [214, 117, 416, 212]}
      - {box: [78, 121, 180, 203]}
    lines:
      - emma: "Listening 2: practice with diagrams. Exercise A. Listen to the continuation of the lecture about the human brain. For questions 1 to 6, match the parts of the brain 1 to 6 with the parts a to f in the diagram."
        say: "Listening two: practice with diagrams. Exercise eigh. Listen to the continuation of the lecture about the human brain. For questions one to six, match the parts of the brain one to six with the parts eigh to F in the diagram."
        focus: 0
        vi: "Bài A: nghe tiếp bài giảng về bộ não. Câu 1–6: nối sáu phần của não với vị trí a–f trên sơ đồ."
      - emma: "Look at the diagram before you listen. The brain is big and round at the top. In the middle, there are some small parts. At the bottom, there's a long part going down."
        focus: 1
        vi: "Xem sơ đồ trước khi nghe: phần lớn tròn ở trên, vài phần nhỏ ở giữa, một phần dài đi xuống dưới."
      - emma: "Now read the six parts: spinal cord, cerebellum, pituitary gland, brain stem, cerebrum, thalamus. Pause the video and think. Where could they be?"
