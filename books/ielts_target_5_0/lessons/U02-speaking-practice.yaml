# Video luyện nói thêm Unit 2 · Learning — 1/4: thời đi học, môn học và thầy cô + thi thử 1 (Emma giám khảo, Tom thí
# sinh). Người học yêu cầu, không theo trang sách; làm theo khuôn bốn video luyện nói của Unit 1 (đợt 14) ở đợt 24.
# Người học tự tạm dừng video để trả lời, nên không có khoảng lặng chờ (`wait`, `echo`).
# Dựng: cd agents && python -m lesson_video build ../books/ielts_target_5_0/lessons/U02-speaking-practice.yaml
# Cách viết: xem đầu file U01-speaking-1.yaml. Câu trả lời mẫu tự viết bằng ngữ pháp, từ vựng của Unit 2 (quá khứ đơn,
# had to, really enjoyed / keen on / preferred… to… / boring, câu trả lời = trả lời + lý do + chi tiết).
# Thông tin nhân vật: giữ khớp với đầu file U01-speaking-practice.yaml, thêm phần thời đi học dưới đây (giữ khớp ở cả
# bốn video Unit 2 và với câu trả lời mẫu của Tom trong U02-speaking-1):
# - Tom: trường công lớn ở Đà Lạt gần hồ (~2.000 học sinh), đạp xe 15 phút, vào học 7 giờ; đồng phục áo sơ mi trắng,
#   quần xanh; thích Hóa (thầy Nam, vui tính, dạy lớp 10–12, kèm miễn phí sau giờ học), thấy Lịch sử chán, Lý khó; cô
#   dạy Toán nghiêm, bài tập mỗi tối; học tiếng Anh từ 8 tuổi; ông nội kèm Toán ôn thi đại học; thi IELTS tháng 12, cần
#   5.5 để đi trao đổi ở Úc; biết đi xe máy (bố dạy năm 18 tuổi), bơi kém (học năm 12 tuổi), chỉ biết nấu mì và trứng.
# - Emma: trường nhỏ ở thị trấn ven biển nước Anh (~400 học sinh); bạn thân Lucy (hàng xóm); đồng phục áo len xanh đậm,
#   sơ mi trắng, cà vạt; thích Anh văn, Mỹ thuật, kém Toán (thi lại Toán năm 15 tuổi); cô Green dạy Anh văn — lý do Emma
#   đi dạy; học tiếng Pháp 5 năm; thi A level (Anh văn, Pháp, Sử: A, A, B); học Văn học Anh ở đại học; lái xe từ 17 tuổi
#   (thầy Hughes, trượt lần đầu); học tiếng Việt 3 năm, tuần hai buổi; mẹ dạy nấu ăn, đã học lớp nấu món Việt.
