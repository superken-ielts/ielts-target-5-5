  - kind: qa
    chapter: "Thi thử 1 · Phần 1"
    heading: "Mock test 1 · Part 1 · Introduction and interview"
    heading_vi: "Thi thử Phần 1 — giám khảo hỏi về bạn (bài thi thật: 4–5 phút)"
    roles: {emma: examiner, tom: candidate}
    items:
      - q: "Can you tell me your full name, please?"
        a: "Good afternoon. My full name is Tran Minh Tuan, but please call me Tom."
        phrases: ["My full name is…", "please call me…"]
      - q: "Can I see your identification, please?"
        a: "Sure. Here it is."
      - q: "Do you work, or are you a student?"
        a: "I'm a student. I'm in my second year at university in Ho Chi Minh City, and I'm studying business."
        phrases: ["I'm a student.", "in my second year", "I'm studying…"]
      - q: "What's the most difficult part of your studies?"
        a: "Probably the reading. We have to read long articles in English every week, and they're full of new words. But it's really good practice for my IELTS test."
        phrases: ["Probably…", "We have to…", "really good practice"]
      - q: "Did you enjoy secondary school?"
        a: "Yes, mostly. I enjoyed the science subjects, and I had some great friends. But my last year was really stressful, because of the university entrance exam."
        phrases: ["Yes, mostly.", "I enjoyed…", "really stressful"]
      - q: "What was the most useful thing you learned at school?"
        a: "I think it was English, even though our lessons were mostly grammar. It gave me a good base, and now I use it every day at university."
        phrases: ["I think it was…", "even though…", "a good base"]
      - q: "Do you think children get too much homework?"
        a: "In Vietnam, yes, I think so. Many children study at school all day, and then they go to extra classes in the evening. They don't have enough time to play."
        phrases: ["In Vietnam, yes…", "extra classes", "enough time to play"]
      - q: "Did your parents help you with your homework?"
        a: "When I was small, yes. My mum checked my homework every night. Later, my grandfather helped me with Maths, because he was a Maths teacher."
        phrases: ["When I was small…", "checked my homework", "helped me with…"]
