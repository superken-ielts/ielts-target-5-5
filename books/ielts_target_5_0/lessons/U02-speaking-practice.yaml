  - kind: qa
    chapter: "Hỏi qua lại: môn học, thầy cô"
    heading: "Tom and Emma ask each other · Subjects and teachers"
    heading_vi: "Môn học và thầy cô — dùng really enjoyed, keen on, preferred… to…, boring"
    items:
      - q: "Emma, what was your favourite subject at school?"
        a: "English, because I loved reading stories and writing my own. I was also very keen on Art. I spent hours drawing in my free time."
        ask: tom
        by: emma
        phrases: ["I loved + -ing", "I was very keen on…", "I spent hours + -ing"]
      - q: "What about you, Tom?"
        a: "Chemistry. I really enjoyed doing experiments in the lab, and my teacher, Mr Nam, made every lesson fun. I preferred practical subjects to theory."
        ask: emma
        by: tom
        phrases: ["I really enjoyed + -ing", "made every lesson fun", "preferred… to…"]
      - q: "Which subject were you not very good at?"
        a: "Maths. I was always slow at it, and I didn't really understand algebra. I passed my exam in the end, but only just!"
        ask: tom
        by: emma
        phrases: ["I was always slow at…", "in the end", "only just"]
      - q: "Did you find any subjects boring?"
        a: "Yes, History. We had to remember lots of dates, and the teacher just read from the book. Now I find History interesting, but at school I thought it was really boring."
        ask: emma
        by: tom
        phrases: ["We had to remember…", "Now I find… interesting", "really boring"]
      - q: "Who was your favourite teacher?"
        a: "Mrs Green, my English teacher. She was kind but strict, and she lent me her own books. She's the reason I became a teacher."
        ask: tom
        by: emma
        phrases: ["kind but strict", "lent me her own books", "She's the reason…"]
      - q: "Were your teachers strict?"
        a: "Some of them were very strict. If we came late, we had to stand at the back of the class. But most of them really cared about us."
        ask: emma
        by: tom
        phrases: ["Some of them were…", "we had to…", "really cared about us"]
      - q: "Did you learn any foreign languages at school?"
        a: "Yes, French, for five years. I could read it quite well, but I was too shy to speak. Now I've forgotten most of it, which is a shame."
        ask: tom
        by: emma
        phrases: ["for five years", "too shy to speak", "which is a shame"]
      - q: "Which subject would you like to study again?"
        a: "Maybe Geography. I didn't like it very much at school, but now I love travelling, and I'd like to know more about other countries."
        ask: emma
        by: tom
        phrases: ["Maybe…", "I didn't like it very much, but…", "I'd like to know more about…"]
