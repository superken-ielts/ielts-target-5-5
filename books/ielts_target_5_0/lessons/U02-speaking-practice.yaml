  - kind: qa
    chapter: "Hỏi qua lại: thời đi học"
    heading: "Tom and Emma ask each other · School days"
    heading_vi: "Thời đi học — kể bằng thì quá khứ đơn, thêm lý do và chi tiết"
    items:
      - q: "Tom, where did you go to secondary school?"
        a: "I went to a big state school in Da Lat, near the lake. It had about two thousand students, so it was always busy and noisy."
        ask: emma
        by: tom
        phrases: ["I went to…", "a big state school", "about two thousand students"]
      - q: "And what was your school like, Emma?"
        a: "It was a small school in my hometown, with only about four hundred students. Everybody knew everybody, and the teachers knew all our names."
        ask: tom
        by: emma
        phrases: ["only about…", "Everybody knew everybody", "knew all our names"]
      - q: "How did you get to school?"
        a: "I rode my bike. It took about fifteen minutes, but Da Lat is very hilly, so I was always tired when I arrived! When it rained, my dad took me on his motorbike."
        ask: emma
        by: tom
        phrases: ["I rode my bike", "It took about…", "very hilly"]
      - q: "Did you have to wear a uniform?"
        a: "Yes, we did. We had to wear a dark blue jumper, a white shirt and a school tie. I hated the tie, because it was really uncomfortable in summer."
        ask: tom
        by: emma
        phrases: ["We had to wear…", "I hated…", "really uncomfortable"]
      - q: "What time did your school day start?"
        a: "Very early, at seven o'clock. In winter, Da Lat is really cold in the morning, so it was hard to get out of bed. We finished at half past eleven, and I went home for lunch."
        ask: emma
        by: tom
        phrases: ["Very early, at…", "hard to get out of bed", "half past eleven"]
      - q: "Who was your best friend at school?"
        a: "Lucy, my neighbour. We sat next to each other in almost every class, and we walked home together every afternoon. We're still friends now."
        ask: tom
        by: emma
        phrases: ["sat next to each other", "walked home together", "We're still friends"]
      - q: "Did you have a lot of homework?"
        a: "Yes, a lot, especially in my last year, before the university entrance exam. I often studied until eleven o'clock at night."
        ask: emma
        by: tom
        phrases: ["especially in my last year", "the university entrance exam", "until eleven o'clock"]
      - q: "Do you remember any school trips?"
        a: "Yes! When I was twelve, we went to London for three days. We visited museums and saw a show. It was my first time in a big city, and I loved it."
        ask: tom
        by: emma
        phrases: ["When I was twelve…", "for three days", "my first time in…"]
