  - kind: bullets
    chapter: "Phát âm: âm /ʌ/"
    heading: "Pronunciation check · the sound /ʌ/"
    heading_vi: "Chữ 'o' trong mother, brother, son đọc là /ʌ/ — âm rất hay gặp trong từ chỉ gia đình"
    items:
      - {en: "mother  /ˈmʌðə/", vi: "mẹ"}
      - {en: "brother  /ˈbrʌðə/", vi: "anh, em trai"}
      - {en: "son  /sʌn/ — sounds like sun", vi: "con trai — đọc giống 'sun'"}
      - {en: "uncle  /ˈʌŋkl/ · cousin  /ˈkʌzn/", vi: "chú, bác, cậu · anh chị em họ"}
      - {en: "husband  /ˈhʌzbənd/ · grandmother · brother-in-law", vi: "chồng · bà · anh/em rể"}
    lines:
      - emma: "Pronunciation check. In mother, brother and son, the letter o is pronounced like the short sound in cup."
        vi: "Chữ 'o' trong mother, brother, son đọc ngắn như âm trong 'cup'."
      - {emma: "Listen, and repeat after Tom.", focus: 0}
      - {tom: "mother", focus: 0}
      - {tom: "brother", focus: 1}
      - {tom: "son. Son, like the sun in the sky.", focus: 2}
      - emma: "The same sound is very common in family words."
        focus: 3
      - {tom: "uncle, cousin", focus: 3}
      - {tom: "husband, grandmother, brother-in-law", focus: 4}
      - {emma: "Practise saying the words: my mother, my brother, my son, my cousin.", focus: 4}

  - kind: match
    chapter: "Vocabulary 2A: các giai đoạn"
    heading: "Vocabulary 2A · Label the pictures with the correct words"
    heading_vi: "Gắn từ với tranh a–f"
    image: {pdf: course-book, page: 12, clip: [70, 392, 450, 556]}
    items:
      - {n: 1, q: "middle age", answer: d}
      - {n: 2, q: "death", answer: c}
      - {n: 3, q: "birth", answer: e}
      - {n: 4, q: "childhood", answer: b}
      - {n: 5, q: "retirement", answer: a}
      - {n: 6, q: "adolescence", answer: f}
    lines:
      - emma: "Vocabulary 2: stages of life. Exercise A. Label the pictures with the correct words: middle age, death, birth, childhood, retirement and adolescence."
        say: "Vocabulary two: stages of life. Exercise eigh. Label the pictures with the correct words: middle age, death, birth, childhood, retirement and adolescence."
        vi: "Gắn 6 từ với 6 bức tranh."
      - {wait: 6, note: "Pause the video and try", vi: "Tạm dừng video, gắn từ với tranh rồi xem tiếp."}
      - {emma: "Picture e: a new baby. That's birth.", say: "Picture E: a new baby. That's birth.", focus: 2, reveal: 3}
      - {emma: "Picture b: young children at school. That's childhood.", say: "Picture B: young children at school. That's childhood.", focus: 3, reveal: 4}
      - {emma: "Picture f: teenagers with their friends. That's adolescence.", say: "Picture F: teenagers with their friends. That's adolescence.", focus: 5, reveal: 6}
      - {emma: "Picture d: two men at work, about fifty years old. That's middle age.", say: "Picture D: two men at work, about fifty years old. That's middle age.", focus: 0, reveal: 1}
      - {emma: "Picture a: an older couple with free time on the beach. That's retirement.", say: "Picture eigh: an older couple with free time on the beach. That's retirement.", focus: 4, reveal: 5}
      - {emma: "And picture c: a cemetery. That's death.", say: "And picture C: a cemetery. That's death.", focus: 1, reveal: 2}
      - emma: "The answer key does not cover this exercise, so these are our suggested answers."
        vi: "Phần đáp án cuối sách không có bài này — đây là đáp án gợi ý."

  - kind: order
    chapter: "Vocabulary 2B: thứ tự"
    heading: "Vocabulary 2B · Write the stages in the order they come in life"
    heading_vi: "Che bài A, viết các giai đoạn theo thứ tự trong cuộc đời"
    items:
      - {k: middle-age, label: "", text: "middle age", pos: 4}
      - {k: death, label: "", text: "death", pos: 6}
      - {k: birth, label: "", text: "birth", pos: 1}
      - {k: childhood, label: "", text: "childhood", pos: 2}
      - {k: retirement, label: "", text: "retirement", pos: 5}
      - {k: adolescence, label: "", text: "adolescence", pos: 3}
    lines:
      - emma: "Exercise B. Cover Exercise A, and write the stages in the order that they come in life. Number one is done for you: birth."
        focus: 2
        reveal: birth
        vi: "Bài B. Che bài A, viết theo thứ tự — số 1 là birth."
      - {wait: 6, note: "Pause the video and try", vi: "Tạm dừng video, viết thứ tự rồi xem tiếp."}
      - {tom: "Two: childhood.", focus: 3, reveal: childhood}
      - {tom: "Three: adolescence. That's when you're a teenager.", focus: 5, reveal: adolescence}
      - {tom: "Four: middle age.", focus: 0, reveal: middle-age}
      - {tom: "Five: retirement.", focus: 4, reveal: retirement}
      - {tom: "And six: death.", focus: 1, reveal: death}
      - emma: "Well done. Notice: between adolescence and middle age, you are an adult. We call it adulthood."
        vi: "Giữa tuổi dậy thì và trung niên là tuổi trưởng thành — adulthood."

  - kind: vocab
    chapter: "Ví dụ: các giai đoạn"
    heading: "Stages of life · useful word forms and examples"
    heading_vi: "Dạng từ hay dùng khi nói và ví dụ"
    items:
      - {w: "birth", pos: "noun · be born (verb)", vi: "sự ra đời · được sinh ra", ex: "I was born in 2004, in a small village near Hue."}
      - {w: "childhood", pos: "noun · a child (person)", vi: "thời thơ ấu", ex: "I had a happy childhood in the countryside."}
      - {w: "adolescence", pos: "noun · a teenager (person)", vi: "tuổi vị thành niên", ex: "Adolescence can be difficult, because teenagers change a lot."}
      - {w: "adulthood", pos: "noun · an adult (person)", vi: "tuổi trưởng thành", ex: "In Vietnam, you become an adult at eighteen."}
      - {w: "middle age", pos: "noun · middle-aged (adjective)", vi: "tuổi trung niên", ex: "My parents are in their fifties. They're middle-aged."}
      - {w: "retirement", pos: "noun · retire (verb) · retired (adjective)", vi: "sự nghỉ hưu · nghỉ hưu · đã nghỉ hưu", ex: "My grandfather retired at sixty. He loves his retirement."}
      - {w: "death", pos: "noun · die (verb) · dead (adjective)", vi: "cái chết · chết · đã chết", ex: "After my grandmother died, my grandfather moved in with us."}
    lines:
      - emma: "Here are more examples. When you speak, you often need a different form of the word."
        vi: "Khi nói, ta thường dùng dạng khác của từ."
      - {emma: "Birth. We usually say: be born.", focus: 0}
      - {tom: "I was born in 2004, in a small village near Hue.", say: "I was born in two thousand and four, in a small village near Whey.", focus: 0}
      - {emma: "Childhood.", focus: 1}
      - {tom: "I had a happy childhood in the countryside.", focus: 1}
      - {emma: "Adolescence. The person is a teenager.", focus: 2}
      - {tom: "Adolescence can be difficult, because teenagers change a lot.", focus: 2}
      - {emma: "Adulthood. The person is an adult.", focus: 3}
      - {tom: "In Vietnam, you become an adult at eighteen.", focus: 3}
      - {emma: "Middle age. The adjective is middle-aged.", focus: 4}
      - {tom: "My parents are in their fifties. They're middle-aged.", focus: 4}
      - {emma: "Retirement. The verb is retire, and the adjective is retired.", focus: 5}
      - {tom: "My grandfather retired at sixty. He loves his retirement.", focus: 5}
      - {emma: "Death. The verb is die.", focus: 6}
      - {tom: "After my grandmother died, my grandfather moved in with us.", focus: 6}

  - kind: bullets
    chapter: "Vocabulary 3: từ khóa"
    heading: "Vocabulary 3A · Check the highlighted words"
    heading_vi: "Sáu từ khóa để nói về gia đình"
    items:
      - {en: "parents — your mother and father", vi: "bố mẹ"}
      - {en: "relatives — aunts, uncles, cousins, grandparents…", vi: "họ hàng"}
      - {en: "retired — not working any more because of age", vi: "đã nghỉ hưu"}
      - {en: "teenagers — people aged 13 to 19", vi: "thanh thiếu niên (13–19 tuổi)"}
      - {en: "children — the plural of child", vi: "con cái, trẻ em (số nhiều của child)"}
      - {en: "adult — a person who is fully grown", vi: "người trưởng thành"}
    lines:
      - emma: "Vocabulary 3: using key words and phrases to speak. Exercise A. Check the highlighted words."
        say: "Vocabulary three: using key words and phrases to speak. Exercise eigh. Check the highlighted words."
        vi: "Vocabulary 3. Kiểm tra nghĩa sáu từ được tô màu."
      - {emma: "Parents: your mother and father.", focus: 0}
      - {emma: "Relatives: other people in your family, like aunts, uncles and cousins.", focus: 1}
      - {emma: "Retired: not working any more, because of your age.", focus: 2}
      - {emma: "Teenagers: people from thirteen to nineteen years old.", focus: 3}
      - {emma: "Children: the plural of child. Never say childs!", focus: 4}
      - {emma: "Adult: a person who is fully grown.", focus: 5}

  - kind: qa
    chapter: "Vocabulary 3: trả lời mẫu"
    heading: "Vocabulary 3A · Answer the questions with a partner"
    heading_vi: "Nghe câu trả lời mẫu của Tom, rồi tự trả lời"
    items:
      - q: "Were you born in the same place as your parents?"
        a: "No, I wasn't. I was born in Hanoi, but my parents were both born in a small village near Hue."
        phrases: ["I was born in…", "my parents were both born…"]
      - q: "Do any of your other relatives live in the same place?"
        a: "Yes, a lot of them. My aunt and uncle live in the same street, and my cousins visit us every weekend."
        phrases: ["a lot of them", "in the same street", "my cousins"]
      - q: "Are your grandparents retired?"
        a: "Yes, they are. My grandfather was a teacher, and he retired ten years ago. Now he grows vegetables in his garden."
        phrases: ["Yes, they are.", "he retired … ago"]
      - q: "Are any of your friends teenagers?"
        a: "Not really. Most of my friends are in their twenties, but my younger brother is a teenager. He's fifteen."
        phrases: ["in their twenties", "a teenager"]
      - q: "Do you know somebody who has more than five children?"
        a: "Yes, my great-aunt has seven children! Big families were common in her generation."
        phrases: ["has seven children", "in her generation"]
      - q: "When does somebody become an adult in your country?"
        a: "In Vietnam, you become an adult at eighteen. Then you can vote and get a driving licence."
        phrases: ["become an adult at…", "vote", "a driving licence"]
    lines:
      - emma: "Now answer the questions with a partner. Listen to Tom's answers first."
        vi: "Trả lời các câu hỏi với bạn học — nghe Tom trả lời mẫu trước."
      - {emma: "Tom, were you born in the same place as your parents?", focus: 0}
      - {tom: "No, I wasn't. I was born in Hanoi, but my parents were both born in a small village near Hue.", say: "No, I wasn't. I was born in Ha Noi, but my parents were both born in a small village near Whey.", reveal: 0}
      - {emma: "Do any of your other relatives live in the same place?", focus: 1}
      - {tom: "Yes, a lot of them. My aunt and uncle live in the same street, and my cousins visit us every weekend.", reveal: 1}
      - {emma: "Are your grandparents retired?", focus: 2}
      - {tom: "Yes, they are. My grandfather was a teacher, and he retired ten years ago. Now he grows vegetables in his garden.", reveal: 2}
      - {emma: "Are any of your friends teenagers?", focus: 3}
      - {tom: "Not really. Most of my friends are in their twenties, but my younger brother is a teenager. He's fifteen.", reveal: 3}
      - {emma: "Do you know somebody who has more than five children?", focus: 4}
      - {tom: "Yes, my great-aunt has seven children! Big families were common in her generation.", reveal: 4}
      - {emma: "When does somebody become an adult in your country?", focus: 5}
      - {tom: "In Vietnam, you become an adult at eighteen. Then you can vote and get a driving licence.", reveal: 5}

  - kind: errors
    chapter: "Lỗi thường gặp"
    heading: "Watch out! Typical errors"
    heading_vi: "Lỗi hay gặp khi dùng các từ này"
    items:
      - {wrong: "My brother has three childs.", right: "My brother has three children.", note: "child → children"}
      - {wrong: "He is teenager.", right: "He is a teenager.", note: "Thêm 'a' trước danh từ số ít"}
      - {wrong: "Where did you born?", right: "Where were you born?", note: "be born: I was born in…"}
      - {wrong: "My grandfather is retire.", right: "My grandfather is retired.", note: "retire (động từ) → retired (tính từ)"}
    lines:
      - emma: "Watch out for these typical errors."
        vi: "Chú ý các lỗi hay gặp."
      - {emma: "Not childs. Say children.", focus: 0}
      - {tom: "My brother has three children.", focus: 0}
      - {emma: "Teenager needs the article a.", focus: 1}
      - {tom: "He is a teenager.", focus: 1}
      - {emma: "Born uses the verb be.", focus: 2}
      - {tom: "Where were you born? I was born in Hanoi.", say: "Where were you born? I was born in Ha Noi.", focus: 2}
      - {emma: "And use the adjective retired after the verb be.", focus: 3}
      - {tom: "My grandfather is retired.", focus: 3}

  - kind: letter
    chapter: "Thêm ví dụ: nói về gia đình"
    heading: "Model answer · Tell me about your family."
    heading_vi: "Câu trả lời mẫu cho câu hỏi IELTS Speaking Part 1 — dùng từ của cả ba bài"
    items:
      - text: "I come from quite a big family. I live with my parents and my younger brother, who is a teenager. He's fifteen and he's still at school."
        note: "parents · teenager"
      - text: "My father is a doctor and my mother works part-time in a bank. My grandparents are retired, and they live with us too, so our house is always busy."
        note: "retired · grandparents"
      - text: "I also have a lot of relatives in the same city. My aunt and uncle live nearby, and I often play football with my cousins at the weekend."
        note: "relatives · aunt · uncle · cousins"
      - text: "I think I had a really happy childhood, because there were always people around me. Now that I'm an adult, I still love family dinners on Sundays."
        note: "childhood · adult"
    lines:
      - {read: tom, focus: 0}
      - {read: tom, focus: 1}
      - {read: tom, focus: 2}
      - {read: tom, focus: 3}

