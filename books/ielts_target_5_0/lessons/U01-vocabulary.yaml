      - {emma: "Number two: mother.", focus: 1}
      - {wait: 4, note: "Write the word", vi: "Viết từ vừa nghe"}
      - {emma: "Number three: brother.", focus: 2}
      - {wait: 4, note: "Write the word", vi: "Viết từ vừa nghe"}
