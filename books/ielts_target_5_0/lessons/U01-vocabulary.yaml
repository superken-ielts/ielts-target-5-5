      - {wait: 4, note: "Write the word", vi: "Viết từ vừa nghe"}
      - {emma: "Number six: son.", focus: 5}
      - {wait: 4, note: "Write the word", vi: "Viết từ vừa nghe"}
      - {emma: "Number seven: daughter.", focus: 6}
      - {wait: 4, note: "Write the word", vi: "Viết từ vừa nghe"}
