id: U01-vocabulary
activity: U01-speaking-vocab
title: "Unit 1 · Life"
subtitle: "Vocabulary 1–3: family, stages of life, key words"
title_vi: "Từ chỉ người trong gia đình, các giai đoạn cuộc đời, từ khóa để nói — đáp án và thêm ví dụ"
tag: "UNIT 1 · LIFE"
speakers:
  # giọng theo bộ đọc: kokoro (mặc định khi có model) hoặc flite (dự phòng, có sẵn trên Ubuntu)
  emma: {name: Emma, role: teacher, color: "#C8102E", voice: {kokoro: af_heart, flite: slt}}
  tom: {name: Tom, role: student, color: "#1F5FAD", voice: {kokoro: am_michael, flite: rms}}

scenes:
  - kind: title
    chapter: "Giới thiệu"
    lines:
      - emma: "Welcome back to Unit 1: Life. This lesson covers Vocabulary 1, 2 and 3."
