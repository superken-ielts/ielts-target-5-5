      - {en: "Vocabulary 2: stages of life — label the pictures, then put them in order", vi: "Các giai đoạn cuộc đời"}
      - {en: "Vocabulary 3: key words to speak — model answers", vi: "Từ khóa để nói — câu trả lời mẫu"}
