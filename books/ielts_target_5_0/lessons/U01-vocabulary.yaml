        vi: "Bài này gồm Vocabulary 1, 2 và 3 của Unit 1."
      - tom: "Members of the family, stages of life, and key words to speak. Right?"
      - emma: "Exactly. In IELTS Speaking Part 1, the examiner often asks about your family, so these words are really useful."
        say: "Exactly. In eye-elts Speaking Part one, the examiner often asks about your family, so these words are really useful."
        vi: "Phần 1 bài thi Nói thường hỏi về gia đình — các từ này rất cần."

