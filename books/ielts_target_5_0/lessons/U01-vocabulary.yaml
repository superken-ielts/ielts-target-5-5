      - {en: "/ʌ/: mother, brother, son, uncle, cousin", vi: "Âm /ʌ/ trong từ chỉ gia đình"}
      - {en: "Stages: birth → childhood → adolescence → (adulthood) → middle age → retirement → death", vi: "Các giai đoạn cuộc đời"}
      - {en: "I was born in… · He is a teenager · She is retired · three children", vi: "Dùng đúng dạng từ"}
      - {en: "Homework: draw your family tree and say one sentence about each person", vi: "Bài về nhà: vẽ cây gia đình, nói một câu về mỗi người"}
    lines:
      - emma: "Let's remember the main points."
        vi: "Cùng nhớ lại các ý chính."
      - {emma: "Ten family words, and their spelling.", focus: 0}
      - {emma: "The sound in mother, brother, son, uncle and cousin.", focus: 1}
      - {emma: "The stages of life, from birth to death.", focus: 2}
      - {emma: "And the right word forms: I was born, he is a teenager, she is retired, three children.", focus: 3}
      - emma: "For homework, draw your family tree, and say one sentence about each person. Record yourself!"
        focus: 4
        vi: "Bài về nhà: vẽ cây gia đình và ghi âm một câu về mỗi người."
      - tom: "Thanks, Emma! I'm going to start with my grandparents."
