  - kind: qa
    chapter: "Hỏi qua lại: học tiếng Anh"
    heading: "Tom and Emma ask each other · Learning languages"
    heading_vi: "Học ngoại ngữ — kinh nghiệm, cái khó, cách luyện"
    items:
      - q: "Tom, when did you start learning English?"
        a: "When I was eight, at primary school. We learned lots of grammar rules and word lists, but we didn't speak much in class."
        ask: emma
        by: tom
        phrases: ["When I was eight…", "grammar rules", "we didn't speak much"]
      - q: "Emma, are you learning Vietnamese?"
        a: "Yes, I am. I started when I arrived here three years ago, and I have a class twice a week. I can order food and chat with my neighbours, but it's still hard."
        ask: tom
        by: emma
        phrases: ["I started when…", "twice a week", "it's still hard"]
      - q: "What's the most difficult thing about English for you?"
        a: "Listening. Native speakers talk very fast, and they join their words together. In films, I often understand the pictures better than the words!"
        ask: emma
        by: tom
        phrases: ["Native speakers…", "join their words together", "better than…"]
      - q: "And what's the hardest thing about Vietnamese?"
        a: "The tones, definitely. One word can have six different meanings, so people often look confused when I speak. Luckily, everyone is very patient with me."
        ask: tom
        by: emma
        phrases: ["…, definitely.", "six different meanings", "Luckily…"]
      - q: "How do you practise English outside class?"
        a: "I listen to podcasts on the bus, and I watch films with English subtitles. I also meet a student from Australia every Friday. We practise English and Vietnamese together."
        ask: emma
        by: tom
        phrases: ["I listen to…", "with English subtitles", "every Friday"]
      - q: "What's the best way to learn new words?"
        a: "Write each new word in a notebook, with an example sentence. Then use the word in a conversation the same day. If you use it, you remember it."
        ask: tom
        by: emma
        phrases: ["an example sentence", "the same day", "If you use it, you remember it."]
      - q: "Do you prefer studying alone or in a group?"
        a: "It depends. I prefer studying alone for grammar and vocabulary, because I can concentrate better. But for speaking, a group is much more fun."
        ask: emma
        by: tom
        phrases: ["It depends.", "I prefer… for…", "much more fun"]
      - q: "Would you like to learn another language?"
        a: "Yes, Japanese. I'm fascinated by the culture, and I'd love to visit Japan one day. But first, I want to speak better Vietnamese!"
        ask: tom
        by: emma
        phrases: ["I'm fascinated by…", "I'd love to…", "But first…"]
