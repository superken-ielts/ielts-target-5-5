  - kind: qa
    chapter: "Hỏi qua lại: kỹ năng mới"
    heading: "Tom and Emma ask each other · Learning new skills"
    heading_vi: "Kỹ năng mới — kể chuyện đã học (quá khứ đơn), nói điều muốn học (I'd like to…)"
    items:
      - q: "Emma, can you drive?"
        a: "Yes, I can. In Britain, you can start learning at seventeen, so I had lessons with an instructor for six months. But here in Vietnam, I don't drive. The traffic scares me!"
        ask: tom
        by: emma
        phrases: ["you can start learning at…", "I had lessons with…", "… scares me!"]
      - q: "Can you ride a motorbike, Tom?"
        a: "Yes, almost everyone can in Vietnam! I learned when I was eighteen. My dad taught me in an empty car park on Sunday mornings, and I passed my test the first time."
        ask: emma
        by: tom
        phrases: ["almost everyone can", "taught me in…", "the first time"]
      - q: "Can you swim?"
        a: "Yes, but not very well. I learned at a swimming pool when I was twelve. I can swim about fifty metres, and then I need a long rest!"
        ask: emma
        by: tom
        phrases: ["not very well", "I learned at…", "then I need a long rest"]
      - q: "Who taught you to cook, Emma?"
        a: "My mum. Every Sunday, we baked bread or a cake together. Now I'm learning to cook Vietnamese food, and my spring rolls are getting better!"
        ask: tom
        by: emma
        phrases: ["Every Sunday, we…", "I'm learning to…", "are getting better"]
      - q: "What new skill would you like to learn?"
        a: "Cooking! I share a flat with two friends, and we only cook noodles and eggs. I'd love to learn my mum's recipes, especially her fish soup."
        ask: emma
        by: tom
        phrases: ["I'd love to learn…", "we only cook…", "especially…"]
      - q: "Is it better to learn a skill from a teacher, or from videos online?"
        a: "Videos are free and flexible, so they're great for simple things. But a teacher can see your mistakes and correct them. For difficult skills, like driving, you really need a teacher."
        ask: tom
        by: emma
        phrases: ["free and flexible", "correct them", "you really need…"]
      - q: "What's the most useful skill you've learned?"
        a: "Probably typing with ten fingers. I learned it in a free online course, and now I can write my essays twice as fast."
        ask: emma
        by: tom
        phrases: ["Probably…", "a free online course", "twice as fast"]
      - q: "Is it easier to learn new things when you're young?"
        a: "In some ways, yes. Children have more free time, and they aren't afraid of making mistakes. But adults are often more motivated, because they know why they're learning."
        ask: tom
        by: emma
        phrases: ["In some ways, yes.", "aren't afraid of + -ing", "more motivated"]
