  - kind: qa
    chapter: "Thi thử 2 · Phần 3"
    heading: "Mock test 2 · Part 3 · Discussion"
    heading_vi: "Phần 3 — kỹ năng và cách học: ý kiến + lý do + ví dụ"
    roles: {tom: examiner, emma: candidate}
    items:
      - q: "At what age should young people learn to drive?"
        a: "I think eighteen is about right. Younger drivers often take more risks. But in the countryside, young people may need to drive earlier, to get to school or work."
        ask: tom
        by: emma
        phrases: ["I think… is about right", "take more risks", "may need to…"]
      - q: "Which skills should schools teach that they don't teach now?"
        a: "Practical skills, like cooking, managing money and first aid. Every adult needs them, but many young people leave school without knowing how to cook a simple meal."
        ask: tom
        by: emma
        phrases: ["Practical skills, like…", "Every adult needs them", "without knowing how to…"]
      - q: "Is it better to learn a skill from a family member or from a professional teacher?"
        a: "It depends on the skill. Family members are patient, and they're free, which is great for cooking or swimming. But for a test, like driving, a professional knows exactly what the examiners want."
