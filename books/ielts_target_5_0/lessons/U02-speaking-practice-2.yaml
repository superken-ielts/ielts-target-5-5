  - kind: qa
    chapter: "Thi thử 2 · Phần 1"
    heading: "Mock test 2 · Part 1 · Introduction and interview"
    heading_vi: "Thi thử Phần 1 — đổi vai: Tom hỏi, Emma trả lời"
    roles: {tom: examiner, emma: candidate}
    items:
      - q: "Can you tell me your full name, please?"
        a: "Good morning. My full name is Emma Louise Clarke."
        ask: tom
        by: emma
        phrases: ["My full name is…"]
      - q: "Where are you from?"
        a: "I'm from a small town by the sea in England, but I've lived in Ho Chi Minh City for three years now."
        ask: tom
        by: emma
        phrases: ["I'm from…", "but I've lived in… for…"]
      - q: "What do you do?"
        a: "I'm an English teacher. I teach adults at a language school, mostly in the evenings and at the weekend."
        ask: tom
        by: emma
        phrases: ["I teach…", "mostly in the evenings"]
      - q: "Why did you decide to become a teacher?"
        a: "Because of my English teacher at school, Mrs Green. She made me love books, and I wanted to help people in the same way."
        ask: tom
        by: emma
        phrases: ["Because of…", "She made me…", "in the same way"]
      - q: "Did you read a lot when you were a child?"
        a: "Yes, I did. Every Saturday, my dad took me to the library in our town, and I borrowed five books at a time. I usually finished them all in a week!"
        ask: tom
        by: emma
        phrases: ["Every Saturday…", "five books at a time", "in a week"]
      - q: "Do people in your country read less than in the past?"
        a: "I think so. Many people read on their phones now, but mostly short articles and messages, not books. Still, crime novels are very popular, and I'm a big fan!"
        ask: tom
        by: emma
        phrases: ["I think so.", "mostly…, not…", "I'm a big fan"]
      - q: "Have you ever taken a course online?"
        a: "Yes. Last year, I took a short photography course online. It was cheap and flexible, but I missed having a real teacher to answer my questions."
        ask: tom
        by: emma
        phrases: ["Last year, I took…", "cheap and flexible", "I missed having…"]
