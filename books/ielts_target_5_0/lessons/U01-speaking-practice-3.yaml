  - kind: qa
    chapter: "Hỏi qua lại: bạn bè"
    heading: "Tom and Emma ask each other · Friends"
    heading_vi: "Bạn bè — kể chuyện bằng quá khứ, nói thói quen bằng hiện tại"
    items:
      - q: "Do you have a lot of friends, Tom?"
        a: "I have a lot of friends at university, but only two or three really close friends. One of them is my best friend from primary school in Da Lat."
        ask: emma
        by: tom
        phrases: ["only two or three", "really close friends", "my best friend from…"]
      - q: "How did you meet your best friend, Emma?"
        a: "We met at university, many years ago. We were in the same class, and we both always sat at the back. We've been friends ever since."
        ask: tom
        by: emma
        phrases: ["We met at…", "in the same class", "ever since"]
      - q: "What do you usually do with your friends?"
        a: "We play basketball, go to the cinema, or just sit in a café and talk for hours. Before exams, we also study together in the library."
        ask: emma
        by: tom
        phrases: ["talk for hours", "Before exams…", "study together"]
      - q: "Is it easy to make new friends as an adult?"
        a: "Not as easy as at school. Adults are busy with work and family. I usually make new friends through my hobbies, like my hiking club."
        ask: tom
        by: emma
        phrases: ["Not as easy as…", "busy with work and family", "through my hobbies"]
      - q: "Do you keep in touch with your old school friends?"
        a: "Yes, with a few of them. We have a group chat, and we always meet up when I go back to Da Lat for Tet."
        ask: emma
        by: tom
        phrases: ["keep in touch", "a group chat", "meet up"]
      - q: "What makes a good friend, in your opinion?"
        a: "A good friend is someone you can trust, and someone who listens to you. They're honest with you, even when the truth is difficult to hear."
        ask: tom
        by: emma
        phrases: ["someone you can trust", "someone who listens", "honest with you"]
