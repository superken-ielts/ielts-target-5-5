  - kind: qa
    chapter: "Hỏi qua lại: tương lai"
    heading: "Tom and Emma ask each other · The future"
    heading_vi: "Tương lai — would like to, hope to, I'd love to, maybe"
    items:
      - q: "Where would you like to live in ten years?"
        a: "Maybe in Ho Chi Minh City, because the job opportunities are better there. But one day, I'd like to buy a small house in Da Lat for my parents."
        ask: emma
        by: tom
        phrases: ["Maybe in…", "job opportunities", "one day, I'd like to…"]
      - q: "What do you hope to do in the future, Emma?"
        a: "I hope to travel more. My parents are going to retire next year, so I'd love to take them on a long holiday. They've worked hard all their lives!"
        ask: tom
        by: emma
        phrases: ["I hope to…", "are going to retire", "I'd love to…"]
      - q: "Would you like to have a big family one day?"
        a: "Not too big. Maybe two children. I grew up with a sister and a brother, and I think it's nice for children to have someone to play with."
        ask: emma
        by: tom
        phrases: ["Not too big.", "Maybe two children", "someone to play with"]
      - q: "Would you like to live in another country one day?"
        a: "I already do, in a way! I've lived in Vietnam for three years, and I love it. But one day, I'd like to try living in Japan, because I'm fascinated by the culture."
        ask: tom
        by: emma
        phrases: ["in a way", "I've lived in… for…", "I'm fascinated by…"]
