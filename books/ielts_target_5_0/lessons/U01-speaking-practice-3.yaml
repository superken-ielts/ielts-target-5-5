  - kind: qa
    chapter: "Hỏi qua lại: sinh nhật, lễ hội"
    heading: "Tom and Emma ask each other · Birthdays and celebrations"
    heading_vi: "Sinh nhật, Tết, Giáng sinh, đám cưới"
    items:
      - q: "How do you usually celebrate your birthday, Tom?"
        a: "Nothing big. I usually have dinner with a few close friends, and my family calls me from Da Lat. Sometimes my sister sends me a cake!"
        ask: emma
        by: tom
        phrases: ["Nothing big.", "a few close friends", "Sometimes…"]
      - q: "What was your best birthday, Emma?"
        a: "My thirtieth. My friends organised a surprise party at a little restaurant by the river. I had no idea, and when I walked in, everybody shouted surprise!"
        ask: tom
        by: emma
        phrases: ["My thirtieth", "a surprise party", "I had no idea"]
      - q: "Do you like giving presents?"
        a: "Yes, I do, but choosing presents is difficult for me. I usually give something useful, like a book or a nice cup. My mum prefers flowers, of course!"
        ask: emma
        by: tom
        phrases: ["choosing presents is difficult", "something useful", "of course"]
      - q: "What's the most important festival in your country?"
        a: "Probably Christmas. Families get together, give presents and eat a big dinner. In my family, we always sing songs and play silly games after dinner."
        ask: tom
        by: emma
        phrases: ["Probably…", "get together", "silly games"]
      - q: "What does your family do at Tet?"
        a: "We clean and decorate the house, and we visit our relatives. My grandfather gives lucky money to all the children. And of course, we eat a lot of traditional food!"
        ask: emma
        by: tom
        phrases: ["clean and decorate", "visit our relatives", "lucky money"]
      - q: "Do you enjoy weddings?"
        a: "Yes, I love them, especially the dancing. Weddings in my country are usually smaller than in Vietnam, but they often go on until very late at night."
        ask: tom
        by: emma
        phrases: ["especially the dancing", "smaller than in Vietnam", "go on until…"]
      - q: "Do you prefer big parties or small get-togethers?"
        a: "Small get-togethers. At big parties, it's too noisy to talk properly. With a small group, I can relax and have real conversations."
        ask: emma
        by: tom
        phrases: ["get-togethers", "too noisy to…", "real conversations"]
      - q: "Do people in your country still send birthday cards?"
        a: "Some older people do, but most young people just send a message on their phone. I still like sending cards, because they feel more personal."
        ask: tom
        by: emma
        phrases: ["Some older people do", "send a message", "more personal"]
