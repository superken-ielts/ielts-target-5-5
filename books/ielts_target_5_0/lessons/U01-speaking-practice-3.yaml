  - kind: qa
    chapter: "Hỏi qua lại: các giai đoạn cuộc đời"
    heading: "Tom and Emma ask each other · Stages of life"
    heading_vi: "Các giai đoạn cuộc đời — childhood, teenager, adult, retire"
    items:
      - q: "Which stage of life do you think is the best?"
        a: "I think childhood is the best. Children don't have many worries, and they can play all day. I had a really happy childhood in Da Lat."
        ask: emma
        by: tom
        phrases: ["I think… is the best", "many worries", "a happy childhood"]
      - q: "Was it difficult being a teenager, Emma?"
        a: "Yes, sometimes. I worried a lot about how I looked, and about what other people thought of me. But I had good friends, and they helped me through it."
        ask: tom
        by: emma
        phrases: ["Yes, sometimes.", "I worried a lot about…", "helped me through it"]
      - q: "When does someone become an adult in your country?"
        a: "Officially at eighteen. Then you can vote and get a driving licence. But I think you really become an adult when you start to pay your own bills!"
        ask: emma
        by: tom
        phrases: ["Officially at eighteen", "get a driving licence", "pay your own bills"]
      - q: "What do people in your country usually do when they retire?"
        a: "Many people travel, or they spend more time with their grandchildren. Some people also do voluntary work, or they take up a new hobby, like painting or golf."
        ask: tom
        by: emma
        phrases: ["spend more time with…", "voluntary work", "take up a new hobby"]
      - q: "Would you like to retire early?"
        a: "Maybe at sixty. I'd like to have enough time and energy to travel. But I don't want to stop working completely, because I'd get bored."
        ask: emma
        by: tom
        phrases: ["Maybe at sixty", "time and energy", "I'd get bored"]
      - q: "Is it better to be young or old?"
        a: "Both have good points. Young people have energy and lots of choices, but older people have experience, and they worry less. I'm happy with my age right now!"
        ask: tom
        by: emma
        phrases: ["Both have good points", "they worry less", "I'm happy with…"]
      - q: "What are you looking forward to in the next stage of your life?"
        a: "I'm looking forward to finishing university and getting my first real job. I'd also love to rent my own flat, so I can decorate it the way I like."
        ask: emma
        by: tom
        phrases: ["I'm looking forward to + -ing", "my first real job", "the way I like"]
      - q: "How do older people spend their free time where you live?"
        a: "In my neighbourhood, many older people go to the park early in the morning. They walk, do exercises together, and chat. They're much more active than I am!"
        ask: tom
        by: emma
        phrases: ["early in the morning", "do exercises together", "more active than I am"]
