      - {box: [180, 188, 297, 346]}
      - {box: [301, 188, 418, 346]}
      - {box: [421, 188, 538, 346]}
      - {box: [60, 350, 406, 364]}
    lines:
      - emma: "Speaking 1: how people think. Exercise A. Look at the pictures. With a partner, talk about how each person has to think. Here's the example."
        say: "Speaking one: how people think. Exercise eigh. Look at the pictures. With a partner, talk about how each person has to think. Here's the example."
        focus: 4
        vi: "Bài A: nhìn ảnh, nói xem mỗi người phải suy nghĩ thế nào. Đây là câu mẫu."
      - {emma: "The businessmen have to calculate, consider options and make decisions.", focus: 3, vi: "Các doanh nhân phải tính toán, cân nhắc các phương án và ra quyết định."}
      - emma: "Now pause the video and talk about the doctor, the clothes designer and the surveyor. Use the verbs from Vocabulary 1."
        say: "Now pause the video and talk about the doctor, the clothes designer and the surveyor. Yooz the verbs from Vocabulary one."
        vi: "Tạm dừng video, nói về bác sĩ, nhà thiết kế và người khảo sát — dùng động từ ở Vocabulary 1."
        pause: 1.5
      - tom: "A doctor has to concentrate and consider all the facts. Then he has to make quick decisions about the best treatment."
        focus: 0
        vi: "Bác sĩ phải tập trung, cân nhắc mọi dữ kiện, rồi quyết định nhanh cách điều trị tốt nhất."
      - mai: "A clothes designer has to use her imagination. She also has to predict what people will want to wear next year."
        say: "A clothes designer has to yooz her imagination. She also has to predict what people will want to wear next year."
        focus: 1
        vi: "Nhà thiết kế phải dùng trí tưởng tượng, và dự đoán năm sau mọi người muốn mặc gì."
      - tom: "A surveyor measures land. He has to calculate distances and angles, and he has to concentrate, because a small mistake can be a big problem."
        focus: 2
        vi: "Người khảo sát đo đạc đất: phải tính khoảng cách, góc, và tập trung — sai một chút là thành chuyện lớn."
      - emma: "Very good. You used have to, plus the verbs: concentrate, consider, decide, imagine, predict and calculate."
        focus: 3
        vi: "Tốt lắm: have to + các động từ chỉ cách suy nghĩ."

