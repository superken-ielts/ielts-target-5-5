# Video bài giảng Unit 5 · Speaking 1: how people think, Speaking 2: expressing opinions (sách in trang 59).
# Dựng: cd agents && python -m lesson_video build ../books/ielts_target_5_0/lessons/U05-speaking-2.yaml
# Cách viết: xem đầu file U01-speaking-1.yaml; khuôn Unit 4 (đợt 31), đáp án hiện sau (đợt 34): làm trước, nghe xong mới hiện
# tất cả đáp án, rồi đọc lại. Track 50 (Speaking 2B) và Track 51 (2C, phát lại Track 50) không có file nghe: Emma đọc vai
# giám khảo, Jerry là Speaker A, Mai là Speaker B, đúng Tapescript (sách in trang 286). Answer key không có trang này:
# 2B suy ra — câu trả lời tốt hơn là câu nêu ý kiến hoặc nói thêm (1 B, 2 B, 3 A, 4 B, 5 A); 2C theo Tapescript (forward,
# mind, enjoy, keen). Câu trả lời mẫu của Tom theo hồ sơ file 06 mục 9.4 (sinh viên năm hai ở TP. Hồ Chí Minh, lớn lên ở Đà
# Lạt, làm thêm ở quán cà phê, chơi bóng rổ).
# Hình trong sách: bốn ảnh Speaking 1A (khung đỏ theo ảnh), Exam tip và năm câu hỏi Speaking 2A tr. 59. Không đếm ngược.
id: U05-speaking-2
activity: U05-speaking-vocab
title: "Unit 5 · Thoughts"
subtitle: "Speaking 1–2: how people think, expressing opinions"
title_vi: "Nói về cách mỗi nghề phải suy nghĩ; trả lời Phần 1 bài thi Nói có nêu ý kiến (Track 50–51)"
tag: "UNIT 5 · THOUGHTS"
speakers:
  # giọng theo bộ đọc: kokoro (mặc định khi có model) hoặc flite (dự phòng, có sẵn trên Ubuntu)
  emma: {name: Emma, role: teacher, color: "#C8102E", voice: {kokoro: af_heart, flite: slt}}
  tom: {name: Tom, role: student, color: "#1F5FAD", voice: {kokoro: am_michael, flite: rms}}
  mai: {name: Mai, role: student, color: "#2E7D32", voice: {kokoro: af_bella, flite: slt}}
  jerry: {name: Jerry, role: guest, color: "#6A4C93", voice: {kokoro: am_liam, flite: awb}}

scenes:
  - kind: title
    chapter: "Giới thiệu"
    lines:
      - emma: "Welcome back to Unit 5. In this lesson, we use the new words to talk about how people think. Then we practise an important exam skill: expressing an opinion."
        say: "Welcome back to Unit five. In this lesson, we yooz the new words to talk about how people think. Then we practise an important exam skill: expressing an opinion."
        vi: "Bài này: dùng từ mới để nói về cách mọi người suy nghĩ, rồi luyện kỹ năng nêu ý kiến trong bài thi Nói."
      - tom: "Expressing an opinion. Like: I think this lesson is great?"
        vi: "Nêu ý kiến — kiểu như: I think this lesson is great?"
      - emma: "Exactly like that."
        vi: "Đúng vậy."

  - kind: figure
    chapter: "Speaking 1A: mỗi người phải suy nghĩ thế nào?"
    heading: "Speaking 1A · Talk about how each person has to think"
    heading_vi: "Bốn ảnh tr. 59 — bác sĩ, nhà thiết kế thời trang, người khảo sát đo đạc, doanh nhân"
    image: {pdf: course-book, page: 60, clip: [58, 168, 540, 366]}
    items:
