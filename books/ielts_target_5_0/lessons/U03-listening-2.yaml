      - {wait: 5, note: "Check your answers", vi: "Xem lại bài."}
      - {emma: "Extract one.", focus: 0}
      - {tom: "Picture b. A new person starts in the office.", say: "Picture B. A new person starts in the office.", reveal: 1}
