        vi: "Có nhắc vườn và bãi đỗ xe — nhưng đều thuộc tòa nhà mới. Đó là bẫy."
      - {emma: "Number nine.", focus: 1}
      - {tom: "c. Some people lock up bicycles, and there are spaces for thirty cars.", say: "C. Some people lock up bicycles, and there are spaces for thirty cars.", reveal: 9}

