        vi: "Listening 2: luyện nghe ý chính."
      - emma: "The exam tip: sometimes you will need to listen for gist rather than for specific information. But remember: understanding gist will help you understand details, too."
        vi: "Mẹo thi: có lúc chỉ cần nghe ý chính; nhưng hiểu ý chính cũng giúp hiểu chi tiết."
      - tom: "So first the gist, then the details."

