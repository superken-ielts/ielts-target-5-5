# Hồ sơ lộ trình JLPT N5 cho agent book_ingest — mẫu lessons-v1 (agents/book_ingest/lessons.py):
# không có file sách trong repo (GENKI là sách có bản quyền — học bằng sách bạn đã mua và app OTO Navi),
# toàn bộ cấu trúc khai ở đây. Mỗi bước trong `steps` là một phiên học; video bài giảng gắn vào hoạt động
# U<nn>-<bước> (ví dụ U01-part-a), kịch bản ở lessons/. Thiết kế: docs/agent-hoc-tap/07-lo-trinh-n5-tieng-nhat.md.

book: genki-1-n5
title: GENKI I (3rd Edition) · lộ trình JLPT N5
edition: japan-times-2020
template: lessons-v1
start_week: 1
sessions_per_week: 4
minutes_per_session: 60
pace: [3, 4, 5]

info:
  course: ja-n5
  role: Giáo trình chính · lộ trình N5
  module: Tiếng Nhật sơ cấp
  author: Banno Eri, Ikeda Yoko, Ohno Yutaka, Shinagawa Chikako, Tokashiki Kyoko
  publisher: The Japan Times (3rd Edition, 2020)
  level: JLPT N5
  cefr: A1
  summary: >-
    GENKI I gồm 12 bài, phủ ngữ pháp JLPT N5; mỗi bài có phần 会話・文法 (hội thoại, từ vựng, ngữ pháp, luyện tập) và
    phần 読み書き (kana, chữ Hán, bài đọc). Lộ trình này theo bản thiết kế "Genki I × IELTS Target 5.0": mỗi bài ba
    video — Part A ngữ pháp cốt lõi, Part B mẫu câu, Part C nói và viết theo một chủ đề IELTS. Emma giảng bằng tiếng
    Anh, giọng Nhật đọc câu mẫu để nhại theo, màn hình có furigana, romaji, nghĩa tiếng Việt và Hán-Việt. Đã có video
    Unit 1–5 (15 tập); Unit 6–12 học thẳng bằng sách, video làm sau.
  start_when: >-
    Không cần biết tiếng Nhật. Lời giảng trong video là tiếng Anh khoảng A2–B1 (có phụ đề tiếng Việt trên màn hình),
    nên hợp nhất khi đã qua giai đoạn 1 của lộ trình IELTS. Cần sách GENKI I (3rd Edition), Workbook và app OTO Navi
    (audio của sách).

missing: [genki-textbook, genki-workbook, oto-navi-audio]

steps:
  - id: words
    title: Từ vựng & hội thoại
    skill: vocab
    note: >-
      GENKI I · 会話・文法 bài {no}: nghe phần 会話 (hội thoại) bằng app OTO Navi, đọc theo; học 単語 (từ vựng) của bài
      và làm thẻ Anki. Chủ đề: {topic}.
  - id: part-a
    title: Part A · Ngữ pháp cốt lõi
    skill: grammar
    core: true
    note: >-
      Xem video Part A của unit (nếu đã có), rồi đọc phần 文法 tương ứng trong GENKI I bài {no} và làm 練習 của những
      điểm đó. Ngữ pháp của bài: {grammar}.
  - id: part-b
    title: Part B · Mẫu câu
    skill: grammar
    note: >-
      Xem video Part B (nếu đã có), đọc các điểm 文法 còn lại của bài {no}, làm 練習; đọc to từng câu mẫu, dùng nút
      "Lặp chương này" để nhại theo giọng Nhật.
  - id: part-c
    title: Part C · Nói & viết theo chủ đề IELTS
    skill: speaking
    core: true
    note: >-
      Xem video Part C (nếu đã có) và nhại theo cả đoạn văn mẫu. Viết đoạn văn 5–6 câu của riêng bạn về {topic}, chỉ
      dùng ngữ pháp đã học, rồi ghi âm và nghe lại. Làm まとめの練習 cuối bài.
  - id: read-write
    title: Đọc – viết
    skill: reading
    note: >-
      GENKI I · 読み書き bài {no}: {kana}. Viết tay từng chữ theo đúng thứ tự nét, đọc to bài đọc của bài.
  - id: workbook
    title: Workbook & ôn bài
    skill: other
    note: >-
      Workbook bài {no} (ngữ pháp, nghe, chữ). Làm lại câu sai, ghi vào sổ lỗi, ôn thẻ Anki của bài.

toc:
  sections:
    - id: S1
      title: Giai đoạn 1 · Nền tảng (40%)
      items:
        - unit: 0
          title: Chuẩn bị · hệ chữ, chào hỏi, số đếm
          steps:
            - id: kana
              title: Hệ chữ Nhật & hiragana
              skill: reading
              note: >-
                Đọc phần giới thiệu hệ chữ Nhật ở đầu GENKI I (hiragana, katakana, chữ Hán). Bắt đầu học bảng hiragana
                (読み書き bài 1): mỗi ngày 10–15 chữ, đọc to và viết tay. Chưa cần thuộc hết — Unit 1 học tiếp.
            - id: greetings
              title: Chào hỏi & số đếm
              skill: speaking
              note: >-
                Phần chào hỏi (あいさつ) và số đếm ở đầu GENKI I: nghe bằng OTO Navi, nhắc lại từng câu chào; đếm từ
                0 đến 100 thành tiếng.
        - unit: 1
          title: New Friends · 新しい友達
          topic: giới thiệu bản thân, công việc, giờ giấc (IELTS Speaking Part 1)
          kana: hoàn thành bảng hiragana (âm đục, âm ghép, âm ngắt)
          grammar: [X は Y です, câu hỏi với か và từ để hỏi なん・なんさい・なんじ, Noun1 の Noun2]
          notes:
            part-a: >-
              Xem video EP 1.1, rồi đọc 文法 1–2 của GENKI I bài 1 (X は Y です; câu hỏi với か, なん) và làm 練習
              tương ứng.
            part-b: >-
              Xem video EP 1.2, đọc 文法 3 (Noun1 の Noun2) và phần số, giờ (～じ, ～はん, ごぜん/ごご), tuổi (～さい);
              làm 練習. Nhại theo giọng Nhật bằng nút "Lặp chương này".
        - unit: 2
          title: Shopping · 買い物
          topic: mua sắm, giá cả, đồ dùng cá nhân
          kana: bảng katakana
          grammar: [これ・それ・あれ・どれ, この・その・あの・どの + danh từ, ここ・そこ・あそこ・どこ, だれの + danh từ,
                    danh từ + も, danh từ + じゃないです, ～ね / ～よ]
          notes:
            part-a: >-
              Xem video EP 2.1, rồi đọc 文法 1–3 của GENKI I bài 2 (これ/この/ここ…) và số tiền (ひゃく, せん, まん,
              いくらですか); làm 練習.
            part-b: >-
              Xem video EP 2.2, đọc 文法 4–7 (だれの, も, じゃないです, ね/よ) và làm 練習.
        - unit: 3
          title: Making a Date · デートの約束
          topic: thói quen hằng ngày và hoạt động cuối tuần
          kana: chữ Hán của bài 3 và bài đọc
          grammar: [chia động từ thể ます / ません và ba nhóm động từ, trợ từ を・で・に・へ, từ chỉ thời gian có và không có に,
                    lời mời ～ませんか, trạng từ tần suất]
          notes:
            part-a: >-
              Xem video EP 3.1, rồi đọc 文法 1–2 của GENKI I bài 3 (chia động từ, nhóm động từ) và 文法 5 (～ませんか);
              làm 練習.
            part-b: >-
              Xem video EP 3.2, đọc 文法 3–4 (trợ từ を・で・に・へ, từ chỉ thời gian) và làm 練習.
            part-c: >-
              Xem video EP 3.3 (trạng từ tần suất + đoạn văn về một ngày của bạn), nhại theo cả đoạn; đọc mục trạng từ
              tần suất trong sách. Viết đoạn văn 5–6 câu về thói quen của bạn rồi ghi âm. Làm まとめの練習.
        - unit: 4
          title: The First Date · 初めてのデート
          topic: mô tả khu nhà ở và kể lại cuối tuần trước
          kana: chữ Hán của bài 4 và bài đọc
          grammar: [X があります / います, vị trí với の + うえ・した・まえ・となり…, quá khứ của です, quá khứ của động từ,
                    も, ～時間, たくさん, と]
          notes:
            part-a: >-
              Xem video EP 4.1, rồi đọc 文法 1–2 của GENKI I bài 4 (があります/います, vị trí) và làm 練習.
            part-b: >-
              Xem video EP 4.2, đọc 文法 3–8 (quá khứ của です và của động từ, も, ～時間, たくさん, と); làm 練習.
        - unit: 5
          title: A Trip to Okinawa · 沖縄旅行
          topic: kể về một chuyến đi, sở thích và ấn tượng
          kana: chữ Hán của bài 5 và bài đọc
          grammar: [tính từ い / な ở hiện tại, tính từ ở quá khứ, tính từ bổ nghĩa danh từ, 好き / きらい, ～ましょう / ～ましょうか,
                    đếm đồ vật mỏng ～まい]
          notes:
            part-a: >-
              Xem video EP 5.1, rồi đọc các mục tính từ (hiện tại, bổ nghĩa danh từ) của GENKI I bài 5 và làm 練習.
            part-b: >-
              Xem video EP 5.2, đọc mục tính từ quá khứ, 好き/きらい và ～ましょう; làm 練習.
    - id: S2
      title: Giai đoạn 2 · Mở rộng theo chủ đề (60%)
      items:
        - unit: 6
          title: A Day in Robert's Life · ロバートさんの一日
          topic: một ngày của bạn, nhờ vả và xin phép
          kana: chữ Hán của bài 6 và bài đọc
          grammar: [thể て, ～てください, ～てもいいです, ～てはいけません, nối hai hành động bằng thể て, ～から (vì),
                    ～ましょうか (đề nghị giúp)]
        - unit: 7
          title: Family Picture · 家族の写真
          topic: gia đình và mô tả người
          kana: chữ Hán của bài 7 và bài đọc
          grammar: [～ている (đang làm, trạng thái), mô tả người (髪が長い), nối câu bằng thể て, động từ + に行く,
                    đếm người ～人]
        - unit: 8
          title: Barbecue · バーベキュー
          topic: nêu ý kiến và kể lại lời người khác
          kana: chữ Hán của bài 8 và bài đọc
          grammar: [thể ngắn (thể thường), văn nói thân mật, ～と思います, ～と言っていました, ～ないでください,
                    động từ + のが好きです, trợ từ が, 何か / 何も]
        - unit: 9
          title: Kabuki · かぶき
          topic: kể chuyện đã qua và giải thích lý do
          kana: chữ Hán của bài 9 và bài đọc
          grammar: [quá khứ thể ngắn, mệnh đề bổ nghĩa danh từ, もう～ました, ～から (giải thích lý do)]
        - unit: 10
          title: Winter Vacation Plans · 冬休みの予定
          topic: so sánh và kế hoạch
          kana: chữ Hán của bài 10 và bài đọc
          grammar: [so sánh hai vật, so sánh nhất, tính từ / danh từ + の, ～つもりだ, tính từ + なる,
                    どこかに / どこにも, で (phương tiện)]
        - unit: 11
          title: After the Vacation · 休みのあと
          topic: mong muốn và trải nghiệm
          kana: chữ Hán của bài 11 và bài đọc
          grammar: [～たい, ～たり～たりする, ～ことがある, danh từ A や danh từ B]
        - unit: 12
          title: Feeling Ill · 病気
          topic: sức khỏe, giải thích và lời khuyên
          kana: chữ Hán của bài 12 và bài đọc
          grammar: [～んです, ～すぎる, ～ほうがいいです, ～ので, ～なければいけません, ～でしょう]
        - test: 1
          title: Ôn thi JLPT N5
          steps:
            - id: moji-goi
              title: 文字・語彙 · chữ và từ vựng
              skill: vocab
              note: >-
                Làm phần 文字・語彙 của đề mẫu N5 chính thức (jlpt.jp, miễn phí), chấm, ôn lại chữ Hán và từ sai bằng
                Anki.
            - id: bunpo-dokkai
              title: 文法・読解 · ngữ pháp và đọc hiểu
              skill: reading
              note: >-
                Làm phần 文法・読解 của đề mẫu N5; câu sai thì mở lại bài GENKI có điểm ngữ pháp đó và ghi sổ lỗi.
            - id: choukai
              title: 聴解 · nghe hiểu
              skill: listening
              note: >-
                Làm phần 聴解 của đề mẫu N5 bằng file nghe đi kèm; nghe lại câu sai với bản ghi lời.
            - id: mock
              title: Thi thử trọn đề
              skill: other
              core: true
              minutes: 120
              note: >-
                Thi thử cả ba phần đúng thời gian của kỳ thi N5, không tra cứu. Chấm, ghi sổ lỗi, quyết định ôn thêm
                phần nào trước ngày thi.
