# EP 1.2 — GENKI I bài 1, Part B (bản thiết kế: EP_01_02). Xem ghi chú đầu file EP_01_01.yaml.
# Bộ đọc đọc sai 九時 (きゅうじ), 二十八歳 (はちさい) và không đọc được chữ IT → `say` viết kana ở các chỗ đó.
id: EP_01_02
activity: U01-part-b
title: "Unit 1 · New Friends"
subtitle: "EP 1.2 · Connecting Nouns with 'no', Age & Telling Time"
title_vi: "Phần B — Danh từ の danh từ, tuổi và giờ"
tag: "TARGET N5 • 5.0"
gap: 0
scene_gap: 0
speakers:
  emma: {name: Emma, role: grammar & topic guide, voice: {kokoro: bf_emma}, color: "#00A8B5", speed: 1.0}
  yuki: {name: Yuki, role: Japanese tutor · listen & shadow, lang: ja, voice: {kokoro: jf_alpha}, color: "#F39C12", speed: 0.88}

scenes:
  - kind: jp
    chapter: "Particle の"
    heading: "Unit 1.2: Particle [ Noun 1 の Noun 2 ]"
    items:
      - jp: "さくら{大学|だいがく}の{学生|がくせい} / {IT|アイティー}の{会社員|かいしゃいん}"
        romaji: "Sakura daigaku no gakusei / Ai-tii no kaishain"
        en: "Grammar Point 3: Particle 'no' connects two nouns. The main noun always comes second."
        vi: "Điểm ngữ pháp 3: Trợ từ 'no' nối 2 danh từ (Sinh viên của ĐH Sakura / Nhân viên công ty IT)."
    lines:
      - emma: "Welcome to Unit 1, Part B! Grammar Point 3 in Genki is Noun 1 no Noun 2. The particle 'no' connects two nouns, where Noun 1 modifies or owns Noun 2."
        say: "Welcome to Unit 1, Part B! Grammar Point 3 in Ghen-kee is Noun 1 no Noun 2. The particle 'no' connects two nouns, where Noun 1 modifies or owns Noun 2."
        pause: 0.6

  - kind: jp
    chapter: "Shadowing: affiliation with の"
    heading: "Shadowing: Affiliation with 'no'"
    items:
      - jp: "わたしは {IT|アイティー}の{会社員|かいしゃいん}です。"
        romaji: "Watashi wa ai-tii no kaishain desu."
        en: "I am an IT company employee."
        vi: "Tôi là nhân viên công ty IT."
    lines:
      - yuki: "わたしはITの会社員です。"
        say: "わたしはアイティーの会社員です。"
        pause: 1.8

  - kind: jp
    chapter: "Telling time & age"
    heading: "Unit 1.2: Telling Time & Age"
    items:
      - jp: "{午前九時半|ごぜんくじはん} / {二十八歳|にじゅうはっさい}"
        romaji: "Gozen ku-ji han / Nijuu-hassai"
        en: "9:30 AM (Gozen ku-ji han) / 28 years old (Nijuu-hassai)."
        vi: "9 giờ rưỡi sáng (Gozen = Sáng, Gogo = Chiều) / 28 tuổi (Lưu ý biến âm: 8 tuổi = hassai)."
    lines:
      - emma: "Next, let's tell time and age. Use 'jee' for o'clock, 'han' for half past, and 'sai' for years old. Listen and repeat!"
        pause: 0.5

  - kind: jp
    chapter: "Shadowing: time & age"
    heading: "Shadowing: Time & Age"
    items:
      - jp: "いま、{午前九時半|ごぜんくじはん}です。わたしは{二十八歳|にじゅうはっさい}です。"
        romaji: "Ima, gozen ku-ji han desu. Watashi wa nijuu-hassai desu."
        en: "It is 9:30 AM now. I am 28 years old."
        vi: "Bây giờ là 9 giờ rưỡi sáng. Tôi 28 tuổi."
    lines:
      - yuki: "いま、午前九時半です。わたしは二十八歳です。"
        say: "いま、午前くじ半です。わたしは二十はっさいです。"
        pause: 2.0
