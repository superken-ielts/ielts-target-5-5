# EP 1.1 — GENKI I bài 1, Part A. Lấy từ bản thiết kế "Genki I × IELTS Target 5.0" (episode EP_01_01), giữ lời thoại,
# chữ trên màn hình, tốc độ và khoảng lặng; chỗ sửa ghi ở docs/agent-hoc-tap/07-lo-trinh-n5-tieng-nhat.md mục 2.
# Emma giảng tiếng Anh (bf_emma, tốc độ 1.0), Yuki đọc câu tiếng Nhật (jf_alpha, 0.88). `pause` = khoảng lặng sau câu.
# Chữ Nhật viết furigana {漢字|かんじ}; `say` = cách đọc bằng kana ở chỗ bộ đọc đọc sai (lệnh check tự so với furigana).
# Lời Emma: `say` viết lại từ Nhật cho giọng Anh — bộ đọc tiếng Anh đọc sai cách viết của bản thiết kế (a-re → ay-ree,
# chi-ka-ku → kye-kah-koo, Genki → jeng-kee), nên dùng ah-reh, chee-kah-koo, Ghen-kee, eye-elts (IELTS).
id: EP_01_01
activity: U01-part-a
title: "Unit 1 · New Friends"
subtitle: "EP 1.1 · X wa Y desu & Question Sentences with 'ka'"
title_vi: "Phần A — X は Y です và câu hỏi với か"
tag: "TARGET N5 • 5.0"
gap: 0
scene_gap: 0
speakers:
  emma: {name: Emma, role: grammar & topic guide, voice: {kokoro: bf_emma}, color: "#00A8B5", speed: 1.0}
  yuki: {name: Yuki, role: Japanese tutor · listen & shadow, lang: ja, voice: {kokoro: jf_alpha}, color: "#F39C12", speed: 0.88}

scenes:
  - kind: jp
    chapter: "Core pattern: X は Y です"
    heading: "Unit 1.1: Core Pattern [ X は Y です ]"
    items:
      - jp: "X は Y です"
        romaji: "X wa Y desu"
        en: "Grammar Point 1: 'X wa Y desu'. 'Wa' marks the topic, and 'desu' means 'to be'."
        vi: "Điểm ngữ pháp 1: [X là Y]. Trợ từ 'は' (đọc là 'wa') đánh dấu chủ đề, 'desu' nghĩa là 'là'."
    lines:
      - emma: "Welcome to Unit 1, Part A! In Genki 1, our first grammar point is X wa Y des. 'Wa' marks the topic of the sentence, and 'des' means am, is, or are."
        say: "Welcome to Unit 1, Part A! In Ghen-kee 1, our first grammar point is X wa Y des. 'Wa' marks the topic of the sentence, and 'des' means am, is, or are."
        pause: 0.6

  - kind: jp
    chapter: "Shadowing: student & office worker"
    heading: "Shadowing: Student & Office Worker"
    items:
      - jp: "わたしは {留学生|りゅうがくせい}です。 / わたしは {会社員|かいしゃいん}です。"
        romaji: "Watashi wa ryuugakusei desu. / Watashi wa kaishain desu."
        en: "I am an international student. / I am an office worker."
        vi: "Tôi là du học sinh (Lưu học sinh). / Tôi là nhân viên công ty (Hội xã viên)."
    lines:
      - yuki: "わたしは留学生です。わたしは会社員です。"
        pause: 1.8

  - kind: jp
    chapter: "Questions with か"
    heading: "Unit 1.1: Question Pattern [ ... か？ ]"
    items:
      - jp: "{専攻|せんこう}は{何|なん}ですか？ / お{仕事|しごと}は{何|なん}ですか？"
        romaji: "Senkou wa nan desu ka? / Oshigoto wa nan desu ka?"
        en: "Add 'ka' at the end to form a question. 'Nan' means 'what'."
        vi: "Điểm ngữ pháp 2: Thêm 'ka' vào cuối câu để hỏi. 'Senkou' = Chuyên ngành, 'Shigoto' = Công việc."
    lines:
      - emma: "Grammar Point 2: To ask a question in Japanese, just add 'ka' to the end of the sentence with a rising intonation. Use 'nan' to ask 'what'."
        pause: 0.5

  - kind: jp
    chapter: "Shadowing: asking about work"
    heading: "Shadowing: Asking & Answering Occupation"
    items:
      - jp: "お{仕事|しごと}は {何|なん}ですか？ — エンジニアです。"
        romaji: "Oshigoto wa nan desu ka? — Enjinia desu."
        en: "What is your occupation? — I am an engineer."
        vi: "Công việc của bạn là gì? — Tôi là kỹ sư (Có thể lược bỏ 'Watashi wa')."
    lines:
      - yuki: "お仕事は何ですか？エンジニアです。"
        pause: 2.0
