scenes:
  - kind: jp
    chapter: "これ・それ vs この・その"
    heading: "Unit 2.1: Demonstratives [ これ・それ vs この・その ]"
    items:
      - jp: "これ (This) / この + Noun (This Noun)"
        romaji: "Kore / Sore / Are vs. Kono / Sono / Ano + Noun"
        en: "Grammar 1 & 2: Standalone (Kore/Sore/Are) vs. Modifying a noun (Kono/Sono/Ano + Noun)."
        vi: "Điểm ngữ pháp 1 & 2: 'Kore/Sore/Are' đứng một mình. 'Kono/Sono/Ano' bắt buộc phải có Danh từ theo sau."
    lines:
      - emma: "Welcome to Unit 2, Part A! In Genki Lesson 2, Grammar Point 1 and 2 teach us how to point at things. Use 'ko-re' for this near me, 'so-re' for that near you, and 'a-re' for that over there. If you attach a noun directly, change them to 'ko-no', 'so-no', and 'a-no'!"
        say: "Welcome to Unit 2, Part A! In Ghen-kee Lesson 2, Grammar Point 1 and 2 teach us how to point at things. Use 'koh-reh' for this near me, 'soh-reh' for that near you, and 'ah-reh' for that over there. If you attach a noun directly, change them to 'koh-noh', 'soh-noh', and 'ah-noh'!"
        pause: 0.6

  - kind: jp
    chapter: "Shadowing: asking prices"
    heading: "Shadowing: Asking Prices"
    items:
      - jp: "これは いくらですか？ / このパソコンは いくらですか？"
        romaji: "Kore wa ikura desu ka? / Kono pasokon wa ikura desu ka?"
        en: "How much is this? / How much is this laptop?"
        vi: "Cái này bao nhiêu tiền? / Chiếc máy tính cá nhân (pasokon) này bao nhiêu tiền?"
    lines:
      - yuki: "これはいくらですか？このパソコンはいくらですか？"
        pause: 1.8

  - kind: jp
    chapter: "Big numbers & places"
    heading: "Unit 2.1: Big Numbers & Places [ ここ・そこ・どこ ]"
    items:
      - jp: "{三千円|さんぜんえん} / {十万円|じゅうまんえん}"
        romaji: "San-zen en (3,000 yen) / Juu-man en (100,000 yen)"
        en: "1,000 = sen | 10,000 = ichi-man. Places: Koko (here), Soko (there), Doko (where)."
        vi: "Đơn vị tiền: Sen (Nghìn), Man (Vạn = 10.000). Nơi chốn: Koko (đây), Soko (đó), Doko (ở đâu)."
    lines:
      - emma: "For large numbers in Japanese yen, remember 'sen' is one thousand, and 'ichi-man' is ten thousand. Also, Grammar Point 3 uses 'ko-ko', 'so-ko', 'a-so-ko', and 'do-ko' for places!"
        say: "For large numbers in Japanese yen, remember 'sen' is one thousand, and 'ee-chee-mahn' is ten thousand. Also, Grammar Point 3 uses 'koh-koh', 'soh-koh', 'ah-soh-koh', and 'doh-koh' for places!"
        pause: 0.5

  - kind: jp
    chapter: "Shadowing: price & location"
    heading: "Shadowing: Price & Location"
    items:
      - jp: "このパソコンは {十万円|じゅうまんえん}です。トイレは どこですか？ あそこです。"
        romaji: "Kono pasokon wa juu-man en desu. Toire wa doko desu ka? Asoko desu."
        en: "This laptop is 100,000 yen. Where is the restroom? It's over there."
        vi: "Chiếc laptop này giá 10 vạn yên. Nhà vệ sinh ở đâu vậy? Ở đằng kia."
    lines:
      - yuki: "このパソコンは十万円です。トイレはどこですか？あそこです。"
        pause: 2.0
