# Hồ sơ lộ trình JLPT N5 cho agent book_ingest — mẫu lessons-v1 (agents/book_ingest/lessons.py). Thư mục này có
# GENKI I (3rd Edition) Textbook + Workbook (PDF) và audio của cả hai cuốn (MP3); cấu trúc lộ trình và chỗ trong sách
# của từng phiên đều khai ở đây, agent chỉ quét file, cắt PDF thành đoạn theo từng bài rồi dựng book.json / plan.json.
# Mỗi bước trong `steps` là một phiên học; video bài giảng gắn vào hoạt động U<nn>-<bước> (ví dụ U01-part-a), kịch bản
# ở lessons/. Thiết kế và cách dò trang: docs/agent-hoc-tap/07-lo-trinh-n5-tieng-nhat.md.
#
# `pages` trong `refs` là SỐ TRANG IN (trang in = trang PDF − page_offset). Track ghi theo nhãn in cạnh bài tập trong
# sách: K01_05.mp3 → K01-05, W01_A.mp3 → W01-A, W_JWS1.mp3 → W-JWS1; "A..B" là mọi track từ A tới B. Mỗi track phải
# thuộc đúng một phiên. Ranh giới các phần của mỗi bài (会話 → 単語 → 文法 → 練習 → まとめの練習 → Useful
# Expressions) dò bằng OCR trang sách và nhãn track, rồi soát lại bằng mắt ở trang chuyển phần.

book: genki-1-n5
title: GENKI I (3rd Edition) · lộ trình JLPT N5
edition: japan-times-2020
template: lessons-v1
start_week: 1
sessions_per_week: 4
minutes_per_session: 60
pace: [3, 4, 5]

info:
  course: ja-n5
  role: Giáo trình chính · lộ trình N5
  module: Tiếng Nhật sơ cấp
  author: Banno Eri, Ikeda Yoko, Ohno Yutaka, Shinagawa Chikako, Tokashiki Kyoko
  publisher: The Japan Times (3rd Edition, 2020)
  level: JLPT N5
  cefr: A1
  summary: >-
    GENKI I gồm 12 bài, phủ ngữ pháp JLPT N5; mỗi bài có phần 会話・文法 (hội thoại, từ vựng, ngữ pháp, luyện tập) và
    phần 読み書き (kana, chữ Hán, bài đọc). Mỗi bài học trong 6 phiên, mỗi phiên mở đúng trang Textbook / Workbook và
    track audio của phần đó. Theo bản thiết kế "Genki I × IELTS Target 5.0", bài 1–5 có thêm ba video — Part A ngữ
    pháp cốt lõi, Part B mẫu câu, Part C nói và viết theo một chủ đề IELTS: Emma giảng bằng tiếng Anh, giọng Nhật đọc
    câu mẫu để nhại theo, màn hình có furigana, romaji, nghĩa tiếng Việt và Hán-Việt. Bài 6–12 học bằng sách, video
    làm sau.
  start_when: >-
    Không cần biết tiếng Nhật: Unit 0 học hệ chữ và chào hỏi. Lời giảng trong sách và video là tiếng Anh khoảng A2–B1
    (video có phụ đề tiếng Việt trên màn hình), nên hợp nhất khi đã qua giai đoạn 1 của lộ trình IELTS.

files:
  course-book:
    kind: pdf
    label: Textbook
    path: Genki I 3rd Edition Textbook.pdf
    page_offset: 8            # trang in 36 = trang PDF 44
  workbook:
    kind: pdf
    label: Workbook
    path: Genki I 3rd Edition Workbook.pdf
    page_offset: 4            # trang in 16 = trang PDF 20
  audio:
    kind: audio
    dir: Genki I 3rd Edition Textbook       # JWS (hệ chữ), K00–K12 (会話・文法), Y01–Y12 (読み書き)
  wb-audio:
    kind: audio
    dir: Genki I 3rd Edition Workbook       # W00–W12 (聞く練習), WY (viết hiragana), W-JWS1/2

# Đáp án Workbook và lời các bài nghe Workbook nằm trong sách GENKI Answer Key (bán riêng).
missing: [answer-key]

steps:
  - id: words
    title: Hội thoại & từ vựng
    skill: vocab
    note: >-
      GENKI I bài {no} · 会話 và 単語: nghe hội thoại (track đầu tiên), đọc to theo từng câu; học từ vựng của bài
      bằng track J-E (Nhật → Anh) rồi E-J (Anh → Nhật) và làm thẻ Anki. Chủ đề: {topic}.
  - id: part-a
    title: Part A · Ngữ pháp cốt lõi
    skill: grammar
    core: true
    note: >-
      Xem video Part A của unit (nếu đã có), rồi đọc phần 文法 (ngữ pháp) và 表現ノート / Culture Notes của bài {no}.
      Ngữ pháp của bài: {grammar}.
  - id: part-b
    title: Part B · Mẫu câu
    skill: grammar
    note: >-
      Xem video Part B (nếu đã có), rồi làm 練習 (luyện tập) của bài {no}: bài nào có nhãn track thì nghe và nói theo;
      bài Pair Work tự đóng cả hai vai. Dùng nút "Lặp chương này" để nhại theo giọng Nhật trong video.
  - id: part-c
    title: Part C · Nói & viết theo chủ đề
    skill: speaking
    core: true
    note: >-
      Xem video Part C (nếu đã có) và nhại theo cả đoạn văn mẫu. Làm まとめの練習 (ôn tập cuối bài) và đọc Useful
      Expressions, rồi viết đoạn văn 5–6 câu của riêng bạn về {topic}, chỉ dùng ngữ pháp đã học; ghi âm và nghe lại.
  - id: read-write
    title: Đọc – viết
    skill: reading
    note: >-
      GENKI I · 読み書き bài {no}: {kana}. Nghe track của bài, đọc to bài đọc; viết tay từng chữ theo đúng thứ tự nét
      ở trang Workbook (nút bên dưới).
  - id: workbook
    title: Workbook & ôn bài
    skill: other
    note: >-
      Workbook bài {no}: làm các trang ngữ pháp, rồi 聞く練習 (nghe hiểu) bằng các track W của bài. Câu sai ghi vào sổ
      lỗi, ôn thẻ Anki của bài.

toc:
  sections:
    - id: S1
      title: Giai đoạn 1 · Nền tảng (40%)
      items:
        - unit: 0
          title: Chuẩn bị · hệ chữ, chào hỏi, số đếm
          pages: [20, 35]
          steps:
            - id: kana
              title: Hệ chữ Nhật & hiragana
              skill: reading
              note: >-
                Đọc phần Japanese Writing System (hiragana, katakana, chữ Hán) và nghe các track JWS. Bắt đầu học bảng
                hiragana: mỗi ngày 10–15 chữ, đọc to và viết tay ở trang Workbook (W-JWS1). Chưa cần thuộc hết — Unit 1
                học tiếp.
            - id: greetings
              title: Chào hỏi & số đếm
              skill: speaking
              note: >-
                あいさつ (chào hỏi) và すうじ (số đếm): nghe các track K00, nhắc lại từng câu chào; đếm từ 0 đến 100
                thành tiếng. Làm trang Greetings và Numbers của Workbook (W00).
          refs:
            kana: {pages: [20, 27], tracks: "JWS-01..JWS-13, W-JWS1", alt: [{pdf: workbook, pages: [11, 12]}]}
            greetings: {pages: [30, 35], tracks: "K00-01..K00-05, W00", alt: [{pdf: workbook, pages: [13, 15]}]}
