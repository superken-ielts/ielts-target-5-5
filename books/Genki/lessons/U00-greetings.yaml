# U00 · Greetings — GENKI I あいさつ (trang 30–34). Video ~8 phút cho phiên Chào hỏi & số đếm: chào theo giờ trong
# ngày, cảm ơn – xin lỗi, chào tạm biệt, ở nhà, bữa ăn, gặp lần đầu (chú thích của 表現ノート trang 33, văn hóa cúi chào
# trang 32), cả danh sách với audio gốc K00-01, 10 tình huống của bài luyện A (trang 34) dạng đố, tự giới thiệu (bài B).
# Thẻ "なんと いいますか。" là thẻ đề (quiz): Emma đọc tình huống, thẻ đáp án ngay sau.
id: U00-greetings
activity: U00-greetings
title: "Unit 0 · Greetings and Numbers"
subtitle: "Greetings · あいさつ for every situation"
title_vi: "Chào hỏi — câu chào theo tình huống, cúi chào, 10 tình huống nói gì, tự giới thiệu"
tag: "GENKI L0 · N5"
speakers:
  emma: {name: Emma, role: guide, voice: {kokoro: bf_emma}, color: "#00A8B5", speed: 1.0}
  yuki: {name: Yuki, role: Japanese tutor, lang: ja, voice: {kokoro: jf_alpha}, color: "#F39C12", speed: 0.88}
  takeshi: {name: Takeshi, role: Japanese student, lang: ja, voice: {kokoro: jm_kumo}, color: "#8E5BD0", speed: 0.88}

scenes:
  - kind: jp
    chapter: "Goals"
    heading: "Greetings · あいさつ"
    items:
      - jp: "あいさつ"
        romaji: "aisatsu"
        en: "Greetings: the Japanese you will use every day — at school, at work and at home. Each one belongs to a situation."
        vi: "Câu chào hỏi: tiếng Nhật bạn dùng hằng ngày — ở trường, nơi làm việc, ở nhà. Mỗi câu gắn với một tình huống."
    lines:
      - emma: "Welcome back. Today you will learn the Japanese greetings: the words you will use every day, at school, at work and at home. Each greeting belongs to a situation, so we will learn them by situation."
      - yuki: "あいさつ。"
        pause: 1.2

  - kind: jp
    chapter: "Morning, day, evening, night"
    heading: "Morning, day, evening, night"
    items:
      - jp: "おはよう。 / おはよう ございます。"
        romaji: "Ohayoo. / Ohayoo gozaimasu."
        en: "Good morning. The short form for friends and family; add ございます for teachers, colleagues and people you don't know well."
        vi: "Chào buổi sáng. Dạng ngắn với bạn bè, gia đình; thêm ございます với thầy cô, đồng nghiệp, người không thân."
      - jp: "こんにちは。"
        romaji: "Konnichiwa."
        en: "Good afternoon; hello, from late morning. The last letter is written は but read wa."
        vi: "Xin chào (ban ngày, từ cuối buổi sáng). Chữ cuối viết は nhưng đọc là \"wa\"."
      - jp: "こんばんは。"
        romaji: "Konbanwa."
        en: "Good evening. Again, は is read wa."
        vi: "Chào buổi tối. Chữ は cuối cũng đọc là \"wa\"."
      - jp: "おやすみ(なさい)。"
        romaji: "Oyasumi (nasai)."
        en: "Good night — when someone goes to bed. なさい makes it more polite."
        vi: "Chúc ngủ ngon — khi đi ngủ. Thêm なさい thì lịch sự hơn."
    lines:
      - emma: "In the morning, friends and family say the short form. To your teacher, or anyone you don't know well, add the polite ending. Yuki is greeting a friend, and Takeshi is greeting his teacher."
      - yuki: "おはよう。"
        pause: 1
      - takeshi: "おはようございます。"
        pause: 1.8
      - emma: "From late morning: hello, or good afternoon. The last letter is written ha, but you say wa."
        focus: 1
      - yuki: "こんにちは。"
        pause: 1.8
      - emma: "In the evening."
        focus: 2
      - takeshi: "こんばんは。"
        pause: 1.8
      - emma: "And before bed. The longer form is more polite."
        focus: 3
      - yuki: "おやすみなさい。"
        pause: 1.8

  - kind: jp
    chapter: "Thank you, sorry"
    heading: "Thank you, excuse me, not at all"
    items:
      - jp: "ありがとう。 / ありがとう ございます。"
        romaji: "Arigatoo. / Arigatoo gozaimasu."
        en: "Thank you. The same rule: short with friends, long with everyone else."
        vi: "Cảm ơn. Cùng quy tắc: dạng ngắn với bạn bè, dạng dài với người khác."
      - jp: "すみません。"
        romaji: "Sumimasen."
        en: "Three uses: excuse me (to get attention), I'm sorry, and thank you — when someone took trouble for you."
        vi: "Ba nghĩa: xin lỗi cho tôi hỏi (gọi ai đó), tôi xin lỗi, và cảm ơn — khi ai đó đã mất công vì bạn."
      - jp: "いいえ。"
        romaji: "Iie."
        en: "No. After thanks or an apology it means not at all, you're welcome."
        vi: "Không. Đáp lại lời cảm ơn, xin lỗi thì nghĩa là không có gì."
      - jp: "すみません。 — いいえ。"
        romaji: "Sumimasen. — Iie."
        en: "I'm sorry. — Not at all."
        vi: "Xin lỗi. — Không sao đâu."
    lines:
      - emma: "Thank you. Short with friends, long with everyone else."
      - yuki: "ありがとう。"
        pause: 1
      - takeshi: "ありがとうございます。"
        pause: 1.8
      - emma: "This one is very useful. It means excuse me, I'm sorry, and also thank you, when someone took trouble for you."
        focus: 1
      - yuki: "すみません。"
        pause: 1.8
      - emma: "No. After thanks or an apology, it means not at all."
        focus: 2
      - takeshi: "いいえ。"
        pause: 1.8
      - emma: "Together."
        focus: 3
      - yuki: "すみません。"
        pause: 0.8
      - takeshi: "いいえ。"
        pause: 1.8

  - kind: jp
    chapter: "Goodbye"
    heading: "Goodbye · Three ways"
    items:
      - jp: "さようなら。"
        romaji: "Sayoonara."
        en: "Goodbye. It sounds final and formal, as if you won't meet for a while. Every day, school children say it to their teacher."
        vi: "Tạm biệt. Nghe trang trọng, như lâu nữa mới gặp lại. Hằng ngày chủ yếu học sinh chào thầy cô."
      - jp: "じゃあ、また。"
        romaji: "Jaa, mata."
        en: "See you — between friends who will meet again soon."
        vi: "Gặp lại sau nhé — giữa bạn bè sắp gặp lại."
      - jp: "しつれいします。"
        romaji: "Shitsuree shimasu."
        en: "Excuse me for leaving — when you leave a teacher's or a boss's office."
        vi: "Xin phép (tôi đi) — khi rời phòng thầy cô hay sếp."
    lines:
      - emma: "There are several ways to say goodbye. This famous one sounds quite final and formal. In daily life, it is mostly children saying goodbye to their teacher."
      - yuki: "さようなら。"
        pause: 1.8
      - emma: "Between friends, say: see you."
        focus: 1
      - takeshi: "じゃあ、また。"
        pause: 1.8
      - emma: "And when you leave a teacher's office."
        focus: 2
      - yuki: "しつれいします。"
        pause: 1.8

  - kind: jp
    chapter: "At home"
    heading: "Leaving and coming home"
    items:
      - jp: "いってきます。 — いってらっしゃい。"
        romaji: "Itte kimasu. — Itterasshai."
        en: "Leaving home: \"I'll go and come back.\" — \"Please go and come back.\""
        vi: "Rời nhà: \"Con đi đây (rồi về).\" — \"Đi nhé (rồi về).\""
      - jp: "ただいま。 — おかえり(なさい)。"
        romaji: "Tadaima. — Okaeri (nasai)."
        en: "Coming home: \"I'm home.\" — \"Welcome home.\""
        vi: "Về nhà: \"Con về rồi.\" — \"Về rồi à.\""
    lines:
      - emma: "At home, Japanese families use two pairs every day. Takeshi is leaving home, and Yuki answers."
      - takeshi: "いってきます。"
        pause: 0.8
      - yuki: "いってらっしゃい。"
        pause: 1.8
      - emma: "Now he comes back home."
        focus: 1
      - takeshi: "ただいま。"
        pause: 0.8
      - yuki: "おかえりなさい。"
        pause: 1.8

  - kind: jp
    chapter: "Meals"
    heading: "Before and after eating"
    items:
      - jp: "いただきます。"
        romaji: "Itadakimasu."
        en: "Before eating: \"I humbly receive.\" Many people put their hands together."
        vi: "Trước khi ăn: \"Xin phép ăn ạ.\" Nhiều người chắp hai tay."
      - jp: "ごちそうさま(でした)。"
        romaji: "Gochisoosama (deshita)."
        en: "After eating: \"Thank you for the meal.\" You can also say it to the cook or the restaurant staff."
        vi: "Sau khi ăn: \"Cảm ơn vì bữa ăn.\" Có thể nói với người nấu hoặc nhân viên quán."
    lines:
      - emma: "Before eating."
      - yuki: "いただきます。"
        pause: 1.8
      - emma: "And after eating. You can also say it to the cook, or to the restaurant staff as you leave."
        focus: 1
      - takeshi: "ごちそうさまでした。"
        pause: 1.8

  - kind: jp
    chapter: "Meeting someone"
    heading: "Meeting someone for the first time"
    items:
      - jp: "はじめまして。"
        romaji: "Hajimemashite."
        en: "How do you do? Only the first time you meet someone."
        vi: "Rất vui được gặp (lần đầu). Chỉ nói khi gặp lần đầu."
      - jp: "グエン・アンです。"
        romaji: "Guen An desu."
        en: "I am Nguyen Anh. Your name + です."
        vi: "Tôi là Nguyễn Anh. Tên + です."
      - jp: "よろしく おねがいします。"
        romaji: "Yoroshiku onegai shimasu."
        en: "Nice to meet you; please treat me kindly. Bow a little as you say it."
        vi: "Rất mong được giúp đỡ. Vừa nói vừa cúi chào nhẹ."
      - jp: "はじめまして。グエン・アンです。よろしく おねがいします。"
        romaji: "Hajimemashite. Guen An desu. Yoroshiku onegai shimasu."
        en: "The whole introduction. Japanese people greet by bowing: the deeper and longer the bow, the more polite. At work, people also exchange business cards with a small bow."
        vi: "Cả câu giới thiệu. Người Nhật chào bằng cách cúi người (おじぎ): cúi càng sâu, càng lâu thì càng lịch sự. Trong công việc, người ta trao danh thiếp kèm cúi chào nhẹ."
    lines:
      - emma: "When you meet someone for the first time."
      - yuki: "はじめまして。"
        pause: 1.5
      - emma: "Then your name, followed by the word for am."
        focus: 1
      - yuki: "グエン・アンです。"
        pause: 1.5
      - emma: "And close with this phrase. It means nice to meet you, and please be kind to me."
        focus: 2
      - yuki: "よろしくおねがいします。"
        pause: 1.8
      - emma: "All together. Bow a little at the end: in Japan, people greet each other by bowing, and a deeper, longer bow is more polite."
        focus: 3
      - yuki: "はじめまして。グエン・アンです。よろしくおねがいします。"
        pause: 2

  - kind: jp
    chapter: "All greetings: book audio"
    heading: "All the greetings · Read along with the book's audio"
    items:
      - jp: "おはよう。 ・ おはよう ございます。 ・ こんにちは。 ・ こんばんは。\nさようなら。 ・ おやすみ(なさい)。\nありがとう。 ・ ありがとう ございます。 ・ すみません。 ・ いいえ。\nいってきます。 ・ いってらっしゃい。 ・ ただいま。 ・ おかえり(なさい)。\nいただきます。 ・ ごちそうさま(でした)。\nはじめまして。 ・ 〜です。 ・ よろしく おねがいします。"
        en: "All the greetings of the textbook. Listen to the native speakers and say each one with them."
        vi: "Tất cả câu chào trong sách. Nghe người Nhật đọc và nói theo từng câu."
    lines:
      - emma: "Now listen to the native speakers on your textbook's audio. Say each greeting with them."
      - track: K00-01
        note: "あいさつ · Greetings · K00-01"

  - kind: jp
    chapter: "What do you say?"
    heading: "What do you say? · Ten situations"
    items:
      - jp: "① なんと いいますか。"
        quiz: true
        en: "1 p.m. You see your neighbour, Mr. Yamada."
        vi: "1 giờ chiều. Bạn gặp hàng xóm, ông Yamada."
      - jp: "こんにちは。"
        romaji: "Konnichiwa."
        en: "Good afternoon."
        vi: "Xin chào."
      - jp: "② なんと いいますか。"
        quiz: true
        en: "Morning class: greet your teacher, then your friends."
        vi: "Buổi sáng ở lớp: chào thầy cô, rồi chào bạn."
      - jp: "おはよう ございます。 / おはよう。"
        romaji: "Ohayoo gozaimasu. / Ohayoo."
        en: "To the teacher: the polite form. To friends: the short form."
        vi: "Với thầy cô: dạng lịch sự. Với bạn: dạng ngắn."
      - jp: "③ なんと いいますか。"
        quiz: true
        en: "On a crowded train, you step on someone's foot."
        vi: "Trên tàu đông người, bạn giẫm phải chân ai đó."
      - jp: "すみません。"
        romaji: "Sumimasen."
        en: "I'm sorry."
        vi: "Xin lỗi."
      - jp: "④ なんと いいますか。"
        quiz: true
        en: "You drop your book. Someone picks it up for you."
        vi: "Bạn làm rơi sách, có người nhặt giúp."
      - jp: "ありがとう ございます。"
        romaji: "Arigatoo gozaimasu."
        en: "Thank you. すみません is also possible."
        vi: "Cảm ơn. Nói すみません cũng được."
      - jp: "⑤ なんと いいますか。"
        quiz: true
        en: "8 p.m. You meet your teacher at a convenience store."
        vi: "8 giờ tối. Bạn gặp thầy cô ở cửa hàng tiện lợi."
      - jp: "こんばんは。"
        romaji: "Konbanwa."
        en: "Good evening."
        vi: "Chào buổi tối."
      - jp: "⑥ なんと いいますか。"
        quiz: true
        en: "You are watching TV with your host family. It is time to go to bed."
        vi: "Bạn đang xem TV với gia đình người Nhật. Đến giờ đi ngủ."
      - jp: "おやすみなさい。"
        romaji: "Oyasumi nasai."
        en: "Good night."
        vi: "Chúc ngủ ngon."
      - jp: "⑦ なんと いいますか。"
        quiz: true
        en: "You are leaving home."
        vi: "Bạn ra khỏi nhà."
      - jp: "いってきます。"
        romaji: "Itte kimasu."
        en: "I'll go and come back."
        vi: "Con đi đây."
      - jp: "⑧ なんと いいますか。"
        quiz: true
        en: "You come back home."
        vi: "Bạn về đến nhà."
      - jp: "ただいま。"
        romaji: "Tadaima."
        en: "I'm home."
        vi: "Con về rồi."
      - jp: "⑨ なんと いいますか。"
        quiz: true
        en: "You are going to start eating."
        vi: "Bạn chuẩn bị ăn."
      - jp: "いただきます。"
        romaji: "Itadakimasu."
        en: "Before eating."
        vi: "Trước khi ăn."
      - jp: "⑩ なんと いいますか。"
        quiz: true
        en: "You have finished eating."
        vi: "Bạn ăn xong."
      - jp: "ごちそうさまでした。"
        romaji: "Gochisoosama deshita."
        en: "Thank you for the meal."
        vi: "Cảm ơn vì bữa ăn."
    lines:
      - emma: "Your turn. For each situation, say the right greeting before Yuki does. Pause the video if you need time. Number one: it is one o'clock in the afternoon, and you see your neighbour, Mr. Yamada."
        pause: 3
      - yuki: "こんにちは。"
        focus: 1
        pause: 1.5
      - emma: "Two: you come to class in the morning. Greet your teacher, then your friends."
        focus: 2
        pause: 3
      - yuki: "おはようございます。"
        focus: 3
        pause: 0.8
      - yuki: "おはよう。"
        pause: 1.5
      - emma: "Three: on a crowded train, you step on someone's foot."
        focus: 4
        pause: 3
      - yuki: "すみません。"
        focus: 5
        pause: 1.5
      - emma: "Four: you drop your book, and someone picks it up for you."
        focus: 6
        pause: 3
      - yuki: "ありがとうございます。"
        focus: 7
        pause: 1.5
      - emma: "Five: it is eight in the evening. You meet your teacher at a convenience store."
        focus: 8
        pause: 3
      - yuki: "こんばんは。"
        focus: 9
        pause: 1.5
      - emma: "Six: you are watching TV with your host family, and it is time to go to bed."
        focus: 10
        pause: 3
      - yuki: "おやすみなさい。"
        focus: 11
        pause: 1.5
      - emma: "Seven: you are leaving home."
        focus: 12
        pause: 3
      - takeshi: "いってきます。"
        focus: 13
        pause: 1.5
      - emma: "Eight: you come back home."
        focus: 14
        pause: 3
      - takeshi: "ただいま。"
        focus: 15
        pause: 1.5
      - emma: "Nine: you are going to start eating."
        focus: 16
        pause: 3
      - yuki: "いただきます。"
        focus: 17
        pause: 1.5
      - emma: "Ten: you have finished eating."
        focus: 18
        pause: 3
      - takeshi: "ごちそうさまでした。"
        focus: 19
        pause: 1.5

  - kind: jp
    chapter: "Introduce yourself"
    heading: "Introduce yourself · Meet as many people as you can"
    items:
      - jp: "はじめまして。きむら たけしです。よろしく おねがいします。\nほんだ あいです。よろしく おねがいします。"
        romaji: "Hajimemashite. Kimura Takeshi desu. Yoroshiku onegai shimasu.\nHonda Ai desu. Yoroshiku onegai shimasu."
        en: "A: How do you do? I'm Takeshi Kimura. Nice to meet you. — B: I'm Ai Honda. Nice to meet you."
        vi: "A: Rất vui được gặp, tôi là Kimura Takeshi. Rất mong được giúp đỡ. — B: Tôi là Honda Ai. Rất mong được giúp đỡ."
      - jp: "はじめまして。〔なまえ〕です。よろしく おねがいします。"
        romaji: "Hajimemashite. … desu. Yoroshiku onegai shimasu."
        en: "Your turn: say it with your own name, and bow a little."
        vi: "Đến lượt bạn: nói với tên của mình và cúi chào nhẹ."
    lines:
      - emma: "Finally, two people meet for the first time. Listen."
      - takeshi: "はじめまして。きむらたけしです。よろしくおねがいします。"
        pause: 0.8
      - yuki: "ほんだあいです。よろしくおねがいします。"
        pause: 1.8
      - emma: "Your turn. Pause the video and introduce yourself with your own name. Say it to a mirror, or to a friend, and bow a little at the end. In the next video: numbers from zero to one hundred."
        focus: 1
