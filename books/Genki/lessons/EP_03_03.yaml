scenes:
  - kind: jp
    chapter: "Frequency adverbs & IELTS routine topic"
    heading: "Unit 3.3: Frequency Adverbs & IELTS Routine Topic"
    items:
      - jp: "まいにち / たいてい / ときどき vs. あまり / ぜんぜん + ～ません"
        romaji: "Mainichi / Taitei / Tokidoki (+ masu) vs. Amari / Zenzen (+ masen)"
        en: "Grammar Point 6: Pair 'amari' (not much) and 'zenzen' (never) strictly with negative verbs (~masen)."
        vi: "Điểm ngữ pháp 6: Lưu ý 'amari' (ít khi) và 'zenzen' (hoàn toàn không) BẮT BUỘC phải đi với đuôi phủ định '~masen'."
    lines:
      - emma: "In Unit 3, Part C, we add Grammar Point 6: Frequency Adverbs! Use 'mai-ni-chi' for every day, 'tai-tei' for usually, and 'to-ki-do-ki' for sometimes. For negative sentences, use 'a-ma-ri' for not much, and 'zen-zen' for not at all. Let's answer the IELTS prompt about your daily routine!"
        say: "In Unit 3, Part C, we add Grammar Point 6: Frequency Adverbs! Use 'my-nee-chee' for every day, 'tye-tay' for usually, and 'toh-kee-doh-kee' for sometimes. For negative sentences, use 'ah-mah-ree' for not much, and 'zen-zen' for not at all. Let's answer the eye-elts prompt about your daily routine!"
        pause: 0.6

  - kind: jp
    chapter: "Full paragraph: shadow & write"
    heading: "Full Paragraph Shadowing & Writing Model"
    items:
      - jp: "わたしは{毎日|まいにち}、{七時|しちじ}に{起|お}きます。たいてい{家|いえ}で{朝|あさ}ごはんを{食|た}べます。でも、テレビはあまり{見|み}ません。{週末|しゅうまつ}、ときどきカフェで{日本語|にほんご}を{勉強|べんきょう}します。{日曜日|にちようび}に{早|はや}く{寝|ね}ます。"
        romaji: "Watashi wa mainichi, shichi-ji ni okimasu. Taitei ie de asagohan o tabemasu. Demo, terebi wa amari mimasen. Shuumatsu, tokidoki kafe de nihongo o benkyou shimasu. Nichiyoubi ni hayaku nemasu."
        en: "I wake up at 7:00 every day. I usually eat breakfast at home. However, I don't watch TV much. On weekends, I sometimes study Japanese at a cafe. On Sunday, I go to bed early."
        vi: "Mỗi ngày tôi dậy lúc 7 giờ. Tôi thường ăn sáng ở nhà. Nhưng tôi ít khi xem TV. Cuối tuần, thỉnh thoảng tôi học tiếng Nhật ở quán cafe. Chủ nhật tôi đi ngủ sớm."
    lines:
      - yuki: "わたしは毎日、七時に起きます。たいてい家で朝ごはんを食べます。でも、テレビはあまり見ません。週末、ときどきカフェで日本語を勉強します。日曜日に早く寝ます。"
        say: "わたしは毎日、しちじに起きます。たいてい家で朝ごはんを食べます。でも、テレビはあまり見ません。週末、ときどきカフェでにほんごを勉強します。にちようびに早く寝ます。"
        speed: 0.9
        pause: 2.5
