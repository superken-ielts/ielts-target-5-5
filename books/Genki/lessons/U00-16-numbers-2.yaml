# U00 · Numbers 2 — GENKI I すうじ (trang 35). Hàng chục và 100 (số + じゅう, như tiếng Việt), mọi số đến 99, audio
# gốc K00-02 từ 58.4 giây (20, 30 … 90, 100), ba bài luyện của trang 35 dạng đố (đọc số A, B; làm tính C): đếm ngược để
# bạn nói rồi thẻ đáp án; nghe – viết các cặp số dễ nhầm (14 / 40, 17 / 70, 19 / 90); tổng kết Unit 0.
