scenes:
  - kind: jp
    chapter: "Goals"
    heading: "In this video · Up to 100, then practice"
    items:
      - jp: "{45|よんじゅうご}"
        romaji: "yonjuugo"
        en: "Goals: say any number up to 100, then practise reading, adding and listening."
        vi: "Mục tiêu: nói được mọi số đến 100, rồi luyện đọc số, làm tính và nghe số."
    lines:
      - emma: "Welcome back. In this video: the tens, up to one hundred. Then you can say any number up to ninety-nine."
        vi: "Chào mừng bạn trở lại. Trong video này: hàng chục, đến 100. Sau đó bạn nói được mọi số đến 99."
      - emma: "Then three short practices, and the last challenge of Unit 0."
        vi: "Sau đó là ba bài luyện ngắn, và thử thách cuối cùng của Unit 0."

  - kind: jp
    chapter: "Tens and 100"
    heading: "Tens · just like Vietnamese"
    items:
      - jp: "{20|にじゅう} ・ {30|さんじゅう} ・ {40|よんじゅう} ・ {50|ごじゅう}"
        romaji: "nijuu · sanjuu · yonjuu · gojuu"
        en: "The number, then ten: twenty is two-ten."
        vi: "Số rồi đến じゅう: 20 là に + じゅう (hai mươi). Giống hệt cách đếm tiếng Việt!"
      - jp: "{60|ろくじゅう} ・ {70|ななじゅう} ・ {80|はちじゅう} ・ {90|きゅうじゅう} ・ {100|ひゃく}"
        romaji: "rokujuu · nanajuu · hachijuu · kyuujuu · hyaku"
        en: "For the tens, use よん, なな and きゅう. One hundred is ひゃく."
        vi: "Hàng chục dùng よん, なな, きゅう. Một trăm là ひゃく."
      - jp: "{20|にじゅう} {30|さんじゅう} {40|よんじゅう} {50|ごじゅう} {60|ろくじゅう}\n{70|ななじゅう} {80|はちじゅう} {90|きゅうじゅう} {100|ひゃく}"
        en: "The tens and 100, as in the textbook."
        vi: "Hàng chục và 100, như trong sách."
    lines:
      - emma: "The tens work just like Vietnamese: the number, then ten. Twenty is two ten."
        vi: "Hàng chục ghép y như tiếng Việt: số, rồi đến mười. Hai mươi là “hai – mười”."
      - yuki: "にじゅう、さんじゅう、よんじゅう、ごじゅう。"
        en: "20, 30, 40, 50"
        vi: "20, 30, 40, 50"
        echo: true
      - emma: "For the tens, use the first readings of four, seven and nine. And one hundred."
        say: "For the tens, yooz the first readings of four, seven and nine. And one hundred."
        vi: "Ở hàng chục, dùng cách đọc thứ nhất của bốn, bảy và chín. Và một trăm."
        focus: 1
      - yuki: "ろくじゅう、ななじゅう、はちじゅう、きゅうじゅう、ひゃく。"
        en: "60, 70, 80, 90, 100"
        vi: "60, 70, 80, 90, 100"
        echo: true
      - emma: "The book's audio."
        vi: "Audio của sách."
        focus: 2
      - track: K00-02
        start: 58.4
        note: "すうじ · Numbers · K00-02"
        en: "20 … 100"
        vi: "20 … 100"
        step: 1.2
        pause: 1

  - kind: jp
    chapter: "Up to 99"
    heading: "Any number up to 99 · tens, then ones"
    items:
      - jp: "{45|よんじゅうご} ・ {83|はちじゅうさん} ・ {99|きゅうじゅうきゅう}"
        romaji: "yonjuugo · hachijuusan · kyuujuukyuu"
        en: "Any number up to 99: the tens, then the ones."
        vi: "Mọi số đến 99: hàng chục rồi hàng đơn vị — 45 là “bốn mươi lăm”: よんじゅう + ご."
    lines:
      - emma: "Now any number up to ninety-nine: the tens, then the ones. Forty-five is four ten five."
        vi: "Giờ đến mọi số tới 99: hàng chục, rồi hàng đơn vị. Bốn mươi lăm là “bốn – mười – năm”."
      - yuki: "よんじゅうご、はちじゅうさん、きゅうじゅうきゅう。"
        en: "45, 83, 99"
        vi: "45, 83, 99"
        echo: true

  - kind: jp
    chapter: "A. Read the numbers"
    heading: "Practice A · Read the numbers"
    items:
      - jp: "5 ・ 9 ・ 7 ・ 1 ・ 10"
        quiz: true
        en: "Read the numbers aloud in Japanese, then check."
        vi: "Đọc to các số bằng tiếng Nhật, rồi xem đáp án."
      - jp: "{5|ご} ・ {9|きゅう} ・ {7|なな} ・ {1|いち} ・ {10|じゅう}"
        romaji: "go · kyuu · nana · ichi · juu"
        en: "5 · 9 · 7 · 1 · 10"
        vi: "5 · 9 · 7 · 1 · 10"
      - jp: "8 ・ 2 ・ 6 ・ 4 ・ 3"
        quiz: true
        en: "Read the numbers aloud in Japanese, then check."
        vi: "Đọc to các số bằng tiếng Nhật, rồi xem đáp án."
      - jp: "{8|はち} ・ {2|に} ・ {6|ろく} ・ {4|よん} ・ {3|さん}"
        romaji: "hachi · ni · roku · yon · san"
        en: "8 · 2 · 6 · 4 · 3"
        vi: "8 · 2 · 6 · 4 · 3"
    lines:
      - emma: "Practice A. Read these numbers aloud in Japanese."
        vi: "Bài luyện A. Đọc to các số này bằng tiếng Nhật."
      - wait: 5
        note: "Read the five numbers aloud"
        vi: "Đọc to năm số"
      - yuki: "ご、きゅう、なな、いち、じゅう。"
        focus: 1
        en: "5, 9, 7, 1, 10"
        vi: "5, 9, 7, 1, 10"
        pause: 1
      - emma: "Five more."
        vi: "Thêm năm số nữa."
        focus: 2
      - wait: 5
        note: "Read the five numbers aloud"
        vi: "Đọc to năm số"
      - yuki: "はち、に、ろく、よん、さん。"
        focus: 3
        en: "8, 2, 6, 4, 3"
        vi: "8, 2, 6, 4, 3"
        pause: 1

  - kind: jp
    chapter: "B. Bigger numbers"
