        vi: "45, 83, 19, 76, 52"
        pause: 1

  - kind: jp
    chapter: "C. Answer in Japanese"
    heading: "Practice C · Work it out, answer in Japanese"
    items:
      - jp: "5 + 3 ・ 9 + 1 ・ 3 + 4 ・ 6 − 6"
        quiz: true
        en: "Work out the answers and say them in Japanese."
        vi: "Tính rồi nói đáp số bằng tiếng Nhật."
      - jp: "{8|はち} ・ {10|じゅう} ・ {7|なな} ・ {0|ゼロ}"
        romaji: "hachi · juu · nana · zero"
        en: "8 · 10 · 7 · 0"
        vi: "8 · 10 · 7 · 0"
    lines:
      - emma: "Practice C. Work out each answer, and say it in Japanese. Five plus three, nine plus one, three plus four, six minus six."
        vi: "Bài luyện C. Tính từng phép, rồi nói đáp số bằng tiếng Nhật. Năm cộng ba, chín cộng một, ba cộng bốn, sáu trừ sáu."
      - wait: 6
        note: "Say the four answers in Japanese"
        vi: "Nói bốn đáp số bằng tiếng Nhật"
      - yuki: "はち、じゅう、なな、ゼロ。"
        focus: 1
        en: "8, 10, 7, 0"
        vi: "8, 10, 7, 0"
        pause: 1

