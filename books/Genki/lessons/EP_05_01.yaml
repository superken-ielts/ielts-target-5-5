# điểm 3 là tính từ bổ nghĩa danh từ (な + danh từ).
id: EP_05_01
activity: U05-part-a
title: "Unit 5 · A Trip to Okinawa"
subtitle: "EP 5.1 · Present Tense of -i and -na Adjectives"
title_vi: "Phần A — Tính từ い và な ở hiện tại"
tag: "TARGET N5 • 5.0"
gap: 0
scene_gap: 0
speakers:
  emma: {name: Emma, role: grammar & topic guide, voice: {kokoro: bf_emma}, color: "#00A8B5", speed: 1.0}
