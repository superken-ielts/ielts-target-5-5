# U00 · Hiragana 6 — GENKI I, Japanese Writing System (trang 21). Luyện tập 46 chữ: chữ dễ nhầm (từng cặp, Yuki đọc
# từng chữ, chữ đang đọc sáng lên), chữ in khác chữ viết tay, nghe – viết 8 chữ (thẻ đố không lộ đáp án; có đếm ngược
# để viết), đọc những từ tiếng Nhật người Việt đã biết (からて, すもう…).
id: U00-07-hiragana-practice
activity: U00-kana
title: "Unit 0 · The Japanese Writing System"
subtitle: "Hiragana 6 · Practice: look-alikes, handwriting, listening"
title_vi: "Hiragana 6 — luyện tập: chữ dễ nhầm, chữ in và chữ viết tay, nghe – viết, đọc từ quen thuộc"
tag: "GENKI L0 · N5"
gap: 0.8
scene_gap: 1.5
step: 0.9
speakers:
  emma: {name: Emma, role: guide, voice: {kokoro: bf_emma}, color: "#00A8B5", speed: 0.9}
  yuki: {name: Yuki, role: Japanese tutor, lang: ja, voice: {kokoro: jf_alpha}, color: "#F39C12", speed: 0.78}

scenes:
  - kind: jp
    chapter: "Goals"
    heading: "In this video · Practise the 46 letters"
    items:
      - jp: "さ ・ ち ・ ぬ ・ め"
        romaji: "sa · chi · nu · me"
        en: "Goals: tell look-alike letters apart, write them correctly, and recognise letters by ear."
        vi: "Mục tiêu: phân biệt chữ trông giống nhau, viết đúng, và nhận ra chữ khi nghe."
    lines:
      - emma: "Welcome back. You know all forty-six letters. This video is practice."
        vi: "Chào mừng bạn trở lại. Bạn đã biết cả 46 chữ. Video này dành để luyện tập."
      - emma: "Some letters look alike, so you will learn how to tell them apart."
        vi: "Có những chữ trông giống nhau, nên bạn sẽ học cách phân biệt chúng."
      - emma: "Then you will write letters you hear, and read words you already know."
        vi: "Sau đó bạn sẽ viết những chữ nghe được, và đọc những từ bạn đã biết."

  - kind: jp
    chapter: "Look-alike letters"
    heading: "Look-alike letters · Spot the difference"
    items:
      - jp: "さ ・ ち"
        romaji: "sa · chi"
        en: "Mirror images: the bottom curve of さ opens to the right, the curve of ち to the left."
        vi: "Hai chữ ngược chiều nhau: nét cong dưới của さ mở sang phải, của ち mở sang trái."
      - jp: "ぬ ・ め ・ る ・ ろ"
        romaji: "nu · me · ru · ro"
        en: "ぬ and る end with a small loop; め and ろ do not."
        vi: "ぬ và る có vòng nhỏ ở cuối nét; め và ろ thì không."
      - jp: "は ・ ほ ・ き ・ さ"
        romaji: "ha · ho · ki · sa"
        en: "ほ has two short lines on the right, は has one. き has two crossing lines, さ has one."
        vi: "ほ có hai nét ngang ngắn bên phải, は có một. き có hai nét ngang, さ có một."
      - jp: "ね ・ れ ・ わ"
        romaji: "ne · re · wa"
        en: "Same left stroke. ね ends with a loop, れ kicks out, わ curves round."
        vi: "Cùng một nét bên trái. ね kết thúc bằng vòng nhỏ, れ hất ra ngoài, わ uốn tròn."
      - jp: "あ ・ お ・ い ・ り"
        romaji: "a · o · i · ri"
        en: "お has a small dot at the top right. い has two short strokes; り is taller, with a long right stroke."
        vi: "お có thêm dấu chấm nhỏ phía trên bên phải. い là hai nét ngắn; り cao hơn, nét phải dài."
    lines:
      - emma: "The first pair are mirror images. Look at the bottom curve."
        vi: "Cặp đầu tiên là hai chữ ngược chiều nhau. Hãy nhìn nét cong bên dưới."
      - yuki: "さ、ち。"
        en: "sa, chi"
        vi: "sa, chi"
        pause: 1
      - emma: "In these four, look at the end of the last stroke. Two of them have a small loop."
        vi: "Ở bốn chữ này, hãy nhìn cuối nét cuối cùng. Hai chữ có vòng nhỏ."
        focus: 1
      - yuki: "ぬ、め、る、ろ。"
        en: "nu, me, ru, ro"
        vi: "nu (có vòng), me, ru (có vòng), ro"
        pause: 1
      - emma: "Here, count the short lines."
        vi: "Ở đây, hãy đếm số nét ngang ngắn."
        focus: 2
      - yuki: "は、ほ、き、さ。"
        en: "ha, ho, ki, sa"
        vi: "ha (một nét), ho (hai nét), ki (hai nét), sa (một nét)"
        pause: 1
      - emma: "These three start the same way. Look at how each one ends."
        vi: "Ba chữ này bắt đầu giống nhau. Hãy nhìn cách mỗi chữ kết thúc."
        focus: 3
      - yuki: "ね、れ、わ。"
        en: "ne, re, wa"
        vi: "ne (vòng nhỏ), re (hất ra), wa (uốn tròn)"
        pause: 1
      - emma: "And two more pairs. A small dot makes the difference in the first pair, and length in the second."
        vi: "Và thêm hai cặp. Cặp đầu khác nhau ở một chấm nhỏ, cặp sau khác nhau ở độ dài nét."
        focus: 4
      - yuki: "あ、お、い、り。"
        en: "a, o, i, ri"
        vi: "a, o (có chấm), i, ri (nét dài)"
        pause: 1

  - kind: jp
    chapter: "Print and handwriting"
    heading: "Print vs handwriting · Separate strokes"
    items:
      - jp: "さ ・ き ・ り ・ ふ"
        romaji: "sa · ki · ri · fu"
        en: "Printed letters often join strokes that are separate in handwriting."
        vi: "Chữ in thường nối liền những nét mà khi viết tay phải tách rời."
    lines:
      - emma: "Printed letters sometimes join strokes that are separate when you write by hand."
        vi: "Chữ in đôi khi nối liền những nét mà khi viết tay phải tách rời."
      - emma: "In these two, the bottom stroke is separate. Lift your pen."
        vi: "Ở hai chữ này, nét dưới viết riêng. Hãy nhấc bút lên."
        hl: [0, 1]
      - emma: "This one has two strokes, and this one has four."
        vi: "Chữ này có hai nét, còn chữ này có bốn nét."
        hl: [2, 3]
      - yuki: "さ、き、り、ふ。"
        en: "sa, ki, ri, fu"
        vi: "sa, ki, ri, fu"
        pause: 1
      - emma: "Write each of these four letters three times, lifting your pen between strokes."
        vi: "Viết mỗi chữ trong bốn chữ này ba lần, nhấc bút giữa các nét."
      - wait: 5
        note: "Write さ き り ふ — three times each"
        vi: "Viết さ き り ふ — mỗi chữ ba lần"
        hl: all

  - kind: jp
    chapter: "Listen and write"
    heading: "Listen and write · Which letter is it?"
    items:
      - jp: "① ？"
        quiz: true
        en: "Listen and write the letter."
        vi: "Nghe và viết chữ."
      - jp: "し"
        romaji: "shi"
      - jp: "② ？"
        quiz: true
        en: "Listen and write the letter."
        vi: "Nghe và viết chữ."
      - jp: "つ"
        romaji: "tsu"
      - jp: "③ ？"
        quiz: true
        en: "Listen and write the letter."
        vi: "Nghe và viết chữ."
      - jp: "ふ"
        romaji: "fu"
      - jp: "④ ？"
        quiz: true
        en: "Listen and write the letter."
        vi: "Nghe và viết chữ."
      - jp: "ち"
        romaji: "chi"
      - jp: "⑤ ？"
        quiz: true
        en: "Listen and write the letter."
        vi: "Nghe và viết chữ."
      - jp: "ぬ"
        romaji: "nu"
      - jp: "⑥ ？"
        quiz: true
        en: "Listen and write the letter."
        vi: "Nghe và viết chữ."
      - jp: "ろ"
        romaji: "ro"
      - jp: "⑦ ？"
        quiz: true
        en: "Listen and write the letter."
        vi: "Nghe và viết chữ."
      - jp: "ね"
        romaji: "ne"
      - jp: "⑧ ？"
        quiz: true
        en: "Listen and write the letter."
        vi: "Nghe và viết chữ."
      - jp: "ん"
        romaji: "n"
    lines:
      - emma: "Listen and write. Yuki says one letter. Write it, then check the answer."
        vi: "Nghe và viết. Yuki đọc một chữ. Hãy viết ra, rồi xem đáp án."
      - emma: "Number one."
        vi: "Câu một."
      - yuki: "し。"
      - wait: 3
        note: "Write the letter you heard"
        vi: "Viết chữ bạn vừa nghe"
      - yuki: "し。"
        focus: 1
        en: "shi"
        vi: "shi"
        pause: 0.5
      - emma: "Number two."
        vi: "Câu hai."
        focus: 2
      - yuki: "つ。"
      - wait: 3
        note: "Write the letter you heard"
        vi: "Viết chữ bạn vừa nghe"
      - yuki: "つ。"
        focus: 3
        en: "tsu"
        vi: "tsu"
        pause: 0.5
      - emma: "Number three."
        vi: "Câu ba."
        focus: 4
      - yuki: "ふ。"
      - wait: 3
        note: "Write the letter you heard"
        vi: "Viết chữ bạn vừa nghe"
      - yuki: "ふ。"
        focus: 5
        en: "fu"
        vi: "fu"
        pause: 0.5
      - emma: "Number four."
        vi: "Câu bốn."
        focus: 6
      - yuki: "ち。"
      - wait: 3
        note: "Write the letter you heard"
        vi: "Viết chữ bạn vừa nghe"
      - yuki: "ち。"
        focus: 7
        en: "chi"
        vi: "chi"
        pause: 0.5
      - emma: "Number five."
        vi: "Câu năm."
        focus: 8
      - yuki: "ぬ。"
      - wait: 3
        note: "Write the letter you heard"
        vi: "Viết chữ bạn vừa nghe"
      - yuki: "ぬ。"
        focus: 9
        en: "nu — the one with the loop"
        vi: "nu — chữ có vòng nhỏ"
        pause: 0.5
      - emma: "Number six."
        vi: "Câu sáu."
        focus: 10
      - yuki: "ろ。"
      - wait: 3
        note: "Write the letter you heard"
        vi: "Viết chữ bạn vừa nghe"
      - yuki: "ろ。"
        focus: 11
        en: "ro — no loop"
        vi: "ro — không có vòng"
        pause: 0.5
      - emma: "Number seven."
        vi: "Câu bảy."
        focus: 12
      - yuki: "ね。"
      - wait: 3
        note: "Write the letter you heard"
        vi: "Viết chữ bạn vừa nghe"
      - yuki: "ね。"
        focus: 13
        en: "ne — it ends with a loop"
        vi: "ne — kết thúc bằng vòng nhỏ"
        pause: 0.5
      - emma: "And number eight."
        vi: "Và câu tám."
        focus: 14
      - yuki: "ん。"
      - wait: 3
        note: "Write the letter you heard"
        vi: "Viết chữ bạn vừa nghe"
      - yuki: "ん。"
        focus: 15
        en: "n"
        vi: "n"
        pause: 0.5
      - emma: "How many did you get right? If you missed some, watch the row videos again."
        vi: "Bạn đúng được mấy câu? Nếu sai vài câu, hãy xem lại video của các hàng đó."

  - kind: jp
    chapter: "Words you know"
    heading: "Read words you already know · Then check"
    items:
      - jp: "からて ・ きもの ・ つなみ ・ すもう"
        quiz: true
        en: "Read the four words aloud, then check."
        vi: "Đọc to bốn từ, rồi xem đáp án."
      - jp: "からて ・ きもの ・ つなみ ・ すもう"
        romaji: "karate · kimono · tsunami · sumoo"
        en: "karate · kimono · tsunami · sumo"
        vi: "karate · kimono · sóng thần · sumo"
      - jp: "さむらい ・ はいく ・ すきやき ・ さしみ"
        quiz: true
        en: "Read the four words aloud, then check."
        vi: "Đọc to bốn từ, rồi xem đáp án."
      - jp: "さむらい ・ はいく ・ すきやき ・ さしみ"
        romaji: "samurai · haiku · sukiyaki · sashimi"
        en: "samurai · haiku · sukiyaki · sashimi"
        vi: "samurai · thơ haiku · lẩu sukiyaki · sashimi"
    lines:
      - emma: "You already know many Japanese words. Here they are in hiragana. Read them aloud."
        vi: "Bạn đã biết nhiều từ tiếng Nhật rồi. Đây là chúng khi viết bằng hiragana. Hãy đọc to."
      - wait: 4
        note: "Read the four words aloud"
        vi: "Đọc to bốn từ"
      - yuki: "からて、きもの、つなみ、すもう。"
        focus: 1
        en: "karate, kimono, tsunami, sumo"
        vi: "karate, kimono, sóng thần, sumo"
        pause: 1
      - emma: "Four more."
        vi: "Thêm bốn từ nữa."
        focus: 2
      - wait: 4
        note: "Read the four words aloud"
        vi: "Đọc to bốn từ"
      - yuki: "さむらい、はいく、すきやき、さしみ。"
        say: "さむらい、ハイク、すきやき、さしみ。"
        focus: 3
        en: "samurai, haiku, sukiyaki, sashimi"
        vi: "samurai, thơ haiku, lẩu sukiyaki, sashimi"
        pause: 1
      - emma: "Next video: two small marks that change the sound of a letter."
        vi: "Video tiếp theo: hai dấu nhỏ làm thay đổi âm của một chữ."
