  - kind: jp
    chapter: "Goals"
    heading: "In this video · More greetings, then your turn"
    items:
      - jp: "はじめまして。"
        romaji: "Hajimemashite."
        en: "Goals: say goodbye, greet at home and at meals, introduce yourself, and choose the right greeting in ten situations."
        vi: "Mục tiêu: chào tạm biệt, chào hỏi ở nhà và trong bữa ăn, tự giới thiệu, và chọn đúng câu chào trong mười tình huống."
    lines:
      - emma: "Welcome back. In this video: more greetings for every day, and how to introduce yourself."
        vi: "Chào mừng bạn trở lại. Trong video này: thêm những câu chào hằng ngày, và cách tự giới thiệu."
      - emma: "At the end, you will choose the right greeting in ten situations."
        vi: "Cuối video, bạn sẽ chọn đúng câu chào trong mười tình huống."

  - kind: jp
    chapter: "Goodbye"
    heading: "Goodbye · three ways"
    items:
      - jp: "さようなら。"
        romaji: "Sayoonara."
        en: "Goodbye. It sounds final and formal; in daily life it is mostly children saying goodbye to their teacher."
        vi: "Tạm biệt. Nghe trang trọng, như lâu nữa mới gặp lại; hằng ngày chủ yếu học sinh chào thầy cô."
      - jp: "じゃあ、また。"
        romaji: "Jaa, mata."
        en: "See you — between friends who will meet again soon."
        vi: "Gặp lại sau nhé — giữa bạn bè sắp gặp lại."
      - jp: "しつれいします。"
        romaji: "Shitsuree shimasu."
        en: "Excuse me for leaving — when you leave a teacher's or a boss's office."
        vi: "Xin phép (tôi đi) — khi rời phòng thầy cô hay sếp."
    lines:
      - emma: "This famous goodbye sounds quite final and formal. In daily life, it is mostly children saying goodbye to their teacher."
        vi: "Câu tạm biệt nổi tiếng này nghe khá trang trọng, như lâu nữa mới gặp. Hằng ngày, chủ yếu học sinh dùng để chào thầy cô."
      - yuki: "さようなら。"
        en: "Goodbye."
        vi: "Tạm biệt."
        echo: true
      - track: K00-01
        start: 22.8
        end: 26.7
        note: "あいさつ · Greetings · K00-01"
        en: "Goodbye."
        vi: "Tạm biệt."
        pause: 1
      - emma: "Between friends, say: see you."
        vi: "Giữa bạn bè, hãy nói: gặp lại sau nhé."
        focus: 1
      - takeshi: "じゃあ、また。"
        en: "See you."
        vi: "Gặp lại sau nhé."
        echo: true
      - emma: "And when you leave a teacher's office, say this."
        vi: "Còn khi rời phòng thầy cô, hãy nói câu này."
        focus: 2
      - yuki: "しつれいします。"
        en: "Excuse me (for leaving)."
        vi: "Em xin phép ạ."
        echo: true

  - kind: jp
