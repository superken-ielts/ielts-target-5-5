        vi: "Rồi đến tên của bạn, và “desu”, nghĩa là “là”."
      - emma: "Finish with this phrase. It means nice to meet you, and please be kind to me."
        vi: "Kết thúc bằng câu này. Nó nghĩa là “rất vui được gặp”, và “mong được giúp đỡ”."
