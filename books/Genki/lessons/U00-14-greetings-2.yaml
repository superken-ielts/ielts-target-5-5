# U00 · Greetings 2 — GENKI I あいさつ (trang 30–34). Chào tạm biệt (さようなら, じゃあまた, しつれいします), ở nhà
# (いってきます – いってらっしゃい, ただいま – おかえりなさい), bữa ăn, gặp lần đầu và cúi chào (trang 32–33), 10 tình
