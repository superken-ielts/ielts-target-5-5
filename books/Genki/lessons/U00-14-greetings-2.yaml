  - kind: jp
    chapter: "Meeting someone"
    heading: "Meeting someone for the first time"
    items:
      - jp: "はじめまして。 ・ ほんだ あいです。 ・ よろしく おねがいします。"
        romaji: "Hajimemashite. · Honda Ai desu. · Yoroshiku onegai shimasu."
        en: "How do you do? · I'm Ai Honda. · Nice to meet you."
        vi: "Rất vui được gặp. · Tôi là Honda Ai. · Rất mong được giúp đỡ."
    lines:
      - emma: "When you meet someone for the first time, say this. You only say it once, at the first meeting."
        vi: "Khi gặp ai đó lần đầu, hãy nói câu này. Chỉ nói một lần, khi gặp lần đầu."
