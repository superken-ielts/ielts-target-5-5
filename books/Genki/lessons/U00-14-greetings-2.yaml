  - kind: jp
    chapter: "Meals"
    heading: "Before and after eating"
    items:
      - jp: "いただきます。 ・ ごちそうさま(でした)。"
        romaji: "Itadakimasu. · Gochisoosama (deshita)."
        en: "Before eating: \"I humbly receive.\" After eating: \"Thank you for the meal.\""
        vi: "Trước khi ăn: “Xin phép ăn ạ.” Sau khi ăn: “Cảm ơn vì bữa ăn.”"
    lines:
      - emma: "Before eating, say this. Many people put their hands together."
        vi: "Trước khi ăn, hãy nói câu này. Nhiều người chắp hai tay lại."
