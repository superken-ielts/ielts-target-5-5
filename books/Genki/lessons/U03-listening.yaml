# U03 · Listening — GENKI I bài 3. Video luyện nghe ~7 phút cho phiên Hội thoại & từ vựng (trang 82–85):
# audio gốc K03-01 / K03-03 (hội thoại) và K03-02 / K03-04 (bản có khoảng lặng để nhắc lại), câu hỏi – đáp án,
# đọc theo, rồi đố nghe một ngày của Takeshi (giờ, việc, mức thường xuyên). Lời thoại chép từ trang 82.
# Xem ghi chú đầu U01-listening.yaml.
id: U03-listening
activity: U03-words
title: "Unit 3 · Making a Date"
subtitle: "Listening · Weekend plans, the host family, a daily schedule"
title_vi: "Luyện nghe — rủ đi xem phim, buổi sáng ở nhà host family (audio gốc), nghe lịch một ngày"
tag: "GENKI L3 · N5"
speakers:
  emma: {name: Emma, role: guide, voice: {kokoro: bf_emma}, color: "#00A8B5", speed: 1.0}
  yuki: {name: Yuki, role: Japanese tutor, lang: ja, voice: {kokoro: jf_alpha}, color: "#F39C12", speed: 0.88}
  takeshi: {name: Takeshi, role: Japanese student, lang: ja, voice: {kokoro: jm_kumo}, color: "#8E5BD0", speed: 0.88}

scenes:
  - kind: jp
    chapter: "Goals"
    heading: "Unit 3 Listening · Plans and daily life"
    items:
      - jp: "デートの {約束|やくそく}"
        romaji: "Deeto no yakusoku"
        en: "Making a Date. Today: listen to the two textbook dialogues (the book's own audio), answer questions, then follow Takeshi's daily schedule."
        vi: "Hẹn đi chơi. Hôm nay: nghe hai đoạn hội thoại của sách (audio gốc), trả lời câu hỏi, rồi nghe lịch một ngày của Takeshi. やくそく (約束 – ước thúc) = hẹn."
    lines:
      - emma: "Welcome to Unit 3 listening practice. You will hear the two dialogues of Lesson 3 from your textbook's audio. Takeshi invites Mary to a movie, and then Mary talks with her host mother on Sunday morning. At the end, you will follow Takeshi's daily schedule."
      - yuki: "デートの約束。"
        pause: 1

  - kind: jp
    chapter: "Dialogue I: listen for the answers"
    heading: "Dialogue I (p. 82) · Listen twice"
    items:
      - jp: "Q1. メアリーさんは しゅうまつ たいてい {何|なに}を しますか。 / Q2. いつ {映画|えいが}を {見|み}ますか。"
        en: "Mary and Takeshi are talking. Q1: What does Mary usually do on weekends? Q2: When will they see a movie?"
        vi: "Mary và Takeshi nói chuyện. Câu 1: Cuối tuần Mary thường làm gì? Câu 2: Khi nào họ đi xem phim?"
    lines:
      - emma: "Dialogue one. Mary and Takeshi are talking. Listen for two things: what Mary usually does on weekends, and which day they will see a movie."
      - track: K03-01
        note: "会話 I · Dialogue I"
      - emma: "Listen once more. Pay attention to the day."
      - track: K03-01
        note: "会話 I · Dialogue I — 2nd time"

  - kind: jp
    chapter: "Dialogue I: answers"
    heading: "Dialogue I · Answers"
    items:
      - jp: "たいてい うちで {勉強|べんきょう}します。でも、ときどき {映画|えいが}を {見|み}ます。"
        romaji: "Taitee uchi de benkyoo shimasu. Demo, tokidoki eega o mimasu."
        en: "Q1: She usually studies at home, but sometimes she sees movies."
        vi: "Câu 1: Cô ấy thường học ở nhà, nhưng thỉnh thoảng đi xem phim."
      - jp: "{土曜日|どようび}は ちょっと…。"
        romaji: "Doyoobi wa chotto…"
        en: "Saturday is not good for Mary."
        vi: "Thứ Bảy thì Mary không tiện."
      - jp: "{日曜日|にちようび}は どうですか。 — いいですね。"
        romaji: "Nichiyoobi wa doo desu ka. — Ii desu ne."
        en: "Q2: How about Sunday? — That's fine. They will see a movie on Sunday."
        vi: "Câu 2: Chủ nhật thì sao? — Được đấy. Họ sẽ xem phim vào Chủ nhật."
    lines:
      - yuki: "たいていうちで勉強します。でも、ときどき映画を見ます。"
        pause: 1.5
      - emma: "Takeshi suggests Saturday, but Mary refuses politely."
        focus: 1
      - yuki: "どようびはちょっと……。"
        pause: 1.2
      - emma: "So Takeshi suggests another day, and Mary agrees."
        focus: 2
      - takeshi: "にちようびはどうですか。"
        pause: 0.6
      - yuki: "いいですね。"
        pause: 1.5

  - kind: jp
    chapter: "Dialogue I: read along, then repeat"
    heading: "Dialogue I · Read along, then repeat in the pauses"
    items:
      - jp: "たけし：メアリーさん、{週末|しゅうまつ}は たいてい {何|なに}を しますか。 / メアリー：そうですね。たいてい うちで {勉強|べんきょう}します。でも、ときどき {映画|えいが}を {見|み}ます。 / たけし：そうですか…。じゃあ、{土曜日|どようび}に {映画|えいが}を {見|み}ませんか。 / メアリー：{土曜日|どようび}は ちょっと…。 / たけし：じゃあ、{日曜日|にちようび}は どうですか。 / メアリー：いいですね。"
        en: "Takeshi invites Mary to a movie."
        vi: "Takeshi rủ Mary đi xem phim."
    lines:
      - emma: "Now read along while you listen."
      - track: K03-01
        note: "会話 I · read along"
      - emma: "Repeat in the pauses."
      - track: K03-02
        note: "会話 I · repeat in the pauses"

  - kind: jp
    chapter: "Dialogue II: listen for the answers"
    heading: "Dialogue II (p. 82) · Listen twice"
    items:
      - jp: "Q1. {今日|きょう} どこに {行|い}きますか。 / Q2. {何時|なんじ}ごろ {帰|かえ}りますか。 / Q3. {晩|ばん}ご{飯|はん}を {食|た}べますか。"
        en: "Sunday morning at Mary's host family. Q1: Where is Mary going today? Q2: Around what time will she come back? Q3: Will she eat dinner at home?"
        vi: "Sáng Chủ nhật ở nhà host family. Câu 1: Hôm nay Mary đi đâu? Câu 2: Khoảng mấy giờ về? Câu 3: Có ăn tối ở nhà không?"
    lines:
      - emma: "Dialogue two. On Sunday morning, Mary talks with her host mother. Listen for three things: where Mary is going, when she will come back, and whether she will eat dinner at home."
      - track: K03-03
        note: "会話 II · Dialogue II"
      - emma: "Once more."
      - track: K03-03
        note: "会話 II · Dialogue II — 2nd time"

  - kind: jp
    chapter: "Dialogue II: answers"
    heading: "Dialogue II · Answers"
    items:
      - jp: "{今日|きょう}は {京都|きょうと}に {行|い}きます。{京都|きょうと}で {映画|えいが}を {見|み}ます。"
        romaji: "Kyoo wa Kyooto ni ikimasu. Kyooto de eega o mimasu."
        en: "Q1: She is going to Kyoto. She will see a movie in Kyoto."
        vi: "Câu 1: Cô ấy đi Kyoto, xem phim ở Kyoto."
      - jp: "{九時|くじ}ごろです。"
        romaji: "Kuji goro desu."
        en: "Q2: Around nine."
        vi: "Câu 2: Khoảng 9 giờ."
      - jp: "{食|た}べません。"
        romaji: "Tabemasen."
        en: "Q3: No, she will not eat dinner at home."
        vi: "Câu 3: Không, cô ấy không ăn tối ở nhà."
    lines:
      - yuki: "今日は京都に行きます。京都で映画を見ます。"
        pause: 1.5
      - yuki: "くじごろです。"
        focus: 1
        pause: 1.2
      - yuki: "食べません。"
        focus: 2
        pause: 1.2
      - emma: "At the end, the host mother says: have a nice day, and Mary answers: I'm off. These two phrases are used every morning in Japanese homes."

  - kind: jp
    chapter: "Dialogue II: read along, then repeat"
    heading: "Dialogue II · Read along, then repeat in the pauses"
    items:
      - jp: "メアリー：おはよう ございます。 / お{母|かあ}さん：おはよう。{早|はや}いですね。 / メアリー：ええ、{今日|きょう}は {京都|きょうと}に {行|い}きます。{京都|きょうと}で {映画|えいが}を {見|み}ます。 / お{母|かあ}さん：いいですね。{何時|なんじ}ごろ {帰|かえ}りますか。 / メアリー：{九時|くじ}ごろです。 / お{母|かあ}さん：{晩|ばん}ご{飯|はん}は？ / メアリー：{食|た}べません。 / お{母|かあ}さん：そうですか。じゃあ、いってらっしゃい。 / メアリー：いってきます。"
        en: "Mary and her host mother on Sunday morning."
        vi: "いってらっしゃい = đi nhé; いってきます = con đi đây."
    lines:
      - emma: "Read along."
      - track: K03-03
        note: "会話 II · read along"
      - emma: "Repeat in the pauses."
      - track: K03-04
        note: "会話 II · repeat in the pauses"

  - kind: jp
    chapter: "Takeshi's day"
    heading: "Listening quiz · Takeshi's daily schedule"
    items:
      - jp: "Q1 ・ {何時|なんじ}に {起|お}きますか。"
        quiz: true
        en: "What time does Takeshi get up?"
        vi: "Takeshi dậy lúc mấy giờ?"
      - jp: "たけしさんは {毎日|まいにち} {六時|ろくじ}に {起|お}きます。 → 6:00"
        romaji: "Takeshi-san wa mainichi rokuji ni okimasu."
        en: "Takeshi gets up at six every day."
        vi: "Takeshi dậy lúc 6 giờ mỗi ngày."
      - jp: "Q2 ・ {何|なに}を {食|た}べますか。"
        quiz: true
        en: "What does he eat, and when?"
        vi: "Anh ấy ăn gì, lúc mấy giờ?"
      - jp: "{十二時半|じゅうにじはん}に {学校|がっこう}で {昼|ひる}ご{飯|はん}を {食|た}べます。 → lunch, 12:30"
        romaji: "Juuniji han ni gakkoo de hirugohan o tabemasu."
        en: "He eats lunch at school at 12:30."
        vi: "12 giờ rưỡi ăn trưa ở trường."
      - jp: "Q3 ・ どこで {勉強|べんきょう}しますか。"
        quiz: true
        en: "Where does he study?"
        vi: "Anh ấy học ở đâu?"
      - jp: "{四時|よじ}に {図書館|としょかん}で {勉強|べんきょう}します。 → the library, 4:00"
        romaji: "Yoji ni toshokan de benkyoo shimasu."
        en: "He studies at the library at four."
        vi: "4 giờ học ở thư viện."
      - jp: "Q4 ・ {何時|なんじ}ごろ {帰|かえ}りますか。"
        quiz: true
        en: "Around what time does he go home?"
        vi: "Khoảng mấy giờ anh ấy về nhà?"
      - jp: "{七時|しちじ}ごろ うちに {帰|かえ}ります。 → about 7:00"
        romaji: "Shichiji goro uchi ni kaerimasu."
        en: "He goes home at about seven."
        vi: "Khoảng 7 giờ về nhà."
      - jp: "Q5 ・ よく テレビを {見|み}ますか。"
        quiz: true
        en: "Does he often watch TV?"
        vi: "Anh ấy có hay xem TV không?"
      - jp: "テレビは あまり {見|み}ません。 → not much"
        romaji: "Terebi wa amari mimasen."
        en: "He doesn't watch TV much."
        vi: "Anh ấy không hay xem TV."
      - jp: "Q6 ・ {何時|なんじ}に {寝|ね}ますか。"
        quiz: true
        en: "What time does he go to bed?"
        vi: "Anh ấy đi ngủ lúc mấy giờ?"
      - jp: "{十一時|じゅういちじ}に {寝|ね}ます。 → 11:00"
        romaji: "Juuichiji ni nemasu."
        en: "He goes to bed at eleven."
        vi: "11 giờ đi ngủ."
    lines:
      - emma: "Last part. Yuki tells you about Takeshi's day. For each question, listen, write down the answer, then check."
      - yuki: "たけしさんは毎日六時に起きます。"
        pause: 2.5
      - yuki: "たけしさんは毎日六時に起きます。"
        focus: 1
        pause: 1.2
      - yuki: "十二時半に学校で昼ご飯を食べます。"
        focus: 2
        pause: 2.5
      - yuki: "十二時半に学校で昼ご飯を食べます。"
        focus: 3
        pause: 1.2
      - yuki: "よじに図書館で勉強します。"
        focus: 4
        pause: 2.5
      - yuki: "よじに図書館で勉強します。"
        focus: 5
        pause: 1.2
      - yuki: "しちじごろうちに帰ります。"
        focus: 6
        pause: 2.5
      - yuki: "しちじごろうちに帰ります。"
        focus: 7
        pause: 1.2
      - yuki: "テレビはあまり見ません。"
        focus: 8
        pause: 2.5
      - yuki: "テレビはあまり見ません。"
        focus: 9
        pause: 1.2
      - yuki: "十一時に寝ます。"
        focus: 10
        pause: 2.5
      - yuki: "十一時に寝ます。"
        focus: 11
        pause: 1.2
      - emma: "Well done. Listen to both dialogues again this week and repeat them in the pauses. Then try to tell a friend about your own day in Japanese."
