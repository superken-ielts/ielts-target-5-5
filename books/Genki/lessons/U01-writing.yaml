# U01 · Writing — GENKI I bài 1. Video luyện viết ~7 phút cho phiên Part C (まとめの練習 C: tự giới thiệu):
# chọn hiragana hay katakana, tên tiếng Việt bằng katakana, bẫy chính tả (は đọc wa, trường âm えい / おう),
# dấu câu, dựng đoạn tự giới thiệu từng câu, viết về một người bạn, lỗi hay gặp. Xem ghi chú đầu U01-speaking.yaml.
# Thẻ có dấu × là cách viết sai: không ai đọc thẻ đó; thẻ ○ ngay sau là cách viết đúng.
id: U01-writing
activity: U01-part-c
title: "Unit 1 · New Friends"
subtitle: "Writing · Your self-introduction in hiragana and katakana"
title_vi: "Luyện viết — đoạn tự giới thiệu bằng hiragana, katakana; viết tên tiếng Việt; lỗi hay gặp"
tag: "GENKI L1 · N5"
speakers:
  emma: {name: Emma, role: guide, voice: {kokoro: bf_emma}, color: "#00A8B5", speed: 1.0}
  yuki: {name: Yuki, role: Japanese tutor, lang: ja, voice: {kokoro: jf_alpha}, color: "#F39C12", speed: 0.88}

scenes:
  - kind: jp
    chapter: "Goals"
    heading: "Unit 1 Writing · A self-introduction, GENKI style"
    items:
      - jp: "はじめまして。グエン・ミン・アンです。"
        romaji: "Hajimemashite. Guen Min An desu."
        en: "Goal: write a seven-sentence self-introduction the way GENKI writes it — hiragana for Japanese words, katakana for foreign names, 。 and 、."
        vi: "Mục tiêu: viết đoạn tự giới thiệu 7 câu như GENKI — từ Nhật viết hiragana, tên nước ngoài viết katakana, dấu 。 và 、."
    lines:
      - emma: "Welcome to Unit 1 writing practice. By the end of this video you will write a short self-introduction in Japanese, the way your textbook writes it. Keep a pen and paper ready, and pause the video whenever you want to copy something."
      - yuki: "はじめまして。グエン・ミン・アンです。"
        pause: 1.5

  - kind: jp
    chapter: "Hiragana or katakana?"
    heading: "Which alphabet? · Hiragana or katakana"
    items:
      - jp: "わたし ・ がくせい ・ だいがく ・ せんこう"
        romaji: "watashi · gakusee · daigaku · senkoo"
        en: "Japanese words: hiragana. I, student, university, major."
        vi: "Từ tiếng Nhật: viết hiragana. tôi, sinh viên, đại học, chuyên ngành."
      - jp: "メアリー ・ アメリカ ・ ベトナム ・ ハノイ"
        romaji: "Mearii · Amerika · Betonamu · Hanoi"
        en: "Foreign names, countries and cities: katakana. ー makes a vowel long."
        vi: "Tên người, tên nước, thành phố nước ngoài: viết katakana. Dấu ー kéo dài nguyên âm."
      - jp: "グエン ・ チャン ・ レー ・ ファム ・ ホアン"
        romaji: "Guen · Chan · Ree · Famu · Hoan"
        en: "Vietnamese family names: Nguyen, Tran, Le, Pham, Hoang. Write how the name sounds, not how it is spelled."
        vi: "Họ Việt: Nguyễn, Trần, Lê, Phạm, Hoàng. Viết theo cách đọc, không theo chữ quốc ngữ."
      - jp: "ミン ・ アン ・ ドゥック ・ ラン ・ フオン"
        romaji: "Min · An · Dukku · Ran · Fuon"
        en: "Given names: Minh, Anh, Duc, Lan, Huong. Use ・ between family name and given name."
        vi: "Tên: Minh, Anh, Đức, Lan, Hương. Dùng dấu ・ ngăn họ, tên đệm và tên."
    lines:
      - emma: "Japanese uses two alphabets. Words that are originally Japanese are written in hiragana: I, student, university, major."
      - yuki: "わたし、学生、大学、専攻。"
        pause: 1.5
      - emma: "Names of foreign people, countries and cities are written in katakana. The long dash makes the vowel before it long."
        focus: 1
      - yuki: "メアリー、アメリカ、ベトナム、ハノイ。"
        pause: 1.5
      - emma: "Your Vietnamese name is also written in katakana. Write it the way it sounds, not the way it is spelled. Here are five common family names."
        focus: 2
      - yuki: "グエン、チャン、レー、ファム、ホアン。"
        pause: 1.5
      - emma: "And five given names. A small dot separates the family name, the middle name and the given name."
        focus: 3
      - yuki: "ミン、アン、ドゥック、ラン、フオン。"
        pause: 1.5

  - kind: jp
    chapter: "Spelling traps"
    heading: "Spelling traps · は, long vowels"
    items:
      - jp: "× わたしわ がくせいです。"
        en: "Wrong: the topic particle is pronounced wa, but it is never written わ."
        vi: "Sai: trợ từ chủ đề đọc là \"wa\" nhưng không bao giờ viết わ."
      - jp: "○ わたしは がくせいです。"
        romaji: "Watashi wa gakusee desu."
        en: "Right: write は, read wa."
        vi: "Đúng: viết は, đọc \"wa\"."
      - jp: "がくせい ・ せんせい ・ ねんせい"
        romaji: "gakusee · sensee · nensee"
        en: "A long e sound is written えい: student, teacher, … year student. It sounds like 'ee'."
        vi: "Âm e dài viết là えい: がくせい, せんせい, ねんせい — đọc gần như \"ee\"."
      - jp: "こうこう ・ そうです ・ ばんごう"
        romaji: "kookoo · soo desu · bangoo"
        en: "A long o sound is written おう: high school, that's right, number."
        vi: "Âm o dài viết là おう: こうこう (trung học), そうです (đúng vậy), ばんごう (số)."
      - jp: "おかあさん ・ おにいさん ・ じゅうきゅう"
        romaji: "okaasan · oniisan · juukyuu"
        en: "Long a, i, u: just double the vowel — mother, older brother, nineteen."
        vi: "Âm a, i, u dài: viết đôi nguyên âm — mẹ, anh trai, mười chín."
    lines:
      - emma: "Now some spelling traps. The first one is the most common mistake of all: writing the topic particle with the letter wa."
      - emma: "The particle sounds like wa, but it is always written with ha. Listen and look at the right version."
        focus: 1
      - yuki: "わたしは学生です。"
        pause: 1.5
      - emma: "Second trap: long vowels. A long e sound is usually written with the letter i. These words sound like gakusee and sensee, but they are spelled with i."
        say: "Second trap: long vowels. A long e sound is usually written with the letter ee. These words sound like gah-koo-say and sen-say, but they are spelled with ee."
        focus: 2
      - yuki: "学生、先生、年生。"
        say: "学生、先生、ねんせい。"
        pause: 1.5
      - emma: "A long o sound is usually written with the letter u."
        say: "A long oh sound is usually written with the letter oo."
        focus: 3
      - yuki: "高校、そうです、番号。"
        pause: 1.5
      - emma: "For long a, i and u, just write the vowel twice."
        say: "For long ah, ee and oo, just write the vowel twice."
        focus: 4
      - yuki: "お母さん、お兄さん、十九。"
        say: "おかあさん、おにいさん、じゅうきゅう。"
        pause: 1.5

  - kind: jp
    chapter: "Punctuation"
    heading: "Punctuation · 。、 and questions"
    items:
      - jp: "せんこうは なんですか。"
        romaji: "Senkoo wa nan desu ka."
        en: "。 is the full stop, 、 is the comma. A written question ends with か。 — GENKI uses no question mark here."
        vi: "。 là dấu chấm, 、 là dấu phẩy. Câu hỏi viết kết thúc bằng か。 — không cần dấu ？."
      - jp: "いいえ、にほんじんです。"
        romaji: "Iie, nihonjin desu."
        en: "Use 、 after はい and いいえ."
        vi: "Sau はい, いいえ dùng dấu 、."
      - jp: "アリゾナだいがくの がくせいです。"
        romaji: "Arizona daigaku no gakusee desu."
        en: "GENKI puts spaces between phrases in the first lessons to help you read. Normal Japanese has no spaces."
        vi: "GENKI để cách giữa các cụm ở mấy bài đầu cho dễ đọc. Văn bản Nhật bình thường không có dấu cách."
    lines:
      - emma: "Japanese punctuation is simple. The full stop is a small circle, and the comma is a small tick. A written question ends with the question particle and a full stop. You do not need a question mark."
      - yuki: "専攻はなんですか。"
        pause: 1.5
      - emma: "Put a comma after yes and no."
        focus: 1
      - yuki: "いいえ、にほんじんです。"
        pause: 1.5
      - emma: "In the first lessons, your textbook leaves a space between phrases so that you can read more easily. Real Japanese texts have no spaces at all. Both are fine in your homework."
        focus: 2
      - yuki: "アリゾナ大学の学生です。"
        pause: 1.5

  - kind: jp
    chapter: "Build it sentence by sentence"
    heading: "Build your self-introduction · Seven sentences"
    items:
      - jp: "① はじめまして。"
        romaji: "Hajimemashite."
        en: "1. Open: How do you do?"
        vi: "1. Mở đầu: Rất vui được gặp."
      - jp: "② グエン・ミン・アンです。"
        romaji: "Guen Min An desu."
        en: "2. Your name + です. Don't add さん to your own name."
        vi: "2. Tên bạn + です. Không thêm さん vào tên mình."
      - jp: "③ ベトナムじんです。"
        romaji: "Betonamujin desu."
        en: "3. Nationality: country + じん + です."
        vi: "3. Quốc tịch: tên nước + じん + です."
      - jp: "④ ハノイだいがくの がくせいです。"
        romaji: "Hanoi daigaku no gakusee desu."
        en: "4. School: school の がくせい. At work: company の かいしゃいん."
        vi: "4. Trường: tên trường の がくせい. Đi làm: tên công ty の かいしゃいん."
      - jp: "⑤ さんねんせいです。"
        romaji: "Sannensee desu."
        en: "5. Year: number + ねんせい (first year いちねんせい, fourth year よねんせい)."
        vi: "5. Năm học: số + ねんせい (năm nhất いちねんせい, năm tư よねんせい)."
      - jp: "⑥ せんこうは けいざいです。"
        romaji: "Senkoo wa keezai desu."
        en: "6. Major: せんこうは ＿ です. Or your age: はたちです。"
        vi: "6. Chuyên ngành: せんこうは ＿ です. Hoặc tuổi: はたちです。"
      - jp: "⑦ よろしく おねがいします。"
        romaji: "Yoroshiku onegaishimasu."
        en: "7. Close: Nice to meet you."
        vi: "7. Kết: Mong được giúp đỡ."
    lines:
      - emma: "Now let's build your self-introduction, one sentence at a time. Write each sentence with your own information. Sentence one: the opening."
      - yuki: "はじめまして。"
        pause: 1.5
      - emma: "Sentence two: your name, then the word for am. Never add the polite title to your own name."
        focus: 1
      - yuki: "グエン・ミン・アンです。"
        pause: 1.5
      - emma: "Sentence three: your nationality."
        focus: 2
      - yuki: "ベトナムじんです。"
        pause: 1.5
      - emma: "Sentence four: your school, linked with the particle no to the word for student. If you work, use your company and the word for office worker."
        focus: 3
      - yuki: "ハノイ大学の学生です。"
        pause: 1.5
      - emma: "Sentence five: your year."
        focus: 4
      - yuki: "三年生です。"
        pause: 1.5
      - emma: "Sentence six: your major, or your age."
        focus: 5
      - yuki: "専攻は経済です。"
        pause: 1.5
      - emma: "Sentence seven: the closing phrase."
        focus: 6
      - yuki: "よろしくお願いします。"
        pause: 1.5

  - kind: jp
    chapter: "Model paragraph"
    heading: "Model paragraph · Read it, then write yours"
    items:
      - jp: "はじめまして。グエン・ミン・アンです。ベトナムじんです。ハノイだいがくの がくせいです。さんねんせいです。せんこうは けいざいです。はたちです。よろしく おねがいします。"
        romaji: "Hajimemashite. Guen Min An desu. Betonamujin desu. Hanoi daigaku no gakusee desu. Sannensee desu. Senkoo wa keezai desu. Hatachi desu. Yoroshiku onegaishimasu."
        en: "How do you do? I'm Nguyen Minh Anh. I'm Vietnamese. I'm a student at Hanoi University, in my third year. My major is economics. I'm twenty. Nice to meet you."
        vi: "Đoạn mẫu: chép lại một lần, rồi thay thông tin của bạn vào. Đếm: 8 câu, mỗi câu kết thúc bằng 。"
      - jp: "はじめまして。チャン・バオ・ナムです。ベトナムじんです。ホーチミンの かいしゃいんです。にじゅうはっさいです。よろしく おねがいします。"
        romaji: "Hajimemashite. Chan Bao Namu desu. Betonamujin desu. Hoochimin no kaishain desu. Nijuuhassai desu. Yoroshiku onegaishimasu."
        en: "If you work: I'm Tran Bao Nam, Vietnamese, an office worker in Ho Chi Minh City. I'm 28. Nice to meet you."
        vi: "Nếu bạn đi làm: Trần Bảo Nam, người Việt Nam, nhân viên công ty ở TP. Hồ Chí Minh, 28 tuổi."
    lines:
      - emma: "Here is the whole paragraph. Read it with Yuki, copy it once, then write your own version."
      - yuki: "はじめまして。グエン・ミン・アンです。ベトナムじんです。ハノイ大学の学生です。三年生です。専攻は経済です。はたちです。よろしくお願いします。"
        pause: 2
      - emma: "And a version for someone who works. Notice: Ho Chi Minh City, then no, then office worker."
        say: "And a version for someone who works. Notice: Ho Chee Min City, then no, then office worker."
        focus: 1
      - yuki: "はじめまして。チャン・バオ・ナムです。ベトナムじんです。ホーチミンの会社員です。二十八歳です。よろしくお願いします。"
        say: "はじめまして。チャン・バオ・ナムです。ベトナムじんです。ホーチミンの会社員です。二十はっさいです。よろしくお願いします。"
        pause: 2

  - kind: jp
    chapter: "Writing about a friend"
    heading: "Write about a friend · Use さん"
    items:
      - jp: "わたしの ともだちは たけしさんです。"
        romaji: "Watashi no tomodachi wa Takeshi-san desu."
        en: "My friend is Takeshi. Add さん to other people's names."
        vi: "Bạn của tôi là anh Takeshi. Thêm さん sau tên người khác."
      - jp: "たけしさんは にほんじんです。だいがくの よねんせいです。"
        romaji: "Takeshi-san wa nihonjin desu. Daigaku no yonensee desu."
        en: "Takeshi is Japanese. He is a fourth-year university student."
        vi: "Takeshi là người Nhật, sinh viên năm tư."
      - jp: "メアリーさんは アメリカじんです。せんこうは にほんごです。"
        romaji: "Mearii-san wa amerikajin desu. Senkoo wa nihongo desu."
        en: "Mary is American. Her major is Japanese. No word for he or she is needed."
        vi: "Mary là người Mỹ. Chuyên ngành của cô ấy là tiếng Nhật. Không cần từ \"anh ấy / cô ấy\"."
    lines:
      - emma: "Next, write three sentences about a friend. Use the friend's name with the polite title, and start with: my friend is."
      - yuki: "わたしの友達はたけしさんです。"
        pause: 1.5
      - yuki: "たけしさんはにほんじんです。大学の四年生です。"
        say: "たけしさんはにほんじんです。大学のよねんせいです。"
        focus: 1
        pause: 1.5
      - emma: "Japanese does not need a word for he or she. Just repeat the name, or leave it out."
        focus: 2
      - yuki: "メアリーさんはアメリカじんです。専攻はにほんごです。"
        pause: 1.5

  - kind: jp
    chapter: "Common mistakes"
    heading: "Common mistakes · Check your paragraph"
    items:
      - jp: "× ドゥックさんです。"
        en: "Wrong: no さん after your own name."
        vi: "Sai: không thêm さん sau tên mình."
      - jp: "○ ドゥックです。"
        romaji: "Dukku desu."
        en: "Right: I'm Duc."
        vi: "Đúng: Tôi là Đức."
      - jp: "× にほんご せんせい"
        en: "Wrong: two nouns need の between them."
        vi: "Sai: hai danh từ đứng cạnh nhau cần の ở giữa."
      - jp: "○ にほんごの せんせい"
        romaji: "nihongo no sensee"
        en: "Right: teacher of Japanese."
        vi: "Đúng: giáo viên tiếng Nhật."
      - jp: "× あなたは なんさいですか。"
        en: "Avoid あなた (you): it can sound rude or too personal."
        vi: "Tránh あなた (bạn): dễ nghe thiếu lịch sự."
      - jp: "○ メアリーさんは なんさいですか。"
        romaji: "Mearii-san wa nansai desu ka."
        en: "Right: use the person's name + さん."
        vi: "Đúng: gọi bằng tên + さん."
      - jp: "× わたしは がくせいです？"
        en: "Wrong: a statement ending in です is not a question. Add か and 。."
        vi: "Sai: câu kết thúc bằng です không thành câu hỏi. Thêm か và 。."
      - jp: "○ がくせいですか。"
        romaji: "Gakusee desu ka."
        en: "Right: Are you a student?"
        vi: "Đúng: Bạn là sinh viên à?"
    lines:
      - emma: "Before you finish, check your paragraph for these four common mistakes. One: never put the polite title after your own name."
      - yuki: "ドゥックです。"
        focus: 1
        pause: 1.5
      - emma: "Two: when two nouns stand together, link them with no."
        focus: 2
      - yuki: "にほんごの先生。"
        focus: 3
        pause: 1.5
      - emma: "Three: avoid the word for you. Use the person's name with the polite title instead."
        focus: 4
      - yuki: "メアリーさんは何歳ですか。"
        focus: 5
        pause: 1.5
      - emma: "Four: a written question needs the question particle at the end. A question mark alone is not enough."
        focus: 6
      - yuki: "学生ですか。"
        focus: 7
        pause: 1.5

  - kind: jp
    chapter: "Your task"
    heading: "Your task · Write, then read it aloud"
    items:
      - jp: "わたしの じこしょうかい"
        romaji: "Watashi no jikoshookai"
        en: "Task: write your self-introduction (7–8 sentences) and 3 sentences about a friend. Check: は not わ, の between nouns, か。 for questions, no さん for yourself. Then read it aloud."
        vi: "Bài tập: viết đoạn tự giới thiệu 7–8 câu và 3 câu về một người bạn. Soát: は không phải わ, の giữa hai danh từ, câu hỏi có か。, không thêm さん cho mình. Rồi đọc to. じこしょうかい (自己紹介 – tự kỷ thiệu giới) = tự giới thiệu."
    lines:
      - emma: "Your task. Pause the video now. Write your self-introduction, seven or eight sentences, and three sentences about a friend. Then check the four points on the screen, and read your paragraph aloud. Self-introduction in Japanese is this word."
      - yuki: "わたしの自己紹介。"
        pause: 1.5
      - emma: "Well done. In the next unit, you will write about things you own and go shopping in Japanese."
