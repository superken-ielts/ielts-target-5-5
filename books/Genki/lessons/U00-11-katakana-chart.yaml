# U00 · Katakana 1 — GENKI I, Japanese Writing System (trang 24–25). Katakana là gì, dùng khi nào (từ mượn, tên nước
# ngoài), sáu chữ giống hiragana, bảng chữ theo nhóm hàng (mỗi hàng Yuki đọc từng chữ, chữ đang đọc sáng lên, rồi lượt
# nhắc lại), cả bảng với audio gốc JWS-09 (giới thiệu tới 6.7 giây → `start: 7.6`; bảng hai cột như hiragana nên `hl`
# theo thứ tự đọc), chữ dễ nhầm (シ ツ ソ ン…).
# Cách đọc: ヘ đọc riêng bằng katakana là "he" (không bị coi là trợ từ như へ).
id: U00-11-katakana-chart
activity: U00-kana
title: "Unit 0 · The Japanese Writing System"
subtitle: "Katakana 1 · The chart and look-alike letters"
title_vi: "Katakana 1 — katakana dùng khi nào, bảng 46 chữ, chữ giống hiragana, chữ dễ nhầm (シ ツ ソ ン)"
tag: "GENKI L0 · N5"
gap: 0.8
scene_gap: 1.5
step: 0.9
speakers:
  emma: {name: Emma, role: guide, voice: {kokoro: bf_emma}, color: "#00A8B5", speed: 0.9}
  yuki: {name: Yuki, role: Japanese tutor, lang: ja, voice: {kokoro: jf_alpha}, color: "#F39C12", speed: 0.78}

scenes:
  - kind: jp
    chapter: "Goals"
    heading: "In this video · Katakana, the second alphabet"
    items:
      - jp: "カタカナ"
        romaji: "katakana"
        en: "The same sounds as hiragana, with straighter shapes. Used for words from other languages and foreign names."
        vi: "Cùng các âm như hiragana nhưng nét thẳng, góc cạnh hơn. Dùng cho từ mượn tiếng nước ngoài và tên người nước ngoài."
      - jp: "ベトナム ・ ハノイ ・ コーヒー"
        romaji: "betonamu · hanoi · koohii"
        en: "Vietnam · Hanoi · coffee — all written in katakana."
        vi: "Việt Nam · Hà Nội · cà phê — đều viết bằng katakana."
    lines:
      - emma: "Welcome back. You can read hiragana. Now: katakana, the second alphabet."
        vi: "Chào mừng bạn trở lại. Bạn đã đọc được hiragana. Giờ là katakana, bảng chữ cái thứ hai."
      - yuki: "カタカナ。"
        en: "katakana"
        vi: "katakana"
        pause: 1
      - emma: "Katakana has exactly the same sounds as hiragana, but the shapes are straighter."
        vi: "Katakana có đúng các âm như hiragana, nhưng nét chữ thẳng hơn."
      - emma: "Why learn it? Japanese uses katakana for words from other languages, and for foreign names. For example: Vietnam, Hanoi, and coffee."
        say: "Why learn it? Japanese yoozes katakana for words from other languages, and for foreign names. For example: Vietnam, Hanoi, and coffee."
        vi: "Học để làm gì? Tiếng Nhật dùng katakana cho từ mượn tiếng nước ngoài và tên người nước ngoài. Ví dụ: Việt Nam, Hà Nội, cà phê."
        focus: 1
      - yuki: "ベトナム、ハノイ、コーヒー。"
        en: "Vietnam, Hanoi, coffee"
        vi: "Việt Nam, Hà Nội, cà phê"
        pause: 1
      - emma: "Your own name will be written in katakana too."
        vi: "Tên của bạn cũng sẽ được viết bằng katakana."

  - kind: jp
    chapter: "Like hiragana"
    heading: "An easy start · six katakana that look like hiragana"
    items:
      - jp: "カ か ・ キ き ・ ヘ へ ・ リ り ・ モ も ・ ヤ や"
        en: "ka, ki, he, ri, mo, ya: these katakana look almost the same as their hiragana."
        vi: "ka, ki, he, ri, mo, ya: sáu chữ katakana này gần giống hiragana cùng âm."
    lines:
      - emma: "Good news: some katakana look almost the same as their hiragana. Start with these six."
        vi: "Tin vui: một số chữ katakana trông gần giống chữ hiragana cùng âm. Hãy bắt đầu với sáu chữ này."
      - yuki: "カ、キ、ヘ、リ、モ、ヤ。"
        hl: [0, 2, 4, 6, 8, 10]
        en: "ka, ki, he, ri, mo, ya"
        vi: "ka, ki, he, ri, mo, ya"
        echo: true

  - kind: jp
    chapter: "ア to ソ"
    heading: "Rows ア, カ, サ"
    items:
      - jp: "ア イ ウ エ オ\nカ キ ク ケ コ\nサ シ ス セ ソ"
        romaji: "a i u e o\nka ki ku ke ko\nsa shi su se so"
        en: "The same sounds as あいうえお, かきくけこ, さしすせそ."
        vi: "Cùng âm với あいうえお, かきくけこ, さしすせそ."
    lines:
      - emma: "Now the chart, row by row. You know the sounds, so look carefully at the new shapes."
        vi: "Giờ là bảng chữ, từng hàng một. Bạn đã biết các âm, nên hãy nhìn kỹ hình chữ mới."
      - yuki: "ア、イ、ウ、エ、オ。"
        hl: [0, 1, 2, 3, 4]
        en: "a, i, u, e, o"
        vi: "a, i, ư, ê, ô"
        echo: true
      - yuki: "カ、キ、ク、ケ、コ。"
        hl: [5, 6, 7, 8, 9]
        en: "ka, ki, ku, ke, ko"
        vi: "ca, ki, cư, kê, cô"
        echo: true
      - yuki: "サ、シ、ス、セ、ソ。"
        hl: [10, 11, 12, 13, 14]
        en: "sa, shi, su, se, so"
        vi: "xa, shi, xư, xê, xô"
        echo: true

  - kind: jp
    chapter: "タ to ホ"
    heading: "Rows タ, ナ, ハ"
    items:
      - jp: "タ チ ツ テ ト\nナ ニ ヌ ネ ノ\nハ ヒ フ ヘ ホ"
        romaji: "ta chi tsu te to\nna ni nu ne no\nha hi fu he ho"
        en: "チ is chi, ツ is tsu, フ is fu — as in hiragana."
        vi: "チ là chi, ツ là tsu, フ là fu — giống hiragana."
    lines:
      - emma: "The next three rows. Chi, tsu and fu are the same special sounds as in hiragana."
        say: "The next three rows. Chee, tsoo and foo are the same special sounds as in hiragana."
        vi: "Ba hàng tiếp theo. Chi, tsu và fu là những âm đặc biệt giống như ở hiragana."
      - yuki: "タ、チ、ツ、テ、ト。"
        hl: [0, 1, 2, 3, 4]
        en: "ta, chi, tsu, te, to"
        vi: "ta, chi, tsư, tê, tô"
        echo: true
      - yuki: "ナ、ニ、ヌ、ネ、ノ。"
        hl: [5, 6, 7, 8, 9]
        en: "na, ni, nu, ne, no"
        vi: "na, ni, nư, nê, nô"
        echo: true
      - yuki: "ハ、ヒ、フ、ヘ、ホ。"
        hl: [10, 11, 12, 13, 14]
        en: "ha, hi, fu, he, ho"
        vi: "ha, hi, fư, hê, hô"
        echo: true

  - kind: jp
    chapter: "マ to ン"
    heading: "Rows マ, ヤ, ラ, ワ and ン"
    items:
      - jp: "マ ミ ム メ モ\nヤ ユ ヨ\nラ リ ル レ ロ\nワ ヲ ン"
        romaji: "ma mi mu me mo\nya yu yo\nra ri ru re ro\nwa o n"
        en: "ヲ is almost never used in katakana; ン is n."
        vi: "ヲ hầu như không dùng trong katakana; ン là n."
    lines:
      - emma: "And the last rows. In katakana, the letter o in the last row is almost never used."
        vi: "Và những hàng cuối. Trong katakana, chữ “o” ở hàng cuối hầu như không được dùng."
      - yuki: "マ、ミ、ム、メ、モ。"
        hl: [0, 1, 2, 3, 4]
        en: "ma, mi, mu, me, mo"
        vi: "ma, mi, mư, mê, mô"
        echo: true
      - yuki: "ヤ、ユ、ヨ。"
        hl: [5, 6, 7]
        en: "ya, yu, yo"
        vi: "ya, yu, yo"
        echo: true
      - yuki: "ラ、リ、ル、レ、ロ。"
        hl: [8, 9, 10, 11, 12]
        en: "ra, ri, ru, re, ro"
        vi: "la, li, lư, lê, lô (lưỡi chạm nhẹ)"
        echo: true
      - yuki: "ワ、ヲ、ン。"
        hl: [13, 14, 15]
        en: "wa, o, n"
        vi: "oa, ô, n"
        echo: true

  - kind: jp
    chapter: "The whole chart"
    heading: "All 46 katakana · Read along with the book's audio"
    items:
      - jp: "ア　イ　ウ　エ　オ　　　ハ　ヒ　フ　ヘ　ホ\nカ　キ　ク　ケ　コ　　　マ　ミ　ム　メ　モ\nサ　シ　ス　セ　ソ　　　ヤ　ユ　ヨ\nタ　チ　ツ　テ　ト　　　ラ　リ　ル　レ　ロ\nナ　ニ　ヌ　ネ　ノ　　　ワ　ヲ　ン"
        en: "The 46 basic katakana: down the left column, then the right."
        vi: "46 chữ katakana cơ bản: cột trái từ trên xuống, rồi cột phải."
    lines:
      - emma: "Now the whole chart, read by the native speaker on your textbook's audio. Follow the orange letter, and say it in the pause."
        vi: "Giờ là cả bảng, do người Nhật trong audio của sách đọc. Nhìn theo chữ màu cam, và đọc theo trong khoảng nghỉ."
      - track: JWS-09
        start: 7.6
        note: "Japanese Writing System · JWS-09"
        en: "a i u e o · ka … · wa o n"
        vi: "a i ư ê ô · ca … · oa ô n"
        hl: [0, 1, 2, 3, 4, 10, 11, 12, 13, 14, 20, 21, 22, 23, 24, 28, 29, 30, 31, 32, 38, 39, 40, 41, 42,
             5, 6, 7, 8, 9, 15, 16, 17, 18, 19, 25, 26, 27, 33, 34, 35, 36, 37, 43, 44, 45]
        step: 1.2
        pause: 1

  - kind: jp
    chapter: "Look-alike katakana"
    heading: "Look-alike katakana · Watch the strokes"
    items:
      - jp: "シ ・ ツ ・ ソ ・ ン"
        romaji: "shi · tsu · so · n"
        en: "シ and ン: the long stroke goes up from the bottom. ツ and ソ: it comes down from the top."
        vi: "シ và ン: nét dài viết từ dưới hất lên. ツ và ソ: nét dài viết từ trên xuống."
      - jp: "ク ・ ケ ・ タ ・ ウ ・ ワ ・ フ"
        romaji: "ku · ke · ta · u · wa · fu"
        en: "タ is ク with a short stroke inside. ウ has a dot on top, ワ a short line on the left, フ is one stroke."
        vi: "タ là ク thêm một nét ngắn bên trong. ウ có chấm trên đầu, ワ có nét ngắn bên trái, フ chỉ một nét."
      - jp: "ス ・ ヌ ・ コ ・ ユ"
        romaji: "su · nu · ko · yu"
        en: "ヌ is ス with an extra stroke across. ユ's bottom line sticks out to the left."
        vi: "ヌ là ス thêm một nét cắt ngang. Nét dưới của ユ chìa sang trái."
      - jp: "チ ・ テ ・ ア ・ マ"
        romaji: "chi · te · a · ma"
        en: "チ starts with a slanted stroke, テ with two flat lines. ア's second stroke falls outside, マ's is a small dot inside."
        vi: "チ bắt đầu bằng nét xiên, テ bằng hai nét ngang. Nét thứ hai của ア kéo ra ngoài, của マ là chấm nhỏ bên trong."
    lines:
      - emma: "Some katakana look alike. The famous four: watch the direction of the long stroke."
        vi: "Một số chữ katakana trông giống nhau. Bốn chữ nổi tiếng: hãy nhìn hướng của nét dài."
      - yuki: "シ、ツ、ソ、ン。"
        en: "shi, tsu, so, n"
        vi: "shi, tsu, so, n"
        pause: 1
      - emma: "Shi and n: the long stroke goes up from the bottom. Tsu and so: it comes down from the top."
        vi: "Shi và n: nét dài đi từ dưới lên. Tsu và so: nét dài đi từ trên xuống."
        hl: [0, 3]
      - emma: "Next, look for small extra strokes."
        vi: "Tiếp theo, hãy tìm những nét nhỏ thêm vào."
        focus: 1
      - yuki: "ク、ケ、タ、ウ、ワ、フ。"
        en: "ku, ke, ta, u, wa, fu"
        vi: "ku, ke, ta, u, wa, fu"
        pause: 1
      - emma: "Two more pairs."
        vi: "Thêm hai cặp nữa."
        focus: 2
      - yuki: "ス、ヌ、コ、ユ。"
        en: "su, nu, ko, yu"
        vi: "su, nu, ko, yu"
        pause: 1
      - emma: "And the last two pairs."
        vi: "Và hai cặp cuối."
        focus: 3
      - yuki: "チ、テ、ア、マ。"
        en: "chi, te, a, ma"
        vi: "chi, te, a, ma"
        pause: 1
      - emma: "Write each katakana three times, and read the chart once a day. Next video: katakana words, and a first look at kanji."
        vi: "Viết mỗi chữ katakana ba lần, và mỗi ngày đọc bảng chữ một lần. Video tiếp theo: từ katakana và làm quen với chữ Hán."
