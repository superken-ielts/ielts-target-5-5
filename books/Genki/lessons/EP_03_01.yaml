scenes:
  - kind: jp
    chapter: "Verb groups & ～ます / ～ません"
    heading: "Unit 3.1: Verb Groups & Polite [ ～ます / ～ません ]"
    items:
      - jp: "Ru-verbs (たべる → たべます) | U-verbs (のむ → のみます)"
        romaji: "Affirmative: ~masu | Negative: ~masen"
        en: "Grammar Point 1: Ru-verbs drop '-ru' + masu. U-verbs change final '-u' to '-i' + masu. Irregular: suru -> shimasu, kuru -> kimasu."
        vi: "Điểm ngữ pháp 1: Chia thể lịch sự Hiện tại/Tương lai (~masu = làm / ~masen = không làm)."
    lines:
      - emma: "Welcome to Unit 3, Part A! In Genki Lesson 3, Grammar Point 1 introduces Japanese action verbs! Every verb has a dictionary form and a polite 'mas' form. We use 'mas' for affirmative and 'mas-en' for negative in both habitual present and future actions."
        say: "Welcome to Unit 3, Part A! In Ghen-kee Lesson 3, Grammar Point 1 introduces Japanese action verbs! Every verb has a dictionary form and a polite 'mahss' form. We use 'mahss' for affirmative and 'mah-sen' for negative in both habitual present and future actions."
        pause: 0.6

  - kind: jp
    chapter: "Shadowing: core action verbs"
    heading: "Shadowing: Core Action Verbs"
    items:
      - jp: "{食|た}べます・{食|た}べません / {飲|の}みます・{飲|の}みません / {勉強|べんきょう}します・{勉強|べんきょう}しません"
        romaji: "Tabemasu / Tabemasen | Nomimasu / Nomimasen | Benkyou shimasu / Benkyou shimasen"
        en: "Eat / Don't eat | Drink / Don't drink | Study / Don't study."
        vi: "Ăn / Không ăn (Nhóm 2) | Uống / Không uống (Nhóm 1) | Học / Không học (Bất quy tắc)."
    lines:
      - yuki: "たべます、たべません。のみます、のみません。べんきょうします、べんきょうしません。"
        pause: 1.8

  - kind: jp
    chapter: "Invitations ～ませんか"
    heading: "Unit 3.1: Polite Invitations [ ～ませんか？ ]"
    items:
      - jp: "いっしょに コーヒーを {飲|の}みませんか？ — いいですね！"
        romaji: "Issho ni koohii o nomimasen ka? — Ii desu ne!"
        en: "Grammar Point 5: '~masen ka?' = Would you like to...? 'Ii desu ne!' = Sounds great!"
        vi: "Điểm ngữ pháp 5: Câu rủ rê lịch sự '~masen ka?'. Trả lời đồng ý: 'Ii desu ne!' (Hay quá nhỉ!)."
    lines:
      - emma: "Let's also check Grammar Point 5 right away: when you change 'mas-en' into a question, 'mas-en ka', it becomes a polite invitation meaning 'Won't you do this with me?'"
        say: "Let's also check Grammar Point 5 right away: when you change 'mah-sen' into a question, 'mah-sen kah', it becomes a polite invitation meaning 'Won't you do this with me?'"
        pause: 0.5

  - kind: jp
    chapter: "Shadowing: making a date"
    heading: "Shadowing: Making a Date"
    items:
      - jp: "あした、いっしょに {映画|えいが}を{見|み}ませんか？ — いいですね。"
        romaji: "Ashita, issho ni eiga o mimasen ka? — Ii desu ne."
        en: "Would you like to watch a movie together tomorrow? — Sounds good!"
        vi: "Ngày mai bạn có muốn cùng đi xem phim không? — Ý kiến hay đấy."
    lines:
      - yuki: "あした、いっしょに映画を見ませんか？いいですね。"
        pause: 2.0
