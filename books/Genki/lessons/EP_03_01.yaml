id: EP_03_01
activity: U03-part-a
title: "Unit 3 · Making a Date"
subtitle: "EP 3.1 · Verb Conjugation: The Polite '-masu' and '-masen' Forms"
title_vi: "Phần A — Chia động từ ～ます / ～ません và lời mời ～ませんか"
tag: "TARGET N5 • 5.0"
gap: 0
scene_gap: 0
speakers:
  emma: {name: Emma, role: grammar & topic guide, voice: {kokoro: bf_emma}, color: "#00A8B5", speed: 1.0}
