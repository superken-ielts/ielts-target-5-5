  - kind: jp
    chapter: "Long vowels"
    heading: "Long vowels · hold for two beats"
    items:
      - jp: "おばあさん ・ おばさん"
        romaji: "obaasan · obasan"
        en: "grandmother · aunt. Hold a long vowel for two beats."
        vi: "bà · cô / dì. Trường âm kéo dài hai nhịp; sai độ dài là sai nghĩa."
      - jp: "おじいさん ・ おじさん"
        romaji: "ojiisan · ojisan"
        en: "grandfather · uncle"
        vi: "ông · chú / bác"
      - jp: "すうじ ・ えいが ・ おねえさん"
        romaji: "suuji · eega · oneesan"
        en: "number · movie · big sister. A long e is usually written えい (said ee), sometimes ええ."
        vi: "con số · phim · chị gái. e dài thường viết えい (đọc “ê-ê”), đôi khi ええ."
      - jp: "ほうりつ ・ とお"
        romaji: "hooritsu · too"
        en: "law · ten. A long o is usually written おう, sometimes おお."
        vi: "luật · mười. o dài thường viết おう, đôi khi おお."
      - jp: "おばあさん ・ おばさん\nおじいさん ・ おじさん\nすうじ\nえいが ・ おねえさん\nほうりつ ・ とお"
        en: "Listen to the native speaker and copy the length of each vowel."
        vi: "Nghe người Nhật đọc và bắt chước đúng độ dài từng nguyên âm."
    lines:
      - emma: "A long vowel is the same vowel held for two beats. Grandmother, and aunt."
        vi: "Nguyên âm dài là cùng một nguyên âm kéo dài hai nhịp. Bà, và cô."
      - yuki: "おばあさん、おばさん。"
        en: "grandmother, aunt"
        vi: "bà, cô / dì"
        pause: 1
      - emma: "Grandfather, and uncle."
        vi: "Ông, và chú."
        focus: 1
      - yuki: "おじいさん、おじさん。"
        en: "grandfather, uncle"
        vi: "ông, chú / bác"
        pause: 1
      - emma: "A long u is written with u. A long e is usually written with i, but you say a long e. Number, movie, big sister."
        say: "A long oo is written with oo. A long eh is usually written with ee, but you say a long eh. Number, movie, big sister."
        vi: "U dài viết thêm う. E dài thường viết thêm い, nhưng đọc là “ê” kéo dài. Con số, phim, chị gái."
        focus: 2
      - yuki: "すうじ、えいが、おねえさん。"
        en: "number, movie, big sister"
        vi: "con số, phim, chị gái"
        pause: 1
      - emma: "A long o is usually written with u. Law, and ten."
        say: "A long oh is usually written with oo. Law, and ten."
        vi: "O dài thường viết thêm う. Luật, và mười."
        focus: 3
      - yuki: "ほうりつ、とお。"
        en: "law, ten"
        vi: "luật, mười"
        pause: 1
      - emma: "Now the book's audio. Copy the length of each vowel."
        vi: "Giờ là audio của sách. Bắt chước đúng độ dài từng nguyên âm."
        focus: 4
      - track: "JWS-06"
        start: 10.0
        note: "Japanese Writing System · JWS-06"
        en: "grandmother · aunt · grandfather · uncle · number · movie · big sister · law · ten"
        vi: "bà · cô · ông · chú · con số · phim · chị gái · luật · mười"
        step: 1.2
