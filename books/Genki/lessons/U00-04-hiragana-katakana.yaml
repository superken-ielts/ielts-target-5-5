# U00 · Hiragana 4 & Katakana 1 — GENKI I, Japanese Writing System (trang 22–25). Video 7–10 phút, không đếm ngược
# (đợt 27): っ nhỏ với audio gốc JWS-04 (mỗi từ một dòng `start` / `end`: っ là khoảng lặng giữa từ), ん + hàng な
# (JWS-05), trường âm (JWS-06 từ 10.0 giây), ん đọc n / m / ng, nguyên âm bị nuốt (JWS-07), cao độ (JWS-08), đọc từ;
# rồi katakana: dùng khi nào, sáu chữ giống hiragana, các hàng theo nhóm, cả bảng với JWS-09 (`start: 7.6`).
# Cách đọc: ヘ đọc riêng bằng katakana là "he" (không bị coi là trợ từ như へ).
