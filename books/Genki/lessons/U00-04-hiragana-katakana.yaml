  - kind: jp
    chapter: "Goals"
    heading: "Katakana, the second alphabet"
    items:
      - jp: "カタカナ"
        romaji: "katakana"
        en: "The same sounds as hiragana, with straighter shapes. Used for words from other languages and foreign names."
        vi: "Cùng các âm như hiragana nhưng nét thẳng, góc cạnh hơn. Dùng cho từ mượn tiếng nước ngoài và tên người nước ngoài."
      - jp: "ベトナム ・ ハノイ ・ コーヒー"
        romaji: "betonamu · hanoi · koohii"
        en: "Vietnam · Hanoi · coffee — all written in katakana."
        vi: "Việt Nam · Hà Nội · cà phê — đều viết bằng katakana."
    lines:
      - emma: "You can read hiragana. Now: katakana, the second alphabet."
        vi: "Bạn đã đọc được hiragana. Giờ là katakana, bảng chữ cái thứ hai."
      - yuki: "カタカナ。"
        en: "katakana"
        vi: "katakana"
        pause: 1
      - emma: "Katakana has exactly the same sounds as hiragana, but the shapes are straighter."
        vi: "Katakana có đúng các âm như hiragana, nhưng nét chữ thẳng hơn."
      - emma: "Why learn it? Japanese uses katakana for words from other languages, and for foreign names. For example: Vietnam, Hanoi, and coffee."
        say: "Why learn it? Japanese yoozes katakana for words from other languages, and for foreign names. For example: Vietnam, Hanoi, and coffee."
        vi: "Học để làm gì? Tiếng Nhật dùng katakana cho từ mượn tiếng nước ngoài và tên người nước ngoài. Ví dụ: Việt Nam, Hà Nội, cà phê."
        focus: 1
      - yuki: "ベトナム、ハノイ、コーヒー。"
        en: "Vietnam, Hanoi, coffee"
        vi: "Việt Nam, Hà Nội, cà phê"
        pause: 1
      - emma: "Your own name will be written in katakana too."
        vi: "Tên của bạn cũng sẽ được viết bằng katakana."

