# U03 · Writing — GENKI I bài 3. Video luyện viết ~6 phút cho phiên Part C (まとめの練習): 15 chữ Hán đầu tiên
# (読み書き bài 3: số, 円, 時), ba quy tắc thứ tự nét, cách đọc đổi âm, viết câu theo trật tự thời gian → nơi chốn →
# tân ngữ → động từ, đoạn văn về một ngày (viết như người học bài 3: kana + chữ Hán số), tin nhắn mời bạn, chính tả
# (かきとり), lỗi hay gặp.
# Chữ Hán chưa học (毎, 日, 学…) viết bằng kana đúng như bài đọc 読み書き bài 3. Xem ghi chú đầu U01-writing.yaml.
id: U03-writing
activity: U03-part-c
title: "Unit 3 · Making a Date"
subtitle: "Writing · Number kanji and your daily routine"
title_vi: "Luyện viết — chữ Hán số, giờ, giá tiền; đoạn văn về một ngày; tin nhắn mời bạn"
tag: "GENKI L3 · N5"
speakers:
  emma: {name: Emma, role: guide, voice: {kokoro: bf_emma}, color: "#00A8B5", speed: 1.0}
  yuki: {name: Yuki, role: Japanese tutor, lang: ja, voice: {kokoro: jf_alpha}, color: "#F39C12", speed: 0.88}

scenes:
  - kind: jp
    chapter: "Goals"
    heading: "Unit 3 Writing · Daily life"
    items:
      - jp: "まいにちの せいかつ"
        romaji: "Mainichi no seekatsu"
        en: "Goal: write the first 15 kanji in context — numbers, prices, times — and a paragraph about your daily routine."
        vi: "Mục tiêu: viết 15 chữ Hán đầu tiên trong câu — số, giá tiền, giờ — và một đoạn văn về một ngày của bạn. せいかつ (生活 – sinh hoạt)."
    lines:
      - emma: "Welcome to Unit 3 writing practice. Lesson 3 is where you start writing kanji. Today you will use the first fifteen kanji, the numbers, yen and o'clock, and write a paragraph about your daily routine. The title of the reading in your textbook is daily life."
      - yuki: "まいにちのせいかつ。"
        pause: 1.5

  - kind: jp
    chapter: "The first 15 kanji"
    heading: "Kanji of Lesson 3 · 一 to 十, 百, 千, 万, 円, 時"
    items:
      - jp: "{一|いち} ・ {二|に} ・ {三|さん} ・ {四|よん} ・ {五|ご}"
        romaji: "ichi · ni · san · yon · go"
        en: "One to five. 一, 二, 三 are just one, two and three lines — write them from top to bottom, left to right."
        vi: "Một đến năm. 一, 二, 三 là một, hai, ba nét ngang — viết từ trên xuống, trái sang phải."
      - jp: "{六|ろく} ・ {七|なな} ・ {八|はち} ・ {九|きゅう} ・ {十|じゅう}"
        romaji: "roku · nana · hachi · kyuu · juu"
        en: "Six to ten. 七 and 九 have two readings each: なな / しち, きゅう / く."
        vi: "Sáu đến mười. 七 và 九 mỗi chữ có hai cách đọc: なな / しち, きゅう / く."
      - jp: "{百|ひゃく} ・ {千|せん} ・ {万|まん} ・ {円|えん} ・ {時|じ}"
        romaji: "hyaku · sen · man · en · ji"
        en: "hundred, thousand, ten thousand, yen, o'clock."
        vi: "trăm (bách), nghìn (thiên), vạn (vạn), yên (viên), giờ (thời)."
    lines:
      - emma: "Here are the fifteen kanji of Lesson 3. Write each one five times while you listen. One to five."
      - yuki: "いち、に、さん、よん、ご。"
        pause: 2
      - emma: "Six to ten. Notice that seven and nine each have two readings."
        focus: 1
      - yuki: "ろく、なな、はち、きゅう、じゅう。"
        pause: 2
      - emma: "Hundred, thousand, ten thousand, yen, and o'clock."
        focus: 2
      - yuki: "百、千、万、円、じ。"
        pause: 2

  - kind: jp
    chapter: "Stroke order"
    heading: "Stroke order · Three basic rules"
    items:
      - jp: "{三|さん}"
        romaji: "san"
        en: "Rule 1: top to bottom."
        vi: "Quy tắc 1: trên trước, dưới sau."
      - jp: "{十|じゅう}"
        romaji: "juu"
        en: "Rule 2: a horizontal line before the vertical line that crosses it — ー first, then ｜."
        vi: "Quy tắc 2: nét ngang trước, nét sổ cắt qua nó sau."
      - jp: "{八|はち} ・ {時|じ}"
        romaji: "hachi · ji"
        en: "Rule 3: left before right. 八: the left stroke first. 時: the left part first, then the right part."
        vi: "Quy tắc 3: trái trước, phải sau. 八: nét trái trước. 時: phần bên trái trước, rồi phần bên phải."
      - jp: "{千|せん}"
        romaji: "sen"
        en: "千: the short slanted stroke on top first, then the horizontal line, then the vertical line."
        vi: "千: nét phẩy ngắn trên cùng trước, rồi nét ngang, cuối cùng nét sổ."
    lines:
      - emma: "Kanji look better, and are easier to remember, when you write the strokes in the right order. Three basic rules. Rule one: top to bottom."
      - yuki: "三。"
        pause: 1.5
      - emma: "Rule two: a horizontal line comes before the vertical line that crosses it."
        focus: 1
      - yuki: "十。"
        pause: 1.5
      - emma: "Rule three: left before right. In eight, the left stroke comes first. In o'clock, write the left part first."
        focus: 2
      - yuki: "八、じ。"
        pause: 1.5
      - emma: "Thousand starts with the short slanted stroke on top, then the horizontal line, and the vertical line last. Check the stroke order of every new kanji in the kanji table of your textbook."
        focus: 3
      - yuki: "千。"
        pause: 1.5

  - kind: jp
    chapter: "Readings that change"
    heading: "Kanji in words · Readings that change"
    items:
      - jp: "{四時|よじ} ・ {七時|しちじ} ・ {九時|くじ}"
        romaji: "yoji · shichiji · kuji"
        en: "Four, seven and nine o'clock use special readings."
        vi: "4 giờ, 7 giờ, 9 giờ đọc theo cách riêng."
      - jp: "{三百|さんびゃく} ・ {六百|ろっぴゃく} ・ {八百|はっぴゃく}"
        romaji: "sanbyaku · roppyaku · happyaku"
        en: "300, 600, 800 — the same kanji 百, different sounds."
        vi: "300, 600, 800 — cùng chữ 百 nhưng đọc khác."
      - jp: "{三千|さんぜん} ・ {八千|はっせん} ・ {一万|いちまん}"
        romaji: "sanzen · hassen · ichiman"
        en: "3,000, 8,000, 10,000."
        vi: "3.000, 8.000, 10.000."
      - jp: "{千円|せんえん} ・ {三千五百円|さんぜんごひゃくえん} ・ {一万二千円|いちまんにせんえん}"
        romaji: "sen en · sanzengohyaku en · ichiman nisen en"
        en: "Prices in kanji: 1,000 yen, 3,500 yen, 12,000 yen. Write the units from big to small: 万, 千, 百."
        vi: "Giá tiền bằng chữ Hán: 1.000, 3.500, 12.000 yên. Viết từ đơn vị lớn đến nhỏ: 万, 千, 百."
    lines:
      - emma: "When these kanji join into words, some readings change. You learned them in speaking. Now see them in writing. Times first."
      - yuki: "よじ、しちじ、くじ。"
        pause: 2
      - emma: "Hundreds."
        focus: 1
      - yuki: "三百、六百、八百。"
        pause: 2
      - emma: "Thousands and ten thousand."
        focus: 2
      - yuki: "三千、八千、一万。"
        pause: 2
      - emma: "Prices. Write the big units first, exactly as you say them."
        focus: 3
      - yuki: "千円、三千五百円、一万二千円。"
        pause: 2.2

  - kind: jp
    chapter: "Building sentences"
    heading: "Sentence order · Time → place で → object を → verb"
    items:
      - jp: "わたしは まいにち {七時|しちじ}に おきます。"
        romaji: "Watashi wa mainichi shichiji ni okimasu."
        en: "I get up at seven every day. Order: topic は → time → verb."
        vi: "Tôi dậy lúc 7 giờ mỗi ngày. Trật tự: chủ đề は → thời gian → động từ."
      - jp: "{八時|はちじ}に がっこうに いきます。"
        romaji: "Hachiji ni gakkoo ni ikimasu."
        en: "I go to school at eight. Time に, destination に."
        vi: "Tôi đến trường lúc 8 giờ. Giờ + に, nơi đến + に."
      - jp: "{十二時|じゅうにじ}ごろ がっこうで ひるごはんを たべます。"
        romaji: "Juuniji goro gakkoo de hirugohan o tabemasu."
        en: "At about twelve, I eat lunch at school. Time → place で → object を → verb."
        vi: "Khoảng 12 giờ tôi ăn trưa ở trường. Thời gian → nơi chốn で → tân ngữ を → động từ."
      - jp: "{五時|ごじ}に うちに かえります。"
        romaji: "Goji ni uchi ni kaerimasu."
        en: "I go home at five."
        vi: "Tôi về nhà lúc 5 giờ."
      - jp: "うちで にほんごを べんきょうします。"
        romaji: "Uchi de nihongo o benkyoo shimasu."
        en: "I study Japanese at home."
        vi: "Tôi học tiếng Nhật ở nhà."
      - jp: "{十一時|じゅういちじ}ごろ ねます。"
        romaji: "Juuichiji goro nemasu."
        en: "I go to bed at about eleven."
        vi: "Tôi đi ngủ khoảng 11 giờ."
    lines:
      - emma: "Now let's write sentences about a day. Japanese sentence order is: topic, time, place, object, verb. The verb always comes last. Use kanji only for the numbers you know, and write the other words in hiragana, just like the reading in your textbook."
      - yuki: "わたしはまいにちしちじに起きます。"
        pause: 2
      - yuki: "八時に学校に行きます。"
        focus: 1
        pause: 2
      - emma: "A longer sentence: time, then place with de, then object with o, then the verb."
        say: "A longer sentence: time, then place with deh, then object with oh, then the verb."
        focus: 2
      - yuki: "十二時ごろ学校で昼ご飯を食べます。"
        pause: 2.2
      - yuki: "五時にうちに帰ります。"
        focus: 3
        pause: 2
      - yuki: "うちでにほんごを勉強します。"
        focus: 4
        pause: 2
      - yuki: "十一時ごろ寝ます。"
        focus: 5
        pause: 2

  - kind: jp
    chapter: "How often, and the weekend"
    heading: "Add frequency · たいてい, ときどき, あまり～ません"
    items:
      - jp: "しゅうまつは たいてい うちで ほんを よみます。"
        romaji: "Shuumatsu wa taitee uchi de hon o yomimasu."
        en: "On weekends, I usually read books at home."
        vi: "Cuối tuần tôi thường đọc sách ở nhà."
      - jp: "どようびに ときどき テニスを します。"
        romaji: "Doyoobi ni tokidoki tenisu o shimasu."
        en: "I sometimes play tennis on Saturdays."
        vi: "Thứ Bảy thỉnh thoảng tôi chơi tennis."
      - jp: "でも、あまり テレビを みません。"
        romaji: "Demo, amari terebi o mimasen."
        en: "But I don't watch TV much. でも = but, at the start of a sentence."
        vi: "Nhưng tôi không hay xem TV. でも = nhưng (đầu câu)."
    lines:
      - emma: "Make your writing more interesting with frequency words, and connect sentences with but."
      - yuki: "しゅうまつはたいていうちで本を読みます。"
        pause: 2
      - yuki: "どようびにときどきテニスをします。"
        focus: 1
        pause: 2
      - yuki: "でも、あまりテレビを見ません。"
        focus: 2
        pause: 2

  - kind: jp
    chapter: "Model paragraph"
    heading: "Model paragraph · わたしの まいにち"
    items:
      - jp: "わたしは まいにち {七時|しちじ}に おきます。{八時|はちじ}に がっこうに いきます。{十二時|じゅうにじ}ごろ がっこうで ひるごはんを たべます。{五時|ごじ}に うちに かえります。うちで にほんごを べんきょうします。ときどき えいがを みます。でも、あまり テレビを みません。{十一時|じゅういちじ}ごろ ねます。"
        romaji: "Watashi wa mainichi shichiji ni okimasu. Hachiji ni gakkoo ni ikimasu. Juuniji goro gakkoo de hirugohan o tabemasu. Goji ni uchi ni kaerimasu. Uchi de nihongo o benkyoo shimasu. Tokidoki eega o mimasu. Demo, amari terebi o mimasen. Juuichiji goro nemasu."
        en: "I get up at seven every day. I go to school at eight. At about twelve, I eat lunch at school. I go home at five. I study Japanese at home. I sometimes watch movies. But I don't watch TV much. I go to bed at about eleven."
        vi: "Mỗi ngày tôi dậy lúc 7 giờ, 8 giờ đến trường, khoảng 12 giờ ăn trưa ở trường, 5 giờ về nhà, học tiếng Nhật ở nhà. Thỉnh thoảng tôi xem phim nhưng không hay xem TV. Khoảng 11 giờ tôi đi ngủ."
    lines:
      - emma: "Here is the whole paragraph: eight sentences about one day. Read along with Yuki, then copy it, and change the times and activities to match your own day."
      - yuki: "わたしはまいにちしちじに起きます。八時に学校に行きます。十二時ごろ学校で昼ご飯を食べます。五時にうちに帰ります。"
        pause: 1.5
      - yuki: "うちでにほんごを勉強します。ときどき映画を見ます。でも、あまりテレビを見ません。十一時ごろ寝ます。"
        pause: 2

  - kind: jp
    chapter: "An invitation message"
    heading: "Write a message · Invite a friend"
    items:
      - jp: "メアリーさん、どようびに えいがを みませんか。"
        romaji: "Mearii-san, doyoobi ni eega o mimasen ka."
        en: "Mary, would you like to see a movie on Saturday? Start with the name, then the invitation."
        vi: "Mary ơi, thứ Bảy đi xem phim không? Mở đầu bằng tên, rồi lời mời."
      - jp: "いいですね。なんじに いきますか。"
        romaji: "Ii desu ne. Nanji ni ikimasu ka."
        en: "Sounds good. What time shall we go?"
        vi: "Hay đấy. Mấy giờ đi?"
      - jp: "{三時|さんじ}は どうですか。"
        romaji: "Sanji wa doo desu ka."
        en: "How about three o'clock?"
        vi: "3 giờ thì sao?"
    lines:
      - emma: "Now write a short message to invite a friend, like a chat message. Start with the friend's name, then the invitation."
      - yuki: "メアリーさん、どようびに映画を見ませんか。"
        pause: 2
      - emma: "Your friend replies, and asks the time."
        focus: 1
      - yuki: "いいですね。なんじに行きますか。"
        pause: 2
      - emma: "Suggest a time with: how about?"
        focus: 2
      - yuki: "三時はどうですか。"
        pause: 1.8

  - kind: jp
    chapter: "Dictation"
    heading: "かきとり · Dictation: kana, with the numbers in kanji"
    items:
      - jp: "かきとり ①"
        quiz: true
        en: "Dictation 1: write the sentence in kana, with the numbers in kanji."
        vi: "Chính tả 1: viết câu bằng kana, số viết bằng chữ Hán. かきとり (書き取り) = chính tả."
      - jp: "わたしは {六時|ろくじ}に おきます。"
        romaji: "Watashi wa rokuji ni okimasu."
        en: "I get up at six."
        vi: "Tôi dậy lúc 6 giờ."
      - jp: "かきとり ②"
        quiz: true
        en: "Dictation 2."
        vi: "Chính tả 2."
      - jp: "この ほんは {二千八百円|にせんはっぴゃくえん}です。"
        romaji: "Kono hon wa nisen happyaku en desu."
        en: "This book is 2,800 yen. Big units first: 二千八百円."
        vi: "Quyển sách này 2.800 yên. Đơn vị lớn trước: 二千八百円."
      - jp: "かきとり ③"
        quiz: true
        en: "Dictation 3."
        vi: "Chính tả 3."
      - jp: "どようびに としょかんで べんきょうします。"
        romaji: "Doyoobi ni toshokan de benkyoo shimasu."
        en: "I study at the library on Saturday. The place of an action takes で."
        vi: "Thứ Bảy tôi học ở thư viện. Nơi diễn ra hành động dùng で."
      - jp: "かきとり ④"
        quiz: true
        en: "Dictation 4."
        vi: "Chính tả 4."
      - jp: "あした コーヒーを のみませんか。"
        romaji: "Ashita koohii o nomimasen ka."
        en: "Would you like to have coffee tomorrow? The object particle is written を."
        vi: "Ngày mai đi uống cà phê không? Trợ từ tân ngữ viết là を."
    lines:
      - emma: "Dictation. Yuki says a sentence. Pause the video and write it in kana, with the numbers in kanji, then check the answer. Sentence one."
      - yuki: "わたしは六時に起きます。"
        pause: 2.5
      - yuki: "わたしは六時に起きます。"
        focus: 1
        pause: 1.5
      - emma: "Sentence two: a price."
        focus: 2
      - yuki: "この本は二千八百円です。"
        pause: 2.5
      - yuki: "この本は二千八百円です。"
        focus: 3
        pause: 1.5
      - emma: "Sentence three."
        focus: 4
      - yuki: "どようびに図書館で勉強します。"
        pause: 2.5
      - yuki: "どようびに図書館で勉強します。"
        focus: 5
        pause: 1.5
      - emma: "Sentence four: an invitation."
        focus: 6
      - yuki: "あしたコーヒーを飲みませんか。"
        pause: 2.5
      - yuki: "あしたコーヒーを飲みませんか。"
        focus: 7
        pause: 1.5

  - kind: jp
    chapter: "Common mistakes"
    heading: "Common mistakes · に, で, を, あまり"
    items:
      - jp: "× まいにちに おきます。"
        en: "Wrong: まいにち (every day) never takes に."
        vi: "Sai: まいにち không đi với に."
      - jp: "○ まいにち {七時|しちじ}に おきます。"
        romaji: "Mainichi shichiji ni okimasu."
        en: "Right: every day, at seven — only the clock time takes に."
        vi: "Đúng: mỗi ngày, lúc 7 giờ — chỉ giờ cụ thể mới có に."
      - jp: "× うちに べんきょうします。"
        en: "Wrong: the place where you DO something takes で."
        vi: "Sai: nơi diễn ra hành động dùng で."
      - jp: "○ うちで べんきょうします。"
        romaji: "Uchi de benkyoo shimasu."
        en: "Right: I study at home."
        vi: "Đúng: Tôi học ở nhà."
      - jp: "× コーヒーお のみます。"
        en: "Wrong: the object particle is written を, not お."
        vi: "Sai: trợ từ tân ngữ viết là を, không phải お."
      - jp: "○ コーヒーを のみます。"
        romaji: "Koohii o nomimasu."
        en: "Right: I drink coffee."
        vi: "Đúng: Tôi uống cà phê."
      - jp: "× あまり テレビを みます。"
        en: "Wrong: あまり needs a negative verb."
        vi: "Sai: あまり phải đi với động từ phủ định."
      - jp: "○ あまり テレビを みません。"
        romaji: "Amari terebi o mimasen."
        en: "Right: I don't watch TV much."
        vi: "Đúng: Tôi không hay xem TV."
    lines:
      - emma: "Check your paragraph for four common mistakes. One: every day, today and tomorrow never take ni."
        say: "Check your paragraph for four common mistakes. One: every day, today and tomorrow never take nee."
      - yuki: "まいにちしちじに起きます。"
        focus: 1
        pause: 1.8
      - emma: "Two: the place where you do something takes de, not ni."
        say: "Two: the place where you do something takes deh, not nee."
        focus: 2
      - yuki: "うちで勉強します。"
        focus: 3
        pause: 1.5
      - emma: "Three: the object particle sounds like o, but it is written with the special letter wo."
        say: "Three: the object particle sounds like oh, but it is written with the special letter woh."
        focus: 4
      - yuki: "コーヒーを飲みます。"
        focus: 5
        pause: 1.5
      - emma: "Four: not much always goes with a negative verb."
        focus: 6
      - yuki: "あまりテレビを見ません。"
        focus: 7
        pause: 1.5

  - kind: jp
    chapter: "Your task"
    heading: "Your task · My day + a message"
    items:
      - jp: "わたしの まいにち"
        romaji: "Watashi no mainichi"
        en: "Task: write 6–8 sentences about your day (times in kanji: 七時, 十二時…), 2 about your weekend with たいてい / ときどき / あまり, and a short invitation message. Read them aloud."
        vi: "Bài tập: viết 6–8 câu về một ngày của bạn (giờ viết chữ Hán: 七時, 十二時…), 2 câu về cuối tuần có たいてい / ときどき / あまり, và một tin nhắn mời bạn. Đọc to."
    lines:
      - emma: "Your task. Pause the video and write six to eight sentences about your day, with the times in kanji. Add two sentences about your weekend, and a short message inviting a friend. Then read everything aloud."
      - yuki: "わたしのまいにち。"
        pause: 1.5
      - emma: "Well done. You have finished the writing videos for Units 1 to 3."
