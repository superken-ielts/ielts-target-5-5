# U00 · Hiragana 1 — GENKI I, Japanese Writing System (trang 20–21). Video ~7 phút cho phiên Hệ chữ Nhật & hiragana:
# ba loại chữ, 46 chữ hiragana cơ bản theo từng hàng (mẹo phát âm cho người Việt), cả bảng với audio gốc JWS-01,
# chữ dễ nhầm, chữ in khác chữ viết tay, nghe – viết chữ cái, đọc những từ đầu tiên. Học được không cần mở sách:
# mọi chữ đều hiện trên màn hình.
# Cách đọc: hàng は đọc rời thì misaki đọc は / へ thành "wa" / "e" (trợ từ), nên `say` viết ハ, ヘ bằng katakana.
id: U00-hiragana-1
activity: U00-kana
title: "Unit 0 · The Japanese Writing System"
subtitle: "Hiragana 1 · The 46 basic letters"
title_vi: "Hiragana 1 — 46 chữ cơ bản: cách đọc từng hàng, chữ dễ nhầm, đọc những từ đầu tiên"
tag: "GENKI L0 · N5"
speakers:
  emma: {name: Emma, role: guide, voice: {kokoro: bf_emma}, color: "#00A8B5", speed: 1.0}
  yuki: {name: Yuki, role: Japanese tutor, lang: ja, voice: {kokoro: jf_alpha}, color: "#F39C12", speed: 0.88}

scenes:
  - kind: jp
    chapter: "Three scripts"
    heading: "Japanese uses three scripts · Start with hiragana"
    items:
      - jp: "テレビを {見|み}ます。"
        romaji: "Terebi o mimasu."
        en: "I watch television. One sentence, three scripts: テレビ is katakana, 見 is kanji, を and ます are hiragana."
        vi: "Tôi xem ti vi. Một câu có cả ba loại chữ: テレビ là katakana, 見 là chữ Hán, を và ます là hiragana."
      - jp: "ひらがな ・ カタカナ ・ {漢字|かんじ}"
        romaji: "hiragana · katakana · kanji"
        en: "Hiragana: Japanese words and grammar endings. Katakana: words from other languages and foreign names. Kanji: characters with meaning, from Chinese."
        vi: "Hiragana: từ thuần Nhật và đuôi ngữ pháp. Katakana: từ vay mượn, tên nước ngoài. Chữ Hán (漢字 – Hán tự): chữ mang nghĩa, gốc Trung Quốc."
    lines:
      - emma: "Welcome to Unit 0. Before Lesson 1, you will learn to read Japanese. Everything you need is on the screen, so you do not have to open the book. First, listen to a short sentence."
      - yuki: "テレビを見ます。"
        pause: 1.5
      - emma: "I watch television. This one sentence uses three different scripts."
      - emma: "Hiragana is for Japanese words and grammar endings. Katakana is for words from other languages. Kanji are characters with meaning, borrowed from Chinese. Hiragana comes first: forty-six basic letters, and each letter is one syllable. Today you will learn all of them, row by row."
        focus: 1
      - yuki: "ひらがな、カタカナ、漢字。"
        pause: 1.5

  - kind: jp
    chapter: "Vowels あいうえお"
    heading: "The five vowels · あ い う え お"
    items:
      - jp: "あ ・ い ・ う ・ え ・ お"
        romaji: "a · i · u · e · o"
        en: "Every Japanese syllable ends in one of these five vowels, except ん. Keep them short and clear."
        vi: "Mọi âm tiết tiếng Nhật đều kết thúc bằng một trong năm nguyên âm này (trừ ん). a như \"a\", i như \"i\", u gần \"ư\" (môi không tròn), e như \"ê\", o như \"ô\"."
    lines:
      - emma: "Every row of the chart is built on five vowels. Listen, and repeat after Yuki."
      - yuki: "あ、い、う、え、お。"
        pause: 2
      - emma: "The u is said with relaxed lips, not rounded. Once more."
      - yuki: "あ、い、う、え、お。"
        pause: 2

  - kind: jp
    chapter: "Rows K and S"
    heading: "Rows か and さ · consonant + vowel"
    items:
      - jp: "か ・ き ・ く ・ け ・ こ"
        romaji: "ka · ki · ku · ke · ko"
        en: "k + the five vowels."
        vi: "k + năm nguyên âm. Đọc \"ca, ki, cư, kê, cô\", bật hơi nhẹ."
      - jp: "さ ・ し ・ す ・ せ ・ そ"
        romaji: "sa · shi · su · se · so"
        en: "s + the vowels. Careful: し is shi, not si."
        vi: "s + nguyên âm. Chú ý: し đọc là \"shi\" (gần \"si\" uốn lưỡi), す gần \"xư\"."
    lines:
      - emma: "Each other row is a consonant plus the five vowels. The k row."
      - yuki: "か、き、く、け、こ。"
        pause: 2
      - emma: "The s row. Careful with the second letter: it is shi, not si."
        focus: 1
      - yuki: "さ、し、す、せ、そ。"
        pause: 2

  - kind: jp
    chapter: "Rows T and N"
    heading: "Rows た and な"
    items:
      - jp: "た ・ ち ・ つ ・ て ・ と"
        romaji: "ta · chi · tsu · te · to"
        en: "t + the vowels. Two exceptions: ち is chi, つ is tsu."
        vi: "t + nguyên âm (t nhẹ, không bật hơi mạnh như \"th\"). Hai chữ đặc biệt: ち đọc \"chi\", つ đọc \"tsư\" (như \"ts\" trong cats)."
      - jp: "な ・ に ・ ぬ ・ ね ・ の"
        romaji: "na · ni · nu · ne · no"
        en: "n + the vowels."
        vi: "n + nguyên âm: \"na, ni, nư, nê, nô\"."
    lines:
      - emma: "The t row has two surprises: chi and tsu. Tsu sounds like the end of the English word cats."
      - yuki: "た、ち、つ、て、と。"
        pause: 2
      - emma: "The n row is regular."
        focus: 1
      - yuki: "な、に、ぬ、ね、の。"
        pause: 2

  - kind: jp
    chapter: "Rows H and M"
    heading: "Rows は and ま"
    items:
      - jp: "は ・ ひ ・ ふ ・ へ ・ ほ"
        romaji: "ha · hi · fu · he · ho"
        en: "h + the vowels. ふ is fu: blow gently between your lips — your teeth do not touch your lip."
        vi: "h + nguyên âm. ふ đọc \"fư\": thổi hơi nhẹ qua hai môi, không chạm răng vào môi như \"ph\". (Sau này: は làm trợ từ đọc \"wa\", へ làm trợ từ đọc \"e\".)"
      - jp: "ま ・ み ・ む ・ め ・ も"
        romaji: "ma · mi · mu · me · mo"
        en: "m + the vowels."
        vi: "m + nguyên âm: \"ma, mi, mư, mê, mô\"."
    lines:
      - emma: "The h row. The third letter is fu: blow softly through your lips, without touching your teeth."
      - yuki: "は、ひ、ふ、へ、ほ。"
        say: "ハ、ヒ、フ、ヘ、ホ。"
        pause: 2
      - emma: "The m row."
        focus: 1
      - yuki: "ま、み、む、め、も。"
        pause: 2

  - kind: jp
    chapter: "Rows Y, R, W and ん"
    heading: "Rows や, ら, わ and ん"
    items:
      - jp: "や ・ ゆ ・ よ"
        romaji: "ya · yu · yo"
        en: "Only three letters in this row."
        vi: "Hàng này chỉ có ba chữ: \"ya, yư, yô\"."
      - jp: "ら ・ り ・ る ・ れ ・ ろ"
        romaji: "ra · ri · ru · re · ro"
        en: "The Japanese r: touch the roof of your mouth once, lightly — between an English l and r."
        vi: "r tiếng Nhật: đầu lưỡi chạm nhẹ lên vòm miệng một lần, nghe gần \"l\"."
      - jp: "わ ・ を ・ ん"
        romaji: "wa · o · n"
        en: "を sounds like o; it is only used as a particle. ん is a full beat on its own: n, m or ng, depending on the next sound."
        vi: "を đọc \"ô\", chỉ dùng làm trợ từ. ん tự nó là một nhịp: đọc \"n\", \"m\" hay \"ng\" tùy âm đứng sau."
    lines:
      - emma: "The y row has only three letters."
      - yuki: "や、ゆ、よ。"
        pause: 1.8
      - emma: "The r row. Touch the roof of your mouth once, lightly. It is somewhere between an English l and r."
        focus: 1
      - yuki: "ら、り、る、れ、ろ。"
        pause: 2
      - emma: "And the last three. The middle one sounds like o, and the last one is n, a full beat on its own."
        focus: 2
      - yuki: "わ、を、ん。"
        pause: 2

  - kind: jp
    chapter: "The whole chart"
    heading: "All 46 hiragana · Read along with the book's audio"
    items:
      - jp: "あ　い　う　え　お　　　は　ひ　ふ　へ　ほ\nか　き　く　け　こ　　　ま　み　む　め　も\nさ　し　す　せ　そ　　　や　ゆ　よ\nた　ち　つ　て　と　　　ら　り　る　れ　ろ\nな　に　ぬ　ね　の　　　わ　を　ん"
        en: "The complete basic chart: read down the left column, then the right — the order of the Japanese dictionary, a-ka-sa-ta-na-ha-ma-ya-ra-wa."
        vi: "Cả bảng chữ cơ bản: đọc cột trái từ trên xuống, rồi cột phải — đúng thứ tự từ điển Nhật a-ka-sa-ta-na-ha-ma-ya-ra-wa."
    lines:
      - emma: "Now listen to a native speaker read the whole chart. This is the original audio of your textbook. Point at each letter as you hear it."
      - track: JWS-01
        note: "Japanese Writing System · JWS-01"
      - emma: "Pause the video and read the chart aloud by yourself, from the first letter to the last."

  - kind: jp
    chapter: "Look-alike letters"
    heading: "Look-alike letters · Spot the difference"
    items:
      - jp: "さ ・ ち"
        romaji: "sa · chi"
        en: "Mirror images: the bottom curve of さ opens to the right, the curve of ち to the left."
        vi: "Hai chữ ngược chiều nhau: nét cong dưới của さ mở sang phải, của ち mở sang trái."
      - jp: "ぬ ・ め / る ・ ろ"
        romaji: "nu · me / ru · ro"
        en: "ぬ and る end with a small loop; め and ろ do not."
        vi: "ぬ và る có vòng nhỏ ở cuối nét; め và ろ thì không."
      - jp: "は ・ ほ / き ・ さ"
        romaji: "ha · ho / ki · sa"
        en: "ほ has two short lines on the right, は has one. き has two crossing lines, さ has one."
        vi: "ほ có hai nét ngang ngắn bên phải, は có một. き có hai nét ngang, さ có một."
      - jp: "ね ・ れ ・ わ"
        romaji: "ne · re · wa"
        en: "Same left stroke. ね ends with a loop, れ kicks out, わ curves round."
        vi: "Cùng một nét bên trái. ね kết thúc bằng vòng tròn nhỏ, れ hất ra ngoài, わ uốn tròn."
      - jp: "あ ・ お / い ・ り"
        romaji: "a · o / i · ri"
        en: "お has a small dot at the top right. い has two short strokes; り is taller, with a long right stroke."
        vi: "お có thêm dấu chấm nhỏ phía trên bên phải. い là hai nét ngắn; り cao hơn, nét phải dài."
    lines:
      - emma: "Some letters look alike. Look carefully. The first pair are mirror images."
      - yuki: "さ、ち。"
        pause: 1.5
      - emma: "Two of these four have a small loop at the end of the last stroke."
        focus: 1
      - yuki: "ぬ、め。る、ろ。"
        pause: 1.5
      - emma: "Count the short lines."
        focus: 2
      - yuki: "は、ほ。き、さ。"
        say: "ハ、ほ。き、さ。"
        pause: 1.5
      - emma: "These three start the same way. Look at how each one ends."
        focus: 3
      - yuki: "ね、れ、わ。"
        pause: 1.5
      - emma: "And two more pairs: a small dot makes the difference in the first pair, and length in the second."
        focus: 4
      - yuki: "あ、お。い、り。"
        pause: 1.5

  - kind: jp
    chapter: "Print and handwriting"
    heading: "Print vs handwriting · Separate strokes"
    items:
      - jp: "さ ・ き ・ り ・ ふ"
        romaji: "sa · ki · ri · fu"
        en: "Printed letters often join strokes that are separate when you write by hand: the bottom stroke of さ and き is separate, り is two strokes, ふ is four."
        vi: "Chữ in thường nối liền những nét mà khi viết tay phải tách rời: nét dưới của さ và き viết riêng, り gồm hai nét, ふ gồm bốn nét."
    lines:
      - emma: "One more thing before you write. Printed letters sometimes join strokes that are separate in handwriting. When you write these four by hand, lift your pen: the bottom stroke of the first two is separate, the third has two strokes, and the last has four."
      - yuki: "さ、き、り、ふ。"
        pause: 2

  - kind: jp
    chapter: "Listen and write"
    heading: "Listen and write · Which letter is it?"
    items:
      - jp: "① ？"
        quiz: true
        en: "Listen and write the letter."
        vi: "Nghe và viết chữ."
      - jp: "し"
        romaji: "shi"
        en: "shi"
        vi: "shi"
      - jp: "② ？"
        quiz: true
        en: "Listen and write the letter."
        vi: "Nghe và viết chữ."
      - jp: "つ"
        romaji: "tsu"
        en: "tsu"
        vi: "tsu"
      - jp: "③ ？"
        quiz: true
        en: "Listen and write the letter."
        vi: "Nghe và viết chữ."
      - jp: "ふ"
        romaji: "fu"
        en: "fu"
        vi: "fu"
      - jp: "④ ？"
        quiz: true
        en: "Listen and write the letter."
        vi: "Nghe và viết chữ."
      - jp: "ち"
        romaji: "chi"
        en: "chi"
        vi: "chi"
      - jp: "⑤ ？"
        quiz: true
        en: "Listen and write the letter."
        vi: "Nghe và viết chữ."
      - jp: "ぬ"
        romaji: "nu"
        en: "nu — the one with the loop."
        vi: "nu — chữ có vòng nhỏ."
      - jp: "⑥ ？"
        quiz: true
        en: "Listen and write the letter."
        vi: "Nghe và viết chữ."
      - jp: "ろ"
        romaji: "ro"
        en: "ro — no loop."
        vi: "ro — không có vòng."
      - jp: "⑦ ？"
        quiz: true
        en: "Listen and write the letter."
        vi: "Nghe và viết chữ."
      - jp: "ね"
        romaji: "ne"
        en: "ne — the one that ends with a loop."
        vi: "ne — chữ kết thúc bằng vòng nhỏ."
      - jp: "⑧ ？"
        quiz: true
        en: "Listen and write the letter."
        vi: "Nghe và viết chữ."
      - jp: "ん"
        romaji: "n"
        en: "n"
        vi: "n"
    lines:
      - emma: "Listen and write. Yuki says one letter. Write it, then check. Number one."
      - yuki: "し。"
        pause: 2.5
      - yuki: "し。"
        focus: 1
        pause: 1
      - emma: "Number two."
        focus: 2
      - yuki: "つ。"
        pause: 2.5
      - yuki: "つ。"
        focus: 3
        pause: 1
      - emma: "Number three."
        focus: 4
      - yuki: "ふ。"
        pause: 2.5
      - yuki: "ふ。"
        focus: 5
        pause: 1
      - emma: "Number four."
        focus: 6
      - yuki: "ち。"
        pause: 2.5
      - yuki: "ち。"
        focus: 7
        pause: 1
      - emma: "Number five."
        focus: 8
      - yuki: "ぬ。"
        pause: 2.5
      - yuki: "ぬ。"
        focus: 9
        pause: 1
      - emma: "Number six."
        focus: 10
      - yuki: "ろ。"
        pause: 2.5
      - yuki: "ろ。"
        focus: 11
        pause: 1
      - emma: "Number seven."
        focus: 12
      - yuki: "ね。"
        pause: 2.5
      - yuki: "ね。"
        focus: 13
        pause: 1
      - emma: "And number eight."
        focus: 14
      - yuki: "ん。"
        pause: 2.5
      - yuki: "ん。"
        focus: 15
        pause: 1

  - kind: jp
    chapter: "Your first words"
    heading: "Read your first words · Then check"
    items:
      - jp: "いぬ ・ ねこ ・ すし ・ さかな"
        quiz: true
        en: "Read the four words aloud, then check."
        vi: "Đọc to bốn từ, rồi xem đáp án."
      - jp: "いぬ ・ ねこ ・ すし ・ さかな"
        romaji: "inu · neko · sushi · sakana"
        en: "dog · cat · sushi · fish"
        vi: "con chó · con mèo · sushi · con cá"
      - jp: "やま ・ はな ・ くるま ・ さくら"
        quiz: true
        en: "Read the four words aloud, then check."
        vi: "Đọc to bốn từ, rồi xem đáp án."
      - jp: "やま ・ はな ・ くるま ・ さくら"
        romaji: "yama · hana · kuruma · sakura"
        en: "mountain · flower · car · cherry blossom"
        vi: "núi · hoa · ô tô · hoa anh đào"
      - jp: "あさ ・ なまえ ・ たかい ・ おかね"
        quiz: true
        en: "Read the four words aloud, then check."
        vi: "Đọc to bốn từ, rồi xem đáp án."
      - jp: "あさ ・ なまえ ・ たかい ・ おかね"
        romaji: "asa · namae · takai · okane"
        en: "morning · name · high, expensive · money"
        vi: "buổi sáng · tên · cao, đắt · tiền"
    lines:
      - emma: "Now you can read real words. Read these four aloud. Pause the video if you need more time."
        pause: 3
      - emma: "Check with Yuki."
        focus: 1
      - yuki: "いぬ、ねこ、すし、さかな。"
        pause: 2
      - emma: "Four more."
        focus: 2
        pause: 3
      - emma: "Check."
        focus: 3
      - yuki: "やま、はな、くるま、さくら。"
        pause: 2
      - emma: "And the last four."
        focus: 4
        pause: 3
      - emma: "Check."
        focus: 5
      - yuki: "あさ、なまえ、たかい、おかね。"
        pause: 2

  - kind: jp
    chapter: "How to practise"
    heading: "How to practise · A little every day"
    items:
      - jp: "まいにち すこしずつ"
        romaji: "Mainichi sukoshi zutsu."
        en: "A little every day: learn 10 to 15 letters a day, read them aloud, write each one five times, then read the whole chart with the audio."
        vi: "Mỗi ngày một ít: học 10–15 chữ, đọc to, viết mỗi chữ 5 lần, rồi đọc cả bảng theo audio. Khoảng một tuần là đọc được cả bảng."
    lines:
      - emma: "How to practise. Learn ten to fifteen letters a day. Read them aloud, write each one five times, and read the whole chart again with the audio in this video. In about a week you will read the whole chart. A little every day, as Yuki says."
      - yuki: "まいにち、すこしずつ。"
        pause: 1.5
      - emma: "In the next video: the marks that change sounds, the small letters, and long vowels."
