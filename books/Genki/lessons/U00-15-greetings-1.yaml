  - kind: jp
    chapter: "Excuse me, not at all"
    heading: "Excuse me, I'm sorry · Not at all"
    items:
      - jp: "すみません。"
        romaji: "Sumimasen."
        en: "Three uses: excuse me (to get attention), I'm sorry, and thank you — when someone took trouble for you."
        vi: "Ba nghĩa: xin lỗi cho tôi hỏi (gọi ai đó), tôi xin lỗi, và cảm ơn — khi ai đó đã mất công vì bạn."
      - jp: "いいえ。"
        romaji: "Iie."
        en: "No. After thanks or an apology it means not at all, you're welcome."
        vi: "Không. Đáp lại lời cảm ơn, xin lỗi thì nghĩa là không có gì."
      - jp: "すみません。 ・ いいえ。"
        romaji: "Sumimasen. · Iie."
        en: "I'm sorry. — Not at all."
        vi: "Xin lỗi. — Không sao đâu."
    lines:
      - emma: "This word is very useful. It means excuse me, and I'm sorry. It can also mean thank you, when someone took trouble for you."
        vi: "Từ này rất hữu ích. Nó nghĩa là “xin lỗi cho hỏi” và “tôi xin lỗi”. Nó cũng có thể nghĩa là “cảm ơn”, khi ai đó đã mất công vì bạn."
      - yuki: "すみません。"
        en: "Excuse me. / I'm sorry."
        vi: "Xin lỗi."
        echo: true
