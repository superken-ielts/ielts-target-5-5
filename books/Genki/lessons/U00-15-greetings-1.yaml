  - kind: jp
    chapter: "Hello, good evening"
    heading: "Hello · Good evening"
    items:
      - jp: "こんにちは。\nこんばんは。"
        romaji: "Konnichiwa.\nKonbanwa."
        en: "Hello, good afternoon — from late morning. Good evening. The last letter is written は but read wa."
        vi: "Xin chào (ban ngày, từ cuối buổi sáng). Chào buổi tối. Chữ cuối viết は nhưng đọc là “wa”."
    lines:
      - emma: "From late morning, say hello, or good afternoon. The last letter is written ha, but you say wa."
        vi: "Từ cuối buổi sáng, hãy nói “xin chào”. Chữ cuối viết là “ha” nhưng đọc là “wa”."
      - yuki: "こんにちは。"
        hl: 0
        en: "Hello. Good afternoon."
        vi: "Xin chào."
        echo: true
      - emma: "In the evening: good evening. Again, the last letter is read wa."
        vi: "Buổi tối: chào buổi tối. Chữ cuối cũng đọc là “wa”."
      - takeshi: "こんばんは。"
        hl: 1
        en: "Good evening."
        vi: "Chào buổi tối."
        echo: true
