# U00 · Greetings 1 — GENKI I あいさつ (trang 30–31). Chào theo giờ trong ngày, cảm ơn, xin lỗi, đáp lời: mỗi câu chào
# Emma nói tình huống → Yuki / Takeshi đọc (Takeshi nói dạng lịch sự với thầy cô) → lượt nhắc lại → audio gốc K00-01.
