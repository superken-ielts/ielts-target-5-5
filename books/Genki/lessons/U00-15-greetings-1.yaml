  - kind: jp
    chapter: "Thank you"
    heading: "Thank you · short or polite"
    items:
      - jp: "ありがとう。\nありがとう ございます。"
        romaji: "Arigatoo.\nArigatoo gozaimasu."
        en: "Thank you. The same rule: short with friends, long with everyone else."
        vi: "Cảm ơn. Cùng quy tắc: dạng ngắn với bạn bè, dạng dài với người khác."
    lines:
      - emma: "Thank you. The same rule: the short form with friends."
        vi: "Cảm ơn. Cùng một quy tắc: dạng ngắn với bạn bè."
