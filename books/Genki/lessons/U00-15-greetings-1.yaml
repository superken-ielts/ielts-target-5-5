  - kind: jp
    chapter: "Good night"
    heading: "Good night · when someone goes to bed"
    items:
      - jp: "おやすみ(なさい)。"
        romaji: "Oyasumi (nasai)."
        en: "Good night — when someone goes to bed. なさい makes it more polite."
        vi: "Chúc ngủ ngon — khi đi ngủ. Thêm なさい thì lịch sự hơn."
    lines:
      - emma: "Before bed, say good night. The longer form is more polite."
        vi: "Trước khi đi ngủ, hãy chúc ngủ ngon. Dạng dài thì lịch sự hơn."
      - yuki: "おやすみなさい。"
        en: "Good night."
        vi: "Chúc ngủ ngon."
        echo: true
