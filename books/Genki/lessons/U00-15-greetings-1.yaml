scenes:
  - kind: jp
    chapter: "Goals"
    heading: "In this video · Everyday greetings"
    items:
      - jp: "あいさつ"
        romaji: "aisatsu"
        en: "Greetings: the Japanese you use every day. Each greeting belongs to a situation."
        vi: "Câu chào hỏi: tiếng Nhật bạn dùng hằng ngày. Mỗi câu chào gắn với một tình huống."
    lines:
      - emma: "Welcome back. Now that you can read Japanese, it is time to speak. This video is about greetings."
        vi: "Chào mừng bạn trở lại. Giờ bạn đã đọc được tiếng Nhật, đến lúc nói rồi. Video này nói về câu chào hỏi."
      - yuki: "あいさつ。"
        en: "greetings"
        vi: "chào hỏi"
        pause: 1
      - emma: "In Japanese, each greeting belongs to a situation, so we will learn them by situation."
        vi: "Trong tiếng Nhật, mỗi câu chào gắn với một tình huống, nên ta sẽ học theo tình huống."
      - emma: "Why now? You will use them from your first day, and Lesson 1 begins with greetings."
        vi: "Vì sao học ngay? Bạn sẽ dùng chúng từ ngày đầu tiên, và bài 1 mở đầu bằng câu chào hỏi."

  - kind: jp
    chapter: "Good morning"
    heading: "Good morning · short or polite"
    items:
      - jp: "おはよう。\nおはよう ございます。"
        romaji: "Ohayoo.\nOhayoo gozaimasu."
        en: "Good morning. The short form for friends and family; add ございます for teachers, colleagues and people you don't know well."
        vi: "Chào buổi sáng. Dạng ngắn với bạn bè, gia đình; thêm ございます với thầy cô, đồng nghiệp, người không thân."
    lines:
      - emma: "In the morning, friends and family say the short form."
        vi: "Buổi sáng, bạn bè và người trong nhà nói dạng ngắn."
      - yuki: "おはよう。"
        hl: 0
        en: "Good morning. (to friends)"
        vi: "Chào buổi sáng. (với bạn bè)"
        echo: true
      - emma: "To your teacher, or to anyone you don't know well, add the polite ending. Here is Takeshi, greeting his teacher."
        say: "To your teacher, or to anyone you don't know well, add the polite ending. Here is Tahkehshee, greeting his teacher."
        vi: "Với thầy cô, hay với người không thân, hãy thêm đuôi lịch sự. Đây là Takeshi đang chào thầy giáo."
      - takeshi: "おはようございます。"
        hl: [1, 2]
        en: "Good morning. (polite)"
        vi: "Chào buổi sáng. (lịch sự)"
        echo: true
      - emma: "Now the native speakers from your textbook."
        vi: "Giờ là giọng người Nhật trong audio của sách."
