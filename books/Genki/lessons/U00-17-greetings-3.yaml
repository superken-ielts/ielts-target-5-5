# U00 · Greetings 3 — GENKI I あいさつ (trang 34). Luyện tập: 10 tình huống của bài luyện A dạng đố (Emma nói tình
# huống → đếm ngược để bạn nói → thẻ đáp án), rồi tự giới thiệu (bài B).
id: U00-17-greetings-3
activity: U00-greetings
title: "Unit 0 · Greetings and Numbers"
subtitle: "Greetings 3 · Practice: ten situations, introduce yourself"
title_vi: "Chào hỏi 3 — luyện tập: nói gì trong 10 tình huống; tự giới thiệu"
