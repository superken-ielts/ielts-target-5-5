scenes:
  - kind: jp
    chapter: "Goals"
    heading: "In this video · Practice: what do you say?"
    items:
      - jp: "なんと いいますか。"
        romaji: "Nan to iimasu ka."
        en: "What do you say? Goals: choose the right greeting in ten everyday situations, then introduce yourself."
        vi: "Bạn nói gì? Mục tiêu: chọn đúng câu chào trong mười tình huống hằng ngày, rồi tự giới thiệu."
    lines:
      - emma: "Welcome back. This video is practice, with no new words."
        vi: "Chào mừng bạn trở lại. Video này là luyện tập, không có từ mới."
      - emma: "In ten situations, you will say the right greeting yourself. Then you will introduce yourself."
        vi: "Trong mười tình huống, bạn sẽ tự nói câu chào đúng. Sau đó bạn sẽ tự giới thiệu."
      - yuki: "なんといいますか。"
        en: "What do you say?"
        vi: "Bạn nói gì?"
        pause: 1

  - kind: jp
    chapter: "What do you say?"
    heading: "What do you say? · Ten situations"
    items:
      - jp: "① なんと いいますか。"
        quiz: true
        en: "1 p.m. You see your neighbour, Mr. Yamada."
        vi: "1 giờ chiều. Bạn gặp hàng xóm, ông Yamada."
      - jp: "こんにちは。"
        romaji: "Konnichiwa."
        en: "Good afternoon."
        vi: "Xin chào."
      - jp: "② なんと いいますか。"
        quiz: true
        en: "Morning class: greet your teacher."
        vi: "Buổi sáng ở lớp: chào thầy cô."
      - jp: "おはよう ございます。"
        romaji: "Ohayoo gozaimasu."
        en: "Good morning. (polite, to the teacher)"
        vi: "Chào buổi sáng. (lịch sự, với thầy cô)"
      - jp: "③ なんと いいますか。"
        quiz: true
        en: "On a crowded train, you step on someone's foot."
        vi: "Trên tàu đông người, bạn giẫm phải chân ai đó."
      - jp: "すみません。"
        romaji: "Sumimasen."
        en: "I'm sorry."
        vi: "Xin lỗi."
      - jp: "④ なんと いいますか。"
        quiz: true
        en: "You drop your book. Someone picks it up for you."
        vi: "Bạn làm rơi sách, có người nhặt giúp."
      - jp: "ありがとう ございます。"
        romaji: "Arigatoo gozaimasu."
        en: "Thank you. すみません is also possible."
        vi: "Cảm ơn. Nói すみません cũng được."
      - jp: "⑤ なんと いいますか。"
        quiz: true
        en: "8 p.m. You meet your teacher at a convenience store."
        vi: "8 giờ tối. Bạn gặp thầy cô ở cửa hàng tiện lợi."
      - jp: "こんばんは。"
        romaji: "Konbanwa."
        en: "Good evening."
        vi: "Chào buổi tối."
      - jp: "⑥ なんと いいますか。"
        quiz: true
        en: "You are watching TV with your host family. It is time to go to bed."
        vi: "Bạn đang xem TV với gia đình người Nhật. Đến giờ đi ngủ."
      - jp: "おやすみなさい。"
        romaji: "Oyasumi nasai."
        en: "Good night."
        vi: "Chúc ngủ ngon."
      - jp: "⑦ なんと いいますか。"
        quiz: true
        en: "You are leaving home."
        vi: "Bạn ra khỏi nhà."
      - jp: "いってきます。"
        romaji: "Itte kimasu."
        en: "I'll go and come back."
        vi: "Con đi đây."
      - jp: "⑧ なんと いいますか。"
        quiz: true
        en: "You come back home."
        vi: "Bạn về đến nhà."
      - jp: "ただいま。"
        romaji: "Tadaima."
        en: "I'm home."
        vi: "Con về rồi."
      - jp: "⑨ なんと いいますか。"
        quiz: true
        en: "You are going to start eating."
        vi: "Bạn chuẩn bị ăn."
      - jp: "いただきます。"
        romaji: "Itadakimasu."
        en: "Before eating."
        vi: "Xin phép ăn ạ."
      - jp: "⑩ なんと いいますか。"
        quiz: true
        en: "You have finished eating."
        vi: "Bạn ăn xong."
      - jp: "ごちそうさまでした。"
        romaji: "Gochisoosama deshita."
        en: "Thank you for the meal."
        vi: "Cảm ơn vì bữa ăn."
    lines:
      - emma: "Your turn. In each situation, say the right greeting before the countdown ends. Then check."
        vi: "Đến lượt bạn. Trong mỗi tình huống, hãy nói câu chào đúng trước khi đếm ngược kết thúc. Rồi xem đáp án."
      - emma: "One: it is one in the afternoon, and you see your neighbour."
        vi: "Một: một giờ chiều, bạn gặp người hàng xóm."
      - wait: 3
        note: "Say the greeting"
        vi: "Nói câu chào"
      - yuki: "こんにちは。"
        focus: 1
        pause: 1
      - emma: "Two: you come to class in the morning, and greet your teacher."
        vi: "Hai: buổi sáng bạn đến lớp, và chào thầy cô."
        focus: 2
      - wait: 3
        note: "Say the greeting"
        vi: "Nói câu chào"
      - takeshi: "おはようございます。"
        focus: 3
        pause: 1
      - emma: "Three: on a crowded train, you step on someone's foot."
        vi: "Ba: trên tàu đông người, bạn giẫm phải chân ai đó."
        focus: 4
      - wait: 3
        note: "Say it"
        vi: "Nói câu đó"
      - yuki: "すみません。"
        focus: 5
        pause: 1
      - emma: "Four: you drop your book, and someone picks it up for you."
        vi: "Bốn: bạn làm rơi sách, và có người nhặt giúp."
        focus: 6
      - wait: 3
        note: "Say it"
        vi: "Nói câu đó"
      - takeshi: "ありがとうございます。"
        focus: 7
        pause: 1
      - emma: "Five: it is eight in the evening. You meet your teacher at a convenience store."
        vi: "Năm: tám giờ tối. Bạn gặp thầy cô ở cửa hàng tiện lợi."
        focus: 8
      - wait: 3
        note: "Say the greeting"
        vi: "Nói câu chào"
      - yuki: "こんばんは。"
        focus: 9
        pause: 1
      - emma: "Six: you are watching TV with your host family, and it is time to go to bed."
        vi: "Sáu: bạn đang xem TV với gia đình người Nhật, và đến giờ đi ngủ."
        focus: 10
      - wait: 3
        note: "Say it"
        vi: "Nói câu đó"
      - yuki: "おやすみなさい。"
        focus: 11
        pause: 1
      - emma: "Seven: you are leaving home."
        vi: "Bảy: bạn ra khỏi nhà."
        focus: 12
      - wait: 3
        note: "Say it"
        vi: "Nói câu đó"
      - takeshi: "いってきます。"
        focus: 13
        pause: 1
      - emma: "Eight: you come back home."
        vi: "Tám: bạn về đến nhà."
        focus: 14
      - wait: 3
        note: "Say it"
        vi: "Nói câu đó"
      - takeshi: "ただいま。"
        focus: 15
        pause: 1
      - emma: "Nine: you are going to start eating."
        vi: "Chín: bạn chuẩn bị ăn."
        focus: 16
      - wait: 3
        note: "Say it"
        vi: "Nói câu đó"
      - yuki: "いただきます。"
        focus: 17
        pause: 1
      - emma: "Ten: you have finished eating."
        vi: "Mười: bạn ăn xong."
        focus: 18
      - wait: 3
        note: "Say it"
        vi: "Nói câu đó"
      - takeshi: "ごちそうさまでした。"
        focus: 19
        pause: 1

  - kind: jp
    chapter: "Introduce yourself"
    heading: "Introduce yourself · and bow a little"
    items:
      - jp: "はじめまして。 ・ たけしです。 ・ よろしくおねがいします。"
        romaji: "Hajimemashite. · Takeshi desu. · Yoroshiku onegai shimasu."
        en: "How do you do? I'm Takeshi. Nice to meet you."
        vi: "Rất vui được gặp. Mình là Takeshi. Rất mong được giúp đỡ."
      - jp: "はじめまして。 ・ 〔なまえ〕です。 ・ よろしくおねがいします。"
        romaji: "Hajimemashite. · (your name) desu. · Yoroshiku onegai shimasu."
        en: "Your turn: say it with your own name, then bow a little."
        vi: "Đến lượt bạn: nói với tên của mình, rồi cúi chào nhẹ."
    lines:
      - emma: "Finally, Takeshi introduces himself. Listen."
        say: "Finally, Tahkehshee introduces himself. Listen."
        vi: "Cuối cùng, Takeshi tự giới thiệu. Hãy nghe."
      - takeshi: "はじめまして。たけしです。よろしくおねがいします。"
        en: "How do you do? I'm Takeshi. Nice to meet you."
        vi: "Rất vui được gặp. Mình là Takeshi. Rất mong được giúp đỡ."
        pause: 1
      - emma: "Now you. Introduce yourself with your own name, and bow a little at the end."
        vi: "Giờ đến bạn. Hãy tự giới thiệu với tên của mình, và cúi chào nhẹ ở cuối."
        focus: 1
      - wait: 8
        note: "Introduce yourself, then bow"
        vi: "Tự giới thiệu, rồi cúi chào"
        hl: all
      - emma: "Next video: numbers, from zero to twenty."
        vi: "Video tiếp theo: số đếm, từ 0 đến 20."
