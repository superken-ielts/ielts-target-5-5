scenes:
  - kind: jp
    chapter: "Goals"
    heading: "In this video · Marks, small letters, long vowels"
    items:
      - jp: "ガ ・ キャ ・ カー"
        romaji: "ga · kya · kaa"
        en: "Goals: the marks ゛ ゜ and small ャ ュ ョ work as in hiragana; long vowels are a new mark, the dash ー."
        vi: "Mục tiêu: dấu ゛ ゜ và ャ ュ ョ nhỏ dùng như hiragana; trường âm là một dấu mới, gạch ー."
    lines:
      - emma: "Welcome back. In this video: marks, small letters, and long vowels in katakana."
        vi: "Chào mừng bạn trở lại. Trong video này: dấu, chữ nhỏ và trường âm trong katakana."
      - emma: "Good news: they work almost exactly as in hiragana. Only long vowels look different."
        vi: "Tin vui: chúng dùng gần y như ở hiragana. Chỉ trường âm là viết khác."

  - kind: jp
    chapter: "Marks and small letters"
    heading: "゛ ゜ and small ャ ュ ョ · exactly as in hiragana"
    items:
      - jp: "ガ ・ ザ ・ ダ ・ バ ・ パ ・ キャ ・ シュ ・ チョ"
        romaji: "ga · za · da · ba · pa · kya · shu · cho"
        en: "The marks ゛ ゜ and the small ャ ュ ョ work exactly as in hiragana."
        vi: "Dấu ゛゜ và ャュョ nhỏ dùng y như hiragana."
      - jp: "ガ　ギ　グ　ゲ　ゴ\nザ　ジ　ズ　ゼ　ゾ\nダ　ヂ　ヅ　デ　ド\nバ　ビ　ブ　ベ　ボ\nパ　ピ　プ　ペ　ポ"
        en: "The 25 sounds with marks."
        vi: "25 âm có dấu."
      - jp: "キャ　キュ　キョ　　　ヒャ　ヒュ　ヒョ　　　ジャ　ジュ　ジョ\nシャ　シュ　ショ　　　ミャ　ミュ　ミョ　　　ビャ　ビュ　ビョ\nチャ　チュ　チョ　　　リャ　リュ　リョ　　　ピャ　ピュ　ピョ\nニャ　ニュ　ニョ　　　ギャ　ギュ　ギョ"
        en: "The 33 contracted sounds: read down each column."
        vi: "33 âm ghép: đọc từng cột từ trên xuống."
    lines:
      - emma: "Good news: the marks and the small letters work exactly as in hiragana."
        vi: "Tin vui: dấu và chữ nhỏ dùng y như ở hiragana."
      - yuki: "ガ、ザ、ダ、バ、パ、キャ、シュ、チョ。"
