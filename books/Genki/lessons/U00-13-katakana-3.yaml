        vi: "ga, za, đa, ba, pa, kya, shu, cho"
        echo: true
      - emma: "Read along with the book's audio. First, the sounds with marks."
        vi: "Đọc theo audio của sách. Đầu tiên là các âm có dấu."
        focus: 1
      - track: JWS-10
        start: 5.8
        note: "Japanese Writing System · JWS-10"
        en: "ga … go · za … zo · da … do · ba … bo · pa … po"
        vi: "ga … gô · za … zô · đa … đô · ba … bô · pa … pô"
