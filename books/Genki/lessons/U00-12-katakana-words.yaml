scenes:
  - kind: jp
    chapter: "Goals"
    heading: "In this video · Reading katakana words"
    items:
      - jp: "テレビ ・ コーヒー ・ パソコン"
        romaji: "terebi · koohii · pasokon"
        en: "Goals: marks and long vowels in katakana, sounds for foreign words, everyday loanwords, and a first look at kanji."
        vi: "Mục tiêu: dấu và trường âm trong katakana, âm cho từ nước ngoài, từ mượn hằng ngày, và làm quen chữ Hán."
    lines:
      - emma: "Welcome back. In this video, you will read real katakana words: TV, coffee, computer."
        vi: "Chào mừng bạn trở lại. Trong video này, bạn sẽ đọc từ katakana thật: ti vi, cà phê, máy tính."
      - yuki: "テレビ、コーヒー、パソコン。"
        en: "TV, coffee, computer"
        vi: "ti vi, cà phê, máy tính"
        pause: 1
      - emma: "Why? Many everyday words in Japanese come from English, and they are written in katakana."
        vi: "Để làm gì? Nhiều từ thường dùng trong tiếng Nhật mượn từ tiếng Anh, và chúng được viết bằng katakana."

  - kind: jp
    chapter: "Marks and small letters"
    heading: "゛ ゜ and small ャ ュ ョ · exactly as in hiragana"
    items:
      - jp: "ガ ・ ザ ・ ダ ・ バ ・ パ ・ キャ ・ シュ ・ チョ"
        romaji: "ga · za · da · ba · pa · kya · shu · cho"
        en: "The marks ゛ ゜ and the small ャ ュ ョ work exactly as in hiragana."
        vi: "Dấu ゛゜ và ャュョ nhỏ dùng y như hiragana."
      - jp: "ガ　ギ　グ　ゲ　ゴ\nザ　ジ　ズ　ゼ　ゾ\nダ　ヂ　ヅ　デ　ド\nバ　ビ　ブ　ベ　ボ\nパ　ピ　プ　ペ　ポ"
        en: "The 25 sounds with marks."
        vi: "25 âm có dấu."
      - jp: "キャ　キュ　キョ　　　ヒャ　ヒュ　ヒョ　　　ジャ　ジュ　ジョ\nシャ　シュ　ショ　　　ミャ　ミュ　ミョ　　　ビャ　ビュ　ビョ\nチャ　チュ　チョ　　　リャ　リュ　リョ　　　ピャ　ピュ　ピョ\nニャ　ニュ　ニョ　　　ギャ　ギュ　ギョ"
        en: "The 33 contracted sounds: read down each column."
        vi: "33 âm ghép: đọc từng cột từ trên xuống."
    lines:
      - emma: "Good news: the marks and the small letters work exactly as in hiragana."
        vi: "Tin vui: dấu và chữ nhỏ dùng y như ở hiragana."
      - yuki: "ガ、ザ、ダ、バ、パ、キャ、シュ、チョ。"
        en: "ga, za, da, ba, pa, kya, shu, cho"
        vi: "ga, za, đa, ba, pa, kya, shu, cho"
        echo: true
      - emma: "Read along with the book's audio. First, the sounds with marks."
        vi: "Đọc theo audio của sách. Đầu tiên là các âm có dấu."
        focus: 1
      - track: JWS-10
        start: 5.8
        note: "Japanese Writing System · JWS-10"
        en: "ga … go · za … zo · da … do · ba … bo · pa … po"
        vi: "ga … gô · za … zô · đa … đô · ba … bô · pa … pô"
        step: 1.2
        pause: 1
      - emma: "Then the contracted sounds."
        vi: "Sau đó là các âm ghép."
        focus: 2
