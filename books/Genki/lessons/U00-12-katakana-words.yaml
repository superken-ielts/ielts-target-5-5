title: "Unit 0 · The Japanese Writing System"
subtitle: "Katakana 2 · Loanwords, foreign sounds, first kanji"
title_vi: "Katakana 2 — dấu và âm ghép, trường âm ー, âm ngoại lai, đọc từ mượn và tên tiếng Việt; làm quen chữ Hán"
