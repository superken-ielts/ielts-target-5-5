  - kind: jp
    chapter: "Long vowels ー"
    heading: "Long vowels in katakana · a dash ー"
    items:
      - jp: "カー ・ スキー ・ スーツ ・ ケーキ ・ ボール"
        romaji: "kaa · sukii · suutsu · keeki · booru"
        en: "car · ski · suit · cake · ball. In katakana, a long vowel is a dash ー."
        vi: "ô tô · trượt tuyết · com-lê · bánh ngọt · quả bóng. Trong katakana, trường âm là dấu gạch ー."
    lines:
      - emma: "In katakana, a long vowel is simply a dash. Hold it for two beats. Car, ski, suit, cake, ball."
        vi: "Trong katakana, nguyên âm dài chỉ là một dấu gạch. Kéo dài hai nhịp. Ô tô, trượt tuyết, com-lê, bánh ngọt, quả bóng."
      - yuki: "カー、スキー、スーツ、ケーキ、ボール。"
        en: "car, ski, suit, cake, ball"
        vi: "ô tô, trượt tuyết, com-lê, bánh ngọt, quả bóng"
        echo: true
      - emma: "The book's audio."
        vi: "Audio của sách."
      - track: JWS-12
        start: 12.0
        note: "Japanese Writing System · JWS-12"
        en: "car, ski, suit, cake, ball"
        vi: "ô tô, trượt tuyết, com-lê, bánh ngọt, quả bóng"
