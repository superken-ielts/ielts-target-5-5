  - kind: jp
    chapter: "A first look at kanji"
    heading: "Kanji · characters with meaning"
    items:
      - jp: "{木|き} ・ {日|ひ}"
        romaji: "ki · hi"
        en: "Some kanji are pictures: a tree, the sun."
        vi: "Chữ tượng hình: 木 (mộc) – cây, 日 (nhật) – mặt trời, ngày."
      - jp: "{三|さん} ・ {上|うえ}"
        romaji: "san · ue"
        en: "Some are simple signs: three lines for three, a mark above a line for up."
        vi: "Chữ chỉ sự: 三 (tam) – ba, 上 (thượng) – trên."
      - jp: "{日|ひ} ＋ {月|つき} → {明|あか}るい"
        romaji: "hi + tsuki → akarui"
        en: "Some combine two kanji: sun + moon = bright."
        vi: "Chữ hội ý: 日 + 月 → 明 (minh) – sáng."
      - jp: "{日|にち} ・ {日|ひ}"
        romaji: "nichi · hi"
        en: "Most kanji have two kinds of reading: on-yomi from Chinese (にち) and kun-yomi, the Japanese word (ひ)."
        vi: "Mỗi chữ Hán thường có âm On gốc Hán (にち – gần “nhật”) và âm Kun thuần Nhật (ひ). Biết Hán-Việt là lợi thế lớn khi học chữ Hán."
    lines:
      - emma: "Finally, a first look at kanji, the third kind of letter. Kanji carry meaning. Some began as pictures: a tree, and the sun."
        vi: "Cuối cùng, làm quen với chữ Hán, loại chữ thứ ba. Chữ Hán mang nghĩa. Có chữ bắt nguồn từ hình vẽ: cái cây, và mặt trời."
      - yuki: "き、ひ。"
        en: "tree, sun"
        vi: "cây, mặt trời"
        pause: 1
      - emma: "Some are simple signs: three, and up."
        vi: "Có chữ là ký hiệu đơn giản: ba, và trên."
        focus: 1
      - yuki: "さん、うえ。"
        en: "three, up"
        vi: "ba, trên"
        pause: 1
      - emma: "Some put two kanji together. The sun and the moon make bright."
        vi: "Có chữ ghép hai chữ Hán lại. Mặt trời và mặt trăng thành “sáng”."
        focus: 2
      - emma: "Most kanji have two kinds of reading: one from Chinese, and one Japanese word. If you know Sino-Vietnamese words, the Chinese readings will often feel familiar."
        vi: "Hầu hết chữ Hán có hai kiểu đọc: một âm gốc Hán, và một từ thuần Nhật. Nếu bạn biết từ Hán-Việt, âm gốc Hán thường nghe quen."
        focus: 3
      - yuki: "にち、ひ。"
        en: "day: nichi (from Chinese), hi (Japanese)"
        vi: "ngày: にち (âm Hán, gần “nhật”), ひ (âm Nhật)"
        pause: 1
      - emma: "Don't worry about kanji yet. GENKI starts them in Lesson 3, a few at a time. Next video: greetings."
        vi: "Chưa cần lo về chữ Hán. GENKI bắt đầu học chữ Hán từ bài 3, mỗi bài một ít. Video tiếp theo: câu chào hỏi."
