# mỗi cặp "âm – từ" một dòng `start` / `end`; チェック, デュエット có っ làm khoảng lặng giữa từ nên `step: 0`), đọc từ
# mượn, tên tiếng Việt bằng katakana, làm quen chữ Hán (bốn kiểu chữ, âm On / Kun).
# Cách đọc: âm ngoại lai đọc rời bị misaki tách (フィ → fu-i) nên để audio gốc đọc.
