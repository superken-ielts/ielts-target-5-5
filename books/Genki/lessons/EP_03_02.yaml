# EP 3.2 — GENKI I bài 3, Part B (bản thiết kế: EP_03_02). Xem ghi chú đầu file EP_01_01.yaml.
# Sửa so với bản thiết kế: trợ từ を・で・に・へ là điểm ngữ pháp 3, từ chỉ thời gian là điểm 4 của bài 3
# (bản thiết kế ghi 2a, 2b & 3). Bộ đọc đọc 日本語 là にっぽんご → `say` viết にほんご.
id: EP_03_02
activity: U03-part-b
title: "Unit 3 · Making a Date"
subtitle: "EP 3.2 · The 4 Golden Particles (o, de, ni, e) & Time Expressions"
title_vi: "Phần B — Trợ từ を・で・に・へ và từ chỉ thời gian"
tag: "TARGET N5 • 5.0"
gap: 0
scene_gap: 0
speakers:
  emma: {name: Emma, role: grammar & topic guide, voice: {kokoro: bf_emma}, color: "#00A8B5", speed: 1.0}
  yuki: {name: Yuki, role: Japanese tutor · listen & shadow, lang: ja, voice: {kokoro: jf_alpha}, color: "#F39C12", speed: 0.88}

scenes:
  - kind: jp
    chapter: "を (object) & で (place of action)"
    heading: "Unit 3.2: Particles [ を (Object) ] & [ で (Action Place) ]"
    items:
      - jp: "[Place] で [Object] を [Verb-ます]。"
        romaji: "[Place] de [Object] o [Verb-masu]."
        en: "Grammar Point 3: 'de' marks where the action takes place; 'o' marks the direct object."
        vi: "Điểm ngữ pháp 3: Trợ từ 'de' đặt sau nơi diễn ra hành động; trợ từ 'o' đặt sau tân ngữ."
    lines:
      - emma: "Welcome to Unit 3, Part B! Grammar Point 3 is the backbone of Japanese sentence structure: the four particles 'o', 'de', 'ni', and 'e'. Put 'o' after the direct object, and 'de' after the place where the action happens!"
        say: "Welcome to Unit 3, Part B! Grammar Point 3 is the backbone of Japanese sentence structure: the four particles 'oh', 'deh', 'nee', and 'eh'. Put 'oh' after the direct object, and 'deh' after the place where the action happens!"
        pause: 0.6

  - kind: jp
    chapter: "Shadowing: で + を"
    heading: "Shadowing: Place 'de' + Object 'o'"
    items:
      - jp: "カフェで コーヒーを {飲|の}みます。 / {家|いえ}で {日本語|にほんご}を {勉強|べんきょう}します。"
        romaji: "Kafe de koohii o nomimasu. / Ie de nihongo o benkyou shimasu."
        en: "I drink coffee at a cafe. / I study Japanese at home."
        vi: "Tôi uống cà phê ở quán cà phê. / Tôi học tiếng Nhật ở nhà."
    lines:
      - yuki: "カフェでコーヒーを飲みます。家で日本語を勉強します。"
        say: "カフェでコーヒーを飲みます。家でにほんごを勉強します。"
        pause: 1.8

  - kind: jp
    chapter: "に / へ (goal) & に (time)"
    heading: "Unit 3.2: Particles [ に / へ (Goal) ] & [ に (Specific Time) ]"
    items:
      - jp: "{七時|しちじ}に {起|お}きます。 / {毎日|まいにち}（×に）{会社|かいしゃ}に {行|い}きます。"
        romaji: "Shichi-ji ni okimasu. / Mainichi kaisha ni ikimasu."
        en: "Grammar 3 & 4: Use 'ni' for specific time (7:00, Sunday) and destination. No 'ni' after mainichi/ashita/kyou."
        vi: "Điểm ngữ pháp 3 & 4: Dùng 'ni' sau giờ giấc/thứ cụ thể và đích đến. KHÔNG dùng 'ni' sau mỗi ngày/hôm nay/ngày mai."
    lines:
      - emma: "Next, use 'ni' or 'e' for the destination of movement verbs like go, come, and return. For Grammar Point 4, also use 'ni' for specific clock times and days of the week, like 'at 7 o'clock' or 'on Sunday'. Do NOT use 'ni' with relative words like 'every day' or 'tomorrow'!"
        say: "Next, use 'nee' or 'eh' for the destination of movement verbs like go, come, and return. For Grammar Point 4, also use 'nee' for specific clock times and days of the week, like 'at 7 o'clock' or 'on Sunday'. Do NOT use 'nee' with relative words like 'every day' or 'tomorrow'!"
        pause: 0.5

  - kind: jp
    chapter: "Shadowing: time に + goal に"
    heading: "Shadowing: Time 'ni' + Destination 'ni'"
    items:
      - jp: "{毎日|まいにち}、{六時半|ろくじはん}に {起|お}きます。{八時|はちじ}に {会社|かいしゃ}に {行|い}きます。"
        romaji: "Mainichi, roku-ji han ni okimasu. Hachi-ji ni kaisha ni ikimasu."
        en: "Every day, I wake up at 6:30. I go to the office at 8:00."
        vi: "Mỗi ngày, tôi thức dậy lúc 6 giờ rưỡi. Tôi đi đến công ty vào lúc 8 giờ."
    lines:
      - yuki: "毎日、六時半に起きます。八時に会社に行きます。"
        pause: 2.0
