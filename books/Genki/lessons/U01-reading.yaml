# U01 · Reading — GENKI I 読み書き bài 1 ひらがな (trang 296–299). Video luyện đọc ~8 phút cho phiên Đọc – viết:
# làm lại các bài I-A … I-F và II của sách với audio gốc Y01-1 … Y01-6 (chọn hiragana đúng, tên người và địa danh,
# dấu ゛゜, âm ghép nhỏ và っ, trường âm, sắp xếp chữ, năm đoạn tự giới thiệu), rồi đoạn mẫu của Aoi (III).
# Đề và đáp án chép từ sách; thẻ phát audio của sách không có câu đọc của Yuki nên không đối chiếu cách đọc.
id: U01-reading
activity: U01-read-write
title: "Unit 1 · Hiragana"
subtitle: "Reading · Hiragana practice with the textbook audio"
title_vi: "Luyện đọc — hiragana: chữ dễ nhầm, dấu ゛゜, âm ghép, trường âm, năm đoạn tự giới thiệu"
tag: "GENKI L1 · N5"
speakers:
  emma: {name: Emma, role: guide, voice: {kokoro: bf_emma}, color: "#00A8B5", speed: 1.0}
  yuki: {name: Yuki, role: Japanese tutor, lang: ja, voice: {kokoro: jf_alpha}, color: "#F39C12", speed: 0.88}

scenes:
  - kind: jp
    chapter: "Goals"
    heading: "Unit 1 Reading · ひらがな (p. 296–299)"
    items:
      - jp: "ひらがな"
        romaji: "hiragana"
        en: "Today: the reading exercises of your textbook, with the book's own audio — look-alike letters, voiced sounds, small letters, long vowels — then five short self-introductions."
        vi: "Hôm nay: các bài đọc trong sách, kèm audio gốc — chữ dễ nhầm, âm đục, chữ nhỏ, trường âm — rồi năm đoạn tự giới thiệu ngắn."
    lines:
      - emma: "Welcome to Unit 1 reading practice. Open your textbook at the reading and writing section, Lesson 1, page 296. We will do the reading exercises together with the book's own audio, check the answers, and then read five short self-introductions."
      - yuki: "ひらがな。"
        pause: 1

  - kind: jp
    chapter: "A. Look-alike letters"
    heading: "I-A (p. 297) · Choose the correct hiragana"
    items:
      - jp: "1. ま・よ　2. は・ほ　3. ぬ・め　4. む・す　5. さ・き　6. さ・ち　7. た・に　8. ろ・る　9. え・ん"
        en: "Listen and choose: 1 yo, 2 ho, 3 me, 4 su, 5 ki, 6 chi, 7 ta, 8 ro, 9 e."
        vi: "Nghe và chọn chữ đúng: 1 yo, 2 ho, 3 me, 4 su, 5 ki, 6 chi, 7 ta, 8 ro, 9 e."
      - jp: "1. よ　2. ほ　3. め　4. す　5. き　6. ち　7. た　8. ろ　9. え"
        romaji: "yo · ho · me · su · ki · chi · ta · ro · e"
        en: "Answers."
        vi: "Đáp án."
      - jp: "さ・ち ／ ぬ・め ／ ろ・る ／ は・ほ"
        romaji: "sa · chi / nu · me / ro · ru / ha · ho"
        en: "Tips: さ and ち face opposite ways. ぬ and る have a small loop at the end; め and ろ do not. ほ has two short lines, は has one."
        vi: "Mẹo: さ và ち quay ngược chiều nhau. ぬ và る có vòng nhỏ ở cuối, め và ろ thì không. ほ có hai nét ngang ngắn, は có một."
    lines:
      - emma: "Exercise A. For each number there are two hiragana. Listen and choose the one you hear."
      - track: Y01-1
        note: "読み書き I-A · Y01-1"
      - emma: "Here are the answers. Read them with Yuki."
        focus: 1
      - yuki: "よ、ほ、め、す、き、ち、た、ろ、え。"
        pause: 2
      - emma: "These pairs are easy to mix up. Look at the differences on the screen."
        focus: 2
      - yuki: "さ、ち。ぬ、め。ろ、る。は、ほ。"
        say: "さ、ち。ぬ、め。ろ、る。ハ、ほ。"
        pause: 2

  - kind: jp
    chapter: "B. Names"
    heading: "I-B (p. 297) · People's names and place names"
    items:
      - jp: "たなか ・ やまもと ・ さくま ・ たかはし ・ もりかわ ／ くまもと ・ おかやま ・ もりおか ・ よこはま ・ みと"
        romaji: "Tanaka · Yamamoto · Sakuma · Takahashi · Morikawa / Kumamoto · Okayama · Morioka · Yokohama · Mito"
        en: "Five family names, then five place names in Japan. Listen and match each word with its romaji."
        vi: "Năm họ người Nhật, rồi năm địa danh. Nghe và nối mỗi từ với cách viết latinh."
    lines:
      - emma: "Exercise B. Five common Japanese family names, and five places in Japan. Listen and match them with the romaji on the screen."
      - track: Y01-2
        note: "読み書き I-B · Y01-2"
      - emma: "Read them again with Yuki."
      - yuki: "たなか、やまもと、さくま、たかはし、もりかわ。くまもと、おかやま、もりおか、よこはま、みと。"
        pause: 2

  - kind: jp
    chapter: "C. Voiced sounds ゛ ゜"
    heading: "I-C (p. 297) · Add ゛ and ゜ where needed"
    items:
      - jp: "1. いちこ　2. たんこ　3. さふとん　4. かいこくしん　5. たんほほ　6. かんへき"
        en: "Listen and add the marks ゛ (k→g, s→z, t→d, h→b) and ゜ (h→p)."
        vi: "Nghe rồi thêm dấu ゛ (k→g, s→z, t→d, h→b) và ゜ (h→p)."
      - jp: "いちご ・ だんご ・ ざぶとん ・ がいこくじん ・ たんぽぽ ・ がんぺき"
        romaji: "ichigo · dango · zabuton · gaikokujin · tanpopo · ganpeki"
        en: "strawberry, dumpling, cushion, foreigner, dandelion, cliff."
        vi: "dâu tây, bánh dango, đệm ngồi, người nước ngoài, bồ công anh, vách đá."
    lines:
      - emma: "Exercise C. These words are missing their marks. Two small dashes make a sound voiced: k becomes g, s becomes z, t becomes d, h becomes b. A small circle makes h into p. Listen and add the marks."
      - track: Y01-3
        note: "読み書き I-C · Y01-3"
      - emma: "Answers."
        focus: 1
      - yuki: "いちご、だんご、ざぶとん、がいこくじん、たんぽぽ、がんぺき。"
        pause: 2

  - kind: jp
    chapter: "D. Small letters"
    heading: "I-D (p. 298) · Small ゃ ゅ ょ and small っ"
    items:
      - jp: "1. しやしん・しゃしん　2. どくしょ・どくしよ　3. きょり・きより　4. ひゃす・ひやす　5. ちゃいろ・ちやいろ　6. おんなのひと・おっなのひと　7. きて・きって　8. もつと・もっと"
        en: "Listen and circle the word you hear: photograph, reading, distance, to chill, brown, woman, stamp, more."
        vi: "Nghe và khoanh từ đúng: ảnh, đọc sách, khoảng cách, làm lạnh, màu nâu, phụ nữ, tem, thêm nữa."
      - jp: "しゃしん ・ どくしょ ・ きょり ・ ひやす ・ ちゃいろ ・ おんなのひと ・ きって ・ もっと"
        romaji: "shashin · dokusho · kyori · hiyasu · chairo · onna no hito · kitte · motto"
        en: "A small ゃゅょ joins the letter before it into one sound. A small っ is a short stop: hold your breath for one beat."
        vi: "ゃゅょ nhỏ ghép với chữ trước thành một âm. っ nhỏ là ngắt hơi một nhịp."
    lines:
      - emma: "Exercise D. In each pair, one word has a small letter. A small ya, yu or yo joins the letter before it into one sound. A small tsu is a short stop, like holding your breath for one beat. Listen and circle the word you hear."
      - track: Y01-4
        note: "読み書き I-D · Y01-4"
      - emma: "Answers."
        focus: 1
      - yuki: "しゃしん、どくしょ、きょり、ひやす、ちゃいろ、おんなのひと、きって、もっと。"
        pause: 2

  - kind: jp
    chapter: "E. Long vowels"
    heading: "I-E (p. 298) · Long vowels change the meaning"
    items:
      - jp: "おばさん — おばあさん ・ おじいさん — おじさん ・ しゅじん — しゅうじん ・ おや — おおや ・ せいき — せき"
        en: "Read the pairs, paying attention to the long vowels."
        vi: "Đọc từng cặp, chú ý trường âm."
      - jp: "おばさん — おばあさん"
        romaji: "obasan — obaasan"
        en: "aunt — grandmother"
        vi: "cô, dì — bà"
      - jp: "おじいさん — おじさん"
        romaji: "ojiisan — ojisan"
        en: "grandfather — uncle"
        vi: "ông — chú, bác"
      - jp: "しゅじん — しゅうじん"
        romaji: "shujin — shuujin"
        en: "husband — prisoner"
        vi: "chồng — tù nhân"
      - jp: "おや — おおや"
        romaji: "oya — ooya"
        en: "parent — landlord"
        vi: "bố mẹ — chủ nhà cho thuê"
      - jp: "せいき — せき"
        romaji: "seeki — seki"
        en: "century — seat"
        vi: "thế kỷ — chỗ ngồi"
    lines:
      - emma: "Exercise E. A long vowel can change the meaning completely. Listen to the pairs."
      - track: Y01-5
        note: "読み書き I-E · Y01-5"
      - emma: "Now say each pair with Yuki. Make the long vowel twice as long."
        focus: 1
      - yuki: "おばさん、おばあさん。"
        pause: 1.8
      - yuki: "おじいさん、おじさん。"
        focus: 2
        pause: 1.8
      - yuki: "しゅじん、しゅうじん。"
        focus: 3
        pause: 1.8
      - yuki: "おや、おおや。"
        focus: 4
        pause: 1.8
      - yuki: "せいき、せき。"
        focus: 5
        pause: 1.8

  - kind: jp
    chapter: "F. Letter puzzle"
    heading: "I-F (p. 298) · Put the hiragana in order"
    items:
      - jp: "わんで ・ ごいえ ・ んほに ・ えなま ・ んせせい ・ がだいく"
        en: "Put the letters in the right order to make a word from Lesson 1. Example: だともち → ともだち."
        vi: "Sắp xếp lại các chữ thành một từ của bài 1. Ví dụ: だともち → ともだち."
      - jp: "でんわ ・ えいご ・ にほん ・ なまえ ・ せんせい ・ だいがく"
        romaji: "denwa · eego · nihon · namae · sensee · daigaku"
        en: "telephone, English, Japan, name, teacher, university."
        vi: "điện thoại, tiếng Anh, Nhật Bản, tên, giáo viên, đại học."
    lines:
      - emma: "Exercise F. Each group of letters is a word from Lesson 1, in the wrong order. Pause the video and try."
      - emma: "Answers."
        focus: 1
      - yuki: "でんわ、えいご、にほん、なまえ、せんせい、だいがく。"
        pause: 2

  - kind: jp
    chapter: "II. Five self-introductions"
    heading: "II Reading Practice (p. 299) · Five people"
    items:
      - jp: "(1) たなか まいです。かいしゃいんです。 / (2) はらだ りょうです。だいがくせいです。せんこうは れきしです。 / (3) かとう ゆうとです。だいがくいんせいです。せんこうは けいざいです。 / (4) わたしの なまえは きたの ひろみです。こうこうの さんねんせいです。 / (5) やまだ まことです。だいがくせいです。せんこうは にほんごです。"
        en: "Questions: 1. Who is an office worker? 2. Whose major is Japanese? 3. Who is a high school student? 4. What is Harada's major?"
        vi: "Câu hỏi: 1. Ai là nhân viên công ty? 2. Ai học chuyên ngành tiếng Nhật? 3. Ai là học sinh trung học? 4. Harada học chuyên ngành gì?"
      - jp: "たなか まいです。かいしゃいんです。"
        romaji: "Tanaka Mai desu. Kaishain desu."
        en: "1. Mai Tanaka is an office worker."
        vi: "1. Tanaka Mai là nhân viên công ty."
      - jp: "やまだ まことです。だいがくせいです。せんこうは にほんごです。"
        romaji: "Yamada Makoto desu. Daigakusee desu. Senkoo wa nihongo desu."
        en: "2. Makoto Yamada's major is Japanese."
        vi: "2. Yamada Makoto học chuyên ngành tiếng Nhật."
      - jp: "わたしの なまえは きたの ひろみです。こうこうの さんねんせいです。"
        romaji: "Watashi no namae wa Kitano Hiromi desu. Kookoo no sannensee desu."
        en: "3. Hiromi Kitano is a high school student, in her third year."
        vi: "3. Kitano Hiromi là học sinh năm ba trung học."
      - jp: "はらだ りょうです。だいがくせいです。せんこうは れきしです。"
        romaji: "Harada Ryoo desu. Daigakusee desu. Senkoo wa rekishi desu."
        en: "4. Harada's major is history."
        vi: "4. Harada học chuyên ngành lịch sử."
    lines:
      - emma: "Reading practice. Five people introduce themselves. Read along while you listen, and find the answers to the four questions on the screen."
      - track: Y01-6
        note: "読み書き II · Y01-6"
      - emma: "Question one: who is an office worker?"
        focus: 1
      - yuki: "たなかまいです。会社員です。"
        pause: 1.5
      - emma: "Question two: whose major is Japanese?"
        focus: 2
      - yuki: "やまだまことです。大学生です。専攻はにほんごです。"
        pause: 1.5
      - emma: "Question three: who is a high school student?"
        focus: 3
      - yuki: "わたしの名前はきたのひろみです。高校の三年生です。"
        pause: 1.5
      - emma: "Question four: what is Harada's major?"
        focus: 4
      - yuki: "はらだりょうです。大学生です。専攻は歴史です。"
        pause: 1.5

  - kind: jp
    chapter: "III. A model to copy"
    heading: "III Writing Practice (p. 299) · Aoi's self-introduction"
    items:
      - jp: "はじめまして、まえかわ あおいです。にほんじんです。だいがくの いちねんせいです。せんこうは えいごです。よろしく おねがいします。"
        romaji: "Hajimemashite, Maekawa Aoi desu. Nihonjin desu. Daigaku no ichinensee desu. Senkoo wa eego desu. Yoroshiku onegaishimasu."
        en: "How do you do? I'm Aoi Maekawa. I'm Japanese. I'm a first-year university student. My major is English. Nice to meet you."
        vi: "Rất vui được gặp. Tôi là Maekawa Aoi, người Nhật, sinh viên năm nhất. Chuyên ngành của tôi là tiếng Anh. Mong được giúp đỡ."
    lines:
      - emma: "Finally, the model in exercise three. Read it aloud with Yuki, then write your own self-introduction in hiragana. The writing video for Unit 1 shows you how, step by step."
      - yuki: "はじめまして、まえかわあおいです。にほんじんです。大学の一年生です。専攻は英語です。よろしくお願いします。"
        pause: 2
      - emma: "Well done. Read these pages aloud once a day this week, until you can read every word without stopping."
