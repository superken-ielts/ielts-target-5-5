        vi: "Nghe và viết số."
      - jp: "{40|よんじゅう}"
        romaji: "yonjuu"
        en: "40: four, then ten."
        vi: "40: bốn mươi."
      - jp: "③ ？"
        quiz: true
        en: "Listen and write the number in digits."
        vi: "Nghe và viết số."
      - jp: "{17|じゅうなな}"
        romaji: "juunana"
