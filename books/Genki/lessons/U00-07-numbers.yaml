        vi: "Nghe và viết số."
      - jp: "{70|ななじゅう}"
        romaji: "nanajuu"
        en: "70: seven, then ten."
        vi: "70: bảy mươi."
      - jp: "⑤ ？"
        quiz: true
        en: "Listen and write the number in digits."
        vi: "Nghe và viết số."
      - jp: "{19|じゅうきゅう}"
