# U00 · Numbers — GENKI I すうじ (trang 35). Video 7–10 phút, không đếm ngược (đợt 27): 0–10 từng số, cách đọc thứ
# hai của 0, 4, 7, 9, 11–19, đếm 1–20, hàng chục và 100, mọi số đến 99; audio gốc K00-02 tô từng số (0–10: 2.2–33.2
# giây, 16 cách đọc; 11–19: 33.6–58.2 giây, 12 cách đọc; hàng chục và 100: từ 58.4 giây); ba bài luyện của trang 35
# dạng đố (nghỉ 3 giây rồi thẻ đáp án), nghe – viết các cặp số dễ nhầm (14 / 40, 17 / 70, 19 / 90), tổng kết Unit 0.
# Số trên thẻ có furigana {5|ご}: mỗi số một chữ để tô sáng.
id: U00-07-numbers
activity: U00-greetings
title: "Unit 0 · Greetings and Numbers"
subtitle: "Numbers · 0 to 100, and practice"
title_vi: "Số đếm — 0 đến 100, cách đọc thứ hai của 0, 4, 7, 9, đọc số, làm tính, nghe – viết số; tổng kết Unit 0"
tag: "GENKI L0 · N5"
gap: 0.8
scene_gap: 1.5
step: 0.9
speakers:
  emma: {name: Emma, role: guide, voice: {kokoro: bf_emma}, color: "#00A8B5", speed: 0.9}
  yuki: {name: Yuki, role: Japanese tutor, lang: ja, voice: {kokoro: jf_alpha}, color: "#F39C12", speed: 0.78}

scenes:
  - kind: jp
    chapter: "Goals"
    heading: "In this video · Numbers 0 to 100"
    items:
      - jp: "すうじ"
        romaji: "suuji"
        en: "Numbers. Lesson 1 uses them for time, age and phone numbers; Lesson 2 for prices."
        vi: "Số đếm. Bài 1 dùng số để nói giờ, tuổi, số điện thoại; bài 2 để nói giá tiền."
    lines:
      - emma: "Welcome back. In this video: numbers from zero to one hundred, and three short practices."
        vi: "Chào mừng bạn trở lại. Trong video này: số đếm từ 0 đến 100, và ba bài luyện ngắn."
      - yuki: "すうじ。"
        en: "numbers"
        vi: "số đếm"
        pause: 1
      - emma: "Why now? In Lesson 1 you will use numbers for the time, your age, and phone numbers."
        vi: "Vì sao học ngay? Ở bài 1, bạn sẽ dùng số để nói giờ, tuổi và số điện thoại."
      - emma: "Good news: Japanese numbers are very regular, and they work just like Vietnamese."
        vi: "Tin vui: số đếm tiếng Nhật rất có quy luật, và ghép giống hệt tiếng Việt."

  - kind: jp
    chapter: "0 to 5"
    heading: "0 to 5"
    items:
      - jp: "{0|ゼロ} ・ {1|いち} ・ {2|に} ・ {3|さん} ・ {4|よん} ・ {5|ご}"
        romaji: "zero · ichi · ni · san · yon · go"
        en: "Zero to five. ゼロ comes from English zero."
        vi: "Không đến năm. ゼロ mượn từ “zero” tiếng Anh."
    lines:
      - emma: "Zero to five. Say each number after Yuki."
        vi: "Từ 0 đến 5. Đọc theo Yuki từng số."
      - yuki: "ゼロ。"
        hl: 0
        en: "zero"
        vi: "không"
        pause: 1.5
      - yuki: "いち。"
        hl: 1
        en: "one"
        vi: "một"
        pause: 1.5
      - yuki: "に。"
        hl: 2
        en: "two"
        vi: "hai"
        pause: 1.5
      - yuki: "さん。"
        hl: 3
        en: "three"
        vi: "ba"
        pause: 1.5
      - yuki: "よん。"
        hl: 4
        en: "four"
        vi: "bốn"
        pause: 1.5
      - yuki: "ご。"
        hl: 5
        en: "five"
        vi: "năm"
        pause: 1.5
      - yuki: "ゼロ、いち、に、さん、よん、ご。"
        en: "0, 1, 2, 3, 4, 5"
        vi: "0, 1, 2, 3, 4, 5"
        pause: 1

  - kind: jp
    chapter: "6 to 10"
    heading: "6 to 10"
    items:
      - jp: "{6|ろく} ・ {7|なな} ・ {8|はち} ・ {9|きゅう} ・ {10|じゅう}"
        romaji: "roku · nana · hachi · kyuu · juu"
        en: "Six to ten. Keep きゅう and じゅう long: two beats each."
        vi: "Sáu đến mười. きゅう và じゅう là trường âm: kéo dài hai nhịp."
    lines:
      - emma: "Six to ten. Say each number after Yuki."
        vi: "Từ 6 đến 10. Đọc theo Yuki từng số."
      - yuki: "ろく。"
        hl: 0
        en: "six"
        vi: "sáu"
        pause: 1.5
      - yuki: "なな。"
        hl: 1
        en: "seven"
        vi: "bảy"
        pause: 1.5
      - yuki: "はち。"
        hl: 2
        en: "eight"
        vi: "tám"
        pause: 1.5
      - yuki: "きゅう。"
        hl: 3
        en: "nine — a long vowel, two beats"
        vi: "chín — trường âm, hai nhịp"
        pause: 1.5
      - yuki: "じゅう。"
        hl: 4
        en: "ten — a long vowel, two beats"
        vi: "mười — trường âm, hai nhịp"
        pause: 1.5
      - emma: "Nine and ten have long vowels. Hold them for two beats."
        vi: "Chín và mười có nguyên âm dài. Hãy kéo dài hai nhịp."
        hl: [3, 4]
      - yuki: "ろく、なな、はち、きゅう、じゅう。"
        en: "6, 7, 8, 9, 10"
        vi: "6, 7, 8, 9, 10"
        pause: 1

  - kind: jp
    chapter: "Second readings"
    heading: "Second readings of 0, 4, 7, 9"
    items:
      - jp: "{0|れい} ・ {4|し} ・ {4|よ} ・ {7|しち} ・ {9|く}"
        romaji: "ree · shi · yo · shichi · ku"
        en: "Second readings of 0, 4, 7 and 9. You will meet them in clock times: 4 o'clock is よじ, 7 o'clock しちじ, 9 o'clock くじ."
        vi: "Cách đọc thứ hai của 0, 4, 7, 9. Sẽ gặp khi nói giờ: 4 giờ là よじ, 7 giờ しちじ, 9 giờ くじ (bài 1)."
    lines:
      - emma: "Some numbers have a second reading. For now, use the first ones. You will need these for clock times in Lesson 1."
        say: "Some numbers have a second reading. For now, yooz the first ones. You will need these for clock times in Lesson 1."
        vi: "Một số con số có cách đọc thứ hai. Bây giờ cứ dùng cách đọc thứ nhất. Bạn sẽ cần những cách này để nói giờ ở bài 1."
      - yuki: "れい、し、よ、しち、く。"
        en: "zero, four, four, seven, nine"
        vi: "không, bốn, bốn, bảy, chín"
        pause: 1

  - kind: jp
    chapter: "0 to 10: book audio"
    heading: "0 to 10 · Read along with the book's audio"
    items:
      - jp: "{0|ゼロ} {0|れい} {1|いち} {2|に} {3|さん} {4|よん} {4|し} {4|よ}\n{5|ご} {6|ろく} {7|なな} {7|しち} {8|はち} {9|きゅう} {9|く} {10|じゅう}"
        en: "0 to 10, with the second readings, as in the textbook."
        vi: "0 đến 10, kèm cách đọc thứ hai, như trong sách."
    lines:
      - emma: "Now the native speaker from your textbook's audio. Follow the orange number, and say it in the pause."
        vi: "Giờ là giọng người Nhật trong audio của sách. Nhìn theo số màu cam, và đọc theo trong khoảng nghỉ."
      - track: "K00-02"
        start: 2.2
        end: 33.2
        note: "すうじ · Numbers · K00-02"
        en: "0 … 10"
        vi: "0 … 10"
        step: 1.2
        pause: 1

  - kind: jp
    chapter: "11 to 19"
    heading: "11 to 19 · ten + the number"
    items:
      - jp: "{11|じゅういち} ・ {12|じゅうに} ・ {13|じゅうさん} ・ {14|じゅうよん} ・ {15|じゅうご}"
        romaji: "juuichi · juuni · juusan · juuyon · juugo"
        en: "Ten plus the number: eleven is ten-one."
        vi: "Mười + số: 11 là じゅう + いち (mười một) — y như tiếng Việt."
      - jp: "{16|じゅうろく} ・ {17|じゅうなな} ・ {18|じゅうはち} ・ {19|じゅうきゅう}"
        romaji: "juuroku · juunana · juuhachi · juukyuu"
        en: "14, 17 and 19 can also use the second readings: じゅうし, じゅうしち, じゅうく."
        vi: "14, 17, 19 cũng đọc được theo cách thứ hai: じゅうし, じゅうしち, じゅうく."
      - jp: "{11|じゅういち} {12|じゅうに} {13|じゅうさん} {14|じゅうよん} {14|じゅうし} {15|じゅうご}\n{16|じゅうろく} {17|じゅうなな} {17|じゅうしち} {18|じゅうはち} {19|じゅうきゅう} {19|じゅうく}"
        en: "11 to 19, with the second readings, as in the textbook."
        vi: "11 đến 19, kèm cách đọc thứ hai, như trong sách."
    lines:
      - emma: "Eleven to nineteen are easy: ten, then the number, just like Vietnamese. Eleven is ten one."
        vi: "Từ 11 đến 19 rất dễ: mười, rồi đến số, y như tiếng Việt. Mười một là “mười – một”."
      - yuki: "じゅういち、じゅうに、じゅうさん、じゅうよん、じゅうご。"
        en: "11, 12, 13, 14, 15"
        vi: "11, 12, 13, 14, 15"
        pause: 1
      - yuki: "じゅうろく、じゅうなな、じゅうはち、じゅうきゅう。"
        focus: 1
        en: "16, 17, 18, 19"
        vi: "16, 17, 18, 19"
        pause: 1
      - emma: "The book's audio, with the second readings too."
        vi: "Audio của sách, có cả cách đọc thứ hai."
        focus: 2
      - track: "K00-02"
        start: 33.6
        end: 58.2
        note: "すうじ · Numbers · K00-02"
        en: "11 … 19"
        vi: "11 … 19"
        step: 1.2
        pause: 1

  - kind: jp
    chapter: "Count to 20"
    heading: "Count from 1 to 20"
    items:
      - jp: "{1|いち} {2|に} {3|さん} {4|よん} {5|ご} {6|ろく} {7|なな} {8|はち} {9|きゅう} {10|じゅう}\n{11|じゅういち} {12|じゅうに} {13|じゅうさん} {14|じゅうよん} {15|じゅうご} {16|じゅうろく} {17|じゅうなな} {18|じゅうはち} {19|じゅうきゅう} {20|にじゅう}"
        en: "1 to 20. Twenty is two-ten: にじゅう."
        vi: "1 đến 20. Hai mươi là “hai – mười”: にじゅう."
    lines:
      - emma: "Twenty is two ten. Now count from one to twenty with Yuki."
        vi: "Hai mươi là “hai – mười”. Giờ hãy đếm từ 1 đến 20 cùng Yuki."
      - yuki: "いち、に、さん、よん、ご、ろく、なな、はち、きゅう、じゅう、じゅういち、じゅうに、じゅうさん、じゅうよん、じゅうご、じゅうろく、じゅうなな、じゅうはち、じゅうきゅう、にじゅう。"
        en: "1 … 20"
        vi: "1 … 20"
        step: 0.6
        pause: 1
      - emma: "Now pause the video and count by yourself, without looking. Do it every day this week."
        vi: "Giờ hãy tạm dừng video và tự đếm, không nhìn màn hình. Tuần này đếm mỗi ngày nhé."
      - emma: "Next: the tens, up to one hundred."
        vi: "Tiếp theo: hàng chục, đến 100."

  - kind: jp
    chapter: "Tens and 100"
    heading: "Tens · just like Vietnamese"
    items:
      - jp: "{20|にじゅう} ・ {30|さんじゅう} ・ {40|よんじゅう} ・ {50|ごじゅう}"
        romaji: "nijuu · sanjuu · yonjuu · gojuu"
        en: "The number, then ten: twenty is two-ten."
        vi: "Số rồi đến じゅう: 20 là に + じゅう (hai mươi). Giống hệt cách đếm tiếng Việt!"
      - jp: "{60|ろくじゅう} ・ {70|ななじゅう} ・ {80|はちじゅう} ・ {90|きゅうじゅう} ・ {100|ひゃく}"
        romaji: "rokujuu · nanajuu · hachijuu · kyuujuu · hyaku"
        en: "For the tens, use よん, なな and きゅう. One hundred is ひゃく."
        vi: "Hàng chục dùng よん, なな, きゅう. Một trăm là ひゃく."
      - jp: "{20|にじゅう} {30|さんじゅう} {40|よんじゅう} {50|ごじゅう} {60|ろくじゅう}\n{70|ななじゅう} {80|はちじゅう} {90|きゅうじゅう} {100|ひゃく}"
        en: "The tens and 100, as in the textbook."
        vi: "Hàng chục và 100, như trong sách."
    lines:
      - emma: "The tens work just like Vietnamese: the number, then ten. Twenty is two ten."
        vi: "Hàng chục ghép y như tiếng Việt: số, rồi đến mười. Hai mươi là “hai – mười”."
      - yuki: "にじゅう、さんじゅう、よんじゅう、ごじゅう。"
        en: "20, 30, 40, 50"
        vi: "20, 30, 40, 50"
        pause: 1
      - emma: "For the tens, use the first readings of four, seven and nine. And one hundred."
        say: "For the tens, yooz the first readings of four, seven and nine. And one hundred."
        vi: "Ở hàng chục, dùng cách đọc thứ nhất của bốn, bảy và chín. Và một trăm."
        focus: 1
      - yuki: "ろくじゅう、ななじゅう、はちじゅう、きゅうじゅう、ひゃく。"
        en: "60, 70, 80, 90, 100"
        vi: "60, 70, 80, 90, 100"
        pause: 1
      - emma: "The book's audio."
        vi: "Audio của sách."
        focus: 2
      - track: "K00-02"
        start: 58.4
        note: "すうじ · Numbers · K00-02"
        en: "20 … 100"
        vi: "20 … 100"
        step: 1.2
        pause: 1

  - kind: jp
    chapter: "Up to 99"
    heading: "Any number up to 99 · tens, then ones"
    items:
      - jp: "{45|よんじゅうご} ・ {83|はちじゅうさん} ・ {99|きゅうじゅうきゅう}"
        romaji: "yonjuugo · hachijuusan · kyuujuukyuu"
        en: "Any number up to 99: the tens, then the ones."
        vi: "Mọi số đến 99: hàng chục rồi hàng đơn vị — 45 là “bốn mươi lăm”: よんじゅう + ご."
    lines:
      - emma: "Now any number up to ninety-nine: the tens, then the ones. Forty-five is four ten five."
        vi: "Giờ đến mọi số tới 99: hàng chục, rồi hàng đơn vị. Bốn mươi lăm là “bốn – mười – năm”."
      - yuki: "よんじゅうご、はちじゅうさん、きゅうじゅうきゅう。"
        en: "45, 83, 99"
        vi: "45, 83, 99"
        pause: 1

  - kind: jp
    chapter: "A. Read the numbers"
    heading: "Practice A · Read the numbers"
    items:
      - jp: "5 ・ 9 ・ 7 ・ 1 ・ 10"
        quiz: true
        en: "Read the numbers aloud in Japanese, then check."
        vi: "Đọc to các số bằng tiếng Nhật, rồi xem đáp án."
      - jp: "{5|ご} ・ {9|きゅう} ・ {7|なな} ・ {1|いち} ・ {10|じゅう}"
        romaji: "go · kyuu · nana · ichi · juu"
        en: "5 · 9 · 7 · 1 · 10"
        vi: "5 · 9 · 7 · 1 · 10"
      - jp: "8 ・ 2 ・ 6 ・ 4 ・ 3"
        quiz: true
        en: "Read the numbers aloud in Japanese, then check."
        vi: "Đọc to các số bằng tiếng Nhật, rồi xem đáp án."
      - jp: "{8|はち} ・ {2|に} ・ {6|ろく} ・ {4|よん} ・ {3|さん}"
        romaji: "hachi · ni · roku · yon · san"
        en: "8 · 2 · 6 · 4 · 3"
        vi: "8 · 2 · 6 · 4 · 3"
    lines:
      - emma: "Practice A. Read these numbers aloud in Japanese. Pause the video if you need more time."
        vi: "Bài luyện A. Đọc to các số này bằng tiếng Nhật. Cần thêm thời gian thì tạm dừng video."
        pause: 3
      - yuki: "ご、きゅう、なな、いち、じゅう。"
        focus: 1
        en: "5, 9, 7, 1, 10"
        vi: "5, 9, 7, 1, 10"
        pause: 1
      - emma: "Five more."
        vi: "Thêm năm số nữa."
        focus: 2
        pause: 3
      - yuki: "はち、に、ろく、よん、さん。"
        focus: 3
        en: "8, 2, 6, 4, 3"
        vi: "8, 2, 6, 4, 3"
        pause: 1

  - kind: jp
    chapter: "B. Bigger numbers"
    heading: "Practice B · Bigger numbers"
    items:
      - jp: "45 ・ 83 ・ 19 ・ 76 ・ 52"
        quiz: true
        en: "Read the numbers aloud, then check."
        vi: "Đọc to các số, rồi xem đáp án."
      - jp: "{45|よんじゅうご} ・ {83|はちじゅうさん} ・ {19|じゅうきゅう} ・ {76|ななじゅうろく} ・ {52|ごじゅうに}"
        romaji: "yonjuugo · hachijuusan · juukyuu · nanajuuroku · gojuuni"
        en: "45 · 83 · 19 · 76 · 52"
        vi: "45 · 83 · 19 · 76 · 52"
    lines:
      - emma: "Practice B: bigger numbers. Tens first, then ones."
        vi: "Bài luyện B: số lớn hơn. Hàng chục trước, rồi hàng đơn vị."
        pause: 3
      - yuki: "よんじゅうご、はちじゅうさん、じゅうきゅう、ななじゅうろく、ごじゅうに。"
        focus: 1
        en: "45, 83, 19, 76, 52"
        vi: "45, 83, 19, 76, 52"
        pause: 1

  - kind: jp
    chapter: "C. Answer in Japanese"
    heading: "Practice C · Work it out, answer in Japanese"
    items:
      - jp: "5 + 3 ・ 9 + 1 ・ 3 + 4 ・ 6 − 6"
        quiz: true
        en: "Work out the answers and say them in Japanese."
        vi: "Tính rồi nói đáp số bằng tiếng Nhật."
      - jp: "{8|はち} ・ {10|じゅう} ・ {7|なな} ・ {0|ゼロ}"
        romaji: "hachi · juu · nana · zero"
        en: "8 · 10 · 7 · 0"
        vi: "8 · 10 · 7 · 0"
    lines:
      - emma: "Practice C. Work out each answer, and say it in Japanese. Five plus three, nine plus one, three plus four, six minus six."
        vi: "Bài luyện C. Tính từng phép, rồi nói đáp số bằng tiếng Nhật. Năm cộng ba, chín cộng một, ba cộng bốn, sáu trừ sáu."
        pause: 3
      - yuki: "はち、じゅう、なな、ゼロ。"
        focus: 1
        en: "8, 10, 7, 0"
        vi: "8, 10, 7, 0"
        pause: 1

  - kind: jp
    chapter: "Listen and write"
    heading: "Listen and write · Numbers that sound alike"
    items:
      - jp: "① ？"
