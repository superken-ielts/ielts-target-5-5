      - emma: "After eating, say thank you for the meal. You can also say it to the cook, or to the restaurant staff."
        vi: "Ăn xong, hãy cảm ơn vì bữa ăn. Bạn cũng có thể nói với người nấu, hay nhân viên nhà hàng."
