scenes:
  - kind: jp
    chapter: "Goals"
    heading: "In this video · More greetings, then your turn"
    items:
      - jp: "はじめまして。"
        romaji: "Hajimemashite."
        en: "Goals: say goodbye, greet at home and at meals, and meet someone for the first time."
        vi: "Mục tiêu: chào tạm biệt, chào hỏi ở nhà và trong bữa ăn, và gặp ai đó lần đầu."
    lines:
      - emma: "Welcome back. In this video: more greetings for every day, and what to say when you meet someone for the first time."
        vi: "Chào mừng bạn trở lại. Trong video này: thêm những câu chào hằng ngày, và nói gì khi gặp ai đó lần đầu."

  - kind: jp
    chapter: "Goodbye"
    heading: "Goodbye · three ways"
    items:
      - jp: "さようなら。"
        romaji: "Sayoonara."
        en: "Goodbye. It sounds final and formal; in daily life it is mostly children saying goodbye to their teacher."
        vi: "Tạm biệt. Nghe trang trọng, như lâu nữa mới gặp lại; hằng ngày chủ yếu học sinh chào thầy cô."
      - jp: "じゃあ、また。"
        romaji: "Jaa, mata."
        en: "See you — between friends who will meet again soon."
        vi: "Gặp lại sau nhé — giữa bạn bè sắp gặp lại."
      - jp: "しつれいします。"
        romaji: "Shitsuree shimasu."
        en: "Excuse me for leaving — when you leave a teacher's or a boss's office."
        vi: "Xin phép (tôi đi) — khi rời phòng thầy cô hay sếp."
    lines:
      - emma: "This famous goodbye sounds quite final and formal. In daily life, it is mostly children saying goodbye to their teacher."
        vi: "Câu tạm biệt nổi tiếng này nghe khá trang trọng, như lâu nữa mới gặp. Hằng ngày, chủ yếu học sinh dùng để chào thầy cô."
      - yuki: "さようなら。"
        en: "Goodbye."
        vi: "Tạm biệt."
        echo: true
