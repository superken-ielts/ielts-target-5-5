# U00 · Hiragana 2 — GENKI I, Japanese Writing System (trang 21–24). Video ~7 phút cho phiên Hệ chữ Nhật & hiragana:
# dấu ゛゜ (JWS-02), âm ghép với ゃゅょ nhỏ (JWS-03), っ nhỏ và ん + hàng な (JWS-04, JWS-05), trường âm (JWS-06),
# ん đọc n / m / ng, nguyên âm bị nuốt (JWS-07), cao độ (JWS-08), rồi đọc từ có các âm mới.
# Cách đọc: âm ghép đọc rời thì misaki hay tách thành hai âm (みょ → mi-yo), nên `say` viết katakana theo mẫu
# "キャ。キュ。キョ、" — mẫu duy nhất đọc đúng cả 11 hàng (lệnh check so romaji từng hàng).
id: U00-hiragana-2
activity: U00-kana
title: "Unit 0 · The Japanese Writing System"
subtitle: "Hiragana 2 · Voiced sounds, small letters, long vowels"
title_vi: "Hiragana 2 — dấu ゛゜, âm ghép ゃゅょ, っ nhỏ, trường âm, nhịp và cao độ"
tag: "GENKI L0 · N5"
speakers:
  emma: {name: Emma, role: guide, voice: {kokoro: bf_emma}, color: "#00A8B5", speed: 1.0}
  yuki: {name: Yuki, role: Japanese tutor, lang: ja, voice: {kokoro: jf_alpha}, color: "#F39C12", speed: 0.88}

scenes:
  - kind: jp
    chapter: "Goals"
    heading: "Hiragana 2 · Every sound in Japanese"
    items:
      - jp: "が ・ きゃ ・ きって ・ おばあさん"
        romaji: "ga · kya · kitte · obaasan"
        en: "Two small marks, three small letters, a small っ and long vowels: with these, hiragana can write every sound in Japanese."
        vi: "Hai dấu nhỏ, ba chữ ゃゅょ nhỏ, っ nhỏ và trường âm: có những thứ này, hiragana viết được mọi âm trong tiếng Nhật."
    lines:
      - emma: "In the last video you learned the forty-six basic letters. Today you will add two small marks, three small letters, a small tsu, and long vowels. With these, you can write every sound in Japanese."
      - yuki: "が、きゃ、きって、おばあさん。"
        pause: 1.5

  - kind: jp
    chapter: "Marks ゛ and ゜"
    heading: "Two small marks · ゛ makes sounds voiced, ゜ makes p"
    items:
      - jp: "が ・ ぎ ・ ぐ ・ げ ・ ご"
        romaji: "ga · gi · gu · ge · go"
        en: "Two short strokes ゛ at the top right: k becomes g."
        vi: "Hai nét nhỏ ゛ ở góc trên bên phải: k thành g."
      - jp: "ざ ・ じ ・ ず ・ ぜ ・ ぞ"
        romaji: "za · ji · zu · ze · zo"
        en: "s becomes z. じ is ji."
        vi: "s thành z. じ đọc \"ji\" (gần \"gi\" tiếng Việt)."
      - jp: "だ ・ ぢ ・ づ ・ で ・ ど"
        romaji: "da · ji · zu · de · do"
        en: "t becomes d. ぢ and づ sound the same as じ and ず, and are rarely used."
        vi: "t thành d (\"đ\"). ぢ và づ đọc giống じ và ず, rất ít dùng."
      - jp: "ば ・ び ・ ぶ ・ べ ・ ぼ"
        romaji: "ba · bi · bu · be · bo"
        en: "h becomes b."
        vi: "h thành b."
      - jp: "ぱ ・ ぴ ・ ぷ ・ ぺ ・ ぽ"
        romaji: "pa · pi · pu · pe · po"
        en: "A small circle ゜ instead: h becomes p."
        vi: "Vòng tròn nhỏ ゜: h thành p."
    lines:
      - emma: "Two short strokes at the top right of a letter make its sound voiced. The k row becomes g."
      - yuki: "が、ぎ、ぐ、げ、ご。"
        pause: 1.8
      - emma: "S becomes z. The second one is ji."
        focus: 1
      - yuki: "ざ、じ、ず、ぜ、ぞ。"
        pause: 1.8
      - emma: "T becomes d. The second and third sound the same as ji and zu, and you will rarely need them."
        focus: 2
      - yuki: "だ、ぢ、づ、で、ど。"
        pause: 1.8
      - emma: "H becomes b."
        focus: 3
      - yuki: "ば、び、ぶ、べ、ぼ。"
        pause: 1.8
      - emma: "With a small circle instead, h becomes p."
        focus: 4
      - yuki: "ぱ、ぴ、ぷ、ぺ、ぽ。"
        pause: 1.8

  - kind: jp
    chapter: "Marks: book audio"
    heading: "All 25 sounds with marks · Read along with the book's audio"
    items:
      - jp: "が　ぎ　ぐ　げ　ご\nざ　じ　ず　ぜ　ぞ\nだ　ぢ　づ　で　ど\nば　び　ぶ　べ　ぼ\nぱ　ぴ　ぷ　ぺ　ぽ"
        en: "The 25 sounds with marks. Listen to the native speaker and read along."
        vi: "25 âm có dấu. Nghe người Nhật đọc và đọc theo."
    lines:
      - emma: "Now the native speaker from your textbook's audio. Read along."
      - track: JWS-02
        note: "Japanese Writing System · JWS-02"

  - kind: jp
    chapter: "Small ゃ ゅ ょ"
    heading: "Small ゃ ゅ ょ · Two letters, one beat"
    items:
      - jp: "きや ・ きゃ"
        romaji: "kiya · kya"
        en: "Big や: two beats, ki-ya. Small ゃ: one beat, kya. Small ゃ, ゅ, ょ follow the i-column letters: き, し, ち, に, ひ, み, り…"
        vi: "や to: hai nhịp, ki-ya. ゃ nhỏ: một nhịp, kya. ゃ, ゅ, ょ nhỏ đi sau các chữ cột i: き, し, ち, に, ひ, み, り…"
      - jp: "きゃ ・ きゅ ・ きょ"
        romaji: "kya · kyu · kyo"
        en: "k + ya, yu, yo"
        vi: "k + ya, yu, yo"
      - jp: "しゃ ・ しゅ ・ しょ"
        romaji: "sha · shu · sho"
        en: "sha, shu, sho"
        vi: "sha, shu, sho"
      - jp: "ちゃ ・ ちゅ ・ ちょ"
        romaji: "cha · chu · cho"
        en: "cha, chu, cho"
        vi: "cha, chu, cho"
      - jp: "にゃ ・ にゅ ・ にょ"
        romaji: "nya · nyu · nyo"
        en: "nya, nyu, nyo"
        vi: "nya, nyu, nyo"
      - jp: "ひゃ ・ ひゅ ・ ひょ"
        romaji: "hya · hyu · hyo"
        en: "hya, hyu, hyo"
        vi: "hya, hyu, hyo"
      - jp: "みゃ ・ みゅ ・ みょ"
        romaji: "mya · myu · myo"
        en: "mya, myu, myo"
        vi: "mya, myu, myo"
      - jp: "りゃ ・ りゅ ・ りょ"
        romaji: "rya · ryu · ryo"
        en: "rya, ryu, ryo"
        vi: "rya, ryu, ryo"
      - jp: "ぎゃ ・ ぎゅ ・ ぎょ"
        romaji: "gya · gyu · gyo"
        en: "gya, gyu, gyo"
        vi: "gya, gyu, gyo"
      - jp: "じゃ ・ じゅ ・ じょ"
        romaji: "ja · ju · jo"
        en: "ja, ju, jo"
        vi: "ja, ju, jo"
      - jp: "びゃ ・ びゅ ・ びょ"
        romaji: "bya · byu · byo"
        en: "bya, byu, byo"
        vi: "bya, byu, byo"
      - jp: "ぴゃ ・ ぴゅ ・ ぴょ"
        romaji: "pya · pyu · pyo"
        en: "pya, pyu, pyo"
        vi: "pya, pyu, pyo"
    lines:
      - emma: "Small ya, yu and yo join the letter before them into one syllable. Listen to the difference: first big ya, two beats, then small ya, one beat."
      - yuki: "きや、きゃ。"
        say: "きや。キャ、"
        pause: 1.8
      - emma: "Now read all eleven rows with Yuki."
        focus: 1
      - yuki: "きゃ、きゅ、きょ。"
        say: "キャ。キュ。キョ、"
        pause: 1.5
      - yuki: "しゃ、しゅ、しょ。"
        say: "シャ。シュ。ショ、"
        focus: 2
        pause: 1.5
      - yuki: "ちゃ、ちゅ、ちょ。"
        say: "チャ。チュ。チョ、"
        focus: 3
        pause: 1.5
      - yuki: "にゃ、にゅ、にょ。"
        say: "ニャ。ニュ。ニョ、"
        focus: 4
        pause: 1.5
      - yuki: "ひゃ、ひゅ、ひょ。"
        say: "ヒャ。ヒュ。ヒョ、"
        focus: 5
        pause: 1.5
      - yuki: "みゃ、みゅ、みょ。"
        say: "ミャ。ミュ。ミョ、"
        focus: 6
        pause: 1.5
      - yuki: "りゃ、りゅ、りょ。"
        say: "リャ。リュ。リョ、"
        focus: 7
        pause: 1.5
      - yuki: "ぎゃ、ぎゅ、ぎょ。"
        say: "ギャ。ギュ。ギョ、"
        focus: 8
        pause: 1.5
      - yuki: "じゃ、じゅ、じょ。"
        say: "ジャ。ジュ。ジョ、"
        focus: 9
        pause: 1.5
      - yuki: "びゃ、びゅ、びょ。"
        say: "ビャ。ビュ。ビョ、"
        focus: 10
        pause: 1.5
      - yuki: "ぴゃ、ぴゅ、ぴょ。"
        say: "ピャ。ピュ。ピョ、"
        focus: 11
        pause: 1.5

  - kind: jp
    chapter: "Small ゃ ゅ ょ: book audio"
    heading: "All 33 contracted sounds · Read along with the book's audio"
    items:
      - jp: "きゃ　きゅ　きょ　　　ひゃ　ひゅ　ひょ　　　じゃ　じゅ　じょ\nしゃ　しゅ　しょ　　　みゃ　みゅ　みょ　　　びゃ　びゅ　びょ\nちゃ　ちゅ　ちょ　　　りゃ　りゅ　りょ　　　ぴゃ　ぴゅ　ぴょ\nにゃ　にゅ　にょ　　　ぎゃ　ぎゅ　ぎょ"
        en: "The 33 contracted sounds, read down each column. Each one is a single beat."
        vi: "33 âm ghép. Mỗi âm chỉ là một nhịp."
    lines:
      - emma: "The native speaker reads them all. Read along."
      - track: JWS-03
        note: "Japanese Writing System · JWS-03"

  - kind: jp
    chapter: "Small っ and double n"
    heading: "Small っ · A one-beat stop"
    items:
      - jp: "かった ・ かた"
        romaji: "katta · kata"
        en: "won · shoulder. The small っ is a pause of one beat before the next consonant: kat-ta."
        vi: "thắng · vai. っ nhỏ là một nhịp ngắt trước phụ âm sau: kát-ta. Thiếu っ là thành từ khác."
      - jp: "さっか ・ はっぱ ・ ざっし"
        romaji: "sakka · happa · zasshi"
        en: "writer · leaf · magazine"
        vi: "nhà văn · lá cây · tạp chí"
      - jp: "かった ・ かた\nさっか ・ はっぱ ・ ざっし"
        en: "Listen to the native speaker. Feel the short stop before the double consonant."
        vi: "Nghe người Nhật đọc, chú ý nhịp ngắt trước phụ âm đôi."
      - jp: "さんねん ・ あんない"
        romaji: "sannen · annai"
        en: "three years · guide. A double n is written ん + a letter from the な row."
        vi: "ba năm · hướng dẫn. Âm n đôi viết bằng ん + một chữ hàng な."
    lines:
      - emma: "A small tsu does not sound like tsu. It is a short stop, one beat long, before the next consonant. Compare: won, and shoulder."
      - yuki: "かった、かた。"
        pause: 1.8
      - emma: "Three more: writer, leaf and magazine."
        focus: 1
      - yuki: "さっか、はっぱ、ざっし。"
        pause: 1.8
      - emma: "Listen to the book's audio."
        focus: 2
      - track: JWS-04
        note: "Japanese Writing System · JWS-04"
      - emma: "A double n is different: you write the letter n, then a letter from the n row. Three years, and guide."
        focus: 3
      - track: JWS-05
        note: "Japanese Writing System · JWS-05"
      - yuki: "さんねん、あんない。"
        pause: 1.5

  - kind: jp
    chapter: "Long vowels"
    heading: "Long vowels · Twice as long, a different word"
    items:
      - jp: "おばあさん ・ おばさん"
        romaji: "obaasan · obasan"
        en: "grandmother · aunt. Hold a long vowel for two beats: the length changes the meaning."
        vi: "bà · cô / dì. Trường âm kéo dài hai nhịp; sai độ dài là sai nghĩa."
      - jp: "おじいさん ・ おじさん"
        romaji: "ojiisan · ojisan"
        en: "grandfather · uncle"
        vi: "ông · chú / bác"
      - jp: "すうじ"
        romaji: "suuji"
        en: "number. Long u: add う."
        vi: "con số. u dài: thêm う."
      - jp: "えいが ・ おねえさん"
        romaji: "eega · oneesan"
        en: "movie · big sister. A long e is usually written えい (said ee), sometimes ええ."
        vi: "phim · chị gái. e dài thường viết えい (đọc \"ê-ê\"), đôi khi ええ."
      - jp: "ほうりつ ・ とお"
        romaji: "hooritsu · too"
        en: "law · ten. A long o is usually written おう, sometimes おお."
        vi: "luật · mười. o dài thường viết おう, đôi khi おお."
      - jp: "おばあさん ・ おばさん\nおじいさん ・ おじさん\nすうじ\nえいが ・ おねえさん\nほうりつ ・ とお"
        en: "Listen to the native speaker and copy the length of each vowel."
        vi: "Nghe người Nhật đọc và bắt chước đúng độ dài từng nguyên âm."
    lines:
      - emma: "A long vowel is the same vowel held for two beats. Be careful: the length changes the word. Grandmother, and aunt."
      - yuki: "おばあさん、おばさん。"
        pause: 1.8
      - emma: "Grandfather, and uncle."
        focus: 1
      - yuki: "おじいさん、おじさん。"
        pause: 1.8
      - emma: "A long u: number."
        focus: 2
      - yuki: "すうじ。"
        pause: 1.5
      - emma: "A long e is usually written with the letter i after it, but it sounds like a long e. Movie, and big sister."
        focus: 3
      - yuki: "えいが、おねえさん。"
        pause: 1.8
      - emma: "A long o is usually written with u after it. Law, and ten."
        focus: 4
      - yuki: "ほうりつ、とお。"
        pause: 1.8
      - emma: "Now the book's audio."
        focus: 5
      - track: JWS-06
        note: "Japanese Writing System · JWS-06"

  - kind: jp
    chapter: "Rhythm and pitch"
    heading: "ん, silent vowels and pitch"
    items:
      - jp: "おんな ・ さんぽ ・ まんが"
        romaji: "onna · sanpo · manga"
        en: "woman · walk · comics. ん changes with the next sound: n before n, t, d, s, z; m before m, p, b; ng before k, g."
        vi: "phụ nữ · đi dạo · truyện tranh. ん đổi theo âm sau: \"n\" trước n, t, d, s, z; \"m\" trước m, p, b; \"ng\" trước k, g."
      - jp: "すきです。"
        romaji: "Suki desu."
        en: "I like it. Between voiceless sounds, i and u are often whispered: it sounds like 'ski-des'."
        vi: "Tôi thích. i và u nằm giữa các âm vô thanh thường bị nuốt: nghe như \"x-ki-đê-x\"."
      - jp: "あさ ・ なまえ ・ たかい"
        romaji: "asa · namae · takai"
        en: "morning · name · high. Japanese has high and low pitch, not stress. Every beat has the same length."
        vi: "buổi sáng · tên · cao. Tiếng Nhật có cao – thấp chứ không có thanh điệu như tiếng Việt hay trọng âm như tiếng Anh; mỗi nhịp dài bằng nhau."
    lines:
      - emma: "Three last points about sound. The letter n changes slightly with the next sound: n, m, or ng."
      - yuki: "おんな、さんぽ、まんが。"
        pause: 1.8
      - emma: "Vowels i and u are often whispered between voiceless sounds. Listen to the book's audio: I like it."
        focus: 1
      - track: JWS-07
        note: "Japanese Writing System · JWS-07"
      - emma: "And pitch. Japanese has no tones like Vietnamese and no stress like English, but each beat is high or low. Listen to morning, name, and high."
        focus: 2
      - track: JWS-08
        note: "Japanese Writing System · JWS-08"

  - kind: jp
    chapter: "Read new words"
    heading: "Read words with the new sounds · Then check"
    items:
      - jp: "がくせい ・ でんわ ・ きって ・ しゃしん"
        quiz: true
        en: "Read the four words aloud, then check."
        vi: "Đọc to bốn từ, rồi xem đáp án."
      - jp: "がくせい ・ でんわ ・ きって ・ しゃしん"
        romaji: "gakusee · denwa · kitte · shashin"
        en: "student · telephone · stamp · photo"
        vi: "sinh viên · điện thoại · tem · ảnh"
      - jp: "おちゃ ・ じてんしゃ ・ ぎゅうにゅう ・ りょこう"
        quiz: true
        en: "Read the four words aloud, then check."
        vi: "Đọc to bốn từ, rồi xem đáp án."
      - jp: "おちゃ ・ じてんしゃ ・ ぎゅうにゅう ・ りょこう"
        romaji: "ocha · jitensha · gyuunyuu · ryokoo"
        en: "tea · bicycle · milk · travel"
        vi: "trà · xe đạp · sữa · du lịch"
      - jp: "ひゃく ・ えいが ・ おかあさん ・ ざっし"
        quiz: true
        en: "Read the four words aloud, then check."
        vi: "Đọc to bốn từ, rồi xem đáp án."
      - jp: "ひゃく ・ えいが ・ おかあさん ・ ざっし"
        romaji: "hyaku · eega · okaasan · zasshi"
        en: "hundred · movie · mother · magazine"
        vi: "một trăm · phim · mẹ · tạp chí"
    lines:
      - emma: "Read these words aloud. Pause the video if you need more time."
        pause: 3
      - emma: "Check with Yuki."
        focus: 1
      - yuki: "がくせい、でんわ、きって、しゃしん。"
        pause: 2
      - emma: "Four more."
        focus: 2
        pause: 3
      - emma: "Check."
        focus: 3
      - yuki: "おちゃ、じてんしゃ、ぎゅうにゅう、りょこう。"
        pause: 2
      - emma: "And the last four."
        focus: 4
        pause: 3
      - emma: "Check."
        focus: 5
      - yuki: "ひゃく、えいが、おかあさん、ざっし。"
        pause: 2
      - emma: "Well done. Now you can read every sound in hiragana. Read the charts in these two videos once a day. In the next video: katakana, for words from other languages, and a first look at kanji."
