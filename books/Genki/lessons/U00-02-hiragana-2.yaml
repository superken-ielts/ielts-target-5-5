        romaji: "wa o n"
        en: "を sounds like o and is only used as a grammar word. ん is n, and it is a full beat on its own."
        vi: "を đọc “ô”, chỉ dùng làm trợ từ. ん là âm n và tự nó là một nhịp."
    lines:
      - emma: "And the last three letters."
        vi: "Và ba chữ cuối cùng."
      - yuki: "わ。"
        hl: 0
        en: "wa"
        vi: "wa — như “oa”"
        pause: 1.5
      - yuki: "を。"
        hl: 1
        en: "o — the same sound as お"
        vi: "o — đọc giống お (“ô”)"
        pause: 1.5
      - emma: "This one sounds just like o. It is only used as a small grammar word, never inside a word."
        vi: "Chữ này đọc giống hệt “ô”. Nó chỉ dùng làm từ ngữ pháp nhỏ, không bao giờ nằm trong một từ."
        hl: 1
      - yuki: "ん。"
        hl: 2
        en: "n — one full beat"
        vi: "n — một nhịp riêng"
        pause: 1.5
      - emma: "The last letter is n. It never starts a word, and it takes one full beat, like any other letter."
        vi: "Chữ cuối là “n”. Nó không bao giờ đứng đầu từ, và chiếm trọn một nhịp như mọi chữ khác."
        hl: 2
      - yuki: "わ、を、ん。"
        en: "wa, o, n"
        vi: "oa, ô, n"
        pause: 1

