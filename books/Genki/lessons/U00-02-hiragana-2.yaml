# U00 · Hiragana 2 — GENKI I, Japanese Writing System (trang 20). Video 7–10 phút, không đếm ngược (đợt 27): hàng
# た (ち chi, つ tsu), な, は (ふ fu; は / へ làm trợ từ đọc khác), ま, や, ら, わ và ん — từng chữ một, cả hàng, đọc từ, ôn,
# viết; rồi cả bảng 46 chữ với audio gốc JWS-01 (giới thiệu tới 11.1 giây → `start: 13.2`; bảng hai cột nên `hl` theo
# thứ tự đọc). Cách đọc: へ đọc riêng bị misaki coi là trợ từ (đọc "e"), nên `say` viết ヘ bằng katakana.
