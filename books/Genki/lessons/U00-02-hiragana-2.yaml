      - emma: "Two letters in the ta row do not follow the pattern. You will learn them carefully."
        vi: "Có hai chữ trong hàng ta không theo quy luật. Bạn sẽ học kỹ hai chữ này."
      - emma: "Then you will read the whole chart with the book's audio. With these rows, you can read words like cat and dog."
        vi: "Sau đó bạn sẽ đọc cả bảng chữ với audio của sách. Có những hàng này, bạn đọc được những từ như con mèo và con chó."

  - kind: jp
    chapter: "Row た"
    heading: "Row た · t + a i u e o · ち is chi, つ is tsu"
    items:
      - jp: "た ち つ て と"
        romaji: "ta chi tsu te to"
        en: "t + the five vowels. Two exceptions: ち is chi, つ is tsu."
        vi: "t + năm nguyên âm. Hai ngoại lệ: ち đọc “chi”, つ đọc “tsư”."
    lines:
      - emma: "The ta row. Say each letter after Yuki."
        vi: "Hàng ta. Đọc theo Yuki từng chữ."
      - yuki: "た。"
        hl: 0
        en: "ta — a light t"
        vi: "ta — như “ta”, t nhẹ"
        pause: 1.5
      - yuki: "ち。"
        hl: 1
        en: "chi — not ti"
        vi: "chi — như “chi”, không phải “ti”"
        pause: 1.5
      - emma: "Not ti, but chi. This one is easy for Vietnamese speakers: it sounds like chi."
        say: "Not tee, but chee. This one is easy for Vietnamese speakers: it sounds like chee."
        vi: "Không phải “ti” mà là “chi”. Chữ này dễ với người Việt: đọc như “chi”."
        hl: 1
      - yuki: "つ。"
        hl: 2
        en: "tsu — like the end of cats"
        vi: "tsu — “ts” như cuối từ “cats”, rồi “ư”"
        pause: 1.5
      - emma: "Not tu, but tsu, like the end of the English word cats. Listen again."
        vi: "Không phải “tu” mà là “tsư”, giống phần cuối của từ “cats” tiếng Anh. Nghe lại nhé."
        hl: 2
      - yuki: "つ。"
        hl: 2
        en: "tsu"
        vi: "tsu"
        pause: 1.5
      - yuki: "て。"
        hl: 3
        en: "te"
        vi: "te — như “tê”"
        pause: 1.5
      - yuki: "と。"
        hl: 4
        en: "to"
        vi: "to — như “tô”"
        pause: 1.5
      - emma: "Now the whole row. Say it with Yuki."
        vi: "Giờ cả hàng. Đọc cùng Yuki nhé."
      - yuki: "た、ち、つ、て、と。"
        en: "ta, chi, tsu, te, to"
        vi: "ta, chi, tsư, tê, tô"
        pause: 1

