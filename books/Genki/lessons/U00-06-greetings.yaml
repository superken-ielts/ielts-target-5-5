# ngày, cảm ơn, xin lỗi, đáp lời; tạm biệt, ở nhà, bữa ăn, gặp lần đầu và cúi chào; mỗi câu chào Emma nói tình huống →
# Yuki / Takeshi → audio gốc K00-01 (mỗi câu tiếng Nhật rồi lời dịch tiếng Anh, nên mỗi câu một dòng `start` / `end`,
