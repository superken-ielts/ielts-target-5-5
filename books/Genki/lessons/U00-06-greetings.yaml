title: "Unit 0 · Greetings and Numbers"
subtitle: "Greetings · Every day, at home, meeting people, ten situations"
title_vi: "Chào hỏi — câu chào theo giờ, cảm ơn, xin lỗi, tạm biệt, ở nhà, bữa ăn, gặp lần đầu; luyện 10 tình huống, tự giới thiệu"
