# U00 · Hiragana 9 — GENKI I, Japanese Writing System (trang 22–24). っ nhỏ (một nhịp ngắt) với audio gốc JWS-04 (mỗi
# từ một dòng `start` / `end`: っ làm khoảng lặng giữa từ nên không tách theo khoảng lặng được), ん + hàng な (JWS-05),
# trường âm (JWS-06, chín từ từ 10.0 giây), ん đọc n / m / ng, nguyên âm bị nuốt (JWS-07), cao độ (JWS-08), rồi đọc từ
# có mọi âm đã học. Mốc thời gian lấy từ lời giới thiệu tiếng Anh của từng file (ASR, xem file 07 mục 4).
id: U00-10-small-tsu-long-vowels
activity: U00-kana
title: "Unit 0 · The Japanese Writing System"
subtitle: "Hiragana 9 · Small っ, long vowels, rhythm"
title_vi: "Hiragana 9 — っ nhỏ, âm n đôi, trường âm, nhịp và cao độ; đọc từ có mọi âm"
tag: "GENKI L0 · N5"
gap: 0.8
