# U00 · Numbers — GENKI I すうじ (trang 35). Video ~6 phút cho phiên Chào hỏi & số đếm: 0–10 và cách đọc thứ hai
# của 0, 4, 7, 9; 11–19; hàng chục và 100 (ghép như tiếng Việt), cả bảng với audio gốc K00-02, ba bài luyện của
# trang 35 dạng đố: đọc số (A, B) và làm tính (C) — đáp án đọc bằng giọng Yuki — rồi nghe – viết các cặp số dễ nhầm
# (14 / 40, 17 / 70, 19 / 90). Số trên thẻ có furigana {5|ご}.
id: U00-numbers
activity: U00-greetings
title: "Unit 0 · Greetings and Numbers"
subtitle: "Numbers · すうじ from 0 to 100"
title_vi: "Số đếm — 0 đến 100, cách đọc thứ hai của 4, 7, 9, đọc số và làm tính"
tag: "GENKI L0 · N5"
speakers:
  emma: {name: Emma, role: guide, voice: {kokoro: bf_emma}, color: "#00A8B5", speed: 1.0}
  yuki: {name: Yuki, role: Japanese tutor, lang: ja, voice: {kokoro: jf_alpha}, color: "#F39C12", speed: 0.88}

scenes:
  - kind: jp
    chapter: "Goals"
    heading: "Numbers · すうじ"
    items:
      - jp: "すうじ"
        romaji: "suuji"
        en: "Numbers from 0 to 100. You need them in Lesson 1 for time, age and phone numbers, and in Lesson 2 for prices."
        vi: "Số từ 0 đến 100. Bài 1 cần số để nói giờ, tuổi, số điện thoại; bài 2 để nói giá tiền."
    lines:
      - emma: "Welcome back. Today: numbers from zero to one hundred. You will need them right away in Lesson 1, for time, age and phone numbers, and in Lesson 2 for prices. The good news: Japanese numbers are very regular."
      - yuki: "すうじ。"
        pause: 1.2

  - kind: jp
    chapter: "0 to 10"
    heading: "0 to 10"
    items:
      - jp: "{0|ゼロ} ・ {1|いち} ・ {2|に} ・ {3|さん} ・ {4|よん} ・ {5|ご}"
        romaji: "zero · ichi · ni · san · yon · go"
        en: "Zero to five. ゼロ comes from English zero."
        vi: "Không đến năm. ゼロ mượn từ \"zero\" tiếng Anh."
      - jp: "{6|ろく} ・ {7|なな} ・ {8|はち} ・ {9|きゅう} ・ {10|じゅう}"
        romaji: "roku · nana · hachi · kyuu · juu"
        en: "Six to ten. Keep きゅう and じゅう long: two beats each."
        vi: "Sáu đến mười. きゅう và じゅう là trường âm: kéo dài hai nhịp."
      - jp: "{0|れい} ・ {4|し} ・ {7|しち} ・ {9|く}"
        romaji: "ree · shi · shichi · ku"
        en: "Second readings of 0, 4, 7 and 9. You will meet them in clock times: 4 o'clock is よじ, 7 o'clock しちじ, 9 o'clock くじ."
        vi: "Cách đọc thứ hai của 0, 4, 7, 9. Sẽ gặp khi nói giờ: 4 giờ là よじ, 7 giờ しちじ, 9 giờ くじ (bài 1)."
    lines:
      - emma: "Zero to five. Repeat after Yuki."
      - yuki: "ゼロ、いち、に、さん、よん、ご。"
        pause: 2
      - emma: "Six to ten. The last two are long: hold them for two beats."
        focus: 1
      - yuki: "ろく、なな、はち、きゅう、じゅう。"
        pause: 2
      - emma: "Four numbers also have a second reading. Zero, four, seven and nine. For now, use the first readings; you will need these ones for clock times in Lesson 1."
        focus: 2
      - yuki: "れい、し、しち、く。"
        pause: 2

  - kind: jp
    chapter: "11 to 19"
    heading: "11 to 19 · ten + the number"
    items:
      - jp: "{11|じゅういち} ・ {12|じゅうに} ・ {13|じゅうさん} ・ {14|じゅうよん} ・ {15|じゅうご}"
        romaji: "juuichi · juuni · juusan · juuyon · juugo"
        en: "Ten plus the number: eleven is ten-one."
        vi: "Mười + số: 11 là じゅう + いち (mười một) — y như tiếng Việt."
      - jp: "{16|じゅうろく} ・ {17|じゅうなな} ・ {18|じゅうはち} ・ {19|じゅうきゅう}"
        romaji: "juuroku · juunana · juuhachi · juukyuu"
        en: "14, 17 and 19 can also use the second readings: じゅうし, じゅうしち, じゅうく."
        vi: "14, 17, 19 cũng đọc được theo cách thứ hai: じゅうし, じゅうしち, じゅうく."
    lines:
      - emma: "Eleven to nineteen are easy: ten, then the number. Eleven is ten one."
      - yuki: "じゅういち、じゅうに、じゅうさん、じゅうよん、じゅうご。"
        pause: 2
      - yuki: "じゅうろく、じゅうなな、じゅうはち、じゅうきゅう。"
        focus: 1
        pause: 2

  - kind: jp
    chapter: "Tens and 100"
    heading: "Tens and 100 · just like Vietnamese"
    items:
      - jp: "{20|にじゅう} ・ {30|さんじゅう} ・ {40|よんじゅう} ・ {50|ごじゅう}"
        romaji: "nijuu · sanjuu · yonjuu · gojuu"
        en: "The number, then ten: twenty is two-ten."
        vi: "Số rồi đến じゅう: 20 là に + じゅう (hai mươi). Giống hệt cách đếm tiếng Việt!"
      - jp: "{60|ろくじゅう} ・ {70|ななじゅう} ・ {80|はちじゅう} ・ {90|きゅうじゅう} ・ {100|ひゃく}"
        romaji: "rokujuu · nanajuu · hachijuu · kyuujuu · hyaku"
        en: "For the tens, use よん, なな and きゅう. One hundred is ひゃく."
        vi: "Hàng chục dùng よん, なな, きゅう. Một trăm là ひゃく."
      - jp: "{45|よんじゅうご} ・ {83|はちじゅうさん} ・ {99|きゅうじゅうきゅう}"
        romaji: "yonjuugo · hachijuusan · kyuujuukyuu"
        en: "Any number up to 99: the tens, then the ones."
        vi: "Mọi số đến 99: hàng chục rồi hàng đơn vị — 45 là \"bốn mươi lăm\": よんじゅう + ご."
    lines:
      - emma: "The tens work just like Vietnamese: the number, then ten. Twenty is two ten."
      - yuki: "にじゅう、さんじゅう、よんじゅう、ごじゅう。"
        pause: 2
      - emma: "For the tens, use four, seven and nine with their first readings. And one hundred."
        focus: 1
      - yuki: "ろくじゅう、ななじゅう、はちじゅう、きゅうじゅう、ひゃく。"
        pause: 2
      - emma: "Now you can say any number up to ninety-nine: the tens, then the ones. Forty-five, eighty-three, ninety-nine."
        focus: 2
      - yuki: "よんじゅうご、はちじゅうさん、きゅうじゅうきゅう。"
        pause: 2

  - kind: jp
    chapter: "Numbers: book audio"
    heading: "0 to 100 · Read along with the book's audio"
    items:
      - jp: "0 ゼロ/れい　1 いち　2 に　3 さん　4 よん/し　5 ご\n6 ろく　7 なな/しち　8 はち　9 きゅう/く　10 じゅう\n11 じゅういち　…　19 じゅうきゅう\n20 にじゅう　30 さんじゅう　40 よんじゅう　50 ごじゅう\n60 ろくじゅう　70 ななじゅう　80 はちじゅう　90 きゅうじゅう\n100 ひゃく"
        en: "0–10, then 11–19, the tens, and 100. Read along with the native speaker."
        vi: "0–10, rồi 11–19, hàng chục và 100. Đọc theo người Nhật."
    lines:
      - emma: "Now the number chart, read by the native speaker on your textbook's audio. Read along."
      - track: K00-02
        note: "すうじ · Numbers · K00-02"

  - kind: jp
    chapter: "A. Read the numbers"
    heading: "Practice A · Read the numbers"
    items:
      - jp: "5 ・ 9 ・ 7 ・ 1 ・ 10"
        quiz: true
        en: "Read the numbers aloud in Japanese, then check."
        vi: "Đọc to các số bằng tiếng Nhật, rồi xem đáp án."
      - jp: "{5|ご} ・ {9|きゅう} ・ {7|なな} ・ {1|いち} ・ {10|じゅう}"
        romaji: "go · kyuu · nana · ichi · juu"
        en: "5 · 9 · 7 · 1 · 10"
        vi: "5 · 9 · 7 · 1 · 10"
      - jp: "8 ・ 2 ・ 6 ・ 4 ・ 3"
        quiz: true
        en: "Read the numbers aloud in Japanese, then check."
        vi: "Đọc to các số bằng tiếng Nhật, rồi xem đáp án."
      - jp: "{8|はち} ・ {2|に} ・ {6|ろく} ・ {4|よん} ・ {3|さん}"
        romaji: "hachi · ni · roku · yon · san"
        en: "8 · 2 · 6 · 4 · 3"
        vi: "8 · 2 · 6 · 4 · 3"
    lines:
      - emma: "Practice A. Read these numbers aloud in Japanese. Pause the video if you need more time."
        pause: 3
      - emma: "Check."
        focus: 1
      - yuki: "ご、きゅう、なな、いち、じゅう。"
        pause: 2
      - emma: "Five more."
        focus: 2
        pause: 3
      - emma: "Check."
        focus: 3
      - yuki: "はち、に、ろく、よん、さん。"
        pause: 2

  - kind: jp
    chapter: "B. Bigger numbers"
    heading: "Practice B · Bigger numbers"
    items:
      - jp: "45 ・ 83 ・ 19 ・ 76 ・ 52"
        quiz: true
        en: "Read the numbers aloud, then check."
        vi: "Đọc to các số, rồi xem đáp án."
      - jp: "{45|よんじゅうご} ・ {83|はちじゅうさん} ・ {19|じゅうきゅう} ・ {76|ななじゅうろく} ・ {52|ごじゅうに}"
        romaji: "yonjuugo · hachijuusan · juukyuu · nanajuuroku · gojuuni"
        en: "45 · 83 · 19 · 76 · 52"
        vi: "45 · 83 · 19 · 76 · 52"
      - jp: "100 ・ 38 ・ 61 ・ 24 ・ 97"
        quiz: true
        en: "Read the numbers aloud, then check."
        vi: "Đọc to các số, rồi xem đáp án."
      - jp: "{100|ひゃく} ・ {38|さんじゅうはち} ・ {61|ろくじゅういち} ・ {24|にじゅうよん} ・ {97|きゅうじゅうなな}"
        romaji: "hyaku · sanjuuhachi · rokujuuichi · nijuuyon · kyuujuunana"
        en: "100 · 38 · 61 · 24 · 97"
        vi: "100 · 38 · 61 · 24 · 97"
    lines:
      - emma: "Practice B: bigger numbers. Tens first, then ones."
        pause: 4
      - emma: "Check."
        focus: 1
      - yuki: "よんじゅうご、はちじゅうさん、じゅうきゅう、ななじゅうろく、ごじゅうに。"
        pause: 2
      - emma: "Five more."
        focus: 2
        pause: 4
      - emma: "Check."
        focus: 3
      - yuki: "ひゃく、さんじゅうはち、ろくじゅういち、にじゅうよん、きゅうじゅうなな。"
        pause: 2

  - kind: jp
    chapter: "C. What are the answers?"
    heading: "Practice C · Answer in Japanese"
    items:
      - jp: "5 + 3 ・ 9 + 1 ・ 3 + 4 ・ 6 − 6"
        quiz: true
        en: "Work out the answers and say them in Japanese."
        vi: "Tính rồi nói đáp số bằng tiếng Nhật."
      - jp: "{8|はち} ・ {10|じゅう} ・ {7|なな} ・ {0|ゼロ}"
        romaji: "hachi · juu · nana · zero"
        en: "8 · 10 · 7 · 0"
        vi: "8 · 10 · 7 · 0"
      - jp: "10 + 9 ・ 8 − 7 ・ 40 − 25"
        quiz: true
        en: "Three more."
        vi: "Thêm ba phép tính."
      - jp: "{19|じゅうきゅう} ・ {1|いち} ・ {15|じゅうご}"
        romaji: "juukyuu · ichi · juugo"
        en: "19 · 1 · 15"
        vi: "19 · 1 · 15"
    lines:
      - emma: "Practice C. Work out each answer, and say it in Japanese. Five plus three, nine plus one, three plus four, six minus six."
        pause: 4
      - emma: "Check."
        focus: 1
      - yuki: "はち、じゅう、なな、ゼロ。"
        pause: 2
      - emma: "Ten plus nine, eight minus seven, forty minus twenty-five."
        focus: 2
        pause: 4
      - emma: "Check."
        focus: 3
      - yuki: "じゅうきゅう、いち、じゅうご。"
        pause: 2

  - kind: jp
    chapter: "Listen and write"
    heading: "Listen and write · Numbers that sound alike"
    items:
      - jp: "① ？"
        quiz: true
        en: "Listen and write the number in digits."
        vi: "Nghe và viết số."
      - jp: "{14|じゅうよん}"
        romaji: "juuyon"
        en: "14: ten, then four."
        vi: "14: mười bốn."
      - jp: "② ？"
        quiz: true
        en: "Listen and write the number in digits."
        vi: "Nghe và viết số."
      - jp: "{40|よんじゅう}"
        romaji: "yonjuu"
        en: "40: four, then ten."
        vi: "40: bốn mươi."
      - jp: "③ ？"
        quiz: true
        en: "Listen and write the number in digits."
        vi: "Nghe và viết số."
      - jp: "{17|じゅうなな}"
        romaji: "juunana"
        en: "17: ten, then seven."
        vi: "17: mười bảy."
      - jp: "④ ？"
        quiz: true
        en: "Listen and write the number in digits."
        vi: "Nghe và viết số."
      - jp: "{70|ななじゅう}"
        romaji: "nanajuu"
        en: "70: seven, then ten."
        vi: "70: bảy mươi."
      - jp: "⑤ ？"
        quiz: true
        en: "Listen and write the number in digits."
        vi: "Nghe và viết số."
      - jp: "{19|じゅうきゅう}"
        romaji: "juukyuu"
        en: "19: ten, then nine."
        vi: "19: mười chín."
      - jp: "⑥ ？"
        quiz: true
        en: "Listen and write the number in digits."
        vi: "Nghe và viết số."
      - jp: "{90|きゅうじゅう}"
        romaji: "kyuujuu"
        en: "90: nine, then ten."
        vi: "90: chín mươi."
      - jp: "⑦ ？"
        quiz: true
        en: "Listen and write the number in digits."
        vi: "Nghe và viết số."
      - jp: "{66|ろくじゅうろく}"
        romaji: "rokujuuroku"
        en: "66: six-ten-six."
        vi: "66: sáu mươi sáu."
      - jp: "⑧ ？"
        quiz: true
        en: "Listen and write the number in digits."
        vi: "Nghe và viết số."
      - jp: "{100|ひゃく}"
        romaji: "hyaku"
        en: "100."
        vi: "100: một trăm."
    lines:
      - emma: "Listen and write the number in digits. Number one."
      - yuki: "じゅうよん。"
        pause: 2.5
      - yuki: "じゅうよん。"
        focus: 1
        pause: 1
      - emma: "Number two."
        focus: 2
      - yuki: "よんじゅう。"
        pause: 2.5
      - yuki: "よんじゅう。"
        focus: 3
        pause: 1
      - emma: "Number three."
        focus: 4
      - yuki: "じゅうなな。"
        pause: 2.5
      - yuki: "じゅうなな。"
        focus: 5
        pause: 1
      - emma: "Number four."
        focus: 6
      - yuki: "ななじゅう。"
        pause: 2.5
      - yuki: "ななじゅう。"
        focus: 7
        pause: 1
      - emma: "Number five."
        focus: 8
      - yuki: "じゅうきゅう。"
        pause: 2.5
      - yuki: "じゅうきゅう。"
        focus: 9
        pause: 1
      - emma: "Number six."
        focus: 10
      - yuki: "きゅうじゅう。"
        pause: 2.5
      - yuki: "きゅうじゅう。"
        focus: 11
        pause: 1
      - emma: "Number seven."
        focus: 12
      - yuki: "ろくじゅうろく。"
        pause: 2.5
      - yuki: "ろくじゅうろく。"
        focus: 13
        pause: 1
      - emma: "Number eight."
        focus: 14
      - yuki: "ひゃく。"
        pause: 2.5
      - yuki: "ひゃく。"
        focus: 15
        pause: 1

  - kind: jp
    chapter: "Unit 0 done"
    heading: "Unit 0 done · Ready for Lesson 1"
    items:
      - jp: "{1|いち}、{2|に}、{3|さん}… {20|にじゅう}!"
        romaji: "Ichi, ni, san… nijuu!"
        en: "Count from 1 to 20 without looking — every day this week. Then start Unit 1: its dialogues still show romaji, so you can begin now."
        vi: "Đếm từ 1 đến 20 không nhìn màn hình — mỗi ngày trong tuần này. Rồi bắt đầu Unit 1: hội thoại bài 1–2 vẫn có romaji nên học được ngay."
    lines:
      - emma: "Last challenge: count from one to twenty without looking at the screen. Do it every day this week, while you walk or wait for the bus."
      - yuki: "いち、に、さん、にじゅう。"
        pause: 2
      - emma: "Well done. You have finished Unit 0: hiragana, katakana, greetings and numbers. You are ready for Lesson 1. Its dialogues still show romaji, so start now, and keep reading the kana charts every day."
