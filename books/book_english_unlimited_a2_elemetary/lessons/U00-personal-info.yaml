  - kind: blanks
    chapter: "can / can't — nghe 1.6"
    heading: "Can you …? · Exercise 1 · can or can't?"
    heading_vi: "Nhớ lại cuộc gọi của Agata — chọn can hay can't, rồi nghe 1.6 để kiểm tra"
    items:
      - {n: 1, q: "Tom ___ spell Agata's surname.", answer: "can't", hint: "can / can't"}
      - {n: 2, q: "Agata ___ remember her mobile number.", answer: "can't", hint: "can / can't"}
      - {n: 3, q: "She ___ remember her email address.", answer: "can", hint: "can / can't"}
      - {n: 4, q: "She ___ speak three languages.", answer: "can", hint: "can / can't"}
    lines:
      - emma: "Now, can. What can you remember about Agata and Tom? Choose can or can't."
        vi: "Giờ đến can. Bạn nhớ gì về Agata và Tom? Chọn can (được) hay can't (không được)."
      - emma: "Can means you are able to do something. Can't means you are not able."
        vi: "can = có thể, làm được; can't (= cannot) = không thể, không làm được."
      - {track: "1.6", start: 2.4, end: 7.3, note: "1.6 · sentence 1", focus: 0}
      - {emma: "Tom can't spell Agata's surname. It's difficult for him.", reveal: 1}
      - {track: "1.6", start: 9.2, end: 13.75, note: "1.6 · sentence 2", focus: 1}
      - {emma: "Agata can't remember her mobile number.", reveal: 2}
      - {track: "1.6", start: 15.6, end: 20.45, note: "1.6 · sentence 3", focus: 2}
      - {emma: "But she can remember her email address.", reveal: 3}
      - {track: "1.6", start: 22.9, end: 26.8, note: "1.6 · sentence 4", focus: 3}
      - {emma: "And she can speak three languages.", reveal: 4}
      - emma: "Listen to the recording again. Can is short and weak. Can't is long and strong."
        vi: "Nghe lại: can đọc ngắn, nhẹ (/kən/); can't đọc dài, mạnh."
      - {track: "1.6", start: 2.4, end: 13.75, note: "1.6 · can't"}
      - emma: "In British English, like the recording, can't has a long a sound. In American English, like me, it's can't. Both are fine."
        say: "In British English, like the recording, can't has a long ah sound. In American English, like me, it's can't. Both are fine."
        vi: "Giọng Anh (audio sách) đọc can't là 'can-t' với âm 'a' dài; giọng Mỹ (Emma) đọc khác một chút. Cả hai đều đúng."

  - kind: compare
    chapter: "Cách dùng can"
    heading: "Grammar · can for ability"
    heading_vi: "can + động từ nguyên mẫu (không có to, không thêm s)"
    items:
      - {title: "Sentences", title_vi: "Câu khẳng định, phủ định", lines: ["I can speak French.", "She can swim.", "He can't drive."]}
      - {title: "Questions", title_vi: "Câu hỏi", lines: ["Can you speak English?", "Can she cook?"]}
      - {title: "Short answers", title_vi: "Trả lời ngắn", lines: ["Yes, I can.", "No, I can't."]}
    lines:
      - emma: "Here's the grammar. Can, then a verb: I can speak French. She can swim. He can't drive."
        focus: 0
        vi: "Ngữ pháp: can + động từ: I can speak French. She can swim. He can't drive."
      - emma: "For a question, put can first: Can you speak English?"
        focus: 1
        vi: "Câu hỏi: đưa can lên đầu câu: Can you speak English?"
      - emma: "And the short answers: Yes, I can. No, I can't."
        focus: 2
        vi: "Trả lời ngắn: Yes, I can. / No, I can't."

  - kind: errors
    chapter: "Lỗi hay gặp"
    heading: "Common mistakes with can"
    heading_vi: "Lỗi người Việt hay mắc với can"
    items:
      - {wrong: "I can to speak English.", right: "I can speak English.", note: "can + động từ, không có to"}
      - {wrong: "She cans swim.", right: "She can swim.", note: "can không thêm s với he / she / it"}
      - {wrong: "Do you can drive?", right: "Can you drive?", note: "câu hỏi: đưa can lên đầu, không dùng do"}
      - {wrong: "I no can cook.", right: "I can't cook.", note: "phủ định: can't (= cannot)"}
    lines:
      - emma: "Let's look at some common mistakes."
        vi: "Cùng xem vài lỗi hay gặp."
      - {emma: "Not, I can to speak. Say: I can speak English. No to after can.", focus: 0, say: "Not: I can to speak. Say: I can speak English. No to, after can."}
      - {emma: "Not, she cans. Say: She can swim. Can has no s.", focus: 1}
      - {emma: "Not, do you can. Say: Can you drive?", focus: 2}
      - {emma: "Not, I no can. Say: I can't cook.", focus: 3}

