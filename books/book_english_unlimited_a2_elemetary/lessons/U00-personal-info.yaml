# Intro · About you — video 3/3: hỏi thông tin cá nhân, my / your / his / her, can (Coursebook tr. 9), phiên U00-intro-2.
# Dựng: cd agents && python -m lesson_video build ../books/book_english_unlimited_a2_elemetary/lessons/U00-personal-info.yaml
# Nguồn: bài 6–8 và "Can you …?" trang 9; đáp án 6a, 7, 1a theo Teacher's Book tr. 22. Audio gốc 1.6 (can / can't) phát
# từng câu. Giọng Mỹ đọc can't là /kænt/, sách (Anh) là /kɑːnt/ — để audio gốc làm mẫu và nói rõ cả hai đều đúng.
# Bảng tính từ sở hữu và lỗi hay gặp của người Việt (can to, cans) là phần thêm vì bản PDF không có Grammar reference.
