  - kind: vocab
    chapter: "my, your, his, her"
    heading: "Possessive adjectives · my, your, his, her …"
    heading_vi: "Tính từ sở hữu — đứng trước danh từ, chỉ 'của ai'"
    items:
      - {w: "I → my", vi: "tôi → của tôi", ex: "I'm Mai. My surname is Nguyen."}
      - {w: "you → your", vi: "bạn → của bạn", ex: "You're Tom. What's your surname?"}
      - {w: "he → his", vi: "anh ấy → của anh ấy", ex: "He's English, but his father is from the USA."}
      - {w: "she → her", vi: "cô ấy → của cô ấy", ex: "She's Agata. Her surname is Karolak."}
      - {w: "it → its", vi: "nó → của nó", ex: "It's a big college. Its address is 25 Gore Street."}
      - {w: "we → our", vi: "chúng tôi → của chúng tôi", ex: "We're students. Our teacher is Emma."}
      - {w: "they → their", vi: "họ → của họ", ex: "They're from Japan. Their home town is Kyoto."}
    lines:
      - emma: "Look at the table on page 9. On the left, I, you, he, she. On the right, my, your, his, her."
        say: "Look at the table on page nine. On the left, I, you, he, she. On the right, my, your, his, her."
        vi: "Xem bảng trang 9: bên trái là chủ ngữ (I, you, he, she…), bên phải là tính từ sở hữu (my, your, his, her…)."
      - emma: "We use my, your, his and her before a noun, like my name, or her address."
        vi: "My, your, his, her đứng trước danh từ: my name (tên của tôi), her address (địa chỉ của cô ấy)."
      - {emma: "I, my.", focus: 0, say: "I. my."}
      - {mai: "I'm Mai. My surname is Nguyen.", say: "I'm My. My surname is Win."}
      - {emma: "You, your.", focus: 1, say: "you. your."}
      - {mai: "You're Tom. What's your surname?"}
      - {emma: "He, his.", focus: 2, say: "he. his."}
      - {tom: "He's English, but his father is from the USA.", say: "He's English, but his father is from the you ess eigh."}
      - {emma: "She, her.", focus: 3, say: "she. her."}
      - {tom: "She's Agata. Her surname is Karolak."}
      - {emma: "It, its. We, our. They, their.", focus: 4, say: "it. its. we. our. they. their."}
      - {tom: "We're students. Our teacher is Emma.", focus: 5}
      - {mai: "They're from Japan. Their home town is Kyoto.", say: "They're from Japan. Their home town is Kee-oh-toh.", focus: 6}
      - emma: "Be careful with his and her. His is for a man. Her is for a woman. In Vietnamese, the words are different."
        vi: "Cẩn thận: his dùng cho nam (của anh ấy), her dùng cho nữ (của cô ấy) — đừng lẫn hai từ này."

