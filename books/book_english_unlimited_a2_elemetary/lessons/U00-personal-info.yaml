      - {emma: "Can you count from 1 to 100 in English?", say: "Can you count from one to a hundred in English?", focus: 3, pause: 1.5}
      - {mai: "Yes, I can. One, two, three … one hundred!", reveal: 3}
      - {emma: "Can you understand sign language?", focus: 4, pause: 1.5}
      - {mai: "No, I can't.", reveal: 4}
      - {emma: "Can you read music?", focus: 5, pause: 1.5}
