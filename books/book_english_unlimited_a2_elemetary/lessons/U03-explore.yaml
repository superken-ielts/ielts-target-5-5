# Unit 3 · Your time — Explore (Coursebook tr. 31–32): Keyword go, Across cultures (chủ đề nên / không nên nói),
# Explore Speaking (nhận tin nhắn điện thoại, xin nhắc lại, xin nói chậm, cho thấy mình hiểu). Phiên U03-explore.
# Dựng: cd agents && python -m lesson_video build ../books/book_english_unlimited_a2_elemetary/lessons/U03-explore.yaml
# Nguồn: trang 31–32 và thẻ vai tr. 123 (Part 2); đáp án theo Teacher's Book tr. 41–42 (Keyword 1a: 1 happy, 2 boat, 3 bed,
# 4 work, 5 meal, 6 Ireland; 1b: go to concerts, parties, Japan · go for a drink, walk · go out with colleagues, family ·
# go shopping, skiing; 2a: 1 d, 2 c, 3 b, 4 e, 5 a; Across cultures 1 (theo tranh): A politics, B religion, C family,
# D money, E home, F age, G health, H work; 2a Ruth: không nên nói về money, religion, politics, age; 2b Amina: nói được
# religion, politics, không nói health problems, money problems; Explore Speaking 2a: 1 Gilberto, 2 Friday, 3 944 6532;
# 3a: 1 Can I talk to Blake, please? 2 Sorry, he isn't here at the moment. 3 Can I take a message? 4 Sorry, can you slow
# down a bit, please? 5 Sorry, can you say that again? 6 I see. Right. OK.; 4a: Can I, she, here, see, can you say,
# can you slow).
# Audio gốc: 1.40 (Amina), 1.41 (Rocio gọi cho Blake, Paul nghe máy — phát nguyên bài), 1.42 (sáu cụm: phát cả bài để kiểm
# tra, rồi từng cụm để nói theo). Track 1.39 (Ruth, người Anh) THIẾU trong bộ CD1: Emma kể lại ý của Ruth theo Teacher's Book.
# Đợt 34 — người học: "fix lại cho unit 3 và unit 4 luôn nhé ko bỏ bài và đáp án hiển thị ra sau nhé". Mọi bài: làm trước,
# đọc / nghe xong mới hiện tất cả đáp án một lần. Thêm các bài trước đây chưa có: Keyword 1b thành bài tập, 1c, 2b–c;
# Across cultures 1 (nối tám tranh); Explore Speaking 1 (ảnh), 2b (đọc hội thoại trên trang sách), 4a–c (ba hội thoại),
# 5a hội thoại 2 (thẻ B tr. 123: Martin / Martine Duplessis gọi tìm Léon). Cuối video là 2 từ A2 của bài theo bảng từ
# English Profile của sách (health, polite). Hình trong sách: tám tranh chủ đề, ảnh Rocio và Paul, tờ ghi chú của Paul,
# hội thoại tr. 32 (hai dải), ba hội thoại bài 4a, thẻ vai tr. 123.
