        vi: "Rocio gọi cho Blake nhưng Blake vắng nhà; Paul nghe máy và ghi tin nhắn. Nghe và điền tờ ghi chú."
        reveal: [1, 3]
      - {track: "1.41", start: 6.0, end: 93.6, note: "1.41 · Rocio and Paul"}
