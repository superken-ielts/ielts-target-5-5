# Unit 3 · Your time — Explore (Coursebook tr. 31–32): Keyword go, Across cultures (chủ đề nên / không nên nói),
# Explore Speaking (nhận tin nhắn điện thoại, xin nhắc lại, xin nói chậm, cho thấy mình hiểu). Phiên U03-explore.
# Dựng: cd agents && python -m lesson_video build ../books/book_english_unlimited_a2_elemetary/lessons/U03-explore.yaml
# Nguồn: trang 31–32; đáp án theo Teacher's Book tr. 41–42 (Keyword 1a: 1 happy, 2 boat, 3 bed, 4 work, 5 meal,
# 6 Ireland; 1b: go to concerts, parties, Japan · go for a drink, walk · go out with colleagues, family · go shopping,
# skiing; 2a: 1 d, 2 c, 3 b, 4 e, 5 a; Across cultures 2a Ruth: không nên nói về money, religion, politics, age; 2b Amina:
# nói được religion, politics, không nói health problems, money problems; Explore Speaking 2a: 1 Gilberto, 2 Friday,
# 3 944 6532; 3a: 1 Can I talk to Blake, please? 2 Sorry, he isn't here at the moment. 3 Can I take a message?
# 4 Sorry, can you slow down a bit, please? 5 Sorry, can you say that again? 6 I see. Right. OK.).
# Audio gốc: 1.40 (Amina), 1.41 (Rocio gọi cho Blake, Paul nghe máy — phát nguyên bài), 1.42 (sáu cụm, phát từng cụm).
# Track 1.39 (Ruth, người Anh) THIẾU trong bộ CD1: Emma kể lại ý của Ruth theo Teacher's Book.
# Your turn theo thẻ vai bài 5a (trang 32): John Tredennick gọi tìm Paula, người học ghi tin nhắn.
id: U03-explore
activity: U03-explore
title: "Unit 3 · Your time"
subtitle: "Explore Speaking · go, conversation topics, phone messages"
title_vi: "Từ khóa go; chủ đề nên và không nên nói với người mới quen; nhận tin nhắn điện thoại (trang 31–32, audio 1.40–1.42)"
tag: "EU A2 · UNIT 3"
speakers:
  emma: {name: Emma, role: teacher, color: "#C8102E", voice: {kokoro: af_heart, flite: slt}}
  tom: {name: Tom, role: student, color: "#1F5FAD", voice: {kokoro: am_michael, flite: rms}}
  mai: {name: Mai, role: learner from Vietnam, color: "#2E7D32", voice: {kokoro: af_bella, flite: slt}}

scenes:
  - kind: title
    chapter: "Giới thiệu"
    lines:
      - emma: "This is Explore for Unit 3. First, the keyword go. Then, what can you talk about with new people? And how do you take a phone message?"
        vi: "Phần Explore của Unit 3: từ khóa go; nói chuyện gì với người mới quen; và cách nhận tin nhắn điện thoại."
      - tom: "Phone calls are difficult for me. People speak so fast!"
        vi: "Gọi điện khó với mình lắm. Người ta nói nhanh quá!"
      - emma: "Don't worry, Tom. Today you learn what to say."
        vi: "Đừng lo, hôm nay sẽ học cách nói."

  - kind: blanks
    chapter: "Keyword: go"
    heading: "Keyword go 1a · Complete the sentences"
    heading_vi: "Điền Ireland, bed, meal, boat, work, happy — các câu này có trong Unit 2 và Unit 3"
    items:
      - {n: 1, q: "We don't go out a lot but we're ___.", answer: "happy"}
      - {n: 2, q: "Happiness is going fishing on a ___ with my friends.", answer: "boat"}
      - {n: 3, q: "I guess I go to ___ at one or two.", answer: "bed"}
      - {n: 4, q: "She usually goes out with friends from ___.", answer: "work"}
      - {n: 5, q: "We usually go for a ___.", answer: "meal"}
      - {n: 6, q: "I'd like to go to Cuba and ___.", answer: "Ireland"}
    lines:
      - emma: "Keyword: go. Complete the sentences with these words: Ireland, bed, meal, boat, work, happy. Pause the video and try."
        vi: "Từ khóa go: điền các từ Ireland, bed, meal, boat, work, happy. Tạm dừng video và làm thử."
        pause: 1.5
      - {tom: "We don't go out a lot but we're happy.", focus: 0, reveal: 1}
      - {tom: "Happiness is going fishing on a boat with my friends.", focus: 1, reveal: 2}
      - {tom: "I guess I go to bed at one or two.", focus: 2, reveal: 3}
      - {tom: "She usually goes out with friends from work.", focus: 3, reveal: 4}
      - {tom: "We usually go for a meal.", focus: 4, reveal: 5}
      - {tom: "I'd like to go to Cuba and Ireland.", focus: 5, reveal: 6}

  - kind: compare
    chapter: "go to, go for a, go out with, go + -ing"
    heading: "Keyword go 1b · Four ways to use go"
    heading_vi: "Xếp concerts, drink, colleagues, family, parties, shopping, walk, skiing, Japan vào bảng"
    items:
      - {title: "go to", title_vi: "đi tới (nơi, sự kiện)", lines: ["concerts", "parties", "Japan", "bed · work"]}
      - {title: "go for a", title_vi: "đi (làm gì đó)", lines: ["drink", "walk", "meal"]}
      - {title: "go out with", title_vi: "đi chơi cùng", lines: ["colleagues", "family", "friends"]}
      - {title: "go + -ing", title_vi: "đi + hoạt động", lines: ["shopping", "skiing", "fishing"]}
    lines:
      - {emma: "Go to a place or an event: go to concerts, go to parties, go to Japan. And go to bed, go to work.", focus: 0, vi: "go to + nơi chốn, sự kiện: go to concerts, go to Japan, go to bed."}
      - {emma: "Go for a: go for a drink, go for a walk, go for a meal.", focus: 1, vi: "go for a + drink / walk / meal."}
      - {emma: "Go out with people: go out with colleagues, go out with family.", focus: 2, vi: "go out with + người: đi chơi cùng ai."}
      - {emma: "And go plus an i n g verb, with no to: go shopping, go skiing, go fishing.", say: "And go plus an eye en gee verb, with no to: go shopping, go skiing, go fishing.", focus: 3, vi: "go + động từ -ing, không có to: go shopping, go skiing."}
      - mai: "In Hue, I often go for a walk by the river, and I go shopping at Dong Ba market."
        say: "In Whey, I often go for a walk by the river, and I go shopping at Dong Bah market."
        focus: 1
        vi: "Ở Huế, mình hay đi dạo bờ sông và đi chợ Đông Ba."

  - kind: pairs
    chapter: "Bài 2a: hỏi và trả lời với go"
    heading: "Keyword go 2a · Match the questions and answers"
    heading_vi: "Nối câu hỏi với câu trả lời — nghe Tom hỏi, Mai trả lời"
    items:
      - {n: 1, q: "How often do you go for a walk?", answer: d}
      - {n: 2, q: "Do you ever go to restaurants?", answer: c}
      - {n: 3, q: "Would you like to go to Cuba?", answer: b}
      - {n: 4, q: "Where do you go shopping?", answer: e}
      - {n: 5, q: "Do you like going out with colleagues?", answer: a}
    options:
      - {k: a, text: "Yes. We always go for a drink on Friday evenings."}
      - {k: b, text: "Yes, I'd love to!"}
      - {k: c, text: "Sometimes, but I like cooking at home."}
      - {k: d, text: "Not very often. I don't have time."}
      - {k: e, text: "I go to the supermarket in the town centre."}
    lines:
      - emma: "Exercise 2. Match the questions and answers. Listen to Tom and Mai."
        say: "Exercise two. Match the questions and answers. Listen to Tom and Mai."
        vi: "Bài 2: nối câu hỏi với câu trả lời."
      - {tom: "How often do you go for a walk?", focus: 0}
      - {mai: "Not very often. I don't have time.", reveal: 1}
      - {tom: "Do you ever go to restaurants?", focus: 1}
      - {mai: "Sometimes, but I like cooking at home.", reveal: 2}
      - {tom: "Would you like to go to Cuba?", focus: 2}
      - {mai: "Yes, I'd love to!", reveal: 3}
      - {tom: "Where do you go shopping?", focus: 3}
      - {mai: "I go to the supermarket in the town centre.", reveal: 4}
      - {tom: "Do you like going out with colleagues?", focus: 4}
      - {mai: "Yes. We always go for a drink on Friday evenings.", reveal: 5}

  - kind: compare
    chapter: "Nói chuyện gì với người mới quen?"
    heading: "Across cultures · Conversation dos and don'ts"
    heading_vi: "Tám chủ đề: age (tuổi), religion (tôn giáo), money (tiền), work, politics (chính trị), health (sức khỏe), home, family"
    items:
      - {title: "Ruth, the UK", title_vi: "với người chưa quen thân thì không nói về", lines: ["money", "religion", "politics", "age"]}
      - {title: "Amina, Lebanon", title_vi: "nói được / không nói", lines: ["OK: religion, politics", "not OK: health problems", "not OK: money problems"]}
    lines:
      - emma: "Across cultures. Which topics are OK to talk about with people you don't know very well? Age, religion, money, work, politics, health, home, family?"
        vi: "Chủ đề nào nói được với người chưa quen thân?"
      - emma: "Ruth is from the UK. Her recording isn't in our audio files, so here is what she says: with people you don't know well, don't talk about money, religion, politics or age."
        focus: 0
        vi: "Không có audio của Ruth (1.39). Theo Teacher's Book: đừng nói về tiền, tôn giáo, chính trị, tuổi tác."
      - emma: "Now listen to Amina from Lebanon. What does she say about the topics?"
        focus: 1
        vi: "Giờ nghe Amina, người Li-băng."
      - {track: "1.40", start: 2.6, end: 21.7, note: "1.40 · Amina, from Lebanon", focus: 1}
      - {tom: "So in Lebanon, religion and politics are OK, but health problems and money problems are not.", focus: 1, vi: "Ở Li-băng, nói về tôn giáo, chính trị thì được; còn chuyện sức khỏe, tiền bạc thì không."}

  - kind: qa
    chapter: "Ở Việt Nam thì sao?"
    heading: "Across cultures 3–4 · What about Vietnam?"
    heading_vi: "Mai kể về Việt Nam — bạn tạm dừng video và trả lời cho nước bạn"
    items:
      - {q: "In Vietnam, is it OK to ask someone's age?", a: "Yes, it's OK. We often ask How old are you? because we need to know what to call the person.", ask: emma, by: mai}
      - {q: "Is it OK to talk about money?", a: "Some people ask how much you earn, but many people don't like that question.", ask: emma, by: mai}
      - {q: "And family?", a: "Yes, family is a very usual topic. People often ask: Are you married? Do you have children?", ask: emma, by: mai}
    lines:
      - emma: "What about Vietnam, Mai? Use these phrases: I usually talk about, it's not polite to discuss, people don't usually like talking about."
        say: "What about Vietnam, Mai? Yooz these phrases: I usually talk about, it's not polite to discuss, people don't usually like talking about."
        vi: "Ở Việt Nam thì sao? Dùng: I usually talk about …, It's not polite to discuss …, People don't usually like talking about …"
      - {emma: "In Vietnam, is it OK to ask someone's age?", focus: 0, pause: 1.5}
      - {mai: "Yes, it's OK. We often ask How old are you? because we need to know what to call the person.", reveal: 0, vi: "Được. Người Việt hay hỏi tuổi để biết xưng hô (anh, chị, em …)."}
      - {emma: "Is it OK to talk about money?", focus: 1, pause: 1.5}
      - {mai: "Some people ask how much you earn, but many people don't like that question.", reveal: 1}
      - {emma: "And family?", focus: 2, pause: 1.5}
      - {mai: "Yes, family is a very usual topic. People often ask: Are you married? Do you have children?", reveal: 2}
      - emma: "Now you. Which topics are OK in your country, and which are not?"
        vi: "Đến lượt bạn: ở nước bạn, chủ đề nào nói được, chủ đề nào không?"

