  - kind: pairs
    chapter: "Mẫu câu điện thoại — nghe 1.42"
    heading: "Explore Speaking 3 · Which expressions can you use …?"
    heading_vi: "Nối tình huống với câu nói — nghe lại từng câu trong 1.42"
    items:
      - {n: 1, q: "when you want to talk to someone", answer: c}
      - {n: 2, q: "when the person isn't there", answer: e}
      - {n: 3, q: "when you offer to take a message", answer: a}
      - {n: 4, q: "when someone speaks too fast", answer: f}
      - {n: 5, q: "when you want someone to repeat", answer: d}
      - {n: 6, q: "to say you understand", answer: b}
    options:
      - {k: a, text: "Can I take a message?"}
      - {k: b, text: "I see. · Right. · OK."}
      - {k: c, text: "Can I talk to Blake, please?"}
      - {k: d, text: "Sorry, can you say that again?"}
      - {k: e, text: "Sorry, he isn't here at the moment."}
      - {k: f, text: "Sorry, can you slow down a bit, please?"}
    lines:
      - emma: "Exercise 3. Which expressions can you use? Listen to each one."
        say: "Exercise three. Which expressions can you use? Listen to each one."
        vi: "Bài 3: câu nào dùng trong tình huống nào? Nghe từng câu."
      - {track: "1.42", start: 3.2, end: 7.2, note: "1.42 · 1", focus: 0, reveal: 1}
      - {track: "1.42", start: 9.5, end: 14.1, note: "1.42 · 2", focus: 1, reveal: 2}
      - {track: "1.42", start: 16.4, end: 20.6, note: "1.42 · 3", focus: 2, reveal: 3}
      - {track: "1.42", start: 23.0, end: 28.5, note: "1.42 · 4", focus: 3, reveal: 4}
      - {track: "1.42", start: 31.0, end: 35.4, note: "1.42 · 5", focus: 4, reveal: 5}
      - {track: "1.42", start: 38.3, end: 46.3, note: "1.42 · 6", focus: 5, reveal: 6}
      - emma: "Can I talk to, or Can I speak to, are both fine. And to show you understand, say I see, right, or OK."
        vi: "Can I talk to … / Can I speak to … đều được. Muốn cho biết mình hiểu: I see, Right, OK."

  - kind: blanks
    chapter: "Đến lượt bạn: ghi tin nhắn"
    heading: "Explore Speaking 5 · Your turn: take a message"
    heading_vi: "John gọi tìm Paula, Mai ghi tin nhắn — bạn nghe và tự ghi vào giấy, rồi so với tờ ghi chú"
    items:
      - {n: 1, q: "Message for: ___", answer: "Paula"}
      - {n: 2, q: "From: ___", answer: "John Tredennick"}
      - {n: 3, q: "Phone: ___", answer: "614 573 1246"}
      - {n: 4, q: "Message: ___", answer: "meet at Gino's Café at 7.00 on Saturday"}
    lines:
      - emma: "Your turn. John calls, and Mai takes a message. Listen, and write the message on a piece of paper."
        vi: "Đến lượt bạn: John gọi điện, Mai ghi tin nhắn. Bạn nghe và tự ghi ra giấy."
      - {tom: "Hello. Can I speak to Paula, please?"}
      - {mai: "Sorry, she isn't here at the moment. Can I take a message?"}
      - {tom: "Yes, please. It's John Tredennick.", say: "Yes, please. It's John Trih-dennick."}
      - {mai: "Sorry, can you say that again?"}
      - {tom: "John Tredennick. T-R-E-D-E-N-N-I-C-K.", say: "John Trih-dennick. tee. ar. ee. dee. ee. en. en. eye. see. kay."}
      - {mai: "Right. And what's the message?"}
      - {tom: "Can she meet me at Gino's Café at seven o'clock on Saturday?", say: "Can she meet me at Jee-no's Café at seven o'clock on Saturday?"}
      - {mai: "OK. And what's your phone number?"}
      - {tom: "It's 614 573 1246.", say: "It's six one four, five seven three, one two four six."}
      - {mai: "Sorry, can you slow down a bit, please?"}
      - {tom: "Six one four, five seven three, one two four six.", speed: 0.7}
      - {mai: "I see. Thanks. Bye."}
      - {emma: "Now check your message.", reveal: [1, 2, 3, 4], vi: "So tin nhắn bạn ghi với tờ ghi chú."}

  - kind: errors
    chapter: "Lỗi hay gặp"
    heading: "Common mistakes"
    heading_vi: "Lỗi người Việt hay mắc với go và khi gọi điện"
    items:
      - {wrong: "I go to shopping on Sunday.", right: "I go shopping on Sunday.", note: "go + -ing, không có to"}
      - {wrong: "Let's go for a drinking.", right: "Let's go for a drink.", note: "go for a + danh từ"}
      - {wrong: "He isn't here in the moment.", right: "He isn't here at the moment.", note: "at the moment = lúc này"}
      - {wrong: "Can you repeat again?", right: "Sorry, can you say that again?", note: "repeat đã có nghĩa là nói lại"}
    lines:
      - emma: "Here are some common mistakes."
        vi: "Vài lỗi hay gặp."
      - {emma: "Go shopping. No to before an i n g verb.", say: "Go shopping. No to before an eye en gee verb.", focus: 0}
      - {emma: "Go for a drink. Not a drinking.", focus: 1}
      - {emma: "He isn't here at the moment.", focus: 2}
      - {emma: "And say: Sorry, can you say that again?", focus: 3}

  - kind: bullets
