# Unit 5 · Your space — Bài 5.1 (Coursebook tr. 42–43): Place to place, Where I live. Phiên U05-lesson-1.
# Dựng: cd agents && python -m lesson_video build ../books/book_english_unlimited_a2_elemetary/lessons/U05-lesson-1.yaml
# Nguồn: trang 42–43 (bài báo "I live here but I work 800 kilometres away" chép nguyên văn); đáp án theo Teacher's Book
# tr. 52–53 (1a: A mountains, a forest · B a market · C the sea, a beach · D a bridge, a river — audio 2.1 đọc sáu từ, không
# có "a forest"; 3: José Luis sống ở một làng nhỏ ở San Luis, làm ở Buenos Aires · Lawrence sống ở Malta, làm ở London;
# 4: 1 JL 14 giờ, L 3–4 giờ · 2 cả hai: hai lần · 3 JL tối thứ Sáu và Chủ nhật, L sáng thứ Hai, tối thứ Năm · 4 JL sông,
# núi; L biển, trường học, sân bay · 5 vợ và các con · 6 JL làng an toàn, yên tĩnh, rẻ hơn; L nhà rộng hơn, nơi sống đẹp
# hơn; 6a: safe/dangerous, noisy/quiet, expensive/cheap, ugly/beautiful, polluted/clean; Prepositions 1a: 1 in 2 on, near
# 3 next to 4 from — TB in ra "on, in" ở câu 2, bài báo viết "on the Chorrillos river, near the mountains" nên theo bài báo;
# 2: 1 in 2 in 3 on 4 in 5 on).
# Audio gốc: 2.1 (tên sáu nơi trong ảnh, sau phần giới thiệu CD2), 2.2 (12 tính từ).
# Đợt 32 — người học yêu cầu: (1) đáp án hiện tất cả một lần SAU khi đọc / nghe xong (không hiện lúc đang đọc): mỗi bài
# làm trước (tạm dừng), nghe / đọc không có đáp án, rồi một dòng `reveal` mở hết; (2) cuối video hiện hết từ A2 của bài
# theo bảng từ English Profile của sách (`python -m lesson_video wordlist ../books/book_english_unlimited_a2_elemetary
# --unit U05`): 28 từ nơi chốn, tả nơi chốn, phương hướng. Bảng từ xếp vào Unit 5 cả từ không có trên trang bài học
# (castle, desert, field, hill, island, petrol station, theatre); sách dẫn tới Vocabulary reference "Places, p143" mà bản
# quét không có. 59 từ A2 của Unit 5 chia cho bốn video theo nội dung (file 08 mục 6.9).
# Hình trong sách: bốn ảnh A–D, khung từ Places, bài báo (mỗi cột một cảnh, khung đỏ theo đoạn), câu hỏi bài 4, khung tính từ
# 6a, sơ đồ giới từ, bảng in / on.
# `phonemes` đánh ⚠ "close" ở "close to" (gần): tính từ, Kokoro đọc đúng /kloʊs/ — đừng đổi thành `cloze`.
# Mai: giáo viên tiếng Anh ở Huế (video Unit 1–4); Tom: sinh viên ở TP. Hồ Chí Minh, gia đình ở Đà Lạt (hồ sơ file 06 mục 9.4).
# Đợt 33 — người học: video dưới 10 phút mà chưa đủ bài trong sách thì làm dài hơn. Thêm Reading 5 (hỏi – đáp) và Writing 3
# (năm, sáu câu của Mai về nơi sống và làm việc, dùng in / on / near / next to / from) mà bản đợt 32 chưa có.
