  - kind: blanks
    chapter: "Bài 2: từ trong quảng cáo"
    heading: "Task vocabulary 2 · Find words or expressions in adverts A–C which mean:"
    heading_vi: "Tạm dừng video, tìm trong ba quảng cáo; đáp án hiện cùng lúc"
    items:
      - {n: 1, q: "money you pay to live somewhere → ___", answer: "rent", hint: "A · r…"}
      - {n: 2, q: "for one person → ___", answer: "single", hint: "A · s…"}
      - {n: 3, q: "system for making a place warm → ___", answer: "central heating", hint: "A · c… h…"}
      - {n: 4, q: "men / women → ___", answer: "males / females", hint: "B · m… / f…"}
      - {n: 5, q: "ready to live in → ___", answer: "available", hint: "B · a…"}
      - {n: 6, q: "now, without waiting → ___", answer: "immediately", hint: "B · i…"}
      - {n: 7, q: "with bed, wardrobe, chairs etc. → ___", answer: "furnished", hint: "C · f…"}
      - {n: 8, q: "only for you → ___", answer: "own", hint: "C · o…"}
      - {n: 9, q: "for you and other people → ___", answer: "shared", hint: "C · s…"}
    lines:
      - emma: "Task vocabulary. Find words or expressions in the adverts which mean these things. The first one is: money you pay to live somewhere. Pause the video and try."
        vi: "Tìm trong quảng cáo các từ có nghĩa như sau; câu 1: tiền trả để ở một nơi. Tạm dừng video và làm."
        pause: 1.5
