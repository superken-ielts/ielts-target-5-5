        reveal: ["1", "2", "3", "4", "5", "6", "7", "8", "9"]
        vi: "Đây là toàn bộ đáp án."
      - {emma: "We usually say my own, your own: I have my own room.", focus: 7, vi: "own thường đi với my, your, its: my own room = phòng riêng của tôi."}
      - {emma: "Shared comes from the verb share: I share the kitchen with two other people.", focus: 8, vi: "shared (dùng chung) từ động từ share: I share the kitchen."}

