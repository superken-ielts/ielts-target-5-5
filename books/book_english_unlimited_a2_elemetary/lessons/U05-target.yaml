# Unit 5 · Your space — Target activity: Rent a room (Coursebook tr. 46), phiên U05-target.
# Dựng: cd agents && python -m lesson_video build ../books/book_english_unlimited_a2_elemetary/lessons/U05-target.yaml
# Nguồn: trang 46 (ba quảng cáo trên DublinCapitalRentals.com chép nguyên văn, bỏ số điện thoại); đáp án theo Teacher's Book
# tr. 54–55 (Task reading 1: 1 B — non smoking, parking included, 4.3 km from city centre · 2 A — single apartment, quiet
# house, on main bus route · 3 C — furnished; Task vocabulary 2: 1 rent 2 single 3 central heating 4 males / females
# 5 available 6 immediately 7 furnished 8 own 9 shared; Task listening 3: B; 4a: 1c 2d 3a 4e 5b).
# Audio gốc 2.7 (Alicja gọi hỏi phòng): phát nguyên bài cho bài 3, rồi phát lại đoạn hỏi – đáp (20,3–75,3 s) cho bài 4b.
# Đợt 32: đáp án hiện tất cả một lần SAU khi đọc / nghe xong — ba quảng cáo được đọc to trước, rồi mới hiện đáp án bài 1
# và khung đỏ chỉ câu bằng chứng; cuối video là 8 từ A2 của bài theo bảng từ English Profile của sách.
# Task 5 (đóng vai, thông tin ở tr. 124 không có trong bản quét): Mai hỏi về căn hộ A, Tom đóng vai Max trả lời theo đúng
# quảng cáo A (giờ xem phòng là chi tiết thêm).
# Hình trong sách: ba quảng cáo A, B, C (mỗi quảng cáo một cảnh, khung đỏ theo dòng), dải ba quảng cáo với khung đỏ ở câu
# bằng chứng của bài 1.
