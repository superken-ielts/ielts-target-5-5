      - {mai: "My daughter doesn't like chocolate.", focus: 0, reveal: 1}
      - {mai: "My mobile phone doesn't take photos.", focus: 1, reveal: 2}
      - {mai: "I don't watch TV in the morning.", focus: 2, reveal: 3}
      - {mai: "My husband doesn't speak English.", focus: 3, reveal: 4}
