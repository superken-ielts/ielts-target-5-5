# Nguồn: trang 26–27 (tám bài đăng "Happiness is …" chép nguyên văn); đáp án theo Teacher's Book tr. 38–39 (đại từ tân
# ngữ: me, you, him, her, it, us, them; Vocabulary 4a: xem bài đăng; 5a: playing / watching football, learning languages,
# reading newspapers, going to the cinema, listening to the radio; Grammar 1a: 2 don't read, 3 don't go, 4 don't watch,
# 6 doesn't like, 7 doesn't make; 2a: 2 doesn't, 3 don't, 4 doesn't, 5 don't, 6 doesn't; Speaking 3: Moira reads books
# and newspapers, cooks; Sam goes for walks, goes jogging, drives to the sea, plays tennis).
