  - kind: compare
    chapter: "Đại từ: I – me, he – him"
    heading: "Grammar 3 · Pronouns: subject and object"
    heading_vi: "Đại từ chủ ngữ đứng trước động từ, đại từ tân ngữ đứng sau — tìm các từ tô màu trong bài đăng"
    items:
      - {title: "subject", title_vi: "chủ ngữ — trước động từ", lines: ["I · you · he · she", "it · we · they", "I love chocolate."]}
      - {title: "object", title_vi: "tân ngữ — sau động từ", lines: ["me · you · him · her", "it · us · them", "Mary loves me."]}
    lines:
      - emma: "Grammar: pronouns. I love chocolate. I is a subject pronoun. It comes before the verb."
        focus: 0
        vi: "I là đại từ chủ ngữ, đứng trước động từ."
      - emma: "Mary loves me. Me is an object pronoun. It comes after the verb. So: I, me. He, him. She, her. We, us. They, them. You and it don't change."
        focus: 1
        vi: "me là đại từ tân ngữ, đứng sau động từ: I → me, he → him, she → her, we → us, they → them; you, it giữ nguyên."
      - emma: "Find them in the postings: watching TV with him, my dad doesn't like it, she loves me, I love them."
        focus: 1
        vi: "Trong bài đăng: with him, doesn't like it, loves me, love them."
      - mai: "In Vietnamese, we use the same word for I and me. In English, they're different!"
        vi: "Tiếng Việt dùng cùng một từ cho I và me; tiếng Anh thì khác nhau!"

