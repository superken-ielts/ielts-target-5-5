scenes:
  - kind: title
    chapter: "Giới thiệu"
    lines:
      - emma: "Welcome to Unit 3: Your time. This lesson is about free time, and about happiness. What is happiness for you?"
        say: "Welcome to Unit three: Your time. This lesson is about free time, and about happiness. What is happiness for you?"
        vi: "Unit 3: Your time — thời gian rảnh và hạnh phúc. Với bạn, hạnh phúc là gì?"
      - tom: "Happiness is watching football with my friends."
        vi: "Hạnh phúc là xem bóng đá với bạn bè."
      - mai: "For me, happiness is a big bowl of bun bo Hue on a rainy day!"
        say: "For me, happiness is a big bowl of Boon baw Whey on a rainy day!"
        vi: "Với mình, hạnh phúc là một tô bún bò Huế vào ngày mưa!"

  - kind: passage
    chapter: "Đọc: Happiness is … (1–4)"
    heading: "Reading 1 · Happiness is … (postings 1–4)"
    heading_vi: "Tám bài đăng trên trang web: với mỗi người, hạnh phúc là gì? Tìm ba điều bạn cũng thích"
    items:
      - {label: "1", text: "What's happiness? Talking to my husband and watching something good on TV with him. We don't go out a lot but we're happy.", note: "Berthe, 88, France"}
      - {label: "2", text: "Happiness is going fishing on a boat with my friends and a very cold drink. And catching fish, of course.", note: "Juan Carlos, 43, Brazil"}
      - {label: "3", text: "My work. I'm a photographer and I love taking photos. It's not very well paid, but money doesn't make you happy.", note: "Chin-Mae, 28, Korea"}
      - {label: "4", text: "Happiness is playing the drums really loud, but my dad doesn't like it!", note: "Jason, 15, USA"}
    lines:
      - emma: "Read the web postings about happiness. Listen, and find three things you like."
        vi: "Đọc các bài đăng về hạnh phúc; nghe và tìm ba điều bạn cũng thích."
      - {emma: "What's happiness? Talking to my husband and watching something good on TV with him. We don't go out a lot but we're happy.", focus: 0}
      - {tom: "Happiness is going fishing on a boat with my friends and a very cold drink. And catching fish, of course.", focus: 1}
      - {tom: "My work. I'm a photographer and I love taking photos. It's not very well paid, but money doesn't make you happy.", focus: 2}
      - {tom: "Happiness is playing the drums really loud, but my dad doesn't like it!", focus: 3}

  - kind: passage
    chapter: "Đọc: Happiness is … (5–8)"
    heading: "Reading 1 · Happiness is … (postings 5–8)"
    heading_vi: "Tám bài đăng trên trang web: với mỗi người, hạnh phúc là gì? Tìm ba điều bạn cũng thích"
    items:
      - {label: "5", text: "My friends … talking to them over a coffee, listening to jazz, going to parties together. And my cat. She doesn't like my boyfriend, but she loves me!", note: "Andrea, 32, Australia"}
      - {label: "6", text: "Seeing my grandchildren – that's happiness. I love them so much. I also enjoy reading a good book, but I don't read newspapers. I don't like bad news.", note: "Jakub, 67, Poland"}
      - {label: "7", text: "I like learning new things and meeting new people, so I do a different course every year. This year it's dancing the tango.", note: "Chiara, 38, Italy"}
      - {label: "8", text: "Chocolate! I love it!", note: "Sally, 21, UK"}
    lines:
      - {mai: "My friends. Talking to them over a coffee, listening to jazz, going to parties together.", focus: 0}
      - {mai: "And my cat. She doesn't like my boyfriend, but she loves me!", focus: 0}
      - {tom: "Seeing my grandchildren, that's happiness. I love them so much.", focus: 1}
      - {tom: "I also enjoy reading a good book, but I don't read newspapers. I don't like bad news.", focus: 1}
      - {mai: "I like learning new things and meeting new people, so I do a different course every year. This year it's dancing the tango.", focus: 2}
      - {mai: "Chocolate! I love it!", focus: 3}
