  - kind: qa
    chapter: "Đến lượt bạn"
    heading: "Speaking 4 · Things you do and don't do"
    heading_vi: "Tom hỏi — bạn tạm dừng video và trả lời, rồi nghe Mai"
    items:
      - {q: "What do you do in your free time?", a: "I go for walks, I read a lot and I cook for my family.", ask: tom, by: mai}
      - {q: "And what don't you do?", a: "I don't go to the gym, and I don't play computer games.", ask: tom, by: mai}
    lines:
      - emma: "Your turn. Think about things you do and things you don't do in your free time."
        vi: "Đến lượt bạn: nghĩ những việc bạn làm và không làm lúc rảnh."
      - {tom: "What do you do in your free time?", focus: 0, pause: 1.5}
      - {mai: "I go for walks, I read a lot and I cook for my family.", reveal: 0}
      - {tom: "And what don't you do?", focus: 1, pause: 1.5}
      - {mai: "I don't go to the gym, and I don't play computer games.", reveal: 1}
      - emma: "Now talk to other people. Find someone who does the same things as you."
        vi: "Giờ nói chuyện với người khác, tìm người có cùng sở thích với bạn."

  - kind: errors
    chapter: "Lỗi hay gặp"
    heading: "Common mistakes"
    heading_vi: "Lỗi người Việt hay mắc với don't / doesn't và đại từ"
    items:
      - {wrong: "He don't like jazz.", right: "He doesn't like jazz.", note: "he, she, it + doesn't"}
      - {wrong: "She doesn't likes my boyfriend.", right: "She doesn't like my boyfriend.", note: "doesn't + động từ nguyên mẫu, không thêm s"}
      - {wrong: "My cat loves I.", right: "My cat loves me.", note: "sau động từ: me, him, her, us, them"}
      - {wrong: "I enjoy to read.", right: "I enjoy reading.", note: "enjoy + verb-ing"}
    lines:
      - emma: "Here are some common mistakes."
        vi: "Vài lỗi hay gặp."
      - {emma: "He doesn't like jazz. He, she, it: doesn't.", focus: 0}
      - {emma: "She doesn't like. No s on like.", focus: 1}
      - {emma: "My cat loves me. After the verb, use me.", say: "My cat loves me. After the verb, yooz me.", focus: 2}
      - {emma: "I enjoy reading, with i n g.", say: "I enjoy reading, with eye en gee.", focus: 3}

