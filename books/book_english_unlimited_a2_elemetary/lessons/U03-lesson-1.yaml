# Unit 3 · Your time — Bài 3.1 (Coursebook tr. 26–27): Happiness, I don't like bad news. Phiên U03-lesson-1.
# Dựng: cd agents && python -m lesson_video build ../books/book_english_unlimited_a2_elemetary/lessons/U03-lesson-1.yaml
# Nguồn: trang 26–27 (tám bài đăng "Happiness is …" chép nguyên văn); đáp án theo Teacher's Book tr. 38–39 (Reading 1:
# A 2 Juan Carlos, B 7 Chiara, C 4 Jason, D 3 Chin-Mae; Pronouns: me, you, him, her, it, us, them; Vocabulary 4a: xem bài
# đăng; 5a: playing / watching football, learning languages, reading newspapers, going to the cinema, listening to the
# radio; Grammar 1a: 2 don't read, 3 don't go, 4 don't watch, 6 doesn't like, 7 doesn't make; 2a: 2 doesn't, 3 don't,
# 4 doesn't, 5 don't, 6 doesn't; Speaking 3: Moira reads books and newspapers, cooks; Sam goes for walks, goes jogging,
# drives to the sea, plays tennis).
# Audio gốc: 1.31 (mười hai cụm từ), 1.32 (bảy câu phủ định) — mỗi bài phát trọn một lần rồi mới hiện đáp án. Track 1.33
# (Moira và Sam) THIẾU trong bộ CD1: Tom và Mai kể lại theo Teacher's Book, rồi mới hiện bảng đáp án. Speaking 3b (đọc lời
# bài nghe tr. 149) không làm được: bản quét không có trang 149.
# Đợt 34 — người học: "fix lại cho unit 3 và unit 4 luôn nhé ko bỏ bài và đáp án hiển thị ra sau nhé". Như Unit 5: làm
# trước (tạm dừng), đọc / nghe xong mới hiện tất cả đáp án một lần; thêm các bài trước đây chưa có (Reading 1 nối tranh A–D,
# Reading 2, Pronouns 3 thành bài tập, Vocabulary 5a–b, Writing 6b, Grammar 2b); cuối video là 4 từ A2 của bài theo bảng từ
# English Profile của sách (fish, free time, team, time). Hình trong sách: tranh A–D và trang web, bảng Pronouns, bảng
# Moira – Sam.
