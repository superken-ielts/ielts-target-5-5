  - kind: compare
    chapter: "Quy tắc: don't, doesn't"
    heading: "Grammar 1 · don't and doesn't"
    heading_vi: "I, you, we, they + don't; he, she, it + doesn't — động từ chính không thêm s"
    items:
      - {title: "I, you, we, they", title_vi: "don't = do not", lines: ["I don't like bad news.", "We don't go out a lot.", "They don't watch TV."]}
      - {title: "he, she, it", title_vi: "doesn't = does not", lines: ["My dad doesn't like my music.", "Money doesn't make you happy.", "not: He doesn't likes …"]}
    lines:
      - emma: "After I, you, we and they, use don't plus a verb: I don't like bad news."
        say: "After I, you, we and they, yooz don't plus a verb: I don't like bad news."
        focus: 0
        vi: "Sau I, you, we, they: don't + động từ."
      - emma: "After he, she and it, use doesn't plus a verb: my dad doesn't like my music. The s is on does, not on like. So never say: he doesn't likes."
        say: "After he, she and it, yooz doesn't plus a verb: my dad doesn't like my music. The s is on does, not on like. So never say: he doesn't likes."
        focus: 1
        vi: "Sau he, she, it: doesn't + động từ nguyên mẫu. Đuôi s nằm ở does, không ở like."
      - tom: "Don't, doesn't. My dad doesn't like my music either!"
        vi: "Don't, doesn't. Bố mình cũng không thích nhạc mình nghe!"

