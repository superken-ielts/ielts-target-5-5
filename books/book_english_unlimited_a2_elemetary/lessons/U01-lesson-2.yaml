      - {tom: "I was at work by 6.00 am every Saturday and Sunday.", say: "I was at work by six in the morning every Saturday and Sunday.", focus: 0}
      - {tom: "That was really difficult.", focus: 0}
      - {tom: "I'm not an early morning person!", focus: 0}
      - {emma: "His first job was a shop assistant in a bakery. A bakery is a shop that makes bread.", focus: 0, mark: ["a shop assistant in a bakery"], vi: "Việc đầu tiên: nhân viên bán hàng ở tiệm bánh (bakery = tiệm bánh mì)."}
      - {tom: "My job now. I'm a journalist.", focus: 1}
      - {tom: "It's well paid and it's different every day.", focus: 1}
      - {tom: "I'm often on planes or trains and in hotels and offices around the world and I meet lots of interesting people.", focus: 1}
      - {tom: "It's a great job, really.", focus: 1}
      - {emma: "His best job is his job now. He's a journalist.", focus: 1, mark: ["I'm a journalist"], vi: "Việc tốt nhất: công việc hiện tại — nhà báo."}
      - {tom: "When I was eighteen, I was a cook in a fast food restaurant for a few months.", focus: 2}
      - {tom: "The managers weren't very nice and the job was boring and badly paid.", focus: 2}
      - {tom: "It was very hot in there, too. Terrible!", focus: 2}
      - {emma: "His worst job was a cook in a fast food restaurant. Boring, badly paid, and hot!", focus: 2, mark: ["a cook in a fast food restaurant"], vi: "Việc tệ nhất: đầu bếp ở tiệm đồ ăn nhanh — chán, lương thấp, lại nóng."}
      - {tom: "Not for me. After university, I was a marketing assistant for four years.", focus: 3}
      - {tom: "It was okay but it wasn't very interesting.", focus: 3}
      - {tom: "Then I was an office manager. That was good, but it was always the same.", focus: 3}
      - {tom: "I think change is good for you.", focus: 3}
      - {emma: "A job for life means one job for all your life. Rob doesn't want that. He thinks change is good.", focus: 3, mark: ["change is good for you"], vi: "A job for life = làm một nghề cả đời. Rob không thích vậy; anh ấy nghĩ thay đổi là tốt."}

