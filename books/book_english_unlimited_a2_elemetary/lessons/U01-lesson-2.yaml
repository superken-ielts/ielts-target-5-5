  - kind: passage
    chapter: "Đọc: Life's work"
    heading: "Reading 2 · Life's work"
    heading_vi: "Rob kể về công việc đầu tiên, tốt nhất, tệ nhất — nghe Tom đọc và đọc theo"
    items:
      - {label: "First job?", text: "When I was fifteen, I was a shop assistant in a bakery at the weekend. I was at work by 6.00 am every Saturday and Sunday. That was really difficult. I'm not an early morning person!", note: "first job"}
      - {label: "Best job?", text: "My job now. I'm a journalist. It's well paid and it's different every day. I'm often on planes or trains and in hotels and offices around the world and I meet lots of interesting people. It's a great job, really.", note: "best job"}
      - {label: "Worst job?", text: "When I was eighteen, I was a cook in a fast food restaurant for a few months. The managers weren't very nice and the job was boring and badly paid. It was very hot in there, too. Terrible!", note: "worst job"}
      - {label: "A job for life?", text: "Not for me. After university, I was a marketing assistant for four years. It was okay but it wasn't very interesting. Then I was an office manager. That was good, but it was always the same. I think change is good for you.", note: "a job for life?"}
    lines:
