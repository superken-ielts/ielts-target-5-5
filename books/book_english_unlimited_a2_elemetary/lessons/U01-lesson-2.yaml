  - kind: compare
    chapter: "was / were"
    heading: "Grammar · be past: was, were"
    heading_vi: "Quá khứ của be: I / he / she / it → was; you / we / they → were"
    items:
      - {title: "Positive", title_vi: "Khẳng định", lines: ["I was fifteen.", "He was an office manager.", "You were in the office.", "We were at the party."]}
      - {title: "Negative", title_vi: "Phủ định", lines: ["I wasn't there.", "She wasn't at the party.", "They weren't in the office.", "wasn't = was not · weren't = were not"]}
      - {title: "Questions", title_vi: "Câu hỏi, trả lời ngắn", lines: ["Was it interesting?", "Yes, it was. · No, it wasn't.", "Were they at the party?", "Yes, they were. · No, they weren't."]}
    lines:
      - emma: "Now the grammar. Was and were are the past of am, is and are."
        vi: "Ngữ pháp: was và were là quá khứ của am, is, are."
      - {emma: "I was, he was, she was, it was. You were, we were, they were.", focus: 0, vi: "I / he / she / it + was; you / we / they + were."}
      - {emma: "Negative: wasn't and weren't.", focus: 1}
      - {emma: "Questions: put was or were first. Was it interesting? Yes, it was.", focus: 2}

