  - kind: compare
    chapter: "Quy tắc: thêm s"
    heading: "Grammar 4 · he, she, it + s"
    heading_vi: "Sau he, she, it (và một người, một vật) động từ thêm s; have → has"
    items:
      - {title: "I, you, we, they", title_vi: "tôi, bạn, chúng tôi, họ", lines: ["I speak English.", "We live near the centre.", "We have a nice living room.", "Friends often stay with me."]}
      - {title: "he, she, it", title_vi: "anh ấy, cô ấy, nó", lines: ["Erkan speaks English, too.", "My mother lives in the same street.", "It has lots of nice cafés.", "He stays with me."]}
    lines:
      - emma: "After I, you, we and they, the verb doesn't change: I speak, we live, they stay."
        focus: 0
        vi: "Sau I, you, we, they: động từ giữ nguyên."
      - emma: "After he, she and it, add s: he speaks, she lives, it stays. And have becomes has."
        focus: 1
        vi: "Sau he, she, it: thêm s. have đổi thành has."
      - tom: "So my mother lives, not my mother live?"
        say: "So my mother livz, not my mother liv?"
        focus: 1
        vi: "Vậy là my mother lives chứ không phải my mother live?"
      - emma: "Yes. My mother is she, so lives. Listen to the s: speaks has an s sound. Lives, has and stays have a z sound."
        say: "Yes. My mother is she, so livz. Listen to the s: speaks has an s sound. Livz, has and stays have a z sound."
        focus: 1
        vi: "Đúng, my mother = she nên dùng lives. Đuôi s đọc /s/ trong speaks, đọc /z/ trong lives, has, stays."

