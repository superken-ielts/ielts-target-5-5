      - {k: b, text: "Sorry, how much?"}
      - {k: c, text: "Sorry, when?"}
      - {k: d, text: "Sorry, where?"}
      - {k: e, text: "Sorry, who?"}
    lines:
      - emma: "Exercise 4. Match the sentences with the questions."
        say: "Exercise four. Match the sentences with the questions."
        vi: "Bài 4: nối câu với câu hỏi lại phù hợp."
      - {tom: "Agata's on the phone.", focus: 0}
      - {mai: "Sorry, who?", reveal: 1, vi: "Xin lỗi, ai cơ?"}
      - {tom: "The bus is at 10.53.", say: "The bus is at ten fifty-three.", focus: 1}
      - {mai: "Sorry, what time?", reveal: 2, vi: "Xin lỗi, mấy giờ?"}
      - {tom: "Kevin's in Uppsala.", say: "Kevin's in Oop-sah-lah.", focus: 2}
      - {mai: "Sorry, where?", reveal: 3, vi: "Xin lỗi, ở đâu?"}
      - {tom: "Your appointment's on Friday, March 17.", say: "Your appointment's on Friday, March the seventeenth.", focus: 3}
      - {mai: "Sorry, when?", reveal: 4, vi: "Xin lỗi, khi nào?"}
      - {tom: "That's $45.23, please.", say: "That's forty-five dollars twenty-three, please.", focus: 4}
      - {mai: "Sorry, how much?", reveal: 5, vi: "Xin lỗi, bao nhiêu tiền?"}

  - kind: qa
    chapter: "Đến lượt bạn"
    heading: "Exercise 6 · Check the information"
    heading_vi: "Tom nói một câu — bạn tạm dừng video và hỏi lại; rồi nghe Mai"
    items:
      - {q: "My favourite restaurant is Lemongrass.", a: "Sorry, which restaurant?", ask: tom, by: mai}
      - {q: "My new shoes were $45.95.", a: "Sorry, how much?", ask: tom, by: mai}
      - {q: "My sister is in Melbourne now.", a: "Sorry, where?", ask: tom, by: mai}
      - {q: "The film is at 7.30.", a: "Sorry, what time?", ask: tom, by: mai}
    lines:
      - emma: "Your turn. Tom says a sentence. Pause the video and check the information. Then listen to Mai."
        vi: "Đến lượt bạn: Tom nói, bạn tạm dừng và hỏi lại để kiểm tra; rồi nghe Mai."
      - {tom: "My favourite restaurant is Lemongrass.", focus: 0, pause: 1.5}
      - {mai: "Sorry, which restaurant?", reveal: 0}
      - {tom: "My new shoes were $45.95.", say: "My new shoes were forty-five dollars ninety-five.", focus: 1, pause: 1.5}
      - {mai: "Sorry, how much?", reveal: 1}
      - {tom: "My sister is in Melbourne now.", focus: 2, pause: 1.5}
      - {mai: "Sorry, where?", reveal: 2}
      - {tom: "The film is at 7.30.", say: "The film is at seven thirty.", focus: 3, pause: 1.5}
      - {mai: "Sorry, what time?", reveal: 3}
      - emma: "Great. Now write five sentences with a name, a place or a number. Say them to a friend, and your friend checks them."
        vi: "Viết năm câu có tên, nơi chốn hoặc con số; đọc cho một người bạn nghe, bạn ấy hỏi lại để kiểm tra."

  - kind: bullets
    chapter: "Ghi nhớ"
    heading: "Remember"
    heading_vi: "Ghi nhớ"
    items:
      - {en: "OK = yes, you can · no problem · I understand · all right", vi: "Bốn nghĩa của OK"}
      - {en: "bow · shake hands · say hello · kiss · hug · exchange cards", vi: "Chào hỏi — they usually …"}
      - {en: "Sorry, can you say that again? · What's your name again?", vi: "Nhờ nói lại"}
      - {en: "Sorry, which hotel? · Sorry, what time? · Is that …?", vi: "Hỏi lại để kiểm tra thông tin"}
    lines:
      - {emma: "Let's remember. OK has four meanings: yes, you can. No problem. I understand. And all right.", focus: 0}
      - {emma: "Greetings: bow, shake hands, say hello, kiss, hug and exchange cards.", focus: 1}
      - {emma: "To ask people to repeat: Sorry, can you say that again?", focus: 2}
      - {emma: "And to check: Sorry, which hotel? Sorry, what time? See you in the next video!", focus: 3, vi: "Hẹn gặp lại ở video sau!"}
