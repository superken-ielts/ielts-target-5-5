        say: "Exercise three. When you don't hear a name or a number, ask: Sorry, which, and then the word."
        vi: "Bài 3: không nghe rõ tên hay số thì hỏi: Sorry, which + danh từ?"
      - {tom: "I'm at the Ellersley House Hotel.", focus: 0}
      - {mai: "Sorry, which hotel?", reveal: 1}
      - {tom: "OK, page one hundred and three, please.", focus: 1}
      - {mai: "Sorry, which page?", reveal: 2}
      - {tom: "He's on the 9.47 train.", say: "He's on the nine forty-seven train.", focus: 2}
      - {mai: "Sorry, which train?", reveal: 3}
      - {tom: "Look at exercise 3b.", say: "Look at exercise three bee.", focus: 3}
      - {mai: "Sorry, which exercise?", reveal: 4}
      - {tom: "We're in room 382.", say: "We're in room three eight two.", focus: 4}
      - {mai: "Sorry, which room?", reveal: 5}

  - kind: pairs
    chapter: "Bài 4: who, where, when …"
    heading: "Exercise 4 · Match 1–5 with a–e"
    heading_vi: "Hỏi lại đúng loại thông tin: ai, ở đâu, khi nào, mấy giờ, bao nhiêu tiền"
    items:
      - {n: 1, q: "Agata's on the phone.", answer: e}
