# Unit 1 · People in your life — bài 1.1 "Nice to meet you" (Coursebook tr. 10–11), phiên U01-lesson-1.
# Dựng: cd agents && python -m lesson_video build ../books/book_english_unlimited_a2_elemetary/lessons/U01-lesson-1.yaml
# Nguồn: trang 10–11; đáp án theo Teacher's Book tr. 24–25 (1b: teacher, colleague, mother / father; 3: Isobel's,
# Maria Teresa's, Isobel's; 5a: this is, what's your name again, please call me, Are you, I'm; be: 'm, 're, 's …).
# Audio gốc: 1.7 (hai cuộc hội thoại ở tiệc), 1.8 (từng từ — dùng làm mẫu phát âm từ vựng), 1.9 (James, Maite, Isobel),
# 1.10 (câu khẳng định / phủ định với be), 1.11 (câu hỏi Are / Is). Mốc theo work/transcripts (mốc từng từ).
# Phần phát âm âm tiết (bài 2) gộp vào phần từ vựng: nghe từng từ của 1.8 và nói rõ từ một hay hai âm tiết.
