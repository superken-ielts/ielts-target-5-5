  - kind: vocab
    chapter: "Email và trang web"
    heading: "Exercise 4 · Email and website addresses"
    heading_vi: "Cách đọc các ký hiệu"
    items:
      - {w: "@", pos: "at", vi: "a còng — đọc là 'at'", ex: "ak97@kmail.com"}
      - {w: ".", pos: "dot", vi: "dấu chấm — đọc là 'dot'", ex: "www.bbc.co.uk"}
      - {w: "www", pos: "double-u double-u double-u", vi: "đọc ba lần 'double-u'", ex: "www.cambridge.org"}
      - {w: "/", pos: "slash", vi: "dấu gạch chéo — đọc là 'slash'", ex: "www.bbc.co.uk/news"}
    lines:
      - emma: "Exercise 4 is about email and website addresses. First, the symbols."
        say: "Exercise four is about email and website addresses. First, the symbols."
        vi: "Bài 4: email và địa chỉ trang web. Trước tiên là các ký hiệu."
      - {emma: "This symbol is at.", focus: 0, vi: "@ đọc là 'at'."}
      - {emma: "This little point is dot.", focus: 1, vi: "Dấu chấm đọc là 'dot'."}
      - {emma: "www is double-u, double-u, double-u.", say: "double-you, double-you, double-you, is double-you, double-you, double-you.", focus: 2, vi: "www đọc là 'double-u double-u double-u'."}
      - {emma: "And this line is slash.", focus: 3, vi: "Dấu / đọc là 'slash'."}

