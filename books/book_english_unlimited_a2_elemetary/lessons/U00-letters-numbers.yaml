# Intro · About you — video 2/3: chữ cái, số, địa chỉ, email (Coursebook tr. 8, "What's your email address?"), phiên U00-intro-1.
# Dựng: cd agents && python -m lesson_video build ../books/book_english_unlimited_a2_elemetary/lessons/U00-letters-numbers.yaml
# Nguồn: đề bài trang 8; đáp án 1a (phiếu đăng ký) và 4b theo Teacher's Book tr. 21–22. Audio gốc: 1.3 (Agata gọi điện,
# phát từng đoạn theo ô cần điền), 1.4 (địa chỉ, mã bưu chính, số điện thoại), 1.5 (email, trang web). Mốc từ bản chép
# lời có mốc từng từ (docs/agent-hoc-tap/08 mục 6). Giọng Mỹ đọc Z là "zee", tiếng Anh-Anh là "zed": nói rõ trong video.
id: U00-letters-numbers
activity: U00-intro-1
title: "Intro · About you"
subtitle: "Listening · Letters, numbers and addresses"
title_vi: "Chữ cái, số điện thoại, địa chỉ, email — nghe và điền phiếu (trang 8, audio 1.3–1.5)"
tag: "EU A2 · INTRO"
speakers:
  emma: {name: Emma, role: teacher, color: "#C8102E", voice: {kokoro: af_heart, flite: slt}}
  tom: {name: Tom, role: student, color: "#1F5FAD", voice: {kokoro: am_michael, flite: rms}}
  mai: {name: Mai, role: learner from Vietnam, color: "#2E7D32", voice: {kokoro: af_bella, flite: slt}}

scenes:
  - kind: title
    chapter: "Giới thiệu"
    lines:
      - emma: "Welcome back to the Intro unit. This is page 8: What's your email address?"
        say: "Welcome back to the Intro unit. This is page eight: What's your email address?"
        vi: "Chào mừng trở lại phần Intro. Đây là trang 8: What's your email address? (Email của bạn là gì?)"
      - emma: "Today we listen to a phone call, and we practise letters, numbers, addresses and email addresses."
        vi: "Hôm nay: nghe một cuộc gọi, luyện chữ cái, số, địa chỉ và email."
      - tom: "Great. I always forget how to say phone numbers in English!"
        vi: "Hay quá. Mình hay quên cách đọc số điện thoại bằng tiếng Anh!"

  - kind: blanks
    chapter: "Nghe 1.3: điền phiếu"
    heading: "Exercise 1a · Listen to Agata's phone call. Complete the form."
    heading_vi: "Audio 1.3 — Agata gọi đăng ký lớp yoga; nghe từng đoạn và điền phiếu"
    items:
      - {n: 1, q: "First name: ___", answer: "Agata"}
      - {n: 2, q: "Surname: ___", answer: "Karolak", tip: "surname = họ (tên gia đình), đánh vần K-A-R-O-L-A-K"}
      - {n: 3, q: "Address: ___ Bentley Road, Manchester", answer: "152", tip: "152 = a hundred and fifty-two"}
      - {n: 4, q: "Postcode: ___", answer: "M20 6RU", tip: "postcode = mã bưu chính: M twenty, six R U"}
      - {n: 5, q: "Telephone (home): ___", answer: "0161 228 3434", tip: "oh one six one, double two eight, three four three four"}
      - {n: 6, q: "Email: ___@kmail.com", answer: "ak97", tip: "ak97@kmail.com = A K ninety-seven at kmail dot com"}
      - {n: 7, q: "Language(s): English, Polish, ___", answer: "German"}
    lines:
      - emma: "Look at the pictures on page 8. Agata wants to join a yoga course. She phones a college."
        say: "Look at the pictures on page eight. Agata wants to join a yoga course. She phones a college."
        vi: "Xem tranh trang 8. Agata muốn học một lớp yoga. Cô ấy gọi điện cho một trường cao đẳng."
      - emma: "Listen to each part of the call, and complete the form."
        vi: "Nghe từng đoạn cuộc gọi và điền vào phiếu."
      - {track: "1.3", start: 3.2, end: 20.3, note: "1.3 · part 1", focus: 0}
      - tom: "Her first name is Agata. That's the example."
        reveal: 1
        vi: "Tên của cô ấy là Agata. Đây là câu mẫu."
      - {track: "1.3", start: 20.4, end: 36.1, note: "1.3 · part 2", focus: 1}
      - tom: "Her surname is Karolak. K, A, R, O, L, A, K."
        say: "Her surname is Karolak. Kay, eigh, ar, oh, el, eigh, kay."
        reveal: 2
        vi: "Họ của cô ấy là Karolak: K-A-R-O-L-A-K."
      - emma: "Your surname is your family name. Your first name is your own name."
        vi: "Surname là họ (tên gia đình); first name là tên riêng của bạn."
      - {track: "1.3", start: 36.1, end: 48.4, note: "1.3 · part 3", focus: 2}
      - tom: "Her address is 152 Bentley Road."
        say: "Her address is a hundred and fifty-two Bentley Road."
        reveal: 3
        vi: "Địa chỉ: số 152 đường Bentley."
      - emma: "In British English, we say a hundred and fifty-two, with and."
        vi: "Tiếng Anh-Anh đọc 152 là 'a hundred AND fifty-two' — có chữ and."
      - {track: "1.3", start: 48.5, end: 59.5, note: "1.3 · part 4", focus: 3}
      - tom: "The postcode is M20 6RU."
        say: "The postcode is em twenty, six, ar, you."
        reveal: 4
        vi: "Mã bưu chính là M20 6RU."
      - {track: "1.3", start: 59.6, end: 81.7, note: "1.3 · part 5", focus: 4}
      - tom: "Her home number is 0161 228 3434."
        say: "Her home number is oh one six one, double two eight, three four three four."
        reveal: 5
        vi: "Số điện thoại nhà: 0161 228 3434."
      - emma: "Listen again: for zero, we often say oh. And for two twos, we say double two."
        vi: "Chú ý: số 0 thường đọc là 'oh'; hai số 2 liền nhau đọc là 'double two'."
      - {track: "1.3", start: 82.0, end: 101.0, note: "1.3 · part 6", focus: 5}
      - tom: "She can't remember her mobile number. But her email address is ak97 at kmail dot com."
        say: "She can't remember her mobile number. But her email address is eigh kay ninety-seven at kay-mail dot com."
        reveal: 6
        vi: "Cô ấy không nhớ số di động, nhưng email là ak97@kmail.com."
      - {track: "1.3", start: 101.0, end: 114.9, note: "1.3 · part 7", focus: 6}
      - tom: "She's from Poland, and she speaks English, Polish and a bit of German."
        reveal: 7
        vi: "Cô ấy đến từ Ba Lan, nói tiếng Anh, tiếng Ba Lan và một chút tiếng Đức."
      - emma: "Well done. The answers are in the script on page 148 of the book, and in the Teacher's Book."
        say: "Well done. The answers are in the script on page a hundred and forty-eight of the book, and in the Teacher's Book."
        vi: "Giỏi lắm! Đáp án theo Teacher's Book (sách in lời bài nghe ở trang 148)."

  - kind: compare
    chapter: "Chữ cái"
    heading: "Exercise 2 · How do you say these letters?"
    heading_vi: "Bảng chữ cái — xếp theo âm đọc"
    items:
      - {title: "A  H  J  K", title_vi: "đọc có âm 'ây' (như day)", lines: ["A = eɪ", "H = eɪtʃ", "J = dʒeɪ", "K = keɪ"]}
      - {title: "B C D E G P T V", title_vi: "đọc có âm 'i' dài (như see)", lines: ["E = iː", "G = dʒiː", "B, C, D, P, T, V"]}
      - {title: "F L M N S X Z", title_vi: "đọc có âm 'e' (như ten)", lines: ["F = ef, L = el", "M = em, N = en", "S = es, X = eks", "Z = zed (UK), zee (US)"]}
      - {title: "I Y · O · Q U W · R", title_vi: "các chữ còn lại", lines: ["I = aɪ, Y = waɪ", "O = oʊ", "Q = kjuː, U = juː", "W = double-u", "R = ɑːr"]}
    lines:
      - emma: "Now, the alphabet. Some letters are difficult. Let's group them by sound."
        vi: "Giờ đến bảng chữ cái. Vài chữ khó đọc — ta xếp nhóm theo âm."
      - emma: "A, H, J, K. They all have the same sound as day."
        say: "eigh. aitch. jay. kay. They all have the same sound as day."
        focus: 0
        vi: "A, H, J, K có âm 'ây' như trong day. H đọc là 'ếch' — không phải 'hát'."
      - emma: "B, C, D, E, G, P, T, V. They have a long ee sound, like in see."
        say: "bee. see. dee. ee. gee. pee. tee. vee. They have a long ee sound, like in see."
        focus: 1
        vi: "B, C, D, E, G, P, T, V có âm 'i' dài như see. E đọc là 'i', G đọc là 'gi'."
      - tom: "So E is ee, and G is gee. And J is jay."
        say: "So E is ee, and G is gee. And J is jay."
        focus: 1
        vi: "Vậy E đọc 'i', G đọc 'gi', còn J đọc 'giây'."
      - emma: "F, L, M, N, S, X, Z. They start with the same sound as ten."
        say: "ef. el. em. en. ess. ex. zee. They start with the same sound as ten."
        focus: 2
        vi: "F, L, M, N, S, X, Z bắt đầu bằng âm 'e' ngắn như ten."
      - emma: "In British English, Z is zed. In American English, Z is zee."
        say: "In British English, Z is zed. In American English, Z is zee."
        focus: 2
        vi: "Tiếng Anh-Anh đọc Z là 'zed', tiếng Anh-Mỹ đọc là 'zi'."
      - emma: "And the others: I, Y, O, Q, U, W, R."
        say: "And the others: eye. why. oh. cue. you. double-you. ar."
        focus: 3
        vi: "Các chữ còn lại: I đọc 'ai', Y đọc 'quai', O, Q, U, W đọc 'đắp-bồ-diu', R đọc 'a'."
      - tom: "I and E are difficult for me. I is eye, and E is ee."
        say: "eye and ee are difficult for me. eye is eye, and ee is ee."
        focus: 3
        vi: "I và E dễ nhầm: I đọc 'ai', E đọc 'i'."

  - kind: shadow
    chapter: "Đánh vần tên"
    heading: "Spell your name"
    heading_vi: "Hỏi và đánh vần tên — nghe rồi nói theo"
    items:
      - {text: "What's your surname?", by: tom, vi: "Họ của bạn là gì?"}
      - {text: "It's Nguyen.", by: mai, vi: "Là Nguyễn."}
      - {text: "How do you spell that?", by: tom, vi: "Đánh vần thế nào?"}
      - {text: "N - G - U - Y - E - N.", by: mai, vi: "N - G - U - Y - E - N", tip: "đọc từng chữ: en, gee, you, why, ee, en"}
    lines:
      - emma: "Now let's spell a Vietnamese name. Listen to Tom and Mai, and say it with them."
        vi: "Giờ đánh vần một cái tên Việt Nam. Nghe Tom và Mai rồi nói theo."
      - {tom: "What's your surname?", focus: 0}
      - {mai: "It's Nguyen.", say: "It's Win.", focus: 1}
      - {tom: "How do you spell that?", focus: 2}
      - {mai: "N, G, U, Y, E, N.", say: "en. gee. you. why. ee. en.", focus: 3}
      - emma: "Now spell your own name. Pause the video and say it out loud."
        vi: "Giờ đánh vần tên của bạn. Tạm dừng video và đọc to."

