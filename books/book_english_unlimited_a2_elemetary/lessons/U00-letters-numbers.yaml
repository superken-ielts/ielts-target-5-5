      - {n: 4, q: "sport.indiatimes.com → ___", answer: "India", tip: "sport dot indiatimes dot com"}
      - {n: 5, q: "www.cambridge.org → ___", answer: "England (Britain)", tip: "double-u double-u double-u dot cambridge dot org"}
    lines:
