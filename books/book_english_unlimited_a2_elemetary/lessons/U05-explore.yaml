# Unit 5 · Your space — Explore (Coursebook tr. 47–48): Keyword on, Across cultures (personal space), Explore Speaking
# (tỏ ra quan tâm khi trò chuyện). Phiên U05-explore.
# Dựng: cd agents && python -m lesson_video build ../books/book_english_unlimited_a2_elemetary/lessons/U05-explore.yaml
# Nguồn: trang 47–48 (tám câu Keyword, bài báo về khoảng cách cá nhân, câu hỏi bài 1–4 chép nguyên văn); đáp án theo
# Teacher's Book tr. 55–56 (Keyword 1: places — on the shelf, on the left, on a sofa · days, dates — on January 1st,
# on Friday · transport — on planes or trains · media and communication — on TV, on Sofasurfing.com; 2a: 2 on the internet
# 3 on TV 4 on the radio 5 on a plane 6 on Mondays; Across cultures 1: 1 about a metre 2 50–90 cm 3 less than 50 cm
# 4 30 cm or less; 2: feel uncomfortable / feel comfortable, too far away / too close, crowded / empty; Explore Speaking 1b:
# 1 in her bedroom 2 she didn't think it was dangerous 3 a couple of years 4 a friend; 2b: the bedroom ceiling fell down;
# 3: 1 OK, Right, Yeah 2 Really? Oh no! 3 That's great, That's wonderful 4 That's terrible, That's awful; 4a: gợi ý).
# Audio gốc: 2.8 (phần đầu câu chuyện), 2.9 (phần sau, bỏ đoạn đầu lặp lại 2.8), 2.10 (các câu tỏ ra quan tâm). Bản ghi
# 2.10 đọc "Oh no!" trong nhóm 4 (chuyện không vui), Teacher's Book xếp vào nhóm 2 (ngạc nhiên): video hiện cả hai.
# Đợt 32: đáp án hiện tất cả một lần SAU khi đọc / nghe xong (câu hỏi Across cultures hiện trước bài báo, đáp án sau bài báo,
# như U05-target); cuối video là 7 từ A2 của bài theo bảng từ English Profile của sách (ceiling, close, crowded, Oh no!, on,
# Really?, yeah). "close" trong bảng từ là động từ (đóng cửa) nên đọc `say: cloze`; các câu có close tính từ (đứng gần)
# để nguyên, phonemes báo ⚠ nhưng đọc đúng /kloʊs/.
# Đợt 33 — người học: video dưới 10 phút mà chưa đủ bài trong sách thì làm dài hơn. Thêm Keyword 2b (bốn câu hỏi mới với
# on), Across cultures 3 (thảo luận), Explore Speaking 1a (ảnh ngôi nhà), 2c (đọc lời thoại tr. 48, khung đỏ ở các câu tô
# xanh của Mike), 5a–b (câu chuyện mẫu của Mai, Tom tỏ ra quan tâm; đến lượt bạn). Across cultures 4 (câu đố tr. 124)
# không làm được: bản quét không có trang 124.
# Hình trong sách: tám câu và bảng Keyword on (khung đỏ theo câu), tranh khoảng cách cá nhân, bài báo Personal space (khung
# đỏ theo câu), ảnh ngôi nhà ở Barcelona và vết nứt trên trần, câu hỏi bài 3, đoạn hội thoại bài 4a.
