      - {emma: "For example, colleagues having a conversation in East Asia can feel uncomfortable if someone stands closer than about a metre.", focus: 1}
      - {emma: "However, in North America and northern Europe, most people feel that a metre is too far away: a distance of 50 to 90 cm is normal.", say: "However, in North America and northern Europe, most people feel that a metre is too far away: a distance of fifty to ninety centimetres is normal.", focus: 2}
      - {emma: "In the south of Europe and South America, people often prefer to stand closer than this.", focus: 3}
      - {emma: "In Arab countries, personal distance can be 30 cm or less.", say: "In Arab countries, personal distance can be thirty centimetres or less.", focus: 4}
      - {emma: "Of course, people sometimes need to stand very close together, for example on crowded trains and buses.", focus: 5}
      - {emma: "When this happens, some people listen to music or read a newspaper to make a different kind of personal space.", focus: 6}

