      - {emma: "In Arab countries, personal distance can be 30 cm or less.", say: "In Arab countries, personal distance can be thirty centimetres or less.", focus: 4}
      - {emma: "Of course, people sometimes need to stand very close together, for example on crowded trains and buses.", focus: 5}
      - {emma: "When this happens, some people listen to music or read a newspaper to make a different kind of personal space.", focus: 6}

