scenes:
  - kind: title
    chapter: "Giới thiệu"
    lines:
      - emma: "Welcome to Unit 4: Changes. In this lesson, we read about three small things that changed the world. And we learn to talk about the past."
        say: "Welcome to Unit four: Changes. In this lesson, we read about three small things that changed the world. And we learn to talk about the past."
        vi: "Unit 4: Changes (Thay đổi). Bài này đọc về ba vật nhỏ đã thay đổi thế giới và học cách nói về quá khứ."
      - mai: "Three small things? Let me guess. A mobile phone?"
        vi: "Ba vật nhỏ à? Để mình đoán: điện thoại di động?"
      - tom: "And a laptop! I use mine every day."
        vi: "Và laptop! Ngày nào mình cũng dùng."

  - kind: bullets
    chapter: "Nói: điện thoại, laptop, máy nghe nhạc"
    heading: "Reading 1 · Talk about the questions"
    heading_vi: "Ảnh trong sách tr. 34 — máy nghe nhạc, điện thoại, laptop ngày nay"
    image: {pdf: course-book, page: 35, clip: [0, 192, 150, 506]}
    items:
      - {en: "Do you have a mobile? What do you use it for?", vi: "Bạn có điện thoại di động không? Dùng để làm gì?", box: [44, 270, 136, 410]}
      - {en: "Do you use a laptop? How big is it?", vi: "Bạn có dùng laptop không? Nó to cỡ nào?", box: [0, 400, 150, 506]}
      - {en: "Do you have a personal music player? Where do you use it?", vi: "Bạn có máy nghe nhạc cá nhân không? Dùng ở đâu?", box: [16, 196, 108, 268]}
    lines:
      - emma: "Look at the pictures: a mobile, a laptop, and a personal music player. Do you have a mobile? What do you use it for?"
        focus: 0
        vi: "Nhìn ảnh: điện thoại, laptop, máy nghe nhạc. Bạn có điện thoại không? Dùng để làm gì?"
      - mai: "Yes, I do. I use it for calls, text messages and photos. And for my dictionary!"
        focus: 0
        vi: "Có. Mình dùng để gọi điện, nhắn tin, chụp ảnh. Và tra từ điển nữa!"
      - {emma: "Do you use a laptop? How big is it?", focus: 1, vi: "Bạn có dùng laptop không? Nó to cỡ nào?"}
      - tom: "Yes, I use a laptop for my homework. It's quite small and light."
        focus: 1
        vi: "Có, mình dùng laptop làm bài tập. Nó khá nhỏ và nhẹ."
      - {emma: "Do you have a personal music player? Where do you use it?", focus: 2, vi: "Bạn có máy nghe nhạc cá nhân không? Dùng ở đâu?"}
      - mai: "Not now. I listen to music on my phone, on the bus and in the kitchen."
        focus: 2
        vi: "Giờ thì không. Mình nghe nhạc bằng điện thoại, trên xe buýt và trong bếp."
      - emma: "The article shows the first mobile, laptop and music player. Were they inventions of the 1970s? Were they very expensive? Guess, then read and check."
        say: "The article shows the first mobile, laptop and music player. Were they inventions of the nineteen seventies? Were they very expensive? Guess, then read and check."
        vi: "Bài báo nói về chiếc điện thoại, laptop, máy nghe nhạc đầu tiên. Chúng ra đời thập niên 1970? Rất đắt? Đoán trước rồi đọc để kiểm tra."

  - kind: figure
    chapter: "Đọc: chiếc điện thoại đầu tiên"
    heading: "Reading 2b · The first mobile phone"
    heading_vi: "Bài báo tr. 34 — ai làm ra, năm nào, tên máy, giá bao nhiêu?"
    image: {pdf: course-book, page: 35, clip: [146, 310, 562, 432]}
    items:
      - {box: [157, 366, 217, 380], label: "inventor"}
      - {box: [157, 378, 190, 391], label: "year"}
      - {box: [385, 401, 442, 415], label: "name"}
      - {box: [298, 413, 334, 427], label: "price"}
    lines:
      - emma: "Three small things that changed the world. Tom reads the first part: the first mobile phone."
        vi: "Ba vật nhỏ đã thay đổi thế giới. Tom đọc phần đầu: chiếc điện thoại di động đầu tiên."
      - tom: "Martin Cooper, who worked for Motorola in the USA, made the first mobile phone in 1973."
        say: "Martin Cooper, who worked for Motorola in the U S A, made the first mobile phone in nineteen seventy-three."
        focus: 0
        vi: "Martin Cooper, làm cho hãng Motorola ở Mỹ, làm ra chiếc điện thoại di động đầu tiên năm 1973."
      - tom: "On April 3, he went for a walk in New York and used the new phone to call another communications company, AT&T."
        say: "On April third, he went for a walk in New York and yoozd the new phone to call another communications company, eigh tee and tee."
        vi: "Ngày 3 tháng 4, ông đi dạo ở New York và dùng chiếc điện thoại mới gọi cho một công ty viễn thông khác, AT&T."
      - {tom: "This was the first mobile phone call.", vi: "Đó là cuộc gọi di động đầu tiên."}
      - tom: "Ten years later, in 1983, people could buy the mobile in shops – the DynaTAC 8000X."
        say: "Ten years later, in nineteen eighty-three, people could buy the mobile in shops. The Dye-na-tack eight thousand ex."
        focus: 2
        vi: "Mười năm sau, năm 1983, người ta mua được điện thoại này ở cửa hàng: chiếc DynaTAC 8000X."
      - tom: "It was more than 30cm long and it cost $3,995."
        say: "It was more than thirty centimetres long and it cost three thousand, nine hundred and ninety-five dollars."
        focus: 3
        vi: "Nó dài hơn 30 cm và giá 3.995 đô la."
      - emma: "So, the inventor was Martin Cooper, and the year was 1973. Remember them for Exercise 3."
        say: "So, the inventor was Martin Cooper, and the year was nineteen seventy-three. Remember them for Exercise three."
        focus: 1
        vi: "Người phát minh: Martin Cooper; năm: 1973. Nhớ để làm bài 3."

  - kind: figure
    chapter: "Đọc: chiếc laptop đầu tiên"
    heading: "Reading 2b · The first laptop"
    heading_vi: "Bài báo tr. 34 — tên máy, người làm ra, năm, giá, công ty"
    image: {pdf: course-book, page: 35, clip: [146, 436, 534, 534]}
    items:
      - {box: [403, 458, 451, 472], label: "name"}
      - {box: [304, 469, 340, 483], label: "inventor"}
      - {box: [372, 469, 398, 483], label: "year"}
      - {box: [410, 469, 510, 483], label: "company"}
      - {box: [304, 494, 334, 508], label: "price"}
    lines:
      - {emma: "Mai reads the second part: the first laptop.", vi: "Mai đọc phần hai: chiếc laptop đầu tiên."}
      - {mai: "The first real laptop was the GRID Compass.", say: "The first real laptop was the Grid Compass.", focus: 0, vi: "Chiếc laptop thật sự đầu tiên là GRID Compass."}
      - mai: "A British man, William Moggridge, made it in 1979 for GRID Systems Corporation."
        say: "A British man, William Mog-rij, made it in nineteen seventy-nine for Grid Systems Corporation."
        focus: 1
        vi: "Một người Anh, William Moggridge, làm ra nó năm 1979 cho công ty GRID Systems."
      - mai: "It was 5 kg and had a 340 kilobyte memory."
        say: "It was five kilos and had a three hundred and forty kilobyte memory."
        vi: "Nó nặng 5 kg và có bộ nhớ 340 kilobyte."
      - mai: "It was very expensive, about $9,000, but the US government liked the small computer and bought a lot of them."
        say: "It was very expensive, about nine thousand dollars, but the U S government liked the small computer and bought a lot of them."
        focus: 4
        vi: "Nó rất đắt, khoảng 9.000 đô la, nhưng chính phủ Mỹ thích chiếc máy tính nhỏ này và mua rất nhiều."
      - mai: "NASA used a GRID Compass on the Space Shuttle in the early 1980s."
        say: "Nasa yoozd a Grid Compass on the Space Shuttle in the early nineteen eighties."
        vi: "NASA dùng GRID Compass trên tàu con thoi đầu thập niên 1980."
      - emma: "Five kilos! So: GRID Compass, William Moggridge, made in 1979."
        say: "Five kilos! So: Grid Compass, William Mog-rij, made in nineteen seventy-nine."
        focus: 2
        vi: "Nặng 5 kg! Ghi lại: GRID Compass, William Moggridge, năm 1979."
      - emma: "Nine thousand dollars, and the company was GRID Systems Corporation."
        say: "Nine thousand dollars, and the company was Grid Systems Corporation."
        focus: 3
        vi: "Giá 9.000 đô la; công ty GRID Systems Corporation."

  - kind: figure
    chapter: "Đọc: máy nghe nhạc đầu tiên"
    heading: "Reading 2b · The first personal music player"
    heading_vi: "Bài báo tr. 34 — tên máy, người làm ra, năm; vì sao ông ấy không bán được?"
    image: {pdf: course-book, page: 35, clip: [146, 544, 545, 642]}
    items:
      - {box: [225, 561, 284, 575], label: "inventor"}
      - {box: [317, 561, 369, 575], label: "name"}
      - {box: [366, 561, 402, 575], label: "year"}
      - {box: [146, 593, 428, 618]}
      - {box: [168, 620, 231, 634]}
    lines:
      - {emma: "And Tom reads the last part: the first personal music player.", vi: "Tom đọc phần cuối: máy nghe nhạc cá nhân đầu tiên."}
      - tom: "A German-Brazilian, Andreas Pavel, made the Stereobelt in 1972."
        say: "A German-Brazilian, Ahn-dray-as Pah-vel, made the Stereo-belt in nineteen seventy-two."
        focus: 0
        vi: "Một người Đức gốc Brazil, Andreas Pavel, làm ra Stereobelt năm 1972."
      - tom: "It had headphones and used cassettes."
        say: "It had headphones and yoozd cassettes."
        focus: 1
        vi: "Nó có tai nghe và dùng băng cát-xét."
      - {tom: "Pavel wanted people to have music everywhere they went.", say: "Pah-vel wanted people to have music everywhere they went.", vi: "Pavel muốn mọi người có nhạc nghe ở bất cứ nơi đâu."}
      - tom: "He met directors of electronics companies and they listened to the Stereobelt but said,"
        say: "He met directors of electronics companies and they listened to the Stereo-belt but said,"
        vi: "Ông gặp giám đốc các hãng điện tử; họ nghe thử Stereobelt nhưng nói:"
      - tom: "\"People don't want to wear headphones and listen to music in public.\""
        focus: 3
        vi: "\"Mọi người không muốn đeo tai nghe và nghe nhạc nơi công cộng.\""
      - tom: "So Pavel never sold his idea, but his personal music player was the first."
        say: "So Pah-vel never sold his idea, but his personal music player was the first."
        vi: "Vì vậy Pavel không bao giờ bán được ý tưởng, nhưng máy của ông là chiếc đầu tiên."
      - {tom: "Sony's Walkman was the second, and people loved it.", focus: 4, vi: "Walkman của Sony là chiếc thứ hai, và mọi người rất thích nó."}
      - emma: "A cassette is a small tape for music, before CDs. Stereobelt, Andreas Pavel, 1972."
        say: "A cassette is a small tape for music, before C Ds. Stereo-belt, Ahn-dray-as Pah-vel, nineteen seventy-two."
        focus: 2
        vi: "cassette = băng cát-xét (có trước đĩa CD). Ghi lại: Stereobelt, Andreas Pavel, 1972."
      - emma: "So, were your guesses right? All three were inventions of the 1970s. The phone and the laptop were very expensive. Pavel never sold his player, so we don't know its price."
        say: "So, were your guesses right? All three were inventions of the nineteen seventies. The phone and the laptop were very expensive. Pah-vel never sold his player, so we don't know its price."
        vi: "Cả ba ra đời thập niên 1970; điện thoại và laptop rất đắt; máy của Pavel không bán nên không biết giá."

  - kind: figure
    chapter: "Bài 3: ghi chú"
    heading: "Reading 3 · Complete the notes"
    heading_vi: "Ba tờ ghi chú tr. 34 — tạm dừng video, ghi chú từ bài báo, rồi xem đáp án trên nhãn đỏ"
    image: {pdf: course-book, page: 35, clip: [84, 672, 520, 800]}
    items:
      - {box: [96, 722, 205, 754], label: "Martin Cooper · 1973"}
      - {box: [243, 707, 368, 739], label: "GRID Compass · William Moggridge"}
      - {box: [240, 739, 368, 786], label: "1979 · $9,000 · GRID Systems Corporation"}
      - {box: [382, 728, 512, 778], label: "Stereobelt · Andreas Pavel · 1972"}
    lines:
      - emma: "Exercise 3. Read the article again and complete the notes. Pause the video and try."
        say: "Exercise three. Read the article again and complete the notes. Pause the video and try."
        vi: "Bài 3: đọc lại bài báo, ghi chú vào ba tờ giấy. Tạm dừng video và làm."
        pause: 1.5
      - tom: "The first mobile phone. Inventor: Martin Cooper. Year: 1973."
        say: "The first mobile phone. Inventor: Martin Cooper. Year: nineteen seventy-three."
        focus: 0
      - mai: "The first laptop. Name: GRID Compass. Inventor: William Moggridge."
        say: "The first laptop. Name: Grid Compass. Inventor: William Mog-rij."
        focus: 1
      - mai: "Year: 1979. Price: $9,000. Company: GRID Systems Corporation."
        say: "Year: nineteen seventy-nine. Price: nine thousand dollars. Company: Grid Systems Corporation."
        focus: 2
      - tom: "The first personal music player. Name: the Stereobelt. Inventor: Andreas Pavel. Year: 1972."
        say: "The first personal music player. Name: the Stereo-belt. Inventor: Ahn-dray-as Pah-vel. Year: nineteen seventy-two."
        focus: 3
      - emma: "Mobiles, laptops and music players are very different now. What other things are different from twenty or thirty years ago?"
        vi: "Ngày nay những thứ này đã khác hẳn. Còn thứ gì khác so với 20, 30 năm trước?"
      - mai: "Cameras! They're very small now, and they're in our phones."
        vi: "Máy ảnh! Giờ rất nhỏ, và nằm luôn trong điện thoại."

  - kind: figure
    chapter: "Số ít, số nhiều"
    heading: "Grammar · Singular and plural nouns"
    heading_vi: "Bảng trong sách tr. 34 — thêm s; y → ies; person → people"
    image: {pdf: course-book, page: 35, clip: [12, 507, 132, 621]}
    items:
      - {box: [14, 531, 130, 571], label: "+ s"}
      - {box: [14, 572, 130, 600], label: "y → ies"}
      - {box: [14, 601, 130, 619], label: "irregular"}
    lines:
      - emma: "Grammar: singular and plural nouns. Usually, we add s: thing, things. Year, years. Cassette, cassettes."
        focus: 0
        vi: "Danh từ số nhiều: thường thêm s — things, years, cassettes."
      - emma: "A word ending in a consonant and y changes to i e s: university, universities. Company, companies."
        say: "A word ending in a consonant and why changes to eye ee ess: university, universities. Company, companies."
        focus: 1
        vi: "Phụ âm + y → ies: universities, companies. Tương tự: family → families, city → cities, baby → babies."
      - emma: "And some plurals are different. One person, two people."
        focus: 2
        vi: "Một số danh từ số nhiều bất quy tắc: person → people."
      - mai: "In Vietnamese, the word doesn't change. One person, two person. I need to remember people!"
        focus: 2
        vi: "Tiếng Việt danh từ không đổi. Mình phải nhớ: two people!"

