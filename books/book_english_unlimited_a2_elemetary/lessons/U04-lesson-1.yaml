    lines:
      - {emma: "And Tom reads the last part: the first personal music player.", vi: "Tom đọc phần cuối: máy nghe nhạc cá nhân đầu tiên."}
      - tom: "A German-Brazilian, Andreas Pavel, made the Stereobelt in 1972."
        say: "A German-Brazilian, Ahn-dray-as Pah-vel, made the Stereo-belt in nineteen seventy-two."
        focus: 0
        vi: "Một người Đức gốc Brazil, Andreas Pavel, làm ra Stereobelt năm 1972."
      - tom: "It had headphones and used cassettes."
        say: "It had headphones and yoozd cassettes."
        focus: 1
        vi: "Nó có tai nghe và dùng băng cát-xét."
      - {tom: "Pavel wanted people to have music everywhere they went.", say: "Pah-vel wanted people to have music everywhere they went.", focus: 2, vi: "Pavel muốn mọi người có nhạc nghe ở bất cứ nơi đâu."}
      - tom: "He met directors of electronics companies and they listened to the Stereobelt but said,"
        say: "He met directors of electronics companies and they listened to the Stereo-belt but said,"
        focus: 3
        vi: "Ông gặp giám đốc các hãng điện tử; họ nghe thử Stereobelt nhưng nói:"
      - tom: "\"People don't want to wear headphones and listen to music in public.\""
        focus: 4
        vi: "\"Mọi người không muốn đeo tai nghe và nghe nhạc nơi công cộng.\""
      - tom: "So Pavel never sold his idea, but his personal music player was the first."
        say: "So Pah-vel never sold his idea, but his personal music player was the first."
        focus: 5
        vi: "Vì vậy Pavel không bao giờ bán được ý tưởng, nhưng máy của ông là chiếc đầu tiên."
      - {tom: "Sony's Walkman was the second, and people loved it.", focus: 6, vi: "Walkman của Sony là chiếc thứ hai, và mọi người rất thích nó."}
      - emma: "A cassette is a small tape for music, before CDs."
        say: "A cassette is a small tape for music, before C Ds."
        vi: "cassette = băng cát-xét (có trước đĩa CD)."

