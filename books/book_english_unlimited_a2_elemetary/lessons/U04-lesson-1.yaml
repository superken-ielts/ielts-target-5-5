  - kind: figure
    chapter: "Đọc: chiếc điện thoại đầu tiên"
    heading: "Reading 2b · The first mobile phone"
    heading_vi: "Bài báo tr. 34 — Tom đọc, khung đỏ theo câu"
    image: {pdf: course-book, page: 35, clip: [146, 310, 562, 432]}
    items:
