# Hình trong sách (đợt 31): ảnh máy nghe nhạc, điện thoại, laptop (tr. 34) bên trái câu hỏi; bài báo cắt thành ba dải,
# khung đỏ theo thông tin cần ghi; ba tờ ghi chú bài 3 (khung đỏ, nhãn là đáp án); bảng singular / plural; ảnh NASA và
# hai đoạn Grammar 2 (khung đỏ theo chỗ trống, nhãn là đáp án); ảnh Sang-mi bên trái câu hỏi Vocabulary 3.
