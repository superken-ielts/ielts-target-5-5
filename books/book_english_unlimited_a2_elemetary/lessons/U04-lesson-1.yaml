  - kind: compare
    chapter: "last, in, ago"
    heading: "Vocabulary 3 · Past time expressions"
    heading_vi: "last + tuần / tháng / năm; in + năm; khoảng thời gian + ago"
    items:
      - {title: "last", title_vi: "… trước (gần nhất)", lines: ["last week", "last month", "last year"]}
      - {title: "in", title_vi: "in + năm", lines: ["in 1993", "in 1998", "in 2003"]}
      - {title: "ago", title_vi: "cách đây …", lines: ["six months ago", "six or seven years ago", "about 25 years ago"]}
    lines:
      - emma: "Last week, last month, last year. No in before last: I bought a phone last year."
        focus: 0
        vi: "last week / month / year — không có in phía trước: I bought a phone last year."
      - emma: "In with a year: in 1993, in 1998, in 2003."
        say: "In with a year: in nineteen ninety-three, in nineteen ninety-eight, in two thousand and three."
        focus: 1
        vi: "in + năm."
      - emma: "And ago comes after the time: six months ago, about twenty-five years ago."
        focus: 2
        vi: "ago đứng sau khoảng thời gian: six months ago = cách đây sáu tháng."
      - tom: "In Vietnamese, we say six months before. So can I say before six months?"
        focus: 2
        vi: "Tiếng Việt nói \"sáu tháng trước\". Vậy mình nói before six months được không?"
      - emma: "No, that's a common mistake. Say six months ago. Not before six months, and not for six months ago."
        focus: 2
        vi: "Không, đó là lỗi hay gặp. Nói six months ago — không nói before six months hay for six months ago."

