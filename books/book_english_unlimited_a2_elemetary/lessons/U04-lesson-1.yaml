# tr. 45–46 (Reading 2b: cả ba là phát minh thập niên 1970 — 1973, 1979, 1972; điện thoại và laptop rất đắt — $3,995,
# $9,000; máy nghe nhạc: không biết vì Pavel không bán; 3: Martin Cooper, 1973 · GRID Compass, William Moggridge, 1979,
# $9,000, GRID Systems Corporation · Stereobelt, Andreas Pavel, 1972; Grammar 1a: 2 worked 3 liked 4 wanted 5 listened
# 6 loved 8 went 9 cost 10 had 11 bought 12 met 13 said 14 sold; 2: A 1 worked 2 cost 3 bought 4 used · B 5 made 6 went
# 7 met 8 listened 9 had 10 wanted; Vocabulary 3a: Sang-mi không giỏi công nghệ; 3b: 1 in 1998 2 six or seven years ago
# 3 about 25 years ago 4 in 1993 5 last year 6 in 2003).
