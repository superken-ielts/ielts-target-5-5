# Nguồn: trang 30; đáp án theo Teacher's Book tr. 41 (2: Rocio mời Blake tới nhà ăn tối — Blake đi được; Léon mời Roberto
# xem bóng đá Chelsea – Real Madrid — Roberto không đi được vì có hội thảo; 3a: 2 Are, 3 want, 4 like, 5 Yes, 6 sorry).
# Audio gốc 1.38: phát nguyên hai hội thoại, rồi phát lại sáu câu của bài 3a (cắt theo mốc từng từ) — bài 3b của sách
# cũng nghe lại chính 1.38. Hội thoại mẫu: Mai mời Tom đi dã ngoại bên sông Hương.
id: U03-target
activity: U03-target
title: "Unit 3 · Your time"
subtitle: "Speaking · Invite someone out"
title_vi: "Mời ai đó đi chơi — hỏi có rảnh không, mời, nhận lời hoặc từ chối lịch sự (trang 30, audio 1.38)"
