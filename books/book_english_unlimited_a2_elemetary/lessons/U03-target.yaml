        vi: "Chào mừng đến với Unit 3: Your time (Thời gian của bạn). Target activity: mời ai đó đi chơi."
      - emma: "Do you often invite people to your home? Do you invite people to go out? Where do you go?"
        vi: "Bạn có hay mời người khác đến nhà không? Có rủ đi chơi không? Đi đâu?"
      - mai: "I sometimes invite friends to cafés."
        vi: "Thỉnh thoảng mình rủ bạn bè đi cà phê."
      - tom: "And I invite my friends to football matches!"
        vi: "Còn mình rủ bạn đi xem bóng đá!"

