        say: "Oh, you went to Dah Nahng! Which beach did you go to?"
        vi: "Ồ, bạn đi Đà Nẵng à! Bạn đi bãi biển nào?"
      - emma: "Good! Read each other's emails, and ask questions to find out more."
        vi: "Đọc email của nhau và đặt câu hỏi để biết thêm."

