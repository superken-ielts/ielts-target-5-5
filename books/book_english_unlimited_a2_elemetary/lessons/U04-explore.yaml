  - kind: letter
    chapter: "Email mẫu của Mai"
    heading: "Explore Writing 5–6 · Mai's email to Tom"
    heading_vi: "Lập danh sách việc mới làm gần đây, rồi viết email kể tin tức — đây là bài của Mai"
    roles: {emma: teacher}
