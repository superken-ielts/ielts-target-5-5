      - mai: "I like working on speaking. I don't like grammar very much, but it's important."
        vi: "Mình thích luyện nói. Không thích ngữ pháp lắm, nhưng nó quan trọng."
      - emma: "Now match these self-study materials with pictures A to F. Pause the video and try."
        say: "Now match these self-study materials with pictures eigh to ef. Pause the video and try."
        vi: "Nối tài liệu tự học với tranh A–F. Tạm dừng video và làm."
        pause: 1.5
      - {tom: "One, a dictionary: that's B.", say: "One, a dictionary: that's bee.", focus: 0}
      - {tom: "Two, the English Unlimited e-Portfolio: A.", say: "Two, the English Unlimited ee-Portfolio: eigh.", focus: 1}
      - {tom: "Three, the Self-study Pack: D.", say: "Three, the Self-study Pack: dee.", focus: 2}
      - {mai: "Four, the Internet: C.", say: "Four, the Internet: see.", focus: 3}
      - {mai: "Five, books: F.", say: "Five, books: ef.", focus: 4}
      - {mai: "And six, magazines in English: E.", say: "And six, magazines in English: ee.", focus: 5}
