      - {title: "Food and drink", title_vi: "ăn uống", lines: ["lunch · a meal", "something to eat", "a sandwich", "a drink · a coffee"]}
      - {title: "Relationships", title_vi: "quan hệ", lines: ["two brothers", "a lot of friends"]}
    lines:
      - {tom: "Possessions: have a cat, have a digital camera, have a nice flat.", focus: 0}
      - {mai: "Activities: have a bath, a shower, a break, a meeting, a lesson and a conversation.", focus: 1}
      - emma: "Have a break means stop work for a short time."
        focus: 1
        vi: "have a break = nghỉ giải lao một lúc."
      - {tom: "Food and drink: have lunch, a meal, something to eat, a sandwich, a drink and a coffee.", focus: 2}
