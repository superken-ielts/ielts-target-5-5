# Unit 4 · Changes — Explore (Coursebook tr. 39–40): Keyword have, Independent learning (tự học), Explore Writing (thư /
# email kể tin tức, dấu câu). Phiên U04-explore.
# Dựng: cd agents && python -m lesson_video build ../books/book_english_unlimited_a2_elemetary/lessons/U04-explore.yaml
# Nguồn: trang 39–40 (hai email chép nguyên văn); đáp án theo Teacher's Book tr. 48–49 (Keyword 1: Possessions a cat, a
# digital camera, a nice flat · Activities a bath, a break, a shower, a meeting, a lesson, a conversation · Food and drink
# lunch, a meal, something to eat, a sandwich, a drink, a coffee · Relationships two brothers, a lot of friends;
# Independent learning 2a: 1 B 2 A 3 D 4 C 5 F 6 E; Writing 1: Thailand — went swimming, went on a boat trip, visited the
# Rose Garden · Miki moved to France, got a job in a bank · bought a new car, started French lessons; 2a: 1d 2e 3f 4a 5b
# 6c; 2c: mở đầu 1–4, kết thư 5–6; 3a: was, were, had, went, moved, got, bought, started; 3c: second / third trip …).
# Trang này không có audio. Thư mẫu: Mai viết cho Tom kể tin tức (đi Đà Nẵng với gia đình, học guitar).
# Hình trong sách (đợt 31): khung từ và bảng Keyword have (khung đỏ theo cột, nhãn là nghĩa); sáu tài liệu tự học A–F
# bên trái danh sách; hai email của Judy và Mari (khung đỏ theo phần thư: mở đầu, tin tức, câu hỏi, kết thư).
id: U04-explore
activity: U04-explore
title: "Unit 4 · Changes"
subtitle: "Explore Writing · have, an email giving news"
title_vi: "Từ khóa have (sở hữu, hoạt động, ăn uống, quan hệ); tài liệu tự học; đọc và viết email kể tin tức, dấu câu (trang 39–40)"
tag: "EU A2 · UNIT 4"
speakers:
  emma: {name: Emma, role: teacher, color: "#C8102E", voice: {kokoro: af_heart, flite: slt}}
  tom: {name: Tom, role: student, color: "#1F5FAD", voice: {kokoro: am_michael, flite: rms}}
  mai: {name: Mai, role: learner from Vietnam, color: "#2E7D32", voice: {kokoro: af_bella, flite: slt}}

scenes:
  - kind: title
    chapter: "Giới thiệu"
    lines:
      - emma: "This is Explore for Unit 4. First, the keyword have. Then some ideas for self-study. And then we read two emails, and you write an email with your news."
        say: "This is Explore for Unit four. First, the keyword have. Then some ideas for self-study. And then we read two emails, and you write an email with your news."
        vi: "Explore của Unit 4: từ khóa have, cách tự học, rồi đọc hai email và tự viết email kể tin tức."
      - mai: "Good. I have lots of news!"
        vi: "Hay quá. Mình có nhiều tin để kể lắm!"

  - kind: figure
    chapter: "Keyword: have"
    heading: "Keyword 1 · Put the words in the correct group"
    heading_vi: "Khung từ và bảng tr. 39 — have dùng cho bốn nhóm nghĩa; xếp các từ vào đúng cột"
    image: {pdf: course-book, page: 40, clip: [45, 90, 478, 198]}
    items:
      - {box: [49, 141, 152, 196], label: "sở hữu"}
      - {box: [151, 141, 253, 196], label: "hoạt động"}
      - {box: [252, 141, 363, 196], label: "ăn uống"}
      - {box: [362, 141, 474, 196], label: "quan hệ"}
    lines:
      - emma: "Keyword: have. We use have in a lot of common expressions. Look at the four groups."
        vi: "Từ khóa have: dùng trong rất nhiều cụm từ thông dụng. Nhìn bốn nhóm."
      - emma: "Possessions are things that are yours: I have a new car."
        focus: 0
        vi: "Possessions = đồ mình sở hữu: have a new car."
      - emma: "Activities are things you do: we have a party."
        focus: 1
        vi: "Activities = việc mình làm: have a party."
      - emma: "Food and drink: have dinner, have breakfast."
        focus: 2
        vi: "Food and drink = ăn uống: have dinner, have breakfast."
      - emma: "Relationships are family and friends: I have a big family."
        focus: 3
        vi: "Relationships = gia đình, bạn bè: have a big family."
      - emma: "Put the words from the box in the correct group. Pause the video and try."
        vi: "Xếp các từ trong khung vào đúng nhóm. Tạm dừng video và làm."
        pause: 1.5

