      - {en: "the English Unlimited Self-study Pack → D", vi: "sách tự học kèm đĩa", box: [434, 550, 546, 702]}
      - {en: "the Internet → C", vi: "Internet", box: [292, 620, 420, 702]}
      - {en: "books → F", vi: "sách", box: [390, 708, 560, 804]}
