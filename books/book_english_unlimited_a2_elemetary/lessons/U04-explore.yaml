    items:
      - {wrong: "we also went on a boat trip and visited the rose garden", right: "We also went on a boat trip and visited the Rose Garden."}
      - {wrong: "we had a lovely time", right: "We had a lovely time."}
      - {wrong: "we plan to visit my sister in melbourne in september", right: "We plan to visit my sister in Melbourne in September."}
