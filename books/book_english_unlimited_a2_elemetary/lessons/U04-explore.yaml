  - kind: qa
    chapter: "Nói với have"
    heading: "Keyword 2–3 · Questions with have"
    heading_vi: "Tạm dừng video và trả lời trước, rồi nghe Tom và Mai"
    items:
      - {q: "Do you have a big family?", a: "Yes, I do. I have two brothers and a lot of cousins.", ask: tom, by: mai}
      - {q: "What time do you have breakfast?", a: "At about seven. But at the weekend, I have breakfast after ten!", ask: mai, by: tom}
      - {q: "When was the last time you had a bad morning?", a: "I had a terrible morning on Monday. I missed the bus, and I was late for class.", ask: mai, by: tom}
      - {q: "When was the last time you had a nice meal in a restaurant?", a: "Last Saturday. I had dinner with my family at a seafood restaurant. It was lovely.", ask: tom, by: mai}
    lines:
      - emma: "Now talk with have. Find someone who has a big family, or has breakfast after ten in the morning. Pause after each question and answer."
        vi: "Nói với have: tìm người có gia đình đông, ăn sáng sau 10 giờ … Tạm dừng sau mỗi câu hỏi để trả lời."
      - {tom: "Do you have a big family?", focus: 0, pause: 1.5}
      - {mai: "Yes, I do. I have two brothers and a lot of cousins.", reveal: 0}
      - {mai: "What time do you have breakfast?", focus: 1, pause: 1.5}
      - {tom: "At about seven. But at the weekend, I have breakfast after ten!", reveal: 1}
      - emma: "In the past, have becomes had. When was the last time you had a bad morning?"
        vi: "Ở quá khứ, have → had."
      - {mai: "When was the last time you had a bad morning?", focus: 2, pause: 1.5}
      - {tom: "I had a terrible morning on Monday. I missed the bus, and I was late for class.", reveal: 2}
      - {tom: "When was the last time you had a nice meal in a restaurant?", focus: 3, pause: 1.5}
      - {mai: "Last Saturday. I had dinner with my family at a seafood restaurant. It was lovely.", reveal: 3}

