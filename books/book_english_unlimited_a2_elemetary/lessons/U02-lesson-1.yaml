    heading: "Listening 1a · Find these things in pictures A–D"
    heading_vi: "Tìm trong tranh A–D: sun (mặt trời), snow (tuyết), rabbits (thỏ), food (đồ ăn)"
    image: {pdf: course-book, page: 19, clip: [13.2, 226.8, 533.4, 348.6], grid: 4}
    items:
