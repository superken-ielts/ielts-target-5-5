    chapter: "Lỗi hay gặp"
    heading: "Common mistakes"
    heading_vi: "Lỗi người Việt hay mắc với a / an / some và lời nhờ"
    items:
      - {wrong: "Would you like some magazine?", right: "Would you like some magazines?", note: "some + danh từ số nhiều"}
      - {wrong: "I'd like a apple.", right: "I'd like an apple.", note: "an trước nguyên âm a, e, i, o, u"}
      - {wrong: "Can I use your rucksack? — Yes, please.", right: "Can I use your rucksack? — Yes, of course.", note: "đáp lời nhờ: Yes, of course / No problem"}
      - {wrong: "Could you to bring my coat?", right: "Could you bring my coat?", note: "can / could + động từ, không có to"}
    lines:
      - emma: "Here are some common mistakes."
        vi: "Vài lỗi hay gặp."
      - {emma: "Some magazines, with s. Some is for more than one.", focus: 0}
      - {emma: "An apple. Use an before a vowel.", say: "An apple. Yooz an before a vowel.", focus: 1}
      - {emma: "Can I use your rucksack? Yes, of course. Yes, please is for offers.", focus: 2}
      - {emma: "Could you bring. No to after could.", focus: 3}

