      - {title: "Not happy to bring", title_vi: "Không muốn mang", lines: ["boots: you can buy boots in Japan", "a winter coat: it's really heavy, and his suitcase is full"]}
    lines:
      - emma: "What's Scott happy to bring? What's he not happy to bring?"
        vi: "Scott vui vẻ mang gì, không muốn mang gì?"
      - {tom: "He's happy to bring newspapers. He offers magazines too, but Carly says no, thanks.", focus: 0, vi: "Anh ấy vui vẻ mang báo, còn mời mang thêm tạp chí nhưng Carly không cần."}
      - {tom: "He isn't happy to bring the boots, because you can buy boots in Japan.", focus: 1, vi: "Anh ấy không muốn mang giày vì ở Nhật cũng mua được."}
      - {tom: "And the winter coat is really heavy, and his suitcase is full.", focus: 1, vi: "Áo khoác thì nặng, vali lại đầy."}
      - {emma: "But in the end he says all right. He brings the coat in Carly's old rucksack.", focus: 0, vi: "Nhưng cuối cùng anh ấy đồng ý, mang áo khoác trong chiếc ba lô cũ của Carly."}

  - kind: compare
    chapter: "Mời và nhờ"
    heading: "Vocabulary 1 · Offers and requests"
    heading_vi: "Mời (offer) và nhờ / xin (request) — trả lời thế nào?"
    items:
      - {title: "Offers", title_vi: "Mời", lines: ["Would you like some magazines?", "Would you like anything from home?"]}
      - {title: "Requests", title_vi: "Nhờ, xin", lines: ["Can I / Could I use your old rucksack?", "Can you / Could you bring my winter coat?"]}
      - {title: "Answers", title_vi: "Trả lời", lines: ["offer: Yes, please. · No, thanks.", "request: OK. · All right. · Yes, of course. · No problem.", "No, sorry. · No, I'm afraid not."]}
    lines:
      - emma: "Let's look at the language. Scott makes an offer: Would you like some magazines? Listen to Carly's answer."
        focus: 0
        vi: "Scott mời: Would you like some magazines? Nghe Carly trả lời."
      - {track: "1.22", start: 16.2, end: 19.6, note: "1.22 · an offer", focus: 0}
      - emma: "Now a request: Can I use your old rucksack? Listen."
        focus: 1
        vi: "Còn đây là lời xin: Can I use your old rucksack?"
      - {track: "1.22", start: 74.4, end: 78.3, note: "1.22 · a request", focus: 1}
      - emma: "To answer an offer, say Yes, please, or No, thanks. To answer a request: OK, All right, Yes, of course, No problem. Or No, sorry, or No, I'm afraid not."
        focus: 2
        vi: "Đáp lời mời: Yes, please / No, thanks. Đáp lời nhờ: OK, All right, Yes, of course, No problem — hoặc No, sorry / No, I'm afraid not."
      - tom: "So I don't say Yes, please to a request?"
        vi: "Vậy với lời nhờ thì không nói Yes, please à?"
      - emma: "That's right. Can I use your phone? Yes, of course. Not Yes, please."
        vi: "Đúng. Can I use your phone? — Yes, of course, không phải Yes, please."

