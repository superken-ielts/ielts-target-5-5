# Unit 2 · Away from home — Bài 2.1 (Coursebook tr. 18–19): I miss my friends, Would you like …? Phiên U02-lesson-1.
# Dựng: cd agents && python -m lesson_video build ../books/book_english_unlimited_a2_elemetary/lessons/U02-lesson-1.yaml
# Nguồn: trang 18–19; đáp án theo Teacher's Book tr. 31–32 (1a: A snow, B sun, C food, D rabbits; 1b: Carly snow, Paula
# sun, Khalid food, Angharad rabbits; 3: Carly ở Nhật, Scott ở Canada; 4a: newspapers, magazines, boots, a winter coat,
# a rucksack; 4b: vui vẻ mang newspapers, (magazines), a rucksack — không muốn mang boots (mua ở Nhật được), winter coat
# (nặng, vali đầy); Vocabulary 1: offers → Yes, please / No, thanks, requests → OK, All right, No, sorry, Yes, of course,
# No problem, No, I'm afraid not; Grammar 3a: 3 a, 4 an, 5 some, 6 a, 7 a, 8 an, 9 some, 10 some).
# Audio gốc: 1.21 (bốn người, phát từng người), 1.22 (Carly và Scott, phát nguyên bài rồi phát lại hai câu), 1.23 (từng
# cụm a / an / some), 1.24 (từng từ, trọng âm). Mốc lấy từ work/transcripts/*.json.
# Ảnh: tranh A–D trang 18 (PDF trang 19), dải 4 tranh xếp thành lưới 2×2.
