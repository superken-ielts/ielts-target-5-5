      - {track: "1.22", start: 3.0, end: 80.9, note: "1.22 · Carly and Scott"}
      - {tom: "They talk about newspapers, magazines, boots, a winter coat and a rucksack.", reveal: [1, 2, 4, 5, 7], vi: "Họ nói về báo, tạp chí, giày cao cổ, áo khoác mùa đông và ba lô."}
