        vi: "Unit 2: Away from home — Xa nhà. Bài này nghe những người nhớ nhà và một cuộc gọi điện thoại."
      - emma: "Then we learn to make offers and requests, and a, an and some."
        vi: "Rồi học cách mời, cách nhờ, và a / an / some."
      - mai: "Away from home? I know that feeling!"
        vi: "Xa nhà à? Mình hiểu cảm giác đó!"

