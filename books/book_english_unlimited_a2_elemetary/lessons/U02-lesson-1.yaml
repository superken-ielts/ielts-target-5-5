        vi: "Khi xa nhà, mình rất nhớ cơm mẹ nấu, và cả mưa Huế!"
      - emma: "Now you. Say two or three things you miss."
        vi: "Đến lượt bạn: nói hai, ba điều bạn nhớ khi xa nhà."

  - kind: letter
    chapter: "Email của Scott"
