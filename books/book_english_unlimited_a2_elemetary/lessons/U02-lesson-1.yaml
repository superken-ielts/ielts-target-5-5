        say: "Look at pictures eigh to dee. Find these things: sun, snow, rabbits, food."
        vi: "Nhìn tranh A–D và tìm: mặt trời, tuyết, thỏ, đồ ăn."
      - {tom: "Picture A is snow. Picture B is the sun.", say: "Picture eigh is snow. Picture bee is the sun.", reveal: [2, 1], vi: "Tranh A là tuyết, tranh B là mặt trời."}
      - {tom: "C is food, and D is rabbits.", say: "See is food, and dee is rabbits.", reveal: [4, 3], vi: "C là đồ ăn, D là thỏ."}

  - kind: blanks
    chapter: "Nghe 1.21: ai nhớ gì?"
    heading: "Listening 1b–c · Who misses each thing?"
    heading_vi: "Đoán chữ còn thiếu (sun, snow, rabbits, food), rồi nghe 1.21 để kiểm tra"
    items:
      - {n: 1, q: "When I'm in Japan, away from home, I really miss the ___ in winter.", answer: "snow", hint: "Carly, Canada"}
      - {n: 2, q: "When I'm not at home, I really miss the ___, I miss my friends.", answer: "sun", hint: "Paula, Argentina"}
      - {n: 3, q: "I also miss the ___. Sudanese food is really nice.", answer: "food", hint: "Khalid, Sudan"}
      - {n: 4, q: "When I'm away from home, I really miss my family, my ___ and the food.", answer: "rabbits", hint: "Angharad, Switzerland"}
    lines:
      - emma: "Now read the quotes. Who misses each thing? Guess first, then listen to check."
        vi: "Đọc các câu trích: ai nhớ điều gì? Đoán trước rồi nghe để kiểm tra."
        pause: 1.5
      - {track: "1.21", start: 3.3, end: 17.9, note: "1.21 · Carly, from Canada", focus: 0, reveal: 1}
      - {track: "1.21", start: 20.0, end: 28.2, note: "1.21 · Paula, from Argentina", focus: 1, reveal: 2}
      - {track: "1.21", start: 30.2, end: 39.9, note: "1.21 · Khalid, from Sudan", focus: 2, reveal: 3}
      - {track: "1.21", start: 42.1, end: 49.3, note: "1.21 · Angharad, from Switzerland", focus: 3, reveal: 4}
      - emma: "Miss means you are sad because something is not with you. What do you miss when you're away from home, Mai?"
        vi: "miss = nhớ (vì không có bên mình). Mai, khi xa nhà bạn nhớ gì?"
      - mai: "When I'm away from home, I really miss my mum's cooking, and the rain in Hue!"
