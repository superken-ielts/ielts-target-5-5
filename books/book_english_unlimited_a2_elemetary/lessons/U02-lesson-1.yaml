  - kind: compare
    chapter: "Quy tắc a, an, some"
    heading: "Grammar 3b · a, an and some"
    heading_vi: "a / an = một; some = hai, ba, bốn …"
    items:
      - {title: "a / an = 1", title_vi: "một thứ (số ít)", lines: ["a + consonant: a cup, a sandwich, a newspaper", "an + vowel (a, e, i, o, u): an apple, an orange"]}
      - {title: "some = 2, 3, 4 …", title_vi: "nhiều thứ (số nhiều)", lines: ["some books · some magazines", "some oranges · some clothes"]}
    lines:
      - emma: "The rules. A or an means one. We use an before a vowel: a, e, i, o, u. An apple, an orange."
        say: "The rules. A or an means one. We use an before a vowel: eigh, ee, eye, oh, you. An apple, an orange."
        focus: 0
        vi: "a / an = một. Dùng an trước nguyên âm a, e, i, o, u: an apple, an orange."
      - {emma: "And a before a consonant, like b, c or d: a cup, a sandwich, a newspaper.", say: "And a before a consonant, like bee, see or dee: a cup, a sandwich, a newspaper.", focus: 0, vi: "Dùng a trước phụ âm: a cup, a sandwich, a newspaper."}
      - {emma: "Some is for two, three, four or more: some books, some oranges, some clothes.", focus: 1, vi: "some dùng cho số nhiều: some books, some oranges."}
      - mai: "In Vietnamese, the word doesn't change: one apple, two apple. In English, I must say two apples!"
        focus: 1
        vi: "Tiếng Việt không đổi hình thức số nhiều; tiếng Anh thì phải thêm s: two apples!"

