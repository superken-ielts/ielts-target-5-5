# một lần cho cả bài 2 và bài 3). Không phát 2.6 (tám câu bài 5) và không đưa Speaking 4, Pronunciation 6, role play 8
# vào video để giữ dưới 10 phút (bản đầu ước 10:58); có mấy câu ghi chú cho người trông nhà của Mai (Writing 7b).
# Đợt 32: đáp án hiện tất cả một lần SAU khi nghe / đọc xong (mỗi bài: làm trước, nghe audio không có đáp án, rồi một dòng
