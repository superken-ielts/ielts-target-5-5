# Nguồn: trang 44–45; đáp án theo Teacher's Book tr. 53–54 (Vocabulary 1: 1 a kitchen 2 a living room 3 a bathroom 4 a
# bedroom; 2a: a cooker, b plates, c a shelf, d a cupboard, e cutlery, f a drawer, g a fridge, h a toaster, i pots and pans,
# j a computer, k a plant, l a sofa, m a washing machine, n towels, o a bath, p a wardrobe, q bedclothes; Speaking 3a: bếp
# là phòng Carole thích nhất — ăn sáng, ăn tối, đọc sách, nấu cho người khác; Listening 2: 1 the kitchen 2 the bedroom
# 3 the living room 4 things near the flat; 3a: 1 a couple of yoghurts 2 in the wardrobe 3 it doesn't have internet 4 three
# or four times a week 5 no — đi bộ vào trung tâm 10 phút 6 yes, Kafé Kontakt cạnh trạm xe buýt; Grammar 4: 1 yoghurts
# 2 DVDs 3 microwave 4 shops; 5: 1 a couple of radios 2 a lot of eggs 3 a microwave 4 a lot of plates 5 a couple of towels
# 6 no 7 Are, aren't 8 Is, is).
# Audio gốc: 2.3 (17 đồ vật, phát hai phần: nhà bếp a–i, rồi j–q), 2.4 (Carole), 2.5 (Carole và Estrella: phát nguyên bài
# cho bài 2, rồi bài 3b nghe lại bốn đoạn có đáp án), 2.6 (tám câu bài 5: phát cả bài để kiểm tra trọng âm, rồi từng câu để
# luyện nói theo).
# Đợt 33 — người học: "nếu video dưới 10 phút không đủ cover bài trong sách thì tăng thêm cho đủ". Bản đợt 32 bỏ 2.6,
# Vocabulary 2c, Speaking 4, câu hỏi Listening 1, nghe lại 3b, Pronunciation 6, bài 7a, role play 8 để giữ dưới 10 phút;
# nay đủ cả. Speaking 3b (đọc lời bài nghe tr. 151) không làm được: bản quét không có trang 151. Trọng âm bài 6b: sách và
# Teacher's Book không in đáp án (lời bài nghe tr. 151) — video đánh dấu theo quy tắc của bài 6a (từ mang thông tin: danh
# từ, động từ, tính từ) và câu trả lời ngắn (Yes / No và trợ động từ cuối câu).
# Đợt 32: đáp án hiện tất cả một lần SAU khi nghe / đọc xong (mỗi bài: làm trước, nghe audio không có đáp án, rồi một dòng
# `reveal` mở hết); cuối video là 16 từ A2 của bài theo bảng từ English Profile của sách (đồ đạc, phòng, house-sitting —
# kể cả armchair, bookcase, curtain, lamp, upstairs, downstairs, dirty mà trang bài học không có).
# Hình trong sách: bốn tranh căn hộ của Carole (khung đỏ theo phòng, theo đồ vật a–q), ảnh Carole và Estrella, định nghĩa
