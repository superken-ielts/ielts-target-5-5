scenes:
  - kind: title
    chapter: "Giới thiệu"
    lines:
      - emma: "Welcome back to Unit 3. When do you celebrate New Year? Do you like it? Why, or why not?"
        say: "Welcome back to Unit three. When do you celebrate New Year? Do you like it? Why, or why not?"
        vi: "Bạn đón năm mới vào lúc nào? Bạn có thích không? Vì sao?"
      - mai: "In Vietnam, we celebrate Tết, the Lunar New Year. It's usually in January or February. I love it!"
        say: "In Vietnam, we celebrate Tet, the Lunar New Year. It's usually in January or February. I love it!"
        vi: "Ở Việt Nam, chúng mình đón Tết âm lịch, thường vào tháng 1 hoặc tháng 2. Mình rất thích!"
      - tom: "In the US, it's January the first. I don't really like it. I'm always tired!"
        vi: "Ở Mỹ là ngày 1 tháng 1. Mình không thích lắm, lúc nào cũng mệt!"

