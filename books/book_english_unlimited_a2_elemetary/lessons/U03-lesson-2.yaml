  - kind: bullets
    chapter: "Thang tần suất"
    heading: "Vocabulary 4 · How often?"
    heading_vi: "Từ 100% xuống 0% — đặt trước động từ chính: I usually go …, we always see …"
    items:
      - {en: "always — 100%", vi: "luôn luôn: We always see friends."}
      - {en: "usually", vi: "thường thường: She usually goes out with friends."}
      - {en: "often", vi: "hay, thường: My brother often comes too."}
      - {en: "sometimes", vi: "thỉnh thoảng: We sometimes go to the sea."}
      - {en: "never — 0%", vi: "không bao giờ: I never stay up late."}
    lines:
      - {emma: "Always means one hundred percent: every time.", focus: 0, vi: "always = 100%, lần nào cũng vậy."}
      - {emma: "Usually means most of the time. Often means a lot.", focus: 1, vi: "usually = phần lớn các lần; often = nhiều lần."}
      - {emma: "Sometimes means not a lot.", focus: 3, vi: "sometimes = thỉnh thoảng."}
      - {emma: "And never means zero percent: not one time.", focus: 4, vi: "never = 0%, không lần nào."}
      - {emma: "Put them before the main verb: I usually go, we always see, she never stays up late.", focus: 1, vi: "Đặt trước động từ chính."}
      - tom: "I never stay up late. I always go to bed at ten!"
        focus: 4
        vi: "Mình không bao giờ thức khuya. Lúc nào cũng đi ngủ lúc 10 giờ!"

