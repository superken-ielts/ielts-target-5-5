        focus: 0
        vi: "Một anh trai: my brother's house — thêm 's."
      - emma: "But two parents: my parents' house. Parents already ends in s, so we only add the apostrophe. They sound the same."
        focus: 1
        vi: "Hai bố mẹ: my parents' house — parents đã có s nên chỉ thêm dấu '. Đọc giống nhau."
