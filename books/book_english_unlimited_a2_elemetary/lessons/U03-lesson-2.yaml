scenes:
  - kind: title
    chapter: "Giới thiệu"
    lines:
      - emma: "Welcome back to Unit 3. Listening, exercise 1. When do you celebrate New Year? Do you like it? Why, or why not? Pause the video and think."
        say: "Welcome back to Unit three. Listening, exercise one. When do you celebrate New Year? Do you like it? Why, or why not? Pause the video and think."
        vi: "Bài 1: bạn đón năm mới vào lúc nào? Bạn có thích không? Vì sao? Tạm dừng video và nghĩ."
        pause: 1.5
      - mai: "In Vietnam, we celebrate Tết, the Lunar New Year. It's usually in January or February. I love it!"
        say: "In Vietnam, we celebrate Tet, the Lunar New Year. It's usually in January or February. I love it!"
        vi: "Ở Việt Nam, chúng mình đón Tết âm lịch, thường vào tháng 1 hoặc tháng 2. Mình rất thích!"
      - tom: "I love Tết too. But I don't really like January the first. I'm always tired the next day!"
        say: "I love Tet too. But I don't really like January the first. I'm always tired the next day!"
        vi: "Mình cũng thích Tết. Nhưng mình không thích ngày 1 tháng 1 lắm — hôm sau lúc nào cũng mệt!"
      - emma: "Remember: try each exercise first. All the answers come at the end of the exercise."
        vi: "Nhớ nhé: làm từng bài trước; đáp án hiện cùng lúc ở cuối bài."

