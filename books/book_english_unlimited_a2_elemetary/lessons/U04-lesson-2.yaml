  - kind: title
    chapter: "Giới thiệu"
    lines:
      - emma: "Welcome back to Unit 4: Changes. This is lesson 4.2: Going away. We learn words for a trip, and we listen to Sang-mi on a business trip."
        say: "Welcome back to Unit four: Changes. This is lesson four point two: Going away. We learn words for a trip, and we listen to Sahng-mee on a business trip."
        vi: "Bài 4.2: Going away (Đi xa). Học từ về đồ dùng khi đi xa và nghe Sang-mi đi công tác."
      - emma: "First, some questions. How often do you travel? Do you like flying?"
        vi: "Bạn có hay đi xa không? Bạn có thích đi máy bay không?"
      - tom: "I travel home to Da Lat two or three times a year. I usually take the bus."
        say: "I travel home to Dah Lot two or three times a year. I usually take the bus."
        vi: "Mình về Đà Lạt hai, ba lần một năm, thường đi xe buýt."
      - mai: "I don't go on business trips, but I love flying! I went to Hanoi by plane last year."
        say: "I don't go on business trips, but I love flying! I went to Ha Noi by plane last year."
        vi: "Mình không đi công tác, nhưng rất thích đi máy bay! Năm ngoái mình bay ra Hà Nội."
      - emma: "Travel is a verb. A trip and a journey are nouns. We go on a trip, or go on a journey."
        vi: "travel là động từ; trip, journey là danh từ (chuyến đi): go on a trip / a journey."

