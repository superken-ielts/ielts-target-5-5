  - kind: compare
    chapter: "Quy tắc: did, didn't"
    heading: "Grammar 2 · Past simple questions and negatives"
    heading_vi: "did / didn't + động từ nguyên mẫu — động từ chính không đổi sang quá khứ"
    items:
      - {title: "Questions", title_vi: "Câu hỏi", lines: ["What did you do last night?", "Did you have a good time?", "not: Did you had …?"]}
      - {title: "Negatives", title_vi: "Phủ định", lines: ["I didn't like the restaurant.", "I didn't understand his directions.", "not: I didn't liked …"]}
      - {title: "Short answers", title_vi: "Trả lời ngắn", lines: ["Yes, I did.", "No, I didn't.", "not: Yes, I did have."]}
    lines:
      - emma: "In past simple questions, use did plus the verb: Did you have a good time? The verb doesn't change. Never say: did you had."
        say: "In past simple questions, yooz did plus the verb: Did you have a good time? The verb doesn't change. Never say: did you had."
        focus: 0
        vi: "Câu hỏi: did + động từ nguyên mẫu. Không nói did you had."
      - emma: "In negatives, use didn't plus the verb: I didn't like the restaurant."
        say: "In negatives, yooz didn't plus the verb: I didn't like the restaurant."
        focus: 1
        vi: "Phủ định: didn't + động từ nguyên mẫu."
      - emma: "In short answers, just say did or didn't: Yes, I did. No, I didn't."
        focus: 2
        vi: "Trả lời ngắn: Yes, I did. / No, I didn't. — không lặp lại động từ chính."
      - tom: "So the past is in did. The other verb stays the same."
        vi: "Vậy thì quá khứ nằm ở did, động từ kia giữ nguyên."

