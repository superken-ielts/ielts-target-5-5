# Nguồn: trang 36–37; đáp án theo Teacher's Book tr. 46–47 (Vocabulary 2a: 1 keys 2 address book 3 toothbrush 4 passport
# 5 comb 6 mobile 7 map and directions 8 tickets 9 pen 10 sunglasses 11 money 12 driving licence; Listening 5a: Seattle,
# next Thursday; 5b: money, tickets, directions; 6a: 1 T 2 F 3 F 4 T; 6b: 1 F (hates flying) 2 T (couldn't find the
# office) 3 T (didn't understand the directions) 4 F (didn't like the restaurant) — cô ấy muốn lịch sự với Mr Donovan;
# Pronunciation 7b: A (từ mang thông tin); Grammar 1: 1c 2d 3a 4b; 2a: Did, didn't, Did, did; 3: Did you have a good
# weekend? · What did you do at the weekend? · Where did you go on Saturday? · Did you go out last night? · What time did
# you get up this morning? · Did you watch TV this morning? · What did you have for breakfast? · What time did you go to
# bed last night?).
# Audio gốc: 1.47 (12 từ: phát cả bài để kiểm tra, rồi từng từ để nói theo), 1.48 (phát hai lần: bài 5a, 5b), 1.49, 1.50
# (phát nguyên bài), 1.52 (bảng did / didn't: câu ví dụ, rồi bốn câu liền nhau). Track 1.51 (Pronunciation 7a) THIẾU trong
# bộ CD1: Emma đọc năm câu, chấm trọng âm xem trên hình trang sách.
# Đợt 34 — người học: "fix lại cho unit 3 và unit 4 luôn nhé ko bỏ bài và đáp án hiển thị ra sau nhé". Bản đợt 31 hiện nhãn
# đáp án trên tranh lúc phát 1.47 và mở đáp án các bài nghe, Grammar 1–3 từng câu. Nay: làm trước, nghe xong mới hiện tất
# cả đáp án một lần; bài 5b nghe lại 1.48 đúng như sách; Pronunciation 7b hỏi trước rồi mới nói đáp án, thêm 7c luyện nói;
# Speaking 4a thêm ba câu hỏi. Cuối video là 9 từ A2 của bài theo bảng từ English Profile của sách. Hình trong sách: tranh
# 12 đồ dùng và danh sách "Remember …", ba tranh bài nghe, năm câu có chấm trọng âm và bài 7b, ảnh Sang-mi và Mr Donovan.
# Chồng của Sang-mi tên Tom (trong bài nghe 1.50) — không phải Tom của video; Emma nói rõ.
