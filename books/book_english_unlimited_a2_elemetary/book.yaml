# Không có trong bộ dữ liệu: phần cuối Coursebook (Activities 124–130, Grammar reference and practice 131–142,
# Vocabulary reference 143–147, Scripts — lời bài nghe — 148–159), Self-study Pack, đề Achievement test (Teacher's
# DVD-ROM; app có sẵn bài nghe), đề mẫu A2 Key (tải miễn phí ở Cambridge English), 5 file của CD1.
missing: [grammar-reference, vocabulary-reference, audio-scripts, activities, self-study-pack, test-books, cd1-tracks-27-33-36-39-51]

steps:
  - &lesson-1
    id: lesson-1
    title: Bài 1 · nghe – đọc, từ vựng, ngữ pháp
    skill: listening
    note: >-
      Coursebook bài {no}.1 — {l1}. Làm lần lượt từng bài tập; bài có nhãn audio (ví dụ 1.7) thì mở track cùng tên bên
      dưới, nghe hai lần rồi mới chữa bằng Teacher's Book. Câu mẫu có biểu tượng P thì nghe và nhại theo. Chép từ mới
      kèm một câu ví dụ vào Anki.
  - &lesson-2
    id: lesson-2
    title: Bài 2 · nghe – đọc, từ vựng, ngữ pháp
    skill: reading
    note: >-
      Coursebook bài {no}.2 — {l2}. Học như bài 1: làm bài trước, nghe track theo nhãn, chữa bằng Teacher's Book; bài
      nói theo cặp (In pairs) thì tự đóng cả hai vai và ghi âm.
  - &target
    id: target
    title: Target activity · nhiệm vụ nói
    skill: speaking
    core: true
    minutes: 45
    note: >-
      Target activity: {ta}. Nghe hoặc đọc bài mẫu, gạch chân các cụm Task vocabulary; chuẩn bị 2–3 phút bằng ghi chú
      ngắn (không viết cả câu), nói 1–2 phút và ghi âm, nghe lại rồi nói lần hai tốt hơn.
  - &explore
    id: explore
    title: Explore Speaking · từ khoá và giao tiếp
    skill: speaking
    core: true
    note: >-
      Explore — {ex}. Keyword: làm bài rồi đặt ba câu của riêng bạn với từ khoá. Explore Speaking: nghe track, nhại các
      mẫu câu, rồi tự đóng vai cả hai người và ghi âm.
  - &look-again
    id: look-again
    title: Look again · ôn tập và tự đánh giá
    skill: other
    minutes: 45
    note: >-
      Look again — {la}. Làm phần Review và Extension, rồi tự chấm Self-assessment (1–5) ở cuối trang; mục nào dưới 3
      thì học lại bài tương ứng trước khi sang unit sau. Câu sai ghi vào sổ lỗi.

# Bước Explore của unit chẵn (Explore Writing); dùng trong `steps` của các unit đó.
explore-writing: &explore-writing
  <<: *explore
  title: Explore Writing · từ khoá và viết
  skill: writing
  note: >-
    Explore — {ex}. Keyword: làm bài rồi đặt ba câu của riêng bạn với từ khoá. Explore Writing: đọc bài mẫu, làm các bài
    nhỏ trong sách, rồi viết bài theo đề (khoảng 60–100 từ), tự sửa theo bài mẫu và chép lại bản sạch.

toc:
  sections:
    - id: S1
