            intro-1: {pages: [7, 8], tracks: "1.1..1.5", alt: [{pdf: teachers-book, pages: [21, 22]}]}
            intro-2: {pages: [9, 9], tracks: "1.6", alt: [{pdf: teachers-book, pages: [22, 22]}, {pdf: course-book-2, pages: [122, 122], label: "Activities tr. 122 · phiếu đăng ký (bài 8a)"}]}
