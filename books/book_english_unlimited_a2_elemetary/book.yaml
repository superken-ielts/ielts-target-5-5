      items:
        - unit: 0
          title: Intro · About you
          pages: [7, 9]
          steps:
            - id: intro-1
              title: Giới thiệu bản thân · quốc gia, ngôn ngữ, chữ cái và số
              skill: listening
              note: >-
                Coursebook Intro tr. 7–8 (ôn A1): từ vựng countries and languages, introducing yourself, letters,
                numbers and addresses; nghe Agata enrols on a course. Nghe và nhại theo từng track 1.1–1.5; tự giới
                thiệu 5–6 câu (tên, quê, nghề, ngôn ngữ, email) và ghi âm. Thấy dễ thì học nhanh, đừng bỏ phần đánh vần.
            - id: intro-2
              title: Thông tin cá nhân và can · đăng ký khoá học
              skill: speaking
              note: >-
                Coursebook Intro tr. 9: ngữ pháp subject pronouns, possessive adjectives, can (khả năng); từ vựng
                personal information. Điền phiếu đăng ký ở trang Activities tr. 122 bằng thông tin của bạn, rồi đóng vai
                hỏi – đáp để đăng ký một khoá học (track 1.6). Nói 5 việc bạn làm được và chưa làm được với can / can't.
