        - test: 4
          title: Mốc A2 Key (đề mẫu Cambridge)
          steps:
            - id: reading-writing
              title: Reading & Writing · 60 phút
              skill: reading
              minutes: 75
              note: >-
                Tải đề mẫu A2 Key (sample test, miễn phí, có đáp án và audio) ở trang chính thức của Cambridge English
                (cambridgeenglish.org, mục A2 Key → Preparation). Làm phần Reading and Writing đúng 60 phút, không tra
                từ: 5 phần đọc, rồi viết một email / lời nhắn ngắn (từ 25 từ) và một câu chuyện theo ba bức tranh (từ 35
                từ). Chấm phần đọc bằng đáp án; phần viết so với bài mẫu trong đề.
            - id: listening-test          # không đặt id `listening`: bài nghe nằm trong đề tải về, chưa có track trong app
              title: Listening · khoảng 35 phút
              skill: listening
              note: >-
                Làm phần Listening của đề mẫu (5 phần, 25 câu, mỗi bài nghe hai lần) bằng file audio đi kèm, không dừng
                băng. Chấm, rồi nghe lại những câu sai với lời bài nghe.
            - id: speaking
              title: Speaking · tự luyện hai phần
              skill: speaking
              note: >-
                Phần Speaking thi theo cặp, 8–10 phút: Part 1 trả lời câu hỏi về bản thân (tên, nơi sống, việc học,
                công việc, sở thích); Part 2 trao đổi về các bức tranh rồi nói bạn thích cái nào và vì sao. Tự trả lời
                các câu hỏi trong đề mẫu, ghi âm, so với các mẫu câu đã học ở Target activity của Unit 1–14.
            - id: decide
              title: Chấm điểm và chọn bước tiếp theo
              skill: other
              core: true
              minutes: 45
              note: >-
                Cộng điểm từng phần. Đúng khoảng 70% trở lên ở mỗi phần (mốc tham khảo; kỳ thi thật đạt A2 từ 120 điểm
                thang Cambridge English Scale) thì sang Giai đoạn 1 của lộ trình 40 tuần (file 01). Phần nào thấp hơn thì
                ôn lại các unit liên quan 1–2 tuần rồi làm đề mẫu thứ hai.
