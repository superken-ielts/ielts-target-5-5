# Hồ sơ lộ trình "Giai đoạn 0 · nền tảng A2" cho agent book_ingest — mẫu lessons-v1 (agents/book_ingest/lessons.py).
# Thư mục này có English Unlimited A2 Elementary: Coursebook (PDF quét, hai phần), Teacher's Book (PDF có chữ), ba CD
# audio, Teacher's Pack và wordlist. Cấu trúc lộ trình và chỗ trong sách của từng phiên khai hết ở đây; agent chỉ quét
# file, cắt PDF thành đoạn theo từng unit rồi dựng book.json / plan.json. Thiết kế: docs/agent-hoc-tap/08-giai-doan-0-a1-a2.md.
#
# `pages` trong `refs` là SỐ TRANG IN. Coursebook Part 1 bị quét trùng trang 49 (PDF 50 và 51 giống nhau), nên khai hai
# lần: `course-book` cho trang in 7–49 (trang PDF = trang in + 1) và `course-book-u6` cho trang in 50–65 (+ 2). Part 2
# bắt đầu từ trang in 66 (= PDF 1) và có hai trang Activities 122–123 (PDF 57–58).
#
# Track ghi theo nhãn in cạnh bài tập: CD1 "Track No07.mp3" → 1.7 (`track: "1.{n}"`); track 01 của mỗi đĩa gồm lời giới
# thiệu đĩa rồi tới bài 1.1. Track cuối mỗi đĩa (1.57, 2.57, 3.62) là phần nghe của Achievement test 1–3. "A..B" là mọi
# track từ A tới B; CD1 thiếu file 27, 33, 36, 39, 51 nên khoảng tự bỏ qua các track đó. Track nào thuộc trang nào dò
# bằng nhãn cam trên trang Coursebook (OCR) rồi đối chiếu với "play recording X.Y" trong Teacher's Book (khớp 171/171).
#
# Mỗi unit 8 trang, 5 phiên: bài X.1 (2 trang), bài X.2 (2 trang), Target activity (1 trang), Explore (2 trang), Look
# again (1 trang). Unit lẻ có Explore Speaking, unit chẵn có Explore Writing (`steps` riêng, dùng lại các bước bằng
# anchor YAML). Mỗi phiên có thêm nút mở Teacher's Book ở đúng trang ghi chú và đáp án của phần đó.

book: english-unlimited-a2
title: English Unlimited A2 Elementary
edition: cup-2011
template: lessons-v1
start_week: 1
sessions_per_week: 5
minutes_per_session: 60
pace: [4, 5, 6]

info:
  course: ielts
  role: Giai đoạn 0 · nền tảng A2
  module: Tiếng Anh tổng quát · Elementary
  author: Alex Tilbury, Theresa Clementson, Leslie Anne Hendra, David Rea
  publisher: Cambridge University Press
  level: Elementary
  cefr: A1 → A2
  summary: >-
    Giáo trình tiếng Anh tổng quát của Cambridge, xây theo khung CEFR: mỗi unit là các việc làm được bằng tiếng Anh
    (giới thiệu người quen, nhờ và mời, thuê phòng, gọi món, mua vé, khám bệnh, kể chuyến đi…) — đúng các chủ đề của
    IELTS General Training và Speaking Part 1. Intro và 14 unit, mỗi unit 5 phiên: hai bài học, Target activity (nhiệm
    vụ nói), Explore (từ khoá, văn hoá, Explore Speaking hoặc Writing) và Look again (ôn tập, tự đánh giá). Mỗi phiên
    mở đúng trang Coursebook, track audio của phần đó và trang Teacher's Book có đáp án. Sau Unit 4, 9 và 14 có một
    phiên ôn với bài nghe Achievement test; cuối chặng làm đề mẫu A2 Key để quyết định sang Giai đoạn 1.
  start_when: >-
    Trước tuần 1 của lộ trình 40 tuần, cho người học lại từ đầu hoặc dưới band 3.0 (bắt đầu từ con số 0 thì học cuốn
    A1 Starter trước). Đang ở band 3.0: làm đề mẫu A2 Key ở phiên cuối sách trước, đạt thì vào thẳng Giai đoạn 1. Tuần
    ở đây đếm riêng cho cuốn này; học xong thì đặt lại ngày bắt đầu lộ trình cho Giai đoạn 1.

